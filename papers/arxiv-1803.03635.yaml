  notes: 'Selected for the method article requested by the user (2026-10-10): knowledge distillation and pruning (soft targets and temperature, hint-based and self distillation, teacher-student gaps and
    fidelity; magnitude, gradual, single-shot, movement and LLM pruning, lottery tickets, and how pruning is evaluated). Carded by a subagent. Results tables not recorded; claims only. Affiliation: MIT
    CSAIL. Venue: PDF header ''Published as a conference paper at ICLR 2019'' and arXiv journal_ref ''ICLR 2019''; year is the first arXiv version (2018). Section numbers are from numbered headings in the
    PDF (1 Introduction, 2 fully-connected, 3 convolutional, 4 VGG and Resnet, 5 Discussion, 6 Limitations, 7 Related work). Pruning heuristic: layer-wise removal of the lowest-magnitude weights (as in
    Han et al., 2015), output connections pruned at half the rate (Section 2); Resnet-18 and VGG-19 are pruned globally across all convolutional layers (Section 4). Per-architecture pruning rates, optimizers
    and iterations are in Figure 2. The ''lottery ticket conjecture'' (SGD seeks out and trains a subset of well-initialized weights) is explicitly described as untested. The paper refers to the CIFAR10
    residual network as ''Resnet-18''; the later arxiv-1912.05671 (same first and last author) states this was a mistaken name for ResNet-20. Accuracy/early-stopping results are figures (some percentages
    are in body text) and are not recorded as results. The authors are the originators of the hypothesis evaluated here; follow-up work by the same first author: arxiv-1912.05671, arxiv-2003.03033. Section
    3 adds that for Conv-2 and Conv-4 the test accuracy of randomly reinitialized networks at early stopping initially remains steady or improves, which the authors read as structure alone possibly helping
    at moderate pruning (moved here from c4 because it comes from a different paragraph than the c4 quote).'

  notes: 'Selected for the method article requested by the user (2026-10-07): Bayesian optimization and hyperparameter optimization (GP-based BO, TPE, multi-fidelity methods, scalable BO, frameworks, benchmarks
    and comparisons with random search). Carded by a subagent. Results tables not recorded; claims only. Affiliations: Carnegie Mellon University; Talwalkar also Determined AI. Venue from the arXiv journal_ref
    (Conference on Uncertainty in Artificial Intelligence, UAI 2019); the PDF text itself does not state it. Conflict of interest: ASHA [30] (''Massively parallel hyperparameter tuning'') is by L. Li, ...,
    A. Talwalkar, i.e. the authors'' own method, used as the HPO baseline; Hyperband/successive halving [29] is also from overlapping authors. ASHA runs used non-deterministic code and asynchronous updates,
    so ASHA results are not exactly reproducible (Appendix A.2). GPU time on V100 converted to P100 with a factor of 1.5. On PTB, ENAS''s published result could not be reproduced with the released code.
    Search spaces follow DARTS; the zero operation was excluded on PTB but included on CIFAR-10. Budgets: ASHA used 2 GPU days on PTB (equal to DARTS second-order total cost) and 9 GPU days on CIFAR-10
    (vs 10 GPU days for the authors'' DARTS run), evaluating over 300 and over 700 architectures, versus 1 architecture for ENAS''s and 8 (PTB) / 24 (CIFAR-10) for DARTS''s published random-search baselines
    (Sections 4.1, 4.2). Doubt: Section 4.2.2 says stage (1) evaluates sampled architectures ''on the test set'', whereas Appendix A.2 says each architecture is evaluated on 10 minibatches and the best
    10 per 1000 on the full validation set; Table 7 ranks DARTS trials by test error after 100/600 epochs. The text does not reconcile these, so whether test data influenced selection is unclear. Perplexity/error
    tables not recorded.'

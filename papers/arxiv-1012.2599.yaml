  notes: 'Selected for the method article requested by the user (2026-10-07): Bayesian optimization and hyperparameter optimization (GP-based BO, TPE, multi-fidelity methods, scalable BO, frameworks, benchmarks
    and comparisons with random search). Carded by a subagent. Results tables not recorded; claims only. Affiliation not extracted from the PDF text. No venue recorded: the arXiv record has no journal_ref,
    and Frazier (arXiv:1807.02811) cites it as UBC Technical Report TR-2009-023 (a technical report, not a venue). The acquisition function is maximized with DIRECT (Section 2.3). The two extensions (preference
    galleries with a probit/Thurstone-Mosteller GP model; hierarchical RL on a simulated driving task) are authored by the same group and evaluate their own methods; their results are figure-only and not
    recorded. The tutorial predates most BO-for-hyperparameter work and does not run hyperparameter-optimization experiments; the task tag is the closest registered one. No discussion of categorical/conditional
    search spaces or of the cubic GP cost was found (searched for categor, conditional, cubic, overhead, computational); it states only that in sequential decision making the number of query points is relatively
    small so GP predictions are easy to compute.'

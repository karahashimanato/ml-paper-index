  notes: 'Selected for the method articles requested by the user (2026-10-05): gradient-boosted trees, and random forests / decision trees. Carded by a subagent. Results tables not recorded; claims only.
    Affiliations not recorded. Venue from the arXiv journal_ref (''WIREs Data Mining Knowl Discov 2019''). Conflict of interest: tuneRanger, the method that performed best on average in the benchmark, is
    the authors'' own package (Probst, 2018), and ranger is co-author Wright''s package (Wright and Ziegler, 2017); the tunability evidence (Probst et al., 2018) and the number-of-trees results (Probst
    and Boulesteix, 2017) are the authors'' own earlier work. The paper does not state these as conflicts, although its conclusion discusses that comparison studies in papers introducing new methods are
    often biased in their favour. tuneRanger defaults: SMBO (mlrMBO) with 30 initial random points and 70 iterations, tuning mtry, sample size and node size, sampling without replacement, OOB evaluation,
    Brier score (classification) or MSE (regression); final setting = average of the best 5% of iterations. Benchmark is classification only. Results tables (Tables 2-3) not recorded.'

proposes:
- 'The InfoMin principle: good views share the minimal information necessary for the downstream task (reduce I(v1; v2) while keeping task-relevant information)'
- Unsupervised (adversarial) and semi-supervised view learning with invertible pixel-wise flow generators
- 'InfoMin Aug: a stronger augmentation set (with a PIRL-style JigSaw branch) motivated by the principle'
claims:
- id: c1
  statement: 'InfoMin principle: a good set of views shares the minimal information necessary to perform well on the downstream task; the authors argue that maximizing information is useful only insofar
    as it is task-relevant.'
  location: Introduction
  page: 2
  quote: A good set of views are those that share the minimal information necessary to perform well at the downstream task.
- id: c2
  statement: 'Proposition 3.1 assumes minimal sufficient encoders and a downstream task known in advance: the optimal views minimize I(v1; v2) subject to I(v1; y) = I(v2; y) = I(x; y), and the representation
    learned from them is then optimal for the task.'
  location: Proposition 3.1
  page: 4
  quote: More formally, the following InfoMin proposition articulates which views are optimal supposing that we know the speciﬁc downstream task T in advance.
- id: c3
  statement: 'Caveat on applying the proposition: unlike the information-bottleneck setting, contrastive learning usually has no labelled training set specifying the downstream task, so the task-relevant
    information in views cannot easily be evaluated during training; views are instead guided by domain knowledge.'
  location: Three Regimes of Information Captured
  page: 4
  quote: Unlike in information bottleneck, for contrastive learning we often do not have access to a fully-labeled training set that speciﬁes the downstream task in advance, and thus evaluating how much
    task-relevant information is contained in the views and representation at training time is challenging.
- id: c4
  statement: 'Measurement caveat: mutual information between views is measured with I_NCE as a neural proxy, which depends on the network architecture, so each plot varies only the input views while keeping
    other settings fixed.'
  location: View Selection Inﬂuences Mutual Information and Accuracy
  page: 5
  quote: We use INCE as a neural proxy for I, and note it depends on network architectures.
- id: c5
  statement: The reverse-U relationship between shared information and downstream performance is presented as an upper bound that might not be reached if views share noise rather than signal.
  location: View Selection Inﬂuences Mutual Information and Accuracy
  page: 4
  quote: The upper-bound reverse-U might not be reached if views are selected that share noise rather than signal.
- id: c6
  statement: 'Task dependence (Colorful Moving-MNIST toy, frozen backbone with a linear task head): what the views share determines which factors are learned; when background is shared, digit information
    is left out, which the authors say might be because background bits predominate and act as a shortcut for the contrastive task.'
  location: Optimal Views Depend on the Downstream Task
  page: 9
  quote: This might because the information bits of background predominates, and the encoder chooses the background as a “shortcut” to solve the contrastive pre-training task.
- id: c7
  statement: Learning views without labels (adversarially minimizing I_NCE with a flow generator) in most cases over-reduces I_NCE and was unstable across runs with the same hyperparameters; the authors
    conjecture the generator, lacking task knowledge, breaks the constraint of Proposition 3.1, and add a semi-supervised variant that uses a handful of downstream labels.
  location: 'Unsupervised View Learning: Minimize I(v1; v2)'
  page: 10
  quote: In addition, we found this GAN-style training is unstable, as different runs with the same hyper-parameter vary signiﬁcantly.
- id: c8
  statement: 'Augmentation strength: varying the magnitude of RandomResizedCrop and Color Jittering traces reverse-U shapes on ImageNet, and the sweet spots (crop area bound 0.2, jitter strength 1.0) are
    identified from these plots (MoCo framework, 100 pre-training epochs, linear classifier trained for 60 epochs, per Appendix C).'
  location: Data Augmentation to Reduce Mutual Information between Views
  page: 6
  quote: The plots on ImageNet [16] are shown in Fig. 5, where we identify a sweet spot at 1.0 for Color Jittering and 0.2 for RandomResizedCrop.

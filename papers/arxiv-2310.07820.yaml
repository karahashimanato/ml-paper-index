proposes:
- 'LLMTime: forecasting by encoding numbers as digit strings and sampling LLM text completions'
- continuous densities from discrete digit-token likelihoods
claims:
- id: c1
  statement: 'Method: time series are encoded as strings of numerical digits so that forecasting becomes next-token prediction with a pretrained LLM (GPT-3, LLaMA-2); the paper also proposes tokenization
    and a conversion of token distributions into continuous densities.'
  location: Abstract
  page: 1
  quote: By encoding time series as a string of numerical digits, we can frame time series forecasting as next-token prediction in text.
- id: c2
  statement: 'Main claim: LLMTime can exceed or match purpose-built time series methods on a range of problems in a zero-shot fashion, where zero-shot means no fine-tuning on the downstream data that the
    other models are trained on.'
  location: Introduction
  page: 2
  quote: we find LLMTIME can exceed or match purpose-built time series methods over a range of different problems in a zero-shot fashion, meaning that LLMTIME can be used without any fine-tuning on the
    downstream data used by other models.
- id: c3
  statement: 'Zero-shot here still involves hyperparameter selection: the rescaling parameters (percentile alpha and offset beta) are tuned on validation log likelihoods; Appendix A builds the validation
    series from the last observations of the training series and computes the LLM likelihood without training (on some benchmarks, e.g. Monash, fixed hyperparameters are listed instead).'
  location: 'LLMTime: Rescaling'
  page: 4
  quote: We also experiment with an offset β based calculate as a percentile of the input data, and we tune these two parameters on validation log likelihoods (details in Appendix A).
- id: c4
  statement: 'Leakage: the authors acknowledge that the LLMs'' training data are undisclosed and that memorization or more benign leakage of related data could overestimate generalization; as a direct check
    they evaluate GPT-3 on three series recorded after its training data cutoff (September 2021).'
  location: 'Appendix: Addressing Memorization Concerns'
  page: 16
  quote: To further address the memorization concern, we also perform a direct experiment to show GPT-3 also demonstrates strong performance when evaluated on time series recorded after its training data
    cutoff date, September 2021.
- id: c5
  statement: 'Evaluation protocol (Darts benchmark): baselines (ARIMA, TCN, N-BEATS, N-HiTS from Darts; SM-GP via GPyTorch) are grid-searched over listed hyperparameters, with default values for hyperparameters
    not listed; the test set is the last 20% of each series.'
  location: 'Appendix: Darts datasets'
  page: 17
  quote: We use default values for hyperparameters not described below.
- id: c6
  statement: 'Evaluation protocol (Monash): GPT-3 was evaluated on a subset of 19 Monash datasets selected for tractable number of series and context length, and baseline numbers were not re-run but reported
    as presented in the Monash archive paper (their ref. [19]).'
  location: 'Appendix: Monash datasets'
  page: 18
  quote: For the baselines, we report their performance as presented in [19].
- id: c7
  statement: 'Negative finding: GPT-4 can perform worse than GPT-3, which the authors attribute to number tokenization and poor uncertainty calibration likely resulting from alignment interventions such
    as RLHF (stated as ''likely'').'
  location: Abstract
  page: 1
  quote: we show GPT-4 can perform worse than GPT-3 because of how it tokenizes numbers, and poor uncertainty calibration, which is likely the result of alignment interventions such as RLHF.

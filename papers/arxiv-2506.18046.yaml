proposes:
- TAB benchmark (datasets, unified pipeline, leaderboard)
claims:
- id: c1
  statement: TAB covers 29 public multivariate datasets and 1,635 univariate time series from different domains.
  location: Abstract
  page: 1
  quote: TAB encompasses 29 public multivariate datasets and 1,635 univariate time series from different domains
- id: c2
  statement: It covers non-learning, machine learning, deep learning, LLM-based and time-series pre-trained methods.
  location: Abstract
  page: 1
  quote: TAB covers a variety of TSAD methods, including Non-learning, Machine learning, Deep learning, LLM-based, and Time-series pre-trained methods.
- id: c3
  statement: Among 100 surveyed studies, more than half use at most four multivariate datasets.
  location: Introduction
  page: 2
  quote: more than half of the studies include at most four datasets, and only one study covers 17 datasets.
- id: c4
  statement: 'Inconsistent splitting: some methods take the validation set from the test set.'
  location: Introduction
  page: 2
  quote: Some methods use a validation set from the testing set
- id: c5
  statement: 'Drop-last issue: discarding the last incomplete test batch makes comparisons unfair unless batch sizes match.'
  location: Introduction
  page: 2
  quote: discarding the last incomplete batch with fewer sample instances than the batch size is unfair
- id: c6
  statement: With point adjustment, even random methods likely hit at least one point in long anomaly windows.
  location: Introduction
  page: 2
  quote: even random methods have a good chance to predict at least one point in larger anomaly windows
- id: c7
  statement: Threshold-independent metrics like AUC-ROC should not be recomputed after point adjustment.
  location: Introduction
  page: 2
  quote: should not be recalculated after point adjustment.
- id: c8
  statement: Label-based metrics change considerably with the threshold.
  location: Introduction
  page: 2
  quote: when the threshold changes, the performance can change considerably.
- id: c9
  statement: TAB computes metrics at all thresholds and reports the best.
  location: Experimental settings
  page: 8
  quote: we conduct metric calculations at all thresholds and report the best results.
- id: c10
  statement: Each method is run with its original hyperparameters plus a search over several sets; the best result is reported.
  location: Experimental settings
  page: 8
  quote: We then select the best results from these evaluations
- id: c11
  statement: On univariate series, machine learning and non-learning methods had the best average V-PR and Aff-F1.
  location: Section 5.2.1
  page: 10
  quote: Machine learning (ML) and non-learning (NL) methods exhibit the best average performance in terms of the V-PR and Aff-F metrics.
- id: c12
  statement: Classic methods should not be overlooked while pursuing novel ones.
  location: Section 5.2.1
  page: 10
  quote: while pursuing novel methods, we should not overlook the classic methods.
- id: c13
  statement: On multivariate data some deep models (TsNet, CATCH) appear best in full-shot settings.
  location: Multivariate results
  page: 10
  quote: Some deep learning models, such as TsNet and CATCH, appear to achieve the best performance in full-shot settings.
- id: c14
  statement: Strong non-learning/ML results on multivariate data suggest significant room for improving deep learning approaches.
  location: Multivariate results
  page: 11
  quote: This suggests that there is still significant room for improvement in current deep learning approaches.
- id: c15
  statement: For multivariate data, pre-trained time-series models do much better with full-shot or few-shot than zero-shot.
  location: Multivariate results
  page: 10
  quote: time series pre-trained models demonstrate significantly better performance compared to zero-shot learning approaches.
- id: c16
  statement: No single TSAD method is universally best for all time series and anomaly types.
  location: Introduction
  page: 2
  quote: no single TSAD method is universally best for all time series and anomaly types.
- id: c17
  statement: Overlapping vs non-overlapping window post-processing usually does not change performance (with a few exceptions).
  location: Performance comparison of post-processing methods
  page: 10
  quote: in most cases, the two post-processing methods do not affect the performance of the method
- id: c18
  statement: In critical difference diagrams on univariate data, OCSVM, HOBS and DWT ranked best.
  location: Statistical validation
  page: 11
  quote: with OCSVM, HOBS, and DWT achieving the excellent results.

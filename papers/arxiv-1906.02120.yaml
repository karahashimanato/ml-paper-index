    No venue is printed in the arXiv v2 PDF (dated 17 Oct 2019) and the arXiv comment/journal_ref are empty; none recorded. Section numbers are not printed as headings in the text dump, so locations use
    section names (Dragonnet, Targeted Regularization, Experiments). Hyperparameters alpha and beta set to 1; hidden sizes 200 (shared) and 100 (outcome); SGD with momentum, and the authors note ''the choice
    of optimizer has a signiﬁcant impact on estimation performance'' for the baseline and their methods. Data points with estimated propensity outside [0.01, 0.99] are excluded for estimation, and Appendix
    B reports that the trimming level affects results. Footnote 4 says Shalit et al.''s ''setting A'' of NPCI corresponds to setting B in Hill (2011). Table 1 entries for BNN/TARNET/CFR/CEVAE/GANITE are
    ''as reported in the cited papers'' (not re-run). The A-IPTW estimator ''consistently under-performs'' the naive estimator in their experiments; on ACIC TMLE ''hurts more than it helps on average'';
    Dragonnet and targeted regularization help ''about half the time'' (text, Experiments). Results tables not recorded. No author-overlap conflict with the compared estimators found; TARNET (Shalit et
    al., arxiv-1606.03976) is reimplemented as the main baseline.'

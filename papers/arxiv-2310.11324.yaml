  reviewed: false
  notes: 'Selected for the topic article requested by the user (2026-10-11): pitfalls in evaluating large language models (benchmark contamination and its detection, prompt and answer-format sensitivity,
    LLM-as-a-judge biases, human-preference arenas, holistic evaluation, benchmark errors, and reproducibility of evaluation harnesses). Carded by a subagent. Results tables not recorded; claims only. Affiliations:
    University of Washington (Sclar, Choi, Tsvetkov), Allen Institute for AI (Choi), UC Berkeley (Suhr). Venue from the PDF header (''Published as a conference paper at ICLR 2024'') and the arXiv comment
    (''ICLR 2024 Camera Ready version''); year is the first arXiv version (2023). Section numbers are from cross-references (§3.1, §3.2, §4.2, §4.3, §4.4, §4.5); the experimental-setup subsection is not
    cross-referenced and is given by name. Section 4.5 (body text): with 320 formats and a budget of 51,200 evaluations Thompson sampling found a spread within 1 accuracy point of the true spread (naive
    within 4, UCB within 11); with 40,000 evaluations and 320 formats, 1-shot LLaMA-2-70B (4-bit quantized) had median spread 0.171 and GPT-3.5 (exact prefix matching, no full logits) median 0.064. Section
    4.4: format identity is classifiable from prompt embeddings, and classifier accuracy on the top two principal components correlates moderately with spread. Limitations (Appendix C): some generated formats
    use unusual spacing/separators, multiple parses can produce odd character combinations (<20% of cases by manual inspection), and tasks were restricted to short instructions and inputs. FormatSpread
    is the authors'' own tool.'

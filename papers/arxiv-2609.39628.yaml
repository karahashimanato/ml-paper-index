claims:
- id: c1
  statement: MIND maps different variable types into a unified latent dependency space via column-wise marginal transport instead of learning the joint distribution in the raw feature space.
  location: Abstract
  page: 1
  quote: Instead, it first maps different variable types into a unified latent dependency space via column-wise marginal transport.
- id: c2
  statement: Across nine tabular benchmarks, MIND is reported to consistently improve marginal fidelity and dependency preservation over existing unified approaches.
  location: Abstract
  page: 1
  quote: Experiments across nine diverse tabular benchmarks show that MIND consistently improves marginal fidelity and dependency preservation over existing unified approaches.
- id: c3
  statement: For each of three seeds, all methods share the same stratified 64/16/20 train/validation/test split.
  location: Experiment setup
  page: 4
  quote: For each seed in {42, 43, 44}, all methods use the same stratified 64%/16%/20% train/validation/test split
- id: c4
  statement: TSTR utility is averaged over XGBoost, LightGBM and MLP downstream models, using AUC for classification and R2 for regression.
  location: Results
  page: 6
  quote: Scores are averaged over XGBoost, LightGBM, and MLP, using AUC for classification datasets and R2 for regression datasets
- id: c5
  statement: The aggregate TSTR advantage of MIND is substantially influenced by Covertype, so the authors interpret MIND as competitive with diffusion-based SOTA rather than dominant.
  location: Discussion
  page: 6
  quote: Although the aggregate TSTR mean favours MIND, this difference is influenced substantially by Covertype.
- id: c6
  statement: MIND assumes a designated target column and batch-level generation, limiting direct use in target-free or multi-target settings.
  location: Limitations
  page: 7
  quote: Currently, we assume a designated target column and perform batch-level generation, which limits direct use in target-free or multi-target settings.

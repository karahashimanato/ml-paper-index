claims:
- id: c1
  statement: Most surveys cover supervised streams; this survey reviews drift in unsupervised data streams, relevant for monitoring and anomaly detection.
  location: Abstract
  page: 1
  quote: While many surveys focus on supervised data streams, so far, there is no work reviewing the unsupervised setting.
- id: c2
  statement: It provides a taxonomy of drift detection and a systematic review of drift localization.
  location: Abstract
  page: 1
  quote: This survey provides a taxonomy of existing work on drift detection.
- id: c3
  statement: It includes standardized experiments on parametric artificial datasets to compare detection and localization strategies directly.
  location: Abstract
  page: 1
  quote: contains standardized experiments on parametric artificial datasets allowing for a direct comparison of different strategies for detection and localization.
- id: c4
  statement: 'Guideline: incorporate as much domain knowledge as possible (preprocessing, features, descriptors).'
  location: Conclusion and Guidelines for Drift Detection
  page: 27
  quote: A main finding is that as much domain knowledge as possible should be incorporated when designing drift detection schemes.
- id: c5
  statement: Meta or block-based detection methods are advisable overall; choosing good split points is crucial.
  location: Conclusion and Guidelines for Drift Detection
  page: 27
  quote: Over all experiments, we found that it is advisable to use meta or block-based methods.
- id: c6
  statement: Feature-wise analysis only if the drift is not expected to show up in correlations; otherwise ensemble-based techniques are better.
  location: Conclusion and Guidelines for Drift Detection
  page: 27
  quote: A feature-wise analysis should only be performed if it is expected that the drift does not inflict itself in correlations.
- id: c7
  statement: For high-dimensional data avoid dimension-wise methods, especially when false alarms are costly.
  location: Conclusion and Guidelines for Drift Detection
  page: 27
  quote: When working with high dimensional data, one should avoid using dimension-wise methodologies, especially if false alarms are costly in the considered application.
- id: c8
  statement: Loss-based strategies should be avoided when the goal is monitoring for anomalous behavior.
  location: Conclusion and Guidelines for Drift Detection
  page: 27
  quote: loss-based strategies should be avoided when the target of the drift detection is monitoring for anomalous behavior.
- id: c9
  statement: Detecting the time of a drift is not sufficient for monitoring; one must also localize where it happens.
  location: Drift Localization and Segmentation
  page: 27
  quote: Solely detecting and determining the time point of the drift is not sufficient in many monitoring settings.
- id: c10
  statement: More research is needed especially on drift localization and explanation.
  location: Conclusion
  page: 39
  quote: Finally, we found that more research is required, in particular focusing on the localization and explanation tasks.
- id: c11
  statement: 'Sample-based definitions of drift (D_i != D_j for some i, j) depend on the sample rather than the process: two samples from the same source over the same period with different sampling frequencies
    may differ in whether they show drift; the survey therefore models time T with a distribution P_T and data distributions D_t (a drift process).'
  location: A Formal Model of Concept Drift
  page: 3
  quote: In particular, it might happen that if we take two samples from the same data source over the same period of time using different sampling frequencies, one sample will have concept drift and the
    other will not.
- id: c12
  statement: 'Drift as dependence between time and data (Theorem 1): for (T, X) drawn from the holistic distribution, D_t has no drift if and only if T and X are statistically independent; drift exists
    if P[T in W, X in A] != P[T in W] P[X in A] for some time window W and set A.'
  location: A Formal Model of Concept Drift
  page: 4
  quote: 'One of the key findings however, which allows the development of new methods, is that drift can equivalently be formulated as data X and time T are dependent, i.e., not statistically independent:'
- id: c13
  statement: 'Drift detection as a statistical test: the null hypothesis is that D_t = D_s for all time points t and s; a type I error is a false alarm (no drift but detected) and a type II error is a missed
    drift; since avoiding type II errors for arbitrarily mild drifts is not feasible, the survey focuses on controlling the type I error.'
  location: Drift Detection
  page: 7
  quote: A type I error occurs if there is no drift but we detect one (false alarm), and a type II error occurs if there is drift but we do not detect it.

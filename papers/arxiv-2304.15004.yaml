proposes:
- 'alternative explanation of emergent abilities: nonlinear/discontinuous metrics (and too few test examples) make smooth per-token improvements look sharp and unpredictable'
claims:
- id: c1
  statement: 'Main claim, presented as an alternative explanation: for a given task and model family, with fixed model outputs, emergent abilities appear due to the researcher''s choice of metric rather
    than fundamental changes in model behavior with scale; nonlinear or discontinuous metrics produce apparent emergence, linear or continuous ones smooth changes. The abstract''s conclusion is hedged:
    emergent abilities ''may not be a fundamental property of scaling AI models''.'
  location: Abstract
  page: 1
  quote: 'Here, we present an alternative explanation for emergent abilities: that for a particular task and model family, when analyzing ﬁxed model outputs, emergent abilities appear due the researcher’s
    choice of metric rather than due to fundamental changes in model behavior with scale.'
- id: c2
  statement: 'Definition being questioned: the paper quotes the definition of arxiv-2206.07682 (its reference [33]) and, from that quotation together with one from Ganguli et al. [8], identifies two defining
    properties, sharpness and unpredictability; what it calls into question is specifically sharp and unpredictable changes in model outputs as a function of scale on specific tasks.'
  location: Introduction
  page: 2
  quote: In this paper, we call into question the claim that LLMs possess emergent abilities, by which we speciﬁcally mean sharp and unpredictable changes in model outputs as a function of model scale on
    speciﬁc tasks.
- id: c3
  statement: 'Two factors: primarily a metric that nonlinearly or discontinuously deforms per-token error rates, and secondarily too few test examples to estimate smaller models'' performance (so they appear
    wholly unable to do the task).'
  location: Introduction
  page: 2
  quote: our alternative posits that emergent abilities are a mirage caused primarily by the researcher choosing a metric that nonlinearly or discontinuously deforms per-token error rates, and secondarily
    by possessing too few test data to accurately estimate the performance of smaller models
- id: c4
  statement: 'Scope of the direct test: outputs of the InstructGPT/GPT-3 family (chosen because it is publicly queryable) on two arithmetic tasks; according to the authors, switching from Accuracy to Token
    Edit Distance with fixed outputs gave smooth, predictable improvement, and generating additional test data showed all models in the family achieve above-chance accuracy.'
  location: Analyzing InstructGPT/GPT-3's Emergent Arithmetic Abilities
  page: 5
  quote: 'To test these predictions, we collected outputs from the InstructGPT/GPT-3 family on two tasks: 2-shot multiplication between two 2-digit integers and 2-shot addition between two 4-digit integers.'
- id: c5
  statement: 'Meta-analysis scope (BIG-Bench published results, with hand-annotated emergent task-metric-model family triplets from Wei''s ''137 emergent abilities'' list): emergence appears under 4 of
    39 metrics and two metrics, Multiple Choice Grade and Exact String Match, account for more than 92% of claimed emergent abilities.'
  location: Meta-Analysis of Claimed Emergent Abilities
  page: 6
  quote: 'we also analyzed hand-annotated task-metric-model family triplets [32], which revealed emergent abilities appear with 4/39 metrics (Fig. 5B), and 2 metrics account for > 92% of claimed emergent
    abilities (Fig. 5C): Multiple Choice Grade and Exact String Match'
- id: c6
  statement: 'Metric swap on LaMDA (outputs available through BIG-Bench): on tasks where LaMDA showed emergence under Multiple Choice Grade, the emergence disappeared under the continuous Brier Score.'
  location: Meta-Analysis of Claimed Emergent Abilities
  page: 7
  quote: LaMDA’s emergent abilities on the discontinuous Multiple Choice Grade disappeared when we changed the metric to the continuous Brier Score (Fig. 6).
- id: c7
  statement: 'Hedge stated by the authors: they do not claim that LLMs cannot display emergent abilities; their message is that previously claimed emergent abilities (including those in arxiv-2206.07682,
    their reference [33]) might likely be a mirage induced by researcher analyses.'
  location: Discussion
  page: 9
  quote: We emphasize that nothing in this paper should be interpreted as claiming that large language models cannot display emergent abilities; rather, our message is that previously claimed emergent abilities
    in [3, 8, 28, 33] might likely be a mirage induced by researcher analyses.

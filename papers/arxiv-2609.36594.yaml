  notes: 'Approved from candidate issue #2 (2026-10-02); carded by a subagent. Results tables not recorded; claims only. Offline (retrospective) multiple change-point detection in multivariate time series,
    not online stream drift detection; no detection delay or false-alarm-rate metrics. Tagged change-point-detection; two-sample-tests is the closest family (CUSUM contrasts of moment tensors between adjacent
    segments). Ground truth exists only for the synthetic settings R1-R5; the real-data example (two Nasdaq-100 return panels) has no ground truth and estimated dates are compared with market events (Lehman
    bankruptcy, COVID-19 onset). CPWZ is omitted in the two-change settings because it targets a single change.'

  notes: 'Selected for the topic article requested by the user (2026-10-03): classical algorithms (sorting, binary search, greedy) and machine learning; carded by a subagent. Results tables not recorded;
    claims only. PDF states: 33rd Conference on Neural Information Processing Systems (NeurIPS 2019). Affiliation: Google Research, Brain Team (all authors). Unregularized Kantorovich operators are said
    to be costly (O(nm(n+m) log(nm))) and still non-differentiable (Section 2 text). The paper relates prior soft ranks: Taylor et al. O(n^3), Qin et al. O(n^2) pairwise logistic, Grover et al. (NeuralSort)
    unimodal row-stochastic on the same pairwise matrix, and says its m != n targets are a departure from methods requiring pairwise comparisons. The MNIST sorting text says ''We use 100 epochs, and confirm
    experimentally that S-sort performs on par with their neural-sort function'' (epsilon = 0.005), which is weaker than the Table 1 caption. Reviewer comparison (not stated in this paper): the NeuralSort
    rows in this paper''s Table 1 are lower than those in Grover et al.''s own Table 1 (arxiv-1903.08850) at every n, with the gap growing with n, and Grover et al.''s own NeuralSort values for n >= 5 are
    also higher than this paper''s OT row; the text says only that the NeuralSort authors'' code was used with 100 epochs, and does not discuss the difference, so setups may differ. Least quantile regression
    uses datasets from Romano et al. (conformalized quantile regression) with a 2-hidden-layer NN, baseline = gradient step on the empirical quantile point. Conclusion (open questions): cost function, target
    vector and squashing strongly shape differentiability for epsilon > 0; ''empirical findings suggest'' whitening and squashing into [0,1] is crucial for numerical stability and consistent gradients.'

proposes:
- 'AMLB: an open-source tool that automates end-to-end AutoML evaluation (installation, data provisioning from OpenML, resource allocation on local/docker/AWS, scoring) with framework integrations written
  jointly with their developers'
- Two OpenML benchmark suites (71 classification tasks, 33 regression tasks) and an evaluation of 9 AutoML frameworks under 1 h and 4 h budgets
- 'Analysis protocol: constant-predictor imputation of failures, critical-difference diagrams, scaled-performance boxplots, Bradley-Terry trees over data characteristics, inference-time trade-offs and failure
  categorization'
claims:
- id: c1
  statement: 'Integration: the frameworks are integrated with the benchmark tool in agreement and jointly with each framework''s developers to ensure correctness; the evaluation covers 9 well-known open-source
    frameworks (some with multiple configurations) on 71 classification and 33 regression tasks, restricted to tabular data (unstructured data are left to NAS and out of scope).'
  location: Section 1.2
  page: 3
  quote: The AutoML frameworks are integrated with the benchmarking tool in direct agreement and jointly with the framework’s developers to ensure correctness.
- id: c2
  statement: 'Selection limitation: because experiments run on machines without GPU, the authors focus on frameworks not significantly affected by its absence; Auto-Keras and AutoPyTorch, which gain large
    benefits from a GPU, are not evaluated since a CPU-only evaluation might give a pessimistic estimate. Auto-WEKA was excluded based on its 2019 performance and lack of updates; ML-Plan, mlr3automl and
    ML.NET were excluded due to significant technical problems, and the autoxgboost authors opted out.'
  location: Section 3
  page: 6
  quote: As our experiments are run on machines without GPU, we focus on AutoML frameworks which are not significantly affected by the lack thereof.
- id: c3
  statement: 'Dataset criteria: tasks come from earlier AutoML papers, competitions and ML benchmarks and must be sufficiently difficult (not solved by almost any algorithm), representative of real-world
    problems (few artificial and raw-pixel vision tasks), free of free-form text features, diverse in domain, and i.i.d. (temporal or repeated-measurement data are discarded); the airlines datasets violate
    the criteria but are included for historical reasons.'
  location: Section 5.1.1
  page: 14
  quote: If a problem is easily solved by almost any algorithm, it will not be able to differentiate the various AutoML frameworks.
- id: c4
  statement: 'Missing results: failures are not random but correlate with data properties such as size and class imbalance, so ignoring them (or imputing from other folds of the same framework) can reward
    frameworks that fail on harder tasks; the authors therefore impute missing results with the constant predictor, which they describe as very penalizing but fairer to well-behaved frameworks.'
  location: Section 5.1.3
  page: 16
  quote: Ignoring missing values thus means that AutoML frameworks may fail on harder tasks or folds and consequently obtain higher average performance estimates.
- id: c5
  statement: 'Framework configuration: frameworks are run in their default configuration except for a ''mode'' declaring user intent (chosen by the frameworks'' developers), the search runtime (plus one
    hour of leeway for data loading, prediction and cleanup that is not communicated to the frameworks), CPU-core and memory constraints, and the target metric (the same metric used for evaluation); further
    customization is intentionally prohibited to reflect typical practical use.'
  location: Section 5.2.2
  page: 17
  quote: The modes used to evaluate each AutoML framework is chosen by their developers.
- id: c6
  statement: 'Design limitations stated by the authors: performance differences cannot be attributed to any single design aspect (library, search space, preprocessing, search algorithm), only final-model
    results are recorded (anytime performance is approximated by the 1 h and 4 h budgets), qualitative features are not evaluated, and only a few developer-recommended modes are tried, so better results
    may be achievable by meta-tuning; they stress that the paper does not state which framework is ultimately best.'
  location: Section 5.3
  page: 18
  quote: Perhaps the biggest limitation of the design is the inability to attribute the performance of an AutoML framework to any one aspect of its design, as is often done with ablation studies.
- id: c7
  statement: 'Meta-learning overlap: since the benchmark data are public and well known, overlap with data used for meta-learning is likely. auto-sklearn''s lookup can exclude the 39 datasets of the 2019
    benchmark by name (identical data under other names cannot be ruled out), but auto-sklearn 2''s portfolio and meta-model cannot exclude single datasets, so its results are described as likely optimistic
    and it is excluded from the critical-difference comparison.'
  location: Section 5.3.3
  page: 19
  quote: This ultimately means that the result of AUTO-SKLEARN 2 must be considered very carefully and are likely optimistic
- id: c8
  statement: 'Findings stated in the text (CD diagrams, Friedman and Nemenyi tests after constant-predictor imputation): AutoGluon(B) and TPOT achieve the best and worst rank among AutoML frameworks in
    almost every setting; AutoGluon(B) is generally not significantly better than the second-best framework; the baselines rank worse than every AutoML framework except TPOT; and performance generally improves
    only slightly from 1 h to 4 h. The authors suspect other frameworks are limited by their search space (e.g. if stacking is required).'
  location: Section 6.1
  page: 21
  quote: Overall, we observe that AUTOGLUON(B) and TPOT respectively achieve the best and worst rank among AutoML frameworks in almost every setting with respect to model accuracy.
- id: c9
  statement: 'Conclusions on failures and trade-offs: analyzing scenarios in which frameworks fail to produce a model, the authors found that the main cause of failure was data set size, i.e. not all methods
    scale well; they also found large differences in inference time of the produced models, with the most accurate frameworks paying a large inference-time cost and not all frameworks producing Pareto-optimal
    models.'
  location: Section 7
  page: 31
  quote: and found that the main cause for failure was data set size.

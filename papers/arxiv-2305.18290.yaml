  notes: 'Selected for the method article requested by the user (2026-10-11): aligning language models with human preferences (preference comparisons and reward models, PPO-based RLHF with a KL penalty,
    AI feedback, direct preference optimization and its variants, reward overoptimization, length bias, reward-model evaluation, and open problems). Carded by a subagent. Results tables not recorded; claims
    only. Affiliations: Stanford University, CZ Biohub. Venue from the PDF footer (''37th Conference on Neural Information Processing Systems (NeurIPS 2023)''); the arXiv record has no comment/journal_ref.
    Section numbers come from cross-references in the PDF (Section 3, Section 4, Section 5, Section 6.2, Sec. 6.4); the Discussion section number is not confirmed, so its name is used. Tasks: IMDb controlled
    sentiment generation (GPT-2-large SFT; preference pairs generated with a pre-trained sentiment classifier, which also serves as ground-truth reward; 22 runs sweeping target KL for PPO, beta in {0.05,
    0.1, 1, 5}, alpha for unlikelihood), Reddit TL;DR summarization with the human preferences gathered by Stiennon et al. (GPT-J SFT from CarperAI), and single-turn dialogue on Anthropic HH (170k dialogues;
    Pythia-2.8B with Preferred-FT as reference). Hyperparameters (Appendix B): beta = 0.1, batch size 64, RMSprop, lr 1e-6 with 150 warmup steps by default; beta = 0.5 for TL;DR. The main text says ''we
    did not meaningfully tune DPO''s beta'' and ''with almost no tuning of hyperparameters''. The PPO baseline for HH was an existing model from a third-party source (CarperAI trlx / reciprocate/ppo_hh_pythia-6B)
    that the authors could not get to beat the base Pythia-2.8B, so Best of 128 was treated as ''a rough proxy for PPO-level performance''. Human study (Appendix D.3): 25 volunteer raters each comparing
    25 summaries; ties (~1%) ignored. No figure values and no table values recorded; reward-KL frontier and HH win rates are figure-only.'

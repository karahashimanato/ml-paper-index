proposes:
- Deployment-fidelity gap G(R) between partition-level (within-family oracle) and end-to-end scores in decomposed algorithm selection
claims:
- id: c1
  statement: The paper defines the deployment-fidelity gap as partition-level utility (with a within-family oracle) minus deployable end-to-end utility.
  location: Abstract
  page: 1
  quote: We define the deployment-fidelity gap G(R) as the difference between partition-level and deployable end-to-end utility
- id: c2
  statement: On five public algorithm-selection benchmarks (including TabZilla, TabRepo and TALENT), every decomposed pipeline has a positive gap.
  location: Abstract
  page: 1
  quote: Across five public algorithm-selection benchmarks spanning tabular AutoML and combinatorial CSP/SAT, every decomposed pipeline has positive G(R), ranging from 0.012 on TabZilla to 0.13 on PROTEUS-2014.
- id: c3
  statement: Tabular benchmarking literature uses best-in-family summaries (best deep model vs. best GBDT) as the primary comparison object, which the paper treats as an oracle-style quantity.
  location: Related Work
  page: 2
  quote: tabular benchmarking literature reports best-in-family summaries – best deep model versus best gradient boosting model – as the primary comparison object
- id: c4
  statement: 'Protocol: 5 seeds x 5-fold stratified CV with per-instance utilities; family selectors are random forests and the default within-family selector is a per-algorithm gradient-boosted regressor.'
  location: Benchmarks and protocol
  page: 6
  quote: We run 5 seeds × 5-fold stratified CV and convert performance to per-instance utilities in [0, 1]
- id: c5
  statement: Partition and end-to-end scores should be reported side by side.
  location: Abstract
  page: 1
  quote: Partition and end-to-end scores should be reported side by side.
- id: c6
  statement: 'Stated limitation: exhaustive HPO or domain-specific meta-learners may shrink the gap further, but such improvements must still be reported end-to-end.'
  location: Limitations and Conclusion
  page: 9
  quote: exhaustive HPO or domain-specific meta-learners may shrink G(R) further; such improvements must still be reported end-to-end

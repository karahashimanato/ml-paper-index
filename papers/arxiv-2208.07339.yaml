proposes:
- 'LLM.int8(): vector-wise Int8 quantization plus mixed-precision decomposition that keeps outlier feature dimensions in 16-bit'
claims:
- id: c1
  statement: 'Method: Int8 matrix multiplication for feed-forward and attention projection layers, combining vector-wise quantization with a mixed-precision decomposition that isolates outlier feature dimensions
    into 16-bit multiplication while more than 99.9% of values are multiplied in 8-bit.'
  location: Abstract
  page: 1
  quote: However, for the emergent outliers, we also include a new mixed-precision decomposition scheme, which isolates the outlier feature dimensions into a 16-bit matrix multiplication while still more
    than 99.9% of values are multiplied in 8-bit.
- id: c2
  statement: 'Post-training use without retraining: a 16/32-bit checkpoint can be converted to Int8 and used immediately; the paper claims no performance degradation up to 175B parameters.'
  location: Abstract
  page: 1
  quote: With our method, a 175B parameter 16/32-bit checkpoint can be loaded, converted to Int8, and used immediately without performance degradation.
- id: c3
  statement: 'Failure mode of regular 8-bit quantization: systematic large-magnitude outlier features emerge in all transformer layers from about 6.7B parameters, and regular quantization methods fail from
    that scale (shown with C4 perplexity and OPT zero-shot accuracy).'
  location: Introduction
  page: 2
  quote: the need to explicitly represent the sparse but systematic large magnitude outlier features that ruin quantization precision once they emerge in all transformer layers starting at scales of 6.7B
    parameters
- id: c4
  statement: 'Evaluation metrics: C4 validation perplexity on fairseq-pretrained models (125M-13B) to compare quantization baselines, and zero-shot accuracy on OPT models (up to 175B) via the EleutherAI
    evaluation harness compared only against a 16-bit baseline.'
  location: Section 3.3
  page: 5
  quote: Additionally, we evaluate zeroshot accuracy degradation on OPT models for a range of different end tasks, where we compare our methods with a 16-bit baseline.
- id: c5
  statement: 'Speed: the main focus is memory; quantization overhead can slow inference for models below 6.7B parameters relative to FP16, while large matrix multiplications equivalent to 175B models run
    about two times faster (appendix benchmarks).'
  location: Section 3.4
  page: 6
  quote: The quantization overhead can slow inference for models with less than 6.7B parameters, as compared to a FP16 baseline.
- id: c6
  statement: End-to-end BLOOM-176B inference in Hugging Face with Int8 is slightly slower but close to 16-bit per-token latency.
  location: Appendix D.2
  page: 18
  quote: Overall Int8 inference is slightly slower but close to the millisecond latency per token compared to 16-bit inference.
- id: c7
  statement: 'Limitations: only the Int8 data type (no FP8), only models up to 175B, no Int8 for the attention function, and only inference (not training or fine-tuning).'
  location: Discussion and limitations
  page: 10
  quote: The main limitation of our work is that our analysis is solely on the Int8 data type, and we do not study 8-bit ﬂoating-point (FP8) data types.
- id: c8
  statement: 'Absmax quantization: X_i8 = round(127 X_f16 / max_ij |X_f16,ij|), i.e. scaling into [-127, 127] by 127 divided by the absolute maximum (infinity norm) of the entire tensor.'
  location: Section 2.1
  page: 3
  quote: Absmax quantization scales inputs into the 8-bit range [−127, 127] by multiplying with sxf16 which is 127 divided by the absolute maximum of the entire tensor.

claims:
- id: c1
  statement: The stretch framework formulates numeric feature preprocessing as an optimization problem that makes the target function smoother and so more learnable.
  location: Abstract
  page: 1
  quote: We introduce the stretch transformation framework, which formulates numeric feature preprocessing as an optimization problem to make the target function smoother and thus more learnable.
- id: c2
  statement: On 38 TALENT datasets, supervised stretch consistently outperforms all baseline transformations.
  location: Abstract
  page: 1
  quote: Comprehensive experiments on 38 datasets from the TALENT benchmark demonstrate that supervised stretch consistently outperforms all baselines.
- id: c3
  statement: Every dataset-model-transformation combination gets 100 Optuna trials, jointly tuning model and transformation hyperparameters on the official TALENT train and validation partitions only.
  location: Experimental setup
  page: 7
  quote: We conduct Bayesian optimization using Optuna [1] with 100 trials for each dataset-model-transformation combination, jointly tuning model and transformation hyperparameters (e.g., number of bins
    for stretch and PLE) using only the training and validation partitions.
- id: c4
  statement: Selected configurations are run with 15 seeds on one fixed split, so the reported variability covers initialization and optimization, not alternative data splits.
  location: Experimental setup
  page: 7
  quote: Each selected configuration is evaluated with 15 random seeds on the fixed split; these seeds measure initialization, minibatch-order, and optimization variability, not variability over alternative
    data splits.
- id: c5
  statement: The 38 datasets come from the 42-dataset TALENT Benchmark 1 collection after excluding four datasets with only categorical features.
  location: Appendix
  page: 15
  quote: From the original TALENT Benchmark 1 collection of 42 datasets, we exclude four datasets that contain only categorical features
- id: c6
  statement: The transformation is marginal (per feature), so it does not optimize a joint or conditional smoothness objective and is not interaction-aware.
  location: Limitations
  page: 10
  quote: The current transformation is marginal and therefore does not optimize a joint or conditional smoothness objective; the downstream model may learn feature interactions, but the preprocessing itself
    is not interaction-aware.

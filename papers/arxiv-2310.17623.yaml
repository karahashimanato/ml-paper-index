  notes: 'Selected for the topic article requested by the user (2026-10-11): pitfalls in evaluating large language models (benchmark contamination and its detection, prompt and answer-format sensitivity,
    LLM-as-a-judge biases, human-preference arenas, holistic evaluation, benchmark errors, and reproducibility of evaluation harnesses). Carded by a subagent. Results tables not recorded; claims only. Affiliations:
    Stanford University, Columbia University. The arXiv PDF (v2) is marked ''Preprint'' and the arXiv record has no comment or journal_ref; no venue recorded. Section 4.1 is from the cross-reference ''section
    4.1'' (synthetic canary evaluations); other locations use section names. Notation inconsistency in the PDF: ''the shard count m and the permutation count r'' with m = 50 shards and r = 51 permutations,
    whereas Algorithm 1 uses r for shards and m for permutations; the text also says the permutation-test baseline used r = 100 permutations. Detection power requires further assumptions: the authors note
    an adversary could hide an encrypted copy of X in the weights and focus on ''benign'' contamination where test sets slip through filtering. Ablations (stated in text, from figures): about 10-20 shards
    maximize detection, and returns diminish beyond about 25 permutations. MMLU: 14 test files speculated non-exchangeable were excluded (flagged on BioMedLM or GPT-2 negative controls), remaining 43 aggregated
    with Fisher''s method; the authors say this omnibus p-value is heuristic evidence only, not proof. The pretrained canary models are released as a benchmark with a leaderboard. Conflict of interest:
    none identified (the evaluated open models are not by the authors). Table p-values not recorded.'

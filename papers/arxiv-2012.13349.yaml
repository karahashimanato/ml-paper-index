  notes: 'Selected for the topic article requested by the user (2026-10-03): algorithm design techniques (divide and conquer, dynamic programming, branch and bound, local search) and machine learning; carded
    by a subagent. Results tables not recorded; claims only. Affiliations: DeepMind and Google Research (two datasets are Google production datasets). Datasets: CORLAT, NN Verification, Google Production
    Packing, Google Production Planning, Electric Grid Optimization, MIPLIB; most instances have 10^3-10^6 variables and constraints after SCIP presolve. Commercial solvers: the authors state lack of access
    to solver internals makes a fair comparison to commercial solvers infeasible; a partial Gurobi comparison (Neural Diving with Gurobi as sub-MIP solver, non-calibrated time) is reported on two datasets.
    Time is ''calibrated time'' measured via periodic calibration-MIP solves on a heterogeneous shared cluster (>160,000 MIP solves, nearly a million CPU and GPU hours). Best known primal bound p* precomputed
    by SCIP default with a 24-hour limit. SCIP relative gap set to 0 in Neural Diving experiments to avoid premature stopping. When Neural Diving is used inside SCIP, SCIP''s built-in primal heuristics
    are disabled. Imitation learning variant (behavioral cloning, distillation with random moves, one DAgger iteration) chosen per dataset on validation dual gap. Exactness (our reading, not stated as such
    by the paper): Neural Branching only selects the branching variable inside SCIP''s B&B; Neural Diving solves sub-MIPs with fixed variables, so on its own it gives primal solutions without an optimality
    proof. Results not recorded.'

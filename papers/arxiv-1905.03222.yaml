  notes: 'Selected for the topic article requested by the user (2026-10-06): uncertainty estimation and calibration (Bayesian approximations and ensembles, calibration measurement and recalibration, conformal
    prediction). Carded by a subagent. Results tables not recorded; claims only. Affiliation: Department of Statistics (and Mathematics), Stanford University. No venue recorded: the PDF footer says ''Preprint.
    Work in progress.'' (other papers cite it as NeurIPS 2019, not confirmed by this PDF). Theorem 2 gives separate lower/upper tail control (coverage of each tail); the stated price is slightly longer
    intervals. CQR random forests were overly conservative on the two Facebook datasets, which the authors attribute to ties among conformity scores (the upper bound of Theorem 1 then does not apply). A
    two-output network shares parameters between quantiles to reduce cost; a quantile-crossing post-processing gave a slight improvement. A variant without data splitting is mentioned (footnote 2) but not
    studied. Section numbers confirmed by cross-references in the text (Sections 2-6). Numerical table values not recorded.'

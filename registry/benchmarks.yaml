# 比較条件の登録簿(Q7)。同じIDの結果だけが比較表で並ぶ。
# 新しいIDの追加 = 「これらの条件は同一である」という明示的な判断。カード作成時に既存IDへ当てはまらなければ、
# 黙って近いIDを使わず、新しいIDとして提案すること。
# 書式は templates/benchmark-entry.yaml を参照。パイロット論文のカード化と同時に登録していく。
benchmarks:
- id: shwartzziv2021-rossmann
  scope: paper-private
  task: tabular-regression
  dataset: Rossmann Store Sales
  protocol:
    split: 2014 for train/validation (100k validation samples), 2015 for test; retrain on full training data after tuning (Appendix B).
    preprocessing: Each dataset preprocessed as in its original paper; features standardized with training-set statistics (Section 3.1.1).
    tuning: HyperOpt (Bayesian optimization), 1,000 steps per model per dataset, initial hyperparameters from the original papers; early stopping on validation (Section 3.1.2, Appendix B).
    repetitions: Three random partitions if the original split was random, otherwise four seeds on the same partition; Table 2 reports mean and SEM of four runs.
  metrics:
  - name: table2-mse
    higher_is_better: false
    definition: Value in Table 2. Caption says MSE; Section 3.1.2 says RMSE - the paper is inconsistent.
  defined_in: arxiv-2106.03253
- id: shwartzziv2021-covertype
  scope: paper-private
  task: tabular-classification
  dataset: Forest Cover Type

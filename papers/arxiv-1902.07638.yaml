proposes:
- Random search with early-stopping (ASHA) as a NAS baseline at a compute budget comparable to DARTS
- 'Random search with weight-sharing: shared weights trained with one uniformly sampled architecture per minibatch, then many random architectures ranked with the shared weights on held-out data'
claims:
- id: c1
  statement: Exact reproducibility (reproducing reported results) requires search code, evaluation code, hyperparameter-tuning documentation and random seeds; of 12 NAS papers at NeurIPS, ICML and ICLR
    since 2018, none is exactly reproducible, each missing some combination of these. Broad reproducibility (robustness of results) is hard to measure because of compute cost and the high variance of extremal
    statistics.
  location: Introduction
  page: 2
  quote: For example, of the 12 papers published since 2018 at NeurIPS, ICML, and ICLR that introduce novel NAS methods (see Table 1), none are exactly reproducible.
- id: c2
  statement: 'Weak published baselines: some NAS works compare to random search with only a few evaluations or to BO without efficient evaluation schemes, while others compare to random search with full
    training even though partial-training methods have been shown to be orders of magnitude faster.'
  location: Section 2.1 (Inadequate Baselines)
  page: 4
  quote: Some works either compare to random search given a budget of just of few evaluations [34, 41] or Bayesian optimization methods without efficient architecture evaluation schemes [23].
- id: c3
  statement: 'ASHA protocol: architectures are searched by partial training of the stage-2 evaluation network, starting at 1 epoch up to 300 epochs, promoting the top 1/4 with 4x more resource each round.
    The architecture found is then evaluated in stage (3).'
  location: Section 4 (Experiments)
  page: 9
  quote: For both benchmarks, we run ASHA with a starting resource per architecture of r = 1 epoch, a maximum resource of 300 epochs, and a promotion rate of η = 4, indicating the top 1/4 of architectures
    will be promoted in each round and trained for 4× more resource.
- id: c4
  statement: 'Hedged finding: with roughly the same compute as DARTS, random search with early-stopping is a much more competitive baseline on PTB and CIFAR-10 than the published random-search baselines;
    DARTS still outperforms it, but the gap is not nearly as large as previously suggested.'
  location: Introduction
  page: 2
  quote: While SOTA NAS methods like DARTS still outperform this baseline, our results demonstrate that the gap is not nearly as large as that suggested by published random search baselines on these tasks
    [34, 41].
- id: c5
  statement: 'Tuning asymmetry: the authors lightly tuned the meta-hyperparameters of random search with weight-sharing starting from DARTS'' settings, and it is unclear whether DARTS'' settings required
    considerable tuning; ASHA reached nearly competitive performance with its default settings at roughly the same total computation.'
  location: Section 4.3 (Computational Cost)
  page: 17
  quote: In contrast, we were able to achieve nearly competitive performance with the default settings of ASHA using roughly the same total computation as that needed by DARTS and random search with weight-sharing.
- id: c6
  statement: 'No extra tuning of final architectures: besides high variance across trials and differing convergence rates, a third potential source of variation, which could adversely affect the weight-sharing
    results, is that no additional hyperparameter tuning was done in stage (3); the training hyperparameters tuned by Liu et al. for DARTS'' final architecture were reused.'
  location: Section 4.1.3
  page: 12
  quote: we did not perform any additional hyperparameter tuning in stage (3); instead we used the same training hyperparameters that were tuned by Liu et al. [34] for the final architecture found by DARTS.
- id: c7
  statement: 'Broad reproducibility: on CIFAR-10, 2 of 5 additional independent runs of random search with weight-sharing matched the first run, while 3 underperformed (still better than ASHA); together
    with unstable rankings of DARTS architectures between 100 and 600 training epochs, this shows high variance between runs and the risk of noisy performance signals.'
  location: Section 4.2.3
  page: 16
  quote: These broad reproducibility results show that random search with weight-sharing has high variance between runs, which is not surprising given the change in intermediate rankings that we observed
    for DARTS.
- id: c8
  statement: 'Data used for selection: the CIFAR-10 meta-hyperparameter section states that in stage (1) the trained shared weights are used to evaluate randomly sampled architectures on the test set, and
    stage (2) then retrains the best one per trial from scratch for 600 epochs (Appendix A.2 instead describes the stage (1) evaluation on the validation set; see notes).'
  location: Section 4.2.2
  page: 14
  quote: In stage (1), we train the shared weights and use them to evaluate a given number of randomly sampled architectures on the test set.
- id: c9
  statement: 'Reproducibility recommendation: in traditional HPO results are standardly reported over 10 independent runs, whereas NAS results are often from a single run without exact reproducibility,
    a consequence of steep cost (this paper''s experiments took several months of wall-clock time and tens of thousands of dollars); because extremal statistics are reported, results need several independent
    runs, so more compute or more tractable benchmarks are needed, and robustness across runs should be evaluated alongside accuracy.'
  location: Section 5 (Conclusion)
  page: 18
  quote: Consequently, we conclude that either significantly more computational resources need to be devoted to evaluating NAS methods and/or more computationally tractable benchmarks need to be developed
    to lower the barrier for performing adequate empirical evaluations.

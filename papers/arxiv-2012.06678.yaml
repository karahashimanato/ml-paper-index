    3.4 splits the 15 datasets into 6 with more than 30K points and 9 others, while the captions of Table 3 and Table 4 say 8 and 12 datasets. Number of seeds: splits are fixed with one random seed so all
    models see the same conditions (Appendix B.1); no repeated seeds beyond the 5 CV splits were found. GBDT is represented only by LightGBM. Experiments ran on a single NVIDIA V100. Result tables not recorded.'

  notes: 'Selected for the topic article requested by the user (2026-10-06): anomaly detection, classical vs deep (benchmarks, isolation-based methods, self-supervised and one-class deep methods, industrial
    image anomaly detection). Carded by a subagent. Results tables not recorded; claims only. Affiliation: The Hebrew University of Jerusalem. Venue from the arXiv comment ''AAAI 2023'' (the PDF also carries
    an AAAI 2023 copyright line). Conflict of interest: the main pre-trained baseline PANDA (Reiss, Cohen, Bergman and Hoshen 2021) is by the same authors. Implementation (Appendix A.3): ImageNet ResNet152
    (last two blocks fine-tuned, 25 epochs) or ResNet18 (full backbone, 20 epochs), temperature 0.25, SGD without momentum, batch 64, SimCLR-style augmentations, kNN with k = 2; about 3 hours per dataset
    class on one RTX-2080 Ti. The appendix says ''early stopping after 25 iterations'' while A.3 says 25 epochs; the text does not reconcile the two. MVTec is evaluated at image level only (ROC-AUC), with
    no localization. k-means compression of the training features is offered as a faster scoring option with a small loss in accuracy. Section numbers 4.1 and A.2/B are confirmed by cross-references and
    appendix headings; other sections use names.'

proposes:
- meta-analysis of performance vs training computation across deep-learning benchmarks (log(1/error) regressed on log(computation))
- 'two computation measures: network operations and hardware burden'
claims:
- id: c1
  statement: 'Main claim: progress across a wide variety of deep-learning applications is strongly reliant on increases in computing power, and the authors state that extrapolating this reliance forward
    reveals that progress along current lines is rapidly becoming economically, technically and environmentally unsustainable.'
  location: Abstract
  page: 1
  quote: This article catalogs the extent of this dependency, showing that progress across a wide variety of applications is strongly reliant on increases in computing power.
- id: c2
  statement: 'Data: performance and computation data were extracted by manual review of deep-learning papers (from arXiv and benchmark sources) on established benchmarks; most papers do not report computational
    requirements, so analyses are limited to the benchmarks with enough data.'
  location: Present
  page: 6
  quote: In total, we gathered 1,526 deep learning papers, for which we did a detailed manual review for their performance and computation burden data.
- id: c3
  statement: 'Computation measure: where network operations (FLOPs per pass x passes) cannot be computed, the paper uses hardware burden (processors x computation rate x time), which the authors say also
    estimates the computation needed but is less precise because it depends on hardware implementation efficiency.'
  location: Present
  page: 7
  quote: This also estimates the computation needed, but is less precise since it depends on hardware implementation efficiency.
- id: c4
  statement: 'Data sources: hardware performance values are mostly taken from hardware designers'' official platforms (e.g. NVIDIA, Google) or public databases such as Wikipedia; models with missing details
    such as training time cannot be estimated.'
  location: Supplemental Materials (Data collection)
  page: 25
  quote: Hardware performance data are mostly gathered from external sources such as ofﬁcial hardware designers plataforms (e.g. NVIDIA, Google) or publicly-available databases (e.g. Wikipedia).
- id: c5
  statement: 'Cost conversion: projected economic and environmental costs follow Strubell et al.''s methodology for V100 GPU training, with 2022 cloud pricing and updated carbon estimates (geometric mean)
    from Dodge et al.'
  location: Future (footnote)
  page: 10
  quote: Economic and environmental costs are measured using the methodology provided by [53] for V100 GPU training.
- id: c6
  statement: 'Disagreement with within-model scaling studies: the authors hypothesize that inconsistencies with other scaling studies arise from measurement approach - ''scaling up'' measures improvements
    to the state of the art while ''scaling down'' measures performance deterioration and can yield artificially rosy estimates; they suggest the faster scaling reported for ResNet and NASNet seems to reflect
    this.'
  location: Comparison to other scaling studies
  page: 12
  quote: Put simply, the ‘scaling up’ approach measures improvements to the state of the art, whereas the ‘scaling down’ approach measures performance deterioration.
- id: c7
  statement: 'Limitation: only training costs are analysed (deployment costs depend on usage data that is not available), so the analysis is a lower bound on total computation.'
  location: Lessening the Computational Burden
  page: 13
  quote: Since total costs must necessarily be higher than just training costs, our analysis provides a lower bound on the total computation needed for any given level of performance.

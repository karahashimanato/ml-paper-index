proposes:
- 'ALEX: an updatable in-memory learned index with an adaptive RMI of linear models, Gapped Array data nodes with model-based inserts, exponential search from the predicted position, and cost-model-driven
  node expansion/splitting'
claims:
- id: c1
  statement: 'Relation to B+Trees: like a B+Tree, ALEX builds a tree, but lets different nodes grow and shrink at different rates; data nodes use a Gapped Array so that gaps absorb inserts and records can
    be placed near their predicted positions.'
  location: Introduction
  page: 1
  quote: Similar to a B+Tree, ALEX builds a tree, but allows diﬀerent nodes to grow and shrink at diﬀerent rates.
- id: c2
  statement: 'Critique of prior work (attributed): the authors characterize the original Learned Index of Kraska et al. as limited to static, read-only workloads.'
  location: Abstract
  page: 1
  quote: However, it is limited to static, read-only workloads.
- id: c3
  statement: 'Main empirical claim (abstract, for the authors'' evaluated datasets and workloads): across the spectrum of read-write workloads ALEX beats B+Trees by up to 4.1x while never performing worse,
    with up to 2000x smaller index size.'
  location: Abstract
  page: 1
  quote: Across the spectrum of read-write workloads, ALEX beats B+Trees by up to 4.1× while never performing worse, with up to 2000× smaller index size.
- id: c4
  statement: 'Guarantee and its scope: Theorem 5.1 bounds RMI depth by the density of the densest subregion of the key space (B+Trees bound depth by the number of keys) (m = max node size, p = minimum number
    of equal-width partitions each holding at most m*d_u keys), and maximal depth can be maintained under inserts; the authors add that this analysis gives intuition about RMI depth but does not reflect
    worst-case guarantees in practice.'
  location: Bound on RMI depth
  page: 8
  quote: We can construct an RMI that satisﬁes the max node size and upper density limit constraints whose depth is no larger than ⌈logmp⌉—we call this the maximal depth.
- id: c5
  statement: 'Baseline tuning: for each dataset and workload, grid search tunes the page size of B+Tree and Model B+Tree and the number of models of the Learned Index for best throughput, whereas ALEX itself
    is not tuned (unless users add constraints). The B+Tree is the STX B+Tree and the Learned Index is the authors'' best-effort reimplementation (two-level RMI, linear models, binary search).'
  location: Experimental Setup
  page: 9
  quote: For each dataset and workload, we use grid search to tune the page size for B+Tree and Model B+Tree and the number of models for Learned Index to achieve the best throughput.
- id: c6
  statement: 'Reimplementation detail (attributed): in private communication the authors of the original Learned Index told the ALEX authors that a neural-net root model usually does not justify its added
    complexity given minor performance gains, which the ALEX authors say they verified independently.'
  location: Experimental Setup
  page: 9
  quote: Inprivatecommunicationwiththeauthorsof[19], welearnedthattheadded complexity of using a neural net for the root model usually is not justiﬁed by theresultingminorperformancegains, whichwealsoindependentlyveriﬁed.
- id: c7
  statement: 'Limitations / future work stated: open theoretical problems about ALEX performance, support for secondary storage for larger-than-memory datasets, and concurrency control tailored to ALEX.'
  location: Conclusion
  page: 14
  quote: We intend to pursue open theoretical problems about ALEX performance, supporting secondary storage for larger than memory datasets, and new concurrency control techniques tailored to the ALEX design.

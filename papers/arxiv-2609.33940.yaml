  notes: 'Approved from candidate issue #2 (2026-10-02); carded by a subagent. Results tables not recorded; claims only. Off-theme for stream drift detection: per-episode failure prediction for world-model
    planning under an induced goal-offset shift; ''distribution-shift detectors'' in the abstract refers to this failure-prediction AUC. dataset-shift-detection is used as the closest task tag; saliency-maps
    because centroid-based saliency maps are one of the proposed tools; post-hoc because the signals are read from a trained world model without changing it. Baselines are activation-based signals (embedding
    cost, activation calibration, OMP/SAE goal codes) and a reconstruction-error analogue of VAE-based monitoring; no classical drift detectors. The main text says the per-layer OOD AUC profile (Figure
    6) motivated the task-adaptive layer heuristic, so layer choice was informed by outcome-labeled evaluation data. The conclusion states that in-distribution the centroid and activation views are largely
    interchangeable.'

proposes:
- methodology for measuring learning curves (generalization error vs training set size) and best-fit model size vs training set size on training-set shards
claims:
- id: c1
  statement: 'Contribution: the paper presents a large-scale empirical characterization of how generalization error and model size grow as training sets grow, tested on machine translation, language modeling,
    image processing and speech recognition.'
  location: Abstract
  page: 1
  quote: This paper presents a large scale empirical characterization of generalization error and model size growth as training sets grow.
- id: c2
  statement: 'Main empirical claim: in real applications the authors find the learning-curve exponent usually settles in a range that is shallower than the exponents predicted by prior theory and is unexplained
    by that theory.'
  location: Introduction
  page: 2
  quote: Unfortunately, in real applications, we ﬁnd empirically that βg usually settles between −0.07 and −0.35, exponents that are unexplained by prior theoretical work.
- id: c3
  statement: 'Architecture vs exponent: model improvements only shift the error and do not appear to affect the power-law exponent (hedged as ''do not appear'').'
  location: Abstract
  page: 1
  quote: Further, model improvements only shift the error but do not appear to affect the power-law exponent.
- id: c4
  statement: 'Experimental range (protocol): each training set is randomly shuffled and split into shards spanning 2-3 orders of magnitude in steps of roughly 2x, all scored on a single validation set disjoint
    from every shard.'
  location: Measuring model accuracy and size scaling with training data size
  page: 4
  quote: We then subdivide T into shard sizes that span 2-3 orders of magnitude in steps of roughly 2×
- id: c5
  statement: 'Model size vs data: the best-fit model size grows sublinearly with training set size (equivalently, the data set grows faster than linearly with best-fit model size).'
  location: Abstract
  page: 1
  quote: We also show that model size scales sublinearly with data size.
- id: c6
  statement: 'Caveat: as training set sizes grow, optimization becomes harder and models run out of capacity, so the empirical error tends away from the power-law trend; the authors say a more exhaustive
    hyperparameter search would be needed to get closer to the trend.'
  location: Neural machine translation
  page: 6
  quote: We also note that as training set sizes grow, optimization becomes more difﬁcult and models run out of capacity, so the empirical error tends away from the power-law trend.
- id: c7
  statement: 'Limitation: the authors report running into compute limitations (most frequently GPU memory) for the largest data sets of each application domain.'
  location: Operational implications
  page: 12
  quote: After reviewing the tests performed for this work, we ﬁnd that we have run into compute limitations for the largest data sets of each application domain.

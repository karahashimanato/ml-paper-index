proposes:
- 'CIN-RiskNet: feature-gated TabTransformer encoder with SMOTE + Gaussian-noise augmentation'
claims:
- id: c1
  statement: CIN-RiskNet combines adaptive feature gating, SMOTE oversampling and multi-head self-attention in a TabTransformer.
  location: Abstract
  page: 1
  quote: The approach includes adaptive feature gating to suppress noise, synthetic minority oversampling to address class imbalance, and multi-head self-attention to capture complex feature interactions.
- id: c2
  statement: 'Data and protocol: single-center cohort of 1,679 PCI patients (103 with CIN), evaluated with five-fold cross-validation; SMOTE and noise were applied only to the training subset of each fold,
    and 20% of each training set was held out for validation.'
  location: Model training and evaluation protocol
  page: 9
  quote: Importantly, in each fold, SMOTE and Gaussian noise were applied strictly to the training subset only, while validation and test subsets were kept untouched to prevent synthetic-sample leakage.
- id: c3
  statement: Baselines (logistic regression, random forest, XGBoost, SVM, MLP) used identical splits and preprocessing; how their hyperparameters were set is not found in the text.
  location: Results
  page: 10
  quote: To ensure fairness in model comparisons, all methods adopted identical training/testing splits, uniform data preprocessing pipelines, and 5-fold cross-validation.
- id: c4
  statement: The paper reports CIN-RiskNet had the highest recall and F1 among the evaluated models, while random forest and XGBoost had slightly higher accuracy.
  location: Results
  page: 10
  quote: Among all compared models, CIN-RiskNet achieved the highest recall (0.9540) and F1-score (0.9542), substantially outperforming traditional machine learning baselines in detecting minority-class
    samples (Table 4).
- id: c5
  statement: The Mehran comparator is a modified version built from available variables because several original Mehran variables were not recorded.
  location: Comparison with clinical scoring
  page: 9
  quote: We therefore constructed a modified Mehran-like comparator using available variables (age, diabetes, contrast volume, baseline Scr/eGFR) to provide a pragmatic local benchmark.
- id: c6
  statement: 'Limitation: single-center retrospective study; external multicenter validation is still required.'
  location: Limitations
  page: 14
  quote: First, this was a single-center retrospective study, which limits external generalizability despite the relatively large cohort (n = 1,679).

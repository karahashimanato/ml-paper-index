  notes: 'Selected for the topic article requested by the user (2026-10-03): model fallback and model selection in MLOps (meta-learned selection, dynamic selection, abstention/deferral, switching triggers,
    cascades/routing, monitoring); carded by a subagent. Results tables not recorded; claims only. PDF states: Published as a conference paper at ICLR 2025. Affiliations: UC Berkeley, Anyscale, Canva; funding
    acknowledgment lists gifts from Accenture, AMD, Anyscale, Google, IBM, Intel, Microsoft, MBZUAI, Samsung SDS, SAP, Uber and VMware. Several authors (Chiang, Gonzalez, Stoica) are among the authors of
    the Chatbot Arena paper (Chiang et al., 2024; source of the training data) and of the MT Bench / LLM-as-a-judge paper (Zheng et al., 2023; one of the evaluation benchmarks and the judge protocol used
    for the augmentation labels), per the reference list. Stoica is also affiliated with Anyscale, which is among the listed gift funders. Evaluated models: OpenAI GPT-4, Mistral Mixtral 8x7B, Anthropic
    Claude 3 Opus/Sonnet, Meta Llama 3.1; OpenAI text-embedding-3-small is used for embeddings. Cost in the metrics (and in the abstract''s ''over 2 times'') is the share of calls to the strong model, not
    dollars. The Table 6 ''cost saving ratio'' (up to 3.66x) is the inverse ratio of GPT-4 calls of the best router vs. the random baseline; dollar prices enter only as the justification that GPT-4 cost
    dominates (estimated averages of $24.7 for GPT-4, from gpt-4-1106 list prices and assumed prompt/response lengths, and $0.24 for Mixtral per million tokens; Appendix D). Appendix E compares against
    commercial routers (Unify AI, Martian) on MT Bench. Router overhead measured on Google Cloud VMs (Table 7). The paper says it open-sources the framework but no code URL was found in the PDF text. It
    criticizes Hybrid LLM (arxiv-2404.14618) for evaluating only on the MixInstruct test split without out-of-domain evidence (Related work).'

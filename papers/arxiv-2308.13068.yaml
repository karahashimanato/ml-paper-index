id: arxiv-2308.13068
title: 'Multivariate Time Series Anomaly Detection: Fancy Algorithms and Flawed Evaluation Methodology'
authors:
- Mohamed El Amine Sehili
- Zonghua Zhang
year: 2023
links:
  arxiv: https://arxiv.org/abs/2308.13068
  code: https://github.com/amsehili/MVTSEvalPaper

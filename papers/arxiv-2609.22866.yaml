claims:
- id: c1
  statement: Causilo is a tabular foundation model aiming at frontier predictive performance with very fast inference.
  location: Abstract
  page: 1
  quote: We introduce Causilo, a tabular foundation model (TFM) that combines frontier predictive performance with exceptionally fast inference.
- id: c2
  statement: Causilo follows TabICL's column-then-row architecture and adds a row-refinement module before row compression.
  location: Abstract
  page: 1
  quote: Causilo follows TabICL’s column-then-row architecture but introduces another row-refinement module before row compression.
- id: c3
  statement: Pretrained on about 36M synthetic tables, Causilo reports frontier-level performance with substantially faster inference on TabArena, BeyondArena and ScoringBench.
  location: Abstract
  page: 1
  quote: Pretrained on approximately 36M synthetic tables, Causilo delivers strong benchmark results across TabArena, BeyondArena, and ScoringBench, achieving frontier-level performance with substantially
    faster inference.
- id: c4
  statement: TabArena comparisons use the latest public results as of 18 September 2026, with Elo computed over the full leaderboard including system submissions such as AutoGluon.
  location: Evaluation (TabArena)
  page: 7
  quote: We use the latest public results as of 18 September 2026 and Elo ratings are computed over the full leaderboard, including system submissions such as AutoGluon [21]
- id: c5
  statement: BeyondArena has 142 curated datasets with IID, temporal and grouped splits, varied sizes, and tables with text or high-cardinality categoricals.
  location: Evaluation (BeyondArena)
  page: 9
  quote: Its 142 curated datasets span IID, temporal, and grouped splits, a wide range of sample sizes and feature counts, and tables with text or high-cardinality categorical features.
- id: c6
  statement: For BeyondArena, published baseline results are reused and only Causilo is evaluated locally.
  location: Evaluation (BeyondArena)
  page: 9
  quote: We therefore use its published baseline results and add only Causilo, which we evaluate locally.

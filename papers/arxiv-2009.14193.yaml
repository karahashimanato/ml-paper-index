  notes: 'Selected for the topic article requested by the user (2026-10-06): uncertainty estimation and calibration (Bayesian approximations and ensembles, calibration measurement and recalibration, conformal
    prediction). Carded by a subagent. Results tables not recorded; claims only. Affiliation: UC Berkeley (EECS and Statistics); Angelopoulos and Bates contributed equally. Venue from the arXiv comment
    (''ICLR 2021 Spotlight''); the PDF text itself does not state the venue. APS is from Romano et al. (2020), not by these authors. Proposition 2: with lambda = 1 and k_reg <= k* (smallest top-k size covering
    on calibration data), RAPS sets are contained in the top-k* set. Proposition 1''s upper bound requires all class probabilities > 0. Appendix B: randomization is needed for exact 1 - alpha coverage;
    turning it off gives slightly conservative sets. Appendix F compares to LAC (Least Ambiguous Set-valued Classifier; the citation is unresolved (''?'') in the PDF): LAC has slightly smaller sets but
    worse adaptiveness. The automatic lambda for adaptiveness (Section 4.2) is chosen from a small grid minimizing SSCV on the tuning set. The same authors later wrote the conformal tutorial arXiv 2107.07511.
    Numerical table values not recorded.'

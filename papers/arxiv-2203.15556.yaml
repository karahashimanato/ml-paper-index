proposes:
- compute-optimal allocation of model size and training tokens estimated by three approaches (minimum over training curves, IsoFLOP profiles, parametric loss fit L(N, D) = E + A/N^alpha + B/D^beta)
- Chinchilla (70B parameters, 1.4T tokens, same compute budget as Gopher)
claims:
- id: c1
  statement: 'Main claim: from over 400 language models (70M to over 16B parameters, 5B to 500B tokens), the paper finds that for compute-optimal training model size and training tokens should be scaled
    equally, i.e. doubling the model size should go with doubling the training tokens.'
  location: Abstract
  page: 1
  quote: 'we ﬁnd that for compute-optimal training, the model size and the number of training tokens should be scaled equally: for every doubling of model size the number of training tokens should also
    be doubled.'
- id: c2
  statement: 'Experimental range as stated in the Introduction: losses of over 400 models from under 70M to over 16B parameters trained on 5B to over 400B tokens, each configuration trained for several
    training horizons (the abstract says 5 to 500 billion tokens).'
  location: Introduction
  page: 2
  quote: We empirically estimate these functions based on the losses of over 400 models, ranging from under 70M to over 16B parameters, and trained on 5B to over 400B tokens – with each model conﬁguration
    trained for several diﬀerent training horizons.
- id: c3
  statement: 'Agreement of the three approaches: all three suggest scaling model size and data in approximately equal proportions; the paper notes that Approach 3 (parametric fit) predicts even smaller
    optimal models at larger budgets, which it attributes to the Huber loss treating low-compute points as outliers together with the observed negative curvature of the frontier.'
  location: Section 3.4 (Optimal model scaling)
  page: 7
  quote: The third approach predicts even smaller models being optimal at larger compute budgets.
- id: c4
  statement: 'Disagreement with Kaplan et al. (2020), as stated by this paper: Kaplan et al. used a fixed number of training tokens and learning-rate schedule for all models; this paper argues that using
    intermediate losses of such runs underestimates training on less data and contributes to Kaplan et al.''s conclusion that model size should grow faster than data. It also notes that most of its models
    exceed 500M parameters whereas many of Kaplan et al.''s runs are below 100M.'
  location: Related Work
  page: 3
  quote: Using these intermediate losses results in underestimating the eﬀectiveness of training models on less data than 130B tokens, and eventually contributes to the conclusion that model size should
    increase faster than training data size as compute budget increases.
- id: c5
  statement: 'Compute counting: training FLOPs include those of the embedding matrices, and embedding matrices are also counted in the parameter count (the paper states the embedding contribution is small
    for large models); the appendix compares its detailed FLOP count with the 6ND approximation and reports the differences as very small.'
  location: Appendix F (FLOPs computation)
  page: 27
  quote: We include all training FLOPs, including those contributed to by the embedding matrices, in our analysis.
- id: c6
  statement: 'Limitation on the power-law assumption: the paper assumes the compute-optimal frontier is a power law in compute, model size and tokens, but observes some concavity in log N_opt at high compute,
    which it says suggests it may still be overestimating the optimal size of large models.'
  location: Discussion & Conclusion
  page: 15
  quote: This suggests that we may still be overestimating the optimal size of large models.
- id: c7
  statement: 'Limitations on scale and epochs: due to cost there are only two comparable large-scale runs (Chinchilla and Gopher) and no tests at intermediate scales, and all analysis runs used less than
    one epoch of data, with the multi-epoch regime left to future work.'
  location: Discussion & Conclusion
  page: 15
  quote: Finally, the training runs for our analysis have all been trained on less than an epoch of data; future work may consider the multiple epoch regime.

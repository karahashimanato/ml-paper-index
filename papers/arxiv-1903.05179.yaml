proposes:
- 'Unbiased feature importance (UFI): a post hoc correction of split-improvement (MDI / Gini) importance that evaluates the impurity decrease of each split on out-of-sample data (out-of-bag samples in random
  forests), with an unbiasedness guarantee for features with no predictive power'
claims:
- id: c1
  statement: 'Problem: split-improvement importance (Gini importance / MDI) in random forests and other tree-based methods has been shown to be biased towards features with more potential splits; the paper
    proposes a correction that uses split-improvement measured on out-of-sample data.'
  location: Abstract
  page: 1
  quote: These methods have been shown to be biased towards increasing the importance of features with more potential splits.
- id: c2
  statement: Citing Hooker (2007), Strobl et al. (2008) and Hooker and Mentch (2019), the authors note that permutation importance is applicable to any function but has been critiqued for forcing the model
    to extrapolate.
  location: Introduction
  page: 1
  quote: These have the advantage of being applicable to any function, but have been critiqued by Hooker (2007); Strobl et al. (2008); Hooker and Mentch (2019) for forcing the model to extrapolate.
- id: c3
  statement: 'Bias demonstration with no signal: X1 ~ N(0,1) continuous and X2-X5 categorical with 2, 4, 10 and 20 equiprobable categories (dummy-encoded, importances summed), response independent of all
    X; 100 repetitions of n = 1000, scikit-learn random forests with default parameters unless noted, 100 trees of maximum depth 5. Features with more categories (and the continuous one) receive larger
    importance, and all five get positive scores.'
  location: Section 3 (Bias in Split-Improvement)
  page: 6
  quote: Also note that all ﬁve features get positive importance scores, though we know that they have no predictive power for the target value y.
- id: c4
  statement: 'Explanation and fix: the authors liken the bias to overfitting, because each split favours features with more flexibility to fit the training data; the fix computes the impurity on separate
    test data, which in random forests are the out-of-bag samples of each tree (the estimation half of honest trees or a held-out test set can also be used).'
  location: Section 4 (Unbiased Split-Improvement)
  page: 7
  quote: The vanilla version of split-improvement is just like using train error for evaluating model performance.
- id: c5
  statement: 'Guarantee (Theorems 2 and 4): if y is independent of X_j in every hyper-rectangle subset of the feature space, the expected corrected importance of X_j in a tree is 0 (classification with
    Gini, regression with MSE), extended to RF by averaging. The authors note the condition is implied by independence of X_j from both y and the other features, and may be stronger than necessary.'
  location: Section 4 (Classification)
  page: 9
  quote: Our condition may also be stronger than necessary, depending on the tree-building process.
- id: c6
  statement: 'Regression detail: summing only the test-data impurity decreases would give negative values, because the node means overfit the training data and inflate test error deep in the tree; the regression
    version therefore sums the training and test decreases.'
  location: Section 4 (Regression)
  page: 9
  quote: In other words, it over-corrects the bias.
- id: c7
  statement: 'Empirical evaluation: UFI is compared with default scikit-learn split-improvement (SI), cforest (R party) and the bias-corrected impurity of ranger on one simulation (10 features, only the
    binary X1 informative, tree depth 3 and 10, 100 repetitions) and three real datasets (RNA editing, Adult with an added random feature, Boston Housing with an added random feature); Li et al. (2019)
    is excluded because it lacks the unbiased property. The authors state the bias of SI is more severe in deeper trees and that, without ground truth on real data, UFI gives outputs similar to cforest
    and ranger.'
  location: Section 5 (Summary)
  page: 13
  quote: For real world data sets, though we do not have a ground truth for feature importance scores, our method gives similar and meaningful outputs as two state-of-the-art methods cforest and ranger.
- id: c8
  statement: 'Scope and open issues: all examples use random forests, and the extension to other tree-based models is stated but not evaluated. The authors note that feature importance is very difficult
    to define exactly, mention the discussion of subtleties with correlated predictors (citing Strobl et al., 2008; Gregorutti et al., 2017), and name clarifying the relationship between split-improvement
    and the topology of the fitted function as a future research direction.'
  location: Section 6 (Discussions)
  page: 14
  quote: Though our examples are based on Random Forests, the adjustment can be easily extended to any other tree-based model.

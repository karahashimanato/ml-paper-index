  notes: 'Selected for the topic article requested by the user (2026-10-07): Bayesian change point detection (online BOCPD and its extensions, offline Bayesian changepoint analysis, evaluation and applications).
    Carded by a subagent. Results tables not recorded; claims only. Affiliations: HEC Montreal (GERAD), EDHEC Business School, Laval University. No venue: the PDF states only that preliminary versions were
    presented at R/Finance 2019, the Econometric Society & Bocconi Virtual World Congress 2020 and the EEA Virtual Congress 2020 (not recorded as venue); no arXiv comment. Section numbers are confirmed
    by the outline paragraph (''In Section 2 ... Section 7 concludes'') and the cross-reference ''see Section 2.3''. The proposed MDL-based methods (BSMDL, WBSMDL, GMDL, PGMDL, SEL) are the authors'' own
    adaptations compared against existing BS/WBS (wbsts package defaults) and LRSM; footnote 5 notes their LRSM results are more favorable than Yau and Zhao''s because of estimator differences. Full Bayesian
    model (Section 5): conditions on the number of breaks from an existing CP method, uses a truncated binomial prior centred at the estimated CPs (an informative, data-derived prior), integrates out segment
    parameters and samples CPs with D-DREAM (Bauwens, Dufays and De Backer, 2014a, co-authored by A. Dufays); an optional geometric out-of-sample break prior follows Pesaran et al. (2006). The introduction
    argues Bayesian credible intervals for break locations do not overlap and remain in-sample. Applications: Fama-French five-factor model on daily bank-portfolio returns 1963-2022 (32 factor subsets x
    11 local methods) and monthly U.S. CPI forecasting (expanding window, 817 out-of-sample points, model confidence set). Results tables not recorded.'

# 新着論文の候補検出の設定(scripts/find_candidates.py が読む)。
# AIは使わない。arXiv のキーワード検索と、既存カードを引用している新しい論文(Semantic Scholar)を候補にする。
# 候補は GitHub Issue に一覧され、チェックを付けたものだけをローカルでカード化する(Q8-D、Q9-C)。
lookback_days: 8            # arXiv の新着として扱う日数(週1回実行なので少し重ねる)
citation_lookback_days: 60  # 引用している論文として扱う公開日の範囲(Semantic Scholar の反映は遅れることがある)
max_per_query: 40           # arXiv の1検索あたりの最大取得件数
min_citations: 2            # 引用経由の候補は、既存カードをこの本数以上引用しているものだけ(1本だけの引用は応用論文が大半のため)
show_per_theme: 25          # Issue でテーマごとに展開表示する件数(残りは折りたたみ。どちらも次回以降は重複除外される)

themes:
  - name: 表データ(GBDT・深層学習・基盤モデル)
    tags: [tabular-classification, tabular-regression]
    arxiv_queries:
      - 'abs:"tabular data" AND (abs:"gradient boost" OR abs:"foundation model" OR abs:benchmark OR abs:"deep learning") AND (cat:cs.LG OR cat:stat.ML)'
  - name: ドリフト検出
    tags: [drift-detection, concept-drift-detection, dataset-shift-detection]
    arxiv_queries:
      - '(abs:"concept drift" OR abs:"dataset shift" OR abs:"distribution shift") AND abs:detect AND (cat:cs.LG OR cat:stat.ML)'
  - name: 時系列の異常検知
    tags: [time-series-anomaly-detection]
    arxiv_queries:
      - 'abs:"time series" AND abs:"anomaly detection" AND (abs:benchmark OR abs:evaluation OR abs:"point adjust" OR abs:baseline) AND (cat:cs.LG OR cat:stat.ML)'
  # 以下2テーマは投稿数が多いため、手法の新提案ではなく「評価・検証」の論文に絞った検索語にしている
  - name: モデルの解釈可能性
    tags: [model-explanation]
    arxiv_queries:
      - '(abs:explanation OR abs:interpretability OR abs:attribution OR abs:SHAP) AND (abs:faithfulness OR abs:"sanity check" OR abs:evaluation OR abs:benchmark OR abs:disagreement) AND (cat:cs.LG OR cat:stat.ML)'
  - name: 量子化による影響
    tags: [model-compression]
    arxiv_queries:
      - 'abs:quantization AND (abs:evaluation OR abs:degradation OR abs:empirical OR abs:benchmark OR abs:trustworthiness OR abs:fairness) AND (cat:cs.LG OR cat:cs.CL)'
  - name: 時系列基盤モデルと予測
    tags: [time-series-forecasting, time-series-foundation-model]
    arxiv_queries:
      - 'abs:"time series" AND abs:forecasting AND (abs:"foundation model" OR abs:"zero-shot" OR abs:benchmark OR abs:pretrained) AND (cat:cs.LG OR cat:stat.ML)'
  - name: 学習モデルと計算量
    tags: [scaling-laws, efficiency-evaluation]
    arxiv_queries:
      - '(abs:"scaling law" OR abs:"scaling laws" OR abs:"compute-optimal" OR abs:"test-time compute") AND (cat:cs.LG OR cat:cs.CL OR cat:stat.ML)'
  - name: 古典アルゴリズムと機械学習
    tags: [learned-indexes, learning-augmented-algorithms, algorithm-learning, differentiable-sorting]
    arxiv_queries:
      - '(abs:"learned index" OR abs:"learning-augmented" OR abs:"algorithms with predictions" OR abs:"differentiable sorting" OR abs:"algorithmic reasoning") AND (cat:cs.LG OR cat:cs.DS OR cat:cs.DB)'

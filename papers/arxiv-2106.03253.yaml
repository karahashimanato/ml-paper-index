  reviewed: false
  notes: 'Results r1-r96 were extracted mechanically from the PDF text of Table 2 and Table 3 (not typed by hand). Inconsistencies in the paper: (1) regression metric is RMSE in Section 3.1.2 but MSE in
    the Table 2 caption (c11, c12); (2) Section 3.2 text quotes rounded/different Table 3 values (e.g. XGBoost 3.4% vs 3.34, DNF-Net 11.8% vs 11.96); (3) the classical-model ensemble (XGBoost+SVM+CatBoost)
    is said to be in Table 2, but Table 2 has no row with that name - it is unclear whether ''Simple Ensemble'' is that ensemble; (4) Appendix B lists ''Year'' under both the 80/20 split and the 70/10/20
    split, and does not describe the Gas split.'

  notes: 'Selected for the method article requested by the user (2026-10-10): knowledge distillation and pruning (soft targets and temperature, hint-based and self distillation, teacher-student gaps and
    fidelity; magnitude, gradual, single-shot, movement and LLM pruning, lottery tickets, and how pruning is evaluated). Carded by a subagent. Results tables not recorded; claims only. Affiliation: Cornell
    University. Venue from the arXiv journal_ref (ICCV 2019); the arXiv v1 PDF itself has no venue line. Section numbers are from numbered headings in the PDF. Tables 1-10 are not recorded. Body-text numbers:
    the best ESKD students (early-stopped ResNet34 and fully-trained ResNet18 teachers) reach about 29.01% top-1 error, about 1.23 points better than scratch (Section 5.5); some Table 7/8 entries are numbers
    inherited from the original papers (marked *), not re-run. With tau = 20 on ImageNet, high temperature improved ESKD but showed no visible difference for full KD (Section 5.6). Section 5.6 also reports
    that conclusions hold for mixed DenseNet/WideResNet pairs and for transfer to Places365 (the authors write ''proving'' for the latter). Conclusion: KD ''is not a panacea and cannot succeed when student
    capacity is too low to successfully mimic the teacher''. Cited by arxiv-2106.05945 (Stanton et al.).'

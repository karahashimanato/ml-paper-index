claims:
- id: c1
  statement: An ML model is trained on 27 geometric descriptors of the local ice-adsorbate environment to predict binding energies.
  location: Abstract
  page: 1
  quote: We trained a machine-learning model using 27 geometric descriptors of the local ice–adsorbate environment.
- id: c2
  statement: The model is trained on binding energies of 13 adsorbates and evaluated with pooled leave-one-cluster-out validation across 15 ice surfaces.
  location: Abstract
  page: 1
  quote: The model was trained on binding energies for 13 adsorbates on amorphous solid water clusters and evaluated through pooled leave-one-cluster-out validation across 15 ice surfaces.
- id: c3
  statement: Linear regression, ridge regression, random forest and XGBoost were compared, and XGBoost had the highest test-set accuracy.
  location: Methods (model training)
  page: 3
  quote: XGBoost achieved the highest test-set accuracy
- id: c4
  statement: XGBoost uses fixed hyperparameters. A randomized-search cross-validation over hyperparameter combinations improved results only marginally.
  location: Methods (model training)
  page: 3
  quote: Hyperparameter tuning via randomised-search cross-validation, in which 80 randomly sampled hyperparameter combinations are each scored by 5-fold cross-validation
- id: c5
  statement: Gradient-boosted trees were chosen over deep learning because, at this data size, boosted trees are competitive on tabular data and their feature attributions give mechanistic insight.
  location: Discussion
  page: 10
  quote: boosted trees are competitive on tabular data of this scale
- id: c6
  statement: 'Limitation: performance collapses for dispersion-dominated adsorbates, which the authors describe as consistent with the absence of electronic information in the descriptors.'
  location: Discussion
  page: 10
  quote: performance collapses for dispersion-dominated adsorbates

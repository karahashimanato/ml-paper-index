  statement: On six real-world datasets and four Kaggle competitions, SymboLLM-FE outperforms existing AutoFE methods.
  location: Abstract
  page: 1
  quote: Empirical re- sults on six real-world datasets and four Kaggle competitions demonstrate that SymboLLM-FE outperforms existing AutoFE.
- id: c3
  statement: 'Evaluation protocol: a fold-wise protocol within cross-validation is used.'
  location: Method

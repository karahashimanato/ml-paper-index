  notes: 'Approved from candidate issue #2 (2026-10-02); carded by a subagent. Results tables not recorded; claims only. Stream classification with drift adaptation, not a drift-detector benchmark: change
    detectors are used inside tree leaves to trigger splits and in ensembles (ARF/SRP/ARTE) for resets; no detection metrics (delay, false alarms, missed detections) are reported. Drift reaction is assessed
    only by F1-Score curves over time with the known drift points of the synthetic streams marked; the drift type of most real-world streams is listed as Unknown (INSECTS variants are labeled abrupt/incremental/gradual).
    Detector parameter settings beyond the HDDM_A choice were not found in the text. Tuning the base learners'' hyperparameters is listed as future work. SGBT was excluded for computational cost. The authors
    also proposed LAST (the main adaptive baseline) in earlier work. Code/results site in the PDF: https://sites.google.com/view/last-ensemble (not added to links because it is not a code repository URL).'

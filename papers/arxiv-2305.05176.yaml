proposes:
- 'FrugalGPT: an LLM cascade over commercial LLM APIs that queries a learned list of APIs in sequence and stops when a learned generation scoring function (a DistilBERT regressor in the case study) scores
  the answer above a per-position threshold; the API list and thresholds are chosen by a constrained optimization under an average-cost budget. Also outlines prompt adaptation and LLM approximation (completion
  cache, fine-tuning) as cost-reduction strategies'
claims:
- id: c1
  statement: 'Switching signal: the cascade decides whether to accept an API''s answer or call the next API using a generation scoring function g(query, answer) in [0,1]; the authors state it can be obtained
    by training a simple regression model that predicts whether a generation is correct from the query and the generated answer (i.e. the score is computed after the cheaper model has answered).'
  location: LLM cascade
  page: 5
  quote: The scoring function can be obtained by training a simple regression model that learns whether a generation is correct from the query and a generated answer.
- id: c2
  statement: 'Thresholds and budget: the API list and the per-position threshold vector are learned jointly by maximizing expected reward subject to an average-cost budget b; because this is a mixed-integer
    problem, the authors use a specialized optimizer that prunes API lists with small answer disagreement and approximates the objective by interpolation over a few samples.'
  location: LLM cascade
  page: 6
  quote: To address this issue, we develop a specialized optimizer that (i) prunes the search space of L by ignoring any list of LLMs with small answer disagreement, and (ii) approximates the objective
    by interpolating it within a few samples.
- id: c3
  statement: 'Evaluation setup (models and cost): 12 commercial LLM APIs from OpenAI, AI21, CoHere, Textsynth and ForeFrontAI; cost is computed from the providers'' per-token input/output prices and per-request
    fees (Table 1, prices retrieved March 2023).'
  location: Experiments
  page: 6
  quote: We have selected 12 LLM APIs from 5 mainstream providers, namely, OpenAI [Ope], AI21 [AI2], CoHere [CoH], Textsynth [Tex], and ForeFrontAI [FFA].
- id: c4
  statement: 'Evaluation protocol: three datasets (HEADLINES financial news, OVERRULING legal sentences, COQA reading comprehension adapted to direct query answering), cascade length fixed at 3, and each
    dataset randomly split into a training set used to learn the cascade (its components being the scoring function and the API list with thresholds) and a test set. Thresholds are thus set on the training
    split; no separate validation split for threshold setting or scorer tuning was found in the text, and no shifted or out-of-distribution test set is used (random split only).'
  location: Experiments
  page: 6
  quote: Each dataset is randomly split into a training set to learn the LLM cascade and a test set for evaluation.
- id: c5
  statement: 'Main empirical claim (abstract): FrugalGPT can match the best individual LLM (e.g. GPT-4) with up to 98% cost reduction, or improve accuracy over GPT-4 by 4% at the same cost.'
  location: Abstract
  page: 1
  quote: Our experiments show that FrugalGPT can match the performance of the best individual LLM (e.g. GPT-4) with up to 98% cost reduction or improve the accuracy over GPT-4 by 4% with the same cost.
- id: c6
  statement: 'Failure mode of the switching mechanism: in an example where all LLMs in the chain give the same answer, FrugalGPT is unsure whether the first LLMs are correct and queries every LLM in the
    chain; the authors call avoiding such cases an open problem.'
  location: Experiments
  page: 10
  quote: However, FrugalGPT is unsure if the ﬁrst LLMs are correct, resulting in the need to query all LLMs in the chain.
- id: c7
  statement: 'Stated limitations: training the cascade needs labeled examples, and for the cascade to work well the training examples should come from the same or a similar distribution as the test examples;
    learning the cascade is an upfront cost that pays off when the final query set is larger than the training data.'
  location: Discussions, Limitations and Future Prospects
  page: 10
  quote: And in order for the cascade to work well, the training examples should be from the same or similar distribution as the test examples.

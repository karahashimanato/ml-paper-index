  notes: 'Selected for the method article requested by the user (2026-10-11): aligning language models with human preferences (preference comparisons and reward models, PPO-based RLHF with a KL penalty,
    AI feedback, direct preference optimization and its variants, reward overoptimization, length bias, reward-model evaluation, and open problems). Carded by a subagent. Results tables not recorded; claims
    only. Affiliation: OpenAI (all authors; some ''work done while at OpenAI''). Conflict of interest: the authors evaluate OpenAI''s own models (GPT-3, InstructGPT) on prompts from OpenAI API customers,
    with labelers instructed by the authors; Section 5.2 states they are aligning ''to our preferences, as the researchers designing this study (and thus by proxy to our broader research organization, OpenAI)''.
    The few-shot GPT-3 prefix baseline came from a one-hour prefix-finding competition between two authors (footnote 6). No venue recorded: the arXiv v1 PDF and the arXiv record (no comment/journal_ref)
    do not state one. Section numbers are from the cross-reference list at the end of the Introduction (3.1-3.6, 4.1-4.3, 5.1-5.5). Appendix C.4 gives beta = 0.02 for the KL reward and gamma = 27.8 for
    the pretraining gradients, 256k RL episodes, PPO clip ratio 0.2, and a 6B RM and 6B value function for all policy sizes. Section 5.3 limitations: most comparisons are labeled by only 1 contractor for
    cost reasons; the models in most cases follow the user''s instruction even if that could lead to harm; Section 5.4 notes PPO-ptx does not completely mitigate regressions and may make some undesirable
    behaviors more likely. During training labelers prioritized helpfulness, while in final evaluations they were asked to prioritize truthfulness and harmlessness (Section 3.4). Toxicity: less toxic than
    GPT-3 only when prompted to be respectful; no improvement on Winogender/CrowS-Pairs bias (Section 4.2).'

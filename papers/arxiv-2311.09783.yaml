  notes: 'Selected for the topic article requested by the user (2026-10-11): pitfalls in evaluating large language models (benchmark contamination and its detection, prompt and answer-format sensitivity,
    LLM-as-a-judge biases, human-preference arenas, holistic evaluation, benchmark errors, and reproducibility of evaluation harnesses). Carded by a subagent. Results tables not recorded; claims only. Affiliations:
    Georgia Institute of Technology, Yale University, Allen Institute for AI. Venue from the arXiv comment (''NAACL 2024 Version''); the PDF text itself does not name the venue. Section numbers 3.1.2 and
    4.2.1 appear only as cross-references (''Section 3.1.2'', ''§ 4.2.1''); the extracted headings carry no numbers, so other locations use section names. Inconsistency in the PDF: the abstract says ChatGPT
    and GPT-4 had exact match rates of 52% and 57% on MMLU, while the Introduction, body and Conclusion attribute 57% to ChatGPT. No dated API model versions or decoding settings (temperature) were found
    in the text (searched for 0613, 0301, temperature, version). The authors also report that GPT-4 showed only about 1% difference from ChatGPT in TS-Guessing, suggesting the protocol ''may not heavily
    rely on advanced reasoning skills''. Retrieval finding: significant overlap between TruthfulQA and the pre-training corpora, which the authors say may be due to its Wikipedia sourcing; PIQA has overlapping
    words but no high GPTscore. The fine-tuning positive control has no matching negative control (a clean model is the comparison). Conflict of interest: none identified. Table values not recorded.'

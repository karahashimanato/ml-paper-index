claims:
- id: c1
  statement: Agricultural tasks often need non-imagery modalities that EO foundation models cannot ingest, while a tabular foundation model handles this heterogeneity more naturally.
  location: Abstract
  page: 1
  quote: agricultural downstream tasks frequently require diverse, non-imagery data modalities that earth observation foundation models are architecturally unequipped to ingest, while a foundation model
    built for tabular data handles this heterogeneity more naturally
- id: c2
  statement: TabPFN, without geospatial or agricultural pretraining, matches or outperforms the foundation models across several datasets.
  location: Results
  page: 6
  quote: We find that it matches or outperforms FMs across several datasets.
- id: c3
  statement: A standardized set of hyperparameters is used across datasets instead of per-dataset optimization, because labels are limited on several datasets and the goal is robustness rather than best
    achievable performance.
  location: Hyperparameter Policy
  page: 5
  quote: We adopt a standardized set of hyperparameters across datasets.
- id: c4
  statement: The Random Forest uses 500 trees with default settings for all other hyperparameters.
  location: Model Configurations
  page: 5
  quote: The Random Forest classifier/regressor is trained with 500 trees using the default settings for all remaining hyperparameters.
- id: c5
  statement: CY-Bench yield prediction uses chronological walk-forward validation on the final five years.
  location: Evaluation Splits
  page: 3
  quote: Finally, to simulate operational forecasting for CY-Bench, we employ a chronological walk-forward validation strategy on the final 5 years.
- id: c6
  statement: 'Stated limitation: the baselines are traditional, simple methods rather than complex domain-specific models.'
  location: Limitations
  page: 8
  quote: Thirdly, the study utilizes traditional, simple methods as baselines, whereas a large body of literature exists detailing complex, domain-specific models designed for each individual task.

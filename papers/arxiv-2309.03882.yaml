  notes: 'Selected for the topic article requested by the user (2026-10-11): pitfalls in evaluating large language models (benchmark contamination and its detection, prompt and answer-format sensitivity,
    LLM-as-a-judge biases, human-preference arenas, holistic evaluation, benchmark errors, and reproducibility of evaluation harnesses). Carded by a subagent. Results tables not recorded; claims only. Affiliations:
    Tsinghua University CoAI group (Zheng, Huang) and WeChat AI, Tencent (Zhou, Meng, Zhou). Venue from the PDF header (''Published as a conference paper at ICLR 2024'') and the arXiv comment (''ICLR 2024
    Spotlight''); year is the first arXiv version (2023). Section numbers are from cross-references (§2.1, §2.3, §2.4, §2.6, §3.3, §4.1, §4.2); the measurement subsection is not cross-referenced and is
    given by name. The evaluation protocol is stated to follow mainstream frameworks (HuggingFace LLM Leaderboard, EleutherAI lm-harness, original MMLU implementation, OpenAI Evals). Section 4.1: PriDe
    is reported to achieve superior debiasing effectiveness and performance improvement to Full/Cyclic Permutation especially in the low-cost scenario (figure-based; numbers not recorded); permutation baselines
    average predictions over option permutations (citing Wang et al., 2023a; Zheng et al., 2023b). The paper contrasts with Pezeshkpour & Hruschka (2023), which did not ablate option IDs. No conflict of
    interest with the evaluated models or benchmarks was found; PriDe is the authors'' own method. Evaluated open models are from HuggingFace; gpt-3.5-turbo-0613 via the OpenAI API (Reproducibility Statement).'

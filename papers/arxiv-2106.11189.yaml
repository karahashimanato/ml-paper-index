proposes:
- 'Regularization cocktails: per-dataset joint hyperparameter optimization (BOHB) over whether and how strongly to apply 13 regularizers (batch norm, SWA, lookahead, weight decay, dropout, snapshot ensembles,
  skip connections with Shake-Shake/Shake-Drop, Mix-Up, Cut-Mix, Cut-Out, FGSM adversarial training) on a fixed 9-layer, 512-unit MLP'
claims:
- id: c1
  statement: 'Method: the regularization cocktail is found by a joint search over the hyperparameters of 13 regularizers, each with a conditional switch deciding whether it is applied, in a 19-dimensional
    space, using the multi-fidelity Bayesian optimizer BOHB; constraints keep Shake-Shake and Shake-Drop from being active together and allow only one data augmentation technique at once.'
  location: Section 4
  page: 4
  quote: In total, the optimal cocktail is searched in a space of 19 hyperparameters.
- id: c2
  statement: 'Fixed backbone: the network is fixed to a 9-layer MLP with 512 units per layer, trained with AdamW and cosine annealing with restarts at a learning rate of 1e-3 chosen by grid search across
    datasets; the fixed training/architecture hyperparameters were tuned to maximize the performance of an unregularized network on the same dataset collection used for evaluation.'
  location: Fixed Architecture and Optimization Hyperparameters
  page: 6
  quote: These ﬁxed hyperparameter values, as speciﬁed in Table 4 of Appendix B.1, have been tuned for maximizing the performance of an unregularized neural network on our dataset collection (see Table
    9 in Appendix D).
- id: c3
  statement: 'Benchmark: 40 classification datasets (31 from the OpenML AutoML Benchmark, the remaining 8 of that benchmark being too large for the cluster, plus 9 UCI/Kaggle datasets with roughly 100K+
    instances), 452 to 416,188 data points and 4 to 2,001 features, split 60/20/20; balanced accuracy is the metric, and only a single train-val-test split was evaluated per dataset in order to cover more
    datasets.'
  location: Experimental Setup and Datasets
  page: 5
  quote: For the sake of studying the effect on more datasets, we only evaluated a single train-val-test split.
- id: c4
  statement: 'Baseline fairness: all baselines use the same splits, the same seed and the same HPO resources as the cocktails (4 days on 20 CPU cores with 128GB memory); TabNet, XGBoost and CatBoost are
    tuned with BOHB (TabNet and CatBoost in the search spaces recommended by their authors), the scikit-learn GBDT via Auto-sklearn''s SMAC with its default search space, and AutoGluon Tabular is restricted
    to neural networks.'
  location: Section 5.4
  page: 6
  quote: All baselines use the same train, validation, and test splits, the same seed, and the same HPO resources and constraints as for our automatically-constructed regularization cocktails (4 days on
    20 CPU cores with 128GB of memory).
- id: c5
  statement: 'Exception for NODE: a grid search over the authors'' proposed ranges ran into multiple memory and runtime issues, so NODE was run with the default hyperparameters of its public implementation;
    several baselines also have N/A entries where they exceeded memory (24GB per process) or the 4-day runtime limit.'
  location: Section 5.4
  page: 6
  quote: To overcome these issues we used the default hyperparameters the authors used in their public implementation.
- id: c6
  statement: 'Results vs neural baselines: MLP+C is reported to be statistically significantly better than the other neural methods in a Wilcoxon-based critical difference analysis on 40 datasets; apart
    from AutoGluon, the other neural architectures (TabNet, NODE) are not competitive even against an MLP with only dropout, and adding early stopping to TabNet and NODE did not improve their rank.'
  location: Section 6
  page: 8
  quote: Apart from AutoGluon (both versions), the other neural architectures are not competitive even against an MLP regularized only with Dropout and optimized with our standard, ﬁxed training pipeline
    of Adam with cosine annealing.
- id: c7
  statement: 'Results vs GBDT: the well-regularized MLPs are reported to outperform XGBoost, the Auto-sklearn GBDT and CatBoost with a statistically significant margin (adding early stopping to XGBoost
    did not improve it), and none of the specialized prior deep methods (TabNet, NODE, AutoGluon Tabular) significantly outperforms GBDT. Over HPO time, the cocktails are reported to be statistically significantly
    better than XGBoost after 30 minutes.'
  location: Section 6
  page: 8
  quote: The results show that our MLPs outperform all three GBDT variants (XGBoost, auto-sklearn, and CatBoost) with a statistically signiﬁcant margin.
- id: c8
  statement: 'Stated limitations: only classification was studied (not regression); only somewhat balanced datasets (minority/majority ratio above 0.05); no extremely small or large data regimes (452 to
    416,188 points); no datasets with extreme outliers, missing labels, semi-supervised or streaming data. The authors also note the recent neural architectures could benefit from the cocktails too, but
    integrating the regularizers into those libraries requires considerable coding effort.'
  location: 'Conclusion: Limitations'
  page: 10
  quote: We only studied classiﬁcation, not regression.

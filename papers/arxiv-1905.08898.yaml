  notes: 'Selected for the topic article requested by the user (2026-10-03): classical algorithms (sorting, binary search, greedy) and machine learning; carded by a subagent. Results tables not recorded;
    claims only. Affiliations (title page): MIT, Microsoft Research, Arizona State University, Georgia Institute of Technology; Tim Kraska is also a co-author of the original Learned Index (arxiv-1712.01208).
    Acknowledgements: supported by Google, Intel and Microsoft as part of MIT DSAIL, among others. Code link: the PDF text shows ''htps://github.com/microsof/ALEX'' (ligature loss in extraction); recorded
    as https://github.com/microsoft/ALEX. Protocol (Experimental Setup / Datasets / Workloads): single-threaded, Intel Core i9-9900K, 64GB RAM; 8-byte keys with random fixed-size payloads; 4 datasets: longitudes
    and longlat (real, OpenStreetMap; longlat is a transformed compound key), lognormal (synthetic, mu=0, sigma=2) and YCSB (synthetic user IDs uniform over the 64-bit domain, 80-byte payload); datasets
    are randomly shuffled; index initialized with 100M keys and run for 60 seconds while inserting the remaining keys; lookup keys drawn from existing keys by a Zipfian distribution; workloads: read-only,
    read-heavy (95/5), write-heavy (50/50), short range (95/5, scan up to 100 keys), write-only. Primary metric: average throughput; index size definitions differ per structure (Experimental Setup). Baselines
    also include Model B+Tree (linear model per node, Gapped Array, built on STX) and ART (C implementation); hash tables excluded because they cannot efficiently support range queries. Bulk load (Section
    6.2.4 text): ALEX takes on average 50% more time than B+Tree to bulk load. Distribution shift experiments initialize with the 50M smallest keys and insert the rest randomly or in ascending order. Complexity
    analysis (Section 5.2): TraverseToLeaf takes ceil(log_m p) time, exponential search within a data node is O(log m) in the worst case, and the worst-case insert into a full node is O(m * ceil(log_m p)).
    Lookups: exponential search from the predicted position; the paper says this ''always beats binary search when models are accurate'' (Introduction).'

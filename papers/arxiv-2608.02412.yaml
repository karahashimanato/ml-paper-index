claims:
- id: c1
  statement: Under random linear projections, the LLM is the only one of nine methods whose accuracy decreases as dimensionality grows, while every classical baseline stays flat or improves.
  location: Abstract
  page: 1
  quote: 'Dimensionality, in contrast, is decisive: sweeping random linear projections of thirty-one benchmark datasets, the LLM is the only method among nine whose accuracy decreases as dimensionality
    grows, while every classical baseline stays flat or improves.'
- id: c2
  statement: The experiments use claude-opus-4-6, with an initial generalisation experiment using Qwen.
  location: What do we mean by LLM
  page: 3
  quote: Concretely, our experiments use claude-opus-4-6 [2], a frontier model at the time of writing (Section C.3), alongside an initial generalizing experiment using Qwen to begin moving our claims from
    a single model to LLMs more broadly.
- id: c3
  statement: Splits are 5-fold stratified cross-validation repeated over 5 seeds.
  location: Datasets and experimental setup
  page: 4
  quote: Splits are 5-fold stratified cross-validation repeated over 5 seeds, giving 25 splits per dataset and 475 queries in total.
- id: c4
  statement: The main classical baselines use fixed scikit-learn configurations; e.g. gradient boosting uses 100 estimators and otherwise sklearn defaults. No tuning of the main baselines was found in the
    text.
  location: Appendix
  page: 25
  quote: GradientBoostingClassifier with n_estimators=100 and random_state=0; sklearn defaults otherwise
- id: c5
  statement: The authors suggest that a memorisation probe should be standard practice in any LLM-for-tabular evaluation.
  location: Data hygiene
  page: 5
  quote: More broadly, we suggest that a probe of this kind should be standard practice in any LLM-for-tabular evaluation.
- id: c6
  statement: The evaluation is restricted to toy-scale tabular datasets, a restriction partly forced by the cost and context limits of the LLM.
  location: Limitations
  page: 14
  quote: A limitation of our evaluation is that it is restricted to toy-scale tabular datasets; however, this restriction is itself partly forced by the cost and context limits of the method being studied.

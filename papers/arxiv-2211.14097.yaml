    sections only spot-checked (robustness, Fearnhead 2006 comparison). Possible conflict of interest: the MCMC non-convergence argument and the BLOCKS example rely on Cappello et al. (2023), whose author
    list includes the first author. Competitor settings: no penalty or tuning choice for PELT / BINSEG / SEGNEI was found in the text (searched default, penalt, MBIC, tuned, tuning). The supplementary comparison
    with Fearnhead (2006) uses a third-party Python implementation with post-processing thresholds 0.5 / 0.3 that the authors acknowledge as subjective and kept out of the main text. Under non-Gaussian
    noise, coverage of the sets drops substantially (power-posterior variants partially counterbalance it). Robustness checks report insensitivity to a0 and to a Half-Cauchy prior in their setting; exactness
    of the recursion is checked only for K = 1. Table values not recorded.'

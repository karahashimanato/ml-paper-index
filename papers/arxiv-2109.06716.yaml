proposes:
- 'HPOBench: 12 benchmark families (7 existing, 5 new) with more than 100 multi-fidelity HPO problems under one API, each packaged in a Singularity container, with raw, tabular and surrogate versions for
  cheap evaluation'
claims:
- id: c1
  statement: 'Motivation: prior HPO method papers often relied on artificial test functions and low-dimensional toy problems, sometimes introduced their own problems, ran on different environments with
    different requirements and interfaces, and often did not open-source code, making methods hard to compare.'
  location: Introduction
  page: 1
  quote: All of these make it difﬁcult to compare and develop methods, necessitating an evolving set of relevant and up-to-date benchmark problems which drives continued and quantiﬁable progress in the
    community.
- id: c2
  statement: Surrogate benchmarks (an ML model trained on recorded evaluations predicts function values in the original, non-discretized space) are similarly cheap to query as tabular lookup benchmarks
    but add complexity, and their quality crucially depends on the surrogate model and its training data; because they are a drop-in replacement for raw benchmarks they are widely adopted.
  location: Section 4.2
  page: 4
  quote: While surrogate benchmarks are similarly cheap to query, the surrogate’s internal ML model adds extra complexity and the benchmark’s quality crucially depends on the quality of this model and its
    training data.
- id: c3
  statement: 'Reproducibility scope: each benchmark is packaged with its dependencies in a container so that it can be used without reinstalling dependencies, but this does not immediately make optimization
    results replicable; users still need enough seed replicates and must account for hardware differences when comparing optimizer overhead.'
  location: Section 4.3
  page: 5
  quote: This does not immediately lead to replicability on the level of the optimization results.
- id: c4
  statement: New benchmark families (SVM, LogReg, XGBoost, RandomForest, MLP; scikit-learn and XGBoost) use 20 OpenML AutoML-benchmark datasets (8 for MLP); 33% of each fixed OpenML training split is held
    out (stratified, fixed seed) as validation, the model is trained on the remaining 67%, and fidelities are trees, iterations, epochs or data subsets (SVM). Tabular versions discretize each HP and fidelity
    and record 5 seeds per grid configuration.
  location: Section 4.4.2
  page: 6
  quote: We give the OpenML [75] task IDs in Table 7 in Appendix D, which provide ﬁxed train-test splits; for each such task, we used 33% of the training set as the validation split, determined through
    stratiﬁed sampling under a ﬁxed seed.
- id: c5
  statement: 'Experimental protocol: 13 optimizers on the 12 families, 32 seeds per benchmark and optimizer, minimizing 1 - accuracy on the new benchmarks (using their tabular versions); budgets as in Table
    1, counting benchmark time (recorded, predicted or wall-clock) plus optimizer wall-clock time. Results are aggregated as final performance, performance over time or rank over time; for tabular and surrogate
    benchmarks the optimization regret to the best-known value is reported (footnote 4: validation performance, the objective seen by the optimizer).'
  location: Section 5.1
  page: 7
  quote: For each benchmark and optimizer, we conducted 32 repetitions with different seeds to avoid reliance on individual seeds [65].
- id: c6
  statement: 'Optimizer configuration: all tools and implementations of the compared optimizers (RS, DE, BO with GP, RF and KDE models, HEBO; HB, BOHB, SMAC-HB, DEHB, Dragonfly, Optuna) were run with their
    default settings.'
  location: Appendix G
  page: 24
  quote: We note that we used the default settings for all tools and implementations.
- id: c7
  statement: 'RQ1 (advanced methods vs random search): counting wins/ties/losses with a sign test on the existing community benchmarks (new benchmarks reported as similar in Appendix H), four of five black-box
    methods are significantly better than RS, but only two of four multi-fidelity methods are significantly better than HB and one is consistently worse than HB; the authors conclude that advanced methods
    consistently outperform random search.'
  location: Section 5.3
  page: 8
  quote: We can observe that four out of ﬁve black-box methods are signiﬁcantly better than RS.
- id: c8
  statement: 'RQ2 (multi-fidelity vs black-box at a fixed time budget): multi-fidelity optimizers outperform black-box optimizers for relatively small budgets, and with enough budget black-box optimizers
    become competitive (DE and BORF did very well in the end). On the community benchmarks the catch-up, if any, happens only after a very substantial (simulated) wall-clock time, so the authors consider
    multi-fidelity methods crucial for real, expensive problems.'
  location: Section 5.4
  page: 9
  quote: Overall, multi-ﬁdelity optimizers outperform black-box optimizers for relatively small compute budgets.
- id: c9
  statement: 'Caveats: multi-fidelity methods are clearly beneficial in general when low fidelities are available and representative of the true objective; DEHB and SMAC-HB were reliable across the collection
    while other multi-fidelity optimizers did not consistently improve over HB, black-box methods can beat multi-fidelity methods at very high budgets, and even advanced methods can be beaten by RS on individual
    benchmarks.'
  location: Section 5.4
  page: 10
  quote: By exploring a very broad range of benchmarks, we also found an existence proof that black-box methods can outperform multi-ﬁdelity methods for very high budgets and that even advanced methods
    can be outperformed by RS in individual benchmarks.

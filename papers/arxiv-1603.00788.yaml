  notes: 'Selected for the method article requested by the user (2026-10-07): approximate Bayesian inference and its diagnostics (HMC/NUTS and SG-MCMC, variational inference, R-hat, PSIS, SBC, VI error
    bounds, Bayesian workflow). Carded by a subagent. Results tables not recorded; claims only. Affiliations: Columbia (Kucukelbir, Tran, Gelman, Blei), Princeton (Ranganath). No venue is stated in the
    v1 PDF (dated March 3, 2016); none recorded. Section numbers are from numbered headings in the PDF text. Extends Kucukelbir et al. (2015) (footnote 1). Conflict of interest: the authors ''implemented
    and deployed ADVI as part of Stan'' (Introduction), and the compared NUTS is Stan''s default sampler (footnote 9), i.e. ADVI and its MCMC comparators come from the same system and were run by the authors;
    the PDF does not itself state Stan team membership of individual authors. Also, and BBVI (compared in Section 3.2) is by co-authors Ranganath and Blei (arxiv-1401.0118). Algorithm details: adaptive
    step size rho = eta * i^(-1/2+eps) * (tau + sqrt(s_k))^-1 with s_k an exponential moving average of squared gradients (alpha = 0.1, tau = 1, eps = 1e-16); eta is chosen by searching {0.01, 0.1, 1, 10,
    100} on a subset of the data for fastest convergence (Section 2.6). Per-iteration cost O(NMK), or O(BMK) with minibatch subsampling scaled by N/B. Initialization: standard Gaussian in the real coordinate
    space; the Discussion names initialization and step-size scaling as the two practical factors affecting convergence and suggests extending to discrete latent variables via the higher-variance BBVI estimator.
    Predictive accuracy results are figure-only; Table 2 KL values for the transformation study are not recorded. Smaller GMM minibatches (< 500) led to suboptimal solutions (Section 4.3).'

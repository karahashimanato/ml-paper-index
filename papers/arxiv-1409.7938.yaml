proposes:
- 'STOCHASTIC-GREEDY: at each of k steps, evaluate marginal gains only on a random sample of (n/k) log(1/epsilon) elements, giving (1-1/e-epsilon) in expectation with O(n log(1/epsilon)) function evaluations
  independent of k'
claims:
- id: c1
  statement: 'Classical guarantee cited (Nemhauser, Wolsey and Fisher 1978): for maximizing a non-negative monotone submodular function under a cardinality constraint (|A| <= k), the simple greedy algorithm
    (add the element with largest marginal gain, k times; O(n k) evaluations) achieves a (1-1/e) approximation to the optimal (intractable) solution.'
  location: Introduction
  page: 1
  quote: states that for non-negative monotone submodular functions a simple greedy algorithm provides a solution with (1−1/e) approximation guarantee to the optimal (intractable) solution.
- id: c2
  statement: 'Prior accelerated greedy (LAZY-GREEDY, Minoux 1978): its exact cost in function evaluations is unknown, although it gives orders-of-magnitude speedups in practice.'
  location: Introduction
  page: 2
  quote: Even though the exact cost (i.e., number of function evaluations) of LAZY-GREEDY is unknown, this algorithm leads to orders of magnitude speedups in practice.
- id: c3
  statement: 'Guarantee of the proposed method (theoretical; for monotone submodular maximization under a cardinality constraint): the randomized STOCHASTIC-GREEDY achieves a (1-1/e-epsilon) approximation
    in expectation, in time linear in the data size and independent of the cardinality constraint.'
  location: Abstract
  page: 1
  quote: We show that our randomized algorithm, STOCHASTIC-GREEDY, can achieve a (1 −1/e −ε) approximation guarantee, in expectation, to the optimum solution in time linear in the size of the data and independent
    of the cardinality constraint.
- id: c4
  statement: 'Assumptions of the guarantee (Theorem 1): f non-negative, monotone and submodular, problem (1) with a cardinality constraint, and sample size s = (n/k) log(1/epsilon) per step; the bound is
    in expectation and uses O(n log(1/epsilon)) function evaluations.'
  location: STOCHASTIC-GREEDY Algorithm
  page: 3
  quote: Let f be a non-negative monotone submoduar function.
- id: c5
  statement: 'Cost measurement: computational cost is measured as the number of function evaluations, to be independent of implementation and platform; baselines are random selection, LAZY-GREEDY, SAMPLE-GREEDY
    (lazy greedy on a random subsample) and THRESHOLD-GREEDY.'
  location: Experimental Results
  page: 3
  quote: In order to compare the computational cost of different methods independently of the concrete implementation and platform, in our experiments we measure the computational cost in terms of the number
    of function evaluations used.
- id: c6
  statement: 'Data subset selection setting: active set selection for Gaussian Process regression (information gain, Informative Vector Machine) on the Parkinsons Telemonitoring dataset.'
  location: Experimental Results
  page: 4
  quote: We used the Parkinsons Telemonitoring dataset (Tsanas et al. 2010) consisting of 5,875 bio-medical voice measurements with 22 attributes from people with early-stage Parkinsons disease.
- id: c7
  statement: 'Empirical claim: STOCHASTIC-GREEDY practically reaches the same utility as lazy greedy while running much faster.'
  location: Abstract
  page: 1
  quote: We observe that STOCHASTIC-GREEDY practically achieves the same utility value as lazy greedy but runs much faster.

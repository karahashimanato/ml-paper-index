proposes:
- 'OSDT: branch-and-bound search for provably optimal sparse binary-split decision trees over binary features, minimizing misclassification error plus a per-leaf penalty, with analytical bounds and a bit-vector
  implementation'
claims:
- id: c1
  statement: 'Critique of greedy induction: CART and C4.5 grow trees top-down without backtracking, so if a suboptimal split is introduced near the top the algorithm could spend many extra splits trying
    to undo it, leading to less accurate and less interpretable trees.'
  location: Introduction
  page: 1
  quote: CART and C4.5 grow decision trees from the top down without backtracking, which means that if a suboptimal split was introduced near the top of the tree, the algorithm could spend many extra splits
    trying to undo the mistake it made at the top, leading to less-accurate and less-interpretable trees.
- id: c2
  statement: 'Contribution: the paper presents what it calls the first practical algorithm for optimal decision trees, restricted to binary variables.'
  location: Abstract
  page: 1
  quote: This work introduces the first practical algorithm for optimal decision trees for binary variables.
- id: c3
  statement: 'Objective: optimal trees are defined by a regularized loss that trades off accuracy against the number of leaves (misclassification error plus lambda times the number of leaves), rather than
    a fixed tree topology.'
  location: Introduction
  page: 2
  quote: We find optimal trees according to a regularized loss function that balances accuracy and the number of leaves.
- id: c4
  statement: 'Optimization approach: the objective is minimized with branch and bound, using a series of specialized bounds that eliminate a large part of the search space (the hierarchical objective lower
    bound and the equivalent points bound adapted directly from CORELS, several others adapted from CORELS with minor changes; proofs in the supplement).'
  location: Optimization Framework
  page: 4
  quote: We minimize the objective function based on a branch-and-bound framework.
- id: c5
  statement: 'Protocol: OSDT is compared against CART and BinOCT on 7 datasets (5 UCI datasets plus ProPublica COMPAS and FICO); both BinOCT and OSDT get a 30-minute time limit.'
  location: Experiments
  page: 7
  quote: The time limits for both BinOCT and our algorithm are set to be 30 minutes.
- id: c6
  statement: 'Finding on baselines (training accuracy, Figure 1): with provably optimal trees as reference, the authors state that other methods are often close to optimal or optimal, though sometimes the
    baselines are not optimal.'
  location: Experiments
  page: 7
  quote: (i) We can now evaluate how close to optimal other methods are (and they are often close to optimal or optimal).
- id: c7
  statement: 'Limitation (scalability): runtime can in theory grow exponentially with the number of features (the authors add that, empirically, extra features not in the optimal tree let the search prune
    faster).'
  location: Experiments
  page: 7
  quote: Runtime can theoretically grow exponentially with the number of features.

  notes: 'Selected for the topic article requested by the user (2026-10-10): causal effect estimation with machine learning (identification assumptions, meta-learners and double/debiased ML, causal trees
    and forests, Bayesian trees, representation-learning networks, overlap, model selection without ground truth, and benchmarking practice). Carded by a subagent. Results tables not recorded; claims only.
    Affiliations: University of Cambridge; van der Schaar also UCLA and The Alan Turing Institute. Venue from the PDF footer (''Proceedings of the 24th International Conference on Artificial Intelligence
    and Statistics (AISTATS) 2021, San Diego, California, USA. PMLR: Volume 130''), consistent with the arXiv comment. Section numbers from numbered headings in the PDF (6.1 Synthetic Experiments, 6.2 IHDP).
    Conflict of interest: SNet is proposed by the authors, all architectures were re-implemented in the authors'' own code base (CATENets), and the theory builds on the senior author''s earlier work (Alaa
    and van der Schaar 2018a,b). Experimental setup: d = 25 multivariate normal covariates, three stylized DGPs (no effect with confounding; nonzero effect on 5 additional covariates; disjoint covariate
    sets for mu_1 and mu_0 without confounders), 500 test observations, averaged across 10 runs; IHDP uses an adapted version of the 100 realizations of Shalit et al. (2017) with responses rescaled because
    the CATE scale varied by orders of magnitude (footnote 5); n = 747, 90% used for training, 19% treated, partial overlap. Results are in figures and Table 1 and are not recorded. The text also states
    that the DR-learner is best combined with a nuisance estimator that does not share information between pi(x) and mu_w(x) (Section 6.1). In the experiments, equivalent hyper-parameters (based on Shalit
    et al., 2017) were fixed across architectures and each learner was used ''off-the-shelf'' (Section 6). Referred to by arxiv-2107.13346 as reference [9].'

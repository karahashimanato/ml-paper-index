  notes: 'Selected for the topic article requested by the user (2026-10-03): algorithm design techniques (divide and conquer, dynamic programming, branch and bound, local search) and machine learning; carded
    by a subagent. Results tables not recorded; claims only. PDF states: NeurIPS 2019. Affiliations: UC Berkeley and Facebook AI Research (first author''s work partially done while interning at FAIR). No
    TSP experiments; routing experiments are CVRP with 20/50/100 customers (VRP20 Cap30, VRP50 Cap40, VRP100 Cap50), uniformly random in the unit square, following the setups of Nazari et al. and Kool et
    al. (AM). Baselines for VRP: AM, Nazari et al., OR-Tools, Clarke-Wright and sweep heuristics; Gurobi optimal is reported only for VRP20 (Table 6). Initial VRP routes are built by a nearest-feasible-node
    heuristic that the authors note is worse than the classic heuristics (Appendix F). Generalization: models trained on one VRP size are tested on other sizes (Figure 5b); expression models trained on
    short expressions are tested on longer ones (Test>100). No LKH or Concorde baseline. Rewriting steps: T_iter = 50 (expression, scheduling) and 200 (VRP) (Appendix D, hyper-parameters of Algorithm 2);
    at evaluation, inference also terminates early when the predicted Q falls below epsilon or the chosen rule does not apply (Appendix D). VRP rule set: each node can swap with another node in the route
    (problem setup section). Appendix F compares the VRP50-trained model''s VRP100 result with a number reported in Nazari et al. (not rerun). Table 1c gives per-instance OR-Tools VRP runtimes well below
    the 10-second timeout. No optimality or approximation guarantee is claimed; the method is a heuristic. Results not recorded.'

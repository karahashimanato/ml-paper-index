proposes:
- power-law plus constant scaling laws (irreducible + reducible loss) for autoregressive Transformers on images, video, multimodal image-text and math, with a near-universal optimal-model-size vs compute
  exponent
claims:
- id: c1
  statement: 'Main claim: in four domains (generative image modeling, video, multimodal image-text, math problem solving) autoregressive Transformers improve smoothly with model size and compute, following
    a power-law plus constant scaling law.'
  location: Abstract
  page: 1
  quote: In all cases autoregressive Transformers smoothly improve in performance as model size and compute budgets increase, following a power-law plus constant scaling law.
- id: c2
  statement: 'Compute-optimal model size: the optimal model size depends on the compute budget through a power law whose exponents are nearly universal across data domains.'
  location: Abstract
  page: 1
  quote: The optimal model size also depends on the compute budget through a power-law, with exponents that are nearly universal across all data domains.
- id: c3
  statement: 'Compute counting: C is defined theoretically as 6NE, with N the non-embedding parameter count and E the total tokens processed in training (a footnote explains the factor 6 as 2 for add-multiply
    times 3 for forward and backward passes); the critical-batch-size adjustment used in Kaplan et al. was not made here.'
  location: Compute Scaling and Optimal Model Sizes
  page: 9
  quote: We deﬁne C theoretically rather than empirically, and approximate7 it as C ≡6NE where N is the non-embedding parameter count (model size) and E = SB is the total number of tokens processed during
    training
- id: c4
  statement: 'Caveat on convergence: L(N) uses the loss at (or as close as feasible to) convergence, but the largest models did not fully converge, so the authors warn against over-interpreting the irreducible
    loss as entropy and the reducible loss as KL divergence.'
  location: Model Size Scaling and Aspect Ratios
  page: 9
  quote: Thus caution is warranted when interpreting L(N) trends according to equation (1.2) and identifying the irreducible loss as an entropy, and the reducible loss as a KL divergence.
- id: c5
  statement: 'Caveat on extrapolation: the sub-linear data-vs-model-size conclusion for compute-optimal training is stated together with the caution that no models were trained in a regime where compute-optimal
    training actually implies D much smaller than N.'
  location: Compute Scaling and Optimal Model Sizes
  page: 10
  quote: As a word of caution, we have yet to train models in a regime where compute optimal training actually implies D ≪N numerically.
- id: c6
  statement: 'Attribution: the language-modeling compute scaling results are taken from GPT-3 ([BMR+20]) and the language Nopt(C) from Kaplan et al. ([KMH+20]), not from new experiments in this paper.'
  location: Summary of scaling laws (Table 1 caption)
  page: 7
  quote: The compute scaling results and data for language are from [BMR+20], while Nopt(C) comes from [KMH+20].
- id: c7
  statement: 'Downstream: when generative image models are finetuned for ImageNet classification, classification loss follows a power law in model size even beyond where generative loss approaches its irreducible
    value; the authors conclude that approaching the irreducible loss does not necessarily indicate diminishing returns for representation quality.'
  location: Summary of Results
  page: 6
  quote: We conclude that the approach to the irreducible loss does not necessarily indicate diminishing returns for representation quality or semantic content.

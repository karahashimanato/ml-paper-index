  notes: 'Selected for the method article requested by the user (2026-10-10): deep learning architectures for tabular data (TabNet, NODE and differentiable trees, TabTransformer/FT-Transformer-style attention,
    SAINT, embeddings for numerical features, retrieval (TabR), regularized MLPs, CTR-style interaction models, self-supervised pretraining, and surveys/benchmarks comparing them with GBDTs). Carded by
    a subagent. Results tables not recorded; claims only. Affiliations: Yandex (all authors), plus Lomonosov Moscow State University and HSE (PDF page 1). No venue is stated in the v2 PDF (dated 19 Sep
    2019) and the arXiv record has no comment/journal_ref; none recorded. Section numbers are from numbered headings in the PDF. Comparison with mGBDT and DeepForest was partial (OOM on many datasets; DeepForest
    classification-only), with tuned GBDTs reported better than both. Runtime (Section 4.2, Table 4): 1024 trees of depth six on YearPrediction, single 1080Ti GPU vs 28-core Xeon; NODE inference is described
    as on par with GBDT libraries. The Click subset was built by sampling 500,000 objects per class, categorical features via leave-one-out encoding. Babenko is a co-author of later tabular DL benchmarks
    that evaluate NODE; this paper itself does not state a conflict of interest. Result tables not recorded.'

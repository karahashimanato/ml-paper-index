proposes:
- A statistical review of boosting as functional gradient descent (FGD) for fitting structured models (linear, additive, survival), with degrees of freedom and information criteria (corrected AIC) for choosing
  the stopping iteration, illustrated with the authors' R package mboost
claims:
- id: c1
  statement: Citing Breiman [15, 16], the authors state that AdaBoost can be represented as a steepest-descent algorithm in function space, which they call functional gradient descent (FGD); Friedman, Hastie
    and Tibshirani [33] and Friedman [32] then developed a more general statistical framework ('stagewise, additive modeling').
  location: Section 2
  page: 4
  quote: showed that the AdaBoost algorithm can be represented as a steepest descent algorithm in function space which we call functional gradient descent (FGD).
- id: c2
  statement: 'Generic FGD algorithm (as given by Friedman [32]): repeatedly fit the negative gradient of the loss at the current fit with a real-valued base procedure and add it with a step-length factor
    0 < nu <= 1; the stopping iteration mstop is the main tuning parameter, chosen by cross-validation or an information criterion.'
  location: Section 2.1
  page: 4
  quote: The stopping iteration, which is the main tuning parameter, can be determined via cross-validation or some information criterion; see Section 5.4.
- id: c3
  statement: 'Step length (shrinkage): the choice of nu is described as of minor importance as long as it is small (e.g. 0.1); a smaller nu typically requires more iterations and computing time, while predictive
    accuracy has been empirically found (citing Friedman [32]) to be potentially better and almost never worse.'
  location: Section 2.1
  page: 4
  quote: The choice of the step-length factor ν in step 4 is of minor importance, as long as it is “small,” such as ν = 0.1.
- id: c4
  statement: 'Early stopping: after the earlier debate on whether AdaBoost is immune to overfitting, the authors state (citing [7, 51, 64]) that AdaBoost and other boosting algorithms eventually overfit,
    so early stopping is necessary, although AdaBoost is quite resistant to overfitting (slow overfitting) as iterations increase.'
  location: Section 1.3
  page: 3
  quote: It is clear nowadays that Ada-Boost and also other boosting algorithms are overﬁtting eventually, and early stopping
- id: c5
  statement: 'Tree base learners: regression trees are invariant under monotone transformations of the predictors and handle continuous, ordinal and nominal covariates in a unified way; boosting stumps
    gives an additive model, and boosting trees with at most d terminal nodes gives a model with interactions of order at most d - 2, so the interaction degree can be constrained via the number of nodes.'
  location: Section 4.3
  page: 12
  quote: Similarly, boosting trees with (at most) d terminal nodes result in a nonparametric model having at most interactions of order d −2.
- id: c6
  statement: 'Low-variance principle: the authors advise choosing a base procedure (with the desired structure) with low variance at the price of larger estimation bias; a small step-size factor can be
    seen as shrinking the base procedure by nu, implying low variance but potentially large estimation bias.'
  location: Section 4.4
  page: 13
  quote: Note that a small step-size factor can be seen as a shrinkage of the base procedure by the factor ν, implying low variance but potentially large estimation bias.
- id: c7
  statement: For L2Boosting with a linear base procedure, the boosting hat matrix B_m = I - (I - H)^m converges to the identity, i.e. the fit eventually interpolates the responses, so iterations must be
    stopped early; the eigen-analysis (Section 1.3 summary) shows variance increasing in exponentially small increments while squared bias decreases exponentially fast, which the authors use to explain
    why overfitting sets in slowly.
  location: Section 5.1
  page: 13
  quote: Thus, we see here explicitly that we have to stop early with the boosting iterations in order to prevent overﬁtting.
- id: c8
  statement: 'Limitation of the information-criterion stopping rule: the degrees of freedom df(m) = trace(B_m) used in the corrected AIC neglect the selection effect of the componentwise base procedure,
    because B_m depends on the response through the selected components.'
  location: Section 5.3
  page: 18
  quote: should be viewed as an approximate hat matrix only.
- id: c9
  statement: For the squared error loss rho(y, f) = |y - f|^2 / 2 (L2Boosting), the negative gradient vector in the generic FGD algorithm becomes the residual vector, so L2Boosting amounts to refitting
    residuals multiple times.
  location: Section 3.3.1
  page: 8
  quote: Note that the negative gradient vector becomes the residual vector.

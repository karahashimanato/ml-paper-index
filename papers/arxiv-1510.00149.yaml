    University (Han, Dally), Tsinghua University (Mao), NVIDIA (Dally). Venue from the PDF header (''Published as a conference paper at ICLR 2016'') and the arXiv comment (ICLR 2016 oral); year is the first
    arXiv version (2015). Section numbers are from numbered headings in the PDF. Conflict of interest: the pruning stage and the ''Pruning (Han et al., 2015)'' row of the AlexNet comparison (Table 7) are
    the authors'' own earlier method (arxiv-1506.02626, Han and Dally); the EIE accelerator mentioned in the Introduction is also by overlapping authors; speed/energy benchmarks run on NVIDIA hardware while
    Dally is affiliated with NVIDIA. The paper does not state these as a conflict. Compression rates include codebook and sparse-index overhead (Section 5.1, Section 6.4). Table 6: 8/5-bit quantization
    has no loss; 8/4-bit 0.01% loss; 4/2-bit 1.99% and 2.60% loss (caption). Future work (Section 8): the quantized network with weight sharing has not been benchmarked on hardware, so ''the full advantage
    of Deep Compression ... is not fully unveiled''. Energy: pruned layers use 3x to 7x less energy at batch size 1 (Section 6.3).'

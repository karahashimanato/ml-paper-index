claims:
- id: c1
  statement: PACE inserts a frozen tabular foundation model column encoder before an existing feature-scoring rule, expanding each feature into a higher-dimensional contextual representation.
  location: Abstract
  page: 1
  quote: We intro- duce PACE (Plug-and-Play Contextual Embedding), which inserts a frozen tabular foundation model (TFM) column encoder before an existing feature-scoring rule, expanding each feature into
    a higher-dimensional contextual representation.
- id: c2
  statement: Matched random-weight and random-feature controls indicate the gains come from pretrained structure, not just dimensional expansion.
  location: Abstract
  page: 1
  quote: Matched random-weight and random-feature controls show that PACE gains from pretrained structure beyond generic dimen- sional expansion.
- id: c3
  statement: 'Evaluation protocol: TALENT datasets are augmented with independent Gaussian nuisance features up to a fixed total width before screening.'
  location: Appendix
  page: 28
  quote: the nuisance-augmented table adds independent N(0, 1) features until its total width is 2,000
- id: c4
  statement: Screened features are evaluated with ten downstream learners in three families (tree models, neural networks, tabular foundation models).
  location: Experimental setup
  page: 6
  quote: We evaluate the selected columns using ten learners in three families
- id: c5
  statement: When a TALENT training partition is large, embedding and utility estimation use a row-capped subsample.
  location: Appendix
  page: 14
  quote: When a TALENT training partition exceeds 2,000 rows, embedding and utility estimation use at most 2,000 rows, selected by stratified sampling for classification and by sampling without replacement
    for regression using the corresponding random seed.
- id: c6
  statement: 'Limitation: screening performance still depends on representation, utility, backbone and extraction strategy.'
  location: Conclusion
  page: 9
  quote: Screening performance still depends on the representation, utility, backbone, and extraction strategy.

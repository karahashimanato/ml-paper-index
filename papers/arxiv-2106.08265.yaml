    Amazon AWS (all other authors); code released under github.com/amazon-research. Venue from the arXiv comment ''Accepted to CVPR 2022''. The segmentation map is smoothed with a Gaussian of kernel width
    sigma = 4, which the authors state they did not optimize (Section 3.3). The F1-optimal threshold is set on the test scores themselves (it defines a working point for counting errors, not a deployable
    threshold). Low-shot and inference-time comparisons use the authors'' reimplementations of SPADE and PaDiM with WideResNet50. The ''unsupervised'' paradigm tag is used for the one-class (nominal-only
    training) setting; no one-class tag exists. Section numbers are confirmed by headings in the PDF.'

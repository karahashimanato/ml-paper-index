  notes: 'Selected for the method article requested by the user (2026-10-11): aligning language models with human preferences (preference comparisons and reward models, PPO-based RLHF with a KL penalty,
    AI feedback, direct preference optimization and its variants, reward overoptimization, length bias, reward-model evaluation, and open problems). Carded by a subagent. Results tables not recorded; claims
    only. Affiliation: all three authors at OpenAI (PDF page 1). No venue is stated in the PDF or arXiv metadata; none recorded. Conflict of interest / proprietary setup: the experiments use OpenAI''s InstructGPT
    environment, GPT-3 series policies and OpenAI''s 6B InstructGPT reward model as the gold RM (not publicly released), and the RL algorithm is PPO, co-authored by Schulman (Schulman et al., 2017). Section
    numbers come from cross-references in the text (Section 2, sections 3.1-3.6, 4.1-4.5). Footnote 8 says the finding that larger RMs do not reach the data threshold substantially earlier ''contradicts
    some other internal ﬁndings'', so may be an artifact of this setup; footnote 15 reports visually similar results on WebGPT. Section 4.3 derives, under stated simplifying assumptions (constant coefficients,
    d additive across iterations), that k-iteration RLHF raises the final gold score by beta_RL d log(k); the authors say this can only hold up to some maximum k. Section 4.2 maps alpha to regressional
    Goodhart and beta mostly to extremal Goodhart. Numerical results are figure-only and are not recorded.'

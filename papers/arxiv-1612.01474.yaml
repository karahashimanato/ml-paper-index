proposes:
- 'Deep ensembles: train M networks independently (random initialization and data shuffling, full training set) with a proper scoring rule as the loss, optionally with adversarial training, and combine
  them as a uniformly weighted mixture; for regression each network outputs a mean and a variance trained with the Gaussian negative log-likelihood'
claims:
- id: c1
  statement: 'Motivation, a hedged argument: dropout can also be interpreted as an ensemble with parameter sharing, and this interpretation seems more plausible when dropout rates are not tuned on the training
    data, since any sensible approximation to the true Bayesian posterior has to depend on the training data.'
  location: Introduction
  page: 2
  quote: The ensemble interpretation seems more plausible particularly in the scenario where the dropout rates are not tuned based on the training data
- id: c2
  statement: 'Ensembles vs Bayesian model averaging: BMA assumes the true model lies in the prior''s hypothesis class and performs soft model selection, whereas ensembles perform model combination and can
    be expected to be better when the true model is not in the class; the authors note that even exact BMA is not guaranteed to be robust to misspecification with respect to domain shift.'
  location: Introduction
  page: 2
  quote: It is important to note that even exact BMA is not guaranteed be robust to mis-speciﬁcation with respect to domain shift.
- id: c3
  statement: Calibration is used in the frequentist sense (discrepancy between forecasts and long-run frequencies) and is measured with proper scoring rules, namely log predictive probability (NLL) and
    the Brier score; the authors note calibration is orthogonal to accuracy.
  location: Introduction
  page: 1
  quote: The quality of calibration can be measured by proper scoring rules [17] such as log predictive probabilities and the Brier score [9].
- id: c4
  statement: 'Recipe: (1) a proper scoring rule as the training criterion (softmax cross-entropy or Brier for classification; Gaussian NLL with a predicted mean and variance for regression), (2) adversarial
    training (fast gradient sign, epsilon = 1% of each input dimension''s range) to smooth predictive distributions, (3) an ensemble; recommended default M = 5.'
  location: 'Deep Ensembles: A Simple Recipe For Predictive Uncertainty Estimation'
  page: 3
  quote: 'We suggest a simple recipe: (1) use a proper scoring rule as the training criterion, (2) use adversarial training [18] to smooth the predictive distributions, and (3) train an ensemble.'
- id: c5
  statement: 'Cost: the ensemble has M times more parameters than a single network (training is independent and parallelizable); for memory-constrained applications the authors suggest distilling the ensemble
    into a simpler model. Bagging deteriorated performance in their experiments, so each member is trained on the entire dataset.'
  location: Discussion
  page: 9
  quote: The ensemble has M times more parameters than a single network; for memory-constrained applications, the ensemble can be distilled into a simpler model [10, 26].
- id: c6
  statement: 'UCI regression protocol: the PBP setup (20 train-test folds, 5 for Protein, 1 for Year; 1 hidden layer of 50 or 100 ReLU units; 40 epochs; 5 networks). PBP and MC-dropout numbers are taken
    from their respective papers, not rerun. The authors report better or competitive NLL but slightly worse RMSE on some datasets, which they attribute to optimizing NLL instead of MSE.'
  location: Regression on real world datasets
  page: 6
  quote: Our results are shown in Table 1, along with the PBP and MC-dropout results reported in their respective papers.
- id: c7
  statement: 'Out-of-distribution (unseen classes: MNIST to NotMNIST, SVHN to CIFAR-10, ImageNet dogs vs non-dogs): the entropy of deep ensembles on unseen classes rises faster with M than that of MC-dropout,
    and MC-dropout seems to give high-confidence predictions for some unseen-class examples. In these comparisons M is the number of networks for ensembles and the number of MC samples for MC-dropout (dropout
    rate 0.1 on MNIST; 0.5 was tried and performed worse).'
  location: 'Uncertainty evaluation: test examples from known vs unknown classes'
  page: 7
  quote: In particular, MC-dropout seems to give high conﬁdence predictions for some of the test examples, as evidenced by the mode around 0 even for unseen classes.
- id: c8
  statement: 'Hedge on the components: ensembles even with M = 5 significantly improve uncertainty quality in all cases studied, while adversarial training helps on some datasets for some metrics and is
    not strictly necessary (on SVHN its effect drops as M increases).'
  location: Discussion
  page: 9
  quote: Adversarial training helps on some datasets for some metrics and is not strictly necessary in all cases.
- id: c9
  statement: 'Regression calibration check (Year Prediction MSD, Gaussian prediction intervals at 10%-90%): an ensemble of five networks trained with MSE, using the empirical variance of their predictions,
    consistently underestimates uncertainty, whereas learning the variance with NLL gives a well-calibrated regressor.'
  location: Appendix A.2
  page: 13
  quote: For instance, the 80% prediction interval contains only 20% of the test observations, which means the empirical variance signiﬁcantly underestimates the true predictive uncertainty.

  notes: 'Selected for the topic article requested by the user (2026-10-03): model size, data, compute and performance (scaling laws, compute-optimal training, cost measurement); carded by a subagent. Results
    tables not recorded; claims only. Affiliations: UC Berkeley and Google DeepMind (first author''s work done during an internship at Google DeepMind); the base model PaLM 2 is a Google model. Protocol
    details: strategies are selected per difficulty bin with two-fold cross-validation on the test set (select on one fold, evaluate on the other). The FLOPs-matched comparison scales parameters with a
    fixed amount of training data (matching the LLaMA approach); compute-optimal pretraining with data and parameters scaled together is left to future work. The ~14x larger model is not named in the text
    found. For search methods, cost is measured in generations (lookahead costs N x (k+1) samples). Capability-specific fine-tuning was needed for revision and verification (footnote 1). The authors report
    small gains on hard problems and that on the most difficult questions (level 5) no method makes much meaningful progress.'

claims:
- id: c1
  statement: Most drift detectors in the literature require immediately available true labels, which is unrealistic in many applications.
  location: Abstract
  page: 1
  quote: Most algorithms proposed in the literature depend on the immediate availability of ground truth class labels.
- id: c2
  statement: Ten fully unsupervised detectors are analyzed (architecture, core ideas, assumptions about data).
  location: Abstract
  page: 1
  quote: Ten algorithms are analyzed in terms of architectural choices, core ideas and assumptions about data
- id: c3
  statement: Seven detectors are evaluated on eleven real-world data streams; three were too slow or depended on chance.
  location: Abstract
  page: 1
  quote: Seven of these algorithms are evaluated with common concept drift detection metrics on eleven real-world data streams
- id: c4
  statement: Depending on the target metric, D3, IBDD and SPLL are recommended.
  location: Abstract
  page: 1
  quote: three concept drift detectors—Discriminative Drift Detector, Image-Based Drift Detector and Semi-Parametric Log-Likelihood—can be recommended depending on the desired target metric.
- id: c5
  statement: The evaluation metrics Mean Time Ratio and lift-per-drift have issues.
  location: Abstract
  page: 1
  quote: This study further reveals issues with the evaluation metrics Mean Time Ratio and lift-per-drift.
- id: c6
  statement: Only one stream (INSECTS abrupt balanced) allows computing MTR, which needs ground-truth drift times.
  location: Section 6.2
  page: 12
  quote: INSECTS (abrupt balanced) is the only data stream in this study which can be used to determine MTR.
- id: c7
  statement: In MTR, D3 outperformed the other detectors by a large margin.
  location: Section 6.2
  page: 13
  quote: In these experiments, D3 outperforms other detectors by a large margin
- id: c8
  statement: IBDD was among the worst in MTR despite having the most tested configurations.
  location: Section 6.2
  page: 13
  quote: IBDD is among the worst performers, despite being the least filtered detector
- id: c9
  statement: Classifier accuracy as a proxy metric is biased toward detectors that detect (and adapt) more often.
  location: Section 8
  page: 18
  quote: classifier predictive performance is biased in favor of a higher number of detected concept drifts and adaptations.
- id: c10
  statement: The lift-per-drift metric is biased the other way, favoring fewer detections.
  location: Section 8
  page: 18
  quote: lpdr=1 is likewise biased, as the version used in this study evidently favors fewer detected concept drifts.
- id: c11
  statement: IBDD gave strong classifier accuracy on many streams but did worse in lpd and MTR.
  location: Section 8
  page: 18
  quote: Image-Based Drift Detector (IBDD) [46] achieves great classifier predictive performance on many data streams, although it does not perform as well when assessed with lpd and MTR.
- id: c12
  statement: D3 and SPLL gave the best results on most streams while also giving good classifier accuracy.
  location: Section 8
  page: 18
  quote: Discriminative Drift Detector (D3) [45] and Semi-Parametric Log Likelihood (SPLL) [39] showed the best results on most data streams
- id: c13
  statement: All configuration permutations were tried by grid search.
  location: Section 5.3
  page: 10
  quote: A simple grid search is performed to test all permutations of the configuration parameters
- id: c14
  statement: Several original publications describe no reset after a detection, so the authors added one where needed.
  location: Section 5.3
  page: 10
  quote: several publications do not mention any reset mechanism to adapt to the new concept after the detection of a concept drift.
- id: c15
  statement: 61 publications on unsupervised drift detection were examined.
  location: Section 8
  page: 17
  quote: This study examined 61 publications related to unsupervised concept drift detection.
- id: c16
  statement: Configurations with no detection or periodic detection were filtered out before analysis.
  location: Section 6.1
  page: 11
  quote: the experimental results were filtered to remove those results which featured no detection or periodic concept drift detection
- id: c17
  statement: Real-world streams with known drift ground truth (which drifts, start and end) are hard to obtain.
  location: Section 5.1
  page: 8
  quote: data with known concept drift ground truth information—which concept drifts are present, when do they begin and end—are difficult to obtain.

  notes: 'Selected for the topic article requested by the user (2026-10-03): algorithm design techniques (divide and conquer, dynamic programming, branch and bound, local search) and machine learning; carded
    by a subagent. Results tables not recorded; claims only. PDF states: 32nd Conference on Neural Information Processing Systems (NIPS 2018). Affiliations: Intel Labs (Li, Koltun) and HKUST (Chen). The
    paper states the authors ''will release code'' but gives no URL in the PDF. Limitation (Conclusion): Maximal Clique was not solved on large SNAP/citation graphs because complement graphs are very dense;
    the authors call the approach ''not a universal solution''. No optimality guarantee is claimed; the method is a heuristic search. Re-evaluated by arxiv-2201.10494 (Boether et al., ICLR 2022); the following
    are Boether et al.''s statements, not this paper''s: using the original Intel code (with the original weights and with newly trained weights) and their DGL re-implementation, the default configuration
    (no reduction, no local search) rarely finds solutions on SATLIB within their 30 s SATLIB time limit (this paper used 10 minutes with 16 threads), so they report the claimed SATLIB results as not reproduced;
    replacing the GCN output with random values gave identical performance in the configuration with reduction and local search (randomness beat the GCN on some datasets); they attribute solution quality
    mainly to KaMIS''s reduction and local search, and report undocumented code details (the parallel variant uses one randomly chosen probability map; an ''epoch'' iterates over 2000 of the 38000 training
    samples). The ablation statement in c6 and the generalization statement in c7 are this paper''s own claims. Results tables not recorded.'

relations:
- winner: TabPFN* (3000-sample subset)
  loser: All other 18 algorithms
  basis: Mean log-loss rank over the 98 datasets; Friedman test then Wilcoxon signed-rank tests with Holm-Bonferroni correction (Figure 3).
  benchmark: mcelfresh2023-98-datasets
  location: Section 2.1, Figure 3
  page: 6
  quote: We find that TabPFN outperforms all other algorithms on average across 98 datasets, and this result is statistically significant.
card:
  created_at: '2026-10-02'
  created_by: claude-opus-5-5 via Claude Code
  reviewed: false
  notes: Results extracted mechanically from Table 1 (98 datasets) and Table 2 (57 datasets <= 1250 instances); rank min/max and medians of rank/std/time were not recorded. Table values are aggregates of
    accuracy-based quantities; the significance result (relation) is on log loss. Two inconsistencies in the text (c12, c13). Training time depends on hardware and is per 1000 instances. Normalized accuracy
    is 0-1 scaled per dataset (ADTM), so means are only comparable within the same dataset set.

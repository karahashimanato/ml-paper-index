  notes: 'Selected for the topic article requested by the user (2026-10-03): model size, data, compute and performance (scaling laws, compute-optimal training, cost measurement); carded by a subagent. Results
    tables not recorded; claims only. Estimate sources: training hours and hardware for the cost table are those reported by others, not measured - e.g. BERT GPU time is NVIDIA''s reported 79.2 hours on
    64 V100s, GPT-2''s 1 week on 32 TPUv3 chips is ''Via the authors on Reddit'' (footnote 6), and the NAS hours are converted by the authors from So et al.''s reported steps and TPU base-model time. Cloud
    compute cost ranges use pre-emptible (lower bound) and on-demand (upper bound) U.S. GPU/TPU prices (footnote 7); electricity cost uses the average U.S. price per kWh (footnote 9). Case study (Cost of
    development): the authors use the logs of all training for their own earlier LISA model (Strubell et al., 2018) - 4789 jobs from 123 small grid searches over 172 days on Titan X / M40 GPUs, with cloud
    cost approximated using P100 pricing, and the cost of tuning for a new dataset assumed (''we estimate here'') to require 24 jobs - to estimate the cost of R&D and tuning, i.e. the case-study model is
    the authors'' own. In the Conclusions they also call for a standard hardware-independent measure of training time (e.g. gigaflops to convergence) and for random/Bayesian hyperparameter search APIs instead
    of grid search. Cited for its cost methodology by arxiv-2007.05558 (reference [53]) and by arxiv-1907.10597 (reference [40]).'

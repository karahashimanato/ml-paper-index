  notes: 'Selected for the method article requested by the user (2026-10-10): deep learning architectures for tabular data (TabNet, NODE and differentiable trees, TabTransformer/FT-Transformer-style attention,
    SAINT, embeddings for numerical features, retrieval (TabR), regularized MLPs, CTR-style interaction models, self-supervised pretraining, and surveys/benchmarks comparing them with GBDTs). Carded by
    a subagent. Results tables not recorded; claims only. Affiliation: Google Research (all authors). Venue: the PDF header says ''Published as a conference paper at ICLR 2022'' and the arXiv comment is
    ''ICLR 2022 Spotlight''. Section numbers are from numbered headings in the PDF (the XGBoost baseline is in an unnumbered appendix section ''Absolute performance''). Only deep models are compared in
    the body: a gradient-boosted tree baseline (XGBoost, Python API version 0.6, default XGBClassifier settings: max depth 3, 100 estimators, learning rate 0.1) appears only in the appendix accuracy tables,
    with no comparative statement about it in the text (searched for xgboost, boost, tree, gbdt); those tables are not recorded. No per-dataset hyperparameter tuning of the networks or baselines was found
    in the text (searched for tuned, hyperparameter, default, search): the same architecture and optimizer settings are used throughout, except that the three datasets 4134, 28 and 1468 are left unscaled
    because no scaling was best for the control network. Reported gains are relative to the control network, not to GBDTs. Sensitivity results (batch size past 128 gave no significant improvement; corruption
    rate stable in 50%-80%; temperature 1 recommended; InfoNCE alternatives no better; pre-training beats co-training and pure data augmentation) are shown as figures in Section 4.4 / Appendix A.3. Conflict
    of interest: the Deep k-NN label-noise baseline is the authors'' own earlier method (Bahri, Jiang and Gupta, 2020). The conclusion notes a potential negative side effect: learned representations may
    reinforce biases in the input data.'

  notes: 'Selected for the method article requested by the user (2026-10-11): aligning language models with human preferences (preference comparisons and reward models, PPO-based RLHF with a KL penalty,
    AI feedback, direct preference optimization and its variants, reward overoptimization, length bias, reward-model evaluation, and open problems). Carded by a subagent. Results tables not recorded; claims
    only. All authors at OpenAI. No venue is stated in the arXiv PDF and the arXiv record has no comment/journal_ref; none recorded. Conflict of interest: the policy and reward models start from OpenAI''s
    own GPT-2 (774M), and the method follows Christiano et al. (2017), whose authors overlap (Christiano, Amodei, Brown). Setup: PPO2 from OpenAI Baselines (Dhariwal et al., 2017), 2M episodes, ''default
    values for the other parameters'' (Section 2.2); beta fixed at 0.1 (CNN/Daily Mail) and 0.03 (TL;DR), KL targets 6 nats (descriptiveness) and 10 nats (sentiment). 5% of queries were answered 5 times
    by different labelers to estimate agreement (Section 2.3). Section 4.2: sharing parameters between reward model and policy caused overfitting (60k RM samples vs 2M policy episodes). Section 4.3: ambiguous
    tasks make consistent labeling hard; the authors suggest less ambiguous labeling tasks (e.g. describing problems). Human-evaluation win rates and ROUGE are in Tables 1, 4, 5 (not recorded); the body-text
    summary numbers (86% vs zero-shot, 77% vs the mock-sentiment model for continuation; 96%/84% vs references for summarization) appear in the Introduction and Sections 3.1.2/3.2. Follow-up: arxiv-2009.01325
    (overlapping authors) moves to batched/offline collection and high labeler-researcher agreement in response to the mismatch reported here.'

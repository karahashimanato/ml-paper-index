- id: gorishniy2021-ca-single
  scope: paper-private
  task: tabular-regression
  dataset: California Housing
  protocol:
    split: One fixed train/validation/test split per dataset, shared by all algorithms (Section 4.2; sizes in Appendix Table 7).
    preprocessing: 'Quantile transformation by default; standardization for Helena and ALOI; raw features for Epsilon; regression targets standardized (Section 4.3). XGBoost: one-hot categorical; CatBoost:
      native categorical; NNs: categorical embeddings.'
    tuning: Optuna (TPE) with per-model iteration budgets, or predefined configuration grids from the original papers (Section 4.3, Appendices E-F). FT-Transformer untuned on Yahoo and heuristic configurations
      on Epsilon (Appendix E.2).
    repetitions: Mean of 15 runs with different random seeds of the tuned configuration (Section 4.3).
  metrics: &id001
  - name: rmse
    higher_is_better: false
  defined_in: arxiv-2106.11959
- id: gorishniy2021-ca-ensemble
  scope: paper-private
  task: tabular-regression

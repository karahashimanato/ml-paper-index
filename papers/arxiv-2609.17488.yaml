claims:
- id: c1
  statement: LimiX-2 uses the Contextual Mechanism Networks paradigm and is pretrained with Context-Conditional Masked Modeling.
  location: Abstract
  page: 1
  quote: LimiX-2 adopts the Contextual Mechanism Networks (CMNs) paradigm and is pretrained with Context-Conditional Masked Modeling (CCMM).
- id: c2
  statement: On TabArena, TALENT and BCCO, LimiX-2 outperforms current dataset-specific models and tabular foundation models.
  location: Abstract
  page: 1
  quote: Evaluations on TabArena, TALENT, and BCCO show that LimiX-2 outperforms current dataset-specific models and tabular foundation models.
- id: c3
  statement: For TabArena, baseline scores are taken from the published leaderboard (accessed September 15, 2026) and Elo is computed with the official TabArena pipeline.
  location: Experimental setup
  page: 10
  quote: We take the published leaderboard scores as the reference for existing baselines (accessed September 15, 2026) and then report the Elo rating computed by the official TabArena evaluation pipeline,
    ensuring direct comparability with the leaderboard results.
- id: c4
  statement: On TALENT and BCCO, models integrated in the TALENT library are run with their default configurations, including model-specific hyperparameter settings.
  location: Experimental setup
  page: 11
  quote: For models integrated into the TALENT library, we use their default configurations, including model-specific hyperparameter settings.
- id: c5
  statement: Twelve TALENT classification datasets with more than 10 target classes are excluded, leaving 288 datasets.
  location: Experimental setup
  page: 10
  quote: Excluding 12 classification datasets with more than 10 target classes, we perform evaluation on the remaining 288 datasets.
- id: c6
  statement: One of the three benchmarks, BCCO, is cited as a 2025 work of the LimiX Team, the same team that authors this report.
  location: Experimental setup
  page: 10
  quote: Three widely adopted benchmarks, TabArena (Erickson et al., 2025), TALENT (Ye et al., 2024; Liu et al., 2024), and BCCO (LimiX Team, 2025), are used for evaluation.

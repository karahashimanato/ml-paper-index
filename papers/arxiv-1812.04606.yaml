proposes:
- 'Outlier Exposure (OE): training (usually fine-tuning) an anomaly/OOD detector with an extra loss on an auxiliary dataset of real, diverse outliers that is disjoint from the test-time outliers, e.g. cross-entropy
  to the uniform distribution for the maximum softmax probability detector and a margin ranking loss on log-likelihoods for density estimators'
claims:
- id: c1
  statement: 'Setting: the distribution of test-time outliers D_out is assumed unknown; the model is trained to distinguish in-distribution data from an OE dataset that is disjoint from the test outliers,
    and the learned heuristics are found to generalize to unseen outlier distributions.'
  location: Outlier Exposure
  page: 2
  quote: Thus, we consider the realistic setting where Dout is unknown.
- id: c2
  statement: 'OE loss is a design choice per detector: for the maximum softmax probability baseline (Hendrycks & Gimpel, 2017), L_OE is the cross-entropy from f(x'') to the uniform distribution (following
    Lee et al., 2018); for density estimation without labels, a margin ranking loss on the log probabilities.'
  location: Outlier Exposure
  page: 3
  quote: For example, when using the maximum softmax probability baseline detector (Hendrycks & Gimpel, 2017), we set LOE to the cross-entropy from f(x′) to the uniform distribution (Lee et al., 2018).
- id: c3
  statement: 'Hyperparameter selection: unlike Liang et al. (2018) and Lee et al. (2018), hyperparameters are not tuned for each test outlier distribution; the OE weight lambda was determined early in experimentation
    with validation outlier distributions (Appendix A), and chosen so that the impact on classification accuracy is negligible: lambda = 0.5 for vision and 1.0 for NLP.'
  location: Multiclass Classification
  page: 4
  quote: In particular, we use λ = 0.5 for vision experiments and λ = 1.0 for NLP experiments.
- id: c4
  statement: Validation outliers used for tuning are uniform noise and synthetic corruptions of in-distribution data (arithmetic/geometric means of image pairs, jigsaw patch permutation, speckle noise,
    RGB ghosting, channel inversion), i.e. no samples from the test outlier datasets.
  location: Appendix A
  page: 14
  quote: generated by corrupting in-distribution data, so that the data becomes out-of-distribution.
- id: c5
  statement: 'Metrics: AUROC, AUPR and FPR at N% TPR (FPR95 for vision, FPR90 for NLP), with OOD examples as the positive class; AUROC and AUPR summarize performance across thresholds while FPRN represents
    performance at one strict threshold.'
  location: Section 4.1
  page: 3
  quote: Whereas the previous two metrics represent the detection performance across various thresholds, the FPRN metric represents performance at one strict threshold.
- id: c6
  statement: 'Synthetic outliers: distorting images with noise and using them as OE did not help, since the classifier quickly memorized the statistical pattern; compared with a classifier trained with
    GAN-generated outliers (Lee et al., 2018''s code with default hyperparameters, one model for all test distributions), real and diverse OE data gave large gains.'
  location: Section 4.3
  page: 5
  quote: Note that we made an attempt to distort images with noise and use these as outliers for OE, but the classiﬁer quickly memorized this statistical pattern and did not detect new OOD examples any
    better than before (Hafner et al., 2018).
- id: c7
  statement: 'Diversity of the OE data matters, not just size: a CIFAR-100 classifier with CIFAR-10 as OE hardly improves over the baseline, and for a CIFAR-10 classifier exposed to 10, 30 and 50 CIFAR-100
    classes the average AUPR is 78.5%, 85.1% and 85.3%, with further classes barely helping. Experiments often used around 1% of 80 Million Tiny Images, and using only 50,000 examples gave negligible degradation.'
  location: Section 5 (Discussion)
  page: 7
  quote: This suggests that dataset diversity is important, not just size.
- id: c8
  statement: 'Closeness: the OE data need not be close to the test outliers, but closeness of the OE data to the in-distribution data can matter; in NLP, without preprocessing the OE data the network may
    discover easy cues and optimize the OE objective in unintended ways. Online hard example mining improved the hardest anomalies but slightly worsened detection of anomalies like noise, so hard or close-to-distribution
    examples do not necessarily teach all useful heuristics.'
  location: Section 5 (Discussion)
  page: 8
  quote: Without preprocessing, the network may discover easy-to-learn cues which reveal whether the input is in- or out-of-distribution, so the OE training objective can be optimized in unintended ways.
- id: c9
  statement: 'Density estimation: PixelCNN++ trained on CIFAR-10 (score: bits per pixel) without OE unexpectedly assigns lower BPP to SVHN images than to CIFAR-10 images; fine-tuning with OE (a margin loss
    on the log-likelihood difference) is reported to significantly improve results for all test outlier datasets.'
  location: Density Estimation
  page: 6
  quote: Notice that PixelCNN++ without OE unexpectedly assigns lower BPP from SVHN images than CIFAR-10 images.

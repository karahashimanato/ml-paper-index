  notes: 'Selected for the topic article requested by the user (2026-10-03): algorithm design techniques (divide and conquer, dynamic programming, branch and bound, local search) and machine learning; carded
    by a subagent. Results tables not recorded; claims only. PDF states: Published as a conference paper at ICLR 2019. Instances: TSP node locations sampled uniformly at random in the unit square (Appendix);
    models trained on n = 20, 50 and 100; 10000 test instances per problem; greedy decoding vs sampling 1280 solutions and reporting the best. Gurobi is used as the ''best possible solution'' (intractable
    for n > 20 except TSP) and also with time limits as a heuristic baseline; the authors state they picked reasonable runtime/performance trade-off points rather than full curves. CVRP compared against
    Nazari et al. RL and LKH3. Hardware: training on 1080Ti GPUs (TSP100 on 2 GPUs). The text reports the AM outperforms the Pointer Network under any baseline, and that the authors could not reproduce
    Bello et al.''s 1.5% with a critic baseline. Relation to classical techniques: the AM is a learned construction heuristic (end-to-end); no local search is used for its results (2OPT appears only with
    the Deudon et al. comparison). Results tables not recorded.'

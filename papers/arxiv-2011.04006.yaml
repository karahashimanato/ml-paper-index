proposes:
- 'Long Range Arena (LRA): a benchmark of six long-sequence tasks (Long ListOps up to 2K, byte-level IMDb text classification at 4K, byte-level AAN document retrieval at 4K per document in a two-tower setup,
  CIFAR-10 as grayscale pixel sequences of 1024, Pathfinder at 1024 and Path-X at 16K) without pretraining, with fixed hyperparameters per task'
- A side-by-side evaluation of a vanilla Transformer, local attention and ten efficient Transformers (Sparse Transformer, Longformer, Linformer, Reformer, Sinkhorn, Synthesizer, BigBird, Linear Transformer,
  Performer) on accuracy, speed and memory, implemented in JAX/Flax
- 'Required attention span: the attention-weighted mean query-key distance of a trained vanilla Transformer, used as a proxy for task difficulty'
claims:
- id: c1
  statement: 'Motivation: the authors observe that there is no consensus on an acceptable test bed for efficient Transformers, every model is evaluated on different tasks and datasets, benchmarks are often
    chosen without considering suitability for long-range modeling, and many papers conflate the effectiveness of the inductive bias with the benefits of pretraining.'
  location: Introduction
  page: 1
  quote: Firstly, there is no unifying consensus on what makes an acceptable test bed for benchmarking efﬁcient Transformers.
- id: c2
  statement: 'Desiderata: generality (encoding-only tasks, since not all xformers can decode autoregressively), simplicity (no particular data augmentation, pretraining out of scope), challenging tasks,
    long inputs, probing diverse capabilities, and being lightweight enough for researchers without industry-grade compute.'
  location: Section 2.1
  page: 2
  quote: For instance, we avoid including any particular data augmentation and consider pretraining to be out of scope of this benchmark.
- id: c3
  statement: Required attention span (mean query-to-attended-token distance weighted by attention, from the best vanilla Transformer, averaged over 1K validation samples) is used as a proxy for task difficulty,
    with the caveat that it only indicates the span and relative task differences based on a reasonably strong model, and a better model might only need to attend to shorter ranges.
  location: Section 2.3
  page: 5
  quote: Note that this metric mainly provides an indication of the required attention span for a task and the relative differences between tasks based on a reasonably strong model; a better model might
    only need to attend to shorter ranges (Daniluk et al., 2017; Rae & Razavi, 2020).
- id: c4
  statement: 'Fairness caveat: a perfectly fair evaluation is described as non-trivial and almost impossible; a fixed set of hyperparameters (layers, heads, embedding dimensions, etc.) is used for all models,
    the best performance and relative order may change under aggressive tuning, and the results are not meant as a final authoritative ranking. The authors implemented all models to the best of their abilities
    and often consulted the original developers.'
  location: Section 3.2
  page: 6
  quote: The best performance and relative order of the models may change if we aggressively tune hyperparameters for all models.
- id: c5
  statement: On ListOps, roughly half of the xformers exceed 30% while the rest are only slightly above chance; the authors say this may imply some efficiency-inspired inductive biases handle hierarchical
    data better, and that their results seem to suggest kernel-based models (e.g. Performer, Linear Transformers) are possibly not as effective on hierarchically structured data.
  location: Section 3.3
  page: 6
  quote: For instance, the results from our experiments seem to suggest that kernel-based models (e.g., Performer, Linear Transformers) are possibly not as effective on hierarchically structured data.
- id: c6
  statement: 'Path-X: all models failed, achieving at best 50%, although it is essentially the same task as Pathfinder with much longer sequences; Path-X is kept in the suite but excluded from the average
    score. Per the appendix, neither training from scratch nor evaluating Pathfinder-trained models handled 16K inputs.'
  location: Section 3.3
  page: 7
  quote: All models failed to solve the Path-X task, achieving at best 50%.
- id: c7
  statement: 'Efficiency measurement conditions: run time and memory are measured only on byte-level text classification at sequence lengths 1K-4K with batch size 32 on 4x4 TPU V3 chips, and the authors
    emphasize that results are largely conditioned on hardware and implementation details.'
  location: Section 3.4
  page: 7
  quote: We emphasize that this is again largely conditioned on hardware and implementation details (more details can be found in the appendix).
- id: c8
  statement: 'Rules for reuse: new models may copy the LRA table as is only if the model size is unchanged, no pretraining is conducted, and the fundamental setups are not altered (e.g. no switch from char
    to word level, no spatial information added to the image task).'
  location: Appendix C
  page: 16
  quote: the LRA table in the paper can be copied as it is as long as (1) the model size remains unchanged, (2) no pretraining is conducted, (3) no alterations to the fundamental setups (e.g., changing
    char level to word level or adding spatial information to the image task).
- id: c9
  statement: 'Overall conclusion: the tasks are very challenging even for long-range Transformers and there is no one-size-fits-all model; trade-offs must be made between model quality and speed/memory.'
  location: Section 5
  page: 9
  quote: The overall results show that there is no one-size-ﬁts-all solution and trade-offs have to be made in terms of model quality and speed/memory.

proposes:
- 'HELM: a top-down taxonomy of scenarios (task, domain, language) and metrics, with 16 core scenarios each measured on 7 metric categories (accuracy, calibration, robustness, fairness, bias, toxicity,
  efficiency) plus 7 targeted evaluations over 26 further scenarios'
- Standardized evaluation of 30 language models with the same scenarios, metrics and 5-shot prompts, releasing all raw prompts and completions and a modular toolkit
claims:
- id: c1
  statement: 'The authors define holistic evaluation by three elements: broad coverage with recognition of incompleteness (a top-down taxonomy that makes missing scenarios and metrics explicit), multi-metric
    measurement (evaluating every desideratum for each scenario), and standardization (controlling the adaptation strategy and evaluating each LM on the same scenarios as far as possible).'
  location: Introduction
  page: 2
  quote: 'We believe holistic evaluation involves three elements:'
- id: c2
  statement: Scenarios are (task, domain, language) triples; the core set spans 6 user-facing tasks, several domains and currently only English (with several English varieties); the 7 metric categories
    are described as complex and contested social constructs that can be operationalized in many ways; of the 112 possible (core scenario, metric) pairs, 98 (87.5%) are measured.
  location: Section 1.1
  page: 3
  quote: of the 112 possible (core scenario, metric) pairs, we measure 98 (87.5%) as shown in Table 4.
- id: c3
  statement: 'Uneven prior evaluation: before HELM, models were on average evaluated on 17.9% of the core scenarios even after compiling evaluations from prior works; HELM raises this to 96.0% and evaluates
    under standardized conditions (e.g. the same few-shot prompting for all models) to allow direct head-to-head comparisons.'
  location: Section 1.1
  page: 5
  quote: Previously, on average models were evaluated on 17.9% of our core scenarios, even after compiling evaluations dispersed across different prior works.
- id: c4
  statement: 'Adaptation protocol: the number of in-context examples (5) follows Brown et al. (2020); the examples are sampled to ensure class coverage and fixed across all evaluation instances (unlike
    Brown et al., 2020), which the authors note makes performance more sensitive to the random choice of examples, so all experiments are re-run 3 times varying only the in-context sample selection.'
  location: Section 7
  page: 46
  quote: Critically, we choose to fix the in-context examples across all evaluation instances, in contrast to prior work (e.g. Brown et al., 2020), to more accurately perform few-shot evaluation (Perez
    et al., 2021).
- id: c5
  statement: 'Multiple-choice adaptation: comparing joint (all choices in one prompt, predict the letter), separate (score each choice independently) and separate-calibrated (normalize by the choice''s
    standalone probability), the accuracy-maximizing method is largely determined by the scenario; on HellaSwag all six models follow separate > separate-calibrated > joint, and for OPT (175B) the accuracies
    are 79.1%, 54.8% and 30.2% respectively.'
  location: Section 8.2
  page: 58
  quote: 'This choice can be very consequential for the model accuracy: for OPT (175B), the accuracies are 79.1%, 54.8%, and 30.2% respectively.'
- id: c6
  statement: 'Prompt formatting: using motivated but ''fairly ad hoc/arbitrary'' changes to instructions and input/output prefixes and suffixes, the authors find the best prompt format is not consistent
    across models (e.g. one variant gives 67.3% for Anthropic-LM v4-s3 (52B) on NaturalQuestions (open-book) while BLOOM (176B) drops from around 60% to 8.5%), and believe some changes may interact poorly
    with the tokenizer.'
  location: Section 8.2
  page: 57
  quote: The clear finding is that the best prompt formatting is not consistent across models
- id: c7
  statement: 'Variance across in-context example draws (3 seeds): the authors observe most models are relatively consistent, with median range across scenarios below 0.03 for 24 of 28 models, but some scenarios
    show higher variance for all models (NaturalQuestions (open-book) median range 0.1730). For the number of in-context examples (0 to 16), models clearly improve from 0 to 1 shot (except CNN/DailyMail)
    but larger numbers do not give consistent benefits.'
  location: Section 8.2
  page: 56
  quote: 'We observe that the performance of most models tends to be relatively consistent: the median range (across scenarios) is below 0.03 for 24 out of 28 models (exceptions are YaLM (100B), davinci
    (175B), curie (6.7B), ada (350M)).'
- id: c8
  statement: 'Contamination: without access to or disclosure of training data, the authors cannot verify whether models were trained on the evaluation data, a concern heightened by few-shot evaluation;
    they flag known contamination disclosed by model creators (compiled in Appendix G, described as still largely limited) and encourage proactive disclosure and the use of canaries.'
  location: Section 6
  page: 45
  quote: We encourage more proactive documentation/disclosure of model contamination, as well as the use of canaries or other methods for minimizing contamination, for future work on language model development
    to maintain the health of the evaluation ecosystem.
- id: c9
  statement: 'Reliability limitation: the authors state they lack uniform evidence for the reliability of their measurement and highlight the importance of significance testing, since running only 3 random
    seeds (due to cost) for selecting in-context examples and evaluating on 1000 instances instead of the full validation/test sets may render some of their claims statistically insignificant.'
  location: Limitations and future work
  page: 82
  quote: That is, both of these settings for our evaluation may render some of our claims statistically insignificant; we encourage future work to consider how to better address significance given the scale
    of this evaluation.

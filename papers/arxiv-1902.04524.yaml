proposes:
- 'Residual-time prediction for BOCPD: the posterior over the number of steps until the next change point, computed from the run-length posterior and the hazard function'
- 'Bayesian Online Segment Detection (BOSD): online inference over run length, total segment duration and hidden state of an HSMM, allowing underlying predictive models that depend on the total segment
  duration; hyperparameters learned by supervised maximum likelihood from labelled sequences'
claims:
- id: c1
  statement: 'Residual time: the posterior over the residual time (steps until the end of the current segment) is obtained by summing p(l_t | r_t) p(r_t | data) over run lengths, where p(l_t | r_t) depends
    only on the hazard function and can be precomputed; this assumes the observation model is independent of the residual time and the segment duration.'
  location: Residual Time Prediction for BOCPD
  page: 4
  quote: Note the assumption of independence of the observation model with respect to the residual time and the segment duration.
- id: c2
  statement: With a constant hazard the residual-time posterior equals c(1-c)^l regardless of the observations, which the authors say suggests that online prediction of changepoints is more meaningful for
    non-constant hazards.
  location: Residual Time Prediction for BOCPD
  page: 4
  quote: This suggests that online prediction of CPs is more meaningful for non-constant hazard settings.
- id: c3
  statement: The hazard implicitly induces a distribution over segment durations; a constant hazard induces a geometric duration distribution (as in a standard HMM).
  location: Section 2.2
  page: 2
  quote: induces a geometric distribution over the segment duration
- id: c4
  statement: An HSMM with a single hidden state is an equivalent generative model to BOCPD; differences are the parameterization (total segment duration vs run length through the hazard) and inference (HSMMs
    mostly batch forward-backward/Viterbi, BOCPD filtering with incomplete segments).
  location: HSMMs vs BOCPD
  page: 3
  quote: Note that an HSMM (Section 2.1) with a single hidden state K = 1 leads to an equivalent generative model for BOCPD.
- id: c5
  statement: Hyperparameters (transition matrix, duration matrix, observation-model parameters, initial state distribution) are learned by maximum likelihood from labelled sequences with marked change points,
    since domain knowledge is usually limited; an unsupervised EM variant is described as possible.
  location: Section 4.4
  page: 5
  quote: We adopt a data-driven approach by using labeled observation sequences where the change point locations have been marked.
- id: c6
  statement: 'Cost: per-step complexity O(K^2 + D^3 K) for arbitrary underlying predictive models and O(K^2 + D^2 K) with exponential-family (sufficient-statistic) models, where K is the number of hidden
    states and D the maximum duration; the same O(K^2 + D^2 K) holds for duration-agnostic models, and whether exact residual-time inference can be done more efficiently is left open.'
  location: Section 4.5
  page: 5
  quote: We leave as an open question whether it is possible to achieve a more efﬁcient update to exactly infer the residual time
- id: c7
  statement: 'Synthetic experiment caveat: the run-length inference has almost no uncertainty, which the authors attribute to using the actual generative models to process the synthetic observations.'
  location: Section 5.1
  page: 6
  quote: This high conﬁdence occurs as a consequence of using the actual generative models to process the synthetic observations.
- id: c8
  statement: 'Mice sleep staging protocol: 3 mice (2 EEG + 1 EMG channels, 24h, 4-second epochs); one mouse is the test subject and the other two with labels are used for supervised MLE; K = 3, D = 1500,
    with a duration-agnostic Gaussian model on frequency-band features for computational reasons. Compared with FASTER (an offline method), the authors report NREM F1 of 0.45 for FASTER versus 0.84 for
    their method and note that their method ran online while FASTER handled the easier offline case. How FASTER was configured was not found in the text (searched for FASTER, tune, default).'
  location: Section 5.2
  page: 8
  quote: Note that our algorithm performed online inference while FASTER considered the signiﬁcantly easier ofﬂine case.
- id: c9
  statement: Run-length inference is much more confident than residual-time inference, which the authors attribute mostly to residual time being inherently predictive whereas the run length concerns an
    event that has already happened.
  location: Section 5.2
  page: 8
  quote: This is mostly due to the fact that the residual time prediction is inherently a predictive task, whereas the run length estimation accounts for an event that has already happened and from which
    there must be more evidence about.

  notes: 'Selected for the topic article requested by the user (2026-10-11): pitfalls in evaluating large language models (benchmark contamination and its detection, prompt and answer-format sensitivity,
    LLM-as-a-judge biases, human-preference arenas, holistic evaluation, benchmark errors, and reproducibility of evaluation harnesses). Carded by a subagent. Results tables not recorded; claims only. Affiliations:
    UC Berkeley, UC San Diego, CMU, Stanford, MBZUAI (LMSYS). Venue from the PDF footer (''37th Conference on Neural Information Processing Systems (NeurIPS 2023) Track on Datasets and Benchmarks.'') and
    the arXiv comment. Conflict of interest: the authors created Vicuna (stated in the text) and run Chatbot Arena and the FastChat code; the paper is ''an extended version of our earlier blog post'' on
    Vicuna. Appendix F explores Vicuna-13B fine-tuned on 20K Arena votes as a judge. Agreement setup: on MT-bench, answers to all 80 questions from 6 models (GPT-4, GPT-3.5, Claude-V1, Vicuna-13B, Alpaca-13B,
    LLaMA-13B) judged by LLM judges and 58 expert-level labelers (mostly graduate students), around 3K votes; on Chatbot Arena, 3K single-turn votes sampled from 30K (2114 unique IPs). Appendix D.3 notes
    the agreement among humans could be a lower estimation compared with GPT-4-human agreement, and introduces a human-majority judge. Data-collection caveat (Section 4.2, Appendix C.1): when a human''s
    vote differed from GPT-4, GPT-4''s judgment was shown to the human, who deemed it reasonable in 75% of cases and changed their choice in 34%; MT-bench labelers were paid $20 for 20 questions. Appendix
    Table 13 also reports author votes. Judge versions: case-study examples were generated by gpt-4-0314 (''They may not be fully reproducible with future GPT-4 versions''); no dated version was found for
    the main experiments (searched 0314, 0301, 0613, version). Stated limitations (Discussion): emphasizes helpfulness but largely neglects safety; accuracy, relevance and creativity are combined into one
    metric. Section numbers 3.3, 3.4 and 4.2 are from cross-references in the text (''In Section 3.3, we have shown...'', ''§4.2''). Win-rate figures and agreement tables are not recorded.'

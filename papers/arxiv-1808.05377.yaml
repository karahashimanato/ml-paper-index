    to 2019 because the recorded JMLR version states 2019. PDF is the arXiv v3 under CC-BY 4.0 (stated on the first page). Section numbers from the numbered headings and the cross-reference ''we start with
    discussing search spaces in Section 2, cover search strategies in Section 3, and outline performance estimation methods in Section 4''. Survey; no experiments. Conflict-of-interest note: the authors
    (Bosch Center for AI / University of Freiburg) discuss several of their own methods (e.g. Elsken et al. 2017/2019, Zela et al. 2018, BOHB by Falkner et al. 2018 from the same group); the survey does
    not state this as a conflict of interest. The survey also notes most NAS work has focused on image classification, where search spaces built from manual engineering make it unlikely that NAS finds fundamentally
    different architectures (Section 5).'

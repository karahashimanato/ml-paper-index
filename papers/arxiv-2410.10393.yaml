claims:
- id: c1
  statement: GIFT-Eval's train/test component has 23 datasets (over 144,000 series, 177 million points) across seven domains, 10 frequencies, univariate and multivariate inputs, and short to long horizons;
    results are aggregated over 97 dataset/frequency/horizon configurations with MAPE and CRPS normalized by Seasonal Naive plus an average CRPS rank.
  location: Abstract
  page: 1
  quote: GIFT-Eval encompasses 23 datasets over 144,000 time series and 177 million data points, spanning seven domains, 10 frequencies, multivariate inputs, and prediction lengths ranging from short to
    long-term forecasts.
- id: c2
  statement: The benchmark also provides a pretraining corpus (71 univariate and 17 multivariate datasets) stated to have no leakage into the train/test split, so that foundation models pretrained on it
    can be fairly evaluated.
  location: Benchmark (Pretraining data)
  page: 6
  quote: Notably this collection of data has no leakage issue with the train/test split and can be used to pretrain foundation models that can be fairly evaluated on GIFT-Eval.
- id: c3
  statement: 'Leakage: the pretraining sets of public TimesFM, Chronos and Moirai partially overlap with GIFT-Eval; the authors retrained Moirai on the non-leaking split for the main tables and compared
    it with the original Moirai, finding that in most cases leakage can boost test performance, more so at longer horizons, which they read as memorization.'
  location: Appendix (Data leakage effect in foundation models)
  page: 21
  quote: In most cases, data leakage from training sets can boost performance on the corresponding test sets, with this effect becoming more pronounced as prediction length increases.
- id: c4
  statement: 'Tuning asymmetry: deep learning baselines are tuned with 15 trials per model for each of the 97 runs (validation = last training window), whereas foundation models are evaluated zero-shot
    on the test split, with TimesFM and VisionTS settings taken from their papers/defaults, a context-length search for Moirai, and a seasonality search on validation data for VisionTS (see notes on which
    Moirai checkpoints are used).'
  location: Appendix (Deep learning models)
  page: 16
  quote: We search for 15 trials for each deep learning model per each of the 97 runs.
- id: c5
  statement: 'Overall result: PatchTST has the top average scores in all metrics, with MoiraiLarge second; by best/second-best counts Crossformer is most often best and MoiraiLarge most often in the top
    2.'
  location: Results (Overall)
  page: 9
  quote: PatchTST emerges as the most dominant model, securing the top average scores in all metrics, with MoiraiLarge consistently following in second place.
- id: c6
  statement: Foundation models (particularly Moirai variants) lead on short horizons (and, in the separate frequency analysis, on daily to yearly data), but TimesFM and Chronos decline at medium/long horizons
    (attributed to recursive decoding error accumulation) and deep models such as PatchTST do better there; the authors also report that GIFT-Eval does not consistently support scaling laws for TSFMs.
  location: Results (Prediction length)
  page: 8
  quote: Thus despite the progress in foundational time series research, there remains a notable performance gap between deep learning and foundation models for medium to long-term predictions,
- id: c7
  statement: 'Affiliation: authors are at Salesforce AI Research (and NUS); the paper''s own reference for Moirai lists Woo, C. Liu, Kumar, Xiong, Savarese and Sahoo, five of whom are GIFT-Eval authors,
    i.e. the benchmark authors overlap with the authors of one of the evaluated models (no explicit conflict-of-interest statement found).'
  location: References
  page: 15
  quote: Gerald Woo, Chenghao Liu, Akshat Kumar, Caiming Xiong, Silvio Savarese, and Doyen Sahoo.

  notes: 'Selected for the topic article requested by the user (2026-10-03): model size, data, compute and performance (scaling laws, compute-optimal training, cost measurement); carded by a subagent. Results
    tables not recorded; claims only. Affiliation: all authors list OpenAI (Kaplan also Johns Hopkins University). Range (Section 3 list): model size from 768 to 1.5 billion non-embedding parameters, dataset
    size from 22 million to 23 billion tokens; WebText2 with BPE vocabulary 50257 and 1024-token context. N excludes vocabulary and positional embeddings, which the authors say gives cleaner scaling laws.
    Appendix C (Caveats) lists: no solid theoretical understanding; low confidence in Bcrit far outside the explored range; small-data regime not thoroughly investigated and no regularization/data augmentation
    experiments; C ≈ 6NBS omits n_ctx terms; learning rates tuned but other hyperparameters (e.g. initialization scale, momentum) may not have been; no experiments with higher learning rates for runs not
    trained to convergence.'

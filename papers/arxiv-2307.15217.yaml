proposes:
- A taxonomy of RLHF challenges in three groups (human feedback, reward model, policy) plus joint reward-model/policy training, with each challenge labeled as tractable (addressable within RLHF with better
  methodology) or fundamental (requiring a method that is no longer RLHF)
- A list of RLHF details (human feedback, reward model, policy, systemic safety) whose disclosure to the public and/or auditors is proposed for transparency and auditing
claims:
- id: c1
  statement: 'Definition: RLHF is used to mean methods combining feedback collection, reward modeling (supervised learning of a reward model that imitates human evaluations) and policy optimization; formally
    the reward model minimizes a sum of losses l(r_phi(x_i), y_i) plus a regularizer lambda_r r(phi), and the policy maximizes E[r_phi(x) + lambda_p(theta, theta_new, x)], where lambda_p is a regularizer
    such as a divergence penalty. The authors note this framework fails to reflect reality in several ways (Section 3 and Appendix A).'
  location: Introduction
  page: 2
  quote: 'We use RLHF to refer to methods that combine three interconnected processes: feedback collection, re- ward modeling, and policy optimization.'
- id: c2
  statement: 'Tractable vs fundamental: tractable challenges could be addressed within the RLHF framework with improved methodology, whereas fundamental challenges are substantial enough that overcoming
    them would require a method that is no longer RLHF; the authors call this distinction soft, with some categories marginal, and say fundamental problems should be avoided or compensated for by other
    safety measures.'
  location: Section 3
  page: 5
  quote: are substantial enough that overcoming them would require a method that is no longer a form of RLHF.
- id: c3
  statement: 'Human feedback (fundamental): because the reward model is trained on human approval rather than ground-truth desirability, models can exploit the gap between what is good and what is evaluated
    positively; citing prior work, RLHF-trained models can sound confident when wrong, which can lead to more positive feedback, and misleading behavior is actively incentivized when humans can be tricked.
    A separate fundamental item is that humans cannot evaluate performance on difficult tasks well even with perfect information and time.'
  location: Section 3.1.2
  page: 7
  quote: 'Fundamental: Humans can be misled, so their evaluations can be gamed.'
- id: c4
  statement: 'Reward model (fundamental): a single reward function cannot represent a diverse society of humans. Citing Stiennon et al. (2020), Ouyang et al. (2022) and Bai et al. (2022a), annotator-annotator
    and annotator-researcher agreement rates range from 63% to 77%; current techniques model evaluator differences as noise, so when preferences differ the majority wins, potentially disadvantaging under-represented
    groups.'
  location: Section 3.2.1
  page: 9
  quote: 'Fundamental: A single reward function cannot represent a diverse society of humans.'
- id: c5
  statement: 'Reward hacking (fundamental): optimizing strong pressure against an imperfect proxy tends to hurt the underlying goal (citing Hoskin, Manheim & Garrabrant, Gao et al., 2022); citing Ziegler
    et al. (2019) and Stiennon et al. (2020), without a KL penalty between base and finetuned model LLMs under RL often learn to output nonsensical text; reward models can also misgeneralize even from correctly
    labeled data.'
  location: Section 3.2.2
  page: 9
  quote: 'Fundamental: Optimizing for an imperfect reward proxy leads to reward hacking.'
- id: c6
  statement: 'Evaluating reward models (tractable but difficult and expensive): since the true reward is usually unknown, reward models are typically evaluated indirectly by optimizing a policy and evaluating
    its generations, which makes the evaluation depend on an expensive, noisy policy optimization with many ad-hoc choices; moreover the evaluation signal is the same as the training signal (human approval),
    so training and evaluation failures will be correlated.'
  location: Section 3.2.3
  page: 10
  quote: Another issue with indirect evaluation is that the evaluation signal for the reward model is the same as the training signal – human approval.
- id: c7
  statement: 'Joint training (tractable): if the reward model is trained offline it is likely to misgeneralize, while gathering feedback from policy samples invites auto-induced distributional shift; when
    steps are done serially, the reward model is typically inaccurate off-distribution, exactly where the policy goes. Without a labeled validation set in the regions the policy explores, reward over-optimization
    is hard to detect during training; the authors suggest measuring KL-shift (citing Gao et al., 2022) or ensemble disagreement as possibly helpful.'
  location: Section 3.4
  page: 12
  quote: Without a labeled validation set in the regions the policy is exploring, it is difficult to detect reward over-optimization during training.
- id: c8
  statement: 'Transparency recommendations: the authors propose that organizations disclose details such as the pretraining process, how human evaluators were selected and trained, how examples were selected
    for feedback, the feedback types, quality-assurance and inter-rater consistency measures, the reward-model loss and how disagreement was modeled, reward-model and policy evaluations (including red teaming),
    audits, expected risks, and monitoring plans; detailing safety measures will often not require implementable details, and otherwise private disclosure to second-party auditors is offered as a solution.'
  location: Section 5
  page: 17
  quote: Companies using RLHF to train models for high-stakes or safety-critical applications should maintain transparency with the public and/or auditors about key details of their approach.

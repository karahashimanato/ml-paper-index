  notes: 'Selected for the method article requested by the user (2026-10-10): alternatives and extensions to dense Transformers (sparse mixture-of-experts routing and load balancing, state space models
    from HiPPO/S4 to Mamba-2, linear and kernelized attention, RWKV, and benchmarks/analyses comparing them with Transformers). Carded by a subagent. Results tables not recorded; claims only. Affiliations:
    Google Brain and Jagiellonian University (page 1). Venue: the arXiv v1 PDF header says ''Under review as a conference paper at ICLR 2017'' and the arXiv record has no comment/journal_ref, so no venue
    is recorded (reference lists of other papers cite it as ICLR 2017, but that is not confirmed by this PDF or the arXiv metadata). Section numbers are from numbered headings in the PDF dump and cross-references
    (''Section 2.1'', ''section 4''). Body-text numbers not made claims: on the 100B-word Google News corpus (internal data) perplexity improves up to 65536 experts (68B parameters, 39% lower than the computationally
    matched baseline) but degrades at 131072 experts, ''possibly a result of too much sparsity'' (Section 5.2); on 1B Word, added capacity ''seems to produce diminishing returns'' beyond 1B MoE parameters.
    The single-pair MT experiments use a strictly-balanced gating function (Appendix F) rather than noisy top-k, because of infrastructure peculiarities. MT/multilingual results are in tables and are not
    recorded; the multilingual MoE is compared with GNMT models by co-authors'' group (Google). Experts specialize by syntax/semantics (Appendix E, Table 9, qualitative). Later Google MoE work (arxiv-2006.16668
    GShard, arxiv-2101.03961 Switch, arxiv-2202.08906 ST-MoE) shares author Noam Shazeer.'

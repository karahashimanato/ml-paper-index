    University (Han, Dally) and NVIDIA (Pool, Tran, Dally). Venue from the arXiv comment (''Published as a conference paper at NIPS 2015''); the arXiv v3 PDF itself has no venue line. Section numbers are
    from numbered headings in the PDF. Retraining dropout ratio is set to D_r = D_o * sqrt(C_ir / C_io) (Section 3.2). Discussion (Section 5): without retraining accuracy starts dropping at 1/3 of the original
    connections vs 1/10 with retraining (read from the trade-off curve and stated in text); CONV layers are more sensitive than FC layers, the first conv layer most; two pruned points were slightly better
    than the original, which the authors ''believe'' is due to reduced overfitting; sparse storage overhead 15.6%; L1-then-L2 did not beat L2 for both phases; layer sensitivity is used to set each layer''s
    threshold. Table 6 baselines (data-free pruning, Fastfood, Collins & Kohli, naive cut, SVD) are numbers from other papers'' methods and not recorded. Reference [14] is the authors'' own Deep Compression
    (arxiv-1510.00149), cited as orthogonal quantization.'

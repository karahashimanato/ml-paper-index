proposes:
- 'TabR: a feed-forward network (encoder E, predictor P) with a retrieval module R in a residual branch that retrieves the m = 96 nearest training objects by a key-only negative L2 similarity -||W_K(x)
  - W_K(x_i)||^2 and aggregates softmax-weighted values W_Y(y_i) + T(W_K(x) - W_K(x_i)) that use the neighbors'' labels'
- 'Context freeze: reusing training-object contexts after a fixed number of epochs to speed up training'
claims:
- id: c1
  statement: 'Architecture: TabR is described as essentially a feed-forward network with a custom kNN-like component in the middle: target and candidate objects are encoded by a shared encoder, a retrieval
    module enriches the target representation from the top-m candidates (m = 96, candidates = the training set) using a single attention-like module, and a predictor makes the prediction.'
  location: Abstract
  page: 1
  quote: In this work, we present TabR – essentially, a feed-forward network with a custom k-Nearest-Neighbors-like component in the middle.
- id: c2
  statement: 'Motivation: the authors report that existing retrieval-augmented tabular models (which often use several layers of multi-head attention between objects and features, e.g. SAINT, NPT) provide
    at most minor benefits over a properly tuned MLP while being significantly more complex and costly.'
  location: Introduction
  page: 2
  quote: While multiple retrieval-augmented models for tabular data problems exist, in our experiments, we show that they provide if only minor benefits over the properly tuned multilayer perceptron (MLP;
    the simplest parametric model), while being significantly more complex and costly.
- id: c3
  statement: 'Design path: a vanilla self-attention retrieval module performed similarly to MLP, and adding context labels alone gave no improvement; removing queries and using L2 distance (key-only similarity)
    was the turning point, and removing any of the three ingredients (context labels, key-only representation, L2 distance) drops performance back to MLP level. The authors add that L2 is unlikely to be
    universally best but seems a reasonable default for tabular data.'
  location: Section 3.2
  page: 5
  quote: Crucially, in subsection A.3, we show that removing any of the three ingredients (context labels, key-only representation, L2 distance) results in a performance drop back to the level of MLP.
- id: c4
  statement: 'Protocol: following Gorishniy et al. (2022) (the authors'' own earlier work), hyperparameters and early stopping use the validation set, test metrics are averaged over 15 random seeds, comparisons
    take standard deviations into account, and ensembles are three groups of five models. TabR is tuned with TPE (Optuna) for 100 iterations on the smaller default-benchmark datasets and 50 on WE, CO, MI.'
  location: Section 3.1
  page: 3
  quote: The most important points are that, for any given algorithm, on each dataset, following Gorishniy et al. (2022), (1) we perform hyperparameter tuning and early stopping using the validation set;
- id: c5
  statement: 'GBDT tuning: the authors state they tried to tune GBDT as well as possible for a fair comparison; compared with their prior work they doubled tuning iterations and the number of trees, increased
    maximum depth and increased early-stopping rounds 4x; on the Grinsztajn et al. benchmark the GBDT budget is described as 20 random warmup iterations plus 180 TPE iterations.'
  location: Appendix D (XGBoost implementation details; the same paragraph is repeated for the other GBDT libraries)
  page: 27
  quote: In this work, we made our best to tune GBDT models as good as possible to make sure that the comparison is fair, and the conclusions are reliable.
- id: c6
  statement: 'Default benchmark vs GBDT (ensembles vs ensembles, since gradient boosting is already an ensembling technique): the tuned TabR gives noticeable improvements over tuned GBDT on several datasets
    (CH, CA, HO, HI, WE, CO) and is competitive on the rest except MI.'
  location: Comparing TabR with gradient-boosted decision trees
  page: 7
  quote: Table 4 shows that, on the default benchmark, the tuned TabR provides noticeable improvements over tuned GBDT on several datasets (CH, CA, HO, HI, WE, CO), while being competitive on the rest,
    except for the MI dataset.
- id: c7
  statement: 'Benchmark of Grinsztajn et al. (2022) (middle-scale tasks, <=50K objects, originally used to show GBDT superiority), adapted to the authors'' protocol (same splits; one version per dataset;
    the ''Eye movements'' dataset removed because of a leak): MLP-PLR is slightly inferior to GBDT, while TabR outperforms GBDT on average. Tree-based models are described as remaining a cheaper solution.'
  location: Section 4.2
  page: 7
  quote: While MLP-PLR (one of the best parametric DL models) indeed is slightly inferior to GBDT on this set of tasks, TabR makes a significant step forward and outperforms GBDT on average.
- id: c8
  statement: 'Default configuration caveat: the default TabR-S hyperparameters were obtained by averaging tuned hyperparameters over 13 datasets that include the evaluated default-benchmark datasets; the
    authors acknowledge this is not 100% fair, report that a leave-one-out variant showed no meaningful changes, and point to its performance on the Grinsztajn et al. benchmark as evidence it is not strongly
    overfitted.'
  location: Appendix D.8
  page: 22
  quote: Formally, this is not 100% fair to evaluate the obtained default TabR-S on the datasets which contributed to this default hyperparameters as in Table 4.
- id: c9
  statement: 'Limitations: TabR shares general limitations of retrieval-augmented models (whether using real training objects for predictions is acceptable; retrieval during training must simulate deployment,
    e.g. only past data for time series); the retrieval module still adds overhead over parametric models so TabR may not scale to truly large datasets as-is; training on the full Weather prediction dataset
    (3M+ objects) took more than 18 hours, reduced to 3h15min with context freeze.'
  location: Appendix B
  page: 18
  quote: Lastly, while TabR is significantly more efficient than prior retrieval-based tabular DL models, the retrieval module R still causes overhead compared to purely parametric models, so TabR may not
    scale to truly large datasets as-is.
- id: c10
  statement: 'Similarity and value modules: the vanilla-attention baseline uses S(x, x_i) = W_Q(x)^T W_K(x_i) d^{-1/2} and V = W_V(x_i) (Eq. 1); Step-2 removes the queries and uses the negative squared
    L2 distance S(x, x_i) = -||W_K(x) - W_K(x_i)||^2 d^{-1/2} with V = W_Y(y_i) + W_V(x_i) (Eq. 3); the module aggregates the values of the top-m nearest candidates according to S.'
  location: Section 3.2
  page: 5
  quote: 'Empirically, we observed that removing the notion of queries (i.e. removing WQ) and using the L2 distance instead of the dot product significantly improves performance on several datasets in Table
    2:'

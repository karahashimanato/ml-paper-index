claims:
- id: c1
  statement: ScalarLens is a numerical-feature embedding for CTR models that keeps a stable coordinate for a value while adapting its interpretation to the sample's context.
  location: Abstract
  page: 1
  quote: We introduce ScalaRLens, a numerical embedding that preserves what a value is while adapting how it should be interpreted.
- id: c2
  statement: In the primary evaluation (19 representations, three datasets, nine backbones, three seeds, original numerical scales), ScalarLens ranks first in most settings and second in the rest.
  location: Abstract
  page: 1
  quote: In a 1,539-run primary evaluation covering 19 representations, three datasets, nine backbones, and three seeds, ScalaRLens ranks first in 25 of 27 settings on original numerical scales and second
    in the remaining two.
- id: c3
  statement: Datasets are AutoML-A/E from AutoML3 and Criteo, with Criteo's numerical fields kept without a log transform; backbones share one fixed training configuration with early stopping on validation
    AUC.
  location: Experiments
  page: 4
  quote: AutoML-A/E come from AutoML3 [11]; Criteo preserves all 13 numerical fields without a shared logarithmic transformation.
- id: c4
  statement: No method gets dataset-specific hyperparameters, private preprocessing, or a different split.
  location: Experiments
  page: 5
  quote: No method receives private preprocessing, a different split, or hyperparameters specific to a dataset.
- id: c5
  statement: Several baselines (DAE, DEER, NaryDis, DAES) are the authors' re-implementations from published descriptions, not official code.
  location: Experiments
  page: 5
  quote: DAE, DEER, NaryDis, and DAES-Gate/Tran are implementations based on the published descriptions because no official module compatible with our code version was available
- id: c6
  statement: 'Stated limitation: AutoML-A/E come from one family, all datasets informed development, and the 27 settings are correlated; random splits do not establish temporal or cross-family transfer.'
  location: Discussion and Limitations
  page: 8
  quote: AutoML-A/E share one family, all datasets informed development, and the 27 settings are correlated.

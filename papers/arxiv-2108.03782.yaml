    in the arXiv PDF (dated May 17, 2022); none recorded. Conflict of interest: the compared ADVI is co-authored by Gelman (reference list: Kucukelbir, Tran, Ranganath, Gelman and Blei, 2017), the posteriordb
    benchmark is co-authored by Vehtari (Magnusson, Bürkner and Vehtari, 2021), and the compared ADVI/NUTS are Stan''s implementations (''We use Stan''s implementation of ADVI and dynamic HMC''); the PS-IR
    step builds on the authors'' own PSIS (Vehtari et al.). Sensitivity analyses (L_max/tolerance, K = 30, J = 60, I in {5, 20, 40}) are shown as figures plus a few summary percentages in the text; not
    recorded. The 1-Wasserstein comparisons are figure-only. Single-path uses K = 5 ELBO draws; the paper reports Pathfinder approximations range from slightly worse to much better than ADVI and are comparable
    to short dynamic HMC chains (abstract, Introduction).'

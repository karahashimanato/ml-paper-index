  notes: 'Selected for the topic article requested by the user (2026-10-03): model fallback and model selection in MLOps (meta-learned selection, dynamic selection, abstention/deferral, switching triggers,
    cascades/routing, monitoring); carded by a subagent. Results tables not recorded; claims only. Affiliations: University of British Columbia, Microsoft (first author''s work performed during an internship
    at Microsoft), Hippocratic AI (one author''s work performed while at Microsoft). Evaluated models include OpenAI GPT-3.5-turbo (via API), Meta Llama-2 and Google FLAN-T5; no conflict-of-interest statement
    found. The abstract''s ''no drop in response quality'' at up to 40% fewer large-model calls corresponds to the small-performance-gap pair (Llama-2 7b vs 13b); Table 1 reports larger drops at 40% cost
    advantage for medium and large gaps. Numeric/wording discrepancies within the paper: the abstract says ''no drop in response quality'' while the conclusion says ''no significant drop''; Table 3 (thresholds
    chosen on 500 validation samples with <=1% drop) gives test cost advantages above 96% for the Llama-2 7b/13b pair, far above the abstract''s ''up to 40%'', with test drops of 1.39-1.60% exceeding the
    1% limit (and rtrans 1.02% for the FLAN-t5/Llama-2 13b pair). Cost is a proxy (fraction routed to the small model), not API prices; router latency is measured but GPT-3.5-turbo latency is not. RouteLLM
    (arxiv-2406.18665) later criticizes this paper for lacking out-of-domain evaluation; this paper itself states the distribution is fixed (claim on limitations).'

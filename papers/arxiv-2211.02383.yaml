  notes: 'Selected for the method article requested by the user (2026-10-07): approximate Bayesian inference and its diagnostics (HMC/NUTS and SG-MCMC, variational inference, R-hat, PSIS, SBC, VI error
    bounds, Bayesian workflow). Carded by a subagent. Results tables not recorded; claims only. Affiliations include the Czech Academy of Sciences, MIT, Kookmin University, TU Dortmund, Columbia University
    and Aalto University. Venue: recorded as Bayesian Analysis from the arXiv comment (''upcoming in Bayesian Analysis'') given in the task; at this version (v3, PDF dated 19 Oct 2023) the paper was forthcoming,
    and the PDF text itself does not state the venue. Conflict of interest: the method is implemented in the authors'' SBC R package, the real-world case study comes from the Stan forums and uses Stan''s
    HMC, and several authors are Stan/brms developers; SBC was introduced by Talts et al. (arxiv-1804.06788), whose co-authors Gelman and Vehtari are also authors here. Other stated points: ties are resolved
    by random tie-breaking so discrete parameters can be handled; for MCMC, posterior samples typically need thinning; convergence checking for each fit typically requires the equivalent of at least 100
    independent posterior draws (citing Vehtari et al. 2021), so reducing posterior draws gives little speedup; for a fixed budget the authors suggest the same order of magnitude of simulated datasets as
    posterior draws. Uniformity is quantified with the gamma ECDF statistic of Säilynoja et al. (2022) at the 5% level, which they state is typically more sensitive than Kolmogorov-Smirnov or chi-squared
    tests. Section numbers in the text (2-6, 3.3, 3.5, 3.6) appear only as cross-references; locations use section names. Contrast with arxiv-2011.01808 (Going forward), which states SBC can be satisfied
    if the posterior stays in the prior.'

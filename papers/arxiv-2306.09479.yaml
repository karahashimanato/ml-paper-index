proposes:
- 'Inverse Scaling Prize: 11 prize-winning datasets showing inverse scaling'
- four potential causes of inverse scaling (strong prior, unwanted imitation, distractor task, spurious few-shot)
claims:
- id: c1
  statement: 'Main claim: the paper presents evidence that LMs may show inverse scaling (worse task performance with increased scale), e.g. due to flaws in the training objective and data, based on 11 datasets
    collected through a public contest.'
  location: Abstract
  page: 1
  quote: Here, we present evidence for the claim that LMs may show inverse scaling, or worse task performance with increased scale, e.g., due to flaws in the training objective and data.
- id: c2
  statement: 'Experimental range: submissions were evaluated zero-shot and few-shot on model series from OpenAI, Anthropic and DeepMind spanning 10^18 to 10^23 training FLOPs (the paper says ''over 5 orders
    of magnitude''), with and without instruction tuning; GPT-4 and PaLM results were added after the contest (PaLM results taken from Wei et al. 2022a).'
  location: Introduction
  page: 2
  quote: 'We evaluated submissions in zero-shot (no examples provided in the input) and few-shot (a few examples provided) settings across model series from OpenAI, Anthropic, and DeepMind, covering over
    5 orders of magnitude: 1018 to 1023 training FLOPs.'
- id: c3
  statement: 'Compute counting: where training-FLOP estimates were unavailable, they used the 6ND approximation (N parameters, D training tokens); fine-tuning FLOPs (Context Distilled, FeedME, RLHF) were
    not counted, as hard to estimate and a small fraction of pretraining.'
  location: Appendix C (FLOP Computation)
  page: 32
  quote: Where an estimate of training FLOPs was not available, we estimate them using the 6ND approximation from Kaplan et al. (2020), where N is the number of model parameters and D is the number of training
    tokens.
- id: c4
  statement: 'Caveat on the x-axis: training FLOPs are used rather than parameters (citing Hoffmann et al. as a better proxy), but the authors warn that FLOP-based comparisons between model families can
    be misleading because families differ in model-size-to-data ratios.'
  location: Introduction (footnote)
  page: 2
  quote: However, since different model families have different ratios of model size to data quantity, comparisons based on FLOPs between model families can be misleading.
- id: c5
  statement: 'U-shaped and inverted-U scaling: trends can reverse at larger scale (U-shaped, e.g. several tasks on PaLM; inverted-U, e.g. Prompt Injection), which the authors say shows that even the direction
    of scaling trends found with smaller models may not hold for larger ones.'
  location: Introduction
  page: 3
  quote: Such results show that even the direction of scaling trends found with smaller models may not hold with larger models, making it challenging to predict the novel capabilities and failures of future
    LMs.
- id: c6
  statement: 'Attribution of the U-shaped finding: the paper states that Wei et al. (2022a), evaluating PaLM up to 540B parameters, found performance started to improve for 7 of the 11 winning tasks; this
    paper notes that for Resisting Correction, Memo Trap and NeQA the larger PaLM sizes are still below the small PaLM sizes.'
  location: Discussion (U-Shaped Scaling)
  page: 23
  quote: count Resisting Correction, Memo Trap, and NeQA, among the U-shaped tasks, though we note that performance on larger PaLM sizes is still below performance on small PaLM sizes on these tasks
- id: c7
  statement: 'Model access / affiliations: held-out private model series were provided by Anthropic and DeepMind; several authors list Anthropic, Google or Stability AI affiliations (Bowman and Perez list
    Anthropic, Parrish and Kim list Google, Pieler lists Stability AI; the footnote says Pieler''s work was done at FAR AI, Bowman''s at NYU, Perez''s at FAR AI and NYU).'
  location: Models Evaluated
  page: 4
  quote: 'Private models were provided by Anthropic (models trained in Bai et al., 2022)2 and DeepMind (Gopher: Rae et al. 2021, and Chinchilla: Hoffmann et al. 2022).'

proposes:
- 'Deep Isolation Forest (DIF): an ensemble of r random representations produced by randomly initialised, never-trained neural networks, with t isolation trees using axis-parallel cuts built on each representation
  (equivalent to non-linear partitions of the original space); iForest and EIF are shown to be special cases with a single linear layer'
- 'CERE: computing all ensemble members in one mini-batch with rank-one (Hadamard) perturbations of a base weight matrix'
- 'DEAS: an anomaly score combining iForest''s path-length score with the average deviation of the feature value from the split threshold along the path'
claims:
- id: c1
  statement: 'Hard anomalies: iForest cannot handle anomalies that can only be isolated in higher-order subspaces (combinations of features) because it treats features separately with one feature per isolation
    operation; e.g. anomalies surrounded by ring-shaped normal data end up with isolation depths indistinguishable from normal data, causing false negatives.'
  location: Introduction
  page: 1
  quote: because it treats all features separately and considers only one feature per isolation operation.
- id: c2
  statement: 'On existing extensions: PID still uses axis-parallel isolation and shows the same algorithmic bias; EIF works better thanks to random-slope hyperplanes, but its partitions are still linear,
    which the authors say is ineffective where only non-linear partitions isolate anomalies (reflected in wrinkled score contours).'
  location: Introduction
  page: 2
  quote: However, the partitions still operate linearly, which works ineffectively on challenging datasets where only non-linear partitions are useful in isolating anomalies from the other data.
- id: c3
  statement: 'Method: DIF maps the data with an ensemble of randomly initialised neural networks that are never optimised and builds isolation trees with random axis-parallel cuts on each representation;
    the authors argue the randomness gives high freedom of partition in the original space and a synergy between random representations and random-partition isolation.'
  location: Introduction
  page: 2
  quote: These networks are only casually initialised and do not involve any optimisation or training process.
- id: c4
  statement: 'Why random rather than optimised representations: the authors state that optimised representations are more expressive if the objective fits the data, but (i) such losses are not versatile
    across data and (ii) optimisation might strongly control the downstream partition, weakening the randomness and diversity that isolation-based scoring requires.'
  location: Discussions
  page: 7
  quote: (ii) The downstream data partition might be strongly controlled by the optimisation process.
- id: c5
  statement: 'Settings: DIF uses r = 50 representations, t = 6 trees each and subsampling size 256; the IF-based baselines (iForest from scikit-learn, EIF from the eif package at maximum extension level,
    PID, LeSiNN) use 300 trees and subsampling 256 (LeSiNN 8). Deep baselines (deep-ensemble versions of RDP, REPEN, Deep SVDD, an autoencoder) are trained 50 epochs x 30 steps with Adam 1e-3; RDP used
    1e-4 because it was empirically found to work significantly better; other parameters of competitors are default/recommended.'
  location: Section 6.1.3 (Parameter Settings and Implementations)
  page: 8
  quote: The default/recommended settings are used for the other parameters of these competing methods.
- id: c6
  statement: 'Evaluation: 10 tabular datasets (4 UNSW-NB15 attack types, R8, Cover, Fraud, Pageblocks, Shuttle, Thrombin), 4 Tox21 graph datasets and 4 UCR time-series datasets with natural anomalies; metrics
    are AUC-ROC and AUC-PR with a paired Wilcoxon signed-rank test. Tables report mean ± standard deviation, but no number of runs and no train/test protocol for the tabular datasets in the main comparison
    was found in the text (searched for runs, repeat, seed, independent, trained, test set).'
  location: Section 6.1.4 (Evaluation Metrics and Computing Infrastructure)
  page: 8
  quote: the detection accuracy is evaluated by two complementary metrics including Area Under the ROC Curve (AUC-ROC) and Area Under the PR Curve (AUC-PR).
- id: c7
  statement: 'Exception where a classical distance-based method wins: DIF is the best isolation-based detector on all ten tabular datasets except AUC-PR on Fraud, where the nearest-neighbour-based LeSiNN
    is more effective; the authors explain that Fraud''s features are PCA-transformed, so distances reflect proximity well.'
  location: Section 6.2 (Tabular Data)
  page: 9
  quote: The features in Fraud are the results of PCA transformation due to the confidentiality issues, and thus the distance concept used in the nearest neighbour information can well reflect the proximity
    relationship.
- id: c8
  statement: 'Contamination protocol: graph and time-series datasets have pre-defined splits with anomaly-free training sets, so only tabular datasets are used; following prior work, anomalies are injected/removed
    to set training contamination from 0% to 10%, models are trained on the adjusted data and tested on the original version. Performance of all detectors degrades as contamination increases (results shown
    as a figure).'
  location: Section 6.4 (Robustness w.r.t. Anomaly Contamination)
  page: 11
  quote: Time-series datasets and graph datasets have pre-defined train-test split and their training sets do not contain anomalies, and thus we use tabular datasets as our bases here.
- id: c9
  statement: 'Cost: on synthetic data of varying size and dimensionality, isolation-based methods (including DIF) scale well on CPU compared with deep-ensemble methods, which benefit from GPU on high-dimensional
    data; the authors attribute DIF''s efficiency relative to the deep ensembles to needing a single feed-forward pass instead of many training epochs.'
  location: Section 6.3 (Scalability to High-dimensional, Large-scale Data)
  page: 11
  quote: DIF shows outstanding time efficiency compared to its deep ensemble-based counterparts since it only requires one feed-forward step instead of a large number of training epochs.

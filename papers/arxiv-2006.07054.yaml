  notes: 'Selected for the topic article requested by the user (2026-10-03): algorithm design techniques (divide and conquer, dynamic programming, branch and bound, local search) and machine learning; carded
    by a subagent. Results tables not recorded; claims only. Affiliations: University of Cambridge, Ecole Polytechnique de Montreal, Loyola Marymount University; no company funding found in the text. Further
    findings listed in the Introduction: autoregressive decoding improves generalization over non-autoregressive models but costs more inference time; models trained with expert supervision are more amenable
    to post-hoc search, while RL scales better with more computation as it does not rely on labelled data. Section 6 (Recent case studies) reports that learning within local search (e.g. NeuroLKH improving
    LKH) implicitly gives better zero-shot generalization than constructive approaches, but names as a limitation the need for hand-designed local search heuristics; it also describes GNN + dynamic programming
    / MCTS search replacing the decoder search. The paper cites Bengio et al.''s three-way taxonomy (arxiv-1811.06128). Compute: the Introduction says it is difficult to outperform a simple insertion heuristic
    when directly training on 12.8 million TSP200 samples for 500 hours on university-scale hardware; Appendix B: PyTorch on an Intel Xeon E5-2690 v4 server with four 1080Ti GPUs, one GPU per experiment,
    lowest training time across runs reported. Footnote: the largest TSP solved by Concorde has 109,399 nodes with 7.5 months running time. Results not recorded.'

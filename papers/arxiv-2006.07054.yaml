proposes:
- Unified end-to-end neural combinatorial optimization pipeline for TSP (problem definition, graph embedding, solution decoding, solution search, policy learning) used for controlled experiments on zero-shot
  generalization from small training sizes to larger TSPs
claims:
- id: c1
  statement: 'Main claim: learning-driven TSP approaches perform close to classical solvers when trained on trivially small sizes but cannot generalize the learnt policy to larger instances at practical
    scales.'
  location: Abstract
  page: 1
  quote: While state-of-the-art learning-driven approaches for TSP perform closely to classical solvers when trained on trivially small sizes, they are unable to generalize the learnt policy to larger instances
    at practical scales.
- id: c2
  statement: 'Protocol (training): ablations train on variable-size TSP20-50 (compared with fixed sizes up to TSP100); nodes uniform in the unit square; SL uses 1,280,000 instances with Concorde tours as
    labels for 10 epochs, RL uses 128,000 freshly generated unlabelled instances per epoch for 100 epochs, so both see 12,800,000 samples in total; models have approximately 350,000 parameters.'
  location: Experimental setup
  page: 7
  quote: We perform ablation studies of each component of the pipeline by training on variable TSP20-50 graphs for rapid experimentation.
- id: c3
  statement: 'Protocol (evaluation): test set of 1,280 instances for each size TSP10 to TSP200, metric is optimality gap w.r.t. Concorde, beam search width 128; a non-learnt furthest insertion heuristic
    is used as the reference for ''good'' generalization.'
  location: Experimental setup
  page: 7
  quote: We compare models on a held-out test set of 25,600 TSPs, consisting of 1,280 samples each of TSP10, TSP20, . . . , TSP200.
- id: c4
  statement: 'Critique of evaluation practice: the authors state that the prevalent paradigm of measuring on fixed or trivially small sizes hides poor generalization.'
  location: Introduction
  page: 2
  quote: The prevalent evaluation paradigm overshadows models’ poor generalization capabilities by measuring performance on ﬁxed or trivially small TSP sizes.
- id: c5
  statement: 'Train/test size result: variable-size training helps within the training range but does not improve generalization to larger problems over training on TSP50; TSP20-trained models fail to generalize
    to large sizes and TSP100-trained models do poorly on small sizes, which the authors take as evidence that evaluation on training sizes (citing Kool et al. and Joshi et al.) hides brittle out-of-distribution
    performance.'
  location: Results
  page: 7
  quote: Learning from small TSP20 is unable to generalize to large sizes while TSP100 models generalize poorly to trivially easy sizes, suggesting that the prevalent protocol of evaluation on training
    sizes [42, 37] overshadows brittle out-of-distribution performance.
- id: c6
  statement: 'Classical baseline (Figure 1 setting: three identical autoregressive GNN models trained via RL on 12.8 million instances - from scratch on TSP200, on TSP20-50 zero-shot, and pretrained then
    fine-tuned on 1.28 million TSP200 - plus Active Search, evaluated on 1,280 held-out TSP200 instances): within the authors'' computational budget a simple non-learnt furthest insertion heuristic still
    outperforms all models.'
  location: Introduction
  page: 2
  quote: Within our computational budget, a simple non-learnt furthest insertion heuristic still outperforms all models.
- id: c7
  statement: 'Recommendation: GNN layers, normalization schemes, graph sparsification and learning paradigms need to be explicitly re-designed with out-of-distribution generalization in mind; the authors
    advocate training on small instances and transferring zero-shot or via fast fine-tuning rather than expensive large-scale training.'
  location: Conclusion
  page: 12
  quote: Our ﬁndings suggest that key design choices such as GNN layers, normalization schemes, graph sparsiﬁcation, and learning paradigms need to be explicitly re-designed to consider out-of-distribution
    generalization.

  notes: 'Selected for the method article requested by the user (2026-10-10): deep learning architectures for tabular data (TabNet, NODE and differentiable trees, TabTransformer/FT-Transformer-style attention,
    SAINT, embeddings for numerical features, retrieval (TabR), regularized MLPs, CTR-style interaction models, self-supervised pretraining, and surveys/benchmarks comparing them with GBDTs). Carded by
    a subagent. Results tables not recorded; claims only. Affiliation: Google Inc. (all authors). Venue from the arXiv journal_ref (''In Proceedings of the Web Conference 2021 (WWW ’21)''); the arXiv PDF
    itself does not name the venue. Year is the first arXiv version (2020). Conflict of interest / data: the first author is the first author of the original DCN (reference [50], Wang, Fu, Fu and Wang,
    ADKDD''17), which is a baseline; the production results (Section 8, Table 8) are on proprietary Google data and cannot be reproduced; feature names in Figure 6(a) are hidden ''for proprietary reasons''.
    The paper''s setting is CTR / learning-to-rank on sparse categorical plus dense features (tagged tabular-classification; MovieLens-1M is described as formalized as a regression problem but with binarized
    ratings and a log loss); GBDTs are not compared. Section numbers come from the PDF headings/cross-references (Sections 3, 4.1, 6, 7.2-7.6, 8; the tuning paragraph is referred to as Section 7.1.3). Interpretability:
    the authors say the cross-layer weight matrix W ''exactly reveals'' which crosses were learned, with evidence only as visualizations (Figure 6) - not recorded as a claim. Table 5/6/7 numbers (LogLoss,
    AUC, params, FLOPS) are not recorded. Number-of-experts study: more lower-rank experts did not beat a single higher-rank expert, which the authors say might be caused by naive gating and optimization.'

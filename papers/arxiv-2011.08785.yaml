proposes:
- 'PaDiM: patch embeddings from the first three layers of an ImageNet-pretrained CNN are concatenated (optionally reduced by randomly selecting dimensions), one multivariate Gaussian (mean and regularized
  covariance) is fitted per patch position over the normal training images, the Mahalanobis distance gives the anomaly map, and its maximum is the image-level score'
claims:
- id: c1
  statement: 'Setting: anomaly detection is framed as one-class learning, where the training set contains only normal images and no anomalous examples, because anomalous examples are frequently lacking
    and anomalies can have unexpected patterns.'
  location: Introduction
  page: 1
  quote: Hence, anomaly detection models are often estimated in a one-class learning setting, i.e., when the training dataset contains only images from the normal class and anomalous examples are not available
    during the training.
- id: c2
  statement: 'Motivation (cost): prior methods either require deep neural network training, which might be cumbersome, or run K-NN over the entire training set at test time, whose time and space complexity
    grow with the training set; the authors say these scalability issues may hinder industrial deployment.'
  location: Introduction
  page: 1
  quote: These two scalability issues may hinder the deployment of anomaly localization algorithms in industrial context.
- id: c3
  statement: 'Distributional assumption: the set of embeddings at each patch position (i, j) over the N normal training images is assumed to be generated by a multivariate Gaussian with the sample mean
    and a sample covariance regularized by epsilon times the identity (default epsilon = 0.01) so that it is invertible; the covariance carries correlations between semantic levels of the CNN.'
  location: Section III (Patch Distribution Modeling)
  page: 3
  quote: To sum up the information carried by this set we make the assumption that Xij is generated by a multivariate Gaussian distribution
- id: c4
  statement: 'Random dimensionality reduction: randomly selected embedding dimensions outperform PCA with the same number of dimensions on MVTec AD (averaged over 10 random selections); the authors explain
    this, citing [23], by PCA keeping the highest-variance dimensions, which may not be the ones that discriminate normal from anomalous.'
  location: Section V-A
  page: 4
  quote: It can be explained by the fact that PCA selects the dimensions with the highest variance which may not be the ones that help to discriminate the normal class from the anomalous one [23].
- id: c5
  statement: 'Metrics: localization uses two threshold-independent metrics, pixel-level AUROC and the PRO-score (normalized integral of per-region overlap up to a false positive rate of 0.3), the latter
    added because AUROC is biased in favor of large anomalies; image-level detection is evaluated by AUROC.'
  location: Section IV-A
  page: 3
  quote: Since the AUROC is biased in favor of large anomalies we also employ the per-region-overlap score (PRO-score) [2].
- id: c6
  statement: 'Experimental setup: backbones (ResNet18, Wide ResNet-50-2, EfficientNet-B5) are all ImageNet-pretrained; SPADE is reproduced by the authors with the same preprocessing, and the VAE baseline
    is the authors'' own implementation. No procedure for choosing epsilon, the layers or the reduced dimensionality (100 or 550) on held-out data was found in the text (searched for validation, tuned,
    hyperparameter, select).'
  location: Section IV-B
  page: 4
  quote: By default we use ϵ = 0.01 for the ϵ from Equation 1.
- id: c7
  statement: 'Texture vs object classes: on MVTec AD localization PaDiM''s margin is mainly on texture classes, while on object classes SPADE is best in PRO-score; the authors attribute PaDiM''s texture
    accuracy to its explicit probabilistic model capturing the statistical similarity of texture images even though they are not aligned and centered like object images.'
  location: Section V-B
  page: 5
  quote: It is particularly efﬁcient on texture images because even if they are not aligned and centered like object images, PaDiM effectively captures their statistical similarity accross the normal train
    dataset.
- id: c8
  statement: 'Alignment: MVTec AD objects are always well-centered and aligned, so the authors build Rd-MVTec AD (random rotation of -10 to +10 degrees and random crop, applied to train and test, 5 random
    versions averaged); PaDiM''s localization AUROC decreases less than SPADE''s and the VAE''s (5.3 vs 8.8 and 12.2 percentage points), and the authors conclude PaDiM seems more robust to non-aligned images.'
  location: Section V-C
  page: 6
  quote: Thus, we can conclude that our method seems to be more robust to non-aligned images than the other existing and tested works.
- id: c9
  statement: 'Cost: no deep network training is needed (training time grows linearly with the dataset size; about 150 s per MVTec AD class on a CPU for the largest model) and memory depends only on image
    resolution, not training set size; SPADE uses less memory than PaDiM on MVTec AD with an equivalent backbone but becomes intractable on the larger STC dataset.'
  location: Section V-D
  page: 6
  quote: Unlike SPADE [5] and Patch SVDD [4], the space complexity of our model is independent of the dataset training size and depends only on the image resolution.

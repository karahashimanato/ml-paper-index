  notes: 'Selected for the method article requested by the user (2026-10-07): approximate Bayesian inference and its diagnostics (HMC/NUTS and SG-MCMC, variational inference, R-hat, PSIS, SBC, VI error
    bounds, Bayesian workflow). Carded by a subagent. Results tables not recorded; claims only. Affiliations: Columbia University, Aalto University, University of Toronto, Flatiron Institute, Monash University,
    University of Stuttgart, Czech Academy of Sciences. No venue stated in the PDF (dated 2 Nov 2020) or the given arXiv comment; none recorded. The article is a review: it focuses on HMC as implemented
    in Stan (''While similar principles should apply also to other software and other algorithms, there will be differences in the details''), and the authors are largely Stan/brms/bayesplot developers,
    so the computation checks are recommended by the people who build the software. Other computational points: a ''fit fast, fail fast'' goal (Section 3.4), which the planetary-motion example notes current
    tools violate because they are slower when the fit is bad; debugging by meeting simple and complex models in the middle (Section 5.2); stacking to reweight poorly mixing chains (not necessarily equivalent,
    even asymptotically, to full Bayesian inference); for SBC with wide priors they suggest using rough real-data-based estimates, widened slightly, as the SBC prior. Much of Sections 10 and 11 is taken
    from Gelman (2019) and Margossian and Gelman (2020). Section numbers 2.4, 3.4, 4.1, 5.1, 5.2 are confirmed by in-text cross-references; 12.6 by the table of contents. Contrast: arxiv-2211.02383 (later,
    overlapping authors) shows data-dependent test quantities can detect a posterior that stays in the prior.'

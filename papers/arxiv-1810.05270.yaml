proposes:
- 'An evaluation of the three-stage pruning pipeline (train large, prune, fine-tune) against training the pruned target architecture from random initialization under two budgets: Scratch-E (same epochs)
  and Scratch-B (same computation budget)'
- Viewing automatic structured pruning as implicit architecture search, tested by comparing pruning-obtained architectures with uniformly pruned ones, both trained from scratch
claims:
- id: c1
  statement: 'Main finding: for all the structured pruning algorithms examined (four predefined: Li et al. 2017, Luo et al. 2017, He et al. 2017b, He et al. 2018a; two automatic: Liu et al. 2017, Huang
    & Wang 2018), fine-tuning a pruned model gives only comparable or worse performance than training that model from random initialization; for predefined target architectures the authors say one can skip
    the pipeline and train the target network directly.'
  location: Abstract
  page: 1
  quote: For all state-of-the-art structured pruning algorithms we examined, ﬁne-tuning a pruned model only gives comparable or worse performance than training that model with randomly initialized weights.
- id: c2
  statement: 'Training budget: Scratch-E trains the pruned model for the same number of epochs as the large model and Scratch-B for the same computation (FLOPs) budget; on ImageNet, if the pruned model
    saves more than 2x FLOPs the epochs are just doubled (less budget than large-model training), and learning-rate decay schedules are extended proportionally. Fine-tuning compute is not counted, which
    the authors say if anything favors the pruning and fine-tuning pipeline; they found Scratch-E enough in most cases and Scratch-B needed in others.'
  location: Section 3
  page: 4
  quote: In our experiments, we use Scratch-E to denote training the small pruned models for the same epochs, and Scratch-B to denote training for the same amount of computation budget
- id: c3
  statement: 'Unstructured magnitude pruning (Han et al., 2015) behaves differently: on CIFAR, Scratch-B is at least on par with fine-tuning at small prune ratios (<= 80%), but in some cases at a large
    prune ratio (95%) fine-tuning can outperform training from scratch; on ImageNet, Scratch-B is mostly worse than fine-tuning by a noticeable margin. Suggested (hedged) reasons: difficulty of training
    highly sparse networks, dataset scale/complexity, or the changed weight distribution.'
  location: Section 4.3
  page: 7
  quote: On the large-scale ImageNet dataset, we note that the Scratch-B result is mostly worse than ﬁne-tuned result by a noticable margin, despite at a decent accuracy level.
- id: c4
  statement: The authors suggest the contradiction between some of their results and those reported in the literature might be explained by less carefully chosen hyper-parameters, data augmentation schemes,
    and unfair computation budgets for the baseline approaches.
  location: Introduction
  page: 2
  quote: The contradiction between some of our results and those reported in the literature might be explained by less carefully chosen hyper-parameters, data augmentation schemes and unfair computation
    budget for evaluating baseline approaches.
- id: c5
  statement: 'Interpretation: inheriting weights from a large model is not necessarily optimal and might trap the pruned model in a bad local minimum; the results suggest the value of automatic structured
    pruning sometimes lies in identifying efficient structures (implicit architecture search) rather than selecting ''important'' weights.'
  location: Introduction
  page: 2
  quote: identifying efﬁcient struc-tures and performing implicit architecture search, rather than selecting “important” weights.
- id: c6
  statement: 'Caveat on the architecture-search view: there are cases where architectures obtained by pruning are not significantly more efficient than uniformly pruned ones (all trained from scratch),
    more likely on modern architectures such as ResNets and DenseNets, whose pruned sparsity patterns are near-uniform across stages; for VGG the pruned patterns beat uniform ones.'
  location: Section 5
  page: 9
  quote: This phenomenon happens more likely on modern architectures like ResNets and DenseNets.
- id: c7
  statement: 'Comparison with the lottery ticket hypothesis (CIFAR-10, momentum SGD, initial learning rates 0.1 and 0.01, iterative 20% and one-shot pruning): in the evaluated settings the winning-ticket
    initialization only helps for unstructured pruning with the small learning rate, which itself yields lower accuracy than the widely used large rate; for structured L1-norm filter pruning it is only
    on par with random initialization at both rates. Listed setting differences: structured vs unstructured pruning, large modern models vs mostly small shallow networks (< 6 layers), momentum SGD at lr
    0.1 vs mostly Adam at lower rates, and ImageNet vs MNIST/CIFAR only. A suggested (hedged) reason is that with a small step size the final weights might stay close to the initialization.'
  location: Section 6
  page: 12
  quote: To summarize, in our evaluated settings, the winning ticket only brings improvement in the case of unstructured pruning, with small initial learning rate, but this small learning rate yields inferior
    accuracy compared with the widely-used large learning rate.
- id: c8
  statement: 'Where pruning and fine-tuning can still be preferable: even if it fails to outperform training from scratch in accuracy, it can be much faster when a pre-trained large model is already given
    and little or no training budget is available (if the method does not modify large-model training), or when multiple models of different sizes are needed or the desired size is unknown.'
  location: Section 7
  page: 13
  quote: Even if pruning and ﬁne-tuning fails to outperform the mentioned baselines in terms of accuracy, there are still some cases where using this conventional wisdom can be much faster than training
    from scratch

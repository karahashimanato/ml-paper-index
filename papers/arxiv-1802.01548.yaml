proposes:
- 'Aging (regularized) evolution: tournament selection (best of S random population members is mutated) in which the oldest model, rather than the worst, is removed from the population each cycle'
- Hidden-state and op mutations (plus identity) that cover the NASNet cell search space
- AmoebaNet-A, the evolved normal/reduction cell architecture
claims:
- id: c1
  statement: 'Aging evolution: instead of the common step of discarding the worst model in the random S-sample (called non-aging evolution here), each cycle removes the oldest model in the population (the
    one trained earliest), which favors newer models; the authors state this lets the search explore more instead of zooming in on good models too early, as non-aging evolution would.'
  location: Methods (Evolutionary Algorithm)
  page: 3
  quote: 'in this paper we prefer a novel approach: killing the oldest model in the population'
- id: c2
  statement: 'Controlled comparison protocol: evolution, RL (the algorithm and code of the NASNet baseline study, an LSTM controller) and random search ran under identical conditions with the same code
    for network construction, training and evaluation, searching on CIFAR-10 in the NASNet search space until 20k models were evaluated. Evolution was tuned over 5 P/S configurations (best P=100, S=25);
    RL started from parameters tuned in the baseline study and its learning rate was further optimized over 8 values; the identity-mutation probability (0.05) was not tuned; tuning runs were excluded from
    the plots, as decided a priori, to avoid selection bias.'
  location: Methods Details
  page: 4
  quote: To avoid selection bias, plots do not include optimization runs, as was decided a priori.
- id: c3
  statement: 'Compute: during the search phase each model was trained for 25 epochs at N=3/F=24 on 1 GPU, and each experiment ran on 450 K40 GPUs for 20k models (approximately 7 days); the best 20 models
    of each experiment were then augmented to N=6/F=32 and trained for 600 epochs.'
  location: Methods Details
  page: 4
  quote: Each experiment ran on 450 K40 GPUs for 20k models (approx. 7 days).
- id: c4
  statement: 'Search-progress comparison (5 repeats of each algorithm, shown in a figure): evolution yielded more accurate models at earlier stages, which the authors say could matter when experiments must
    be stopped early; when run for the full 20k models, evolution produced models with similar accuracy to RL; both compared favorably against random search. The authors note the figure shows accuracy only,
    not the compute cost of the models.'
  location: Results (Comparison With RL and RS Baselines)
  page: 4
  quote: At the later stages, if we allow to run for the full 20k models (as in the baseline study), evolution produced models with similar accuracy.
- id: c5
  statement: 'Augmented top models from the 5 experiments per algorithm on CIFAR-10 (figure only): evolved architectures had higher accuracy and similar FLOPs compared with random search, and lower FLOPs
    with similar accuracy compared with RL; parameter counts behaved similarly to FLOPs.'
  location: Results (Comparison With RL and RS Baselines)
  page: 5
  quote: Evolved architectures had higher accuracy (and similar FLOPs) than those obtained with RS, and lower FLOPs (and similar accuracy) than those obtained with RL.
- id: c6
  statement: The comparison of AmoebaNet-A with the results reported by the NASNet baseline study (as opposed to the authors' reproduction) is stated to be not entirely controlled, because identical training
    code and an equal number of experiments to obtain the final model cannot be ensured.
  location: Results (Comparison With RL and RS Baselines)
  page: 5
  quote: Such a comparison is not entirely controlled, as we have no way of ensuring the network training code was identical and that the same number of experiments were done to obtain the ﬁnal model.
- id: c7
  statement: 'Scope caveat: the authors state some findings may be restricted to the search spaces and datasets used; preliminary small-compute experiments (CPU, F=8, N=1) over three search spaces and three
    datasets (gray-scale CIFAR-10, MNIST, gray-scale ImageNet) are presented in a supplement, where evolution reached equal or better accuracy in all cases.'
  location: Discussion (Scope of results)
  page: 6
  quote: Some of our ﬁndings may be restricted to the search spaces and datasets we used.
- id: c8
  statement: 'Tuning caveat: the authors acknowledge that with careful tuning RL might produce even better models than evolution, though such tuning would likely involve running many experiments and be
    more costly, and that random search might produce equally good models if run for a very long time, which would be very costly.'
  location: Discussion (Simplicity of aging evolution)
  page: 8
  quote: It is possible that through careful tuning, RL could be made to produce even better models than evolution, but such tuning would likely involve running many experiments, making it more costly.
- id: c9
  statement: 'Conjectured mechanism (speculative): under noisy training, non-aging evolution can keep models that were lucky the first time they trained, whereas under aging evolution an architecture can
    persist only by being inherited and re-training well repeatedly; the authors call this a form of regularization, report a supporting toy experiment with noisy evaluation in a supplement, and leave further
    verification to future work.'
  location: Discussion (Understanding aging evolution and regularization)
  page: 7
  quote: We can speculate that aging may help navigate the training noise in evolutionary experiments, as follows.

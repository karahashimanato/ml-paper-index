  notes: 'Selected for the topic article requested by the user (2026-10-10): causal effect estimation with machine learning (identification assumptions, meta-learners and double/debiased ML, causal trees
    and forests, Bayesian trees, representation-learning networks, overlap, model selection without ground truth, and benchmarking practice). Carded by a subagent. Results tables not recorded; claims only.
    Affiliation: Stanford GSB and NBER; a footnote says part of the research was conducted while the authors were visiting Microsoft Research. No venue is stated in the arXiv v3 PDF (dated December 2015;
    first draft October 2013) and the arXiv record has no journal_ref; none recorded. The PDF headings are unnumbered, so locations use section names. Besides CT the paper compares transformed outcome trees
    (TOT, Y* = Y(W - p)/(p(1-p)) style transformed outcome with off-the-shelf CART; described as not efficient because it ignores the treatment indicator beyond the transformation), fit-based trees (F)
    and squared t-statistic trees (TS, citing Su et al.), each in adaptive and honest versions. Simulation results are in Table 1 and are not recorded. The appendix says the simulation code is an R package
    based on rpart ''in preparation for public release'', with a minimum of nm = 25 treated and 25 control observations per leaf and covariate bucketing with b = 4; the authors note the bucketing ''can
    in principle make things worse''. The paper cites Wager & Athey (2015) (causal forests) as related work by an overlapping author.'

  notes: 'Selected for the method article requested by the user (2026-10-10): alternatives and extensions to dense Transformers (sparse mixture-of-experts routing and load balancing, state space models
    from HiPPO/S4 to Mamba-2, linear and kernelized attention, RWKV, and benchmarks/analyses comparing them with Transformers). Carded by a subagent. Results tables not recorded; claims only. Affiliation:
    Stanford. Venue from the arXiv comment (''ICLR 2022 (Outstanding Paper HM)''); year is the first arXiv version (2021). Section numbers are from numbered headings in the PDF; the appendix containing
    the implementation and limitations paragraphs is headed ''A Discussion''. Conflict of interest: S4 builds on and ablates the authors'' own HiPPO (arxiv-2008.07669) and LSSL (Gu et al., with Goel and
    Ré), and the paper proves that the LSSL''s proposed fast algorithm is unstable. Citing the LSSL, the paper states that replacing a random A with the HiPPO matrix improved sequential MNIST from 60% to
    98% (Section 2.2). Other text-stated results (speech SC10 98.3% raw; 96.3% at 0.5x frequency without retraining; ~60x faster generation; sCIFAR 91.12% without augmentation; forecasting better on 40/50
    settings) are not recorded as claims; tables are not recorded. S4 state size was fixed to N = 64 on LRA; some tasks (Path-X) used an A100 40GB (Appendix D.2).'

claims:
- id: c1
  statement: Proposes LTSF-Linear, a set of one-layer linear models (Linear, DLinear with trend/remainder decomposition, NLinear with last-value subtraction) as a comparison baseline for long-term forecasting.
  location: Abstract
  page: 1
  quote: To validate our claim, we introduce a set of embarrass-ingly simple one-layer linear models named LTSF-Linear for comparison.
- id: c2
  statement: 'Main claim: on nine real-life datasets, LTSF-Linear outperforms existing Transformer-based LTSF models in all cases, often by a large margin.'
  location: Abstract
  page: 1
  quote: Experimental results on nine real-life datasets show that LTSF-Linear surprisingly outperforms existing sophisticated Transformer-based LTSF models in all cases, and often by a large margin.
- id: c3
  statement: 'Hedged conclusion: the temporal modeling capabilities of Transformers for time series are exaggerated, at least for the existing LTSF benchmarks.'
  location: Introduction
  page: 2
  quote: With the above, we conclude that the temporal modeling capabilities of Transformers for time series are exaggerated, at least for the existing LTSF benchmarks.
- id: c4
  statement: 'Baseline protocol: Appendix B.2 states that Transformer baselines (Autoformer, Informer, vanilla Transformer from the Autoformer code; FEDformer and Pyraformer from their repositories) were
    trained with their default hyperparameters; in the main Table 2, however, only methods marked * (Linear, NLinear, DLinear, Pyraformer, Repeat) were run by the authors and the other results (FEDformer,
    Autoformer, Informer, LogTrans) are copied from the FEDformer paper.'
  location: 'Appendix: Implementation Details'
  page: 9
  quote: We also adopt their default hyper-parameters to train the models.
- id: c5
  statement: 'Look-back asymmetry: by default the paper reports look-back L=336 for LTSF-Linear and L=96 for Transformers, motivated by linear models underfitting on short inputs and Transformers overfitting
    on long ones.'
  location: 'Appendix: Implementation Details'
  page: 9
  quote: To compare the best performance of existing LTSF-Transformers with LTSF-Linear, we re-port L=336 for LTSF-Linear and L=96 for Transformers by default.
- id: c6
  statement: 'Look-back study: similar to previous studies'' observations, existing Transformer-based models'' performance deteriorates or stays stable as the look-back window grows, whereas LTSF-Linear
    improves.'
  location: 'Experiments: More Analyses on LTSF-Transformers'
  page: 5
  quote: Similar to the observations from previous studies [27, 30], existing Transformer-based models’ performance deteriorates or stays stable when the look-back window size increases.
- id: c7
  statement: 'Stated limitation: LTSF-Linear has limited model capacity and is meant only as a simple, competitive baseline; e.g. a one-layer linear network struggles with dynamics caused by change points.'
  location: 'Conclusion: Future work'
  page: 8
  quote: LTSF-Linear has a limited model ca-pacity, and it merely serves a simple yet competitive base-line with strong interpretability for future research.

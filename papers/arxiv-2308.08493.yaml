  notes: 'Selected for the topic article requested by the user (2026-10-11): pitfalls in evaluating large language models (benchmark contamination and its detection, prompt and answer-format sensitivity,
    LLM-as-a-judge biases, human-preference arenas, holistic evaluation, benchmark errors, and reproducibility of evaluation harnesses). Carded by a subagent. Results tables not recorded; claims only. Affiliation:
    University of Arizona. Venue from the PDF header (''Published as a conference paper at ICLR 2024''); arXiv comment adds ''Spotlight''. Section numbers: 3.3, 4 (''Section 4: Human Evaluation'') and 5
    (''We evaluate both these algorithms in Section 5'') are from cross-references in the PDF; the extracted headings carry no numbers, so other locations use section names. Human evaluation (Section 5)
    reports that GPT-4''s train and test/validation splits of AG News and WNLI, train splits of IMDB and RTE, and the XSum test split were contaminated, and for GPT-3.5 only the XSum test split; these are
    human labels from the authors'' annotators applying the Alg. 2 rule, and the detector accuracies are measured against these same labels. ChatGPT-Cheat? labelled all GPT-4 partitions ''suspicious'',
    which the authors say is likely due to safety filters against generating copyrighted content. Bootstrap test details (Appendix E): 10,000 resamples, p <= 0.05. Conflict of interest: Acknowledgement
    states ''Mihai Surdeanu declares a ﬁnancial interest in lum.ai'' (disclosed to the University of Arizona); the evaluated models and the compared method are not by the authors. Table values (BLEURT/ROUGE-L,
    ticks) not recorded.'

proposes:
- 'LLM ablations for LLM-based forecasters: w/o LLM, LLM2Attn, LLM2Trsf'
- PAttn (patching + one attention layer) baseline
claims:
- id: c1
  statement: 'Main finding: in ablations of three recent LLM-based forecasters, removing the LLM or replacing it with a basic attention layer does not degrade forecasting performance, and in most cases
    results improve.'
  location: Abstract
  page: 1
  quote: In a series of ablation studies on three recent and popular LLM-based time series forecasting methods, we find that removing the LLM component or replacing it with a basic attention layer does
    not degrade forecasting performance—in most cases, the results even improve!
- id: c2
  statement: 'Scope: three ablations of three methods (OneFitsAll/GPT4TS, Time-LLM, CALF) on eight standard benchmark datasets used by those methods plus five Monash datasets; metrics MAE and MSE. LLMTime
    is not among the ablated methods.'
  location: Introduction
  page: 1
  quote: We substantiate our claim by performing three ablations of three popular and recent LLM-based forecasting methods [49, 14, 21] using eight standard benchmark datasets from reference methods
- id: c3
  statement: 'Reproduction protocol: the original hyperparameters, runtime environments and code of each method were used, and error metrics from the original papers are shown alongside the replication
    where possible (Appendix D.2 adds that for the smaller ablations the learning rate or batch size was adjusted in some cases).'
  location: 'Experimental setup: Reproducibility Note'
  page: 3
  quote: We used the original hyper-parameters, runtime environments, and code, including model architectures, training loops, and data-loaders.
- id: c4
  statement: 'Pretraining test: randomly initializing CALF''s language model and training it on time series, versus using pretrained weights (with/without finetuning), led the authors to conclude that textual
    knowledge from pretraining provides very limited aid for forecasting.'
  location: 'Results: RQ3'
  page: 8
  quote: In summary, textual knowledge from pretraining provides very limited aids for time series forecasting.
- id: c5
  statement: 'Few-shot test: training on 10% of each dataset, LLMs were not meaningfully useful: for Time-LLM (LLaMA) the LLM version and the w/o LLM ablation each performed better in the same number of
    cases, and for CALF (GPT-2) the ablations could perform better.'
  location: 'Results: RQ5'
  page: 9
  quote: In this section, our evaluation demonstrates that LLMs are still not meaningfully useful in few-shot learning scenarios.
- id: c6
  statement: 'Simple alternative: a linear model with an encoder made of patching and attention (PAttn) achieves forecasting performance similar to LLM-based methods.'
  location: Introduction
  page: 2
  quote: We find that a simple linear model with an encoder composed of patching and attention can achieve forecasting performance similar to that of LLMs.
- id: c7
  statement: 'Stated limitations: only forecasting is evaluated (not classification or question answering), and only evenly spaced time series (not irregular sequences such as payment records).'
  location: 'Appendix: Limitations'
  page: 14
  quote: Our evaluation is limited to only time-series datasets, i.e., sequences with even time-intervals.

  notes: 'Selected for the topic article requested by the user (2026-10-06): anomaly detection, classical vs deep (benchmarks, isolation-based methods, self-supervised and one-class deep methods, industrial
    image anomaly detection). Carded by a subagent. Results tables not recorded; claims only. Authors from Shanghai University of Finance and Economics and Carnegie Mellon University; all authors contributed
    equally and are listed alphabetically. Venue from the PDF footnote (''36th Conference on Neural Information Processing Systems (NeurIPS 2022) Track on Datasets and Benchmarks'') and the arXiv comment.
    Section numbers are taken from cross-references in the text (§3.2, §4.1-§4.4, Appx. C); the extracted headings carry no numbers. Metrics: AUCROC and AUCPR (main text reports AUCROC; the footnote says
    AUCPR gives similar results), with critical difference diagrams (Wilcoxon-Holm, p <= 0.05). 98,436 experiments in total (Appx. C). Appendix B.1 says the default hyperparameters in PyOD are used for
    the unsupervised algorithms deployed by PyOD; tree ensembles use the default settings of their official repositories and SVM/MLP/RF scikit-learn defaults. Training data for unsupervised detectors is
    the 70% split including its anomalies (inductive, contaminated); labeled fraction gamma_l refers to anomalies in the train set. The anomaly-type and robustness experiments use only the 47 classical
    datasets with synthetic anomalies generated from a model of the normal samples (GMM for local/clustered, uniform for global, vine copula/KDE for dependency; original anomalies discarded). Robustness
    results (duplicated anomalies hurt unsupervised methods most; irrelevant features hurt supervised methods least) and runtime (HBOS, COPOD, ECOD, NB fastest; XGBOD, ResNet, FTTransformer heavy) not recorded
    as claims. Conflict of interest: Yue Zhao is the first author of PyOD [198], XGBOD [195] and LSCP [197]; COPOD [96] and ECOD [97] (both benchmarked) are co-authored by Y. Zhao and X. Hu. Results tables/figures
    not recorded.'

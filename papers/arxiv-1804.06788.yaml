  notes: 'Selected for the method article requested by the user (2026-10-07): approximate Bayesian inference and its diagnostics (HMC/NUTS and SG-MCMC, variational inference, R-hat, PSIS, SBC, VI error
    bounds, Bayesian workflow). Carded by a subagent. Results tables not recorded; claims only. Affiliations: Columbia University, Symplectomorphic LLC, University of Toronto, Aalto University. No venue
    stated in the PDF or the given arXiv comment; none recorded. Conflict of interest: the authors include Stan developers, and the experiments validate Stan''s own algorithms (dynamic HMC/NUTS, ADVI in
    Stan 2.17.1) as well as R-INLA (co-author Simpson''s work is cited for the INLA model setup). Experiments use L = 100 posterior draws, N = 10,000 replications (Sections 6.1-6.3) and N = 1000 (Section
    6.4, INLA, limited by cost): misspecified prior (∪ shape), centered eight schools with HMC (bias in tau), ADVI on linear regression (strong bias for the slope), INLA on a spatial HIV-prevalence model
    (small deviation seen only in the ECDF view, recommended in Section 5.2 for small deviations). Possible inconsistency to check: the Section 6.2 text says HMC samples for tau are ''biased below the prior
    samples'' (citing Figure 11b) while the Figure 10 caption says ''biased towards larger values of tau''; not resolved here. The paper calls itself ''a corrected implementation'' of Cook, Gelman and Rubin
    (2006), whose co-author Gelman is also an author here.'

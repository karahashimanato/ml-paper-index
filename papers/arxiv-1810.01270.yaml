proposes:
- 'META-DES: dynamic ensemble selection framed as a meta-problem; five sets of meta-features (local hard classification and posterior probabilities in a K-NN region of competence, overall local accuracy,
  agreement on Kp similar output profiles, and distance to the decision boundary) feed a meta-classifier that decides per query whether each base classifier is competent; competent classifiers are combined
  by majority vote'
claims:
- id: c1
  statement: 'Mechanism: meta-features extracted from training data train a meta-classifier that predicts whether a base classifier is competent to classify an input; at test time the meta-features are
    extracted for the query and the meta-classifier decides whether each base classifier is added to the ensemble.'
  location: Abstract
  page: 1
  quote: The meta-features are extracted from the training data and used to train a meta-classiﬁer to predict whether or not a base classiﬁer is competent enough to classify an input instance.
- id: c2
  statement: 'Competence signals: three meta-feature sets (f1-f3) come from the region of competence (K nearest neighbours of the query), f4 from the most similar output profiles in decision space, and
    f5 from the base classifier''s confidence on the query itself.'
  location: Meta-feature extraction process
  page: 13
  quote: Three meta-features, f1, f2 and f3, are computed using information extracted from the region of competence θj.
- id: c3
  statement: 'Failure mode of local-accuracy competence (from the authors'' previous work and discussion of prior DES methods): selection is limited by the algorithm that defines the region of competence,
    errs when mislabelled outliers lie near the query, and any difference between the validation and test distributions may negatively affect performance.'
  location: Classifier accuracy over a local region
  page: 6
  quote: Moreover, any difference between the distribution of validation and test datasets may negatively affect the system performance.
- id: c4
  statement: 'Protocol: 30 classification datasets (UCI, STATLOG, KEEL, LKC, PRTOOLS), with the evaluation focused on small datasets plus a few larger ones; 20 replications of random class-stratified splits
    (50% training, 25% dynamic selection set DSEL, 25% test) of the same datasets, so test data are not shifted; for META-DES half the training data is used for meta-training and half for generating the
    pool.'
  location: Experimental Protocol
  page: 16
  quote: The experiments were conducted using 20 replications.
- id: c5
  statement: 'Hyperparameter setting: K was fixed at 7 from the authors'' previous paper; hC and then Kp were set to the best-performing values on DSEL (Kruskal-Wallis tests; smaller value on ties) using
    eleven of the thirty datasets. These eleven datasets are also part of the 30 datasets on which the comparison is reported; DSEL, not the test split, was used.'
  location: Parameters Setting
  page: 19
  quote: 'Only a subset with eleven of the thirty datasets are used for parameters setting procedure: Pima, Liver, Breast, Blood Transfusion, Banana, Vehicle, Lithuanian, Sonar, Ionosphere, Wine, Haberman’s
    Survival.'
- id: c6
  statement: 'Baselines: all methods share a pool of 100 Perceptrons (generated by bagging; multi-class perceptrons for multi-class problems); the eight DES techniques (KNORA-E, KNORA-U, DES-FA, LCA, OLA,
    MLA, MCB, KNOP) use K = 7 because it gave the best result in previous publications, and no re-tuning of the baselines in this paper is described; static baselines are AdaBoost and Bagging (100 iterations),
    Single Best, static selection, and the Oracle (always selects a correct classifier if one exists); pairs are compared with Kruskal-Wallis at 95%.'
  location: Comparison with the state-of-the-art dynamic selection techniques
  page: 21
  quote: For all techniques, the pool of classiﬁers C is composed of 100 Perceptrons as base classiﬁer (M = 100).
- id: c7
  statement: 'Main empirical claim: META-DES achieved the highest accuracy on the majority of datasets, which the authors attribute to combining five DES criteria (one criterion may fail while others compensate);
    in the results discussion they also note that no single competence criterion dominated across datasets (invoking no free lunch).'
  location: Conclusion
  page: 25
  quote: Experimental results show the proposed META-DES achieved the highest classiﬁcation accuracy in the majority of datasets, which can be explained by the fact that the proposed META-DES framework
    is based on ﬁve different DES criteria.

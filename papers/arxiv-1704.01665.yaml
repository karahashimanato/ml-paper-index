proposes:
- 'S2V-DQN: a greedy construction meta-algorithm whose node-evaluation function Q is a structure2vec graph embedding network trained with n-step fitted Q-learning; applied to Minimum Vertex Cover, Max Cut,
  TSP (and Set Cover in the appendix)'
claims:
- id: c1
  statement: 'Relation to greedy algorithms: the learned algorithm keeps the classical greedy pattern (build a feasible solution by successively adding nodes, maintained to satisfy the problem''s constraints);
    only the node-evaluation function is learned instead of hand-crafted.'
  location: Introduction
  page: 2
  quote: We will adopt a greedy meta-algorithm design, whereby a feasible solution is constructed by successive addition of nodes based on the graph structure, and is maintained so as to satisfy the problem’s
    graph constraints.
- id: c2
  statement: 'Training: the greedy policy is learned with fitted Q-learning (n-step Q-learning with experience replay), parametrized by the structure2vec graph embedding network, optimizing the original
    objective directly.'
  location: Introduction
  page: 2
  quote: We will use ﬁtted Q-learning to learn a greedy policy that is parametrized by the graph embedding network.
- id: c3
  statement: 'Framing on guarantees: the authors describe heuristics as fast and effective but lacking theoretical guarantees; no approximation guarantee for the learned heuristic is stated in the text
    (the MVC baselines are 2-approximations).'
  location: Introduction
  page: 1
  quote: Heuristics are often fast, effective algorithms that lack theoretical guarantees, and may also require substantial problem-speciﬁc research and trial-and-error on the part of algorithm designers.
- id: c4
  statement: 'Protocol: instances are synthetic (Erdos-Renyi and Barabasi-Albert graphs for MVC/MaxCut; DIMACS-generator uniform or clustered points for TSP); 100 validation and 1000 test graphs; approximation
    ratios are relative to the best solution found by CPLEX (MVC, MaxCut) or Concorde (TSP) within 1 hour, which may not be optimal.'
  location: Experimental Evaluation
  page: 7
  quote: All approximation ratios reported in the paper are with respect to the best (possibly optimal) solution found by the solvers within 1 hour.
- id: c5
  statement: 'Train vs test sizes: to test size generalization, S2V-DQN is trained on graphs with 50-100 nodes and tested on graphs of up to 1200 nodes.'
  location: Generalization to larger instances
  page: 8
  quote: To investigate this, we train S2V-DQN on graphs with 50–100 nodes, and test its generalization ability on graphs with up to 1200 nodes.
- id: c6
  statement: 'TSP caveat: on synthetic random TSP the hand-designed Farthest insertion and 2-opt perform as well as S2V-DQN and slightly better in some cases (the authors add that S2V-DQN still performs
    better on real-world TSP data; that TSPLIB comparison uses per-instance Active Search rather than the greedy policy used on synthetic test sets, see c7).'
  location: Comparison of solution quality
  page: 8
  quote: For TSP, The Farthest and 2-opt algorithm perform as well as S2V-DQN, and slightly better in some cases.
- id: c7
  statement: 'TSPLIB protocol differs from the synthetic one: on 38 TSPLIB instances (51-318 cities) S2V-DQN is run in ''Active Search'' mode, i.e. RL is applied on the fly to each instance without upfront
    training, keeping the best tour found; larger instances were not attempted due to single-GPU memory.'
  location: Appendix C.3
  page: 14
  quote: 'We apply S2V-DQN in “Active Search" mode, similarly to [6]: no upfront training phase is required, and the reinforcement learning algorithm 1 is applied on-the-ﬂy on each instance.'

proposes:
- 'SOSD (Search On Sorted Data) benchmark: open-source C++ framework with synthetic and real-world 200M-key datasets and optimized baselines (binary/interpolation search, radix binary search, B-tree, ART,
  FAST) plus an open RMI implementation and RadixSpline'
claims:
- id: c1
  statement: 'Critique of earlier evaluation (attributed): the original learned index paper lacked an open-source implementation, which left many in the community skeptical that learned models could beat
    optimized in-memory data structures.'
  location: Introduction
  page: 1
  quote: However, [14] lacked an open-source implementation and thus left many in the community skeptical that learned models could outperform optimized in-memory data structures [11, 15].
- id: c2
  statement: 'Proposal: SOSD, a framework for comparing new (learned) index structures on both synthetic and real-world datasets, released as open-source code with highly optimized baselines; the authors
    state it includes the first performant public RMI implementation (a new implementation, not the one used in the original paper).'
  location: Introduction
  page: 1
  quote: Thus, we introduce the Search On Sorted Data Benchmark (SOSD), a framework that allows researchers to compare their new (learned) index structures on both synthetic and real-world datasets.
- id: c3
  statement: 'Datasets: eight datasets of 200M 64-bit unsigned integer keys; amzn (book sale popularity), face (upsampled Facebook user IDs), osmc (OpenStreetMap locations as S2 CellIds) and wiki (edit
    timestamps) are real-derived, while logn, norm, uden (dense) and uspr (uniform sparse) are synthetic; 32-bit versions exist for all except osmc and wiki.'
  location: Search on Sorted Data Benchmark
  page: 3
  quote: SOSD currently includes eight different datasets.
- id: c4
  statement: 'Query protocol: 10M equality lookups with keys drawn uniformly from the stored keys, hashing excluded to support range-based (lower bound) lookups, at most 100 matches per key, executed one
    at a time in a single thread on an AWS c5.4xlarge machine.'
  location: Search on Sorted Data Benchmark
  page: 3
  quote: Lookups are performed one-at-a-time in a single thread.
- id: c5
  statement: 'Main empirical claim (preliminary, on SOSD''s tested datasets): the CDF approximators RMI and RadixSpline both have very low lookup latencies, which the authors attribute to fitting a model
    to the data distribution; B-tree, binary search and FAST are hardly affected by the data distribution while interpolation search is heavily affected by skew.'
  location: Results
  page: 3
  quote: The CDF approximators RMI and RadixSpline both have very low lookup latencies, highlighting the beneﬁt learned index structures receive from ﬁtting a model to the data distribution.
- id: c6
  statement: 'Tuning caveat: both RMI and RadixSpline require dataset-specific tuning, and the authors recommend them only if users can afford this step (if users cannot afford the training time, they recommend
    ART or FAST for 32-bit keys and ART or RBS for 64-bit keys).'
  location: Takeaways
  page: 4
  quote: Otherwise, the optimal search strategy depends on whether a user can afford to manually tune and ﬁt a CDF model, as both RMI and RS require dataset-speciﬁc tuning.
- id: c7
  statement: 'Limitation: learned indexes currently lack support for efficient updates; the authors note that several benchmarked non-learned methods (e.g. RBS, FAST) also lack efficient updates, and SOSD
    does not yet measure updates or multi-threaded lookups.'
  location: Takeaways
  page: 4
  quote: A current drawback of learned indexes is the lack of support for efﬁcient updates, an arguably important feature for index structures.

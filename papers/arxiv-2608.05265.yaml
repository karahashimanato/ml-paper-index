proposes:
- 15-model benchmark for post-wildfire debris-flow prediction (USGS basin-scale data) with SHAP analysis and TabPFN-based synthetic augmentation
claims:
- id: c1
  statement: The paper compares 15 models, including TabPFN, on basin-scale post-wildfire debris-flow observations across the western United States.
  location: Abstract
  page: 1
  quote: Using basin-scale observations of post-wildfire debris-flow events across the western United States, we compare 15 models, including a new foundation model, the Tabular Prior-Data Fitted Network
    (TabPFN).
- id: c2
  statement: Evaluation uses stratified 5-fold cross-validation repeated 10 times, with splits precomputed once and shared by all models.
  location: Cross-Validation
  page: 7
  quote: In particular, we used stratified 5-fold cross-validation repeated 10 times, producing 50 outer evaluation splits with an equal percentage of no-debris-flow and debris-flow observations in each
    split.
- id: c3
  statement: Tuned models used Bayesian optimization with 100 trials and Hyperband pruning on an inner validation split, tuned separately for unaugmented and augmented training; some models used native
    tuning or none.
  location: Hyperparameter Tuning
  page: 7
  quote: For each model and training condition, we used Bayesian optimization with 100 trials and Hyperband pruning to maximize validation threat score under fold-aware training (Akiba et al.; Li et al.).
- id: c4
  statement: Decision thresholds were not optimized, and class-weight rebalancing was fixed rather than tuned.
  location: Hyperparameter Tuning
  page: 7
  quote: Decision-threshold optimization was likewise not performed to avoid conflating hyperparameter selection with the metric used for model comparison.
- id: c5
  statement: TabPFN and the leading tree ensembles form a top tier whose within-tier order is not stable; TabPFN was run with static settings while tree models needed Bayesian search.
  location: Discussion
  page: 18
  quote: Tree-based models such as ExtraTrees, CatBoost, and XGBoost required Bayesian hyperparameter search, whereas TabPFN was run with static settings with no dataset-specific tuning and still matched
    or exceeded them.
- id: c6
  statement: 'Limitation: the dataset is geographically concentrated in southern California fires, which may favor features and models that generalize within that region.'
  location: Discussion
  page: 19
  quote: The dataset is geographically concentrated, with 61% of records from southern California fires, which may favor features and model structures that generalize well within that region but perform
    differently in the drier, more continental environments represented by the remaining fires.

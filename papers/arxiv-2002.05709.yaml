  notes: 'Selected for the method article requested by the user (2026-10-05): contrastive and self-supervised representation learning. Carded by a subagent. Results tables not recorded; claims only. Affiliation:
    Google Research, Brain Team. Venue from the PDF first page (''Proceedings of the 37th International Conference on Machine Learning, Vienna, Austria, PMLR 119, 2020'') and the arXiv comment. Comparison-with-state-of-the-art
    models are trained for 1000 epochs; baselines in Tables 6-7 are cited from the respective papers. Semi-supervised: fine-tuning on class-balanced 1%/10% ImageNet subsets following Zhai et al. (2019),
    without regularization. Transfer (12 datasets, Appendix B.8): hyperparameters selected per model-dataset on a validation set (creator-specified or held out from training), then retrained on train+validation
    and reported on test. Other-loss baselines (margin, logistic) were tuned over small grids (Appendix B.10). Appendix B.7 notes linear evaluation and fine-tuning are almost linearly correlated but fine-tuning
    on few labels seems to benefit more from longer training. Results tables not recorded.'

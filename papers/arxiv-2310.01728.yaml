claims:
- id: c1
  statement: 'Method: input time series (patched) are reprogrammed with text prototypes before being fed into a frozen LLM; Prompt-as-Prefix adds context and task instructions, and LLM outputs are projected
    to forecasts.'
  location: Abstract
  page: 1
  quote: We begin by reprogramming the input time series with text prototypes before feeding it into the frozen LLM to align the two modalities.
- id: c2
  statement: Only the parameters of the lightweight input transformation and output projection are updated, while the backbone LLM stays frozen (the paper uses Llama-7B as the default backbone).
  location: Methodology
  page: 4
  quote: We note that only the parameters of the lightweight input transformation and output projection are updated, while the backbone language model is frozen.
- id: c3
  statement: 'Main claim: Time-LLM outperforms state-of-the-art specialized forecasting models, and the abstract states it excels in few-shot and zero-shot settings.'
  location: Abstract
  page: 1
  quote: Our comprehensive evaluations demonstrate that TIME-LLM is a powerful time series learner that outperforms state-of-the-art, specialized forecasting models.
- id: c4
  statement: 'Definition of zero-shot: cross-domain adaptation, i.e. the model is trained (optimized) on one dataset and evaluated on another dataset whose samples it has not seen, using ETT dataset pairs
    under the long-term forecasting protocol; it is not a pretrained-only setting.'
  location: 'Zero-shot forecasting: Setups'
  page: 8
  quote: we evaluate the zero-shot learning capabilities of the reprogrammed LLM within the framework of cross-domain adaptation.
- id: c5
  statement: 'Evaluation protocol: configurations follow Wu et al. (2023) with a unified evaluation pipeline, and baseline performance is cited (copied) from Zhou et al. (2023a, GPT4TS) where applicable;
    which baselines were re-run instead is not stated in the text.'
  location: 'Main results: Baselines'
  page: 6
  quote: We compare with the SOTA time series models, and we cite their performance from (Zhou et al., 2023a) if applicable.
- id: c6
  statement: 'Long-term forecasting setup: ETTh1/ETTh2/ETTm1/ETTm2, Weather, Electricity, Traffic and ILI, input length 512 and horizons 96-720, metrics MSE and MAE (per Table 1 caption and Table 9, ILI
    uses horizons 24-60 and input length 96).'
  location: 'Long-term forecasting: Setups'
  page: 6
  quote: The input time series length T is set as 512, and we use four different prediction horizons H ∈{96, 192, 336, 720}.

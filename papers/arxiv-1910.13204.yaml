proposes:
- 'Minimal Variance Sampling (MVS): row sampling for stochastic gradient boosting with probabilities proportional to a regularized gradient magnitude sqrt(g^2 + lambda h^2), capped at 1, with inverse-probability
  weights, derived from minimizing the variance of split-score estimates'
- 'MVS Adaptive: a hyperparameter-free variant setting lambda from the squared mean of the initial leaf'
claims:
- id: c1
  statement: 'Problem formulation: randomization in stochastic gradient boosting is cast as optimizing sampling probabilities to maximize the estimation accuracy of split scores used to train the trees.'
  location: Abstract
  page: 1
  quote: In this paper, we formulate the problem of randomization in SGB in terms of optimization of sampling probabilities to maximize the estimation accuracy of split scoring used to train decision trees.
- id: c2
  statement: 'Assumptions of the derivation: the squared deviation between sampled and full-data split scores is minimized assuming previous splits of the tree are fixed and the same for subsampled and
    full data; an upper bound is minimized and the unknown leaf values are replaced by a universal constant (the parameter lambda), giving a nearly optimal closed-form solution.'
  location: Problem setting
  page: 5
  quote: under the assumption that previous splits of the tree are ﬁxed and the same for subsampled and full data.
- id: c3
  statement: Setting lambda to 0 recovers Importance Sampling, which the authors say is of limited use in GBDT because the number of instances in each node must still be estimated accurately and it is numerically
    unstable for near-zero gradients; the lambda term acts as a regularizer against enormous weights. (The next paragraph states that lambda to infinity gives SGB.)
  location: Theoretical analysis
  page: 6
  quote: It is easy to derive that setting λ to 0 implies the procedure of Importance Sampling.
- id: c4
  statement: 'Cost of sampling: a sort-and-binary-search threshold search is O(N log N), versus O(N) for SGB and GOSS; the authors propose a quickselect-like algorithm with O(N) complexity.'
  location: Algorithm
  page: 7
  quote: To compare with, SGB and GOSS algorithms have O(N) complexity for sampling.
- id: c5
  statement: 'CatBoost benchmark setup: MVS (80% sampling ratio) implemented in CatBoost and compared with default CatBoost without sampling on 153 public and proprietary binary classification datasets
    (up to 45 million instances), counting ROC-AUC wins.'
  location: Experiments
  page: 7
  quote: We implemented MVS in CatBoost and performed benchmark comparison of MVS with sampling ratio 80% and default CatBoost with no sampling on 153 publicly available and proprietary binary classiﬁcation
    datasets of different sizes up to 45 millions instances.
- id: c6
  statement: 'Result stated in the text for the CatBoost benchmark: 97 wins for MVS versus 55 for the default setting and +0.12% mean ROC-AUC.'
  location: Experiments
  page: 7
  quote: 'The results show signiﬁcant improvement over the existing default: 97 wins of MVS versus 55 wins of default setting and +0.12% mean ROC-AUC improvement.'
- id: c7
  statement: 'LightGBM comparison protocol (MVS vs GOSS vs SGB, all implemented in LightGBM): baselines use the tuned parameters and train-test splits from the CatBoost benchmark repository [5] with sampling
    ratio 1; only the sampling parameters of each method are tuned by 5-fold cross-validation on the training subset; evaluation on the 20% test subset with 1 - ROC-AUC, averaged over 10 seeds; seven public
    datasets.'
  location: Experiments
  page: 8
  quote: We used the tuned parameters and train-test splitting for each dataset from [5] as baselines, presetting the sampling ratio to 1.
- id: c8
  statement: 'Tuning cost: GOSS and MVS each have one hyperparameter beyond the sample rate, so tuning them may potentially take more time than SGB; MVS Adaptive is introduced to remove the lambda hyperparameter.'
  location: Experiments
  page: 9
  quote: So tuning GOSS and MVS may potentially take more time than SGB.

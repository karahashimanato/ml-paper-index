- id: c2
  statement: 64 recent deep models are discussed and categorized.
  location: Discussion and conclusion
  page: 28
  quote: 64 recent deep models were comprehensively discussed and categorised.
- id: c3
  statement: Real-world time series are non-stationary, so deep models need online or incremental training.
  location: Discussion and conclusion
  page: 27
  quote: This non-stationary nature necessitates the adaptation of deep learning models through online or incremental training approaches
- id: c4
  statement: Without labeled anomalies, many normal instances are flagged; reducing false positives is a key challenge.
  location: Discussion and conclusion
  page: 27
  quote: one of the key challenges is to find a mechanism for minimising false positives and improve recall rates of detection.
- id: c5
  statement: Research focuses on detection precision and neglects interpretability, which diagnostics require.
  location: Discussion and conclusion
  page: 28
  quote: anomaly detection research focuses primarily on detection precision, failing to address the issue of interpretability.
- id: c6
  statement: Multivariate high-dimensional series are particularly challenging (sparsity, temporal and inter-dimension dependencies).
  location: Discussion and conclusion
  page: 27
  quote: The detection of anomalies in multivariate high-dimensional time series data presents a particular challenge
- id: c7
  statement: Models are vulnerable to noise in the input data.
  location: Discussion and conclusion
  page: 27
  quote: models are vulnerable, and their performance is compromised by noise in the input data.
- id: c8
  statement: The anomaly score is mostly defined from a loss function (e.g. reconstruction error).
  location: Deep anomaly detection methods
  page: 9
  quote: An anomaly score is mostly defined based on a loss function.

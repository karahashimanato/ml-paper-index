- id: c1
  statement: RamanPFN is a spectral framework that feeds physics-guided Raman representations to a tabular foundation model for in-context inference.
  location: Abstract
  page: 1
  quote: Here we present RamanPFN, a general-purpose spectral foundation framework that enables unified in-context inference through physics-guided spectral learning.
- id: c2
  statement: RamanPFN achieves the best aggregate metrics against 28 independently reproduced methods, including tabular foundation models.
  location: Abstract
  page: 1
  quote: RamanPFN achieved state-of-the-art performance across all reported aggregate metrics against 28 independently reproduced methods spanning chemometrics, spectral neural networks, deep tabular learners
    and tabular foundation models.
- id: c3

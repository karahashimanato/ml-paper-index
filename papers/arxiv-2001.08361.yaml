proposes:
- power-law scaling laws for Transformer LM cross-entropy loss in non-embedding parameters N, dataset size D and compute C, a joint L(N, D) form, and a compute-optimal allocation that favors larger models
  trained short of convergence
claims:
- id: c1
  statement: 'Main claim: language-model cross-entropy loss scales as a power law with model size, dataset size and training compute, with some trends spanning more than seven orders of magnitude.'
  location: Abstract
  page: 1
  quote: The loss scales as a power-law with model size, dataset size, and the amount of compute used for training, with some trends spanning more than seven orders of magnitude.
- id: c2
  statement: 'Experimental range: the relations are stated to hold across eight orders of magnitude in minimum compute, six in model size and over two in dataset size; the fitted numerical values are tied
    to the WebText2 training set (next sentence).'
  location: Summary of Scaling Laws
  page: 5
  quote: These relations hold across eight orders of magnitude in Cmin, six orders of magnitude in N, and over two orders of magnitude in D.
- id: c3
  statement: 'Compute counting: training compute is estimated as about 6N floating point operations per training token (forward pass about 2N, backward about twice that), excluding embedding parameters
    and context-dependent terms.'
  location: Parameter and Compute Scaling of Transformers
  page: 7
  quote: Accounting for the backwards pass (approximately twice the compute as the forwards pass), we then deﬁne the estimated non-embedding compute as C ≈6N ﬂoating point operators per training token.
- id: c4
  statement: 'Compute-optimal allocation: as the compute budget increases it should be spent primarily on larger models, without dramatic increases in training time or dataset size (a conclusion drawn from
    the paper''s power-law fits on WebText2 Transformer LMs within the studied range).'
  location: Summary of Scaling Laws
  page: 5
  quote: As the computational budget C increases, it should be spent primarily on larger models, without dramatic increases in training time or dataset size (see Figure 3).
- id: c5
  statement: 'Training protocol: unless otherwise noted, all training runs used a learning-rate schedule with a 3000-step linear warmup followed by cosine decay to zero (models were trained for a fixed
    number of steps unless otherwise noted).'
  location: Training Procedures
  page: 7
  quote: Unless otherwise noted, all training runs included in our data used a learning rate schedule with a 3000 step linear warmup followed by a cosine decay to zero.
- id: c6
  statement: 'Stated limit: far beyond the studied scales, the L(Cmin) and L(D) trends contradict each other, so the authors say the scaling laws must break down before that point (they conjecture the intersection
    marks maximal Transformer LM performance; values are highly uncertain).'
  location: Contradictions and a Conjecture
  page: 17
  quote: 'This implies that our scaling laws must break down before this point, but we conjecture that the intersection point has a deeper meaning: it provides an estimate of the point at which Transformer
    language models reach maximal performance.'
- id: c7
  statement: 'Disagreement with prior work: the paper states that Hestness et al. ([HNA+17]) found super-linear scaling of dataset size with model size (i.e. data growing faster than model size), whereas
    this paper finds sub-linear scaling (data growing more slowly than model size; in Section 4 this is the dataset size needed to avoid overfitting as model size grows).'
  location: Related Work
  page: 18
  quote: Note, however, that [HNA+17] found super-linear scaling of dataset size with model size, whereas we ﬁnd a sub-linear scaling.

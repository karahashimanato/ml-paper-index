  notes: 'Selected for the topic article requested by the user (2026-10-03): classical algorithms (sorting, binary search, greedy) and machine learning; carded by a subagent. Results tables not recorded;
    claims only. PDF states: Proceedings of the 37th International Conference on Machine Learning (ICML 2020), PMLR 119. Objective: loss plus lambda times number of leaves (Eq. 1). All features are binarized
    prior to running the algorithm; continuous features get one split point between every pair of adjacent unique values (Section 2 and Section 4.5). Datasets (Appendix I.1): monk1-3, tic-tac-toe, balance
    scale, car evaluation, iris (UCI), FourClass (LIBSVM), COMPAS (N = 5,020), FICO, coupon (bar-7). Accuracy-vs-sparsity experiment: 5-fold CV; runs over the 5-minute limit are discarded; CART/BinOCT/DL8.5
    run with depth limits 1-6, OSDT/GOSDT with 29 regularization values; medians with 25th/75th percentiles. Appendix I.6 notes that if CART achieves an almost optimal training solution it tends to achieve
    high test accuracy as well, and that without methods like GOSDT/OSDT one could not tell whether CART is close to optimal. Scalability experiment (Appendix I.7): BinOCT never completed at max depth log2(32)
    within 5 minutes and was excluded. The paper notes BinOCT and DL8.5 use hard depth constraints whereas OSDT/GOSDT use soft (penalty) constraints. Early stopping returns an optimality gap (Discussion).
    Family tag greedy-methods not used because GOSDT itself is not greedy (it extracts the optimal tree from the dependency graph by greedily choosing the lowest-objective split after optimization). Results
    not recorded.'

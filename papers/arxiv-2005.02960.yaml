  notes: 'Selected for the topic article requested by the user (2026-10-03): algorithm design techniques (divide and conquer, dynamic programming, branch and bound, local search) and machine learning; carded
    by a subagent. Results tables not recorded; claims only. PDF states: UAI 2021. Baselines run from their open-source code; regularized evolution population size changed from 50 to 30, other baselines''
    hyperparameters unchanged; local search has two boolean hyperparameters and was not tuned (Appendix A). Local search variant differs by benchmark: query_until_lower on NASBench-101/301, continue_at_min
    on NASBench-201. Possible conflict of interest not stated as such in the text: the baseline BANANAS is by the same first and third authors (White, Neiswanger, Savani, AAAI 2021, per the reference list).
    Critiques/independent confirmation: the paper says a prior work (Wang et al., 2018) suggested local search performs poorly due to many local minima and killed runs at a local minimum instead of restarting;
    concurrent work (Ottelander et al., 2020) independently found local search a strong baseline on NASBench-101 for multi-objective NAS. Lemma 5.3 gives a closed form under uniform local/global distributions;
    the authors state that Theorem 5.1 and Lemma 5.2 hold without any assumptions on the local and global distributions (the fixed neighbourhood size, vertex-transitivity and neighbour-loss model still
    apply); Lemma B.3 additionally assumes n large relative to s. Corollary B.1 (Appendix B): with Gaussian noise on each architecture''s accuracy, the expected number of local minima is bounded in terms
    of the noise standard deviation. Budgets: all algorithms get 300 queries on tabular/surrogate benchmarks (matched by number of evaluations). Results are figures only; not recorded.'

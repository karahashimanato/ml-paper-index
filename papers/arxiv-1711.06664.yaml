  notes: 'Selected for the topic article requested by the user (2026-10-03): model fallback and model selection in MLOps (meta-learned selection, dynamic selection, abstention/deferral, switching triggers,
    cascades/routing, monitoring); carded by a subagent. Results tables not recorded; claims only. Affiliation: University of Toronto, Vector Institute. No surrogate-loss consistency guarantee is given
    (searched ''consisten''; the only matches concern ''inconsistent'' DMs); the formal result is the equivalence to rejection learning when the DM has constant loss. Measured quantities: accuracy, disparate
    impact (equalized-odds gap), deferral rate overall and per subgroup, and minimum subgroup accuracy. Models and DMs are fully connected two-layer networks (5 hidden units for COMPAS, 20 for Health),
    early stopping on a 20% validation split of training data (Appendix C). Mozannar & Sontag (arxiv-2006.01862, claim c3) later show that their multiclass extension of this mixture-of-experts style loss
    is not classification-consistent and (claim c4) that it learns never to defer in their CIFAR-10 setup. Tag note: no fairness tag exists in registry/tags.yaml. ''model-cascades'' is justified by the
    text: Section 2.1 states ''The decision-making ﬂow is modeled as a cascade, where the ﬁrst-step model can either predict (positive/negative) or say pass'', and the second stage may be a human or ''a
    proprietary black-box model''; it is an approximation in that the second stage is a fixed external DM, not a stronger model chosen for cost/quality. The paper draws inspiration from mixture-of-experts
    but the ''mixture-of-experts'' family tag was not added because only the model ''expert'' is learned.'

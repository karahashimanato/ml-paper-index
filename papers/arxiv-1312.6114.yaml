proposes:
- 'SGVB: a reparameterized, differentiable Monte Carlo estimator of the variational lower bound for models with continuous latent variables'
- 'AEVB: jointly learning a recognition model (probabilistic encoder) and a generative model (probabilistic decoder) with SGVB; with neural networks for both, the variational auto-encoder (VAE)'
claims:
- id: c1
  statement: 'Contribution: reparameterizing the variational lower bound gives a lower-bound estimator that can be optimized with standard stochastic gradient methods; for i.i.d. data with continuous per-datapoint
    latent variables, an approximate inference (recognition) model is fitted to the intractable posterior with this estimator.'
  location: Abstract
  page: 1
  quote: First, we show that a reparameterization of the variational lower bound yields a lower bound estimator that can be straightforwardly optimized using standard stochastic gradient methods.
- id: c2
  statement: 'Link to autoencoders: in the objective, the KL divergence of the approximate posterior from the prior acts as a regularizer and the second term is an expected negative reconstruction error.'
  location: Section 2.3
  page: 4
  quote: The ﬁrst term is (the KL divergence of the approximate posterior from the prior) acts as a regularizer, while the second term is a an expected negative reconstruction error.
- id: c3
  statement: Citing Bengio, Courville & Vincent [BCV13], the authors note that the reconstruction criterion alone is known not to be sufficient for learning useful representations, which motivated denoising,
    contractive and sparse autoencoder variants.
  location: Related work
  page: 6
  quote: However, it is well known that this reconstruction criterion is in itself not sufﬁcient for learning useful representations [BCV13].
- id: c4
  statement: In contrast to those regularized autoencoders, the regularization term in the SGVB objective is dictated by the variational bound, without the usual regularization hyperparameter.
  location: Related work
  page: 6
  quote: The SGVB objective contains a regularization term dictated by the variational bound (e.g. eq. (10)), lacking the usual nuisance regularization hyperparameter required to learn useful representations.
- id: c5
  statement: The diagonal-Gaussian approximate posterior used in the VAE example is described as a simplifying choice, not a limitation of the method.
  location: 'Example: Variational Auto-Encoder (footnote 2)'
  page: 5
  quote: Note that this is just a (simplifying) choice, and not a limitation of our method.
- id: c6
  statement: 'Evaluation setup: generative models of MNIST and Frey Face images are compared on the variational lower bound and on an estimated marginal likelihood, against the wake-sleep algorithm (same
    encoder) and, for marginal likelihood, Monte Carlo EM; the Adagrad step size was chosen from three values based on training-set performance in the first few iterations.'
  location: Experiments
  page: 7
  quote: the Adagrad global stepsize parameters were chosen from {0.01, 0.02, 0.1} based on performance on the training set in the ﬁrst few iterations.
- id: c7
  statement: The authors state (Figure 2 caption) that AEVB converged considerably faster than wake-sleep and reached a better lower bound in all experiments; the comparison is shown only as a figure.
  location: Figure 2
  page: 7
  quote: Our method converged considerably faster and reached a better solution in all experiments.
- id: c8
  statement: Adding superfluous latent variables did not cause overfitting in these experiments, which the authors attribute to the regularizing nature of the variational bound.
  location: Experiments
  page: 7
  quote: Interestingly, superﬂuous latent variables did not result in overﬁtting, which is explained by the regularizing nature of the variational bound.
- id: c9
  statement: 'Limitation of the evaluation: the marginal likelihood could only be estimated (by MCMC) for a 3-dimensional latent space, because for higher-dimensional latent spaces the estimates became
    unreliable.'
  location: Experiments
  page: 7
  quote: for higher dimensional latent space the estimates became unreliable.
- id: c10
  statement: 'Decomposition of the marginal likelihood (Eq. 1-2): for each datapoint, log p_theta(x) equals the KL divergence of the approximate posterior from the true posterior plus L(theta, phi; x);
    since the KL divergence is non-negative, L is a (variational) lower bound on the marginal log-likelihood.'
  location: Section 2.2
  page: 3
  quote: The ﬁrst RHS term is the KL divergence of the approximate from the true posterior.
- id: c11
  statement: 'Reparameterization in the univariate Gaussian case: if z ~ N(mu, sigma^2), a valid reparameterization is z = mu + sigma * epsilon with an auxiliary noise variable epsilon ~ N(0, 1), so expectations
    over z can be written as expectations over epsilon and estimated by Monte Carlo in a way that is differentiable in the variational parameters.'
  location: Section 2.4
  page: 5
  quote: 'Take, for example, the univariate Gaussian case: let z ∼p(z|x) = N(µ, σ2).'
- id: c12
  statement: 'Closed-form KL in the VAE example (Eq. 10): with a standard Gaussian prior p(z) = N(0, I) and a diagonal Gaussian approximate posterior with mean mu and standard deviation sigma output by
    the encoder, the KL term can be computed and differentiated without estimation, giving the estimator (1/2) sum_j (1 + log sigma_j^2 - mu_j^2 - sigma_j^2) + (1/L) sum_l log p_theta(x | z^(l)) with z^(l)
    = mu + sigma ⊙ epsilon^(l).'
  location: 'Example: Variational Auto-Encoder'
  page: 5
  quote: where the KL divergence can be computed and differentiated without estimation

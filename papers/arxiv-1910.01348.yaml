proposes:
- 'Early-stopped knowledge distillation (ESKD): use the KD loss only early in student training and then train on the cross-entropy loss alone for the rest of training'
- 'Early-stopped teachers: regularize a large teacher by stopping its training early (a third to a fourth of the usual epochs) so that its solution is more reachable by a small student'
claims:
- id: c1
  statement: The authors report that larger models often do not make better teachers, attribute this to mismatched capacity (small students are unable to mimic large teachers), find typical workarounds
    such as a sequence of distillation steps ineffective, and show the effect can be mitigated by stopping the teacher's training early.
  location: Abstract
  page: 1
  quote: We ﬁnd crucially that larger models do not often make better teachers.
- id: c2
  statement: 'Background (following Hinton et al.): teacher scores are softened with temperature tau > 1 because trained networks produce peaky distributions that may be less informative; the student loss
    is L = alpha * L_cls + (1 - alpha) * L_KD with L_KD = -tau^2 * sum_k p~t_k log p~s_k; the authors cite tau in {3, 4, 5} and alpha = 0.9 as popular choices. No explanation of the tau^2 factor is given
    in this section.'
  location: Section 3
  page: 2
  quote: Trained neural networks produce peaky probability distributions, which may be less informative.
- id: c3
  statement: 'Setup: on CIFAR10 each model is trained for 200 epochs with SGD (momentum 0.9, initial learning rate 0.1, dropped by 0.2 every 60 epochs) with standard augmentation; KD hyperparameters are
    set consistent with the popular choice (tau = 4, alpha = 0.9, beta = 1000 for attention transfer); each experiment is repeated 5 times. ImageNet experiments closely follow Zagoruyko et al. with the
    same tau and alpha.'
  location: Section 4
  page: 3
  quote: The same experiment was repeated 5 times and median, mean, and standard deviation are reported.
- id: c4
  statement: On CIFAR10, student accuracy rises and then falls as the teacher grows (in depth or width) even though teacher accuracy keeps rising; on ImageNet with a ResNet18 student and ResNet18/34/50/152
    teachers, larger and more accurate teachers give less accurate students. The hypothesis that confident teachers approach one-hot labels was rejected because softening with a high temperature did not
    change this result.
  location: Section 5.1
  page: 3
  quote: As can be seen, as the teacher becomes larger and more accurate, the student becomes less accurate.
- id: c5
  statement: The KD error (fraction of examples where student and teacher predictions differ, CIFAR) and KD loss (ImageNet) are much higher for the largest teacher, which leads to the least accurate student;
    the authors posit that, due to much lower capacity, the student cannot find a solution in its space that corresponds well to the largest teacher.
  location: Section 5.2
  page: 4
  quote: This suggests that the student is unable to mimic large teachers
- id: c6
  statement: On ImageNet all teachers gave lower student accuracy than training from scratch under full KD. Comparing training curves, KD improves validation accuracy initially but hurts it towards the
    end; hypothesizing that the student underfits and trades the cross-entropy loss against the KD loss, the authors stop KD early (ESKD), which is better than full KD for all three teachers, but larger
    teachers still do not give more accurate students.
  location: Section 5.3
  page: 4
  quote: it begins to hurt accuracy towards the end of training.
- id: c7
  statement: 'Sequential (repeated) distillation is not a fix: on CIFAR the last student of a 5-generation sequence underperforms a scratch-trained student for some models (ResNet8, ResNet14), an ensemble
    of the sequence does not beat an equal-size ensemble trained from scratch, a teacher trained by 5 KD iterations is more accurate but not a better teacher, and large -> medium -> small distillation performs
    almost the same as large -> small; sequential distillation is also reported ineffective on ImageNet.'
  location: Section 5.4
  page: 5
  quote: Sequential distillation cannot help make large models better teachers.
- id: c8
  statement: Since grid search over teacher architectures is too expensive, the authors propose stopping the large teacher's training early (citing evidence that a large network trained for few epochs behaves
    like a small one); on CIFAR10 with teachers trained for n in {35, 50, 65, 80} total epochs, all early-stopped teachers produce better students than the optimal fully-trained teacher for both students.
  location: Section 5.5
  page: 7
  quote: Notice that for both student models (WRN16-1 and WRN28-1), all early-stopped teachers produce better students than the optimal fully-trained teacher (WRN16-3 and WRN28-3).

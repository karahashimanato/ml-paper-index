  notes: 'Selected for the method article requested by the user (2026-10-11): aligning language models with human preferences (preference comparisons and reward models, PPO-based RLHF with a KL penalty,
    AI feedback, direct preference optimization and its variants, reward overoptimization, length bias, reward-model evaluation, and open problems). Carded by a subagent. Results tables not recorded; claims
    only. Affiliation: Anthropic (all authors). Conflict of interest: the authors evaluate Anthropic''s own models and compare against their own earlier HH RLHF models and PM data (Bai et al. 2022, arxiv-2204.05862);
    the principles were chosen by the authors ''in a fairly ad hoc and iterative way for research purposes'' (footnote 2). No venue recorded: the arXiv v1 PDF and arXiv record state none. Section numbers
    from cross-references in the PDF (3.2, 3.3, 3.5, 4.1, 4.3, 4.4); others by name. Comparison tests for this paper were done by Surge AI workers, while the PM data came from the earlier Upwork/MTurk period
    (Section 4.4); 10,274 helpfulness and 8,135 comparisons were collected for AB testing 24 snapshots (Section 3.3). The absolute harmfulness score (a model trained with L2 loss on 0-4 worker ratings)
    may not be well calibrated, as the authors caveat. Preference-model scores of later revisions ''should be taken with a grain of salt'' because PM scores are less calibrated at higher values (Section
    3.4 region, citing Bai et al. 2022). In Section 2 the authors evaluate LMs as judges on 438 HHH comparisons (221 earlier + 217 new); results are in figures and not recorded.'

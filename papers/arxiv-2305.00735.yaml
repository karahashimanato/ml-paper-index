  notes: 'Selected for the topic article requested by the user (2026-10-06): anomaly detection, classical vs deep (benchmarks, isolation-based methods, self-supervised and one-class deep methods, industrial
    image anomaly detection). Carded by a subagent. Results tables not recorded; claims only. Affiliations: Radboud University and Eindhoven University of Technology. Venue from the arXiv journal_ref given
    by the caller (the v1 PDF shows only ''©2023 Bouman, Bukhsh, and Heskes. License: CC-BY 4.0'', no journal header). Same first author as arxiv-2501.13864. Purely unsupervised (transductive) evaluation
    on real anomalies; no synthetic datasets. Hyperparameter grids per method in Table 1 (e.g. IF 1000 trees with 128-1024 samples; kNN/LOF k = 5..30; AE/VAE/DeepSVDD 1-3 layers with shrinkage factors).
    The text gives two different significance levels for kNN on local datasets: Section 4.3 says kNN and ABOD ''significantly outperform 16 other methods at p = 0.05'', while the Conclusion says kNN ''outperforms
    16 out of 32 methods at p = 0.10''. The paper describes ADBench (Han et al., 2022) as subsampling to 10,000 samples and generating anomalies synthetically; ADBench''s own main text was not found to
    state the subsampling, and it evaluates real anomalies on its 47 datasets with synthetic anomalies only in the anomaly-type experiments (not verified further). Conflict of interest: the authors contributed
    code to PyOD (the library of 27 of the 32 implementations) and implemented ODIN themselves; they are not authors of the benchmarked methods as far as the text shows. Ensembles (meta-techniques) were
    deliberately not covered. Results tables not recorded.'

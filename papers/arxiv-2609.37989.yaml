claims:
- id: c1
  statement: TabFM-Auto pairs the TabFM foundation model with a language-model agent that evolves the data pipeline around it.
  location: Abstract
  page: 1
  quote: We introduce TabFM-Auto, which pairs a tabular foundation model, TabFM, with a language model agent that evolves the data pipeline around it.
- id: c2
  statement: On all 51 TabArena datasets, five TabFM-Auto configurations take the top five overall positions.
  location: Abstract
  page: 1
  quote: Across all 51 datasets of the TabArena benchmark, five TabFM-Auto configurations with different agents and language models take the top five overall positions, and the best raises TabFM from 1785
    to 2013 Elo.
- id: c3
  statement: Pipeline search runs once per dataset with 3-fold cross-validation on fold 0's training set (up to 96 evaluations or 6 hours), withholding evaluation labels; the frozen pipeline is then evaluated
    on all folds.
  location: Experimental setup
  page: 5
  quote: Thus, we run pipeline search once per dataset using 3-fold cross-validation on the training set of fold 0 (up to 96 evaluations or 6 hours on one H100 GPU), allowing both inductive and transductive
    features while withholding evaluation labels.
- id: c4
  statement: The paper also reports a leaderboard on fold 0's held-out test split alone, where TabFM-Auto still holds the top overall, classification and regression ratings.
  location: Results
  page: 8
  quote: 'On the held-out test split of fold 0 alone (Table 5), TabFM-Auto also holds the #1 Overall, Classification, and Regression Elo ratings (Appendix B.1).'
- id: c5
  statement: Candidate pipelines run in a sandbox without outbound network access and with restricted writes.
  location: Appendix
  page: 16
  quote: The harness runs every candidate pipeline in an unprivileged bubblewrap Linux namespace sandbox that disables outbound network access, mounts system libraries read-only, and restricts writes to
    an ephemeral scratch directory.
- id: c6
  statement: Gains are generally smaller on anonymized tables, and pipeline search needs repeated validation evaluations per dataset.
  location: Conclusion
  page: 11
  quote: Gains are generally smaller on anonymized tables, where the agent relies on statistical and relational features, and pipeline search requires repeated validation evaluations for each dataset.

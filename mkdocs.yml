site_name: ml-paper-index
site_description: 論文を一次情報とした機械学習アルゴリズムの研究動向・比較インデックス
site_url: https://karahashimanato.github.io/ml-paper-index/
repo_url: https://github.com/karahashimanato/ml-paper-index
docs_dir: site_src
theme:
  name: material
  language: ja
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tooltips
plugins:
  - search:
      lang: [ja, en]
extra_css:
  - assets/citation-cards.css
extra_javascript:
  - assets/citation-cards.js
markdown_extensions:
  - tables
  - toc:
      permalink: true
nav:
  - ホーム: index.md
  - 課題別の記事:
      - 表データ (GBDT・深層学習・基盤モデル): articles/tasks/tabular-gbdt-vs-deep-learning.md
      - ドリフト検出: articles/tasks/drift-detection.md
      - 時系列の異常検知: articles/tasks/time-series-anomaly-detection.md
  - 手法の記事:
      - 表データ基盤モデル (TabPFN 系): articles/methods/tabular-foundation-models.md
  - 横断記事:
      - モデルと評価方法の弱点と改善: articles/topics/weaknesses-and-fixes.md
      - モデルの解釈可能性: articles/topics/model-interpretability.md
      - 量子化による影響: articles/topics/quantization-effects.md
      - 時系列基盤モデルと時系列予測: articles/topics/time-series-foundation-models.md
  - 索引と論文ページ:
      - 索引: generated/index.md
      - 未反映カード: generated/stale.md

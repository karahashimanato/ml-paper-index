claims:
- id: c1
  statement: Most streaming anomaly detection methods come from streaming outlier detection and ignore core characteristics of time-series anomalies; they are evaluated on synthetic or small benchmarks.
  location: Abstract
  page: 1
  quote: most of these approaches originate from the streaming outlier detection litera- ture and largely ignore core characteristics of time series anomalies.
- id: c2
  statement: Contrary to common assumptions, static TSAD methods significantly outperform streaming approaches in most streaming settings.
  location: Abstract
  page: 1
  quote: Our results show that, contrary to common assumptions, static TSAD methods significantly outperform streaming approaches in most streaming settings.
- id: c3
  statement: AUC-ROC is overly optimistic on imbalanced data, so AUC-PR is used.
  location: Evaluation measures
  page: 6
  quote: Consequently, the Area Under the Precision- Recall Curve (AUC-PR) is preferred in this study.
- id: c4
  statement: The main limitation of streaming TSAD is its focus on point-wise outliers rather than collective anomalies.
  location: Conclusion
  page: 9
  quote: The most significant limitation is the legacy focus on point-wise outliers.

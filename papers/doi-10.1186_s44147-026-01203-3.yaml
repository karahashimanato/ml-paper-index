claims:
- id: c1
  statement: The study develops an interpretable TabPFN-based framework for preliminary prediction of unconfined compressive strength of stabilized soft soils from the Mekong Delta.
  location: Abstract
  page: 1
  quote: This study develops an interpretable Tabular Prior-data Fitted Network (TabPFN)-based framework for preliminary UCS prediction of stabilized soft soils from the Mekong Delta, Vietnam.
- id: c2
  statement: TabPFN is used with its default configuration and compared with SVR, k-nearest neighbors, Random Forest and CatBoost, each tuned with GridSearchCV.
  location: Abstract
  page: 1
  quote: 'TabPFN was applied using its default configuration and compared with four GridSearchCV-optimized models: support vector regression, k-nearest neighbors, Random Forest, and CatBoost.'
- id: c3
  statement: Evaluation uses an 80/20 train-test split plus five-fold cross-validation on the development part; the dataset has 168 observations with seven predictors.
  location: Abstract
  page: 1
  quote: Performance was assessed using an 80/20 train–test split and five-fold cross-validation, while SHAP and partial dependence plots were used for interpretation.
- id: c4
  statement: Grid search for the baselines minimizes RMSE within the development subset using five-fold cross-validation with fold assignments shared across models.
  location: Methodology
  page: 10
  quote: RMSE was used as the optimization criterion because it penalizes larger prediction errors more strongly, while final model assessment incorporated multiple complementary regression metrics.
- id: c5
  statement: TabPFN had the strongest observed test performance among the five models evaluated.
  location: Abstract
  page: 1
  quote: TabPFN achieved the strongest observed test performance among the five evaluated models
- id: c6
  statement: The 34-observation hold-out test set comes from the same experimental database, so it is not independent external validation.
  location: Discussion
  page: 22
  quote: Although the independent test subset was excluded from all model development and contained 34 observations reserved for final evaluation, these observations were drawn from the same experimental
    database and therefore do not constitute independent external validation.

# タグの統制語彙。カード・記事はここに登録されたIDしか使えない(表記揺れ防止、Q7と同じ考え方)。
# 追加は「既存タグで表せないか」を確認してから行う。パイロット(表データ)に必要な最小限から始める。
tasks:
  - id: tabular-classification
    description: Classification on tabular (heterogeneous-column) data.
  - id: tabular-regression
    description: Regression on tabular (heterogeneous-column) data.
  - id: time-series-forecasting
    description: Forecasting future values of time series.
  - id: causal-effect-estimation
    description: Estimating causal / treatment effects from data.
  - id: graph-node-prediction
    description: Node-level classification or regression on graphs.
  - id: drift-detection
    description: Detecting that the data distribution or the input-output relationship has changed over time (MLOps monitoring).
  - id: concept-drift-detection
    description: Detecting changes in P(y|X) or the joint distribution in data streams, often from the model's error signal.
    parent: drift-detection
  - id: time-series-anomaly-detection
    description: Detecting anomalous points or segments in univariate or multivariate time series.
  - id: dataset-shift-detection
    description: Detecting distribution shift between training and deployment data (covariate, label, or general shift), typically with statistical tests.
    parent: drift-detection

  - id: change-point-detection
    description: Offline / retrospective detection of the locations where a sequence's distribution changes.
    parent: drift-detection
  - id: stream-classification
    description: Supervised learning on data streams that must keep accuracy under drift (adaptation rather than detection).
  - id: time-series-classification
    description: Classifying whole time series or windows.
  - id: tabular-data-generation
    description: Generating synthetic tabular data (evaluated e.g. by fidelity or train-on-synthetic-test-on-real).
  - id: tabular-imputation
    description: Filling in missing values of tabular data.
  - id: model-explanation
    description: Explaining or interpreting a model's predictions (local or global), and evaluating whether explanations are faithful.
  - id: model-compression
    description: Reducing a model's memory or compute (quantization, pruning, distillation) and measuring what changes in its behaviour.
  - id: scaling-laws
    description: How performance changes with parameter count, data size and compute, and how to allocate compute optimally.
  - id: efficiency-evaluation
    description: Measuring and reporting the training / inference cost of models (FLOPs, time, energy, memory).
  - id: language-modeling
    description: Training and evaluating language models.
  - id: image-classification
    description: Image classification.
  - id: learned-indexes
    description: Replacing index structures (B-trees, binary search over sorted data) with models that predict a key's position.
  - id: learning-augmented-algorithms
    description: Classical algorithms and data structures that use ML predictions, judged by performance with good predictions and worst-case guarantees with bad ones.
  - id: algorithm-learning
    description: Training neural networks to execute or imitate classical algorithms (sorting, search, graph algorithms) and testing generalization to larger inputs.
  - id: data-subset-selection
    description: Selecting a subset of training data (coresets, greedy submodular maximization, data pruning).
  - id: combinatorial-optimization
    description: Solving, or speeding up solvers for, combinatorial optimization problems (TSP, vehicle routing, maximum independent set, mixed integer programs).
  - id: neural-architecture-search
    description: Automatically searching for neural network architectures.
  - id: structured-prediction
    description: Predicting structured outputs such as label sequences, alignments or trees (e.g. sequence labelling, time-series alignment).
  - id: model-selection
    description: Choosing which model or algorithm to use (algorithm selection, meta-learned selection, routing between models).
  - id: selective-prediction
    description: Abstaining from or deferring a prediction (classification with a reject option, learning to defer).
  - id: mlops
    description: Monitoring, deploying and managing models in production.
  - id: representation-learning
    description: Learning features or latent representations without labels (including disentangled representations).
  - id: generative-modeling
    description: Learning a data distribution to generate samples or evaluate likelihoods.
  - id: anomaly-detection
    description: Detecting anomalous or out-of-distribution inputs in non-time-series data (e.g. images, tabular records).
  - id: uncertainty-estimation
    description: Producing predictive distributions or uncertainty estimates (probabilistic prediction, separating data and knowledge uncertainty), beyond point predictions.
method_families:
  - id: tree-ensembles
    description: Ensembles of decision trees.
  - id: gradient-boosted-trees
    description: Gradient-boosted decision trees (e.g. XGBoost, LightGBM, CatBoost).
    parent: tree-ensembles
  - id: random-forests
    description: Bagged / randomized decision-tree ensembles.
    parent: tree-ensembles
  - id: deep-learning
    description: Neural-network-based methods.
  - id: tabular-mlp
    description: MLP / ResNet-style networks for tabular data.
    parent: deep-learning
  - id: tabular-attention
    description: Attention-based architectures for tabular data (Transformers, TabNet-style attentive feature selection).
    parent: deep-learning
  - id: differentiable-trees
    description: Neural models built from soft/differentiable decision trees (e.g. NODE).
    parent: deep-learning
  - id: tabular-cnn
    description: Convolutional networks applied to tabular features.
    parent: deep-learning
  - id: tabular-foundation-model
    description: Models pretrained across many tables and applied to new tables (e.g. via in-context learning).
    parent: deep-learning
  - id: time-series-foundation-model
    description: Models pre-trained on many time series and applied to new series (zero/few-shot or fine-tuned).
    parent: deep-learning
  - id: heterogeneous-ensembles
    description: Ensembles combining different model types (e.g. averaging deep models with GBDT).
  - id: automl-systems
    description: AutoML systems that search over and ensemble many model types (e.g. AutoGluon, Auto-sklearn).
  - id: error-rate-drift-detectors
    description: Drift detectors monitoring a learner's error rate or performance (e.g. DDM, EDDM, HDDM, Page-Hinkley on errors).
  - id: window-based-drift-detectors
    description: Drift detectors comparing data or statistics between (adaptive) windows (e.g. ADWIN, KSWIN).
  - id: two-sample-tests
    description: Statistical two-sample tests for distribution shift (e.g. Kolmogorov-Smirnov, MMD, chi-squared).
  - id: dimensionality-reduction-for-shift
    description: Reducing representations (e.g. PCA, autoencoders, black-box predictor softmax) before testing for shift.
  - id: reconstruction-based-detectors
    description: Anomaly detectors scoring by reconstruction error (e.g. autoencoders, VAEs).
  - id: forecasting-based-detectors
    description: Anomaly detectors scoring by prediction/forecast error.
  - id: classical-outlier-detectors
    description: Non-deep outlier detectors (e.g. Isolation Forest, LOF, OC-SVM, PCA, distance/discord-based methods).
  - id: linear-models
    description: Linear / generalized linear models.

  - id: feature-attribution
    description: Post-hoc methods that assign each input feature a contribution to a prediction (e.g. SHAP, LIME, Integrated Gradients).
  - id: saliency-maps
    description: Gradient- or perturbation-based attribution maps over inputs of deep networks.
    parent: feature-attribution
  - id: attention-explanations
    description: Using attention weights as explanations of model decisions.
  - id: interpretable-models
    description: Models whose structure is itself interpretable (e.g. GAMs, Neural Additive Models, sparse linear models, rule lists).
  - id: quantization
    description: Representing weights and/or activations with fewer bits.
  - id: post-training-quantization
    description: Quantizing a trained model without (or with little) retraining, typically with a small calibration set.
    parent: quantization
  - id: quantization-aware-training
    description: Training or fine-tuning with simulated quantization so that the model adapts to low precision.
    parent: quantization
  - id: pruning
    description: Removing weights, neurons, heads or layers from a trained model.
  - id: knowledge-distillation
    description: Training a smaller student model to imitate a larger teacher model.
  - id: large-language-models
    description: Large pretrained (generative) language models.
  - id: gaussian-processes
    description: Gaussian process models.
  - id: kernel-methods
    description: Kernel machines such as SVM / SVR.
  - id: graph-neural-networks
    description: Neural networks operating on graphs (e.g. GCN, GraphSAGE).
  - id: imbalance-resampling
    description: Over- or under-sampling methods for class imbalance (e.g. SMOTE).
  - id: efficient-attention
    description: Attention mechanisms that reduce compute or memory (e.g. FlashAttention, linear / sparse attention).
  - id: mixture-of-experts
    description: Sparse models that route each input to a subset of the parameters (experts).
  - id: state-space-models
    description: State space sequence models such as S4 and Mamba.
  - id: differentiable-sorting
    description: Continuous relaxations of sorting and ranking that make them usable with gradient-based learning.
  - id: decision-trees
    description: Single decision trees, whether grown greedily (e.g. CART) or optimized globally.
  - id: greedy-methods
    description: Methods based on greedy choices (greedy tree splitting, greedy decoding, greedy subset selection).
  - id: online-algorithms
    description: Algorithms that decide without knowing future input, analysed by competitive ratio or consistency / robustness (caching, ski rental, scheduling, prediction-augmented sorting and search trees).
  - id: divide-and-conquer
    description: Splitting the problem or the data, solving the parts, and combining the results.
  - id: dynamic-programming
    description: Dynamic programming (reusing solutions of subproblems) and its differentiable relaxations.
  - id: branch-and-bound
    description: Branch and bound and exact optimization built on it (including mixed integer programming solvers).
  - id: local-search
    description: Local and neighbourhood search (e.g. 2-opt, large neighbourhood search).
  - id: dynamic-ensemble-selection
    description: Ensembles that choose which models to use for each input.
  - id: model-cascades
    description: Trying cheaper models first and passing inputs to stronger models when needed, and routing queries between models.
  - id: autoencoders
    description: Encoder-decoder networks trained to reconstruct their input (e.g. denoising, sparse, contractive, adversarial, Wasserstein autoencoders).
  - id: variational-autoencoders
    description: Autoencoders trained as latent-variable models with variational inference (e.g. VAE, IWAE, beta-VAE, VQ-VAE, hierarchical VAEs).
    parent: autoencoders
  - id: diffusion-models
    description: Generative models that learn to reverse a gradual noising process (denoising diffusion, score-based models, and their samplers and distillations).
paradigms:
  - id: supervised
    description: Supervised learning.
  - id: unsupervised
    description: Learning without labels.
  - id: streaming
    description: Online learning / processing of data streams.
  - id: in-context-learning
    description: Prediction by conditioning a pretrained model on training examples without gradient updates.
  - id: self-supervised
    description: Learning representations from unlabeled data with pretext tasks.
  - id: post-hoc
    description: Applied to an already trained model without changing it.
  - id: reinforcement-learning
    description: Reinforcement learning.
  - id: meta-learning
    description: Learning from experience on previous tasks or datasets how to select or adapt models.

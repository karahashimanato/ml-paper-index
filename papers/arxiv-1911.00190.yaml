proposes:
- 'A degrees-of-freedom explanation of random forest success: the mtry randomization acts as implicit regularization, most useful at low signal-to-noise ratio'
- Randomized forward selection (RandFS) and bagged forward selection (BaggFS) as linear-model analogues of random forests and bagging
claims:
- id: c1
  statement: 'Main thesis: the extra randomness injected into individual trees acts as implicit regularization, which the authors say makes random forests an ideal model in low signal-to-noise ratio (SNR)
    settings; from a model-complexity view, mtry plays a role similar to the shrinkage penalty in lasso and ridge regression.'
  location: Abstract
  page: 1
  quote: the additional randomness injected into individual trees serves as a form of implicit regularization, making random forests an ideal model in low signal-to-noise ratio (SNR) settings
- id: c2
  statement: 'Critique of the interpolation explanation (Wyner et al. 2017) for regression: regression forests average rather than vote, and each bootstrap sample omits about 36.8% of observations on average,
    so a forest of fully grown trees is a weighted average of a training point''s response and other responses and will not interpolate with exceedingly high probability.'
  location: Section 2.3
  page: 8
  quote: and hence with exceedingly high probability, the random forest will not interpolate.
- id: c3
  statement: 'Further critique: Wyner et al. seem to largely ignore the role of randomness, and their explanation would seem to apply equally well to bagging; the authors also take issue with the popular
    view that random forests simply ''are better'' than bagging, calling it not a universal truth.'
  location: Section 2.3
  page: 8
  quote: The explanation the authors provide for random forest success would seem to apply equally well to bagging.
- id: c4
  statement: 'Degrees-of-freedom evidence: Monte Carlo estimates (500 trials, randomForest defaults except mtry and maxnodes, SNR 3.52, linear and MARSadd models) show that at every fixed maxnodes the estimated
    dof increases with mtry, so bagging (mtry = 1) always has more dof than the default regression forest (mtry = 0.33); the authors report nearly identical findings at SNR 0.09 (Appendix A).'
  location: Section 3
  page: 13
  quote: More importantly for our purposes, in each plot in Figure 3 we see that at every ﬁxed level of maxnodes, the dof increases with mtry.
- id: c5
  statement: 'Random forest vs bagging across SNR (simulations, 500 repetitions, test MSE on 1000 independent points): the advantage of random forests (mtry = 0.33) over bagging shrinks as SNR increases
    and bagging eventually wins at large SNR; the authors conclude that the view that random forests simply ''are better'' than bagging seems largely unfounded and that the optimal mtry seems to depend
    on SNR. The same pattern is reported on 15 real regression datasets with noise injected into the response (Section 4.3).'
  location: Section 4.1
  page: 14
  quote: Given these results, the conventional wisdom that random forests simply “are better” than bagging seems largely unfounded; rather, the optimal value of mtry seems to be a function of the SNR.
- id: c6
  statement: 'Randomized forward selection: in linear-model settings taken from Hastie et al. (2017), with tuning parameters chosen on an independent validation set of size n, even untuned RandFS with mtry
    = 0.33 outperformed the lasso across all SNRs in the low and medium settings; in the high-dimensional settings the explicit regularizers (lasso, relaxed lasso) performed well.'
  location: Section 5.2
  page: 22
  quote: Even more remarkable is the performance of RandFS when mtry = 0.33 and is not tuned – in both the low and medium settings, even this default RandFS outperforms the lasso across all SNRs.
- id: c7
  statement: 'Theory (simplified model, not trees): for linear regression with n > p and an orthogonal design, averaging OLS fits on uniformly random subsets of m < p features converges, as the number of
    models grows, to the OLS estimate shrunk by m/p (stated as equivalent to ridge with penalty (p-m)/m); a related expectation result is given when observations are also subsampled. The authors say the
    same kind of effect is likely present in random forests, without proving it for trees.'
  location: Section 5.3
  page: 24
  quote: Under the data setup given above, assume that n > p and the design matrix X is orthogonal.
- id: c8
  statement: 'Practical guidance: the authors suggest mtry can be thought of as controlling the amount of shrinkage and is best tuned in practice, while noting that the default mtry = 0.33, though not always
    optimal, generally performs quite well and seems as good a starting point as any.'
  location: Section 6
  page: 27
  quote: Just as with explicit regularization procedures, the results above suggest that the mtry parameter in random forests can be thought of as controlling the amount of shrinkage and regularization
    and thus is best tuned in practice.
- id: c9
  statement: 'Proposed answer to why random forests work well on real data: in the authors'' view many real datasets are simply quite noisy; citing Hastie et al. (2017), they note that SNRs as large as
    5 or 6 are argued to be extremely rare on real data, which would explain why forests are often seen as superior to bagging.'
  location: Section 6
  page: 27
  quote: In our view, the clear answer is that in practice, many datasets simply are quite noisy.

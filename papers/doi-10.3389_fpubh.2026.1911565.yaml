claims:
- id: c1
  statement: A nested explainable machine-learning framework on TALIS 2024 teacher data tests whether AI-related measures add predictive information.
  location: Abstract
  page: 1
  quote: A nested explainable machine-learning framework was developed using TALIS 2024 teacher data to test the incremental predictive information supplied by AI-related measures.
- id: c2
  statement: Baseline and AI-added regularized LightGBM models are compared with country-by-school grouped validation and early stopping.
  location: Abstract
  page: 1
  quote: Matched baseline and AI-added regularized LightGBM models were compared using country-by-school grouped validation and early stopping.
- id: c3
  statement: Paired bootstrap intervals show the AI-added model's gains are statistically stable but practically modest.
  location: Abstract
  page: 1
  quote: Paired bootstrap intervals indicated statistically stable, but practically modest, gains
- id: c4
  statement: A descriptive common-split comparison covers L2 logistic regression, random forest, extra-trees, LightGBM, XGBoost and CatBoost.
  location: Section 4.1
  page: 7
  quote: The compared methods were L2-penalized logistic regression, random forest, extra-trees, LightGBM, XGBoost, and CatBoost.
- id: c5
  statement: Hyperparameter budgets were not fully equalized across algorithms, so the comparison is described as descriptive rather than evidence of universal algorithm superiority.
  location: Section 4.1
  page: 7
  quote: Hyperparameter budgets were not exhaustively equalized, so the comparison is descriptive rather than evidence of universal algorithm superiority.
- id: c6
  statement: All focal variables come from one time point, so temporal order and causality cannot be established.
  location: Limitations
  page: 12
  quote: First, all focal variables were measured at one time point, so temporal ordering and causality cannot be established; reverse associations and common-method bias are plausible.

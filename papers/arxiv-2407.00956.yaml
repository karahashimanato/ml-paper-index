proposes:
- 'Talent: a collection of 300 common-size tabular datasets (120 binary, 80 multi-class, 100 regression) from UCI, OpenML and Kaggle, with a 45-dataset core subset (Talent-tiny) and a Talent-extension suite
  for high-dimensional, many-class and very large-scale settings'
- A heterogeneity analysis that selects dataset meta-features by how well they help forecast later validation curves of deep tabular models from early training signals, and relates them to the tree-vs-DNN
  performance gap
claims:
- id: c1
  statement: 'Benchmark composition: datasets from UCI, OpenML and Kaggle, filtered by excluding N < 500 or d < 5, > 20% missing values, trivially easy or majority-dominated classification sets, and duplicates;
    categorical features are ordinally encoded; 22 mis-specified regression datasets with two unique targets were relabelled as binary classification.'
  location: Section 4.2
  page: 11
  quote: Ultimately, Talent consists of 120 binary-classification, 80 multi-class, and 100 regression datasets, offering both breadth and depth for evaluating tabular learning.
- id: c2
  statement: 'Known data-quality issues are deliberately retained in the general benchmark: 13 datasets with potential leakage (kept for comparability with prior work and to assess robustness to imperfect
    data) and 25 datasets whose features are extracted from images or audio; all datasets with identified leakage are excluded from Talent-tiny.'
  location: Section 4.2
  page: 11
  quote: In our collection, we identify 13 datasets with potential leakage.
- id: c3
  statement: 'Protocol: each dataset is randomly split 64%/16%/20% into train/val/test (a single fixed hold-out, following Gorishniy et al.); hyperparameters are chosen on validation with Optuna using a
    fixed budget of 100 trials per method-dataset pair; the best configuration is retrained with 15 random seeds and the mean is reported. Full K-fold CV is described as computationally prohibitive at this
    scale.'
  location: Section 4.3
  page: 14
  quote: We use Optuna (Akiba et al., 2019) with a fixed budget of 100 trials per method–dataset pair.
- id: c4
  statement: Unlike the tuned models, pretrained tabular (foundation) models are evaluated from their latest public checkpoints with default inference hyperparameters, without per-dataset tuning; all deep
    methods use AdamW with batch size 1024 unless noted otherwise, and CatBoost receives the feature types for native categorical handling.
  location: Section 4.3
  page: 14
  quote: Pretrained tabular models are evaluated from their latest public checkpoints with default inference hyperparameters (i.e., no per-dataset tuning).
- id: c5
  statement: 'Summary observations over 40 methods and 300 datasets: tree-based ensembles (CatBoost, LightGBM, XGBoost) remain strong, reliable and statistically robust baselines, while pretrained foundation
    models (TabPFN v2, TabICL) deliver state-of-the-art performance across many datasets and significantly narrow, but do not entirely close, the gap between tree-based and DNN-based paradigms.'
  location: Section 5.1
  page: 19
  quote: Tree-based ensembles (CatBoost, LightGBM, XGBoost) remain strong, reliable, and statistically robust baselines.
- id: c6
  statement: Foundation models, ensembles and the top DNNs (RealMLP, ModernNCA) often remain statistically tied, which the authors say suggests universal superiority has not yet been achieved; in the same
    paragraph they note that scalability and computational cost remain open challenges for foundation models.
  location: Section 5.1
  page: 19
  quote: Despite these advances, the Wilcoxon–Holm tests show that foundation models, ensembles, and top DNNs (RealMLP, ModernNCA) often remain statistically tied, suggesting that universal superiority
    has not yet been achieved.
- id: c7
  statement: Tree-mimic networks (NODE, TabNet) generally underperform relative to ensembles, whereas neighborhood-based models such as ModernNCA are often statistically comparable to CatBoost and LightGBM;
    ensembling within deep methods (TabM over MLP, MNCA-ens over ModernNCA) further improves performance.
  location: Section 5.1
  page: 19
  quote: Tree-mimic networks such as NODE and TabNet generally underperform relative to ensembles.
- id: c8
  statement: 'Tree-DNN gap and heterogeneity: the per-dataset rank gap between tree-based methods (RF, XGBoost, LightGBM, CatBoost) and representative DNNs (RealMLP, TabM, ModernNCA, FT-Transformer) correlates
    most strongly (negatively) with feature-heterogeneity meta-features such as entropy_std (-0.3333), while inst_to_attr (emphasized by McElfresh et al., 2023) correlates more weakly with the gap; the
    authors say datasets with greater feature heterogeneity tend to favor tree-based methods, likely due to successive partitioning.'
  location: Section 6.5
  page: 35
  quote: These findings suggest that the degree of heterogeneity among dataset features is a more critical determinant driving the relative model superiority.
- id: c9
  statement: 'By feature type: raw-feature DNNs such as MLP and RealMLP do worst on datasets with mixed numerical and categorical features and better on purely numerical or purely categorical ones; tree-based
    methods excel on heterogeneous datasets; FT-Transformer behaves more like the tree-based models, which the authors attribute (''likely'') to its learned embeddings of categorical and numerical features;
    TabPFN v2 is weakest on purely categorical datasets.'
  location: Section 6.6
  page: 36
  quote: DNN-based methods such as MLP and RealMLP exhibit their worst performance on datasets with mixed feature types (Mixed Data).

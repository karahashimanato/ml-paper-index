  notes: 'Selected for the method article requested by the user (2026-10-10): graph neural networks (GCN, GraphSAGE, GAT, SGC, message passing, expressive power and the WL test, oversmoothing, oversquashing,
    heterophily, and evaluation pitfalls and benchmarks). Carded by a subagent. Results tables not recorded; claims only. Venue from the PDF footer on page 1 (''36th Conference on Neural Information Processing
    Systems (NeurIPS 2022) Track on Datasets and Benchmarks'') and the arXiv comment; year 2022 is the first arXiv version (v4 dated 28 Nov 2023). Section numbers from numbered headings in the PDF (2, 3.3,
    3.4, 4.1, 4.2). Conflict of interest: the evaluated Transformer+LapPE uses the Laplacian PE of Dwivedi et al. [14] and the graph Transformer of Dwivedi and Bresson [13], RWSE is from Dwivedi et al.
    [15], SAN [34] is co-authored by Beaini, and the implementation uses GraphGPS [51] co-authored by Rampášek, Galkin, Dwivedi, Luu, Wolf and Beaini; the LRGB authors thus evaluate their own models and
    software. The stated conclusion that ''Transformers significantly outperform message passing'' was later reassessed by Tönshoff et al. (2023), which the authors cite in v4 (footnote in Section 4.1);
    the reassessment itself is not carded here. Link prediction (PCQM-Contact) has no matching task tag. All result tables are not recorded.'

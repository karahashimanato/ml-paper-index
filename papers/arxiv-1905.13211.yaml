proposes:
- 'algorithmic alignment: a PAC-style measure of how well a network''s computation structure matches a reasoning algorithm, with a sample complexity bound that decreases with better alignment; GNNs aligned
  with dynamic programming (e.g. Bellman-Ford); Neural Exhaustive Search for subset sum'
claims:
- id: c1
  statement: 'Contribution: the paper formally defines algorithmic alignment between a network''s computation structure and the algorithmic structure of a reasoning process, and derives a sample complexity
    bound that decreases with better alignment.'
  location: Abstract
  page: 1
  quote: We formally deﬁne this algorithmic alignment and derive a sample complexity bound that decreases with better alignment.
- id: c2
  statement: 'Definition (informal): a network aligns with an algorithm if it can simulate the algorithm with a limited number of modules, each of which is simple (low sample complexity); e.g. a GNN simulates
    Bellman-Ford by learning only the relaxation step, whereas an MLP would have to learn the whole for-loop.'
  location: Formalization of algorithmic alignment
  page: 4
  quote: Formally, a neural network aligns with an algorithm if it can simulate the algorithm via a limited number of modules, and each module is simple, i.e., has low sample complexity.
- id: c3
  statement: 'GUARANTEE and its assumptions: the theorem linking alignment to sample complexity holds only in a simplifying setting where the network''s modules are trained sequentially with auxiliary labels
    (Theorem 3.6 additionally assumes i.i.d. samples with bounded universe size |S| < N, algorithm stability of the module learner, sequential learning, and Lipschitzness of the learned modules; the paper
    illustrates module sample complexity with Theorem 3.5, an NTK-based result for overparameterized two-layer MLPs, and says other module bounds can be used). The same paragraph says auxiliary labels are
    not available in practice, that the same pattern is observed for end-to-end learning in the experiments (empirical, not covered by the theorem), and leaves end-to-end sample complexity analysis to future
    work.'
  location: Better algorithmic alignment implies better generalization
  page: 5
  quote: Theorem 3.6 states that, in a simplifying setting where we sequentially train modules of a network with auxiliary labels, the sample complexity bound increases with algorithmic alignment value
    M.
- id: c4
  statement: 'GNNs and dynamic programming: interpreting GNN aggregation as the DP update, the authors argue Theorem 3.6 suggests a GNN with enough iterations can sample-efficiently learn any DP algorithm
    with a simple update function such as sum/min/max (shortest paths via Bellman-Ford as the example).'
  location: Dynamic programming
  page: 8
  quote: Therefore, Theorem 3.6 suggests that a GNN with enough iterations can sample efﬁciently learn any DP algorithm with a simple DP-update function, e.g. sum/min/max.
- id: c5
  statement: 'Scope assumption: the framework is restricted to reasoning tasks whose underlying reasoning process is exact and has clear algorithmic structure; approximation algorithms and unknown structures
    are left to future work.'
  location: Theoretical framework
  page: 4
  quote: In this paper, we focus on reasoning tasks whose underlying reasoning process is exact and has clear algorithmic structure.
- id: c6
  statement: 'Evaluation protocol: for each task''s dataset (Appendix G), each model''s reported test accuracy uses the hyperparameter setting with the best validation accuracy; train, validation and test
    sets are sampled from the same generator (e.g. 50,000/5,000/5,000 for maximum value difference with 25 treasures), so no larger-input test is described (searched: larger, extrapolat). Section 4 adds
    that all models are made to perfectly fit their training sets through extensive hyperparameter tuning so test accuracy reflects generalization.'
  location: Appendix G (Dataset generation)
  page: 16
  quote: For each model, we report the test accuracy with the hyperparameter setting that achieves the best validation accuracy.
- id: c7
  statement: 'Relation to sorting: on the maximum value difference task an MLP does not generalize, but if the treasures are sorted by value the MLP achieves perfect test accuracy, which the authors explain
    as the algorithm reducing to a single subtraction.'
  location: Summary statistics
  page: 7
  quote: Interestingly, if we sort the treasures by value (Sorted MLP in Fig. 3a), MLP achieves perfect test accuracy.

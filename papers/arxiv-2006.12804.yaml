  notes: 'Selected for the topic article requested by the user (2026-10-03): classical algorithms (sorting, binary search, greedy) and machine learning; carded by a subagent. Results tables not recorded;
    claims only. Affiliations (title page): MIT CSAIL, TUM, Intel Labs. Conflict of interest: co-author Tim Kraska is an author of the original RMI paper (arxiv-1712.01208, ref. [19]) and the RMI implementation
    evaluated comes from the authors'' group; the introduction states the PGM result ''surprised the authors of [19]''. Footnote 2 (p.6): the authors shared their RMI implementation with Ferragina and Vinciguerra
    before publication of the PGM paper, who kept their own; all PGM results use the PGM authors'' tuned code as of May 18th, 2020. Not compared: other learned indexes (e.g. ALEX) ''because tuned implementations
    could not be made publicly available'' (Learned Index Structures). Baselines: STX B-Tree, interpolating BTree, ART, FAST, FST, Wormhole, RobinHash and SIMD CuckooMap (hash tables only at full size),
    binary search and radix binary search. Hardware: Intel Xeon Gold 6230, 256 GB RAM; 10M random lookup keys per dataset. Other findings stated: learned structures are Pareto optimal up to about 100MB
    on amzn/wiki and throughout on face, while no structure beats RBS on osm; branch misses do not explain the advantage of learned indexes ''as originally claimed in [19]'' (p.1) and cache misses had the
    largest explanatory power, though no single metric suffices; RMI and RS lose the most under memory fences and the authors recommend future work test with fences; RMIs build slowest among learned structures
    and no learned structure builds as fast as insert-optimized trees (Build times, Conclusion). Scaling (Section 4.2.1, amzn 200M-800M keys): all three learned structures scale with only a logarithmic
    slowdown, which the authors say is expected from the final binary search step. Earlier SOSD extended abstract: arxiv-1911.13014.'

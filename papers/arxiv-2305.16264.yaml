    tables not recorded; claims only. PDF states: 37th Conference on Neural Information Processing Systems (NeurIPS 2023). Affiliations on the title page: Hugging Face, Harvard University, University of
    Turku. Compute: LUMI supercomputer (AMD), per the acknowledgments. Other stated limitations (Appendix, Limitations and Future Work): only whole-dataset repetition is studied; text only with the GPT
    architecture; filtering recommendations are dataset-dependent (C4 and OSCAR). The paper also reports (Section 7, 4.2B-parameter models, 84B-token budget) that filling up to 50% of the data with Python
    code showed no deterioration on its natural-language benchmark and that perplexity filtering was effective while deduplication did not help; it recommends reserving filtering for noisy datasets.'

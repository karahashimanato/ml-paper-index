claims:
- id: c1
  statement: Reading out from the final recurrent state (re-introducing non-causality) lets the linear-time model closely match a controlled softmax-attention baseline on OpenML-CC18 and TabArena.
  location: Abstract
  page: 1
  quote: Finally, re-introducing non-causality by reading out from the final state allows us to closely match a controlled softmax attention baseline on OpenML-CC18 and TabArena.
- id: c2
  statement: DeltaNet degrades beyond roughly 2-4x the pretraining context length, and existing mitigations such as bidirectionality only defer the problem.
  location: Abstract
  page: 1
  quote: However, it degrades beyond 2-4× the pretraining context length, and existing mitigation strategies such as bidirectionality defer the problem at best.
- id: c3
  statement: 'Evaluation protocol: datasets are preprocessed (feature cap; OpenML-CC18 subsampled to the pretraining size), while TabArena is used to measure length generalisation on larger datasets.'
  location: Experimental setup
  page: 4
  quote: OpenML-CC18 is further subsampled to at most n = 1000 samples to match the pretraining size, while TabArena measures real-world length generalisation on larger datasets.
- id: c4
  statement: External foundation-model baselines (TabPFN v2.5, TabICLv2, TabFlex) are the released checkpoints and are not controlled for training budget or model size.
  location: Appendix
  page: 17
  quote: 'Importantly, these baselines are not controlled for training budget or model size: we evaluate the models released by their respective authors.'
- id: c5
  statement: CatBoost is used untuned, as a default-configuration baseline, justified by the TabArena finding that it performs well out of the box.
  location: Appendix
  page: 17
  quote: As shown in the TabArena evaluation by Erickson et al. (2026), CatBoost performs very well out of the box without hyperparameter tuning, supporting its use as a default configuration baseline.
- id: c6
  statement: 'Limitation: the study prioritises a controlled comparison over absolute performance; larger pretraining budgets and further tuning may disproportionately improve performance.'
  location: Limitations
  page: 10
  quote: Larger pretraining budgets and further tuning may disproportionately improve performance.

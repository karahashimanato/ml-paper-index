proposes:
- Identification of duplicate nodes (same regression target and same outgoing edges) in the standard squirrel and chameleon datasets, which create train-test leakage, and filtered versions with the duplicates
  removed
- Five new heterophilous node classification datasets (roman-empire, amazon-ratings, minesweeper, tolokers, questions) with 10K-50K nodes, characterized by adjusted homophily and label informativeness
- A benchmark of standard GNNs (with residual connections, layer normalization and ego/neighbor-embedding separation) against eight heterophily-specific models
claims:
- id: c1
  statement: The six graphs adopted by Pei et al. (2020) (squirrel, chameleon, actor, texas, cornell, wisconsin) became the de-facto standard benchmark for heterophily-specific models; the authors note
    they come from only three sources and argue more diverse datasets are required for a fair evaluation.
  location: Section 3
  page: 3
  quote: These graphs have become the de-facto standard benchmark for evaluating heterophily-speciﬁc models and were used in numerous papers (Zhu et al.,
- id: c2
  statement: 'Dataset problem: squirrel and chameleon contain many groups of nodes with exactly the same regression target and the same neighborhood (''duplicates''); because duplicates of a group appear
    in train, validation and test parts, test labels can be predicted by matching a node''s neighborhood to training nodes, i.e. train-test leakage, which also affects the classification task derived from
    the regression target.'
  location: Section 3.1
  page: 4
  quote: 'Since duplicates from the same group appear in the train, validation, and test parts of the datasets, they create a train-test data leakage:'
- id: c3
  statement: The duplicates constitute more than half of each of squirrel and chameleon, and GraphSAGE accuracy differs significantly between duplicates and non-duplicates, which the authors take as confirming
    that the model implicitly relies on the leakage.
  location: Section 3.1
  page: 4
  quote: The duplicates constitute more than half of each dataset.
- id: c4
  statement: After removing the duplicates, many models drop significantly in performance (particularly on chameleon), the drop differs between models, and the model ranking on the filtered datasets is
    very different; e.g. FSGNN is best on both original datasets but only 10th and 4th on filtered squirrel and chameleon. The authors say this raises concerns about the validity of conclusions in previous
    works relying on these datasets.
  location: Section 3.1
  page: 5
  quote: Such a substantial shake-up raises concerns about the validity of conclusions made in previous works that rely on analyzing the performance of different models on these datasets.
- id: c5
  statement: Cornell, texas and wisconsin are very small (183-251 nodes, 295-499 edges), which can lead to unstable and statistically insignificant results; they are also very imbalanced (texas has a class
    with only one node), and the accuracy reported by all previous works can be misleading under strong class imbalance.
  location: Section 3.2
  page: 5
  quote: We ﬁrst note that these datasets are very small (183-251 nodes and 295-499 edges), which can lead to unstable and statistically insigniﬁcant results.
- id: c6
  statement: 'Evaluation protocol: 10 random 50%/25%/25% splits fixed for each new dataset (the 10 standard splits for squirrel/chameleon, with duplicates removed for the filtered versions), one training
    run per split; accuracy for roman-empire and amazon-ratings, ROC AUC for the binary datasets. Baselines (ResNet, ResNet+SGC, ResNet+adj, GCN, GraphSAGE, GAT, GT and the -sep variants) get a two-layer
    MLP after each aggregation, skip connections and layer normalization.'
  location: Appendix A
  page: 14
  quote: For each of our new proposed datasets, we ﬁx 10 random 50%/25%/25% train/validation/test splits.
- id: c7
  statement: 'Tuning asymmetry: for the baselines the only tuned hyperparameter is the number of aggregation layers (from {1, ..., 5}), all other values being shared across models and datasets, because
    the authors found the baselines quite robust; heterophily-specific models (official code) turned out to be sensitive to hyperparameters, so for each a sweep over 4-5 values of learning rate and weight
    decay was done, with their model-specific hyperparameters fixed to the squirrel values except for GloGNN.'
  location: Appendix A
  page: 14
  quote: Further, we found that they make our baseline models quite robust to the selection of hyperparameter values, so the only hyperparameter that we tune for them is the number of graph neighborhood
    aggregation layers.
- id: c8
  statement: 'Main finding on the new datasets: the best results are almost always achieved by standard baselines rather than heterophily-specific models (13 of the 15 top-3 performances over the 5 datasets
    belong to standard GNNs), and some specialized models occasionally perform worse than the graph-agnostic ResNet; the authors conclude progress under heterophily was largely illusionary, with FSGNN as
    the only consistently strong specialized model.'
  location: Section 5.2
  page: 9
  quote: Among 15 of the top-3 performances on our 5 datasets, 13 belong to standard GNNs.
- id: c9
  statement: 'Separating ego- and neighbor-embeddings (the trick proposed by Zhu et al. (2020), as in GraphSAGE) helps: the best results are almost always achieved by models that separate them (GraphSAGE,
    GAT-sep, GT-sep), and GAT-sep and GT-sep typically outperform their versions without separation.'
  location: Section 5.2
  page: 9
  quote: GAT-sep and GT-sep typically outperform their versions without embedding separation, which shows that this trick proposed in Zhu et al. (2020) is indeed helpful for learning under heterophily.

claims:
- id: c1
  statement: Benchmark evaluation should also consider a per-dataset peak performance frontier, defined by the best statistically supported performance on each dataset.
  location: Abstract
  page: 1
  quote: We argue that benchmark evaluation should also consider the data-centric peak performance frontier, defined by the best statistically supported performance achieved on each dataset.
- id: c2
  statement: On TabArena, common aggregation metrics are highly correlated, mostly measure consistency and failure avoidance, and are much less aligned with dataset-level irreplaceability.
  location: Abstract
  page: 1
  quote: Applying this framework to the TabArena benchmark, we find that common aggregation metrics are highly correlated and largely measure consistency and avoiding failures, while being much less aligned
    with dataset-level irreplaceability.
- id: c3
  statement: The analysis uses TabArena, a maintained benchmark with a live leaderboard and public evaluation results, which currently comprises 27 models on 51 curated datasets.
  location: Experimental setup
  page: 2
  quote: using a stricter data curation and more extensive evaluation protocol, and currently comprises 27 models evaluated on 51 carefully curated datasets.
- id: c4
  statement: All models benefit from tuning on most datasets; foundation models can only be compared adequately when traditional alternatives are appropriately tuned.
  location: Appendix
  page: 11
  quote: This implies that, even though modern foundation models often perform well by default, they can only be compared adequately when the traditional alternatives are appropriately tuned.
- id: c5
  statement: RealMLP, ranked first at TabArena's publication, is never irreplaceable in this analysis; its strength lies mainly in avoiding poor outcomes.
  location: Results
  page: 3
  quote: yet in our analysis it ranks 13th on sufficiency, is never irreplaceable
- id: c6
  statement: The first author (Tschalzev) is listed as a co-author of the TabArena paper whose results are analysed; the paper does not discuss this as a conflict of interest.
  location: References

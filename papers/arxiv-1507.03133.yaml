  notes: 'Selected for the topic article requested by the user (2026-10-03): algorithm design techniques (divide and conquer, dynamic programming, branch and bound, local search) and machine learning; carded
    by a subagent. Results tables not recorded; claims only. Software/hardware: Gurobi 5.5 (Matlab and Python interfaces); discrete first-order methods in Matlab; 8-core Xeon 1.8GHz 16GB for n > p, 16-core
    Xeon 3.1GHz 128GB for p >> n. Upper-bound experiments: 50 random initializations of Algorithm 2 vs MIO cold start vs MIO warm start, each with a 500-second limit; Leukemia data runs 4000 s per k. Sequence-of-k
    training stops at a 1% optimality gap or 15 minutes per k, using solver callbacks to add cardinality cuts. On Diabetes the optimum is found in seconds but certifying it takes 10-20 minutes (Figure 2
    caption). In p >> n, lower bounds evolve slowly even with warm starts; a bounding-box formulation around a local solution certifies optimality only inside that box. The discrete first-order algorithm
    converges to a first-order stationary point (Proposition 6), not necessarily the global optimum. Introduction: the problem is NP-hard and leaps in R does not scale beyond p = 30; the authors relate
    prior leaps-and-bounds and tailored branch-and-bound work. Baselines: Lasso (glmnet), Sparsenet (MCP family), stepwise regression (R stats), debiased Lasso variants (appendix). The authors argue Lasso
    brings in many shrunken noise variables under correlation and noise. Branch-and-bound tag: the MIO solver (Gurobi) is used as the exact engine; the paper itself does not design a branching scheme. greedy-methods
    not tagged: stepwise regression is a baseline only. Results not recorded.'

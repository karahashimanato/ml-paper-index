  notes: 'Approved from candidate issue #2 (2026-10-02); carded by a subagent. Results tables not recorded; claims only. Benchmarks: CICIDS2017, UNSW-NB15, ToN-IoT (binary benign vs attack). The paper is
    about promotion after drift alarms rather than about detection accuracy; drift monitors are two-sample statistics (energy distance, RBF-MMD, per-feature KS, JS divergence). The abstract also reports
    thirteen chronological replays on real time-ordered traffic in which always-deploy showed no net harm. Primary learner is SVC-RBF on 8-dim PCA; label-free baselines ATC and DoC also compared. Code also
    archived on Zenodo.'

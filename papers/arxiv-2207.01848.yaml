  - automl-systems
  paradigms:
  - in-context-learning
proposes:
- TabPFN
claims:
- id: c1
  statement: On the 18 small numerical OpenML-CC18 datasets, TabPFN clearly outperformed boosted trees and was on par with AutoML systems, with up to 230x speedup.
  location: Abstract
  page: 1
  quote: we show that our method clearly outperforms boosted trees and performs on par with complex state-of-the-art AutoML systems with up to 230× speedup.
- id: c2
  statement: 'TabPFN targets small tasks: up to 1,000 training examples, 100 purely numerical features without missing values, and 10 classes.'
  location: Section 1
  page: 2
  quote: tasks (≤1 000 training examples, ≤100 purely numerical features without missing values and ≤10 classes)
- id: c3
  statement: TabPFN is pre-trained once, offline, on synthetic datasets (12-layer Transformer, 20 hours on 8 GPUs); the same model is used for all evaluations.
  location: Section 3
  page: 3
  quote: we trained a 12-layer Transformer for 18 000 batches of 512 synthetically generated datasets each, which required a total of 20 hours on one machine with 8 GPUs (Nvidia RTX 2080 Ti).
- id: c4
  statement: 'TabPFN predicts by in-context learning: training examples are given as input and no parameters are updated on the new dataset.'
  location: Abstract
  page: 1
  quote: TabPFN performs in-context learning (ICL), it learns to make predictions using sequences of labeled examples (x, f(x)) given in the input, without requiring further parameter updates.
- id: c5
  statement: The synthetic-data prior is based on structural causal models with a preference for simple structures (mixed with a BNN prior).
  location: Abstract
  page: 1
  quote: 'This prior incorporates ideas from causal reasoning: It entails a large space of structural causal models with a preference for simple structures.'
- id: c6
  statement: No method, including TabPFN, was best on all individual datasets; TabPFN lost even to default baselines on some.
  location: Section 5.2
  page: 9
  quote: no classification method, including TabPFN, performs best on all individual datasets.
- id: c7
  statement: TabPFN is weaker when categorical features or missing values are present.
  location: Section 5.2
  page: 9
  quote: Generally, TabPFN is less strong when categorical features or missing values are present.
- id: c8
  statement: 'Evaluation: 5 repetitions per dataset, each with its own seed and a 50/50 train/test split shared by all methods.'
  location: Section 5.2
  page: 8
  quote: each with a different random seed and train- and test split (50% train and 50% test samples; all methods used the same split given a seed).
- id: c9
  statement: 'Test datasets: all OpenML-CC18 datasets with up to 2,000 samples (1,000 for training), 100 features and 10 classes (30 datasets; 18 purely numerical without missing values).'
  location: Section 5.2
  page: 7
  quote: As test datasets, we used all datasets from the curated open-source OpenML-CC18 benchmark suite (Bischl et al., 2021) that contain up to 2 000 samples (1 000 for the training split), 100 features
    and 10 classes.
- id: c10
  statement: Averaging TabPFN and AutoGluon predictions strongly outperformed all other methods in Table 1; TabPFN's errors are relatively uncorrelated with the baselines'.
  location: Section 5.2
  page: 9
  quote: averaging the predictions of TabPFN and AutoGluon; this strongly outperforms all other methods.
- id: c11
  statement: On the small datasets of the OpenML-AutoML Benchmark, using official baseline results, TabPFN outperformed all baselines in mean cross-entropy, accuracy and the OpenML metric.
  location: Section 5.2
  page: 9
  quote: TabPFN outperformed all baselines in terms of mean cross-entropy, accuracy and the OpenML Metric
- id: c12
  statement: 'Limitation: the Transformer architecture only scales to small datasets.'
  location: Section 6
  page: 10
  quote: the underlying Transformer architecture only scales to small datasets
- id: c13
  statement: TabPFN generalized to training-set sizes larger than those seen during prior-fitting.
  location: Section 5.2
  page: 9
  quote: Surprisingly, our models generalize beyond sample sizes seen during training
- id: c14
  statement: Baselines were tuned by random search with 5-fold cross-validation until a time budget was exhausted.
  location: Section 5.2
  page: 7
  quote: we used 5-fold cross-validation to evaluate randomly drawn hyperparameter configurations until a given budget was exhausted
- id: c15
  statement: On all 30 test datasets (including categorical/missing), aggregate results were still strong but weaker than on purely numerical data.
  location: Section 5.2
  page: 7
  quote: still show strong aggregate performance for TabPFN, albeit not as strong as for the purely numerical case
- id: c16
  statement: TabPFN needs no hyperparameter tuning.
  location: Abstract
  page: 1
  quote: needs no hyperparameter tuning and is competitive with state-of-the-art classification methods
- id: c17
  statement: Results are aggregated across datasets as average ROC AUC (OVO for multiclass), ranks and wins with 95% confidence intervals.
  location: Section 5.2
  page: 8
  quote: we report the ROC AUC (one-vs-one (OVO) for multi-class classification) average, ranks and wins including the 95% confidence interval

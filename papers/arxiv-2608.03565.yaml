claims:
- id: c1
  statement: CASE improves tabular learners on semantically rich datasets (CARTE, TextTab), particularly in low-data regimes.
  location: Abstract
  page: 1
  quote: Our experiments across several benchmarks (CARTE, TextTab, and TabArena) demonstrate that CASE substantially improves the performance of tabular learners on semantically rich datasets, particularly
    in low-data regimes.
- id: c2
  statement: 'On the numerics-heavy TabArena benchmark there is a small trade-off: the raw learners (TabICLv2, AutoGluon) keep a lead.'
  location: Results
  page: 6
  quote: While showcasing significant improvements on semantically rich benchmarks, we observe a small performance trade-off on the numerics-heavy TabArena benchmark, where the raw statistical learners
    (TabICLv2 and AutoGluon) maintain a lead.
- id: c3
  statement: Evaluation uses CARTE, TextTab, and only the single-fold variant of TabArena.
  location: Experimental setup
  page: 5
  quote: 'We evaluate our approach across three distinct benchmark suites: CARTE [18], TextTab [22], and the single-fold variant of TabArena [7].'
- id: c4
  statement: XGBoost, CatBoost and RealMLP (via pytabkit) are tuned with ensembled hyperparameter optimization across 5-fold inner cross-validation, using TabArena search spaces.
  location: Appendix (Baseline details)
  page: 13
  quote: We evaluate these models with ensembled hyperparameter optimization across 5-fold inner cross-validation (HPO-CV).
- id: c5
  statement: The cited check for overlap between the T4 continued-pretraining corpus and evaluation data was done in related work [27] and covers the CARTE benchmark.
  location: Appendix (Data contamination)
  page: 16
  quote: Related work [27] conducted a systematic search for overlap between the T4 training set and the CARTE benchmark.
- id: c6
  statement: Co-author Maximilian Schambach is also an author of ConTextTab [27], one of the evaluated baselines (per the reference list).
  location: References
  page: 11
  quote: Marco Spinaci, Marek Polewczyk, Maximilian Schambach, and Sam Thelin.

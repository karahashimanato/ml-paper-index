    No venue is printed in the arXiv v5 PDF (dated 16 May 2017) and the arXiv comment/journal_ref give none; none recorded. Section numbers are from numbered headings in the PDF; the supplement (proofs,
    Appendix C) is included in the v5 PDF. Conflict of interest: the paper builds on and compares with BLR and BNN from Johansson et al. (2016), by the same three authors (arxiv-1605.03661); overlapping
    authors (Shalit, Sontag) also on arxiv-1705.08821. In the RCT setting (t independent of x) the IPM term is 0 and the bound reduces to learning two functions (Introduction). The authors note their theory
    does not immediately apply to log-loss, which they use for binary outcomes (Section 5). Experiments: IHDP NPCI setting ''A'', 1000 realizations, 63/27/10 splits; an imbalance experiment removes controls
    with probability q by propensity; Jobs uses the LaLonde experimental sample plus PSID comparison group, 10 splits 56/24/20. Results tables/figures not recorded. Open questions in the Conclusion: choosing
    alpha, confidence intervals, and integrating hidden confounding or instrumental variables. Related work states ''we only deal with the ignorable case''.'

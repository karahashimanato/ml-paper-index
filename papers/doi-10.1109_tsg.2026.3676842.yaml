claims:
- id: c1
  statement: The paper proposes a conformal-prediction variant, Adaptive Mondrian Binning (AMB), to address the arbitrary bin count of CP with Mondrian Binning.
  location: Abstract
  page: 2
  quote: 'To address the arbitrary bin count in CP with MB, the paper proposes a novel CP variant, namely: Adaptive Mondrian Binning (AMB).'
- id: c2
  statement: 'Main claim: with LightGBM as the deterministic regressor, AMB outperforms quantile regression and the other CP variants.'
  location: Abstract
  page: 2
  quote: Results show that using LightGBM as the deterministic regressor, AMB outperforms quantile regression and other CP variants.
- id: c3
  statement: 'Evaluation data: two real datasets (Amsterdam, the Netherlands; Sydney/Ausgrid, Australia); households are split into two groups, once in file order and in thirty random splits.'
  location: Experiment Settings
  page: 8
  quote: 'Multiple splits: Thirty random splits are performed, each dividing the households into a group of 10 and a group of 11, similar to the single split'
- id: c4
  statement: Deterministic regressors compared were MLR, random forest and LightGBM, plus FCNN, ResNet and LSTM; DL models were similar to LightGBM in accuracy but took much longer to train.
  location: Deterministic Disaggregation Results
  page: 9
  quote: In both datasets, DL methods are similar to LGB in terms of accuracy, while incurring significantly longer training time.
- id: c5
  statement: The quantile-regression baseline is LightGBM with a quantile objective. How the regressors' hyperparameters were set is not found in the text (only the capacity-estimation thresholds are given).
  location: Probabilistic Disaggregation Results
  page: 9
  quote: In this study, QR is realized by changing the objective of LGB to "quantile".

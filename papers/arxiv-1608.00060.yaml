proposes:
- 'Double/debiased machine learning (DML): estimate a low-dimensional target parameter from a Neyman-orthogonal score with nuisance functions learned by arbitrary ML methods, combined with K-fold cross-fitting
  (DML1: average fold-wise estimates; DML2: solve the pooled fold-wise moment equation)'
- Aggregation over repeated sample splits by the mean or (recommended) median, with variance estimates that include the across-split variation
claims:
- id: c1
  statement: 'Regularization bias: in the partially linear model, a naive estimator that plugs an ML estimate of g0 into the estimating equation (even with sample splitting) generally converges slower than
    1/sqrt(n), because the regularization bias term is not centered and diverges in general; regularized learners (lasso, ridge, boosting, penalized nets) typically converge at n^(-phi) with phi < 1/2.'
  location: Section 1.1
  page: 3
  quote: Term b is the regularization bias term, which is not centered and diverges in general.
- id: c2
  statement: 'Orthogonalization: partialling out the effect of X from D (V = D - m0(X), with m0 estimated by ML on the auxiliary sample) and subtracting an estimate of g0 yields a debiased estimator; because
    this requires an auxiliary prediction of D given X, the authors call it ''double prediction'' or ''double machine learning''.'
  location: Section 1.1
  page: 4
  quote: We are now solving an auxiliary prediction problem to estimate the conditional mean of D given X, so we are doing “double prediction” or “double machine learning”.
- id: c3
  statement: 'Cross-fitting: sample splitting controls remainder terms that otherwise may not vanish when nuisance estimates overfit (an artificial overfitting estimator that converges at nearly the parametric
    rate still makes the full-sample estimator explode); swapping the main and auxiliary samples and averaging regains full efficiency.'
  location: Section 1.1
  page: 6
  quote: We call this sample splitting procedure where we swap the roles of main and auxiliary samples to obtain multiple estimates and then average the results cross-fitting.
- id: c4
  statement: 'Definition 2.1 (Neyman orthogonality): the score satisfies the moment condition at the true values and its pathwise (Gateaux) derivative with respect to the nuisance parameter, at the truth,
    vanishes for all nuisance values in a nuisance realization set (typically a shrinking neighborhood of eta0); a near-orthogonal variant allows the derivative to be bounded by lambda_N = o(N^(-1/2)).'
  location: Section 2.1
  page: 12
  quote: The Neyman orthogonality condition requires that the derivative in (2.2) vanishes for all η ∈TN.
- id: c5
  statement: 'Rate requirement: Assumption 3.2 states conditions on the quality of nuisance estimators in terms of statistical rates; in smooth problems this translates, in the worst cases, to the crude
    requirement that nuisance parameters be estimated at the rate o(N^(-1/4)), which the authors say is achievable for many ML methods under structured assumptions (citing results for l1-penalized methods,
    boosting, trees/forests and a class of neural nets).'
  location: Section 3.2
  page: 26
  quote: However, in smooth problems, as discussed below this translates, in the worst cases, to the crude requirement that the nuisance parameters are estimated at the rate
- id: c6
  statement: 'ATE and ATTE under unconfoundedness with binary treatment (interactive model): the ATE score is the doubly robust form based on the influence function of Robins & Rotnitzky (1995); under Assumption
    5.1 (including overlap, eps <= m0(X) <= 1 - eps, and a product of propensity and outcome-regression L2 errors <= delta_N N^(-1/2)), DML1 and DML2 are root-N asymptotically normal with uniformly valid
    confidence intervals (Theorem 5.1), and the authors state that the scores are efficient, reaching Hahn''s (1998) semiparametric efficiency bound.'
  location: Section 5.1
  page: 37
  quote: The scores ψ in (5.3) and (5.4) are efficient, so both estimators are asymptotically efficient, reaching the semi-parametric efficiency bound of Hahn (1998).
- id: c7
  statement: 'The authors describe the conditions of Assumption 5.1 as fairly sharp though simplified for presentation: in sparse models estimated by l1-penalized methods, the product-rate condition requires
    s_g s_m << N (ignoring logs), much weaker than (s_g)^2 + (s_m)^2 << N needed without sample splitting, so a very sparse propensity score allows a quite dense outcome regression and vice versa; with
    a known propensity score only consistency of the outcome regression is needed.'
  location: Section 5.1 (Remark 5.2)
  page: 37
  quote: The conditions in Assumption 5.1 are fairly sharp though somewhat simplified for ease of presentation.
- id: c8
  statement: Without unconfoundedness (conditional exogeneity), the ATE and ATTE targets measure association rather than causal effects; the authors suggest calling them the average predictive effect (APE)
    and average predictive effect for the exposed (APEX), and state that inference for them follows from Theorem 5.1.
  location: Section 5.1 (footnote 10)
  page: 35
  quote: Without unconfoundedness/conditional exogeneity, these quantities measure association, and could be referred to as average predictive effect (APE) and average predictive effect for the exposed
    (APEX).
- id: c9
  statement: 'Practical recommendations: the number of folds K has no asymptotic impact under the conditions but may matter in small samples; the authors found K = 4 or 5 to work better than K = 2 in a
    variety of empirical examples and simulations, generally recommend DML2 over DML1 (no difference for the ATE in the interactive model), and recommend reporting the median over repeated sample splits
    because it is more robust to outliers (Section 3.4).'
  location: Section 3.1 (Remark 3.1)
  page: 24
  quote: We have found moderate values of K, such as 4 or 5, to work better than K = 2 in a variety of empirical examples and in simulations.

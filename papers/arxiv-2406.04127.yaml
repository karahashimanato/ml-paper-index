  notes: 'Selected for the topic article requested by the user (2026-10-11): pitfalls in evaluating large language models (benchmark contamination and its detection, prompt and answer-format sensitivity,
    LLM-as-a-judge biases, human-preference arenas, holistic evaluation, benchmark errors, and reproducibility of evaluation harnesses). Carded by a subagent. Results tables not recorded; claims only. Affiliations:
    University of Edinburgh, Sapienza, Polytechnic University of Bari, UCL, Trento, AssemblyAI, UK Health Security Agency, Miniml.AI. No venue is stated in the arXiv PDF or the arXiv record; none recorded.
    Section numbers are from numbered headings in the PDF (Section 3.2 ''Re-Evaluating the State-of-the-Art LLMs''). Internal inconsistencies in the PDF: the introduction and abstract say MMLU-Redux covers
    5,700 questions across all 57 subjects, while Appendix B says it ''comprises subsampled test splits of the aforementioned thirty MMLU subsets'' and Figure 3 covers ''the 30 most erroneous MMLU subjects'';
    Section 3.1 gives 30% wrong ground truth and 15% unclear questions for Virology while the Figure 3 caption gives 33% and 14%. The dataset link points to ''mmlu-redux-2.0''. The checklist states no error
    bars were reported because rerunning ''would have exceeded our funding capabilities''. The annotators'' ''Expert'' label (unsure) is a seventh value in the released data beyond the taxonomy. Error-detection
    table values (Tables 3 and 4) are not recorded. The introduction states that 14 human experts re-annotated the 5,700 questions; Section 3 states the annotators'' suggested correct answers are not used
    to replace MMLU labels. The model predictions used for the re-evaluation were taken from the HELM leaderboard v1.3.0 (released May 15th, 2024) rather than re-run (Appendix B), so the prompting protocol
    is HELM''s. Error detection (Section 4) used zero-shot, few-shot, chain-of-thought and BM25 retrieval-augmented prompting (five paragraphs from Wikipedia or MS MARCO) of GPT-4 Turbo, GPT-4o, Claude
    3 Opus and Llama3-70B, plus instruction fine-tuning of Llama3 8B-Instruct, with ''not ok'' as the positive class. No conflict of interest found: the authors evaluate third-party models using HELM predictions;
    MMLU-Redux is their own dataset.'

claims:
- id: c1
  statement: Jointly reconciling forecasts of hourly prices and all intraday price spreads improves performance across two European markets and three forecasting architectures.
  location: Abstract
  page: 1
  quote: Here we show that a temporal hierarchy forecasting (THieF) framework that jointly reconciles forecasts of hourly electricity prices and all intraday price spreads consistently improves performance
    across two major European electricity markets and three different forecasting architectures.
- id: c2
  statement: The gains also hold for a pretrained TabPFN model.
  location: Abstract
  page: 1
  quote: The gains persist even for a highly accurate pretrained TabPFN foundation model.
- id: c3
  statement: TabPFN-2 is used zero-shot, without tuning weights or hyperparameters, with a 3-year rolling window as the in-context support set.
  location: Forecasting models
  page: 11
  quote: Forecasts are generated in the so-called zero-shot mode, i.e., without task-specific tuning of the model weights or hyperparameters.
- id: c4
  statement: Data come from two European day-ahead markets, German EPEX-DE and Spanish OMIE (public data spanning eight years).
  location: Datasets
  page: 7
  quote: 'To ensure a sound assessment of the THieF approach, we consider two major European power markets: EPEX-DE (Germany) and OMIE (Spain).'
- id: c5
  statement: 'Statistical and economic rankings differ: TabPFN is the most accurate model, but NARX with Spread THieF gives the highest arbitrage profit.'
  location: Conclusions
  page: 21
  quote: although TabPFN is the most accurate model, NARX combined with Spread THieF yields the highest arbitrage profit in every market-efficiency combination
- id: c6
  statement: 'Stated limitation: the battery arbitrage exercise is stylized (price-taking, one daily cycle, fixed round-trip cost).'
  location: Conclusions
  page: 21
  quote: 'The BESS exercise is deliberately stylized: we assume price-taking behavior, a single daily charge-discharge cycle, and a fixed round-trip cost.'

proposes:
- 'A framework relating validation-set metrics for selecting treatment effect models: mu-risk (outcome prediction error, optionally IPTW-weighted), decision value (IPTW and doubly robust estimators), and
  plug-in tau-risk estimates (matching, IPTW transformed outcome, and the R-learner objective of Nie and Wager)'
- Use of the R-learner objective (tau-risk_R) as a model selection metric for treatment effect models fit by arbitrary algorithms
claims:
- id: c1
  statement: 'The fundamental problem: data-splitting/cross-validation of prediction risk breaks down for treatment effect models because the true effect is never observed; the quantity of interest is the
    tau-risk E[l(tau-hat, tau)] (called PEHE by Hill), whose direct validation-set estimator is infeasible.'
  location: Introduction
  page: 4
  quote: This approach breaks down for treatment eﬀect estimation because the true treatment eﬀect is never observed in any sample.
- id: c2
  statement: mu-risk (validation-set prediction error of the outcome models, applicable when the effect model is built from outcome regressions, e.g. S- and T-learners) is easy to estimate, but citing Rolling
    and Yang the authors note many simple examples where minimizing outcome MSE badly fails to select the model with the most accurate treatment effect.
  location: Section 2.1
  page: 5
  quote: There are many simple examples where minimizing the mean-squared error of predicted outcomes badly fails to select the model with the most accurate treatment eﬀect [24].
- id: c3
  statement: 'Value-based selection: the IPTW value estimator (Kapelner et al.; Zhao et al.) depends on the correctness of the propensity model and only uses the individuals whose treatment matches the
    policy, discarding the rest; the authors note that Athey et al., in the spirit of Dudík et al., overcome this with a doubly robust estimator.'
  location: Section 2.2
  page: 7
  quote: A problem with this estimator is that it depends on the correctness of the propensity model.
- id: c4
  statement: 'Plug-in tau-risk estimates: Rolling and Yang''s matching-based estimator scales relatively poorly and matches become difficult to find in high-dimensional covariate spaces; an alternative
    (Gutierrez and Gerardy) uses the IPTW transformed outcome as a plug-in for tau.'
  location: Section 2.3
  page: 8
  quote: A downside of this approach are that Mahalanobis matching scales relatively poorly and matches become diﬃcult to ﬁnd in high-dimensional covariate spaces.
- id: c5
  statement: 'tau-risk_R: following Nie and Wager, the validation-set metric is the mean of ((y - m(x)) - (w - p(x)) tau-hat(x))^2, with m(x) an estimate of E[Y|X] (regressing Y on X without W) and p(x)
    a propensity estimate; Nie and Wager used this objective for fitting, and the authors propose using it to select among models fit by arbitrary means.'
  location: Section 2.3
  page: 8
  quote: We propose using this same construction to select among models ﬁt by arbitrary means.
- id: c6
  statement: 'Protocol: the sixteen simulations of Powers et al., each repeated 100 times with 1000 training, 1000 validation and 1000 test samples; all DGPs satisfy ignorability, SUTVA and positivity and
    vary in nonlinearity and signal-to-noise ratio.'
  location: Section 3.1.1
  page: 9
  quote: The data-generating process in each simulation all satisfy the usual assumptions made about ignorability, SUTVA, and positivity, but vary in the amount of nonlinearity in the conditional mean functions
    and signal-to-noise ratio.
- id: c7
  statement: 'Result as stated in the text: tau-risk_R is the metric that most consistently selects models with low test tau-risk and high value, especially when treatment assignment is randomized but also
    to a large extent when it is biased; where other approaches win, it is typically by a small margin, and mu-risk and its IPTW version also perform well.'
  location: Section 3.2
  page: 12
  quote: This is especially true when treatment assignment is randomized, but also to a large extent when the assignment is biased.
- id: c8
  statement: Selection on the IPTW or doubly robust value estimators is generally suboptimal even when the goal is to optimize test-set value, which the authors say is likely because these metrics are 'coarser',
    turning a regression problem into a classification problem; they nonetheless show low empirical bias for value, so they remain appropriate to gauge the value of the final policy.
  location: Section 4
  page: 15
  quote: This is likely because these metrics are in a sense “coarser” than the other metrics we consider, eﬀectively turning a regression problem into a classiﬁcation problem.
- id: c9
  statement: 'Limitation: the study relies on simulations, which is necessary because test tau-risk and value cannot be computed from real data; the authors say no set of simulations can mimic the full
    range of real-world DGPs, though theirs span linear and nonlinear outcome functions, noise levels and degrees of assignment bias.'
  location: Section 4
  page: 16
  quote: The primary limitation of our work is that it relies on simulations.

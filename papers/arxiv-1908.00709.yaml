proposes:
- A survey organizing AutoML along the pipeline data preparation -> feature engineering -> model generation (search space; HPO and architecture optimization) -> model evaluation, with a focus on NAS
- Taxonomies of NAS search spaces (entire-structured, cell-based, hierarchical, morphism-based) and architecture optimization methods (RL, evolution, gradient descent, surrogate-model-based, grid/random
  search, hybrids), plus a list of open problems
claims:
- id: c1
  statement: 'Pipeline taxonomy: the AutoML pipeline consists of data preparation, feature engineering, model generation and model evaluation; model generation is split into the search space (traditional
    ML models vs neural architectures) and optimization methods, the latter classified into hyperparameter optimization (training-related parameters) and architecture optimization (model-related parameters).'
  location: Introduction
  page: 1
  quote: 'As Figure 1 shows, the AutoML pipeline consists of several processes: data preparation, feature engineering, model generation, and model evaluation.'
- id: c2
  statement: 'NAS taxonomy: commonly used search spaces are classified into entire-structured, cell-based, hierarchical and morphism-based; architecture optimization methods into reinforcement learning,
    evolution-based algorithms, gradient descent, surrogate model-based optimization and hybrid methods. The authors state their goal is breadth rather than a thorough investigation of every sub-topic.'
  location: Introduction
  page: 2
  quote: By reviewing NAS methods, we classify the commonly used search space into entire-structured [12, 13, 14], cell-based [13, 15, 16, 17, 18], hierarchical [19] and morphism-based [20, 21, 22] search
    space.
- id: c3
  statement: 'Gradient-based NAS failure mode (citing DARTS+ [159] and P-DARTS [128]): the skip-connect operation dominates at a later search stage in DARTS, making the network shallower and markedly degrading
    performance; DARTS+ adds an early-stop criterion and P-DARTS uses operation-level dropout to control skip-connects.'
  location: Section 4.2.3
  page: 13
  quote: For example, several studies [159, 128] have found that skip-connect operation domi-nates at a later search stage in DARTS, which causes the network to be shallower and leads to a marked deterioration
    in performance.
- id: c4
  statement: 'Comparability caveat: the CIFAR-10/ImageNet comparison tables collect results obtained under different settings such as training hyperparameters and data augmentation, so the authors say the
    comparison is not quite fair; they present NAS-Bench-101/201 and NAS-Bench-NLP as improving reproducibility.'
  location: Section 6.1.2
  page: 20
  quote: In other words, the comparison is not quite fair.
- id: c5
  statement: 'Search-evaluation gap: noting that random search is comparable to more sophisticated methods (e.g. DARTS and ENAS), the authors describe a usually large gap between the search stage and the
    evaluation stage, motivating the use of Kendall''s tau between the two stages'' rankings in several NAS studies.'
  location: Section 6.1.1
  page: 20
  quote: In other words, the architecture that achieves the best result in the training set is not necessarily the best one for the validation set.
- id: c6
  statement: 'Weight-sharing ranking problem (citing Yu et al. [11]): weight sharing degrades individual architectures'' performance and negatively impacts the true performance ranking of candidates; to
    reduce weight coupling, many one-shot methods adopt random sampling of single architectures from the supernet.'
  location: Section 6.3
  page: 22
  quote: Yu et al. [11] experimentally showed that the weight-sharing strat-egy degrades the individual architecture’s performance and negatively impacts the real performance ranking of the candidate architectures.
- id: c7
  statement: 'Joint hyperparameter and architecture optimization: most NAS methods fix training hyperparameters during search and tune them afterwards, which the authors say may give suboptimal results
    because different architectures tend to fit different hyperparameters, making the ranking unfair (citing [233]); joint HAO is presented as a promising solution.'
  location: Section 6.4
  page: 22
  quote: However, this paradigm may result in suboptimal results as diﬀerent architectures tend to ﬁt diﬀerent hyperparameters, making the model ranking unfair [233].
- id: c8
  statement: 'Open problem, reproducibility: many NAS algorithms have manually set implementation-level parameters that the original papers do not describe in detail; citing Yang et al. [123], the seed
    plays an important role in NAS experiments but most studies do not report it; resource consumption is another obstacle, which NAS-Bench datasets aim to reduce.'
  location: Section 7.4
  page: 24
  quote: For instance, Yang et al. [123] experimentally demonstrated that the seed plays an important role in NAS experiments; however, most NAS studies do not mention the seed set in the experiments.

proposes:
- Tutorial on causal foundation models (CFMs) and a standardized comparison of Do-PFN, CausalPFN and CausalFM on RealCause-Lalonde
claims:
- id: c1
  statement: One stated contribution is a standardized empirical comparison of three causal foundation models on semi-synthetic observational data.
  location: Benchmarking CFMs
  page: 18
  quote: One contribution of our work is establishing a standardized, fair empirical comparison across these three CFMs for causal inference on more complex semi-synthetic observational data.
- id: c2
  statement: Models are evaluated on the semi-synthetic RealCause-Lalonde benchmark (Lalonde-CPS and Lalonde-PSID cohorts), with metrics aggregated over 10 semi-synthetic realizations.
  location: Experimental setup
  page: 18
  quote: we evaluate models on the semi-synthetic RealCause-Lalonde benchmark (LaLonde, 1986; Neal et al., 2020).
- id: c3
  statement: Nuisance models of the classical baselines are selected with FLAML AutoML, run separately per nuisance, estimator, realization and cohort, with a 900-second budget and 3-fold cross-validation.
  location: Experimental setup
  page: 18
  quote: To provide strong, competitive baselines, all underlying nuisance models are selected via FLAML AutoML (v2.3.5; Wang et al. (2021)) run independently per nuisance, per estimator, per RealCause
    realization, and per cohort with a 900-second budget and 3-fold cross-validation.
- id: c4
  statement: The CFMs are frozen pretrained checkpoints applied without any parameter or hyperparameter tuning.
  location: Experimental setup
  page: 19
  quote: These models are downloaded out-of-the-box from their respective sources and applied without any parameter or hyperparameter tuning.
- id: c5
  statement: Without being trained on the Lalonde data distributions, the CFMs are reported to be competitive with the classical estimators.
  location: Results and Discussion
  page: 19
  quote: Despite not being trained on the Lalonde data distributions, CFMs are remarkably competitive with classical estimators.
- id: c6
  statement: Runtime counts training, tuning and inference for classical baselines but only inference for CFMs; CFM pretraining is excluded.
  location: Experimental setup
  page: 19
  quote: This means we include training, tuning, and inference for classical baselines, but only inference for CFMs since this is the only step we perform.

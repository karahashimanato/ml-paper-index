claims:
- id: c1
  statement: MolPAIR uses a second frozen TFM that predicts error differences between a query and labeled reference molecules to refine the first TFM's prediction.
  location: Abstract
  page: 1
  quote: A second frozen TFM predicts differences in prediction errors between the query and labeled reference molecules, using these comparisons to refine the initial prediction.
- id: c2
  statement: CheMeleon representations with TabPFN-3 alone already beat each evaluated baseline on a majority of the 58 tasks.
  location: Abstract
  page: 1
  quote: Across 58 MoleculeACE and Polaris tasks, CheMeleon representations combined with TabPFN-3 already outperform each evaluated baseline on a majority of tasks.
- id: c3
  statement: The benchmark combines 30 MoleculeACE and 28 Polaris tasks (47 regression, 11 binary classification).
  location: Evaluation protocol
  page: 5
  quote: We combine 30 MoleculeACE bioactivity tasks with 28 Polaris tasks (Van Tilborg et al., 2022; Polaris Hub, 2026), comprising 47 regression and 11 binary classification tasks.
- id: c4
  statement: Splits hold out scaffold groups and additionally filter out test molecules too similar to training molecules.
  location: Evaluation protocol
  page: 6
  quote: The scaffold holdout separates structural groups, while the similarity filter removes close analogues that can remain across different scaffolds.
- id: c5
  statement: Tree baselines are tuned on training data only with Optuna (30 trials for RF/ExtraTrees, 50 for XGBoost/LightGBM).
  location: Appendix
  page: 18
  quote: Random Forest and ExtraTrees use 30 Optuna trials; XGBoost and LightGBM use 50.
- id: c6
  statement: 'Limitation: real-world shifts may not be captured by scaffold and fingerprint-similarity splits; MolPAIR also increases inference cost.'
  location: Limitations and future work
  page: 9
  quote: Broader real-world distribution shifts may also involve changes that are not captured by scaffold separation and fingerprint-similarity-based splits.

proposes:
- An empirical study showing that likelihoods of deep generative models (Glow/RealNVP flows, VAEs, PixelCNN) can be higher for out-of-distribution image datasets than for the training distribution, and
  a second-order analysis for constant-volume flows that explains the gap by the data's mean/variance and the model curvature
claims:
- id: c1
  statement: 'Main finding: densities learned by flow-based models, VAEs and PixelCNNs trained on CIFAR-10 assign higher likelihood to SVHN than to CIFAR-10; the authors challenge the assumption that density
    models can be used to detect out-of-distribution inputs.'
  location: Abstract
  page: 1
  quote: We ﬁnd that the density learned by ﬂow-based models, VAEs, and PixelCNNs cannot distinguish images of common objects such as dogs, trucks, and horses (i.e. CIFAR-10) from those of house numbers
    (i.e. SVHN), assigning a higher likelihood to the latter when the model is trained on the former.
- id: c2
  statement: 'Scope of the phenomenon for Glow: higher likelihood for MNIST under a Glow trained on FashionMNIST, for SVHN under CelebA, and for SVHN, CIFAR-10 and CIFAR-100 under ImageNet (drastic for
    SVHN, modest for the CIFARs); the same was observed for RealNVP. The effect is not symmetric: CIFAR-10 does not get higher likelihood under a Glow trained on SVHN.'
  location: Motivating observations
  page: 4
  quote: This phenomenon is not symmetric.
- id: c3
  statement: 'VAE and PixelCNN were tested only on FashionMNIST vs MNIST and CIFAR-10 vs SVHN (VAE: the convolutional categorical variant of Rosca et al. 2018); in all four histograms the out-of-distribution
    log p(x) is shifted to higher values. GANs were excluded because evaluating their likelihood is an open problem. Evidence is histograms only, and how log p(x) was estimated for the VAE was not found
    in the text (searched ELBO, lower bound, importance).'
  location: Motivating observations
  page: 5
  quote: The red bars are shifted to the right in all four plots, signifying the behavior exists in spite of the differences between model classes.
- id: c4
  statement: The deeper analysis is restricted to flows because they give exact marginal likelihoods (unlike VAEs); decomposing NVP-Glow's likelihood first suggested the volume (log-determinant) term as
    the cause, but Glow with constant-volume (translation-only) transformations still gave SVHN higher likelihood.
  location: Digging deeper into the flow-based model
  page: 5
  quote: At ﬁrst this suggested the volume element was the primary cause of SVHN’s high likelihood, but further experiments with constant-volume ﬂows show the problem exists with them as well.
- id: c5
  statement: 'Ensembles did not remove the effect: hypothesizing that averaging over parameters may mitigate it, the authors trained five independently initialized Glow models and averaged their likelihoods,
    and obtained nearly identical results.'
  location: Digging deeper into the flow-based model
  page: 7
  quote: 'We see nearly identical results: SVHN is still assigned a higher likelihood than the CIFAR-10 training data.'
- id: c6
  statement: 'Explanation offered (conclusion of the second-order analysis of constant-volume Glow): SVHN ''sits inside'' CIFAR-10, with roughly the same mean and smaller variance, giving it higher likelihood;
    the authors say this also holds for the ImageNet results, that the likelihood differences agree with the variance differences, and that shrinking a dataset''s variance (graying the images) artificially
    increases its likelihood.'
  location: Second order analysis
  page: 8
  quote: Our conclusion is that SVHN simply "sits inside of" CIFAR-10—roughly same mean, smaller variance—resulting in its higher likelihood.
- id: c7
  statement: 'Conclusion and caveats: comparing likelihoods of deep generative models alone cannot identify the training set or inputs like it, so the authors urge caution; they state they cannot conclude
    it is a pathology of deep generative models, that the tested models seem to capture low-level statistics rather than high-level semantics, that alternative metrics (Choi & Jang) or modified training
    (Hendrycks et al.) can detect OOD inputs, and that the problem may be a fundamental limitation of high-dimensional likelihoods.'
  location: Discussion
  page: 9
  quote: We have shown that comparing the likelihoods of deep generative models alone cannot identify the training set or inputs like it.
- id: c8
  statement: 'Related evidence on tuning (citing Škvára et al. 2018, not this paper''s experiment): VAEs and GANs outperformed k-nearest neighbors for anomaly detection only when known outliers could be
    used for hyperparameter selection.'
  location: Related work
  page: 9
  quote: Škvára et al. (2018) experimentally compare VAEs and GANs against k-nearest neighbors (kNNs), showing that VAEs and GANs outperform kNNs only when known outliers can be used for hyperparameter
    selection.

proposes:
- A large human study (two-alternative forced choice, human error rate) of 41 generative models on CIFAR10, ImageNet, FFHQ and LSUN-Bedroom
- Replacing Inception-V3 with DINOv2 ViT-L/14 as the encoder for Fréchet distance and related metrics
- A released library (dgm-eval) computing 17 metrics for 9 encoders, plus the generated images and human evaluation data
claims:
- id: c1
  statement: 'Headline finding: in what the authors call the largest human experiment evaluating generative models to date, designed with psychophysics best practices, no existing metric strongly correlates
    with human evaluations of realism.'
  location: Abstract
  page: 1
  quote: Using best practices in psychophysics, we measure human perception of image realism for generated samples by conducting the largest experiment evaluating generative models to date, and find that
    no existing metric strongly correlates with human evaluations.
- id: c2
  statement: 'Human study design: each trial shows one image, either generated by one model or from the training set, and the participant chooses real or fake; models are scored by human error rate. The
    study targets realism only (not diversity or memorization), with over 1000 paid participants and 207k responses.'
  location: Human evaluation of generated data
  page: 4
  quote: Each trial is a two alternative forced choice task where a participant is shown either a generated image from one model, or an image from the training dataset, and must choose if it is real or
    fake.
- id: c3
  statement: 'Generation protocol: 100k images per model (equal per class for class-conditional models), using for each model the checkpoint and hyperparameters that achieved the lowest FID; only models
    trained without data external to the respective dataset are included.'
  location: Datasets, metrics, and encoders
  page: 3
  quote: We chose to generate 100k images from each model, with an equal number of images per-class for class conditional models, and used the checkpoints and hyperparameters that achieved the lowest FID
    for each model; Appendix A details the full generation procedure.
- id: c4
  statement: 'Model-type comparison (one-way ANOVAs per dataset, Bonferroni-corrected post hoc tests): diffusion models stand out on human error rate on all datasets except FFHQ, where they are on par (only
    GANs appeared in more than one FFHQ experiment); combined with FID rankings, diffusion models are judged most realistic but downranked by FID.'
  location: Human evaluation of generated data (Results and analysis)
  page: 5
  quote: Coupling the results in Table 1 with the FID rankings in Figure 2, we conclude that current diffusion models produce the most realistic images according to human perception, but are downranked
    by FID.
- id: c5
  statement: 'Encoder dependence: with Inception, FID prefers GANs over diffusion models, while Fréchet distance computed with self-supervised encoders trained on large, diverse data does not; this also
    holds on ImageNet. CLIP ViT-L/14, DINOv2 and MAE align much better with human error rate, SwAV relatively poorly, DreamSim except on ImageNet.'
  location: The (mis)alignment of evaluation metrics and human assessment
  page: 7
  quote: 'We find that diffusion models are often driving the discrepancy in alignment with human evaluation for the Inception network: FID prefers GANs over diffusion while FD determined by self-supervised
    models trained on very large and diverse datasets does not.'
- id: c6
  statement: 'Ruling out alternative explanations: per-class Vendi diversity scores do not explain the FID-human discrepancy on ImageNet, and human errors on real images are not correlated with rarity scores,
    so the authors treat human error rate as ground truth for fidelity. They also note FD with DINOv2 emphasizes fidelity more than diversity.'
  location: 'Alternative explanations: diversity, rarity, and memorization'
  page: 9
  quote: Combined with the diversity analysis above, this rules out diversity as an alternative explanation for the lack of alignment between human assessment and FID, and proves that alignment of FD metrics
    with human error rate is a desirable property for the studied generative models.
- id: c7
  statement: 'Memorization check: using the calibrated l2 distance of Carlini et al. [13] on 100k images from each of 41 models, most CIFAR10 models show exact memorization, while no conclusive pixel-wise
    memorization was found on ImageNet, FFHQ or LSUN-Bedroom (reconstructive memory was found on ImageNet and LSUN-Bedroom). The study was not designed to detect ''copy-paste'' combinations of training
    images.'
  location: Memorization
  page: 9
  quote: We found no conclusive evidence of pixel-wise memorization by any model on ImageNet, FFHQ, or LSUN-Bedroom, but found evidence of models exhibiting reconstructive memory on ImageNet and LSUN-Bedroom
    [101].
- id: c8
  statement: 'Memorization metrics: AuthPct, the CT score and FLS-POG are not reliable; with a test set substituted for the training set, CT and AuthPct behave almost the same, which the authors postulate
    reflects mode shrinkage and image fidelity rather than memorization. They recommend directly searching for memorized images with the calibrated l2 distance, though it is labour-intensive and requires
    tuning.'
  location: Memorization (Evaluating memorization metrics)
  page: 10
  quote: In conclusion, we find that none of AuthPct, the CT score, or FLS-POG is a reliable metric for memorization.
- id: c9
  statement: 'Limitations: human perception is taken as ground truth, but for uses such as data augmentation for classifiers the end user is a classifier; all datasets were 3-channel RGB images of human-identifiable
    objects, and transfer to medical, astronomical or other scientific data is open.'
  location: Limitations
  page: 17
  quote: It is an open question whether our proposed methods of evaluating generative models translate to e.g. medical images or astronomical images, which are also RGB, or more broadly to scientific data
    of N-dimensions.

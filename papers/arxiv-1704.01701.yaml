  notes: 'Selected for the topic article requested by the user (2026-10-03): algorithm design techniques (divide and conquer, dynamic programming, branch and bound, local search) and machine learning; carded
    by a subagent. Results tables not recorded; claims only. PDF states: Journal of Machine Learning Research 18 (2018). Objective R = misclassification + lambda * K (e.g. lambda = 0.01 equals misclassifying
    1% of data per extra rule). The authors report that the equivalent support and equivalent points bounds gave the most significant improvements, sometimes critical even on small problems (Summary and
    Future Work on Bounds); the authors state the approach can provide useful results even for incomplete executions, and that on the evaluated data sets CORELS is generally able to find an optimal rule
    list in seconds and certify optimality within about 10 minutes (Introduction); they report better or similar out-of-sample accuracy compared to CART and C4.5 on these data sets. They state MIP solvers
    in general cannot compete with CORELS'' speed on the Rudin and Ertekin MIP formulation (Related Work). Baselines'' defaults: CART cp = 0.01, C4.5 C = 0.25 (footnote). Datasets: ProPublica COMPAS (Broward
    County) recidivism and NYPD/NYCLU stop-and-frisk weapon prediction; class imbalance handled by resampling training sets for the weapon task. Timing on a single hardware thread of an Intel Xeon E5-2699
    v4 server. The authors note the models are predictive, not causal, and not suitable for policy-making on their own. Results not recorded.'

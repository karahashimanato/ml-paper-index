claims:
- id: c1
  statement: The paper applies Fuzzy Cognitive Maps to synthetic medical tabular data generation with explicit causality and privacy preservation.
  location: Abstract
  page: 1
  quote: This paper proposes a novel application of Fuzzy Cognitive Maps (FCMs) in a framework for synthetic medical tabular data generation with explicit causality and privacy preservation.
- id: c2
  statement: On UCI medical datasets the method is reported to be competitive under a train-on-synthetic-test-on-real protocol.
  location: Abstract
  page: 1
  quote: Experimental evaluation on UCI medical benchmark datasets demonstrates competitive performance under a Train-on-Synthetic-Test-on-Real (TSTR) protocol.
- id: c3
  statement: All baselines (Gaussian Copula, CTGAN, TVAE) use their default SDV configurations.
  location: Experimental setup
  page: 5
  quote: All baseline models were implemented using their default SDV configurations.
- id: c4
  statement: Each dataset uses a single 80/20 train-test split shared across methods.
  location: Experimental setup
  page: 5
  quote: For each dataset, a consistent train–test split of 80/20 was applied across all methods.
- id: c5
  statement: Models requiring extensive GPU resources were excluded from the comparison.
  location: Experimental setup
  page: 5
  quote: Models requiring extensive GPU resources were excluded to maintain consistent experimental conditions.
- id: c6
  statement: Gaussian Copula attains marginally higher fidelity in some cases, which the authors say is often accompanied by reduced predictive utility.
  location: Results
  page: 6
  quote: Although Gaussian Copula achieves marginally higher fidelity in certain cases, this is often accompanied by reduced predictive utility, whereas the proposed framework maintains a balanced trade-off
    between realism and downstream task performance.

  notes: 'Selected for the topic article requested by the user (2026-10-11): pitfalls in evaluating large language models (benchmark contamination and its detection, prompt and answer-format sensitivity,
    LLM-as-a-judge biases, human-preference arenas, holistic evaluation, benchmark errors, and reproducibility of evaluation harnesses). Carded by a subagent. Results tables not recorded; claims only. Affiliations:
    UC Berkeley, Stanford, UCSD (LMSYS). No venue is stated in the arXiv v1 PDF and the arXiv record has no comment or journal_ref; none recorded. Author names follow the arXiv record; the PDF prints ''Anastasios
    N. Angelopoulos'' and ''Michael I. Jordan''. Conflict of interest: the authors operate Chatbot Arena and its leaderboard and evaluate it themselves; LMSYS-developed Vicuna models (vicuna-33b, vicuna-13b,
    vicuna-7b) appear among the ranked models; the ''Arena Bench'' analysis uses the authors'' own LLM-as-a-judge method (Zheng et al., 2023b) with GPT-4-Turbo as judge, two judgments per prompt with positions
    swapped, against a GPT-3.5-Turbo-0301 baseline (Appendix D.3). Vote-quality setup (Section 6.3): 160 randomly selected battles of GPT-4-Turbo vs. Llama-2-13B and GPT-4-Turbo vs. GPT-3.5-Turbo-0613 relabeled
    blindly by experts (graduate students at UC Berkeley) with fact-checking. Votes are collected with non-uniform sampling concentrated on pairs with similar performance; BT estimation reweights by inverse
    pair-sampling probability to target a uniform distribution over pairs (Section 5). Scale as stated: data since April 2023, around 240K votes from over 90K users as of Jan 2024, more than 50 models,
    77% English and 5% Chinese; on average 8K votes per model. Statistics details (not recorded as claims): sandwich intervals chosen over pivot bootstrap because they are smaller in large samples (simulation
    in Appendix A); multiplicity correction makes intervals more conservative so both are reported (Figure 5 caption); replay of T = 213,576 votes; for active sampling the random baseline needs 54% (win
    matrix, precision 0.2) and 5% (score, precision 0.3) more data; anomalous-user detection reached e.g. 90% true positive and 60-70% true negative rate (Section 7.2). Section numbers are from numbered
    headings in the PDF. Win-rate, agreement and BT-interval figures/tables are not recorded.'

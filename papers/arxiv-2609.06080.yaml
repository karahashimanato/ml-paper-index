claims:
- id: c1
  statement: PhenoBench is a versioned collection of clinically grounded tasks with human-readable Task Cards and executable evaluation contracts.
  location: Introduction
  page: 2
  quote: PhenoBench contributes a versioned collection of 90 clinically grounded tasks across 15 domains and 26 input modalities, with human-readable Task Cards and executable evaluation contracts.
- id: c2
  statement: Under a fixed single-estimator protocol with bounded tuning, the pretrained tabular models ranked above the evaluated task-specific baselines, including XGBoost and CatBoost, in aggregate.
  location: Abstract
  page: 1
  quote: Under a fixed single-estimator protocol with bounded tuning, these models ranked above the evaluated task-specific baselines, including XGBoost and CatBoost, in aggregate.
- id: c3
  statement: The XGBoost and CatBoost grids were fixed before the matched comparison, selected by five-fold cross-validation within the training split, and evaluated once on the held-out test split.
  location: Appendix (method configurations)
  page: 15
  quote: The XGBoost and CatBoost grids were fixed before their matched campaign, selected by five-fold cross-validation within the training split, and evaluated once on the held-out test split.
- id: c4
  statement: The tabular comparison uses a single-estimator CPU float32 protocol rather than each model's strongest recommended ensemble.
  location: Limitations
  page: 9
  quote: The tabular comparison evaluates a single-estimator CPU float32 protocol, not each model’s strongest recommended ensemble.
- id: c5
  statement: XGBoost and CatBoost received the same bounded 12-candidate tuning budget rather than exhaustive library-specific optimization, so the small average gains do not settle the best attainable
    performance of either model family.
  location: Limitations
  page: 9
  quote: XGBoost and CatBoost used the same bounded 12-candidate tuning budget rather than exhaustive library-specific optimization.

  notes: 'Selected for the topic article requested by the user (2026-10-03): model fallback and model selection in MLOps (meta-learned selection, dynamic selection, abstention/deferral, switching triggers,
    cascades/routing, monitoring); carded by a subagent. Results tables not recorded; claims only. PDF states: ACM Computing Surveys, 2022, https://doi.org/10.1145/3533378. Affiliations (PDF): University
    of Cambridge (Paleyes, Lawrence) and Cambridge Spark (Urma, a company). Acknowledgments: funding for A.P. and N.L. from a Senior AI Fellowship of the Alan Turing Institute and UKRI. Model-deployment
    challenges are grouped as integration, monitoring (feedback loops, outlier detection, custom design tooling) and updating (concept drift, continuous delivery) in Table 1. The survey points to dataset-shift
    detection libraries/services (Rabanser et al. methods implemented in Alibi Detect, Azure ML, AWS SageMaker) in its Discussion of potential solutions. Searched the full text for rollback, roll back,
    fallback, fall back, canary, shadow, A/B, replace, revert, previous model, champion and challenger: no description of rolling back to a previous model or switching to a fallback model at serving time.
    The only related hits are ''replacement'' in other senses (simulation is not a full replacement for real-world testing; an ML solution replacing a previous pen-and-paper method in the Firebird case
    study; replacing micro-service architectures with dataflow architectures). Updating (c6) is discussed in terms of when to retrain, continuous delivery and backward compatibility, not rollback. The Klaise
    et al. [72] paper cited in c4 is carded as arxiv-2007.06299. Conclusion notes a relative shortage of deployment experience reports in the academic literature. Tag note: the family tag automl-systems
    is a PLACEHOLDER and does not describe this paper (that tag is for AutoML systems that search over and ensemble model types; this survey only mentions AutoML tools briefly in its Discussion of potential
    solutions and evaluates no AutoML system). No existing family tag fits; a user decision on a new tag is pending.'

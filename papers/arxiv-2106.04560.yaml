proposes:
- characterization of the error-rate vs compute frontier of ViT as a double-saturating power law
- improved large-scale ViT training recipe and the ~2B-parameter ViT-G/14
claims:
- id: c1
  statement: 'Experimental range: models from five million to two billion parameters, datasets from one million to three billion training images, and compute from below one to beyond 10,000 TPUv3 core-days;
    the frontier is characterized on two datasets (the paper names public ImageNet-21k and proprietary JFT-3B elsewhere).'
  location: Introduction
  page: 1
  quote: In particular, we experiment with models ranging from ﬁve million to two billion parameters, datasets ranging from one million to three billion training images and com-pute budgets ranging from
    below one TPUv3 core-day to beyond 10 000 core-days.
- id: c2
  statement: 'Cost measurement: since all models were trained on TPUv3, total compute is measured in TPUv3 core-days (not FLOPs).'
  location: Core Results
  page: 2
  quote: All models are trained on TPUv3, thus total compute is measured in TPUv3 core-days.
- id: c3
  statement: 'Main claim: with enough training data, the ViT performance-compute frontier roughly follows a saturating power law.'
  location: Conclusion
  page: 8
  quote: We demonstrate that the performance-compute frontier for ViT models with enough training data roughly follows a (saturating) power law.
- id: c4
  statement: 'Compute allocation: for ViT within the studied range, staying on the frontier requires scaling compute and model size together; not increasing model size when extra compute is available is
    suboptimal.'
  location: Conclusion
  page: 8
  quote: Crucially, in order to stay on this frontier one has to simultaneously scale compute and model size; that is, not increasing a model’s size when extra com-pute becomes available is suboptimal.
- id: c5
  statement: 'Sample efficiency: bigger models reach the same error with fewer seen images, and the authors suggest that with sufficient data, training a larger model for fewer steps is preferable, mirroring
    results in language modeling and machine translation.'
  location: Big models are more sample efficient
  page: 3
  quote: Our results suggest that with sufﬁcient data, training a larger model for fewer steps is preferable.
- id: c6
  statement: 'Data limitation: the scaling-law study uses the proprietary JFT-3B dataset; to make the insights more reliable, the authors verify that the scaling laws also apply on public ImageNet-21k.'
  location: Discussion (Limitations)
  page: 8
  quote: This work uses the proprietary JFT-3B dataset for the scaling laws study.
- id: c7
  statement: 'Scope caveat: the conclusions may not generalize beyond the studied scale or beyond the ViT model family.'
  location: Conclusion
  page: 8
  quote: Note, that our conclusions may not necessarily generalize beyond the scale we have studied and they may not generalize beyond the ViT family of models.

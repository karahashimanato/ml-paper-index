id: arxiv-2305.02997
title: When Do Neural Nets Outperform Boosted Trees on Tabular Data?
authors:
- Duncan McElfresh
- Sujay Khandagale
- Jonathan Valverde
- Vishak Prasad C
- Benjamin Feuer
- Chinmay Hegde
- Ganesh Ramakrishnan
- Micah Goldblum
- Colin White
year: 2023
venue: NeurIPS 2023 Datasets and Benchmarks Track
links:
  arxiv: https://arxiv.org/abs/2305.02997
  code: https://github.com/naszilla/tabzilla
source:
  version: arXiv v4
  retrieved_at: '2026-10-02'
  pdf_sha256: b2c765b3bc4b0cc628a98151197be250cfb2aa1515d1a3fbc0c6c2aea527930a
tags:
  tasks:
  - tabular-classification
  method_families:
  - gradient-boosted-trees
  - tabular-mlp
  - tabular-attention
  - differentiable-trees
  - tabular-foundation-model
  - random-forests
  - linear-models
  paradigms:
  - supervised
  - in-context-learning
proposes:
- TabZilla Benchmark Suite (36 hard OpenML classification datasets)
claims:
- id: c1
  statement: 'The ''NN vs. GBDT'' debate is overemphasized: for many datasets the GBDT-NN difference is negligible or light GBDT tuning matters more than the choice.'
  location: Abstract
  page: 1
  quote: we find that the 'NN vs. GBDT' debate is overemphasized
- id: c2
  statement: Light hyperparameter tuning of a GBDT is often more important than choosing between NNs and GBDTs.
  location: Abstract
  page: 1
  quote: light hyperparameter tuning on a GBDT is more important than choosing between NNs and GBDTs
- id: c3
  statement: TabPFN outperformed all other algorithms on average, even when only a random 3000-sample subset of the training data was used.
  location: Abstract
  page: 1
  quote: we find that it outperforms all other algorithms on average, even when randomly sampling 3000 training datapoints.
- id: c4
  statement: GBDTs handle skewed or heavy-tailed feature distributions and other dataset irregularities much better than NNs.
  location: Abstract
  page: 1
  quote: GBDTs are much better than NNs at handling skewed or heavy-tailed feature distributions and other forms of dataset irregularities.
- id: c5
  statement: For about one-third of datasets, light tuning (30 random-search iterations) of CatBoost improved performance more than choosing between the best default GBDT and NN.
  location: Section 2.1
  page: 7
  quote: Surprisingly, light hyperparameter tuning yields a greater performance improvement than GBDT-vs-NN selection for about one-third of all datasets.
- id: c6
  statement: GBDTs performed comparatively better than NNs and baselines on larger datasets.
  location: Section 2.2
  page: 8
  quote: Throughout our metafeature analyses, we find that GBDTs perform comparatively better than NNs and baselines with larger datasets.
- id: c7
  statement: 'Authors'' recommendation: try simple baselines first, then lightly tune CatBoost.'
  location: Section 2.2
  page: 9
  quote: first try simple baselines, and then conduct light hyperparameter tuning on CatBoost.
- id: c8
  statement: Each dataset uses the ten train/test folds provided by OpenML (comparable with other works using the same folds).
  location: Section 2
  page: 4
  quote: For each dataset, we use the ten train/test folds provided by OpenML
- id: c9
  statement: Each algorithm was evaluated with at most 30 hyperparameter sets (default + 29 random via Optuna), up to 10 hours per algorithm and split.
  location: Section 2
  page: 4
  quote: we train and evaluate the algorithm with at most 30 hyperparameter sets (one default set and 29 random sets, using Optuna [3]).
- id: c10
  statement: The 98-dataset comparison excludes datasets on which many algorithms hit memory or time limits.
  location: Section 2.1
  page: 5
  quote: while excluding datasets which ran into memory or timeout issues on a nontrivial number of algorithms
- id: c11
  statement: On the 57 smallest datasets (<=1250 instances), TabPFN had the best average performance and the fastest training time.
  location: Section 2.1
  page: 5
  quote: Now, we find that TabPFN achieves the best average performance of all algorithms, while also having the fastest training time.
- id: c12
  statement: The text states CatBoost's average rank is 5.06 (Table 1 shows a mean rank of 5.50 for CatBoost; the paper is inconsistent).
  location: Section 2.1
  page: 5
  quote: The fact that the best out of all algorithms, CatBoost, only achieved an average rank of 5.06
- id: c13
  statement: The text says Figure 3 uses accuracy and Table 1 log loss, but the Figure 3 caption says log loss and the Table 1 caption says accuracy (inconsistent).
  location: Section 2.1
  page: 6
  quote: Note that the slight differences between Figure 3 and Table 1 is that the former uses accuracy, while the latter uses log loss.
- id: c14
  statement: By log-loss rank with Wilcoxon signed-rank tests (Holm-Bonferroni), TabPFN outperformed all other algorithms across the 98 datasets with statistical significance.
  location: Section 2.1, Figure 3
  page: 6
  quote: We find that TabPFN outperforms all other algorithms on average across 98 datasets, and this result is statistically significant.
- id: c15
  statement: TabPFN was run on larger datasets by randomly subsampling 3000 training samples (TabPFN*).
  location: Section 2
  page: 3
  quote: In order to run on datasets of size larger than 3000, we simply take a random sample of size 3000 from the full training dataset.
- id: c16
  statement: Dataset sizes range from 32 to 1,025,009 (vs. 3,000-10,000 or 50,000 in Grinsztajn et al.).
  location: Section 1
  page: 3
  quote: in contrast to our dataset sizes which range from 32 to 1 025 009
- id: c17
  statement: TabPFN was excluded from the GBDT-vs-NN family analyses because it works differently from other NNs.
  location: Section 2.1 footnote
  page: 7
  quote: we exclude it from our analysis in this section and the next section when discussing 'GBDTs vs. NNs.'
- id: c18
  statement: The TabZilla Benchmark Suite consists of the 36 'hardest' of the 176 datasets.
  location: Section 3
  page: 9
  quote: a collection of the 36 'hardest' of the 176 datasets we studied in Section 2.
- id: c19
  statement: All 176 datasets are classification datasets from OpenML.
  location: Section 2
  page: 4
  quote: We run the algorithms on 176 classification datasets from OpenML
- id: c20
  statement: 'Across datasets, accuracy is aggregated with the average distance to the minimum (ADTM): per-dataset 0-1 scaling after selecting the best hyperparameters.'
  location: Section 2
  page: 5
  quote: we use the average distance to the minimum (ADTM) metric, which consists of 0-1 scaling
- id: c21
  statement: The study compares 19 algorithms on 176 datasets.
  location: Abstract
  page: 1
  quote: comparing 19 algorithms across 176 datasets

id: arxiv-2106.03253
title: 'Tabular Data: Deep Learning is Not All You Need'
authors:
- Ravid Shwartz-Ziv
- Amitai Armon
year: 2021
links:
  arxiv: https://arxiv.org/abs/2106.03253
source:
  version: arXiv v2
  retrieved_at: '2026-10-02'
  pdf_sha256: 59db02f2323ba7289a43673c57fb2a77d588713b2043d719eb56e681d551a5c8
tags:
  tasks:
  - tabular-classification
  - tabular-regression
  method_families:
  - gradient-boosted-trees
  - tabular-attention
  - differentiable-trees
  - tabular-cnn
  - heterogeneous-ensembles
  paradigms:
  - supervised
proposes:
- Ensemble of deep tabular models and XGBoost (uniform or validation-loss weighted averaging)
claims:
- id: c1
  statement: XGBoost outperformed the four deep tabular models (TabNet, NODE, DNF-Net, 1D-CNN) across the 11 datasets, including datasets from the deep models' own papers.
  location: Abstract
  page: 1
  quote: Our study shows that XGBoost outperforms these deep models across the datasets, including the datasets used in the papers that proposed the deep models.
- id: c2
  statement: XGBoost needed much less hyperparameter tuning than the deep models.
  location: Abstract
  page: 1
  quote: We also demonstrate that XGBoost requires much less tuning.
- id: c3
  statement: An ensemble of the deep models and XGBoost performed better than XGBoost alone on these datasets.
  location: Abstract
  page: 1
  quote: we show that an ensemble of deep models and XGBoost performs better on these datasets than XGBoost alone.
- id: c4
  statement: Each deep model did best only on the datasets from its own paper; no deep model was consistently better than the others.
  location: Section 3.2
  page: 6
  quote: Each deep model was better only on the datasets that appeared in its own paper.
- id: c5
  statement: Authors name selection bias in the original papers (datasets chosen where the model works well) as one possible explanation.
  location: Section 3.2
  page: 6
  quote: The first possibility is selection bias.
- id: c6
  statement: Authors name unequal hyperparameter optimization in the original papers as a second possible explanation.
  location: Section 3.2
  page: 6
  quote: The second possibility is differences in the optimization of hyperparameters.
- id: c7
  statement: All models were tuned with HyperOpt (Bayesian optimization) for 1,000 steps per dataset on a validation set.
  location: Section 3.1.2
  page: 4
  quote: The hyperparameter search was run for 1, 000 steps on each dataset by optimizing the results on a validation set.
- id: c8
  statement: XGBoost trained/tuned more than an order of magnitude faster than the deep models in their runs; authors caution this depends on software optimization.
  location: Section 3.2
  page: 7
  quote: Generally, we found XGBoost to be significantly faster than the deep networks in our experiments (more than an order of magnitude).
- id: c9
  statement: An ensemble of classical models (XGBoost, SVM, CatBoost) was reported to perform much worse than the deep-models-plus-XGBoost ensemble.
  location: Section 3.2
  page: 7
  quote: Table 2 shows that the ensemble of classical models performed much worse than the ensemble of deep networks and XGBoost.
- id: c10
  statement: On Shrutime, choosing ensemble members by validation loss needed only three models for near-optimal performance.
  location: Section 3.2, Figure 1
  page: 7
  quote: Only three models were needed to achieve almost optimal performance this way.
- id: c11
  statement: The text says the regression metric is RMSE.
  location: Section 3.1.2
  page: 5
  quote: For regression problems, we report the root mean square error.
- id: c12
  statement: The Table 2 caption says MSE is shown for YearPrediction and Rossman (inconsistent with the RMSE statement in Section 3.1.2).
  location: Table 2 caption
  page: 6
  quote: MSE is presented for the YearPrediction and Rossman datasets

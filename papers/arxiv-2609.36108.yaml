claims:
- id: c1
  statement: LoopICL is a looped transformer whose design decouples parameter count from computational depth.
  location: Abstract
  page: 1
  quote: We introduce LoopICL, a looped transformer whose core design decouples parameter count from computational depth.
- id: c2
  statement: In its standard setting, LoopICL performs competitively with TabICLv2 on TabArena and TALENT at the same FLOPs while using far fewer parameters.
  location: Abstract
  page: 1
  quote: In its standard setting, LoopICL performs competitively with TabICLv2 on TabArena and TALENT at the same computational cost (FLOPs), while using nearly 90% fewer parameters.
- id: c3
  statement: Ablations use intermediate checkpoints evaluated on synthetic prior tasks and on 10 folds of the 54-dataset development set used by TabICLv2 and TabPFNv2, without ensembling.
  location: Experiments
  page: 6
  quote: We study classification performance averaged across 1,000 synthetic tasks sampled from the prior and across 10 folds of the 54 development set used in TabICLv2 and TabPFNv2 (Hollmann et al., 2025)
    , without any ensembling.
- id: c4
  statement: The final comparison is on TabArena and TALENT, with LoopICL evaluated as an ensemble of 8 members.
  location: Experiments
  page: 8
  quote: We evaluate LoopICL using an ensemble of 8 members.
- id: c5
  statement: On TALENT all models are run on an A100 under identical conditions; on TabArena competitor runtimes are taken from the published benchmark and should not be used for direct runtime comparison.
  location: Experiments (Figure 7 caption)
  page: 9
  quote: For TabArena, competitor runtimes are taken from the published benchmark and may reflect different hardware; these results should not be used for direct runtime comparisons of LoopICL with other
    baselines.
- id: c6
  statement: The current model supports classification only; regression is left for future work.
  location: Limitations
  page: 10
  quote: The current model supports classification tasks; extending it to regression tasks is left for future work.

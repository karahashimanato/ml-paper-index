claims:
- id: c1
  statement: The paper proposes a correspondence score to assess whether learned patient representations preserve clinically meaningful relationships in the original data.
  location: Abstract
  page: 1
  quote: Therefore, we propose a correspondence score to assess whether learned patient representations preserve clinically meaningful relationships observed in the original data.
- id: c2
  statement: Representations from five tabular foundation models and six classical transformation techniques were assessed on four datasets.
  location: Abstract
  page: 1
  quote: Representations generated by five tabular foundation models and six classical transformation techniques were assessed across four datasets to evaluate the robustness and consistency of correspondence
    estimates across different patient populations and data distributions.
- id: c3
  statement: The models labeled foundation models preserved correspondence more consistently than classical approaches, with reported improvements from about 5% to over 125%.
  location: Abstract
  page: 2
  quote: Foundation models preserved correspondence more consistently than classical approaches, with improvements ranging from approximately 5% to over 125%, providing principled, pre-deployment justification
    for method selection.
- id: c4
  statement: The evaluated 'foundation models' are deep tabular architectures trained within the experimental setting, not pretrained on large external tabular corpora.
  location: Results
  page: 23
  quote: The evaluated models represent widely used deep tabular architectures and were trained within the experimental setting rather than being pretrained on large external tabular corpora.
- id: c5
  statement: Metric weights of the score are learned per dataset and transformation direction with Bayesian optimization.
  location: Correspondence Score
  page: 15
  quote: We therefore use Bayesian optimization to learn a dataset-specific weight vector over the direction-specific metrics, separately for reduction and expansion.
- id: c6
  statement: 'Stated limitation: the empirical evaluation focuses on routine blood count data.'
  location: Generalizability and limitations
  page: 27
  quote: The empirical evaluation in this study focuses on routine blood count data, a well-standardized clinical modality available across institutions and with established clinical interpretation.

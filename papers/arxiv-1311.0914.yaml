proposes:
- 'DC-SVM: partition the kernel SVM dual by (two-step) kernel k-means, solve the per-cluster subproblems independently, and use the concatenated solution to warm-start a global coordinate descent solver;
  multilevel version with adaptive clustering on support vectors and an early-prediction mode that predicts with the nearest cluster''s model'
claims:
- id: c1
  statement: 'Partition scheme and its justification: the paper shows that kernel k-means clustering minimizes the difference between the subproblem solution and the whole-problem solution, and that support
    vectors found in the subproblems are very likely to be support vectors of the whole problem.'
  location: Introduction
  page: 1
  quote: We theoretically show that the kernel kmeans algorithm is able to minimize the diﬀerence between the solution of subproblems and of the whole problem, and support vectors identiﬁed by subproblems
    are very likely to be support vectors of the whole problem.
- id: c2
  statement: 'Conquer step: the local subproblem solutions are not just combined but used to initialize a global coordinate descent solver on the full problem, which the analysis suggests converges quickly
    from that start.'
  location: Abstract
  page: 1
  quote: In the conquer step, the local solutions from the subproblems are used to initialize a global coordinate descent solver, which converges quickly as suggested by our analysis.
- id: c3
  statement: 'Exactness (top level only): the authors state that, unlike model-combination approaches such as BCM, DC-SVM solves the original SVM problem, not just an approximated one; this holds when the
    global coordinate descent is run at the top level on the whole problem, not for the DC-SVM (early) prediction mode, which uses the lower-level (approximate-kernel) models.'
  location: Related Work
  page: 2
  quote: More importantly, DC-SVM solves the original SVM problem, not just an approximated one.
- id: c4
  statement: 'Assumption behind the guarantee: the approximation bound (Theorem 1) depends on D(pi), the sum of absolute between-cluster kernel values, which is strongly related to the kernel parameters
    (for the RBF kernel, small gamma makes D(pi) larger and the subproblem solution may not be close to the optimum).'
  location: Experimental Results
  page: 12
  quote: As shown in Theorem 1 the quality of approximation depends on D(π), which is strongly related to the kernel parameters.
- id: c5
  statement: 'What is traded for speed in early prediction: DC-SVM (early) stops at a lower level and classifies a test point with the model trained on its nearest cluster only, i.e. it uses the block-diagonal
    approximate kernel instead of the exact SVM solution.'
  location: Divide and Conquer SVM with multiple levels
  page: 8
  quote: 'Therefore, the testing procedure for early prediction is: (1) ﬁnd the nearest cluster that x belongs to, and then (2) use the model trained by data within that cluster to compute the decision
    value.'
- id: c6
  statement: 'Main empirical claim: DC-SVM reduces the SVM objective faster than state-of-the-art exact SVM solvers (relative error measured against LIBSVM run to 1e-8 accuracy); online and approximate
    solvers are excluded from this objective comparison because they do not solve the exact problem.'
  location: Experimental Results
  page: 12
  quote: We observe that DC-SVM achieves faster convergence in objective function compared with the state-of-the-art exact SVM solvers.
- id: c7
  statement: 'Protocol: C and the kernel parameter gamma are chosen by 5-fold cross-validation on a grid (2^-10..2^10 for most datasets; smaller gammas for the unscaled image datasets cifar and mnist8m).'
  location: Experimental Results
  page: 10
  quote: We chose the balancing parameter C and kernel parameter γ by 5-fold cross validation on a grid of points
- id: c8
  statement: 'Kernel SVM dual (Eq. 1): with labels y_i in {1, -1}, training solves min_alpha f(alpha) = (1/2) alpha^T Q alpha - e^T alpha subject to 0 <= alpha <= C, where Q_ij = y_i y_j K(x_i, x_j), e
    is the all-ones vector and C balances loss and regularization in the primal; the bias term is ignored.'

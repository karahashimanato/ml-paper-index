  notes: 'Selected for the topic article requested by the user (2026-10-06): anomaly detection, classical vs deep (benchmarks, isolation-based methods, self-supervised and one-class deep methods, industrial
    image anomaly detection). Carded by a subagent. Results tables not recorded; claims only. Affiliations: UC Berkeley, University of Chicago, Oregon State University. Venue from the PDF header (''Published
    as a conference paper at ICLR 2019'') and the arXiv comment. Setting is OOD detection for (mostly) multiclass classifiers trained on labeled in-distribution data (SVHN, CIFAR-10/100, Tiny ImageNet,
    Places365, 20 Newsgroups, TREC, SST) plus language models; it is not a one-class benchmark. OE datasets: 80 Million Tiny Images with CIFAR images removed, ImageNet-22K with ImageNet-1K removed, WikiText-2.
    Base rate of test outliers to test inliers is 1:5 in all experiments. Most results are averages over 10 runs. OE is mostly applied by fine-tuning a pre-trained network (10 epochs for vision); Appendix
    C reports training from scratch with OE tends to be better but needs more time and sometimes more GPU memory. Related work notes that Liang et al. (2018) and Lee et al. (2018) tune on samples from each
    test outlier distribution, so results are not directly comparable. Builds on the MSP baseline by the first author (arxiv-1610.02136). Section 4.1 is confirmed by ''described in Section 4.1'', 4.3 by
    ''we found in Section 4.3'' and 5 by ''In Section 5 we note''; other locations use section names. Results tables not recorded.'

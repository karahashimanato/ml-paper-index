proposes:
- 'A taxonomy of deep learning for heterogeneous tabular data: data transformation methods (single- and multi-dimensional encodings), specialized architectures (hybrid models, split into fully and partly
  differentiable, and transformer-based models), and regularization models'
- An open benchmark (TabSurvey code) comparing classical models and GBDTs with deep tabular models on five public datasets (HELOC, Adult, HIGGS, Covertype, California Housing), including run time, model
  size and an attribution-fidelity test of attention-based explanations
claims:
- id: c1
  statement: 'The authors identify four possible reasons why deep learning on tabular data falls short of its success elsewhere: low-quality training data (missing values, outliers, inconsistencies, small
    size, class imbalance), missing or complex irregular spatial dependencies between features, dependency on preprocessing (especially of categorical features), and the importance of single features (a
    small change of one categorical feature can flip a prediction, which decision trees handle by selecting single features and thresholds).'
  location: Section III-C
  page: 4
  quote: 'In the following, we identify and discuss four possible reasons:'
- id: c2
  statement: 'Taxonomy: works on deep learning for tabular data are divided into three main categories: data transformation methods, specialized architectures, and regularization models.'
  location: Section III-D
  page: 5
  quote: 'We divide the works from the deep learning with tabular data literature into three main categories: data transformation methods, specialized architectures, and regularization models.'
- id: c3
  statement: 'Tuning protocol of their benchmark: each model is tuned with Optuna for 100 iterations, each hyperparameter configuration is cross-validated with five folds, and the search spaces are based
    on the corresponding papers and recommendations from the frameworks'' authors (published with the code).'
  location: Section VII-B1
  page: 13
  quote: Each hyperparameter conﬁguration was cross-validated with ﬁve folds.
- id: c4
  statement: 'Preprocessing is the same for every model: zero-mean unit-variance normalization of numerical features and ordinal encoding of categorical features (citing Hancock & Khoshgoftaar that this
    encoding performs comparably to more advanced methods); missing values are replaced by zeros for linear regression and pure neural networks; categorical features are explicitly specified for LightGBM,
    DeepFM, DeepGBM, TabNet, TabTransformer and SAINT.'
  location: Section VII-B2
  page: 13
  quote: We apply the ordinal encoding to categorical values for all models.
- id: c5
  statement: 'Benchmark result (5 datasets): for all but the very large HIGGS dataset, the best scores are obtained by boosted decision tree ensembles; XGBoost and CatBoost outperform all deep learning
    approaches on the small and medium datasets, the regression dataset and the multi-class dataset.'
  location: Section VII-B4
  page: 13
  quote: For all but the very large HIGGS data set, the best scores are still obtained by boosted decision tree ensembles.
- id: c6
  statement: On HIGGS (11 million rows, only numerical features) SAINT outperforms the classical approaches, which the authors say suggests that for very large tabular datasets with predominantly continuous
    features, modern neural architectures may have an advantage.
  location: Section VII-B4
  page: 13
  quote: This suggests that for very large tabular data sets with predominantly continuous features, modern neural network architectures may have an advantage over classical approaches after all.
- id: c7
  statement: 'Run time: training time of gradient-boosting models is lower than that of most deep models, but on HIGGS their inference time is significantly higher; all gradient-boosting and deep models
    were trained on the same GPU.'
  location: Section VII-C
  page: 13
  quote: for XGBoost, the inference time amounts to 5995 seconds whereas inference times for MLP and SAINT are 10.18 and 282 seconds respectively.
- id: c8
  statement: 'Interpretability check of attention-based attributions (TabTransformer, SAINT): after a feature-removal fidelity test (MoRF/LeRF) and a comparison with KernelSHAP whose Spearman rank correlation
    with the models'' attributions was surprisingly low and sometimes negative, the authors conclude that the transformer models did not produce convincing attributions out of the box and that more profound
    benchmarks of claimed interpretability are necessary.'
  location: Section VII-D
  page: 14
  quote: In these two simple benchmarks, the transformer models were not able to produce convincing feature attributions out-of-the-box.
- id: c9
  statement: 'Stated limitation: the benchmark uses common datasets with varying characteristics, but a different choice of datasets or of hyperparameters such as the categorical encoding (e.g. one-hot)
    may lead to a different outcome; the authors call for standardized benchmarking, noting that the eighteen works in their Table II use over 100 different datasets.'
  location: Section VIII-A
  page: 16
  quote: While we chose common data sets with varying characteristics for our experiments, a different choice of data sets or hyperparameter such as the encoding use (e.g., use one-hot encoding) may lead
    to a different outcome.

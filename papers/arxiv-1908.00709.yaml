  notes: 'Selected for the method article requested by the user (2026-10-10): AutoML systems and neural architecture search (CASH, pipeline search, ensembling/stacking, meta-learning warm starts, cost-aware
    search, AutoML benchmarks, NAS with RL/evolution/weight sharing/differentiable search, and NAS evaluation/reproducibility). Carded by a subagent. Results tables not recorded; claims only. Affiliation:
    Hong Kong Baptist University. Venue from the arXiv journal_ref (''Knowledge-Based Systems, Volume 212, 5 January 2021, 106622'') and comment; the v6 PDF footer reads ''Preprint submitted to Knowledge-Based
    Systems, April 19, 2021''. Year is the first arXiv version (2019); the PDF does not state the journal publication year (the journal_ref gives 2021). Other open problems listed in Section 7: flexible
    search spaces free of human bias (7.1), exploring more areas beyond image classification (7.2), interpretability (7.3), robustness to noisy/adversarial data (7.5), a complete AutoML pipeline (7.7; TPOT,
    Auto-WEKA and Auto-sklearn are described as searching only traditional ML models), and lifelong learning (7.8). The survey describes Zela et al. [34] as showing a weak correlation between performance
    after short and long training (Section 5.1); this is the survey''s characterization, not checked against that paper. The CIFAR-10/ImageNet performance tables (Tables 3 and 4) are compilations of numbers
    reported in other papers and are not recorded. Section 6.3 also describes coupled one-shot optimization as introducing bias in architecture distribution and supernet weights (citing [197, 229]) and
    multimodel forgetting (citing [230]); Section 7.6 repeats joint HAO as an open problem. No experiments of its own; no conflict of interest identified.'

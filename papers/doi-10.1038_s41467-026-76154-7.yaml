claims:
- id: c1
  statement: An auxiliary nonlinear 'null' model predicts the phenotype from covariates alone, and its prediction is added as a covariate in downstream analysis.
  location: Abstract
  page: 1
  quote: We adopt a null model approach where an auxiliary nonlinear model predicts phenotypes from covariates alone.
- id: c2
  statement: On 16 UK Biobank phenotypes, gradient-boosted tree null models with spatiotemporal features improve covariate modeling.
  location: Abstract
  page: 1
  quote: Using 16 phenotypes in the UK Biobank, we show gradient boosted decision tree nulls including spatiotemporal features improve covariate modeling.
- id: c3
  statement: Participants are randomly split 8:1:1 into train, validation and test sets; null models are trained and evaluated with five-fold cross-validation on the training set only, keeping validation
    and test sets for the downstream polygenic-score task.
  location: Results
  page: 3
  quote: just the training set was used to train and evaluate the null models on their own using ﬁve-fold cross-validation.
- id: c4
  statement: XGBoost variants were the default parameters plus two larger configurations (up to 1000 or 2500 estimators, lower learning rate, max depth 4), all with early stopping.
  location: Results
  page: 2
  quote: The three variations consisted of the default XGBoost parameters (a maximum of 100 estimators and a learning rate of 0.3), as well as two larger versions with up to 1000 or 2500 estimators, both
    using a learning rate reduced to 0.25 and a maximum depth of 4 to mitigate overﬁtting.
- id: c5
  statement: Under a Friedman test with Nemenyi post-hoc comparisons, the original DeepNull neural network ranked second-worst, ahead only of LASSO.
  location: Results
  page: 4
  quote: By average rank, the original DeepNull neural network was the second-worst performer, only outperforming the LASSO regression and signiﬁcantly worse than all other model variations.
- id: c6
  statement: Training and polygenic-score evaluation used only individuals of White British ancestry in the UK Biobank.
  location: Discussion (limitations)
  page: 9
  quote: First, the training and PGS evaluation were conducted exclusively on individuals of White British ancestry in the UK Biobank.

claims:
- id: c1
  statement: On a 7.34M-parameter Do-PFN, the selected prior gives a significant gain on the primary evaluation domain (5 paired seeds), with error below the uninjected official base.
  location: Abstract
  page: 1
  quote: On a 7.34M-parameter Do-PFN, the framework’s winner attains a formally significant 2.75× gain on the primary evaluation domain (n = 5 paired seeds, p = 0.0086), and its error falls below that of
    the uninjected official base.
- id: c2
  statement: 'The comparison with the official base is only descriptive: the winner is built on a locally retrained base and the official base is not part of the paired test.'
  location: Abstract
  page: 1
  quote: Because the winner is built on a locally retrained base and the official base is not part of the paired test, this is a descriptive cross-lineage comparison.
- id: c3
  statement: Injection gives significant gains only when the base is underfit on the task domain, the prior domain matches the task domain, and the task lies within the support of the base's training prior.
  location: Abstract
  page: 1
  quote: injection yields significant gains only when the base is underfit on the task domain, the prior domain matches the task domain, and the task lies within the support of the base’s training prior.
- id: c4
  statement: The primary and adjacent evaluation domains are synthetic/proprietary causal benchmarks whose generation mechanism and release policy are not yet stated.
  location: Reproducibility Statement
  page: 25
  quote: The primary domain law_race and the adjacent domain sales are synthetic/proprietary causal benchmarks with ground-truth graphs; their generation mechanism and release policy will be stated in the
    released materials.
- id: c5
  statement: Baselines (CausalPFN and classical estimators such as S/T/X/DR-learners and CausalForestDML) are run under the same 5-fold split and protocol; baseline hyperparameter tuning was not found in
    the text.
  location: External validity
  page: 19
  quote: On our two domains, we compare against the direct SOTA (CausalPFN [3]) and a classical-estimator panel (S/T/X/DR-learner [13, 11], CausalForestDML [2], naive ATE) under the same 5-fold split and
    the same protocol as model training.
- id: c6
  statement: On standard causal benchmarks (IHDP, Lalonde), the injection method is not superior to, and often worse than, existing methods.
  location: Discussion
  page: 23
  quote: 'We state plainly: on standard causal benchmarks, our injection method is not superior to, and is often inferior to, existing methods.'

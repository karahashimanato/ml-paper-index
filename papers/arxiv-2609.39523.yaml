claims:
- id: c1
  statement: The paper studies causal foundation models that combine observational and surrogate-interventional data to predict a conditional interventional distribution.
  location: Abstract
  page: 1
  quote: This work studies CFMs as a method to combine finite observational and surrogate-interventional datasets in order to predict a target conditional interventional distribution (CID) more accurately
    than with observational data alone.
- id: c2
  statement: Results show strong CID prediction and that experimental context can improve over observational data alone.
  location: Abstract
  page: 1
  quote: Our results demonstrate strong CID prediction performance and show that incorporating experimental context can improve predictions over observational data alone.
- id: c3
  statement: Because external CFMs are misspecified for this setting, the primary control is CIDER-FM-Obs, trained on the same prior with observational context only.
  location: Experiments
  page: 6
  quote: Given the misspecification affecting external CFMs in our setting (Appendix D), we use CIDER-FM-Obs as our primary matched control.
- id: c4
  statement: The Do-PFN comparison is under treatment-domain misspecification (binary-treatment checkpoint given continuous treatments).
  location: Appendix
  page: 21
  quote: Consequently, this comparison evaluates Do-PFN under treatment-domain misspecification.
- id: c5
  statement: 'Limitation: evaluation is limited to graphs with at most ten variables due to compute.'
  location: Discussion, limitations and outlook
  page: 9
  quote: Due to limited available computational resources, our current evaluation is limited to graphs with at most ten variables and does not yet establish how the approach scales to larger systems.
- id: c6
  statement: Experiments use one intervention target per regime and assume all regimes share population and non-intervened mechanisms.
  location: Discussion, limitations and outlook
  page: 9
  quote: Although the proposed input representation supports simultaneous interventions on multiple variables, our experiments use only one intervention target per regime and assume that all regimes share
    the same population and non-intervened mechanisms.

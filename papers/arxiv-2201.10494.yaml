  notes: 'Selected for the topic article requested by the user (2026-10-03): algorithm design techniques (divide and conquer, dynamic programming, branch and bound, local search) and machine learning; carded
    by a subagent. Results tables not recorded; claims only. PDF states: Published as a conference paper at ICLR 2022. Ethics statement: the authors declare no conflicts of interest. Affiliations: Hasso
    Plattner Institute / University of Potsdam, Academic College of Tel Aviv-Yaffo. Setup: NVIDIA DGX-1 (2x 20-core Xeon E5-2698, 8 V100 GPUs). GCNs trained on SATLIB for 20 epochs with Adam and hindsight
    loss, 32 probability maps ''to enable comparison with Li et al. (2018)''. Time limits: 15 s for random graphs of 50-100 nodes, 30 s for SATLIB and PPI, 5 min for VC-BM and DIMACS (Table 1 caption);
    multithreaded runs use 8 threads sharing one GPU. Datasets: ER, BA, HK, WS, hyperbolic random graphs; SATLIB, VC-BM, DIMACS, PPI, citation, reddit; large-scale graphs 500,000 to 5,000,000 vertices;
    weighted graphs and Amazon MWIS. Further findings: with reduction enabled the reductions often single-handedly solve random-graph instances; without reduction/local search vanilla tree searches rarely
    find solutions on SATLIB within the limit; on reddit graphs randomness increased performance. On large graphs KaMIS performed best; the authors could not verify LWD''s reported scalability to 2,000,000
    vertices. On weighted ER graphs DGL-TreeSearch with queue pruning found the best result and Gurobi was the only solver handling the large Amazon MWIS instances. Appendix D tunes Gurobi with grbtune.
    Conclusion states the LWD results ''indicate that reinforcement learning is superior to supervised approaches'' (authors'' reading). KaMIS uses graph kernelization and branch and bound (hence the branch-and-bound
    tag). Re-evaluates arxiv-1810.10659. Reviewer cross-check (not stated by Boether et al.): Li et al. report a 10-minute SATLIB time limit with 16 threads (arxiv-1810.10659 c5), while Boether et al.''s
    tables use 30 s for SATLIB; no discussion of this difference was found in Boether et al.''s text. Results tables not recorded.'

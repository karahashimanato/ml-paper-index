claims:
- id: c1
  statement: Four TFMs (TabPFN-3, TabICLv2, TabDPT, Real-TabPFN-2.5) are compared with six baselines on data sampled from 316 physical equations, in and out of domain.
  location: Abstract
  page: 1
  quote: We probe it directly, evaluating four of them (TabPFN-3, TabICLv2, TabDPT and Real-TabPFN-2.5) against six baselines on datasets sampled from 316 physical equations, in and out of domain.
- id: c2
  statement: TFMs dominate both with defaults and after tuning of the baselines.
  location: Abstract
  page: 1
  quote: TFMs dominate, out of the box and after tuning.
- id: c3
  statement: The TFMs' prior can represent neither a noiseless mechanism nor physical units.
  location: Abstract
  page: 1
  quote: But we show that their prior can represent neither a noiseless mechanism nor physical units
- id: c4
  statement: 'Two budgets are reported: library defaults for every method, and a tuned setting where trained baselines get 25 random-search configurations, optionally with post-hoc greedy ensemble selection.'
  location: Protocol
  page: 3
  quote: Under tuned, the trained baselines get 25 random-search configurations, optionally combined by post-hoc greedy ensemble selection
- id: c5
  statement: In the tuned pipelines the trained baselines hold out 20% of the samples for model selection, while TFMs condition on all samples; the authors disclose rather than equalize this.
  location: Appendix
  page: 9
  quote: Under the tuned and ensembled pipelines, the trained baselines carve 20% of nsamples for model selection and so fit on 0.8 nsamples; TFMs condition on all of it, since they have nothing to select.
- id: c6
  statement: An audit of the pretraining corpora of the two real-data TFMs (TabDPT, Real-TabPFN-2.5) found no Feynman equation and no regression target generated by an analytic function.
  location: Results
  page: 3
  quote: Neither contains a Feynman equation, nor any regression target generated by an analytic function.

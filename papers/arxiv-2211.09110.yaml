  notes: 'Selected for the topic article requested by the user (2026-10-11): pitfalls in evaluating large language models (benchmark contamination and its detection, prompt and answer-format sensitivity,
    LLM-as-a-judge biases, human-preference arenas, holistic evaluation, benchmark errors, and reproducibility of evaluation harnesses). Carded by a subagent. Results tables not recorded; claims only. Authored
    by the Stanford Center for Research on Foundation Models (CRFM), Stanford HAI. Venue from the PDF page header (''Published in Transactions on Machine Learning Research (08/2023)'') and the arXiv journal_ref;
    year is the first arXiv version (2022). Section numbers 1.1, 6, 7 and 8.2 are confirmed by cross-references in the PDF (''§1.1: helm'', ''§6: models'', ''§7: prompting'', ''§8.2: prompting-analysis'').
    Conflict of interest: HELM is the authors'' own benchmark and platform, and the paper argues for its adoption; the acknowledgments state funding from Google (Stanford HAI-Google collaboration) and access,
    support and/or credits from AI21 Labs, Anthropic, Cohere, Microsoft and OpenAI, whose models are evaluated, plus infrastructure from Together Computer for open models. The prompting ablations exclude
    all commercial models (monetary cost) and TNLGv2 (wait times) (footnote 66). In the MCQ ablation, the consistent exception is Anthropic-LM v4-s3 (52B), whose preference (joint > separate-calibrated
    > separate) is the reverse of the other five models for OpenBookQA, TruthfulQA and MMLU. The OPT HellaSwag 79.1% vs 30.2% contrast in the key findings compares a separate 0-shot prompt with a joint
    5-shot prompt. Total evaluation: 4,939 runs, $38,001 for commercial APIs and about 19,500 GPU hours (Introduction). Other stated limitations (Limitations and future work): results depend on prompting
    as the adaptation method and may not hold with fine-tuning or optimized prompts; sensitivity to lower-level decisions such as decoding hyperparameters was not investigated; the extent of contamination
    and its effect on validity ''largely remains unclear''; no universal single-number aggregation is believed to exist. In Section 1.1 the authors also note prior evaluation conditions varied greatly and
    cite Zhao et al. (2021) for swings of 30% to 80% from few-shot prompt details. Section 7 states prompts are relatively simple and generic and treated as user behavior rather than optimized. The 25 key
    findings with model-specific numbers are not recorded. arxiv-2406.04127 uses predictions from a later HELM leaderboard (v1.3.0).'

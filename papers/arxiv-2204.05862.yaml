proposes:
- 'HH-RLHF: separate crowdworker preference datasets for helpfulness and for harmlessness (red teaming), preference models (with preference model pretraining) trained on their mixture, and PPO against the
  PM score with a small KL penalty'
- 'Iterated ''online'' RLHF: re-deploying the current best RLHF policies to crowdworkers on a roughly weekly cadence, retraining PMs and policies on the enlarged data'
- Train/test PM split to measure RLHF over-optimization, and the empirical observation that PM reward grows roughly linearly in sqrt(KL(pi||pi0))
claims:
- id: c1
  statement: 'Crowdworkers: master-qualified US-based MTurk workers (and Upwork workers) chat with the models and at each turn choose the more helpful and honest response (or, in red teaming, the more harmful
    one). Workers were vetted by spot-checks of the sophistication of their dialogues rather than by label agreement; evaluated retrospectively, average agreement between Anthropic researchers and crowdworkers
    was poor (about 63%).'
  location: Section 2, Task Specification and Crowdworkers
  page: 10
  quote: We did not ﬁlter workers based on agreement or other direct measures of label quality
- id: c2
  statement: 'Datasets: a base dataset from the context-distilled 52B LM (44k helpfulness and 42k red-teaming comparisons), a rejection-sampling dataset (52k helpfulness and 2k red-teaming comparisons),
    and an iterated ''online'' dataset from RLHF models updated roughly weekly over about five weeks (22k helpfulness comparisons and no red-teaming data). Only comparisons with a preference stronger than
    the weakest available are kept, and all are treated as binary with equal weight (no ties).'
  location: Section 2.3
  page: 12
  quote: This dataset contains 22k helpfulness comparisons and no red-teaming data.
- id: c3
  statement: 'RL objective: PPO with reward r_total = r_PM - lambda_KL * D_KL(policy || policy0), where the PM score itself is used as the reward. The authors use lambda_KL = 0.001 and state that it likely
    has a very minor impact during most of RL training and might be wholly unnecessary; they also say there is no good reason to use the raw PM score as the reward beyond following prior work. RL used 137k
    prompts from the static dataset plus 369k model-generated prompts.'
  location: Section 4, Training Setup
  page: 17
  quote: In practice we use a very small value of λKL = 0.001, which likely has a very minor impact during most of RL training (as DKL < 100 typically), and might actually be wholly unnecessary.
- id: c4
  statement: 'Robustness (over-optimization) study: the static data are split in half, separate ''train'' and ''test'' PMs are trained, and RLHF policies are optimized against the train PM while scored
    by the test PM. The authors conclude that RLHF becomes gradually less robust at higher PM scores and that larger PMs are more robust, but caution that these experiments are not conclusive because the
    two PMs may share robustness failures.'
  location: Section 4.2
  page: 17
  quote: These experiments are not conclusive since the train and test PMs may exhibit correlated robustness failures.
- id: c5
  statement: 'The authors observe an approximately linear relation between PM reward and sqrt(D_KL(pi || pi0)) during RLHF training and give a heuristic explanation: KL is quadratic in a small policy change
    while reward is expected to be linear in it, so reward is proportional to sqrt(KL) in the small-change regime; they say the observation suggests most RLHF training stays in that regime, and list possible
    implications only at a conjectural level.'
  location: Section 4.3
  page: 18
  quote: So the fact that this relation seems to hold empirically suggests that most of RLHF training remains in the small-δπ regime.
- id: c6
  statement: 'Helpfulness-harmlessness tension: earlier RLHF policies over-optimized harmlessness and under-optimized helpfulness (e.g. recommending therapy for any displeasure). The authors attribute this
    to their data: in red teaming, workers chose the more harmful response, so the data show only what not to do; they partially resolved it by training on a larger fraction of helpfulness prompts during
    RLHF.'
  location: Section 4.4
  page: 20
  quote: Our dataset does not provide guidance on the upper end of the distribution, on what models should do, but only tells models what not to do.
- id: c7
  statement: 'Iterated online RLHF: PMs become less calibrated and less robust at high scores, which the authors attribute to a lack of high-score data, so they repeatedly deploy the best RLHF policy, collect
    new comparisons, and retrain new PMs and policies (a new model per iteration). They flag that the online model was also trained on about 20% more data and with improved hyperparameters (larger K, 2048-token
    PM context), and address this with a controlled experiment holding dataset size fixed.'
  location: Section 4.5
  page: 21
  quote: 'However, readers might worry about two caveats: the online model was trained on a slightly larger (about 20% larger) dataset, and the online model was trained with improved RLHF hyperparameters'
- id: c8
  statement: 'Alignment tax depends on scale: the authors report that models with less than about 10B parameters pay an ''alignment tax'' on capabilities, whereas their larger RLHF models do not, and suggest
    that models near the state of the art may have been necessary to draw the right lessons from alignment research.'
  location: Section 7
  page: 34
  quote: Models with less than about 10B parameters behave differently, paying an ‘alignment tax’ on their capabilities.
- id: c9
  statement: 'Limitations: the authors have little experience applying RL to large generative models, encountered some RL stability issues, and performed only rudimentary hyperparameter scans; they also
    did not explore updating a single PM or policy online (they retrained from scratch each iteration), and they focus on average-case rather than worst-case behaviour.'
  location: Section 7.1
  page: 36
  quote: although we performed some rudimentary hyperparameter scans, we expect that with more experience and study we could do better

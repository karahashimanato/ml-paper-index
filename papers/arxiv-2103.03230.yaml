proposes:
- 'Barlow Twins: a loss that pushes the cross-correlation matrix (computed along the batch) between the embeddings of two distorted views towards the identity: an invariance term on the diagonal and a redundancy-reduction
  term on the off-diagonal, weighted by lambda'
claims:
- id: c1
  statement: 'Claim of the method: Barlow Twins needs neither large batches nor asymmetry between the twins (predictor, stop-gradient, moving-average weights), and benefits from very high-dimensional output
    vectors.'
  location: Abstract
  page: 1
  quote: BARLOW TWINS does not require large batches nor asymmetry between the network twins such as a predictor network, gradient stopping, or a moving average on the weight updates.
- id: c2
  statement: 'Loss ablation (300-epoch runs; Table 5 caption, with the body text saying the same): removing either the invariance (on-diagonal) term or the redundancy-reduction (off-diagonal) term gives
    worse or collapsed solutions.'
  location: Table 5
  page: 5
  quote: We ablate the invariance and redundancy terms in our proposed loss and observe that both terms are necessary for good performance.
- id: c3
  statement: 'Batch size: with a LARS learning-rate grid search per batch size, performance is almost unaffected down to batch 256, unlike SimCLR. The BYOL and SimCLR curves in Figure 2 are taken from their
    papers, not re-run.'
  location: Section 4 (Robustness to Batch Size)
  page: 5
  quote: We ﬁnd that, unlike SIMCLR, our model is robust to small batch sizes (Fig. 2), with a performance almost unaffected for a batch as small as 256.
- id: c4
  statement: 'Augmentations: Barlow Twins is not robust to removing some augmentations, like SimCLR and unlike BYOL; the authors present this as a possible disadvantage, or as the representation being better
    controlled by the chosen distortions.'
  location: Section 4 (Effect of Removing Augmentations)
  page: 5
  quote: We ﬁnd that our model is not robust to removing some types of data augmentations, like SIMCLR but unlike BYOL (Fig. 3).
- id: c5
  statement: 'Projector dimensionality: performance keeps improving with all output dimensionalities tested, while other methods saturate (data for SimCLR and BYOL taken from their papers), even though
    the 2048-d ResNet output is a bottleneck.'
  location: Section 4 (Projector Network Depth & Width)
  page: 6
  quote: Other methods rapidly saturate when the dimensionality of the output increases, but our method keeps improving with all output dimensionality tested (Fig. 4).
- id: c6
  statement: Adding BYOL/SimSiam-style asymmetry (a predictor and/or a stop-gradient) slightly decreases Barlow Twins' performance.
  location: Section 4 (Breaking Symmetry)
  page: 6
  quote: We ﬁnd that these asymmetries slightly decrease the performance of our network (see Table 6).
- id: c7
  statement: The authors argue that asymmetric methods (BYOL, SimSiam) cannot be described as optimizing an overall objective, since trivial solutions exist that they avoid through implementation choices
    or learning dynamics, whereas Barlow Twins avoids them by construction.
  location: Section 5.1 (Asymmetric Twins)
  page: 8
  quote: It should be noted however that these asymmetric methods cannot be described as the optimization of an overall learning objective.
- id: c8
  statement: 'Theory caveat: the information-bottleneck interpretation assumes Gaussian representations, and the actual loss is linked to it only through listed simplifications and approximations (e.g.
    replacing the log-determinant by a decorrelation proxy, cross- instead of auto-correlation).'
  location: Appendix A
  page: 12
  quote: In order to circumvent this difﬁculty, we make the simplifying assumption that the representation Z is distributed as a Gaussian.

    that three authors hold concurrent Amazon/university appointments and that the paper describes work performed at Amazon.'
  location: Title page (footnote)
  page: 1
  quote: Hao Wang, Michael W. Mahoney, and Andrew Gordon Wilson hold concurrent appointments at Amazon and their corresponding universities, and this paper describes work performed at Amazon.

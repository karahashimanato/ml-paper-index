  notes: 'Selected for the method article requested by the user (2026-10-07): Bayesian optimization and hyperparameter optimization (GP-based BO, TPE, multi-fidelity methods, scalable BO, frameworks, benchmarks
    and comparisons with random search). Carded by a subagent. Results tables not recorded; claims only. Affiliations: LMU Munich, TU Dortmund, Leibniz University Hannover. No venue recorded: the PDF text
    does not state one and no comment/journal_ref was given (searched the dump for WIREs/accepted/submitted; WIREs appears only in a reference). Section 6 opens by stating that some recommendations are
    rules of thumb based solely on experience and others are at least partially confirmed by benchmarks, which are only as good as the selected datasets. Section 6.3 also states that GPs ''scale cubically
    with the number of dimensions'', which differs from Section 4.2.3 (cubic in the number of samples); only the latter is recorded as a claim. Section 4.4 illustrates the optimistic bias of reporting the
    tuned resampling error with a learner that ignores the data (true error 0.5), citing Bischl et al. (2012). Section 8 (open challenges) suggests HPO tools should probably increase the number of folds
    as tuning runs longer, calling the schedule under-explored. Authors include developers of mlr3/mlrMBO and SMAC-related work (Lindauer, Deng), which the review lists among implementations; it does not
    run a new benchmark. Other Section 6 guidance not recorded as claims: Section 6.1 suggests repeated CV with many repetitions for n < 500, usually 5- or 10-fold CV for 500 <= n <= 50000, and possibly
    holdout beyond that; Section 6.2 warns that too-wide intervals or inadequate HPs can hurt tuning within the budget and advises tuning as few HPs as possible; Section 6.3 says GS may be useful only with
    up to about 2-3 HPs, BO with GPs works well for up to around 10 HPs, BO with random forests has been used with hundreds of HPs, and RS/Hyperband work well in very large spaces if the effective dimension
    is low. Appendix search-space tables not recorded.'

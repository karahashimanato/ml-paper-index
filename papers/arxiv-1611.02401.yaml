    40). The abstract states the computational complexity can be used as a regularization term optimized by backpropagation (Appendix A); for convex hull the recursion depth is fixed by input size range
    rather than learned dynamically. The authors relate the convex-hull divide and conquer to its Theta(n log n) classical algorithm. Clustering: the non-recursive baseline beats DiCoNet when k is small

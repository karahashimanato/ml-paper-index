  notes: 'Selected for the topic article requested by the user (2026-10-03): classical algorithms (sorting, binary search, greedy) and machine learning; carded by a subagent. Results tables not recorded;
    claims only. Affiliations (title page): MIT, University of Maryland, IAS, National Institute of Informatics. PDF states: Published as a conference paper at ICLR 2020. Tasks (all synthetic, in-distribution
    test): maximum value difference and furthest pair over 25 ''treasures'', monster trainer (a shortest-path variant with 10 monsters and an unknown cost function), subset sum over 6 numbers. Supervision:
    final answers only (end-to-end). Hyperparameter grids per model are listed in Appendix G (learning rates, batch size, hidden sizes, layers). Monster trainer: GNNs with 4 iterations nearly match 7 iterations,
    explained as aligning with a bidirectional Bellman-Ford needing half the iterations (Appendix G.3). The paper states subset sum ''is NP-hard (Karp, 1972) and cannot be solved by DP'' and that GNNs therefore
    cannot sample-efficiently learn it; it proposes Neural Exhaustive Search (enumerating all subsets) instead. Proposition 3.1/3.2: GNNs and MLPs are universal approximators for the relevant functions,
    so the authors attribute performance differences to generalization rather than expressiveness. CLRS (arxiv-2205.15659) cites this paper for the claim that architectures better aligned with the algorithm
    ''can be proven to have better sample complexity'' and motivates its graph encoding with it.'

proposes:
- 'survey/framework of algorithms with predictions: predictor abstracted as a black-box function h, performance tied to prediction error, alpha-consistency and beta-robustness'
claims:
- id: c1
  statement: 'Contribution: the survey presents algorithms that use machine-learning predictions about the input to go beyond worst-case analysis, aiming for near-optimal performance with good predictions
    while recovering prediction-less worst-case behavior when predictions have large errors.'
  location: Abstract
  page: 1
  quote: We introduce algorithms that use predictions from machine learning applied to the input to circumvent worst-case analysis.
- id: c2
  statement: 'Binary search with a predicted position (classical algorithm: binary search over a sorted array): probe the predicted position h(q), then probe h(q)+2, h(q)+4, h(q)+8, ... and binary search
    on the bracketed interval; the cost on a query is at most 2 log of its position error eta_q = |h(q) - t(q)|, and if the queries come from a distribution, Jensen''s inequality bounds the expected cost
    by 2 log of the expected error. The survey says even a predictor with average error O(polylog n) improves asymptotic performance, and since the error is bounded by n a bad predictor cannot do much harm.'
  location: 'Warm-up: Binary search'
  page: 2
  quote: In particular, even a classiﬁer with an average error of O(polylog n) leads to an improvement in asymptotic performance.
- id: c3
  statement: 'Ski rental with a predicted number of skiing days h(d) and error eta = |h(d) - d*|: trusting the prediction costs OPT + eta but can be arbitrarily worse than the simple deterministic strategy;
    with a tunable lambda in [0,1] (buy on day ceil(lambda b) if h(d) > b, else on day ceil(b/lambda)) a case analysis gives a competitive ratio of at most 1 + min(1/lambda, lambda + eta/((1-lambda)OPT)),
    i.e. at most 1 + lambda as the error goes to 0 and never worse than 1 + 1/lambda. This deterministic worst-case bound is stated in the survey without a citation at this point; the Bibliographic Notes
    credit Purohit et al. (2018) with demonstrating consistency-robustness trade-offs for ski rental and scheduling (see arxiv-2407.17712).'
  location: 'Online algorithms: Ski Rental'
  page: 3
  quote: In particular, as the error of the prediction drops to 0, the competitive ratio is no more than 1 + λ.
- id: c4
  statement: 'Definitions (guarantee notions): an algorithm is alpha-consistent if its competitive ratio tends to alpha as the prediction error goes to 0, and beta-robust if its competitive ratio is bounded
    by beta even with arbitrarily bad predictions; the survey notes a tension between the two (choice of lambda in ski rental). The Bibliographic Notes attribute the formal model including alpha-consistency
    and beta-robustness to Lykouris and Vassilvitskii (2018) (arxiv-1802.05399).'
  location: Model
  page: 3
  quote: Formally, we say that an algorithm is α-consistent if its competitive ratio tends to α as the error in the predictions goes to 0, and β-robust if the competitive ratio is bounded by β even with
    arbitrarily bad predictions.
- id: c5
  statement: 'Caching (classical algorithms: Belady''s Furthest-In-Future rule and Marking algorithms): with a predictor h of each element''s next arrival time and error eta(h) = sum over requests of |h(t)
    - next(t)| (normalized by opt in the bound), the PredictiveMarker variant presented in the survey (a randomized marking algorithm: evict the unmarked element predicted furthest in the future when a
    clean element arrives, otherwise a uniformly random unmarked element) has competitive ratio O(log(eta(h)/opt)) (Theorem 1); the proof sketch bounds expected eviction-chain lengths and uses the Diaconis-Graham
    inequality relating inversions to l1 distance. Attribution: the Bibliographic Notes say the analysis presented is due to Rohatgi (2020), and that Lykouris and Vassilvitskii (2018) were the first to
    analyze caching in this setting.'
  location: Marking Algorithms
  page: 8
  quote: These two facts imply that the expected error of the above algorithm is O(log(η(h)/opt)).
- id: c6
  statement: 'Learned Bloom filters (evaluation assumption): the threshold tau is typically chosen empirically on test queries, which depends on the test queries being representative of future queries;
    otherwise the false positive rate may be higher than expected, so a learned Bloom filter needs different additional assumptions than a standard Bloom filter for performance statements.'
  location: Learned Bloom Filters
  page: 5
  quote: A learned Bloom ﬁlter thus requires diﬀerent additional assumptions than a standard Bloom ﬁlter in order to make statements about its performance.
- id: c7
  statement: 'Queue simulations (empirical, synthetic prediction noise; not a guarantee): for SPJF, PSPJF and SPRPT in a single queue with Poisson arrival rate 0.95 and exponential or Weibull service times,
    a job with service time x gets a prediction uniform over [(1-alpha)x, (1+alpha)x] with alpha = 0, 0.1, ..., 0.9; the survey reports that average time in system degrades gracefully with alpha and is
    much better than the steady-state average time in system without predictions that it states for comparison.'
  location: Scheduling Queues
  page: 11
  quote: A job with service time x has a predicted service time that is uniform over [(1 −α)x, (1 + α)x] for a parameter α; we try α = j/10 for integer j from 0 to 9.

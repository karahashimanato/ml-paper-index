    groupings); DoC-Feat needs none. Experiments with non-linear regressors in the supplement are said to follow the same trends as linear ones. The paper also reports DoC on a single ResNet-101 beating
    a ResNet ensemble at predicting accuracy. Later work, not this paper: Garg et al. (arxiv-2201.04234) use DoC-Feat as a baseline and, on BREEDS, fit a robust linear regression for DOC on labeled shifts
    of the source subpopulations and test on novel subpopulations; they report that their ATC without regression performs better or similar, and argue that regression on labeled target domains can fail
    when unseen shifts are not linearly correlated with seen ones. Those are Garg et al.''s findings in their setting. This paper itself evaluates only on ImageNet-based shifts and states no impossibility

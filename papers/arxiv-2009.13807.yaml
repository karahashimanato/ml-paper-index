claims:
- id: c1
  statement: 'Most exemplars of popular TSAD benchmarks (Yahoo, Numenta, NASA, ...) have one or more of four flaws: triviality, unrealistic anomaly density, mislabeled ground truth, run-to-failure bias.'
  location: Introduction
  page: 1
  quote: These flaws are triviality, unrealistic anomaly density, mislabeled ground truth and run-to-failure bias.
- id: c2
  statement: Because of these flaws, most published comparisons of anomaly detectors may be unreliable and apparent progress may be illusory.
  location: Introduction
  page: 1
  quote: we believe that most published comparisons of anomaly detection algorithms may be unreliable
- id: c3
  statement: 'Triviality: 316 of the 367 Yahoo time series can be solved by a ''one-liner'' (a single line of basic code).'
  location: 'Flaw: triviality'
  page: 3
  quote: 316 out of 367 (86.1%) can be easily solved with a one-liner
- id: c4
  statement: Ideally each test time series should contain exactly one anomaly, communicated with the dataset.
  location: 'Flaw: unrealistic anomaly density'
  page: 4
  quote: We believe that the ideal number of anomalies in a single testing time series is exactly one.
- id: c5
  statement: All benchmark datasets appear to contain mislabeled data (false positives and false negatives).
  location: 'Flaw: mislabeled ground truth'
  page: 4
  quote: All of the benchmark datasets appear to have mislabeled data, both false positives and false negatives.
- id: c6
  statement: 'Run-to-failure bias: anomalies cluster near the end, so naively flagging the last point scores well.'
  location: 'Flaw: run-to-failure bias'
  page: 6
  quote: A naïve algorithm that simply labels the last point as an anomaly
- id: c7
  statement: The classic TSAD archives are irretrievably flawed.
  location: Summary of the flaws
  page: 6
  quote: the classic time series anomaly detection archives are irretrievably flawed.

id: arxiv-2606.07789
title: A Framework for Evaluating and Benchmarking Concept Drift Detection Methods
authors:
- Vitor Cerqueira
- Heitor Murilo Gomes
- Marco Heyden
- Bernhard Pfahringer
- Albert Bifet
year: 2026
venue: KDD 2026
links:
  arxiv: https://arxiv.org/abs/2606.07789
  code: https://github.com/vcerqueira/experiments-drift_evaluation
source:
  version: arXiv v1
  retrieved_at: '2026-10-02'
  pdf_sha256: 152984564c2f255f073ef3d9d070fd9a1f16193cb2e04fdf92f999fd96341430
  license: CC BY 4.0
tags:
  tasks:
  - concept-drift-detection
  method_families:
  - error-rate-drift-detectors
  - window-based-drift-detectors
  paradigms:
  - streaming
proposes:
- Semi-synthetic drift injection into real streams (Monte Carlo)
- Timing-aware drift detection metrics
- Leave-one-dataset-out HPO for detectors
claims:
- id: c1
  statement: 'Drift detector evaluation is inconsistent: oversimplified synthetic generators, incompatible metrics, and opaque hyperparameter selection.'
  location: Abstract
  page: 1
  quote: studies rely on oversimplified synthetic data generators, adopt incompatible metrics, and lack transparency in hyperparameter selection
- id: c2
  statement: 14 widely used detectors are benchmarked on 7 real-world datasets with 4 injected drift types, each abrupt and gradual.
  location: Abstract
  page: 1
  quote: We benchmark 14 widely used drift detection methods on 7 real-world datasets across 4 drift types
- id: c3
  statement: SEED, STEPD and ABCD consistently outperformed the other detectors across drift types.
  location: Introduction
  page: 2
  quote: Our results reveal that SEED [23], STEPD [25], and ABCD [22] consistently outperform other detectors across distinct drift types
- id: c4
  statement: Hyperparameter optimization with the proposed protocol significantly improved detection over default configurations.
  location: Introduction
  page: 2
  quote: hyperparameter optimization using our proposed approach significantly improves detection performance over default configurations.
- id: c5
  statement: Classic metrics MTFA and MDT depend on stream length and drift spacing, preventing cross-dataset comparison.
  location: Related work
  page: 3
  quote: MTFA and MDT are highly dependent on stream length and drift spacing
- id: c6
  statement: 'An F1 score for drift detection ignores timing: a detector with unacceptable delay can still get perfect F1.'
  location: Related work
  page: 3
  quote: 'its formulation ignores the temporal aspect: a detector with unacceptable delay can still achieve perfect F1.'
- id: c7
  statement: Detector hyperparameters are tuned with leave-one-dataset-out cross-validation.
  location: Section 3.3
  page: 4
  quote: we propose a leave-one-dataset-out cross-validation approach for optimizing the hyperparameters of drift detectors.
- id: c8
  statement: Tuning and evaluating detectors on the same dataset can overfit and make reported results overly optimistic.
  location: Section 3.3
  page: 4
  quote: using the same dataset for optimizing and evaluating the detector can cause overfitting and lead to overly optimistic performance estimates reported in the respective papers.
- id: c9
  statement: Each dataset and drift type is evaluated with 50 Monte Carlo trials (random drift onset).
  location: Experimental setup
  page: 6
  quote: For each dataset and drift type, we perform 50 Monte Carlo trials.
- id: c10
  statement: A Hoeffding Tree with default hyperparameters is the monitored classifier.
  location: Experimental setup
  page: 6
  quote: We select the Hoeffding Tree [10] as the classifier in the experiments
- id: c11
  statement: PH and EWMA were ineffective regardless of configuration.
  location: Main findings
  page: 8
  quote: PH and EWMA remain ineffective regardless of configuration, suggesting fundamental limitations
- id: c12
  statement: Unsupervised detectors (ABCD(X), STUDD) detect feature-space drifts but not label-only changes.
  location: Main findings
  page: 8
  quote: Unsupervised detectors (ABCD(X) and STUDD) perform better on feature-space drifts (feature permutation, feature filtering) than on label-based changes (class prior, class swaps)
- id: c13
  statement: Gradual drifts are systematically harder to detect than abrupt ones.
  location: Main findings
  page: 8
  quote: Gradual drifts are systematically harder to detect than abrupt ones.
- id: c14
  statement: STEPD's strong results are largely due to effective tuning.
  location: Main findings
  page: 8
  quote: STEPD's strong performance is largely attributable to effective tuning.
- id: c15
  statement: 'Limitations: one classifier (Hoeffding tree), four drift types, seven datasets.'
  location: Limitations
  page: 8
  quote: the experiments are limited to one classifier (Hoeffding tree) and four drift types simulated in 7 real-world datasets.
- id: c16
  statement: 'Limitation: labels are assumed to be available immediately after each prediction (no verification delay).'
  location: Limitations
  page: 8
  quote: it assumes immediate feedback, with labels being readily available at each step after inference.
- id: c17
  statement: Shuffling the real streams before injecting drift removes their natural temporal structure.
  location: Limitations
  page: 8
  quote: it also removes any inherent temporal structure.
- id: c18
  statement: 'Practical guidance: SEED and STEPD are robust defaults when drift characteristics are unknown.'
  location: Main findings
  page: 8
  quote: SEED and STEPD are robust defaults when drift characteristics are unknown
- id: c19
  statement: Hyperparameters are searched with 30 iterations of random search.
  location: Experimental setup
  page: 6
  quote: The optimization is conducted using 30 iterations of random search.
- id: c20
  statement: The main objective is a standardized evaluation protocol, not identifying the best detector.
  location: Experimental setup
  page: 6
  quote: our main objective is to establish a standardized evaluation protocol rather than to identify the best performing detector.

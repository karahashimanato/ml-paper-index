proposes:
- Reproducible benchmark of attention backends for row/column attention in tabular foundation models
claims:
- id: c1
  statement: The paper builds a reproducible benchmark of attention backends (SDPA, FlashAttention-2/3/4, vLLM, SageAttention) for the row/column attention used in tabular in-context learners.
  location: Abstract
  page: 1
  quote: we create a reproducible benchmarking setup and study the unique characteristics of tabular attention across several backends
- id: c2
  statement: The best backend differs between column and row attention and depends on hardware and model specifics.
  location: Abstract
  page: 1
  quote: We find that the optimal backend choice differs between column and row attention and varies across hardware as well as model specifics
- id: c3
  statement: The benchmark measures isolated kernel latency/throughput and memory on synthetic tabular tensors, not predictive accuracy.
  location: Benchmark setup
  page: 3
  quote: measuring latency and memory consumption for isolated kernel throughput on synthetic tabular tensors
- id: c4
  statement: The train-test (context-query) split handled differently by TabPFN/Mitra and ConTextTab is ignored; standard full bidirectional attention is benchmarked instead.
  location: Benchmark setup
  page: 4
  quote: Instead, we evaluate standard full bi-directional attention.
- id: c5
  statement: 'Stated limitation: only isolated kernels with synthetic tensors are benchmarked, not end-to-end training or inference; only bfloat16, non-causal attention and batch size 1 are used.'
  location: Limitations
  page: 10
  quote: Our benchmark focuses on isolated attention kernels with synthetic tensors rather than end-to-end model training or inference
- id: c6
  statement: Two of the authors (SAP SE) are co-authors of ConTextTab, one of the models whose attention pattern is benchmarked; the main head configuration is taken from that model's reference.
  location: References
  page: 11
  quote: Marco Spinaci, Marek Polewczyk, Maximilian Schambach, and Sam Thelin.

proposes:
- 'CRAIG: select a weighted subset (coreset) whose weighted gradient approximates the full gradient by greedily maximizing a submodular facility-location function on (upper bounds of) gradient differences,
  then run incremental gradient methods on it'
claims:
- id: c1
  statement: 'Contribution: CRAIG selects a weighted training subset (coreset) that closely estimates the full gradient, found by maximizing a submodular function.'
  location: Abstract
  page: 1
  quote: Here we develop CRAIG, a method to select a weighted subset (or coreset) of training data that closely estimates the full gradient by maximizing a submodular function.
- id: c2
  statement: 'Greedy guarantee (classical greedy results applied, not new theory): the subset problem is NP-hard; turned into a monotone submodular facility-location surrogate F, the budgeted version (|S|
    <= r) is approximated by greedy within (1-1/e) of the optimal F value, and the cover version gets a logarithmic approximation on subset size (Wolsey 1982). The approximation is for the surrogate (an
    upper bound on gradient-estimation error), not directly for the gradient error.'
  location: CRAIG with Limited Budget
  page: 5
  quote: For the above submodular maximization problem, the greedy algorithm discussed in Section 3.2 provides a (1 − 1/e)-approximation to the optimal solution.
- id: c3
  statement: 'Convergence guarantee and its assumptions: IG on the subset is proved to converge to a (near)optimal solution at the same rate as IG for convex optimization (Theorems 1-2 assume a strongly
    convex f and a subset whose weighted gradient is within epsilon of the full gradient over the parameter domain; Theorem 2 additionally assumes convex, twice-differentiable components with Lipschitz
    gradients; both leave an extra epsilon-dependent error term).'
  location: Abstract
  page: 1
  quote: We prove that applying IG to this subset is guaranteed to converge to the (near)optimal solution with the same convergence rate as that of IG for convex optimization.
- id: c4
  statement: 'Main empirical claim: while reaching practically the same solution, CRAIG speeds up various IG methods by up to 6x for logistic regression and 3x for deep neural networks.'
  location: Abstract
  page: 1
  quote: Our extensive set of experiments show that CRAIG, while achieving practically the same solution, speeds up various IG methods by up to 6x for logistic regression and 3x for training deep neural
    networks
- id: c5
  statement: 'Speedup measurement: run time is wall-clock time for CRAIG''s subset selection plus loss minimization with IG or other optimizers.'
  location: Experiments
  page: 7
  quote: In our experiments, we report the run-time as the wall-clock time for subset selection with CRAIG, plus minimizing the loss using IG or other optimizers with the specified learning rates.
- id: c6
  statement: 'Tuning: each method is tuned separately to perform at its best (for the convex experiments, learning rates for each method including the random baseline were tuned by preferring smaller training
    loss).'
  location: Experiments
  page: 7
  quote: We separately tune each method so that it performs at its best.
- id: c7
  statement: 'Limitation for deep networks: the gradient-difference bound depends on the changing parameters, so the subset must be reselected after a number of parameter updates rather than once as preprocessing.'
  location: Application of CRAIG to Deep Networks
  page: 5
  quote: Thus, we need to use CRAIG to update the subset S after a number of parameter updates.

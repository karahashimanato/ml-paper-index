  notes: 'Selected for the method article requested by the user (2026-10-10): deep learning architectures for tabular data (TabNet, NODE and differentiable trees, TabTransformer/FT-Transformer-style attention,
    SAINT, embeddings for numerical features, retrieval (TabR), regularized MLPs, CTR-style interaction models, self-supervised pretraining, and surveys/benchmarks comparing them with GBDTs). Carded by
    a subagent. Results tables not recorded; claims only. Affiliations: Yandex; HSE (Rubachev). Venue from the PDF footer (''36th Conference on Neural Information Processing Systems (NeurIPS 2022)'') and
    the arXiv comment (''NeurIPS 2022 camera-ready''). Conflict of interest: the backbones (MLP, ResNet, FT-Transformer as ''Transformer-L'') and the tuning/evaluation protocol are taken from the authors''
    own earlier paper arxiv-2106.11959; the same group later builds TabR (arxiv-2307.14338) on these embeddings. Other stated results recorded only here: adding fixed-coefficient Periodic features to XGBoost
    did not provide benefits on CA, HO, HI (Table 10); embedding modules can increase parameter counts substantially (e.g. almost 2000-fold for MLP-LR on CH) but the authors report only a 1.5-fold training-time
    increase in that case and MLP/ResNet with embeddings remain faster than Transformers (Section ''Comparing model sizes''). On a synthetic GBDT-friendly dataset (Appendix D.1) CatBoost was trained with
    default hyperparameters. Section numbers 3.1-3.3 and 5.3 are confirmed by in-text cross-references (''subsection 3.1'', ''subsection 3.2'', ''subsection 3.3'', ''subsection 5.3''); other locations use
    section names.'

  notes: 'Selected for the method article requested by the user (2026-10-10): knowledge distillation and pruning (soft targets and temperature, hint-based and self distillation, teacher-student gaps and
    fidelity; magnitude, gradual, single-shot, movement and LLM pruning, lottery tickets, and how pruning is evaluated). Carded by a subagent. Results tables not recorded; claims only. Affiliations: UC
    Berkeley (Liu, Zhou, Darrell), Tsinghua (Sun, Huang). Venue: PDF header ''Published as a conference paper at ICLR 2019'' and arXiv comment ''ICLR 2019''; year is the first arXiv version (2018). Section
    numbers come from numbered headings and the paper''s own roadmap (Sections 2-7; 4.1 predefined, 4.2 automatic, 4.3 unstructured). Protocol: same (target model, dataset) pairs as the original papers
    for six methods; CIFAR runs use 5 random seeds (mean and std reported); training/fine-tuning 160/40 epochs on CIFAR and 90/20 on ImageNet; fine-tuning uses the lowest learning rate of large-model training;
    for ThiNet and He et al. 2017b only relative accuracy drops are compared because of framework differences (PyTorch vs Caffe). Conflict of interest: one of the evaluated automatic methods, Network Slimming
    (Liu et al., 2017), is co-authored by Zhuang Liu and Gao Huang (reference list), and DenseNet (Huang, Liu et al.) is among the evaluated architectures; Network Slimming is also the method used in the
    architecture-search analysis (Section 5). The Lottery Ticket comparison concerns arxiv-1803.03635, whose Discussion in turn says its VGG-19 experiments confirm these findings up to about 80% pruning.
    Accuracy tables are not recorded as results.'

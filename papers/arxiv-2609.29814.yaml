- id: c1
  statement: SwitchPFN learns a shared projection and regime codebook from the training sequences so that local dynamics features are comparable across samples, and feeds the resulting table to a frozen
    TabPFN.
  location: Abstract
  page: 1
  quote: We propose SwitchPFN, which learns a shared projection and regime codebook from the training sequences, making local dynamic operators and transition features directly comparable across samples.
- id: c2
  statement: On the evaluated benchmarks, SwitchPFN has the highest mean accuracy among the evaluated methods.
  location: Abstract
  page: 1
  quote: Across the evaluated benchmarks, SwitchPFN achieves the highest mean accuracy among the evaluated methods, improving over the strongest baseline by 4.47% relatively.
- id: c3
  statement: Evaluation uses eight UEA multivariate time-series classification tasks with the official train/test splits.
  location: Experimental setup
  page: 3

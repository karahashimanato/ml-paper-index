id: arxiv-2410.24210
title: 'TabM: Advancing Tabular Deep Learning with Parameter-Efficient Ensembling'
authors:
- Yury Gorishniy
- Akim Kotelnikov
- Artem Babenko
year: 2025
venue: ICLR 2025

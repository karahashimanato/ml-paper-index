    in GECCO 2016, edits not yet made from reviewer comments''; recorded as ''GECCO 2016'', but this arXiv v1 is the pre-revision preprint. GP settings (Table 1): population 100, 100 generations, 30 replicate
    runs (the Discussion restates 10,000 pipelines = 100 x 100). Conflict of interest: all compared variants are the authors'' own; the GAMETES simulator (references [18], [19]) is by co-author Urbanowicz;
    no external AutoML system is compared (auto-sklearn is only discussed in Related Work, where the authors argue its fixed pipeline shape cannot produce arbitrarily large pipelines). Results are shown
    as box plots (Figures 3-5); only numbers written in the text are quoted. The text states that RF achieved only 63% accuracy on average on the easiest GAMETES setting while all TPOT versions reached
    80%+ (Section 4).'

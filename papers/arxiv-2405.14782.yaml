  notes: 'Selected for the topic article requested by the user (2026-10-11): pitfalls in evaluating large language models (benchmark contamination and its detection, prompt and answer-format sensitivity,
    LLM-as-a-judge biases, human-preference arenas, holistic evaluation, benchmark errors, and reproducibility of evaluation harnesses). Carded by a subagent. Results tables not recorded; claims only. Affiliations
    include EleutherAI (lead authors), Stability AI, Brown University and others. No venue is stated in the arXiv PDF or the arXiv record; none recorded. Author order follows the arXiv record; the v3 PDF
    lists the authors in a different order (Biderman, Schoelkopf, Sutawika, Abbasi, Forde, Gao, Tow, then alphabetical). Section numbers are from numbered headings in the PDF. Conflict of interest: EleutherAI
    authors evaluate and recommend their own library (lm-eval) and use their own models (GPT-NeoX-20B, trained on their Pile) as examples; Andy Zou is a co-author of MMLU (arxiv-2009.03300), whose official
    format is described as the correct one. Section 2.1 lists three responses to the Key Problem (closed-domain conversion, model-based grading such as BLEU/ROUGE or LLM graders ''known to be flawed'',
    and human labor) and says the paper focuses on MCQA. Section 3.1 cites Fourrier et al. (2023b): three MMLU implementations (HELM, lm-eval, original code) produce widely different scores and change model
    rankings. Section 4.1 cites Lukošiūtė (2024) for GPQA single-run estimates vs 95% intervals over 10 runs, and says that had MMLU-style prompting been standard, the authors could plausibly have concluded
    their (Pile) dataset ''was garbage''. The paper also states that, among defaults, lm-eval prioritizes procedures agreed by model trainers over official implementations and evaluators'' conventions (Section
    3.3). Section 2.2 argues that model developers effectively ''grade their own homework'' because many APIs do not expose log-probabilities. No discussion of train-test contamination was found in the
    text (searched for contamina, memoriz, leak, overlap). Appendix F (Limitations) is truncated mid-sentence in the v3 PDF. Table 1 values are not recorded; experiments used lm-eval v0.4.2 on 8x A40 GPUs
    (Appendix C.1, E).'

  notes: 'Selected for the method article requested by the user (2026-10-10): alternatives and extensions to dense Transformers (sparse mixture-of-experts routing and load balancing, state space models
    from HiPPO/S4 to Mamba-2, linear and kernelized attention, RWKV, and benchmarks/analyses comparing them with Transformers). Carded by a subagent. Results tables not recorded; claims only. Affiliations:
    Stanford (Gu, Dao, Ermon, Ré), University at Buffalo (Rudra); Gu and Dao are equal contribution. No venue is stated in the arXiv v2 PDF and the arXiv record has no comment/journal_ref; none recorded.
    Section numbers are from numbered headings in the PDF. Section 2.5 shows that with N = 1 and an input/state-dependent step size the discretized LagT update becomes a gated RNN (GRU as a special case).
    The function approximation experiment (Section 4.3) uses band-limited white noise of length 10^6 with at most 256 memory units; its MSE values and the Table 1/2 accuracies are in tables and not recorded.
    Copying task results are only in the appendix (figure). This paper''s LegS matrix is the ''HiPPO matrix'' used to initialize S4 (arxiv-2111.00396) by overlapping authors; later SSM papers by Gu and
    Dao (S4, H3, Mamba, Mamba-2) build on it.'

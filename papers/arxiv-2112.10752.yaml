proposes:
- 'Latent diffusion models (LDMs): training a diffusion model in the latent space of a separately pre-trained, mildly compressing autoencoder (perceptual + patch-adversarial loss, KL- or VQ-regularized
  latent) with downsampling factor f'
- Cross-attention conditioning of the denoising UNet on a domain-specific encoder of the conditioning input (e.g. a transformer for text)
claims:
- id: c1
  statement: 'Motivation, citing Dhariwal & Nichol [15]: the most powerful pixel-space diffusion models take hundreds of GPU days to train (150-1000 V100 days in [15]) and inference is also expensive because
    of repeated network evaluations.'
  location: Introduction
  page: 1
  quote: As an example, training the most powerful DMs often takes hundreds of GPU days (e.g. 150 - 1000 V100 days in [15]) and repeated evaluations on a noisy version of the input space render also inference
    expensive,
- id: c2
  statement: 'First-stage autoencoder: to avoid arbitrarily high-variance latents, two regularizations are studied, a slight KL penalty toward a standard normal (VAE-like) and a vector-quantization layer
    within the decoder; because the diffusion model works on the 2D latent, relatively mild compression suffices.'
  location: Section 3.1
  page: 4
  quote: The ﬁrst variant, KL-reg., imposes a slight KL-penalty towards a standard normal on the learned latent, similar to a VAE [46, 69], whereas VQ-reg. uses a vector quantization layer [96] within the
    decoder.
- id: c3
  statement: 'Regularization vs sample quality: LDMs trained in VQ-regularized latent spaces sometimes achieve better sample quality even though VQ-regularized first stages reconstruct slightly worse than
    their continuous (KL) counterparts.'
  location: Section 4
  page: 5
  quote: Interestingly, we ﬁnd that LDMs trained in VQ-regularized latent spaces sometimes achieve better sample quality, even though the reconstruction capabilities of VQ-regularized ﬁrst stage models
    slightly fall behind those of their continuous counterparts, cf. Tab. 8.
- id: c4
  statement: 'Compression trade-off (downsampling factor f in {1,...,32}, single A100, same steps and parameter count, class-conditional ImageNet for 2M steps): small f (1, 2) trains slowly and large f
    stagnates in fidelity; the authors attribute this to leaving most perceptual compression to the diffusion model versus information loss from too strong first-stage compression, and conclude LDM-4 and
    -8 offer the best conditions.'
  location: Section 4.1
  page: 5
  quote: we attribute this to i) leaving most of perceptual compression to the diffusion model and ii) too strong ﬁrst stage compression resulting in information loss and thus limiting the achievable quality.
- id: c5
  statement: 'Protocol of the efficiency analysis: the sample-quality curves in Figures 6, 7 and 17 are computed on 5k samples for efficiency, so they may differ from the 50k-sample results in Tables 1
    and 10; learning rates were maximized per model subject to stable training and therefore vary slightly between runs.'
  location: Appendix E.3.5
  page: 27
  quote: For efﬁciency reasons we compute the sample quality metrics plotted in Fig. 6, 17 and 7 based on 5k samples.
- id: c6
  statement: 'FID protocol for unconditional and class-conditional results: statistics from 50k model samples and the entire training set, computed with torch-fidelity and cross-checked with Dhariwal and
    Nichol''s script; scores mainly coincided with slight differences on ImageNet and LSUN-Bedrooms, and the authors emphasize the importance of a unified procedure for sample quality assessment. Text-to-image
    FID/IS use 30000 MS-COCO validation samples, and some Table 2 baseline numbers are taken from other papers.'
  location: Appendix E.3.1
  page: 26
  quote: We follow common practice and estimate the statistics for calculating the FID-, Precision- and Recall-scores [29,50] shown in Tab. 1 and 10 based on 50k samples from our models and the entire training
    set of each of the shown datasets.
- id: c7
  statement: 'Guidance in latent space: classifier-free guidance (cited as [32]) greatly boosts text-to-image sample quality on MS-COCO; reported guided settings use scales 1.5 (text-to-image, ImageNet
    LDM-4-G) and 1.25 (ImageNet, Table 10). No description of how the guidance scale was chosen was found in the text (searched for sweep, select, choose, tune).'
  location: Section 4.3.1
  page: 7
  quote: We note that applying classiﬁer-free diffusion guidance [32] greatly boosts sample quality, such that the guided LDM-KL-8-G is on par with the recent state-of-the-art AR [26] and diffusion models
    [59] for text-to-image synthesis, while substantially reducing parameter count.
- id: c8
  statement: 'Compute comparison: competing methods'' compute (V100-days) is taken from [15] unless stated otherwise, and the authors'' single-A100 training days are converted to V100-days by assuming a
    2.2x A100-over-V100 speedup.'
  location: Appendix F (Computational Requirements)
  page: 28
  quote: we convert the A100 days to V100 days by assuming a ×2.2 speedup of A100 vs V100
- id: c9
  statement: 'Stated limitations: sequential sampling is still slower than GANs, and the autoencoder''s reconstruction capability can become a bottleneck for tasks needing fine-grained pixel accuracy even
    though the f = 4 quality loss is very small; the authors assume their super-resolution models are already somewhat limited in this respect.'
  location: Section 5
  page: 9
  quote: 'Moreover, the use of LDMs can be questionable when high precision is required: although the loss of image quality is very small in our f = 4 autoencoding models (see Fig. 1), their reconstruction
    capability can become a bottleneck for tasks that require ﬁne-grained accuracy in pixel space.'

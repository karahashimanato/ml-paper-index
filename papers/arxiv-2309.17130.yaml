    a subagent. Results tables not recorded; claims only. Affiliations: University of Mannheim and University of Rostock (PDF page 1). Venue from the PDF page header ''Published as a conference paper at
    ICLR 2024''; year is the first arXiv version (2023). Section numbers are from numbered headings. Conflict of interest: GRANDE builds on the first author''s own GradTree (Marton et al., 2023), stated
    in the paper; GradTree is not a compared baseline in the main table. Runtime (Section 4.2): GRANDE averaged 47 s per dataset (max 107 s) vs about 130 s for NODE, but the authors note GBDT frameworks,
    especially XGBoost on GPU, have significantly lower runtimes than gradient-based methods; hardware listed in Table 9 caption (NVIDIA RTX A6000). Only binary classification is evaluated. Default-parameter
    results: highest normalized mean 0.6371 and MRR 0.6404 (Section 4.2). SAINT could not be tuned with 250 trials due to its runtime (Appendix C). Result tables not recorded.'

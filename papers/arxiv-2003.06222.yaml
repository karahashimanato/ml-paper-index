    by The Alan Turing Institute under EPSRC grant EP/N510129/1); the code repositories (TCPDBench, AnnotateChange, and the bocpdms/rbocpdms code used) are under the alan-turing-institute GitHub organization.
    No venue: the PDF states none (it carries an arXiv changelog; v3 expanded the Oracle grid search, switched to critical-difference diagrams and updated results; v2 corrected an F1 computation error).
    Section numbers 2-6 and 4.4 are confirmed by the outline paragraph and cross-references; subsection names are used otherwise. Motivation: algorithms are typically evaluated on simulated data and a few
    reused real series with unreliable ground truth. Annotation tool: no dates, values or series names shown; introductory synthetic series with feedback, repeated if the annotator''s F1 is too low. Methods
    use existing (mostly author-provided) packages; rfpop''s grid has 2,424 configurations, and the authors note the Oracle is not indicative of real-world performance since a data scientist cannot identify
    the most accurate segmentation among grid results. rbocpdms failed on two univariate series in Default (scored zero); uk_coal_employ (missing values) excluded. Quality-control series excluded from the
    benchmark. Appendix B simulates chance agreement (Poisson/uniform annotations) and finds agreement significantly above chance for most series. Results tables (Table 2) not recorded.'

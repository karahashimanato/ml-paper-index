claims:
- id: c1
  statement: Many CIC-IDS2017 results are hard to compare because of labeling errors, inconsistent flow extraction, potential leakage and benign-dominated metrics.
  location: Abstract
  page: 1
  quote: Still, many published results on this dataset are difficult to compare due to labeling errors, inconsistent flow extraction, potential leakage, and performance evaluation metrics dominated by benign
    traffic.
- id: c2
  statement: Eleven tabular classifiers are evaluated at binary, nine-class and fifteen-class levels; a soft-voting ensemble of RF, XGBoost and LightGBM is best at the fine tier.
  location: Abstract
  page: 1
  quote: A soft-voting ensemble of Random Forest, XGBoost, and LightGBM obtains the best fine-tier macro-F1 of 0.955, with coarse and binary macro-F1 scores of 0.980 and 0.999, respectively.
- id: c3
  statement: Classifiers are trained with hyperparameters curated from prior literature; no tuning procedure was found in the text.
  location: Methodology
  page: 4
  quote: Eleven classifiers are trained on the training split, with hyperparameters set curated from prior literature.
- id: c4
  statement: Flows are partitioned 70/15/15 into train/validation/test with a seeded stratified shuffle on the coarse attack family.
  location: Methodology
  page: 4
  quote: The labeled and preprocessed flows are partitioned into train (70%), validation (15%), and test (15%) sets using a seeded stratified shuffle on the coarse attack family.
- id: c5
  statement: Performance is effectively saturated, so substituting another tabular classifier has little value on single-dataset CIC-IDS2017 studies.
  location: Discussion
  page: 7
  quote: For single-dataset CIC-IDS2017 studies, this leaves little value in simply substituting another tabular classifier; meaningful progress requires changes to the data, feature representation, rare-class
    treatment, or transfer setting.
- id: c6
  statement: 'Limitations: CIC-IDS2017 is a controlled five-day benchmark, and the smallest classes have very few test samples.'
  location: Limitations
  page: 7
  quote: 'The smallest classes also limit statistical confidence: Heartbleed has one test sample, SQL Injection has four, and Infiltration has ten.'

proposes:
- 'TuRBO (trust region Bayesian optimization): several simultaneous local BO runs, each with an independent GP in a hyperrectangular trust region centred at its best point that expands after consecutive
  successes and shrinks after consecutive failures (restarted when too small), with batch candidates allocated across trust regions by Thompson sampling (an implicit multi-armed bandit)'
claims:
- id: c1
  statement: 'Motivation: the authors take the view that BO struggles on high-dimensional problems with thousands of observations because global probabilistic models are implicitly homogeneous and global
    acquisition over-emphasizes exploration.'
  location: Abstract
  page: 1
  quote: In this paper we take the view that this is due to the implicit homogeneity of the global probabilistic models and an overemphasized exploration that results from global acquisition.
- id: c2
  statement: 'Stationarity assumption: commonly used global GP models implicitly suppose that characteristic lengthscales and signal variances are constant across the search space (e.g. RL objectives with
    sparse rewards are nearly constant in large regions); non-stationary kernels avoid this but are too expensive for the large-scale setting.'
  location: Introduction
  page: 2
  quote: implicitly suppose that characteristic lengthscales and signal variances of the function are constant in the search space
- id: c3
  statement: 'Trust region: a hyperrectangle centred at the best solution (smallest posterior mean under noise), with per-dimension side lengths rescaled by the GP lengthscales; it is doubled after tau_succ
    consecutive successes, halved after tau_fail consecutive failures, and discarded and restarted when below L_min. These thresholds and initial/maximum lengths are hyperparameters of TuRBO (values in
    the supplement).'
  location: The trust region Bayesian optimization algorithm
  page: 3
  quote: We choose our TR to be a hyperrectangle centered at the best solution found so far
- id: c4
  statement: 'Global allocation: TuRBO maintains m trust regions with independent local GPs; for each of the q batch candidates a Thompson sample is drawn from every local GP and the point with the smallest
    sampled value across all trust regions is selected.'
  location: The trust region Bayesian optimization algorithm
  page: 4
  quote: To solve this problem, we ﬁnd that TS provides a principled solution to both the problem of selecting candidates within a single TR, and selecting candidates across the set of trust regions simultaneously.
- id: c5
  statement: 'Baseline configuration: BOCK and BOHAMIANN have their EI criterion replaced by batch Thompson sampling so that all BO methods use the same criterion; their original implementations do not
    support batch suggestions and needed changes. The authors note that NM, BFGS and BOBYQA are inherently sequential and thus have an edge per evaluation but are slower per wall time with large batches.'
  location: Numerical experiments
  page: 5
  quote: The standard acquisition criterion EI used in BOCK and BOHAMIANN is replaced by (batch) TS, i.e., all methods use the same criterion which allows for a direct comparison.
- id: c6
  statement: 'Evaluation protocol: five problems (14D robot pushing, 60D rover trajectory, 12D cosmological constants, 12D lunar landing, 200D Ackley) with budgets of 1,500 to 20,000 evaluations and batch
    sizes of 50 or 100; plots show the mean with one standard error. The number of replications for these main problems was not found in the text (searched for runs, replications, trials, repeated); the
    supplementary synthetic experiments use 30 runs. For the robot pushing and rover problems the authors compare with EBO values reported by Wang et al. after more evaluations rather than rerunning that
    setting.'
  location: Numerical experiments
  page: 5
  quote: Performance plots show the mean performances with one standard error.
- id: c7
  statement: 'Local vs global GP regression on the robot pushing problem (20 hypercubes x 200 points; isotropic kernel for illustration): local GPs had better held-out log loss than a single global GP on
    all 4000 points in every one of 50 trials (significant under a t-test, p < 1e-4), and the fitted hyperparameters, especially the signal variance, varied substantially across regions.'
  location: The advantage of local models over global models
  page: 7
  quote: Furthermore, the local GPs perform better than the global GP in every repeated trial.
- id: c8
  statement: 'Scaling cost: GP regression uses GPyTorch (conjugate gradients and Lanczos) with a Matérn-5/2 ARD kernel; without it, BO with a GP for more than a few thousand evaluations would be infeasible
    because classical GP regression scales cubically. Reported algorithm overhead excludes objective-evaluation time.'
  location: Supplementary material (Gaussian process regression)
  page: 14
  quote: Without GPyTorch, running BO with a GP model for more than a few thousand evaluations would be infeasible as classical approaches to GP regression scale cubically in the number of data points.
- id: c9
  statement: 'Large batches: for TuRBO-1 on robot pushing with batch sizes 1 to 64 (30 replications), larger batches obtained better results for the same number of batches, and the authors describe the
    speed-up as essentially linear in terms of evaluations.'
  location: The efﬁciency of large batches
  page: 9
  quote: We see that the speed-up is essentially linear.

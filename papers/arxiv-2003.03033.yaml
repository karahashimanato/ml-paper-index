  notes: 'Selected for the method article requested by the user (2026-10-10): knowledge distillation and pruning (soft targets and temperature, hint-based and self distillation, teacher-student gaps and
    fidelity; magnitude, gradual, single-shot, movement and LLM pruning, lottery tickets, and how pruning is evaluated). Carded by a subagent. Results tables not recorded; claims only. Affiliation: MIT
    CSAIL (all authors). Venue: PDF page 1 footer ''Proceedings of the 3rd MLSys Conference, Austin, TX, USA, 2020'' and arXiv comment ''Published in Proceedings of Machine Learning and Systems 2020 (MLSys
    2020)''. Section numbers are from numbered headings and cross-references (Section 4.5, Section 7). Corpus: 79 pruning papers since 2010 plus LeCun et al. 1990 and Hassibi et al. 1993. Conflict of interest:
    co-author Jonathan Frankle is first author of arxiv-1803.03635 (Frankle & Carbin, 2019) and Frankle et al. 2019, which are cited among the ''consistent findings'' (global pruning, pruned models vs retraining
    from scratch, magnitude baselines being competitive) and appear as data points (e.g. ''Frankle 2019, ResetToEpoch'') in the meta-analysis figures; ShrinkBench is the authors'' own library and is evaluated
    here by them; Blalock et al. 2018 is cited in the compression-ratio discussion. The paper also notes that Liu et al. (2019) and Frankle & Carbin (2019) have circular references to each other that cannot
    be resolved because of simultaneous revisions (Section 5.1), and names Gale et al. (2019) and Liu et al. (2019) as arguably the only papers that control for confounders by using the same code and averaging
    enough runs (Section 4.5). A seed effect is quoted in body text: for Global Gradient at compression 16, different seeds gave 0.88 vs 0.61 accuracy (Section 7.3). ShrinkBench accuracy curves are figure-only
    and not recorded.'

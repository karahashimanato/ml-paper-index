  notes: 'Selected for the topic article requested by the user (2026-10-03): algorithm design techniques (divide and conquer, dynamic programming, branch and bound, local search) and machine learning; carded
    by a subagent. Results tables not recorded; claims only. Exactness (our reading, not a statement of the paper): only the variable selection scoring rule changes, so a B&B run to completion remains exact
    and what is learned affects tree size; note that the theory assumes the cost is capped at kappa (e.g. terminating B&B when the tree grows beyond a bound), so capped runs need not finish. Cited worst
    case (Liberatore 2000): finding an approximately optimal branching variable, even at the root, is NP-hard (Introduction). The authors contrast their results with SCIP fixing the product/linear mixing
    parameter at 5/6 (Achterberg 2009) regardless of input (Introduction). Data-dependent Rademacher bounds are given as tighter alternatives when the number of parameter intervals is small. Experiments:
    m = 100 combinatorial auction instances (CATS ''arbitrary'' 200 bids/100 goods, ''regions'' 400 bids/200 goods), m = 500 facility location (70x70), clustering (35 points, k = 5), linear separator (50
    points) instances; run on 64 AWS c3.large instances. No train/test generalization experiment in the main text figures (tree size vs parameter averaged over samples). Results not recorded.'

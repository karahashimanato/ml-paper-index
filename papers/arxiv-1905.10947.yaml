  notes: 'Selected for the method article requested by the user (2026-10-10): graph neural networks (GCN, GraphSAGE, GAT, SGC, message passing, expressive power and the WL test, oversmoothing, oversquashing,
    heterophily, and evaluation pitfalls and benchmarks). Carded by a subagent. Results tables not recorded; claims only. Venue from the arXiv comment (''Accepted in International Conference on Learning
    Representations (ICLR) 2020'') and the PDF header (''Published as a conference paper at ICLR 2020''). Year is the first arXiv version (2019). Section numbers from numbered headings and cross-references
    in the PDF (''See Sections 3.3 (general case) and 4 (GCN case)'', ''The discussion in Section 5'', ''see Section 6.3''). The paper frames itself as extending over-smoothing explanations for linear GNNs
    (citing Li et al. 2018, i.e. arxiv-1801.07606, and others) to non-linear GNNs; Remark 2 gives a counterexample (Appendix C) to a theorem in an old preprint of Luan et al. (2019). The upper bound l*log(s*lambda)
    is reported to approximate actual distances when s*lambda is small but to be loose for large s*lambda (Section 6.2). Appendix H.3: noisy Cora/CiteSeer/PubMed built by uniformly adding 2500/5000, 5000
    and 25000 edges; Kipf & Welling data split (''a transductive learning ... setting''); hyperparameters chosen by TPE via Optuna from 3 training runs per configuration, test accuracy averaged over 3 runs;
    weights rescaled at initialization so their maximum singular value equals s in {0.5, s1, 3, 10}. Discussion also conjectures that too-large weights may hurt generalization (a ''sweet spot'' trade-off),
    stated as a conjecture. Affiliation/COI: the first author lists Preferred Networks, and the implementation uses Chainer Chemistry (footnote URL under github.com/pfnet-research) and Optuna; the paper
    does not benchmark these tools, so no direct conflict for the reported comparisons. Accuracies are figure-only (Figures 3, 4) and not recorded.'

proposes:
- 'Nucleus (top-p) Sampling: sample from the smallest set of tokens whose cumulative probability exceeds p, truncating the unreliable tail'
claims:
- id: c1
  statement: 'Main observation (framed in the abstract as a counter-intuitive empirical observation): maximization-based decoding methods such as beam search lead to degeneration, i.e. output text that
    is bland, incoherent, or stuck in repetitive loops.'
  location: Abstract
  page: 1
  quote: maximization-based decoding methods such as beam search lead to degeneration — output text that is bland, incoherent, or gets stuck in repetitive loops.
- id: c2
  statement: 'Contribution: Nucleus Sampling, proposed as a simple method that draws considerably higher quality text from neural language models than previous decoding strategies.'
  location: Abstract
  page: 1
  quote: To address this we propose Nucleus Sampling, a simple but effective method to draw considerably higher quality text out of neural language models than previous decoding strategies.
- id: c3
  statement: 'Against a search-error explanation: asking whether beam search merely fails to find higher-probability, higher-quality text, the authors point to Figures 2 and 6, where the per-token probability
    of natural text is on average much lower than that of beam-search text; they conjecture that human text not being the most probable is an intrinsic property of human language.'
  location: Natural Language Does Not Maximize Probability
  page: 7
  quote: Yet Figures 2 & 6 show that the per-token probability of natural text is, on average, much lower than text generated by beam search.
- id: c4
  statement: 'Protocol: GPT-2 Large (762M parameters) generates 5,000 passages conditioned on WebText held-out paragraphs, each ending at an end-of-document token or 200 tokens; methods are compared against
    human text on perplexity, Zipf coefficient, Self-BLEU, repetition and HUSE.'
  location: Experimental setup
  page: 6
  quote: Our analysis is based on generating 5,000 text passages, which end upon reaching an end-of-document token or a maximum length of 200 tokens.
- id: c5
  statement: 'Repetition metric: a phrase of at least two tokens counts as a repetition when it repeats at least three times at the end of the generation (within the first 200 tokens).'
  location: Distributional Statistical Evaluation
  page: 9
  quote: A phrase (minimum length 2) is considered a repetition when it repeats at least three times at the end of the generation.
- id: c6
  statement: 'Link to greedy decoding: all stochastic methods show repetition issues when their parameters are set too low, which over-truncates and mimics greedy search.'
  location: Distributional Statistical Evaluation
  page: 9
  quote: Further, all stochastic methods face repetition issues when their tuning parameters are set too low, which tends to over-truncate, mimicking greedy search.
- id: c7
  statement: 'Caveat on beam width: beam search looks less repetitive on this metric as beam width grows largely because generations get shorter as the beam width increases.'
  location: Distributional Statistical Evaluation
  page: 9
  quote: Finally, although beam search becomes less repetitive according to this metric as beam width increases, this is largely because average length gets shorter as b increases (see Appendix A).

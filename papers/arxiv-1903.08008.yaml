proposes:
- Rank-normalized split-R-hat and folded-split-R-hat (computed on absolute deviations from the median), reporting the maximum of the two as a single conservative R-hat
- Bulk-ESS (ESS of rank-normalized draws) and tail-ESS (minimum ESS of the 5% and 95% quantiles), plus local efficiency measures for quantiles and small intervals and a Monte Carlo error estimate for quantiles
- Rank plots (per-chain histograms of ranks over all chains) as a replacement for trace plots
claims:
- id: c1
  statement: 'Two problems with the traditional (split-)R-hat identified by the opening example: (1) if chains have different variances but the same mean, traditional R-hat is approximately 1; (2) if chains
    have infinite variance, traditional R-hat is approximately 1 even if one chain has a different location; this can also cause numerical instability for thick-tailed distributions with technically finite
    variance, and it is typically hard to assess empirically whether a chain has large but finite or infinite variance.'
  location: Introduction (Example where traditional R-hat fails)
  page: 3
  quote: 'This example identiﬁed two problems with traditional bR:'
- id: c2
  statement: A related problem is that R-hat is typically computed only for the posterior mean; this estimates convergence in the bulk of the distribution but says little about convergence in the tails,
    which matters for posterior interval estimates and inferences about rare events.
  location: Introduction (Example where traditional R-hat fails)
  page: 3
  quote: it says little about the convergence in the tails
- id: c3
  statement: 'Recommended threshold: use the sample only if the (rank-normalized, folded) R-hat < 1.01, a threshold much tighter than the one recommended by Gelman and Rubin (1992). The authors state that
    R-hat cannot in general be interpreted as a potential scale reduction factor, and that in practice and in simulations R-hat can dip below 1.1 well before convergence in some examples, which they found
    much more rare with the 1.01 threshold.'
  location: Recommendations for practice
  page: 4
  quote: This threshold is much tighter than the one recommended by Gelman and Rubin (1992), reﬂecting lessons learnt over more than 25 years of use, as well as the simulation results in Appendix A.
- id: c4
  statement: 'Number of chains: the authors recommend at least four chains by default, because multiple chains are more likely to reveal multimodality and poor adaptation or mixing (they cite seeing such
    examples for complex, misspecified or non-identifiable models on the Stan discussion forum), and parallel chains add no computation time on most computers. Massive parallelization (e.g. 1000+ chains)
    is not considered and needs further research.'
  location: Recommendations for practice
  page: 4
  quote: In addition, we recommend running at least four chains by default.
- id: c5
  statement: 'ESS threshold: the authors recommend requiring rank-normalized ESS > 400, a number chosen based on practical experience and simulations as typically sufficient to get a stable estimate of
    the Monte Carlo standard error, to ensure reliable estimates of the variances and autocorrelations needed for R-hat and ESS.'
  location: Recommendations for practice
  page: 5
  quote: we recommend requiring that the rank-normalized ESS is greater than 400
- id: c6
  statement: 'R-hat itself requires reliable variance and autocorrelation estimates: the authors only recommend relying on R-hat to judge chain quality if each split chain has an average ESS of at least
    50; with the minimum recommended setup of four chains, total ESS should be at least 400 before R-hat is expected to be useful.'
  location: Section 3.2 (The effective sample size)
  page: 8
  quote: In particular, we only recommend relying on the bR estimate to make decisions about the quality of the chain if each of the split chains has an average ESS estimate of at least 50.
- id: c7
  statement: 'Fixes: R-hat and ESS are computed on rank-normalized draws (pooled ranks mapped through the inverse normal CDF), which is well defined even without finite mean or variance and invariant to
    monotone transformations; because both original and rank-normalized split-R-hat can be fooled by chains with the same location but different scales (e.g. a chain stuck near the middle), R-hat is also
    computed on folded draws (absolute deviation from the median), and the maximum of the two is reported. Bulk-ESS is not directly applicable to the Monte Carlo standard error of the posterior mean.'
  location: Section 4 (Improving convergence diagnostics)
  page: 9
  quote: To obtain a single conservative bR estimate, we propose to report the maximum of rank normalized split- bR and rank normalized folded-split- bR for each parameter.
- id: c8
  statement: Tail-ESS is defined as the minimum of the effective sample sizes of the 5% and 95% quantiles, to assess sampling efficiency in the tails; it can help diagnose problems due to different scales
    of the chains. The authors observe that efficiency for tail quantiles is often lower than for the mean or median.
  location: Section 4.3 (Localizing convergence diagnostics)
  page: 10
  quote: To get a better sense of the sampling efﬁciency in the distributions’ tails, we propose to compute the minimum of the effective sample sizes of the 5% and 95% quantiles, which we will call tail
    effective sample size (tail-ESS or tail-Seﬀ).
- id: c9
  statement: 'Hedge on the numerical targets: the R-hat and ESS targets are offered as first-level checks for many quantities; they should be adapted as necessary for the application, and ultimately domain
    expertise should be used to check that Monte Carlo standard errors for all quantities of interest are small enough.'
  location: Recommendations for practice
  page: 4
  quote: However, these values should be adapted as necessary for the given application, and ultimately domain expertise should be used to check that Monte Carlo standard errors (MCSE) for all quantities
    of interest are small enough.
- id: c10
  statement: 'Split-R-hat ingredients (Eq. 1-2): with M chains of N draws, the between-chain variance is B = N/(M-1) sum_m (mean_m - overall mean)^2 and the within-chain variance is W = (1/M) sum_m s_m^2,
    where s_m^2 is the sample variance of chain m with divisor N - 1.'
  location: Section 3.1
  page: 5
  quote: 'For each scalar summary of interest θ, we compute B and W, the between- and within-chain variances:'
- id: c11
  statement: 'Pooled variance estimate (Eq. 3): var+(theta|y) = ((N-1)/N) W + (1/N) B; it overestimates the posterior variance if the starting distributions are overdispersed but is unbiased under stationarity
    or as N goes to infinity, while W underestimates it for finite N because the chains have not yet explored the whole target.'
  location: Section 3.1
  page: 5
  quote: Meanwhile, for any ﬁnite N, the within-chain variance W should underestimate var(θ|y) because the individual chains haven’t had the time to explore all of the target distribution and, as a result,
    will have less variability.
- id: c12
  statement: 'R-hat (Eq. 4): R-hat = sqrt(var+(theta|y) / W), which for an ergodic process declines to 1 as N goes to infinity; it is called split-R-hat because chains are split in half (so M is twice the
    number of simulated chains), since without splitting R-hat would be fooled by non-stationary chains.'
  location: Section 3.1
  page: 6
  quote: Without splitting, bR would get fooled by non-stationary chains as in Figure 1b.

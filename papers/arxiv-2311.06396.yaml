id: arxiv-2311.06396
title: A comprehensive analysis of concept drift locality in data streams
authors:
- Gabriel J. Aguiar
- Alberto Cano
year: 2023
links:
  arxiv: https://arxiv.org/abs/2311.06396
  code: https://github.com/gabrieljaguiar/locality-concept-drift
source:
  version: arXiv v2
  retrieved_at: '2026-10-02'
  pdf_sha256: bd06f1560720d1bd8185399165ebb575cd6297cef5b6d8eb83372c339fc7b14c
tags:
  tasks:
  - concept-drift-detection
  method_families:
  - error-rate-drift-detectors
  - window-based-drift-detectors
  paradigms:
  - streaming
proposes:
- Locality-based categorization of concept drift
- Benchmark of 2,760 synthetic drifting streams
claims:
- id: c1
  statement: A locality/scale-based categorization of concept drift yields 2,760 benchmark problems.
  location: Abstract
  page: 1
  quote: A systematic approach leads to a set of 2,760 benchmark problems
- id: c2
  statement: Nine supervised drift detectors are compared across the difficulties.
  location: Abstract
  page: 1
  quote: We conduct a comparative assessment of 9 state-of-the-art drift detectors across diverse difficulties
- id: c3
  statement: 'ADWIN, DDM and PH were strong overall: few false alarms on stationary streams and good detection with drift.'
  location: Section 5.1
  page: 12
  quote: ADWIN, DDM, and PH stood out as strong performers in both evaluated scenarios.
- id: c4
  statement: ADWIN and PH consistently showed the best detection performance across all scenarios.
  location: Results
  page: 13
  quote: ADWIN and PH consistently demonstrated superior detection performance across all evaluated scenarios.
- id: c5
  statement: EDDM had the lowest delay and second-highest recall but so many alarms that its precision was 0%.
  location: Section 5.1
  page: 12
  quote: EDDM exhibited the lowest delay among all evaluated drift detectors and the second-highest recall, although this came at the cost of raising numerous drift alerts, leading to a precision of 0%.
- id: c6
  statement: 'Difficulty from easiest to hardest: multi-class global, single-class global, multi-class local, single-class local.'
  location: Results
  page: 13
  quote: 'a hierarchy of difficulty emerges, from easiest to hardest detection as follows: Multi-Class Global, Single-Class Global, Multi-Class Local, Single-Class Local.'
- id: c7
  statement: More localized drifts produce more false alarms for all detectors.
  location: Results
  page: 13
  quote: scenarios with more localized drifts tended to generate a higher number of false alarms.
- id: c8
  statement: Completely retraining the classifier after detection reduced accuracy in all evaluated scenarios.
  location: Results (classifier impact)
  page: 21
  quote: completely retraining the classifier resulted in decreased accuracy across all evaluated scenarios.
- id: c9
  statement: A Hoeffding Tree is the monitored classifier; detectors monitor its binary error signal.
  location: Experimental setup
  page: 10
  quote: we opted to use Hoeffding Tree (HT) [49] as our classifier.
- id: c10
  statement: Error-rate-based detectors often raise many false alarms, even on positive changes in the error rate.
  location: Lessons learned
  page: 24
  quote: Drift detectors that rely on error rates often generate numerous false alarms.
- id: c11
  statement: On stationary streams, ADWIN and DDM raised the fewest false alarms.
  location: Section 5.1
  page: 12
  quote: DDM and ADWIN displayed the lowest values of false alerts
- id: c12
  statement: Experiments, stream generators and detectors were implemented in Python with the river library.
  location: Experimental setup
  page: 11
  quote: All the experiments, generators and drift detectors were implemented using Python 3.8 and the river [50] package.

  notes: 'Selected for the topic article requested by the user (2026-10-03): model fallback and model selection in MLOps (meta-learned selection, dynamic selection, abstention/deferral, switching triggers,
    cascades/routing, monitoring); carded by a subagent. Results tables not recorded; claims only. Affiliation: Massachusetts Institute of Technology; supported by NSF CAREER award #1350965. Measured quantities:
    system accuracy, coverage and classifier accuracy on non-deferred examples (CIFAR, CIFAR10H), discrimination (FPR difference) for hate speech, system AU-ROC/AU-PR versus coverage for CheXpert. Evaluation-practice
    note: in the CheXpert experiments coverage is fixed by setting the deferral threshold tau at a percentile of the score q(x) computed over the test set (''The deﬁnition of τ ensures that we obtain exactly
    c% coverage''); alpha was chosen on a validation set (grid search for hate speech; validation AU-ROC for CheXpert), and temperature scaling on the validation set calibrates the baselines. The only real
    human labels used are the CIFAR10H crowdworker annotations, and even there the expert is sampled from label counts. Stated future work (Conclusion): limited expert data, biased expert data, and deferring
    to multiple experts. No text-classification task tag exists in registry/tags.yaml, so the hate-speech experiment is not reflected in the task tags. Consistency caveat (Section 4): ''note that for α
    ≠ 1 the loss LCE is no longer consistent'', yet alpha is treated as a hyperparameter and tuned (e.g. alpha chosen on validation AU-ROC for CheXpert), so reported results for alpha != 1 are not covered
    by Theorem 1. Section 5.1 (''Failure of Confidence Scores Method'') argues that comparing separately learned classifier and expert confidences [RBC+19] does not allow the classifier to adapt to the
    expert''s strengths and weaknesses and can fail when H and R are restricted.'

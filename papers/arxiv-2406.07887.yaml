  notes: 'Selected for the method article requested by the user (2026-10-10): alternatives and extensions to dense Transformers (sparse mixture-of-experts routing and load balancing, state space models
    from HiPPO/S4 to Mamba-2, linear and kernelized attention, RWKV, and benchmarks/analyses comparing them with Transformers). Carded by a subagent. Results tables not recorded; claims only. Affiliations:
    NVIDIA (most authors; Waleffe also University of Wisconsin-Madison, work as NVIDIA intern), Tri Dao (Princeton, Together AI), Albert Gu (CMU, Cartesia AI). Conflict of interest: Dao and Gu are the authors
    of Mamba and Mamba-2, the SSMs evaluated here; NVIDIA authors evaluate models trained with their own Megatron-LM and release them. The paper calls itself a ''technical report''; no venue recorded (arXiv
    record has no comment/journal_ref). Section numbers from numbered headings in the PDF dump. On 3.5T tokens only pure Mamba-2 (not Mamba) was trained, because pure Mamba on 1.1T was almost 3x slower
    than Mamba-2 (Section 3.3.1). Training data: 70% English, 15% non-English, 15% code, predecessors of the Nemotron-4 data; 256K SentencePiece vocabulary. Hybrid ablations (Section 4.1, 130M/840M models):
    validation loss minimized at roughly 8% attention layers; 30-50% MLP layers without loss increase; hybrids without RoPE did better after long-context extension. No description of how the Figure 5 inference
    prediction was computed was found (searched for predicted, estimat, simulat, roofline). Hybrid vs Transformer averages (+2.65 on 12 tasks), RULER and Phonebook long-context results are tables/figures
    and not recorded.'

proposes:
- 'Neural Diving: a generative GNN that produces partial integer assignments whose remaining sub-MIPs are solved by SCIP (primal heuristic)'
- 'Neural Branching: a GNN branching policy imitating an ADMM-based, GPU-batched variant of Full Strong Branching, integrated in SCIP'
claims:
- id: c1
  statement: 'Relation to B&B: two learned components are plugged into a base MIP solver (SCIP): Neural Diving for finding high-quality assignments (primal side) and Neural Branching for variable selection
    in branch-and-bound (bounding the gap).'
  location: Abstract
  page: 1
  quote: Our approach constructs two corresponding neural network-based components, Neural Diving and Neural Branching, to use in a base MIP solver such as SCIP.
- id: c2
  statement: 'Neural Branching''s expert: because a CPU-based Full Strong Branching implementation can be too expensive on large-scale MIPs even for offline data generation, the authors build an FSB variant
    using ADMM that batches the LP computations on GPU (solving the LPs approximately) to generate imitation data.'
  location: Introduction
  page: 3
  quote: We develop a variant of FSB using the alternating directions method of multipliers (ADMM) (Boyd et al. 2011) that scales to large-scale MIPs by performing the required computation in a batch manner
    on GPU.
- id: c3
  statement: 'Exactness / metric: B&B tracks global primal and dual bounds; a zero primal-dual gap certifies optimality, but in practice B&B is terminated at an application-dependent relative gap, and evaluation
    reports average primal, dual or primal-dual gap over time plus survival plots.'
  location: Background
  page: 7
  quote: The gap is always nonnegative by construction, and if it is zero then we have solved the problem, the feasible point that corresponds to the primal bound is optimal and the dual bound is a certificate
    of optimality.
- id: c4
  statement: 'Baseline and tuning: the main baseline is SCIP 7.0.1 with its presolving, primal heuristics and cuts emphasis settings tuned per dataset by exhaustive grid search on 200 validation MIPs with
    a 3-hour limit (''Tuned SCIP'').'
  location: Evaluation
  page: 13
  quote: The main baseline we compare against is SCIP 7.0.1 with its parameters tuned for each test dataset.
- id: c5
  statement: 'Hardware fairness: in the joint comparison (only the sequential version of Neural Diving), Neural Diving (Sequential) and Neural Branching each use a CPU core and a GPU, so their combination
    uses two cores and two GPUs; Tuned SCIP is given two cores, used as two independent solves with different seeds (best bounds across the two runs), and GPU use is explicitly not controlled for.'
  location: Joint evaluation
  page: 31
  quote: Since SCIP does not use GPUs, we do not control for that resource when comparing Tuned SCIP and Neural Solvers.
- id: c6
  statement: 'Data splits: all datasets except MIPLIB are split randomly into disjoint 70/15/15% train/validation/test subsets (so, in our reading, test instances come from the same dataset rather than
    from a larger size class); for MIPLIB the 2017 Benchmark Set is the test set, and the 2017 Collection Set and the 2010 set (after removing overlaps with the Benchmark Set) are the training and validation
    sets, respectively.'
  location: Datasets
  page: 12
  quote: For MIPLIB, we use instances from the MIPLIB 2017 Benchmark Set as the test set, since that is the set on which solvers are evaluated.
- id: c7
  statement: 'Limitation (Neural Diving): the authors believe its strength is finding good solutions quickly but that it sometimes fails to find optimal or near-optimal solutions, e.g. losing to SCIP at
    the end on Electric Grid Optimization and MIPLIB survival plots.'
  location: Neural Diving results
  page: 21
  quote: We believe that the strength of our approach is in quickly finding good solutions, but it sometimes fails to find an optimal or near-optimal solution.

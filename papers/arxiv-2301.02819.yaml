  notes: 'Selected for the method article requested by the user (2026-10-10): deep learning architectures for tabular data (TabNet, NODE and differentiable trees, TabTransformer/FT-Transformer-style attention,
    SAINT, embeddings for numerical features, retrieval (TabR), regularized MLPs, CTR-style interaction models, self-supervised pretraining, and surveys/benchmarks comparing them with GBDTs). Carded by
    a subagent. Results tables not recorded; claims only. Affiliations: UIUC, Zhejiang University, University of Notre Dame. Version: arXiv v8 (25 Jul 2024), the KDD camera-ready; earlier arXiv versions
    may differ in protocol and results and were not read. Venue from the PDF (''KDD ’24, August 25–29, 2024, Barcelona, Spain'', DOI 10.1145/3637528.3671893); year is the first arXiv version (2023). Conflict
    of interest: Jimeng Sun is a co-author of the compared TransTab (reference [44], Wang and Sun), which was run with default hyperparameters; the authors'' own earlier tabular models (DANets, TabCaps,
    T2G-Former, refs [5], [6], [49]) are cited but not compared. Protocol caveats: (1) the tuning budget is stated inconsistently - XGBoost/CatBoost 500 tuning iterations (Experimental Setups; Tables 9-10),
    ''On small datasets, we tuned 50 iterations for each datasets'', ExcelFormer tuned for 50 iterations (Appendix C), and Appendix D says ''even with just 50 iterations of hyperparameter tuning applied
    to XGBoost and CatBoost'' for the timing comparison; which budget the GBDTs got on the 96 small datasets is not clear from the text. (2) ExcelFormer uses only one augmentation scheme per dataset (''our
    tests suggest that the effect of ExcelFormer on a certain dataset could be better by using only Feat-Mix or Hid-Mix''); how the scheme is picked for the default setting is reported as separate Feat-Mix
    (d) and Hid-Mix (d) rows. (3) A single 80/20 split per dataset; no statistical significance test was found in the text (searched for ''significan'', ''p-value'', ''t-test'', ''Wilcoxon''; ''significantly''
    is used only descriptively). Results are ranks in Tables 1-5 and per-dataset tables (Appendix G), not recorded. The headline ''surpassing GBDTs'' is a within-paper rank relation under this protocol.
    Section numbers: only Sec. 6.2 is confirmed by cross-reference for the results; other locations use section names. The ''TapPFN''/''TapFPN'' spelling in the text refers to TabPFN [17].'

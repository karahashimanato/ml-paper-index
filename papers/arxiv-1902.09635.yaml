proposes:
- 'NAS-Bench-101: a tabular NAS benchmark in which every architecture of a cell-based CIFAR-10 search space (about 423k unique cells) was trained 3 times at 4 epoch budgets with one fixed training pipeline,
  so that NAS experiments become table look-ups'
- 'A recommended benchmarking protocol: query (architecture, epoch budget) pairs with a random trial index, pick the incumbent by validation accuracy, stop at a simulated training-time limit, and score
  by immediate test regret over many independent runs'
claims:
- id: c1
  statement: 'Motivation: citing Li & Talwalkar (2019) and Sciuto et al. (2019), NAS research is described as notoriously hard to reproduce: some methods need months of compute, and different methods are
    not comparable because of different training procedures and search spaces, which makes it difficult to attribute success to the search algorithm itself.'
  location: Introduction
  page: 1
  quote: different methods are not compa-rable to each other due to different training procedures and different search spaces, which make it difﬁcult to attribute the success of each method to the search
    algorithm itself.
- id: c2
  statement: 'Search space: cells stacked into a fixed skeleton (stem, 3 stacks of 3 cells with downsampling); cells are DAGs with at most 7 vertices and 9 edges and only 3 operations (3x3 conv, 1x1 conv,
    3x3 max-pool), constraints chosen so the space still contains ResNet-like and Inception-like cells; the general encoding has about 510M models, of which many are invalid or isomorphic, leaving about
    423k unique graphs after de-duplication.'
  location: Section 2.2
  page: 3
  quote: After de-duplication, there are approximately 423k unique graphs in the search space.
- id: c3
  statement: 'Training: all models use a single fixed set of hyperparameters, chosen by a coarse grid search maximizing the average accuracy of 50 randomly sampled architectures (described as similar to
    standard practice and further justified in Section 5.1).'
  location: Section 2.4
  page: 3
  quote: We utilize a single, ﬁxed set of hyperparameters for all NAS-Bench-101 models.
- id: c4
  statement: Every architecture was trained and evaluated 3 times to measure variance, and at four epoch budgets (4, 12, 36, 108 epochs, each with the learning rate annealed to 0) to support multi-fidelity
    methods such as Hyperband, giving about 5M trained models.
  location: Section 2.4
  page: 3
  quote: We repeat the train-ing and evaluation of all architectures 3 times to ob-tain a measure of variance.
- id: c5
  statement: 'Protocol rule: only training and validation metrics should be used to search, and test accuracy only for offline evaluation.'
  location: Section 2.5
  page: 3
  quote: Only metrics on the training and validation set should be used to search models within a single NAS algorithm, and testing accuracy should only be used for an ofﬂine evaluation.
- id: c6
  statement: Validation and test accuracy are extremely highly correlated (r = 0.999) at 108 epochs, which the authors say suggests that strong optimizers are unlikely to overfit on the validation error
    within this benchmark.
  location: Section 3.1
  page: 4
  quote: We observed that the correlation between validation and test accuracy is extremely high (r = 0.999) at 108 epochs which suggests that strong optimizers are unlikely to overﬁt on the validation
    error.
- id: c7
  statement: 'Coverage limits of the comparison: weight-sharing and network-morphism NAS algorithms cannot be directly evaluated on the dataset and were not included; GP-based HPO (e.g. Spearmint) was also
    excluded (citing problems in high-dimensional discrete tasks), and BNN-based BO was excluded as too expensive; each optimizer''s own main meta-parameters were tuned (except TPE) with the best settings
    reported.'
  location: Section 4.1
  page: 6
  quote: NAS algorithms based on weight sharing (Pham et al., 2018; Liu et al., 2018b) or network morphisms (Cai et al., 2018; Elsken et al., 2018) cannot be directly evaluated on the dataset, so we did
    not include them.
- id: c8
  statement: 'Multi-fidelity observation: Hyperband and BOHB did not yield the speedups frequently observed compared to random search or Bayesian optimization, which the authors attribute to the relatively
    low rank correlation between performance at different budgets.'
  location: Section 4.1
  page: 6
  quote: The multi-ﬁdelity optimization algorithms HB and BO-HB do not yield the speedups frequently observed compared to RS or Bayesian optimization.
- id: c9
  statement: 'Stated limitation: to keep the benchmark computable, the evaluated models do not reach state-of-the-art CIFAR-10 performance, because the search space is constrained in size and operations
    (no NASNet-like complex architectures), the expensive ''augmentation trick'' is not applied, and advanced regularization (Cutout, ScheduledDropPath, decoupled weight decay) is not used.'
  location: Section 5.2
  page: 8
  quote: Unfortunately, this means that the models we evaluate do not reach current state-of-the-art performance on CIFAR-10.

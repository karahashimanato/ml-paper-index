  notes: 'Selected for the topic article requested by the user (2026-10-03): model size, data, compute and performance (scaling laws, compute-optimal training, cost measurement); carded by a subagent. Results
    tables not recorded; claims only. The Introduction and Table 1 total state 1,527 papers while the Present section states 1,526 papers. Network operations count multiply-adds as 2 FLOPs (footnote 10)
    and include pre-training, training and fine-tuning; neural architecture search cost is included in training cost (footnote 9). For MS COCO and ImageNet models with only network operations, hardware
    burden is imputed from a regression fitted on ImageNet models (Supplemental Materials, Model Analysis); the imputed values are thus regression-based estimates (for MS COCO the ImageNet regression is
    reused, footnote 16). The supplement notes that training time is sometimes not reported precisely, that authors generally do not report computing precision (leaving ''some residual uncertainty'') and
    sometimes conflate multiply-adds and FLOPs. Analysis is restricted to benchmarks with exact right/wrong answers (generative language/audio models excluded). Projected CO2 and dollar costs (Table 3)
    are extrapolations, not measurements. The authors present polynomial and exponential extrapolations as having roughly equivalent fits and state they do not anticipate the extrapolated targets will be
    hit. Affiliations include MIT and the MIT-IBM Watson AI Lab; funding includes the U.S. Air Force Research Laboratory (Acknowledgments). Uses Strubell et al. (card arxiv-1906.02243) for the cost methodology.'

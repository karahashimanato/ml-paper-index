proposes:
- 'Semi-permeable attention (SPA): self-attention over feature tokens with a fixed mask, from mutual-information feature importance, that lets only more informative features pass information to less informative
  ones; with interaction-attenuated initialization (SPA weight variance scaled by gamma = 1e-4)'
- GLU-based attentive feed-forward network (tanh gating) replacing the Transformer MLP, and a GLU feature embedding
- Hid-Mix (swapping embedding dimensions between two samples) and Feat-Mix (swapping features, labels mixed by mutual-information importance) data augmentation
claims:
- id: c1
  statement: 'The paper names three drawbacks of deep tabular models, following Grinsztajn et al. [13]: (P1) lack of rotational variance, (P2) large data demand, and (P3) over-smooth solutions; SPA targets
    P1, the tabular Mixup variants target P2, and the attentive feed-forward network targets P3.'
  location: Abstract
  page: 1
  quote: 'We delve into three key drawbacks of deep tabular models, encompassing: (P1) lack of rotational variance property, (P2) large data demand, and (P3) over-smooth solution.'
- id: c2
  statement: 'SPA: an unoptimizable mask built from feature importance (mutual information) blocks attention from a less informative feature to a more informative one, so information flows only from more
    to less informative features while pathways between any two features remain; the authors argue this partially disrupts DNNs'' rotational invariance.'
  location: Solving (P1) with Semi-Permeable Attention
  page: 4
  quote: In this way, only more informative features are permitted to propagate information to the less informative ones, and the reverse is not allowed.
- id: c3
  statement: 'Attentive feed-forward network: because the two-layer MLP feed-forward network of Transformers has lesser non-linear fitting capability for irregular feature-target relationships, it is replaced
    by a GLU layer with tanh instead of sigmoid; the authors say both use two fully connected layers and have similar computational cost.'
  location: Solving (P3) with GLU layer
  page: 5
  quote: Therefore, we replace the vanilla FFN by a Gated Linear Unit (GLU) layer.
- id: c4
  statement: 'Data augmentation: the authors say vanilla Mixup regularizes DNNs toward linear behavior between samples, which may conflict with irregular target functions; Hid-Mix swaps random embedding
    dimensions between two samples and Feat-Mix swaps random features, mixing labels by the mutual-information importance of the swapped features.'
  location: Solving (P2) with Data Augmentation
  page: 5
  quote: To address this challenge, we introduce two Mixup variants, Hid-Mix and Feat-Mix, which mitigate the conflicts in creating samples.
- id: c5
  statement: 'Datasets: 96 small datasets (fewer than 10,000 samples) from the Taptap dataset benchmark and 21 larger public datasets ranging from over 10,000 to 581,835 samples; data are split randomly
    80% train / 20% test (20% of training held out for validation), with the same split for all approaches, and ranks are averaged over 5 seeds.'
  location: Experimental Setups
  page: 6
  quote: A total of 96 small datasets sourced from the Taptap dataset benchmark2 were utilized.
- id: c6
  statement: 'Tuning protocol: XGBoost and CatBoost follow Gorishniy et al. [12] with the maximum number of trees raised from 2000 to 4096 and tuning iterations from 100 to 500 (Optuna); TransTab and XTab
    use default hyperparameters because their tuning spaces are not given; FT-Transformer, SAINT and TabPFN on large datasets use the hyperparameters of their papers; on small datasets 50 tuning iterations
    are run per dataset; ExcelFormer is reported with defaults, ''Mix Tuned'' (only augmentation hyperparameters) and ''Fully Tuned'' (50 iterations).'
  location: Experimental Setups (Compared Models)
  page: 6
  quote: from 2000 to 4096 and the number of tuning iterations from 100 to 500, which give a more stringent setting and better performances.
- id: c7
  statement: 'Within-paper relation on the 96 small datasets (average rank): ExcelFormer outperforms all hyperparameter-tuned baselines (XGBoost, CatBoost, FT-Transformer, MLP, DCN v2, AutoInt, SAINT) whether
    or not its own hyperparameters are tuned; even without Feat-Mix and Hid-Mix it still outperforms previous approaches.'
  location: Section 6.2
  page: 6
  quote: See Table 1, our ExcelFormer consistently outperforms other models that undergo dataset-adaptive hyperparameter tuning, regardless of whether the hyperparameters of the ExcelFormer are tuned or
    not, which underscores the superiority of our proposed ExcelFormer.
- id: c8
  statement: On the 21 larger datasets only XGBoost, CatBoost and FT-Transformer are compared (others excluded for relatively inferior performance and computational load), each with default and tuned hyperparameters;
    the authors report ExcelFormer outperforms them under both settings and that the default Hid-Mix version is comparable to tuned prior models.
  location: Section 6.2
  page: 6
  quote: We excluded other models from the comparison due to their relatively inferior performances and the significant computational load when dealing with large datasets.
- id: c9
  statement: 'Subgroup analysis (task type, sample size, number of features; all existing models tuned): default Hid-Mix ExcelFormer has the best rank in all subgroups except regression, where it slightly
    lags behind tuned XGBoost, while Mix Tuned ExcelFormer is best in all subgroups; runner-up positions are held by different models (TabPFN, FT-Transformer, XGBoost, CatBoost) in different subgroups.'
  location: Can ExcelFormer be a sure bet solution across various types of datasets?
  page: 7
  quote: As shown in Table 3, ExcelFormer with Hid-Mix (default) exhibits the best performance in all subgroups except for regression tasks, where it slightly lags behind hyperparameter-tuned XGboost.

    Face (all authors). Venue from the PDF footer (''EMC^2: 5th Edition Co-located with NeurIPS''19'') and the arXiv comment (''Accepted at the 5th Workshop on Energy Efficient Machine Learning and Cognitive
    Computing - NeurIPS 2019''). Version v4 (March 2020); the arXiv comment says this revision fixed a bug in evaluation metrics. Inconsistencies in the v4 PDF: Section 4.1 text says the two-step distillation
    on SQuAD reached ''79.8 F1 and 70.4 EM, i.e. within 3 points of the full model'' while Table 2 lists DistilBERT (D) as 79.1/86.9 EM/F1 (the text appears not updated); Table 1 caption says ELMo results
    are ''as reported by the authors'' while footnote 4 says jiant was used to compute the baseline; Table 3 caption calls STS-B ''sentiment analysis''. GLUE numbers are dev-set, not test-server. Other
    body-text statements: IMDb 0.6 point behind BERT, SQuAD within 3.9 points (Section 4.1). Conflict of interest: the evaluated model and the library it is distributed in are the authors'' own; BERT baseline
    numbers are medians over 5 seeds but no variance is reported. Section numbers are from numbered headings in the PDF.'

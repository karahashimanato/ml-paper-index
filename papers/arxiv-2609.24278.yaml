  notes: 'Approved from candidate issue #2 (2026-10-02); carded by a subagent. Results tables not recorded; claims only. Online change point detection (unsupervised, multivariate), framed as closely related
    to concept drift detection; tagged change-point-detection because it is evaluated on CPD benchmarks with CPD metrics against online and offline CPD baselines. The explanation part is compared with Integrated
    Gradients, GradientShap and DeepLIFT (hence feature-attribution). Baselines: BOCPD, e-divisive, KCP, OT-CPD, RuLSIF, RIO-LE/RIO-LC, ClaSP, DeepRuLSIF, DeepCLF; several run at package defaults with one
    varied parameter (e.g. lag). No error-rate detectors (DDM/ADWIN) compared. Published in TMLR (08/2026) per the PDF header; venue not set because it is not in the batch metadata.'

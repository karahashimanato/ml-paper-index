  notes: 'Selected for the topic article requested by the user (2026-10-03): model size, data, compute and performance (scaling laws, compute-optimal training, cost measurement); carded by a subagent. Results
    tables not recorded; claims only. Training compute for systems whose papers do not report it is estimated by the authors (see c3, c5). The Abstract states roughly 20-month doubling before 2010, while
    the Conclusion states an 18-month doubling time between 1952 and 2010; estimates differ across fits and tables. Doubling times come from log-linear fits with bootstrap (B = 1000) confidence intervals;
    each estimate is randomly multiplied by a log-uniform factor between 1/2 and 2 during bootstrapping (Appendix A). Low-compute outliers (Z < -2 relative to models published within 1.5 years per the Appendix
    A text; the Table 5 caption says within 2 years) are excluded (5 of 123 models); large-scale models are those with Z >= 0.76 after 2016, with thresholds chosen after visual inspection. Appendix H also
    lists non-sampling errors (incorrect calculations) and selection biases (academic publications, English, subjectively ''notable'' models, which the authors say makes doubling-time estimates higher).
    The Conclusion states the authors are not confident in the large-scale vs regular-scale distinction. Funding: Jaime Sevilla is funded by the Open Philanthropy Project (Acknowledgments); affiliations
    are universities and the Centre for the Governance of AI.'

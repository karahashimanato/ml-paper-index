  notes: 'Selected for the method article requested by the user (2026-10-10): AutoML systems and neural architecture search (CASH, pipeline search, ensembling/stacking, meta-learning warm starts, cost-aware
    search, AutoML benchmarks, NAS with RL/evolution/weight sharing/differentiable search, and NAS evaluation/reproducibility). Carded by a subagent. Results tables not recorded; claims only. Venue from
    the PDF first-page footnote (''Proceedings of the 36th International Conference on Machine Learning, Long Beach, California, PMLR 97, 2019'') and the arXiv comment. Section numbers from numbered headings
    in the PDF. Affiliations: Google Brain (Ying, Real, Christiansen, Murphy) and University of Freiburg (Klein, Hutter). Conflict-of-interest note: the benchmarked algorithms include regularized evolution
    (Real et al.; Real is a co-author), SMAC and BOHB (Hutter''s group; BOHB by Falkner, Klein, Hutter), and the authors'' own RL implementation; the paper does not state this as a conflict of interest,
    and says the intention of Section 4.1 ''is not to answer the question “Which methods work best on this benchmark?”, but rather to demonstrate the utility of a reproducible baseline''. Other body-text
    statements not recorded as claims: RE, BOHB and SMAC performed best over 500 runs per method and TPE fell back to random search (Section 4.1); locality analysis suggests a basin of attraction of width
    about 6 (Section 3.3); a NAS-Bench-Mini (<=6 vertices) bootstrap kept the ranking RS < NRE < RE, which ''suggests'' conclusions may generalize to larger spaces (Section 4.2); on NAS-HPO-Bench datasets
    the fixed-hyperparameter accuracy and the per-architecture tuned accuracy had Spearman rank correlation 0.9155 (Section 5.1). Benchmark is a single dataset (CIFAR-10) and a single training pipeline.
    Training details (Section 2.4): CIFAR-10 split 40k/10k/10k with standard augmentation, cosine decay, RMSProp, TPU v2; the introduction states over 100 TPU years of computation. RL in Section 4.1 is
    the authors'' own implementation (a categorical distribution per parameter optimized with REINFORCE, as an LSTM controller performed worse).'

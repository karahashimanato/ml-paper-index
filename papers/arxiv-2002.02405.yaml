proposes:
- 'An empirical study of the ''cold posterior'' effect: posterior predictive performance of SG-MCMC ensembles as a function of the posterior temperature T, with systematic tests of hypotheses for why T
  = 1 performs poorly'
- Kinetic and configurational temperature diagnostics for the simulation accuracy of SG-MCMC, and a layerwise preconditioner that is re-estimated only periodically
claims:
- id: c1
  statement: 'Cold posterior effect: for a ResNet-20 on CIFAR-10 and a CNN-LSTM on IMDB, the Bayes posterior predictive at T = 1 (approximated by SG-MCMC) performs worse than SGD-trained point estimates,
    and the best predictive performance on holdout data among tempered posteriors is achieved at T < 1. Appendix G reports that Brier score and ECE also improve with cold posteriors (ECE binning not stated).'
  location: Section 1.1
  page: 2
  quote: 'Cold Posteriors: among all temperized posteriors the best posterior predictive performance on holdout data is achieved at temperature T < 1.'
- id: c2
  statement: 'Why T < 1 is a problem: it artificially sharpens the posterior, which is equivalent to a Bayes posterior on 1/T replications of the data (with a rescaled prior), giving too strong evidence
    to individual models; and gains for T < 1 point to a problem with the prior, likelihood or inference.'
  location: Section 2.2
  page: 3
  quote: This is equivalent to a Bayes posterior obtained from a dataset consisting of 1/T replications of the original data, giving too strong evidence to individual models.
- id: c3
  statement: 'Literature: SG-MCMC papers on deep networks temper the posterior (in some cases inadvertently), and variational BNN papers down-weight the KL term (lambda < 1), which Appendix E shows corresponds
    to a partially tempered posterior; the authors are not aware of any published work showing well-performing Bayesian deep learning at T = 1.'
  location: Section 2.3
  page: 3
  quote: in fact we are not aware of any published work demonstrating well-performing Bayesian deep learning at temperature T = 1
- id: c4
  statement: 'Inference accuracy: new kinetic/configurational temperature diagnostics indicate accurate simulation, and on small MLPs with synthetic data generated from the prior (where T = 1 is optimal
    by construction, full-batch) SG-MCMC agrees closely with HMC; the authors conclude, for the cases tested, that missing accept-reject corrections cannot explain cold posteriors. Minibatch noise (batch
    sizes 32-256) and ensemble variance (an asymptotic extrapolation in Appendix F) were also judged unable to explain it.'
  location: Section 4.2
  page: 6
  quote: For the cases tested we conclude that SG-MCMC is almost as accurate as HMC and the lack of accept-reject correction cannot explain cold posteriors.
- id: c5
  statement: 'Dirty likelihood hypothesis: batch normalization, dropout and data augmentation are not formal likelihoods (the CIFAR-10 experiments use flip and pad-crop augmentation); an experiment with
    a clean likelihood in a modified ResNet, described as slightly inconclusive, still showed cold posteriors.'
  location: Section 5.1
  page: 7
  quote: demonstrates that cold posteriors remain when a clean likelihood is used in a suitably modiﬁed ResNet model
- id: c6
  statement: 'Prior: typical draws from the N(0, I) prior for ResNet-20 give concentrated class distributions, which the authors call a poor prior from a subjective Bayesian view; varying the prior variance
    did not remove the effect. The training-set-size experiment is called inconclusive but somewhat implicating the prior, and the conclusion states the prior may not be the only cause.'
  location: Section 5.2
  page: 7
  quote: The cold posterior effect cannot be resolved by using the right scaling of the Normal prior.
- id: c7
  statement: 'Capacity: for MLPs on CIFAR-10, the cold posterior effect becomes more prominent with increasing depth and width.'
  location: Section 5.2
  page: 7
  quote: This indicates a connection between model capacity and strength of the cold posterior effect.
- id: c8
  statement: 'Practical conclusion: tempered SG-MCMC ensembles improve predictions over individual models, but given the added computation of evaluating ensembles there may be more practical methods (citing
    deep ensembles and other ensemble methods). The ensembles here have 27 (ResNet-20, 1500 epochs) and 7 (CNN-LSTM, 500 epochs) members.'
  location: Section 8
  page: 9
  quote: However, taking into account the added computation from evaluating ensembles, there may be more practical methods, (Lakshminarayanan et al., 2017; Wen et al., 2019; Ashukha et al., 2020).
- id: c9
  statement: 'Protocol caveat: the CNN-LSTM/IMDB SGD baseline overfits, so its reported performance is the best end-of-epoch evaluation on the test set (test-set selection); the ResNet-20 SGD baseline uses
    the Keras example settings tuned for generalization, with no overfitting observed over 200 epochs.'
  location: Appendix A.4
  page: 11
  quote: We report the optimal test set performance from all end-of-epoch test evaluations.

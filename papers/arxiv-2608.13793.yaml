  statement: To stress-test GPs, the GPs are trained with the default settings of GPyTorch and GP+.
  location: Evaluation protocols
  page: 8
  quote: To stress-test GPs, we train them via the default settings of Gpytorch [55] and GP+ [56].
- id: c3
  statement: The regression benchmarks are analytic test functions from a simulation-experiment library, with categorical inputs studied via the Buckling function.
  location: Evaluation protocols
  page: 8
  quote: Nine benchmark regression problems are adopted from [57] (i.e. Ackley, Borehole, Dixon-Price, Griewank, Rosenbrock, Wing Weight, and Zakharov) and we study the effects of categorical inputs in
    the Buckling function obtained from [58].
- id: c4
  statement: For the comparison with TabPFN, the GP training process and kernel were not fine-tuned; evaluating the models under their best settings is left open.
  location: Conclusion
  page: 20
  quote: For a fair comparison, we refrained from fine-tuning the training process and kernel of the GPs when comparing them to TabPFN but it is interesting to evaluate these models under their best settings.
- id: c5

    the PDF (arXiv v3) has no venue header and the arXiv record has no journal_ref or venue comment. Section numbers from numbered headings in the text dump (2 Related Work, 3.1, 4.1-4.3) and cross-references.
    Affiliations: EPFL, Swisscom Digital Lab, Daskell; the evaluated NAS methods are not the authors'' own. The authors distinguish their result from Bender et al. (2018), who found strong correlation with
    and without weight sharing, by a different (random path dropping) training scheme and by their exhaustive reduced space rather than a sampled subset (Section 2). In the reduced space NAO''s final architecture
    was always from its uniformly sampled initial pool, so ''in practice, in a reduced space, NAO is similar to random search'' (Section 4.2). The Kendall tau values for CNN spaces ''from 3 to 7 nodes''
    are listed as four numbers (0.441, 0.314, 0.214, 0.195) in Section 4.3; the mapping to node counts is not explicit. Standard-space mean/std results are in tables and not recorded.'

proposes:
- '''efficiency misnomer'': no single cost indicator (parameters, FLOPs, speed) is sufficient'
- recommendation to report all available cost indicators and narrow efficiency claims to the evaluated setup
claims:
- id: c1
  statement: 'Main claim: cost indicators (parameter count, FLOPs, throughput/speed) can contradict each other, and incomplete reporting of them can lead to partial conclusions about model efficiency.'
  location: Abstract
  page: 1
  quote: We demonstrate how incomplete reporting of cost indicators can lead to partial conclusions and a blurred or incomplete picture of the practical considerations of different models.
- id: c2
  statement: 'Measurement caveat: reported FLOPs are usually theoretical values that ignore practical factors such as which parts of the model can be parallelized.'
  location: A Primer on Cost Indicators
  page: 3
  quote: Note that theoretical FLOPs ignores practical factors, like which parts of the model can be parallelized.
- id: c3
  statement: 'Experimental setup: in controlled ViT experiments (Scenic, 64 TPU-V3) scaling depth vs width, all other hyperparameters were kept fixed at the default values from the referenced papers; which
    architecture looks better depends on the cost indicator.'
  location: Potential disagreement between cost indicators
  page: 6
  quote: Note that when changing depth or width of the model (see Table 2 in Appendix A for the exact conﬁgurations) all other hyper-parameters are kept ﬁxed based on the default values given by the referenced
    papers.
- id: c4
  statement: 'Measurement source for the ImageNet model comparison: accuracies and cost values are taken from Steiner et al. and Liu et al., with cost indicators from PyTorch implementations and throughput
    measured on a V100 GPU with timm.'
  location: Discussion (Figure 5 caption)
  page: 7
  quote: Cost indicators are based on PyTorch implementation of the included models and the throughput is measured on a V100 GPU, using timm (Wightman, 2019).
- id: c5
  statement: 'Training time as a metric: the authors warn that training time is prone to Goodhart''s law and depends on the whole training recipe; they state that a claim that one method performs almost
    as well as another with dramatically reduced training cost is not valid, because a method not optimized for training cost may be re-tuned with that in mind (e.g. learning rate, weight decay).'
  location: Training or inference cost?
  page: 4
  quote: 'Whilst “training time” can be a great cost indicator, it is also prone to Goodhart’s Law: When used as the main metric, it can and will be gamed and lose its meaning.'
- id: c6
  statement: 'Sparse models / MoE: the authors argue that parameter-matched comparisons do not make sense for sparse models and unnecessarily downplay their strengths.'
  location: The issues with parameter matched comparisons
  page: 8
  quote: Hence, parameter matched comparisons do not make sense for sparse models and parameter-matching sparse models can be seen as an unfair method of unnecessarily downplaying the strengths of sparse
    models.
- id: c7
  statement: 'Recommendation: always report and plot curves with all available cost indicators, avoid highlighting a single one, and narrow efficiency claims to the exact evaluated setup.'
  location: Suggestions and Conclusion
  page: 9
  quote: Since each indicator stands for something different and comes with its own pros and cons, we suggest always reporting and plotting curves using all available cost indicators, and refraining from
    highlighting results using just a single one.

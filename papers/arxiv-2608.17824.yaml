claims:
- id: c1
  statement: The paper proposes a five-layer adaptive lifecycle framework in which maintenance becomes closed-loop control over drifting configurations.
  location: Abstract
  page: 1
  quote: we synthesize these results into an adaptive, five-layer lifecycle framework—artifact, contract, gate, control, and governance layers—articulated as testable design propositions, in which maintenance
    becomes a closed-loop control problem over drifting configurations.
- id: c2
  statement: 'Drift monitoring is framed as part of a control loop: monitors estimate distance from the validated operating envelope, and controllers decide among continue, retrain, rollback, fallback or
    escalate.'
  location: Monitoring, Operations, and Maintenance
  page: 7
  quote: 'In lifecycle terms, drift converts maintenance from a reactive, ticket-driven activity into the closed-loop control problem of Equation (1): monitors estimate the deployed configuration’s distance
    from its validated operating envelope'
- id: c3
  statement: Citing Rabanser et al., the paper says many practical shift-detection methods fail quietly, so drift detection should be treated as an engineered, tested component (secondary citation, not
    a new result).
  location: Monitoring, Operations, and Maintenance
  page: 7
  quote: Rabanser et al. showed empirically that many practical shift-detection methods fail quietly, implying that drift detection is itself an engineered, tested component [38].
- id: c4
  statement: The author notes that the evidence base consists mostly of reviews, taxonomies, interviews/surveys and single-organization reports, with comparable experiments and pooled effect sizes largely
    absent.
  location: Evidence Base, Limitations, and Research Agenda
  page: 9
  quote: However, the evidence base is dominated by literature reviews, taxonomies, interview and survey studies, and single-organization experience reports; comparable experiments, participant-level statistics,
    and pooled effect sizes are largely absent.
- id: c5
  statement: 'Limitation: as a conceptual synthesis it provides no new empirical data, and its formal model is descriptive.'
  location: Evidence Base, Limitations, and Research Agenda
  page: 10
  quote: As a conceptual synthesis it does not itself contribute new empirical data; the formal model of Section 3 is descriptive rather than predictive

claims:
- id: c1
  statement: A sequence-only pipeline of 330 interpretable descriptors with TabPFN, without gradient training or hyperparameter search, is reported to match and surpass multimodal structure-conditioned
    deep models on ESCAPE.
  location: Abstract
  page: 1
  quote: We show that a simple, sequence-only pipeline can match and surpass these methods by combining 330 interpretable sequence descriptors with TabPFN, a tabular foundation model that performs in-context
    prediction in a single forward pass without gradient-based training or hyperparameter search.
- id: c2
  statement: The gains persist under the prior state of the art's single-fold training protocol and are largest for remote homologues.
  location: Abstract
  page: 1
  quote: The gains persist under the prior state-of-the-art single-fold training protocol, indicating they are not a training-set-size artefact, and are largest for remote homologues (+11.2 points below
    30% sequence identity).
- id: c3
  statement: No hyperparameter was tuned on ESCAPE at any stage.
  location: Experimental setup
  page: 4
  quote: No hyperparameter was tuned on ESCAPE at any stage.
- id: c4
  statement: For a paired comparison, the released ESCAPE baseline checkpoints were re-run without retraining.
  location: ESCAPE baseline re-run and matched-protocol evaluation
  page: 6
  quote: For a paired comparison, we re-ran the released ESCAPE baseline checkpoints (Best_model_Fold1.pth, Best_model_Fold2.pth) on our hardware without any retraining.
- id: c5
  statement: Honest F1 uses per-label thresholds chosen on out-of-fold predictions over the in-context set and frozen before testing; Max-F1, with thresholds chosen on the test set, is reported only as
    an optimistic upper bound.
  location: Supplementary (threshold metrics)
  page: 22
  quote: Honest F1 uses per-label thresholds selected on 5-fold out-of-fold predictions over the in-context set and frozen before the test set is touched.
- id: c6
  statement: 'Stated limitations: antiparasitic activity is too sparse for firm conclusions, and homology is handled by stratification on the predefined split rather than holding out identity clusters.'
  location: Discussion (limitations)
  page: 17
  quote: Homology is handled by stratification on the predefined split rather than by holding out entire identity clusters.

  notes: 'Selected for the topic article requested by the user (2026-10-03): classical algorithms (sorting, binary search, greedy) and machine learning; carded by a subagent. Results tables not recorded;
    claims only. PDF states: Proceedings of the 37th International Conference on Machine Learning, PMLR 119, 2020. Affiliation: Google Research, Brain team (all authors). Asymptotics (Proposition 2): soft
    operators are differentiable a.e. and order-preserving for every epsilon > 0, converge to hard sort/rank as epsilon -> 0 for inputs without ties, and collapse to a constant vector as epsilon -> infinity;
    Appendix B.3 gives an epsilon below which they equal the hard operators exactly. On tuning epsilon: not necessary for label ranking, but for top-k classification squashing scores to [0,1] and tuning
    epsilon ''is important, confirming the empirical finding of Cuturi et al. (2019)''. Runtime experiment: random N(0,1) score vectors, n from 100 to 5000, batch of 128, Intel Xeon W-2135 + GTX 1080 Ti;
    OT and All-pairs run out of GPU memory for large n. Label ranking: 21 datasets (Hullermeier et al. 2008; Cheng et al. 2009), linear models, two 10-fold runs with internal 5-fold CV grid search; ablation
    drops the soft rank layer. Soft least trimmed squares: LIBSVM datasets, synthetic label outliers on training labels only, 5-fold CV for k, epsilon (and Huber tau), 10 train-test splits; hard LTS ''worked
    well on all datasets''. Petersen et al. (arxiv-2105.04019) evaluate this method (''Fast Sort & Rank'') on four-digit MNIST/SVHN sorting with an MSE loss on ranks because it does not produce permutation
    matrices, and confirm it is the fastest method for large n in their runtime table.'

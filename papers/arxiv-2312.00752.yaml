proposes:
- selective state space models (input-dependent SSM parameters) with a hardware-aware parallel scan
- Mamba (attention-free, MLP-free architecture built from selective SSMs)
claims:
- id: c1
  statement: 'Method: SSM parameters are made functions of the input so the model can selectively propagate or forget information; because this prevents efficient convolutions, a hardware-aware parallel
    algorithm in recurrent mode is designed, and the resulting blocks form an architecture without attention or MLP blocks (Mamba).'
  location: Abstract
  page: 1
  quote: First, simply letting the SSM parameters be functions of the input addresses their weakness with discrete modalities, allowing the model to selectively propagate or forget information along the
    sequence length dimension depending on the current token.
- id: c2
  statement: 'Main claims (abstract wording): fast inference (5x higher throughput than Transformers; the measurement conditions behind this figure are the end-to-end generation benchmark in c4/c5, not
    an unconditional speedup), linear scaling in sequence length, and on language modeling Mamba-3B outperforms Transformers of the same size and matches Transformers twice its size in pretraining and downstream
    evaluation.'
  location: Abstract
  page: 1
  quote: On language modeling, our Mamba-3B model outperforms Transformers of the same size and matches Transformers twice its size, both in pretraining and downstream evaluation.
- id: c3
  statement: 'Scaling-law range and protocol: language-model scaling laws use the Chinchilla protocol on models from about 125M to 1.3B parameters on the Pile (Figure 4 panels at sequence lengths 2048 and
    8192), comparing against GPT3-style Transformer and a stronger Transformer++ recipe; the appendix says training tokens were roughly matched to Chinchilla scaling laws (tokens proportional to model size).'
  location: Language Modeling (Scaling Laws)
  page: 11
  quote: Figure 4 shows scaling laws under the standard Chinchilla (Hoffmann et al. 2022) protocol, on models from ≈125𝑀to ≈1.3𝐵
- id: c4
  statement: 'Throughput claim and mechanism: Mamba achieves 4-5x higher inference throughput than a similar-size Transformer, attributed to not needing a KV cache and thus being able to use much higher
    batch sizes (end-to-end generation benchmark: A100 80GB, prompt length 2048, HuggingFace Transformer baseline, batch sizes 1-128; see c5). Separately, the SSM scan core operation alone (state expansion
    N=16; A100 80GB PCIe, BF16, batch size 1; see c6) is reported faster than FlashAttention-2 beyond sequence length 2K and up to 20-40x faster than a standard PyTorch scan.'
  location: Speed and Memory Benchmarks
  page: 15
  quote: Mamba achieves 4-5× higher inference throughput than a Transformer of similar size, since without the KV cache it can use much higher batch sizes.
- id: c5
  statement: 'End-to-end throughput protocol: a Mamba 1.4B and an untrained Mamba 6.9B are compared to GPT3-architecture Transformers (1.3B, 6.7B) using the standard HuggingFace transformers implementation,
    with prompt length 2048 and 128 generated tokens over batch sizes 1-128, averaged over 3 repeats on an A100 80GB PCIe GPU.'
  location: Appendix (Efficiency Benchmark)
  page: 36
  quote: We measure the inference throughput of a Mamba 1.4B model and an untrained Mamba 6.9B model, against a standard Transformer (GPT3 architecture) at 1.3B and 6.7B size.
- id: c6
  statement: 'Scope of the scan benchmark: the core-operation comparison of scan vs convolution vs attention (A100 80GB PCIe, BF16, batch size 1) excludes other operations such as computing convolution
    kernels or QKV projections.'
  location: Appendix (Efficiency Benchmark)
  page: 35
  quote: Note that these do not include the cost of other operations outside of this core operation, such as computing the convolutional kernel in global-convolution models, or computing the QKV projections
    in attention.
- id: c7
  statement: 'Limitation (scale): the empirical evaluation is limited to small model sizes, below strong open-source LLMs and the 7B+ scale at which RWKV and RetNet were evaluated; whether Mamba still compares
    favorably at larger sizes remains to be assessed, and scaling SSMs may need further engineering.'
  location: Limitations (Scaling)
  page: 17
  quote: It remains to assess whether Mamba still compares favorably at these larger sizes.

title: 'Rank-normalization, folding, and localization: An improved R-hat for assessing convergence of MCMC'
authors:
- Aki Vehtari
- Andrew Gelman
- Daniel Simpson
- Bob Carpenter
- Paul-Christian Bürkner
year: 2019

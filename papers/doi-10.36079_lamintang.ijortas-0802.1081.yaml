claims:
- id: c1
  statement: Six predictive models (five tree ensembles and an MLP control) are benchmarked on one real-world insurance dataset of 1,338 records.
  location: Abstract
  page: 1
  quote: We benchmarked six predictive architectures (five tree ensembles and a multi-layer perceptron control) on a real-world dataset (n=1,338).
- id: c2
  statement: Gradient Boosting performed best in their experiments.
  location: Abstract
  page: 1
  quote: Experimental results demonstrate that Gradient Boosting achieved superior performance
- id: c3
  statement: Evaluation uses five folds with an 80/20 train-test partition per fold, with preprocessing fit on each training partition.
  location: Methodology
  page: 5
  quote: The dataset is partitioned using an 80/20 train-test strategy across five folds, resulting in 1,070 training samples and 268 testing samples per fold.
- id: c4
  statement: All models use the fixed 'optimized' configurations listed in a hyperparameter table with a fixed random seed; how these configurations were selected was not found in the text.
  location: Finding and Discussion
  page: 9
  quote: All experiments were conducted using the optimized hyperparameter configurations presented in Table 3, with random_state = 42 applied consistently across all models to ensure experimental reproducibility.
- id: c5
  statement: The MLP was a plain baseline control without tabular-specific adaptations such as TabNet, which the authors take as further support for tree ensembles.
  location: Finding and Discussion
  page: 9
  quote: Since such adaptations were not incorporated into this baseline control, the results further emphasize the suitability of tree-based ensemble approaches for modeling nonlinear insurance risk patterns.
- id: c6
  statement: The single static U.S.-centric dataset limits generalizability across regulatory, demographic and economic contexts.
  location: Conclusion
  page: 11
  quote: dataset, which restricts the generalizability of the findings across different regulatory, demographic, and economic contexts.

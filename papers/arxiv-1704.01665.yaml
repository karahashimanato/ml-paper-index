  notes: 'Selected for the topic article requested by the user (2026-10-03): algorithm design techniques (divide and conquer, dynamic programming, branch and bound, local search) and machine learning; carded
    by a subagent. Results tables not recorded; claims only. PDF states: NIPS 2017. Affiliations: Georgia Institute of Technology; Le Song also Ant Financial. Training sizes: MVC trained up to 400-500 nodes
    (with ''pre-training'' on smaller graphs); MaxCut and TSP trained up to 200-300 nodes ''due to the limited computation resource''; tests up to 1000-1200 nodes. Baselines: PN-AC (pointer network actor-critic,
    reimplemented; for graph problems nodes are described by rank-8 SVD of the adjacency matrix), MVCApprox / MVCApprox-Greedy, MaxcutApprox, SDP (Goemans-Williamson, best of 100), TSP heuristics (MST,
    Farthest/Cheapest/Closest insertion, Christofides, 2-opt, Nearest Neighbor); CPLEX 12.6.1 and Concorde with 1-hour cutoffs as references. At test time the greedy policy is used (no Active Search) on
    synthetic data. Running-time comparison: S2V-DQN runs on GPU; the authors note the comparison with MaxcutApprox is ''not exactly fair, since we use GPUs''. Hyperparameters selected via preliminary results
    on small graphs, then fixed. Real-world sets: MemeTracker (MVC, SCP), Physics (MaxCut), TSPLIB. LKH and Gurobi are not used. Reference solutions: CPLEX/Concorde 1-hour best solutions are reported as
    ''optimal'' when optimality is not proven (Appendix D.1); the authors note the ''optimal'' value may not be truly optimal, CPLEX''s solutions typically get worse as size grows, and S2V-DQN sometimes
    beats 1-hour CPLEX, giving ratios below 1.0. TSPLIB ratios are against the known optima listed in Table C.2. The number of Active Search episodes or running time on TSPLIB was not found in Appendix
    C.3, so per-instance compute is not matched with the one-shot TSP heuristics. Hyperparameters tuned on graphs with fewer than 50 nodes (Appendix D.4). Family tag local-search not used: the method is
    greedy construction (MaxcutApprox baseline is a local-search heuristic). Results not recorded.'

  notes: 'Selected for the method article requested by the user (2026-10-10): alternatives and extensions to dense Transformers (sparse mixture-of-experts routing and load balancing, state space models
    from HiPPO/S4 to Mamba-2, linear and kernelized attention, RWKV, and benchmarks/analyses comparing them with Transformers). Carded by a subagent. Results tables not recorded; claims only. Affiliations:
    Google, University of Cambridge, DeepMind, Alan Turing Institute. Venue from the PDF header (''Published as a conference paper at ICLR 2021'') and the arXiv comment; year is the first arXiv version
    (2020). Section numbers are from numbered headings in the PDF text (2.2, 2.3, 2.4, 3, 4.1, 4.3, ...). Orthogonal random features keep unbiasedness for isotropic distributions via Gram-Schmidt and require
    m <= d (''this will be the case in all our experiments'', Section 2.4). The unidirectional (causal) case uses prefix sums of outer products (Appendix B.1). Body-text results not recorded as claims:
    on TrEMBL the softmax approximation achieves the same accuracy as the exact-softmax Transformer and Performer-RELU is highest (Section 4.4); on ImageNet64 Performer/6-layers matches Reformer/12-layers
    and ''depending on hardware'' can be 2x faster than Reformer (Section 4.5); on concatenated TrEMBL (L = 8192) the regular Transformer baseline had to be shrunk to 1-3 layers. Most results are figures
    only. Conflict of interest: co-author Lukasz Kaiser is a co-author of the compared Reformer (Kitaev, Kaiser and Levskaya, 2020), and the ORF technique builds on the first author''s earlier work (Choromanski
    et al., 2017).'

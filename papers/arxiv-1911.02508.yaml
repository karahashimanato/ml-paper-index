proposes:
- 'Scaffolding attack: an OOD detector routes perturbed (off-manifold) queries to an innocuous model so LIME/SHAP explanations hide a biased classifier'
claims:
- id: c1
  statement: A scaffolding technique hides the biases of any classifier by letting an adversary craft an arbitrary desired explanation.
  location: Abstract
  page: 1
  quote: Specifically, we propose a novel scaffolding technique that effectively hides the biases of any given classifier by allowing an adversarial entity to craft an arbitrary desired explanation.
- id: c2
  statement: 'Failure mode exploited: a PCA view shows LIME-style perturbed samples distributed differently from the input data; the authors conclude detecting perturbations is not challenging, so approaches
    relying heavily on perturbations, such as LIME, can be gamed.'
  location: Proposed Framework (intuition)
  page: 3
  quote: This result indicates that detecting whether a data point is a result of a perturbation or not is not a challenging task, and thus approaches that rely heavily on these perturbations, such as LIME,
    can be gamed.
- id: c3
  statement: 'Setup: default LIME tabular (no discretization) and default Kernel SHAP with a 10-cluster k-means background are attacked; the biased model uses only the sensitive feature.'
  location: Experimental Setup
  page: 4
  quote: We use default LIME tabular implementation without discretization, and the default Kernel SHAP implementation with kmeans with 10 clusters as the background distribution.
- id: c4
  statement: 'Evaluation metric: the share of test points where the sensitive feature or the decoy features appear in the top 3 of the explanation''s ranking.'
  location: Effectiveness of Adversarial Classifiers
  page: 5
  quote: we compute the percentage of data points for which race, uncorrelated features (in case of COMPAS and CC) or Loan Rate % Income (in case of German credit data) show up in top 3 when features are
    ranked based on feature attributions output by LIME and SHAP
- id: c5
  statement: Against SHAP, the attack using two uncorrelated features is less successful at removing the sensitive feature from first place in the ranking; the authors attribute this to SHAP's local accuracy
    property.
  location: Effectiveness of Adversarial Classifiers
  page: 5
  quote: This is due to SHAP’s local accuracy property that ensures that feature attributions must add up to the difference between a given prediction and the average prediction for the background distribution.
- id: c6
  statement: The attack works as long as perturbed points can be distinguished from input data with reasonable accuracy.
  location: Effect of Perturbation Detection Accuracy
  page: 6
  quote: These results indicate that our attacks are effective as long as it is possible to differentiate between perturbed instances and input data points with a reasonable accuracy.
- id: c7
  statement: 'Main conclusion: on criminal justice and credit data the attack fools post hoc explainers, with LIME more vulnerable than SHAP.'
  location: Conclusions and Future Work
  page: 7
  quote: Extensive experimentation with real world data from criminal justice and credit scoring domains demonstrates that our approach is effective at generating adversarial classifiers that can fool post
    hoc explanation techniques, finding that LIME is more vulnerable than SHAP.

claims:
- id: c1
  statement: The paper studies, experimentally and theoretically, how effective TabPFN is as a surrogate in surrogate-assisted evolutionary algorithms.
  location: Abstract
  page: 1
  quote: this work conducts a comprehensive study that combines extensive experiments with in-depth theoretical analysis to investigate the effectiveness of TabPFN
- id: c2
  statement: TabPFN's effectiveness is highly problem dependent and it cannot universally replace conventional surrogates.
  location: Abstract
  page: 1
  quote: Results show that the effectiveness of TabPFN is highly problem dependent, and it cannot replace conventional surrogates universally.
- id: c3
  statement: Predictive accuracy is compared between TabPFN v2, GP and RBFN on the CEC 2017 suite with RMSE and Kendall's tau, 25 independent runs per function; hyperparameter settings of GP/RBFN were not
    found in the text.
  location: Prediction performance
  page: 4
  quote: We evaluate the prediction performance of three models, namely TabPFN, GP, and RBFN, on the CEC 2017 benchmark suite using RMSE and τ as evaluation metrics.
- id: c4
  statement: Training size is 10 times the dimension and test size 1000 for all three models.
  location: Prediction performance
  page: 4
  quote: Across all test functions of different dimensions, we use a training sample size of Ntr = 10D and a test sample size of Nte = 1000 for the three models.
- id: c5
  statement: 'Limitation: although TabPFN needs no conventional hyperparameter optimization, its ''training'' (context encoding) time can exceed RBFN''s, which accumulates when surrogates are rebuilt often.'
  location: Limitations and Unsuitable Scenarios
  page: 12
  quote: Although TabPFN does not involve conventional hyper-parameter optimization, its training process still requires encoding and caching the training context to construct the predictive mapping.
- id: c6
  statement: 'Limitation: TabPFN extrapolates conservatively when candidates move away from the training data distribution.'
  location: Limitations and Unsuitable Scenarios
  page: 12
  quote: TabPFN exhibits relatively conservative extrapolation behavior when candidate solutions move away from the distribution of the training data.

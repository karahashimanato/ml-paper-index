  notes: 'Selected for the method article requested by the user (2026-10-10): knowledge distillation and pruning (soft targets and temperature, hint-based and self distillation, teacher-student gaps and
    fidelity; magnitude, gradual, single-shot, movement and LLM pruning, lottery tickets, and how pruning is evaluated). Carded by a subagent. Results tables not recorded; claims only. Affiliations: USC,
    CMU, ETH Zürich, Caltech, Amazon AI. Venue from the PDF footer (''Proceedings of the 35th International Conference on Machine Learning, Stockholm, Sweden, PMLR 80, 2018'') and the arXiv comment. Section
    numbers are from numbered headings in the PDF. The abstract and Introduction speak of validation error while Tables 1-5 are captioned as test error; the CIFAR-100 single best model (BAN-3-DenseNet-80-80,
    15.5% error, 22M parameters) is called ''SOTA non-ensemble model without shake-shake regularization'' (Section 5.2). No temperature value is given; the text says the logits were not softened. CIFAR-100
    training follows the Wide-ResNet setting except Mean-Std normalization, with weight decay (and dropout for Wide-ResNet) as the only regularization besides KD (Section 4). Each table cell is a single
    number; no repetitions, seeds per cell, or standard deviations were found in the text (searched for seed, standard deviation, repeat, runs). Table 2: BAN = teacher loss only, BAN+L = label + teacher
    loss; the text states removing label supervision gives a systematic improvement on CIFAR-100. Not a compression method (students are the same size), so model-compression is not tagged.'

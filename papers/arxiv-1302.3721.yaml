proposes:
- 'Change-Point Thompson Sampling (CTS): Thompson sampling for switching Bernoulli multi-armed bandits that samples a run length from a BOCPD run-length posterior and then samples arm parameters from Beta
  posteriors using only the data since that change point; variants for Global and Per-Arm switching, known or learned (Wilson et al.) constant switching rate, and tracking only the pulled/best arm (''2''
  variants)'
claims:
- id: c1
  statement: 'Environment model: rewards are Bernoulli and switch abruptly according to a hazard function (new means drawn uniformly); two models are considered: Global Switching (all arms change at a change
    point, constant rate) and Per-Arm Switching (independent change points per arm).'
  location: Model of Dynamic Environment
  page: 2
  quote: We assume abrupt switching deﬁned by a hazard function, h(t), such that,
- id: c2
  statement: 'Switching Thompson sampling: since the arm model depends only on data since the last switch and that time is unknown, the run length is introduced as a latent variable and marginalised; sampling
    proceeds by drawing a run length from the run-length posterior and then arm parameters given that run length, and pulling the arm that is best under the sample.'
  location: Switching Thompson Sampling
  page: 3
  quote: Since we do not know the runlength rt we can introduce it as a latent variable and marginalise it out.
- id: c3
  statement: 'Cost: exact run-length inference has space and time growing linearly in time; instead of Adams-MacKay thresholding (memory known only in expectation) the paper uses Fearnhead and Liu''s particle-filter
    resampling (stratified optimal resampling) to keep at most N run lengths, for a hard memory bound. The hazard is a constant switching rate γ in the basic algorithms.'
  location: Bayesian Online Change Detection
  page: 4
  quote: As we can only know in expectation how much memory this algorithm will require, an alternative with hard guarantees on memory requirements is desirable.
- id: c4
  statement: 'Learning the switching rate: a constant switching rate is learned with the method of Wilson et al. (Beta hyperparameters counting switches); the authors note Turner et al.''s gradient-based
    hazard learning appeared, in initial investigations, not to perform particularly well when adapted every step. Learning the rate makes the number of particles grow quadratically rather than linearly.'
  location: Learning the Switching Rate
  page: 8
  quote: For the purposes of this paper, a constant switching rate was assumed which was learned using the approach of Wilson et al.
- id: c5
  statement: 'Evaluation protocol: 6 non-stationary environments (4 synthetic, 2 derived from real-world data). The parameters for all experiments were tuned on the PASCAL challenge (the PASCAL Exploration
    vs. Exploitation Challenge 2006 is itself one of the evaluation environments).'
  location: Experiments
  page: 10
  quote: The parameters for all experiments shown were tuned based on the PASCAL challenge.
- id: c6
  statement: In the Per-Arm switching environment the hazard-learning variant NP PA-CTS suffers much more regret than PA-CTS, which the authors say would appear to indicate that the parameters are not learned
    quickly enough; in the Global environment NP Global-CTS does well, which they say suggests learning the hazard rate for that model may be feasible.
  location: Per-Arm Switching Environment
  page: 11
  quote: which would appear to indicate for the particular model the parameters are not being learned quickly enough.
- id: c7
  statement: 'PASCAL 2006 comparison caveat: the authors could not implement a version of Adapt-EvE (the change-point-based challenge winner) that replicated the reported performance, so Adapt-EvE results
    are copied from the publication, and Adapt-EvE was not run in the other environments to avoid an unfair comparison.'
  location: PASCAL Challenge 2006
  page: 13
  quote: so here we are simply replicating the results published.
- id: c8
  statement: 'Conclusion: the CTS algorithms perform well in the environments they were designed for, but are shown not to perform as well as appropriately tuned competing algorithms in the PASCAL challenge;
    the results suggest that tracking only changes in the perceived best arm (Global-CTS2, PA-CTS2), similar to Adapt-EvE, works well.'
  location: Conclusion
  page: 16
  quote: However our results suggest that a strategy that just tracks changes in the perceived best arm (Global-CTS2,PA-CTS2), similar to Adapt-EvE, works well.
- id: c9
  statement: 'No regret guarantee: the authors state the algorithms are derived from simple models and theoretically motivated, but steps still need to be taken to provide any theoretical justification
    for their performance.'
  location: Conclusion
  page: 16
  quote: however steps still need to be taken to provide any theoretic justiﬁcation for their performance.

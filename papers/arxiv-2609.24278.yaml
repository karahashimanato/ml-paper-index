proposes:
- 'SWCPD: Sliced-Wasserstein-based online change point detection with an adaptive (Gamma-motivated) quantile threshold'
- Contrastive explanations for detected change points
claims:
- id: c1
  statement: The paper proposes a self-adapting online change point detection algorithm combining a Sliced Wasserstein score with an adaptive quantile-based threshold.
  location: Abstract
  page: 1
  quote: we propose a self-adapting online CPD algorithm that combines this SW-based score with an adaptive quantile-based threshold
- id: c2
  statement: 'Main empirical claim: the method reduces false positives on average compared with popular online and offline CPD baselines while keeping competitive or better detection performance.'
  location: Abstract
  page: 1
  quote: Empirically, our method reduces false positives by at least 48% on average compared with popular online and offline CPD baselines, while maintaining competitive or superior detection performance
- id: c3
  statement: 'Evaluation metrics: AUC and segmentation covering (following the evaluation protocol of Van den Burg & Williams and Ermshaus et al.), average detection delay and the average number of false
    positives, on one synthetic and four real datasets (MNIST, HAR, HASC, Occupancy) with annotated change points.'
  location: Experiments (Change point detection)
  page: 9
  quote: We report Area Under the Curve (AUC), segmentation covering scores (COV), average detection delay (DD), and the average number of false positives (FP).
- id: c4
  statement: 'Synthetic ground truth: change points are created by injecting mean offsets into randomly selected features of a simulated stream of segments.'
  location: Experiments (Synthetic Data)
  page: 10
  quote: We randomly select a total of 3 features for which we inject a drift by offsetting the mean ci randomly sampled within (−3, 3) for each drifted feature.
- id: c5
  statement: SWCPD hyperparameters were set by a fixed set of heuristic rules (window shorter than the average segment length, small quantile level), with dataset-specific values reported.
  location: Appendix (Hyperparameter selection)
  page: 19
  quote: For all experiments, hyperparameters were selected according to a fixed set of heuristic rules.
- id: c6
  statement: For the RIO-CPD baselines, window size and CUSUM threshold were grid-searched and the reported settings are those giving the best AUC; a separate validation split for this selection was not
    found in the text.
  location: Appendix (baseline hyperparameters, RIO)
  page: 23
  quote: 'The following hyperparameter resulted in the best AUC scores for RIO-LE:'

- Sensitivity and Implementation Invariance axioms
claims:
- id: c1
  statement: The paper identifies two axioms (Sensitivity, Implementation Invariance) and shows that most known attribution methods do not satisfy them, which it considers a fundamental weakness of those
    methods.
  location: Abstract
  page: 1
  quote: We show that they are not satisfied by most known attribution methods, which we consider to be a fundamental weakness of those methods.
- id: c2
  statement: 'Main contribution: Integrated Gradients, implementable with a few gradient calls and applicable to many deep networks.'
  location: Conclusion
  page: 8
  quote: The primary contribution of this paper is a method called integrated gradients that attributes the prediction of a deep network to its inputs.
- id: c3
  statement: 'Assumption: attributions are relative to a baseline; the authors recommend a baseline with near-zero score that conveys complete absence of signal (e.g. black image, zero embedding).'
  location: Applying Integrated Gradients
  page: 5
  quote: So we would additionally like the baseline to convey a complete absence of signal, so that the features that are apparent from the attributions are properties only of the input, and not of the
    baseline.
- id: c4
  statement: 'Critique of perturbation-based evaluation: perturbed images may be unnatural, so a score drop may reflect distribution shift rather than attribution quality; the paper therefore uses an axiomatic
    approach instead of an empirical benchmark.'
  location: Uniqueness of Integrated Gradients
  page: 3
  quote: However, the images resulting from pixel perturbation could be unnatural, and it could be that the scores drop simply because the network has never seen anything like it in training.
- id: c5
  statement: If averaging over multiple paths is allowed, the Shapley-Shubik method also satisfies the axioms but yields attributions different from Integrated Gradients; on a min(x1, x2) example the authors
    say it seems somewhat subjective to prefer one result over the other.
  location: Integrated Gradients is Symmetry-Preserving
  page: 5
  quote: This method yields attributions that are different from integrated gradients.
- id: c6
  statement: 'Critique of local surrogate methods (LIME): implementation invariant but without a guarantee of sensitivity.'
  location: Other Related work
  page: 8
  quote: However, this approach does not guarantee sensitivity.
- id: c7
  statement: 'Stated limitation: interactions between input features and the network''s logic are not addressed.'
  location: Conclusion
  page: 8
  quote: While our and other works have made some progress on understanding the relative importance of input features in a deep network, we have not addressed the interactions between the input features
    or the logic employed by the network.
- id: c8
  statement: 'Integrated Gradients (Eq. 1): for input x and baseline x'', IntegratedGrads_i(x) = (x_i - x''_i) x integral from alpha = 0 to 1 of dF(x'' + alpha (x - x''))/dx_i d alpha, i.e. the path integral
    of the gradients along the straight line from the baseline to the input.'
  location: 'Section 3 (Our Method: Integrated Gradients)'
  page: 3
  quote: Speciﬁcally, integrated gradients are deﬁned as the path intergral of the gradients along the straightline path from the baseline x′ to the input x.
- id: c9
  statement: 'Completeness (Proposition 1): if F is differentiable almost everywhere, sum_{i=1}^{n} IntegratedGrads_i(x) = F(x) - F(x''), an instance of the fundamental theorem of calculus for path integrals;
    with a baseline whose prediction is near zero, the attributions distribute the output to the input features.'
  location: 'Section 3 (Our Method: Integrated Gradients)'
  page: 3
  quote: 'This is formalized by the proposition below, which instanti-

    ates the fundamental theorem of calculus for path integrals.'

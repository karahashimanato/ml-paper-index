claims:
- id: c1
  statement: 'The paper separates drift detection from model promotion: a drift alarm in an adaptive intrusion detection system detects change but does not establish that a retrained challenger should replace
    the deployed model.'
  location: Abstract
  page: 1
  quote: Adaptive network intrusion detection systems retrain classifiers after drift alarms, but an alarm detects change; it does not establish that a challenger should replace the deployed incumbent.
- id: c2
  statement: 'Main finding on construction: incumbent-owned frozen preprocessing amplified the apparent harm of promotion, and with self-contained challenger pipelines the mean full-drift harm did not persist.'
  location: Abstract
  page: 1
  quote: Incumbent-owned frozen preprocessing amplified apparent promotion harm; with self-contained challenger pipelines the mean full-drift harm did not persist.
- id: c3
  statement: 'Drift-monitor threshold: thresholds are set at the 0.95 quantile of detector scores over pre-drift calibration windows, and the retraining trigger requires consecutive alarms followed by a
    cooldown.'
  location: Experimental setup (shared protocol constants)
  page: 8
  quote: thresholds are the 0.95 quantile of detector scores over 30 pre-drift calibration windows; the trigger is 3 consecutive alarms with a 10-window cooldown; windows contain 128 flows.
- id: c4
  statement: In the common-harness comparison, DDM and ADWIN (river reference implementations) were used as retraining triggers at default parameters (default DDM thresholds, ADWIN delta = 0.002) with a
    small number of monitoring labels per window.
  location: Common-harness comparison
  page: 11
  quote: the river reference implementations of DDM and ADWIN [17, 29] as retraining triggers with always-deploy on fire, run at their registered reference parameters — the implementations’ default DDM
    thresholds and ADWIN δ = 0.002 — on 8 monitoring labels per window (800 per stream)
- id: c5
  statement: The authors caution that DDM and ADWIN were not tuned, so their results describe that configuration only; a parameter sweep would be needed before reading them as properties of the methods.
  location: Limitations
  page: 24
  quote: DDM and ADWIN were run at their registered reference parameters and were not tuned; their cells characterize that configuration, and a parameter sweep would be required before reading them as properties
    of the methods.
- id: c6
  statement: 'Ground-truth drift is constructed: the core drift trajectories are gradual mixing ramps between real regime pools (covariate/regime drift); a P(y|x) change is not isolated and recurrent drift
    is not tested.'
  location: Limitations
  page: 24
  quote: The core drift trajectories are gradual mixing ramps between real regime pools (covariate/regime drift); we do not isolate a p(y|x) change, and recurrent drift is untested.

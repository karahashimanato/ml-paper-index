id: arxiv-2109.05257
title: Towards a Rigorous Evaluation of Time-series Anomaly Detection
authors:
- Siwon Kim
- Kukjin Choi
- Hyun-Soo Choi
- Byunghan Lee
- Sungroh Yoon
year: 2022
venue: AAAI 2022
links:
  arxiv: https://arxiv.org/abs/2109.05257
source:
  version: arXiv v2
  retrieved_at: '2026-10-02'
  pdf_sha256: f1f8a5bb461fc1c8456cddc161250b7c2a782370b1ea1d6baf7fd8bbbd45ba46
tags:
  tasks:
  - time-series-anomaly-detection
  method_families:
  - reconstruction-based-detectors
  - forecasting-based-detectors
  paradigms:
  - unsupervised
proposes:
- PA%K evaluation protocol
- Untrained-model baseline for TAD
claims:
- id: c1
  statement: 'Point adjustment (PA) can greatly overestimate detection performance: even a random anomaly score can look state of the art.'
  location: Abstract
  page: 1
  quote: the PA protocol has a great possibility of overestimating the detection performance; that is, even a random anomaly score can easily turn into a state-of-the-art TAD method.
- id: c2
  statement: Even without PA, an untrained model performs comparably to existing methods.
  location: Abstract
  page: 1
  quote: an untrained model obtains comparable detection performance to the existing methods even when PA is forbidden.
- id: c3
  statement: 'PA: if any point in a ground-truth anomaly segment is detected, the whole segment counts as detected.'
  location: Introduction
  page: 1
  quote: if at least one moment in a contiguous anomaly segment is detected as an anomaly, the entire segment is then considered to be correctly predicted as anomaly.
- id: c4
  statement: PA can only increase precision, recall and F1.
  location: Section 3
  page: 3
  quote: after the PA, the P, R and consequently F1 score can only increase.
- id: c5
  statement: With random scores, F1PA can be pushed close to 1 by choosing the threshold, unless anomaly segments are short.
  location: Section 3
  page: 3
  quote: except for the case when the length of the anomaly segment is short.
- id: c6
  statement: The overestimation by PA depends on the test set and is weaker with shorter anomaly segments (e.g. SMD).
  location: Section 5
  page: 6
  quote: the overestimation effect of PA depends on the test dataset distribution, and its effect becomes less conspicuous with shorter anomaly segments.
- id: c7
  statement: Only GDN consistently exceeded the untrained baselines on all datasets.
  location: Section 5
  page: 7
  quote: Only the GDN consistently exceeded the baselines for all datasets.
- id: c8
  statement: Without PA, existing methods were mostly worse than the untrained baselines (Case 2 and 3).
  location: Section 5
  page: 7
  quote: mostly inferior to Case 2 and 3, implying that the currently proposed methods may have obtained marginal or even no advancement against the baselines.
- id: c9
  statement: All thresholds were chosen to give the best score (optimistic for every method).
  location: Section 5
  page: 6
  quote: All thresholds were obtained from those that yielded the best score.
- id: c10
  statement: Existing methods' numbers are the best reported in the original papers or official reproductions; missing ones were reproduced (†).
  location: Section 5
  page: 6
  quote: For the existing methods, we used the best numbers reported in the original papers and officially reproduced results
- id: c11
  statement: MSL and SMAP contain unlabeled anomalies in the training data.
  location: Section 5
  page: 5
  quote: Unlike other datasets, unlabeled anomalies are contained in the training data, which makes training difficult.
- id: c12
  statement: 'Proposed PA%K protocol: apply PA only if the fraction of detected points in a segment exceeds K, mitigating both over- and underestimation.'
  location: Section 4
  page: 4
  quote: which can mitigate the overestimation effect of F1PA and the possibility of underestimation of F1.
- id: c13
  statement: 'Proposed baseline: the F1 of a randomly initialized simple reconstruction model (e.g. untrained single-layer LSTM autoencoder).'
  location: Section 4
  page: 4
  quote: we suggest establishing a new baseline with the F1 measured from the prediction of a randomly initialized reconstruction model with simple architecture
- id: c14
  statement: Existing TAD methods set thresholds after looking at the test set or use the F1-optimal threshold.
  location: Discussion (directions for evaluation)
  page: 7
  quote: existing TAD methods set the threshold after investigating the test dataset or simply use the optimal threshold that yields the best F1.
- id: c15
  statement: Threshold-independent metrics such as AUROC or AUPR are recommended in addition.
  location: Discussion (directions for evaluation)
  page: 7
  quote: Additional metrics with the reduced dependency such as AUROC or area under precision-recall (AUPR) curve will help in rigorous evaluation.
- id: c16
  statement: 'Incomplete test labeling: some labeled anomalies look like normal data.'
  location: Section 4
  page: 4
  quote: due to the incomplete test set labeling, some signals labeled as anomalies share more statistics with normal signals.
- id: c17
  statement: Reported F1PA and F1 are not reliably correlated on SWaT and WADI.
  location: Section 5
  page: 5
  quote: these numbers are insufficient to assure the existence of correlation
- id: c18
  statement: Point anomalies are the dominant anomaly type in current TAD datasets.
  location: Background
  page: 2
  quote: Point anomaly is the most dominant type in the current TAD datasets.

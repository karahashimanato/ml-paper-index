claims:
- id: c1
  statement: 'Method: Chronos scales and quantizes time series values into a fixed vocabulary and trains existing transformer language-model architectures on these tokens with the cross-entropy loss.'
  location: Abstract
  page: 1
  quote: Chronos tokenizes time series values using scaling and quantization into a fixed vocabulary and trains existing transformer-based language model architectures on these tokenized time series via
    the cross-entropy loss.
- id: c2
  statement: 'Zero-shot definition: datasets are split into pretraining-only (13), Benchmark I (15; used for both training and in-domain evaluation) and Benchmark II (27; used only for evaluation, i.e.
    zero-shot).'
  location: Datasets
  page: 9
  quote: (b) Benchmark I datasets, employed for both training and evaluation, representing an in-domain evaluation (15 datasets); and (c) Bench-mark II datasets, used solely for evaluation, constituting
    a zero-shot evaluation (27 datasets).
- id: c3
  statement: 'Leakage caveat (footnote): the authors acknowledge that strictly preventing leakage would require Benchmark II data to start after the last pretraining observation, but they consider the risk
    minimal because the datasets share no overlap beyond high-level conceptual categorization.'
  location: Results (Benchmark II footnote)
  page: 12
  quote: From a rigorous standpoint, to prevent information leakage, the start time of any dataset within this category must be after the timestamp of the last observation from the pretraining dataset and
    Benchmark I.
- id: c4
  statement: 'Evaluation protocol: probabilistic forecasts are scored with WQL on 9 quantile levels and point forecasts with MASE (median forecast); per-dataset scores are divided by Seasonal Naive and
    aggregated with a geometric mean, and failed/timed-out models get relative score 1.'
  location: Evaluation Metrics
  page: 10
  quote: For each dataset, we compute the relative score of each model as the model’s score divided by the score of a baseline model (here, Seasonal Naive).
- id: c5
  statement: 'Baseline tuning: statistical baselines used StatsForecast defaults (with frequency-implied season lengths), and unless otherwise specified baseline implementations kept their default hyperparameters
    with no dataset-specific or global hyperparameter tuning.'
  location: Appendix (Baselines)
  page: 34
  quote: Unless otherwise specified, the default hyperparameter configurations provided in baseline implementations were kept as is, and no dataset specific or global hyperparameter tuning was performed.
- id: c6
  statement: 'Cross-model leakage remark: the authors note that the evaluation setup may have favored Moirai-1.0-R on Benchmark II because many Benchmark II datasets were in Moirai''s pretraining corpus.'
  location: Results (Benchmark II)
  page: 12
  quote: Moirai-1.0-R obtains the best performance after Chronos, although the evaluation setup may have been advantageous for Moirai-1.0-R as many datasets in Benchmark II were part of its pretraining
    corpus.
- id: c7

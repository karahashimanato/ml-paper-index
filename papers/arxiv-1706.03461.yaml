  notes: 'Selected for the topic article requested by the user (2026-10-10): causal effect estimation with machine learning (identification assumptions, meta-learners and double/debiased ML, causal trees
    and forests, Bayesian trees, representation-learning networks, overlap, model selection without ground truth, and benchmarking practice). Carded by a subagent. Results tables not recorded; claims only.
    Affiliation: UC Berkeley. PDF dated April 25, 2019 (arXiv v6). The arXiv record has no journal_ref/comment and the PDF text does not name a venue, so none is recorded. The Simulation Results footnote
    defines ''confounding'' as an unobserved covariate influencing W and an outcome, whereas the confounded simulation in SI A.3 uses a propensity that depends on an observed covariate; no sensitivity analysis
    for hidden confounding was found in the text (searched for hidden, unobserved, sensitivity). Conflict of interest: the RF base learner is the authors'' own honest RF in their R package hte, which they
    also recommend for choosing among CATE estimators (Conclusion). Applications (GOTV mailer, door-to-door canvassing) are randomized experiments; in the canvassing data S-RF shrinks estimates toward zero
    (Applications). Simulation errors are figure-only; not recorded.'

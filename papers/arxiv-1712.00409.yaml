  notes: 'Selected for the topic article requested by the user (2026-10-03): model size, data, compute and performance (scaling laws, compute-optimal training, cost measurement); carded by a subagent. Results
    tables not recorded; claims only. Affiliation: all authors list Baidu Research (title page). Compute: a footnote states the data were collected from roughly 50 years worth of GPU time; the longest training
    sessions took up to 6 weeks (Operational implications). Domains/data as stated: WMT''16 German-English NMT, Billion Word word and character LMs (word LMs on shards from 0.1% up to 40%), ResNets on ImageNet
    shards from 1 to 800 images per class, Deep Speech 2 and attention models on 11,940 hours of speech. Speech is not covered by an existing task tag. Model setup (Section 3): after replicating SOTA results,
    the authors remove regularization that might reduce effective capacity (e.g. weight decay) and grid-search reduced model sizes to find the best-fit model per shard; ''model size'' here is that best-fit
    size, e.g. word/character LMs grow with exponent about 0.7 in training set size (Section 4.2). Kaplan et al. (arxiv-2001.08361, Related Work) characterize this paper as finding super-linear scaling
    of dataset size with model size; this is the same direction as this paper''s own statement that model size scales sublinearly with data size, and Kaplan et al. contrast it with their own sub-linear
    data-vs-model-size finding (which concerns the data needed to avoid overfitting).'

claims:
- id: c1
  statement: Xiaomi-TabLDM is a tabular foundation model for classification and regression via in-context learning, without task-specific fine-tuning.
  location: Abstract
  page: 1
  quote: We introduce Xiaomi-TabLDM, a tabular large data foundation model for classification and regression via in-context learning, which delivers superior prediction accuracy without requiring task-specific
    fine-tuning.
- id: c2
  statement: 'Its strongest results are on regression: first on OpenML-CTR23 and second on regression across TALENT, TabArena and BCCO.'
  location: Introduction
  page: 3
  quote: 'Its strongest and most consistent results are observed on regression: Xiaomi-TabLDM ranks first on OpenML-CTR23 and second on regression across TALENT, TabArena, and BCCO.'
- id: c3
  statement: Most benchmark datasets have fewer than 10K training examples, a smaller portion 10K-100K, and only TALENT includes some with more than 100K.
  location: Evaluation
  page: 9
  quote: Across these benchmarks, most datasets contain fewer than 10K training examples, with a smaller portion ranging from 10K to 100K; TALENT additionally includes several datasets with more than 100K
    training instances.
- id: c4
  statement: On TALENT, missing results of some methods on a subset of datasets are imputed with K-nearest-neighbour values.
  location: Evaluation (TALENT figure caption)
  page: 10
  quote: For methods with missing results on a subset of datasets, the corresponding score entries are imputed using K-nearest-neighbour values following the evaluation protocol.
- id: c5
  statement: BCCO excludes datasets with more than 50,000 training samples, 10,000 features, or 10 target classes.
  location: Evaluation (BCCO)
  page: 13
  quote: The benchmark excludes extremely large datasets with more than 50,000 training samples, 10,000 features, or 10 target classes.
- id: c6
  statement: OpenML-CTR23 results are reported on 33 datasets of the original 35-problem suite; no reason for the reduction was found in the text.
  location: Evaluation (OpenML-CTR23)
  page: 15
  quote: In our experiments, we report results on 33 datasets and compare Xiaomi-TabLDM against both tabular foundation models and conventional learning baselines.

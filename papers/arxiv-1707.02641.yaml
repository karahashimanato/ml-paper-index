proposes:
- 'The 2016 Atlantic Causal Inference Conference competition (''Is Your SATT Where It''s At?''): 77 simulation settings built on real covariates from the Collaborative Perinatal Project (4802 observations,
  58 covariates) with simulated treatment and outcomes, 100 replications each for the black-box track and 20 data sets for the do-it-yourself track, estimand SATT'
- Post-competition methods created by the organizers by combining or tweaking top submissions (e.g. BART with IPTW/TMLE, cross-validated priors, multiple chains, propensity score as covariate)
claims:
- id: c1
  statement: 'Motivation: the authors argue that papers proposing new methods have shortcomings as a source of evidence about which method is best; strong performance of a method in a paper written by its
    inventor is encouraging but should be interpreted cautiously.'
  location: Section 2.1
  page: 2
  quote: Strong performance of a method in a paper written by its inventor is encouraging but should be interpreted cautiously for the reasons discussed in this section.
- id: c2
  statement: 'Competition design against unfair comparisons: the researchers creating the simulated testing grounds were distinct from those submitting methods; results are reported for 30 competitors across
    the black-box and do-it-yourself versions.'
  location: Abstract
  page: 1
  quote: The researchers creating the data testing grounds were distinct from the researchers submitting methods whose eﬃcacy would be evaluated.
- id: c3
  statement: 'Organizers'' role: the organizers were not allowed to submit methods; for the black-box competition they included a simple main-effects linear model as a baseline, distinct from the methods
    they created after the competition.'
  location: Section 5
  page: 12
  quote: The organizers were not allowed to submit methods to the competition; however for the black-box competition we included a simple linear model using main eﬀects to create a baseline for comparison
    (as distinct from the “created” methods described later).
- id: c4
  statement: 'Overlap design choice: since the estimand is the sample average treatment effect on the treated (SATT), overlap is required only for treated units (empirical counterfactuals for all treated),
    and settings without common support for the inferential group were excluded because changing the estimand would make fair comparison too complicated.'
  location: Section 4.1
  page: 7
  quote: Given our focus on SATT, to satisfy the overlap assumption we only need to ensure that empirical counterfactuals exist for all treated units.
- id: c5
  statement: 'Scenario selection: the response surface and assignment mechanism are random generalized additive functions controlled by tunable ''knobs''; all knob combinations yield 216 scenarios, of which
    the organizers focused on 77 by eliminating trivial or redundant ones (e.g. simple linear models or unconfounded treatment and response).'
  location: Section 4.3
  page: 8
  quote: Concern about the ability to test multiple replications in that many scenarios led us to focus on the most interesting 77 combinations by eliminating cases that were trivial or redundant, such
    as simple linear models or unconfounded treatment and response.
- id: c6
  statement: 'Organizer-created methods: after preliminary results were presented, the organizers created nine additional methods by tweaking and combining submissions (mostly BART variants, plus Super
    Learner variants); they state that, not surprisingly, the methods created or submitted after the initial deadline all performed particularly well relative to the others, except SL+TMLE Joint (which
    they say likely failed because many methods in its ensemble library could not fit non-parallel response surfaces).'
  location: Section 6.2
  page: 20
  quote: In particular, and not surprisingly, the methods created or submitted after the initial deadline all performed particularly well relative to the others with the exception of SL+TMLE joint
- id: c7
  statement: 'Predicting performance: the authors could not go beyond a general recommendation of flexible nonparametric response-surface modeling; under almost no condition could they predict which black-box
    method would outperform others beyond its average performance, and they describe relative performance as much less contextual than imagined.'
  location: Section 7
  page: 23
  quote: Overall, we ﬁnd that to a surprising degree we could not go beyond a general recommendation of using ﬂexible non-parametric response surface modeling.
- id: c8
  statement: 'What did well: nonlinear response surfaces and treatment effect heterogeneity were two of the three complexities that created the most difficulty for low bias; methods able to flexibly model
    the response surface routinely distinguished themselves, even methods like BART that modeled only the response surface, and outperformed approaches that only flexibly modeled the assignment mechanism
    (Balance Boost, Tree Strat, Adj. Tree Strat).'
  location: Section 8
  page: 24
  quote: This held true even for methods like BART that only modeled the response surface and not the assignment mechanism.
- id: c9
  statement: 'Caveat: the authors say there are several good options for accurately estimating causal effects (particularly for reducing bias), but this advice applies only to testing grounds where ignorability
    holds, overlap for the inferential group is satisfied and the data are i.i.d.; these properties may not hold in practice.'
  location: Section 8
  page: 25
  quote: Of course that advice comes with the caveat that our testing grounds have been restricted a range of settings where ignorability holds, overlap for the inferential group is satisﬁed, the data are
    i.i.d., etc.; these properties may not hold in practice

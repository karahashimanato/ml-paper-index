id: arxiv-2602.06456
title: 'The Window Dilemma: Why Concept Drift Detection is Ill-Posed'
authors:
- Brandon Gower-Winter
- Misja Groen
- Georg Krempl
year: 2026
links:
  arxiv: https://arxiv.org/abs/2602.06456
  code: https://github.com/BrandonGower-Winter/TheWindowDilemma
source:
  version: arXiv v1
  retrieved_at: '2026-10-02'
  pdf_sha256: f4b06990b504ec0dbefc451a6008c29460d5c36d690ace48ccab4c0d3a40f969
tags:
  tasks:
  - concept-drift-detection
  method_families:
  - error-rate-drift-detectors
  - window-based-drift-detectors
  - random-forests
  paradigms:
  - streaming
proposes:
- The Window Dilemma (argument that drift detection is ill-posed)
claims:
- id: c1
  statement: Traditional batch learning often performed better than drift-aware stream learners.
  location: Abstract
  page: 1
  quote: is that traditional batch learning techniques often perform better than their drift-aware counterparts
- id: c2
  statement: 'The Window Dilemma: perceived drift is a product of how instances are windowed, not necessarily of the data-generating process.'
  location: Abstract
  page: 1
  quote: perceived drift is a product of windowing and not necessarily the underlying data generating process.
- id: c3
  statement: Drift detection is ill-posed mainly because drift events can rarely be verified in practice.
  location: Abstract
  page: 1
  quote: drift detection is ill-posed, primarily because verification of drift events are implausible in practice.
- id: c4
  statement: Better performance of a classifier with a drift detector does not prove that drift was detected (affirming the consequent).
  location: Section 4
  page: 4
  quote: Performance improvement is neither necessary nor sufficient evidence of successful drift detection
- id: c5
  statement: Detectors that alarm more frequently tend to perform better (up to a point), likely because they retrain more often on recent data.
  location: Section 4
  page: 4
  quote: concept drift detectors that detect more frequently, tend to perform better (up to a point).
- id: c6
  statement: The type of classifier often matters more than drift-awareness.
  location: Introduction
  page: 1
  quote: indicates that the type of classifier is often more important than drift-awareness.
- id: c7
  statement: Among drift detectors, D3 with a Hoeffding Tree discriminator was best for both base models (consistent with Lukats et al.).
  location: Section 5
  page: 7
  quote: Of the drift detectors, D3-HT performed the best for both the NB and HT base models.
- id: c8
  statement: The drift-unaware Aggregated Mondrian Forest was competitive with the drift-aware Adaptive Random Forest.
  location: Section 5
  page: 7
  quote: the drift-unaware Aggregated Mondrian Forest (AMF) performed competitively with the drift-aware Adaptive Random Forest (ARF).
- id: c9
  statement: Keeping past data and periodically retraining on growing training sets is often effective.
  location: Section 5
  page: 7
  quote: our results suggest that keeping past data is often useful and periodically retraining a model on increasingly large training sets is often an effective strategy.
- id: c10
  statement: Under the same update regime as batch random forests, drift-aware stream learners are often inferior to simple batch learning with a suitable classifier.
  location: Section 5
  page: 7
  quote: drift-aware stream learners are often inferior to simple batch learning procedures provided an appropriate classifier is chosen.
- id: c11
  statement: The authors do not claim drift detection is pointless, but that its current purpose is misplaced.
  location: Conclusion
  page: 8
  quote: Our findings do not mean that drift detection is pointless, rather that its current purpose is misplaced.
- id: c12
  statement: 'No per-stream tuning: default parameters of each library/implementation are used.'
  location: Appendix A
  page: 8
  quote: We do not perform explicit parameter tuning for model on each data stream and instead use the default values
- id: c13
  statement: Evaluation uses 11 binary and multiclass real-world streams (no purely synthetic data).
  location: Section 5
  page: 5
  quote: we evaluate each model across 11 binary and multiclass data streams
- id: c14
  statement: The Last Class baseline wins on Forest Covertype by exploiting autocorrelation.
  location: Section 5 footnote
  page: 7
  quote: The Last Class classifier performed best on ForestCoverType because it abuses the known autocorrelation in the data stream.
- id: c15
  statement: Accuracy can be misleading for drifting streams (Cohen's kappa is reported in the appendix).
  location: Section 5
  page: 5
  quote: We acknowledge that accuracy is a potentially misleading metric in Drift Research
- id: c16
  statement: Reset intervals of the periodic-reset models use domain knowledge for some datasets (e.g. one month, one season).
  location: Appendix
  page: 8
  quote: For resetting, some datasets possess domain knowledge that we could exploit.

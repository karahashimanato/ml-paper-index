  notes: 'Selected for the topic article requested by the user (2026-10-03): classical algorithms (sorting, binary search, greedy) and machine learning; carded by a subagent. Results tables not recorded;
    claims only. Affiliations: Google Brain (Vinyals, Jaitly) and UC Berkeley Department of Mathematics (Fortunato) (title page). Data: planar point sets sampled uniformly in [0,1]^2, 1M training pairs;
    single-layer LSTM with 256 or 512 hidden units, SGD lr 1.0, batch 128. TSP labels: exact Held-Karp O(2^n n^2) up to n = 20; for larger n approximate solvers A1, A2 (O(n^2)) and A3 (Christofides, within
    1.5x of optimal) are used as training targets; Ptr-Net trained on the worst solver''s (A1) outputs outperforms A1. For TSP, beam search was constrained to valid tours because for n > 20 at least 10%
    of instances would otherwise produce no valid tour. The paper states attention-based decoding costs O(n^2) at inference and that Ptr-Net ''implements an O(n^2) algorithm''. Convex hull errors mostly
    come from aligned points; input order at inference affects performance (Empirical Results). Delaunay triangulation: no exactly correct triangulation at n = 50 (triangle coverage only). Baselines: LSTM
    seq2seq and LSTM with input attention, which must be trained on the same n they are tested on.'

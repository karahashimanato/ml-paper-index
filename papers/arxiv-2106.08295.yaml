claims:
- id: c1
  statement: 'Survey/guide claim: in most cases PTQ is sufficient for 8-bit quantization with close to floating-point accuracy, without re-training or labelled data.'
  location: Abstract
  page: 1
  quote: In most cases, PTQ is sufficient for achieving 8-bit quantization with close to floating-point accuracy.
- id: c2
  statement: QAT needs fine-tuning and labelled training data but enables lower-bit quantization with competitive results.
  location: Abstract
  page: 1
  quote: QAT requires fine-tuning and access to labeled training data but enables lower bit quantization with competitive results.
- id: c3
  statement: 'PTQ calibration: in a footnote to the AdaRound step of their standard PTQ pipeline, the authors state that usually 500 to 1000 unlabeled images are sufficient as a calibration set.'
  location: Section 3.5 Standard PTQ pipeline (footnote)
  page: 16
  quote: Usually, between 500 and 1000 unlabeled images are sufficient as a calibration set.
- id: c4
  statement: 'Evaluation protocol: all models (ImageNet classifiers, DeepLabV3 on Pascal VOC, EfficientDet on COCO 2017, BERT-base on GLUE) are evaluated on the respective validation sets (Table 6 caption;
    the same sentence is in the Table 10 QAT caption).'
  location: Section 3.6 Experiments (Table 6 caption)
  page: 17
  quote: We evaluate all models on the respective validation sets.
- id: c5
  statement: 'QAT tuning protocol: results are reported with the best learning rate per quantization configuration, with no further hyperparameter tuning. Results are reported on the validation sets; a
    separate split for selecting the learning rate was not found in the text.'
  location: Section 4.5 Experiments
  page: 24
  quote: We present the results with the best learning rate per quantization configuration and perform no further hyper-parameter tuning.
- id: c6
  statement: 'Failure mode: networks with depth-wise separable layers (MobileNetV2, EfficientNet lite, DeeplabV3, EfficientDet-D1) are more challenging to quantize with QAT, a trend the authors say they
    also observed in their PTQ results and that is discussed in the literature.'
  location: Section 4.5 Experiments
  page: 24
  quote: Quantizing networks with depth-wise separable layers (MobileNetV2, EfficientNet lite, DeeplabV3, EfficientDet-D1) is more challenging; a trend we also observed from the PTQ results in section 3.6
    and discussed in the literature (Chin et al., 2020; Sheng et al., 2018a).
- id: c7
  statement: 'Failure mode in BERT-base: a few activation tensors have extreme differences in dynamic range; to make PTQ work, these layers were identified with the debugging procedure and kept in 16 bit.'
  location: Section 3.6 Experiments
  page: 17
  quote: For BERT-base, we observe that a few activation tensors have extreme differences in their dynamic ranges.

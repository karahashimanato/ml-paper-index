proposes:
- 'Fast-KRR: randomly partition N samples into m equal subsets, solve kernel ridge regression on each subset independently with a regularization parameter chosen as if all N samples were used, and average
  the m local estimates; with mean-squared-error bounds showing the minimax rate is retained when m is below a kernel-dependent threshold'
claims:
- id: c1
  statement: 'Partition scheme: the data set is split uniformly at random into m equal-size subsets, an independent KRR estimator is computed on each subset, and the local solutions are averaged into a
    global predictor (divide = random partition, conquer = averaging; no learned or data-dependent partition).'
  location: Abstract
  page: 1
  quote: it randomly partitions a dataset of size N into m subsets of equal size, computes an independent kernel ridge regression estimator for each subset, then averages the local solutions into a global
    predictor.
- id: c2
  statement: 'Statistical guarantee (theory, with assumptions): the two main theorems state that, as long as the number of partitions m is not too large, the averaged estimator attains the statistical minimax
    rate over all estimators that use the N samples, despite the computational speed-up. The guarantee is conditional: Theorem 1 assumes f* in the RKHS with bounded conditional noise variance (Assumption
    B) and a moment bound on the kernel eigenfunctions (Assumption A; A'' = uniform boundedness), and the rate-optimal corollaries additionally fix lambda (r/N, (1/N)^(2nu/(2nu+1)) or 1/N depending on eigendecay)
    and require m below an explicit threshold; Theorem 2 (f* not in H) allows a smaller m.'
  location: Abstract
  page: 1
  quote: 'Our two main theorems establish that despite the computational speed-up, statistical optimality is retained: as long as m is not too large, the partition-based estimator achieves the statistical
    minimax rate over all estimators using the set of N samples.'
- id: c3
  statement: 'Allowed number of partitions depends on kernel eigendecay: the theory guarantees that m may grow nearly linearly in N for finite-rank and Gaussian kernels and polynomially in N for Sobolev
    spaces. These are the Corollary 1-3 thresholds, which hold under Assumption B and Assumption A (or A'') with the corollary''s specific lambda; under Assumption A the exponent depends on the number of
    eigenfunction moments k (the paper''s summary says the thresholds grow with N when the basis functions have more than four moments).'
  location: Abstract
  page: 1
  quote: As concrete examples, our theory guarantees that the number of processors m may grow nearly linearly for ﬁnite-rank kernels and Gaussian kernels and polynomially in N for Sobolev spaces, which
    in turn allows for substantial reductions in computational cost.
- id: c4
  statement: 'What makes the averaging work: each sub-problem must be regularized as though it had all N samples, so locally it is under-regularized; this keeps each local bias small but blows up the variance,
    which the m-fold averaging then reduces enough to retain the optimal rate.'
  location: Introduction
  page: 2
  quote: Consequently, from a local point of view, each sub-problem is under-regularized.
- id: c5
  statement: 'Simulation check of the threshold (first-order Sobolev kernel, 1-D synthetic regression, f*(x)=min(x,1-x)): the error appears to begin increasing around log(m) of about 0.45 log(N) for reasonably
    large N, somewhat better than the m of order N^(1/3) threshold predicted by Corollary 2 (nu = 1); the authors read this as confirming that m can scale polynomially in N while retaining minimax optimality
    (an empirical check, not a proof of the empirical threshold).'
  location: Simulation studies
  page: 17
  quote: This empirical performance is somewhat better than the (1/3) thresholded predicted by Corollary 2, but it does conﬁrm that the number of partitions m can scale polynomially with N while retaining
    minimax optimality.
- id: c6
  statement: 'Real-data comparison (Million Song year prediction, Gaussian kernel): at a fixed training-time budget Fast-KRR gives the lowest test error among Fast-KRR, Nystrom subsampling and random features,
    but the authors state the margin over Nystrom sampling is not substantial (they add that Fast-KRR parallelizes trivially).'
  location: Real data experiments
  page: 19
  quote: As we see in Figure 3, for a ﬁxed time budget, Fast-KRR enjoys the best performance, though the margin between Fast-KRR and Nystr¨om sampling is not substantial.
- id: c7
  statement: 'Stated open problem: the guarantees use a specific choice of the regularization lambda, but the authors note the optimal lambda may not be known a priori in practice, and say it is unclear
    how to choose it adaptively (e.g. by cross-validation or unbiased risk estimation) in the distributed setting where each local estimate depends only on its own subset.'
  location: Main results and their consequences
  page: 8
  quote: Cross-validation or other types of unbiased risk estimation are natural choices, however, it is at this point unclear how to achieve such behavior in the distributed setting we study
- id: c8
  statement: 'KRR estimator (Eq. 2): fhat = argmin over f in H of (1/N) sum_{i=1}^{N} (f(x_i) - y_i)^2 + lambda ||f||_H^2 with lambda > 0, i.e. least-squares loss plus a squared Hilbert-norm penalty; the
    paper calls it a natural generalization of ordinary ridge regression to the non-parametric setting.'
  location: Section 2.2
  page: 4
  quote: It is a natural generalization of the ordinary ridge regression estimate [13] to the non-parametric setting.
- id: c9
  statement: 'Representer theorem: any solution of the KRR program lies in the linear span of the kernel functions K(., x_i), so computing the estimate reduces to an N-dimensional quadratic program involving
    the N^2 kernel-matrix entries.'
  location: Section 2.2
  page: 4
  quote: By the representer theorem for reproducing kernel Hilbert spaces [31], any solution to the KRR program (2) must belong to the linear span of the kernel functions {K(·, xi), i = 1, . . . , N}.
- id: c10
  statement: 'Cost of a standard KRR implementation: the kernel matrix must be inverted, costing O(N^3) time and O(N^2) memory.'
  location: Introduction
  page: 1
  quote: the kernel matrix must be inverted, which requires costs O(N 3) and O(N 2) in time and

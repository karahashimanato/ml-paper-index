claims:
- id: c1
  statement: PISCES is trained without catalog labels under physics constraints and decomposes the anomaly score into physical contributions.
  location: Abstract
  page: 1
  quote: At inference, PISCES separates the anomaly score into magnetic and plasma reconstruction errors, physics relations, and resid- ual corrections
- id: c2
  statement: PR-AUC over all thresholds is used; the paper also notes that point-adjusted F1 can make random scores look competitive.
  location: Evaluation
  page: 10
  quote: Point-adjusted F1 can make random anomaly scores appear competitive [41]
- id: c3
  statement: Attenuating skip connections improves average precision of trained models while untrained scores stay nearly the same.
  location: Abstract
  page: 1
  quote: Attenuation of the skip connections, selected on validation data, improves average precision for the trained models, while the untrained scores remain nearly the same.
- id: c4
  statement: Threshold-based alarms use the 99th percentile of anomaly scores on a separate validation period (not the test labels).
  location: Evaluation
  page: 10
  quote: The detection threshold is the 99th percentile of composite anomaly scores in the 2016 to 2017 validation set.

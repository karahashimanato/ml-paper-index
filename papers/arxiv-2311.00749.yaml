proposes:
- Dirty-Clean Sort (randomized BST insertion guided by dirty comparisons, verified by clean comparisons)
- Displacement Sort (bucket sort by predicted position + finger-tree insertion)
- Double-Hoover Sort (positional predictions, one-sided error measures)
claims:
- id: c1
  statement: 'Contribution: the paper studies comparison sorting as a learning-augmented problem in two settings, (i) a prediction of each item''s position in the sorted list and (ii) cheap but possibly
    wrong ''dirty'' comparisons alongside slow exact ''clean'' comparisons, with algorithms using O(sum_i log eta_i) exact comparisons, where eta_i is a suitably defined element-wise prediction error (the
    abstract''s wording).'
  location: Abstract
  page: 1
  quote: We explore the fundamental problem of sorting through the lens of learning-augmented algorithms, where algorithms can leverage possibly erroneous predictions to improve their efficiency.
- id: c2
  statement: 'Guarantees (theoretical, counted in exact comparisons): all three algorithms need only O(n) exact comparisons with accurate predictions (consistency), never more than O(n log n) regardless
    of prediction quality (robustness), and degrade slowly with the prediction error (smoothness). The bounds have the form O(sum_i log(eta_i + 2)) for a different error measure per algorithm: displacement
    |p_hat(i) - p(i)| and one-sided errors for the two deterministic positional-prediction algorithms, and the number of incorrect dirty comparisons involving item i for the randomized dirty-comparison
    algorithm, whose clean-comparison bound holds in expectation (Theorem 1.1).'
  location: Introduction
  page: 2
  quote: In particular, all three proposed algorithms only require O(n) exact comparisons if predictions are accurate (consistency), never use more than O(n log n) comparison regardless of prediction quality
    (robustness), and their performance degrades slowly as a function of prediction error (smoothness).
- id: c3
  statement: 'Lower bound (theoretical): the comparison complexity is proven optimal with respect to the error measures examined; Theorem 1.5 states that no sorting algorithm uses o(sum_i log(eta_i + 2))
    clean comparisons for the dirty-comparison error, nor asymptotically fewer comparisons than the displacement or one-sided (min of left/right) error bounds with a positional predictor.'
  location: Abstract
  page: 1
  quote: We prove that this comparison complexity is theoretically optimal with respect to the examined error measures.
- id: c4
  statement: 'Relation to classical sorting (Remark 2.6): with a modified verification step (geometrically increasing step sizes, then binary search), the dirty-clean algorithm can be implemented so that
    its clean comparisons are at most those of quicksort plus O(n log log n) regardless of prediction error (the O(log log n) per verification step holds in expectation); in the worst case where all dirty
    comparisons are incorrect, the clean searches perform exactly the same set of comparisons as quicksort, so the algorithm matches quicksort up to a factor tending to 1 as n grows.'
  location: Complexity Analysis
  page: 7
  quote: Thus, even with terrible predictions our algorithm matches the performance of quicksort up to a factor that tends to 1 as n →∞.
- id: c5
  statement: 'Baselines (protocol): five baselines are Quick Sort, Merge Sort, Tim Sort, and two adaptive sorts (Odd-Even Straight Merge Sort, Cook-Kim division); for positional predictions the adaptive
    baselines receive the array bucket-sorted by predicted ranking.'
  location: Experiments
  page: 13
  quote: We assess the performance of our proposed sorting algorithms against five well-established baselines.
- id: c6
  statement: 'Metric (protocol): the plots report the number of comparisons used against prediction quality (not wall-clock time); experiments are repeated 30 times with standard deviation shaded; inputs
    are synthetic (class and decay settings) plus one real-world population-ranking dataset (details in notes).'
  location: Experiments
  page: 13
  quote: In all the plots, the X-axis indicates the quality of predictions, and the Y-axis indicates the number of comparisons used.
- id: c7
  statement: 'Limitation: in the dirty-clean setting the algorithm still needs O(n log n) time to process O(n log n) dirty comparisons, so it suits settings where exact comparisons are expensive rather
    than fast; Double-Hoover Sort''s bound holds only for comparisons, not time, and predictions might not be learnable in some sorting settings.'
  location: Limitations and Future Work
  page: 14
  quote: Consequently, the algorithm is more appropriate for situations where exact comparisons are expensive than for those where comparisons are fast.

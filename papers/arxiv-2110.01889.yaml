  notes: 'Selected for the method article requested by the user (2026-10-10): deep learning architectures for tabular data (TabNet, NODE and differentiable trees, TabTransformer/FT-Transformer-style attention,
    SAINT, embeddings for numerical features, retrieval (TabR), regularized MLPs, CTR-style interaction models, self-supervised pretraining, and surveys/benchmarks comparing them with GBDTs). Carded by
    a subagent. Results tables not recorded; claims only. Affiliation: University of Tübingen (DSAR group); Gjergji Kasneci is also affiliated with Schufa Holding AG (stated on page 1). Venue: the v3 PDF
    header says ''SUBMITTED TO THE IEEE, JUNE 2022'' and page 1 carries an IEEE copyright notice, but the arXiv record has no comment/journal_ref and no publication venue is stated in the PDF, so no venue
    is recorded. Year is the first arXiv version (2021); the v3 PDF is dated 29 Jun 2022. Section labels (III-C, VII-B4 etc.) are from the PDF headings and table of contents. Benchmark scale: only 5 datasets,
    results as mean and std over (stratified) 5-fold cross-validation with the same folds for every model (Table V caption); per-model numbers are in a table and not recorded; among deep models the text
    says SAINT was competitive across datasets while the others'' performance was highly dataset-dependent. HIGGS was modified for models that require a categorical feature (the 21st variable binarized
    into three groups). The summary (Section VIII-A) states that tree ensembles still outperform deep models ''on most data sets that we considered'' with significantly less training time, while for very
    large datasets deep learning ''may still be able to achieve competitive performance''. Conflict of interest: the ''Model Trees'' baseline in the benchmark is by an author (Broelemann and Kasneci, ref.
    [199]), and the counterfactual-explanation section points to the authors'' own CARLA library (Pawelczyk ... Kasneci, ref. [157]); the deep models compared are by other groups.'

  notes: 'Selected for the method article requested by the user (2026-10-10): alternatives and extensions to dense Transformers (sparse mixture-of-experts routing and load balancing, state space models
    from HiPPO/S4 to Mamba-2, linear and kernelized attention, RWKV, and benchmarks/analyses comparing them with Transformers). Carded by a subagent. Results tables not recorded; claims only. Affiliations:
    Google Brain / Google / Google Research (page 1). Venue: no venue in the arXiv v2 PDF and no comment/journal_ref in the arXiv record (''25 pages main text, 39 pages overall''); none recorded. Section
    numbers are from numbered headings in the PDF dump. The z-loss coefficient c_z = 0.001 was chosen by a sweep on pre-training quality; the load-balancing loss (Appendix A, alpha = 1e-2) is the Switch-style
    f.P loss credited to Shazeer et al. (2017). ST-MoE-32B: 269B parameters, approximately FLOP-matched to a 32B dense Transformer, pre-trained 1.5T tokens; the router z-loss is said to have enabled the
    high-FLOP sparse model that was previously unstable in Fedus et al. (2021). Stated weaknesses: lackluster SQuAD, small tasks CB/WSC fail to improve, closed-book TriviaQA does not beat GPT-3/GLaM (Section
    6). Discussion (Section 9): multilingual pre-training is more unstable with smaller speed-ups (hypothesis: few sequences per load-balancing group); improvements at small scale often vanish or reverse
    at larger scale. Fine-tuning only the non-MoE parameters works about as well as all parameters, and only-MoE parameters drastically worse (Section 4.2, figure). Results tables (Tables 2-5, 8, 10, 12)
    not recorded. Conflict of interest: Fedus, Zoph and Shazeer are the authors of Switch Transformers (arxiv-2101.03961), whose recommendations this paper revises; Shazeer co-authored the original MoE
    layer (arxiv-1701.06538) and GShard (arxiv-2006.16668); Du and Huang co-authored GLaM (whose data are used).'

proposes:
- 'Diffusion probabilistic models: a fixed forward (inference) diffusion process (Gaussian or binomial) slowly converts the data distribution into a tractable distribution, and a learned finite-time reverse
  diffusion process defines the generative model, trained on a variational lower bound of the log likelihood'
claims:
- id: c1
  statement: 'Core idea: structure in the data distribution is slowly destroyed by an iterative forward diffusion process, and a reverse diffusion process that restores the structure is learned, giving
    a flexible and tractable generative model; the idea is described as inspired by non-equilibrium statistical physics.'
  location: Abstract
  page: 1
  quote: The essential idea, inspired by non-equilibrium statistical physics, is to systematically and slowly destroy structure in a data distribution through an iterative forward diffusion process.
- id: c2
  statement: 'Why the reverse steps can be Gaussian (or binomial): citing Feller (1949), for continuous diffusion (the limit of small step size β) the reversal of the diffusion has the same functional form
    as the forward process; the longer the trajectory, the smaller β can be made, and only the mean and covariance (or bit-flip probability) of each reverse step must be estimated.'
  location: Section 2.2
  page: 5
  quote: For both Gaussian and binomial diffusion, for continuous diffusion (limit of small step size β) the reversal of the diffusion process has the identical functional form as the forward process (Feller,
    1949).
- id: c3
  statement: 'Cost: running the algorithm costs the evaluation of the mean/covariance (or flip-rate) functions times the number of time steps; all results in the paper use multi-layer perceptrons for these
    functions.'
  location: Section 2.2
  page: 5
  quote: The computational cost of running this algorithm is the cost of these functions, times the number of time-steps.
- id: c4
  statement: Training maximizes a lower bound K on the log likelihood (via Jensen's inequality; the derivation parallels variational Bayes, and the bound becomes an equality only if forward and reverse
    trajectories are identical, i.e. a quasi-static process); this reduces density estimation to regression on the functions setting the means and covariances of a sequence of Gaussians.
  location: Section 2.4
  page: 6
  quote: Thus, the task of estimating a probability distribution has been reduced to the task of performing regression on the functions which set the mean and covariance of a sequence of Gaussians (or set
    the state ﬂip probability for a sequence of Bernoulli trials).
- id: c5
  statement: 'Noise schedule: the choice of β_t is stated to be important for performance; for Gaussian diffusion the schedule β_2..T is learned by gradient ascent on K (with ''frozen noise''), while the
    first-step variance β_1 is fixed to a small constant to prevent overfitting; binomial diffusion uses the fixed schedule β_t = (T − t + 1)^-1.'
  location: Section 2.4.1
  page: 6
  quote: The variance β1 of the ﬁrst step is ﬁxed to a small constant to prevent overﬁtting.
- id: c6
  statement: A footnote to the schedule paragraph adds that recent experiments suggest a fixed schedule (the same as for binomial diffusion) may be just as effective as learning it.
  location: Section 2.4.1 (footnote 2)
  page: 6
  quote: Recent experiments suggest that it is just as effective to instead use the same ﬁxed βt schedule as for binomial diffusion.
- id: c7
  statement: 'Evaluation caveat (footnote 3): an earlier version of the paper reported higher CIFAR-10 log-likelihood bounds that came from the model learning the 8-bit pixel quantization; the reported
    bounds are for data with uniform noise added to remove quantization, following Theis et al. (2015).'
  location: Section 3 (footnote 3)
  page: 7
  quote: These were the result of the model learning the 8-bit quantization of pixel values in the CIFAR-10 dataset.
- id: c8
  statement: 'MNIST comparison protocol: although the training algorithm gives an asymptotically consistent lower bound on log likelihood, most previously reported continuous-MNIST results use Parzen-window
    estimates from samples, so for comparison the MNIST log likelihood was estimated with the Parzen-window code released with Goodfellow et al. (2014).'
  location: Section 3.2.1
  page: 9
  quote: For this comparison we therefore estimate MNIST log likelihood using the Parzen-window code released with (Goodfellow et al., 2014).

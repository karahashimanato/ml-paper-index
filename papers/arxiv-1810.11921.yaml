  notes: 'Selected for the method article requested by the user (2026-10-10): deep learning architectures for tabular data (TabNet, NODE and differentiable trees, TabTransformer/FT-Transformer-style attention,
    SAINT, embeddings for numerical features, retrieval (TabR), regularized MLPs, CTR-style interaction models, self-supervised pretraining, and surveys/benchmarks comparing them with GBDTs). Carded by
    a subagent. Results tables not recorded; claims only. Affiliations: Peking University, UCLA, Mila/HEC Montreal. Venue from the PDF (ACM Reference Format: ''Proceedings of the 28th ACM International
    Conference on Information and Knowledge Management (CIKM ’19)'') and the arXiv comment ''Accepted at CIKM2019''; year is the first arXiv version (2018). Tagged tabular-classification because CTR prediction
    is binary classification on sparse categorical/numerical fields; the paper''s setting is recommender/advertising data, not general tabular benchmarks, and GBDTs are not among the baselines. Section
    numbers come from cross-references in the text (Sections 2-6, 5.2, 5.5); subsection names are used otherwise. AutoInt''s dropout was grid-searched only on MovieLens-1M (''we found dropout is not necessary
    for other three large data sets''); AutoInt''s own architecture (3 layers, d''=32, 2 heads) is described as a default setting, while baselines got grid search once structures were fixed. Significance
    is an unpaired t-test against the strongest baseline (Table 2 footnote). Run time (Figure 4), parameter counts (Table 3), ablations (Table 4, Figures 5-6) and AutoInt+ results (Table 5) are not recorded.
    Later reuse: DCN V2 (arxiv-2008.13535) reran AutoInt as a tuned baseline.'

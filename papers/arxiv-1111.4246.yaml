  notes: 'Selected for the method article requested by the user (2026-10-07): approximate Bayesian inference and its diagnostics (HMC/NUTS and SG-MCMC, variational inference, R-hat, PSIS, SBC, VI error
    bounds, Bayesian workflow). Carded by a subagent. Results tables not recorded; claims only. Affiliation: Columbia University. The arXiv comment gives only ''30 pages, 7 figures'' and the v1 PDF does
    not name a journal; no venue recorded (later versions may have been published elsewhere, not checked). Section numbers are from numbered headings in the PDF. Conflict of interest: the authors state
    they are developing Stan with NUTS as its core algorithm (Discussion), and the qualitative comparison with random-walk Metropolis and Gibbs (Section 4.5, Figure 7) is informal. The efficient NUTS (Algorithm
    3) stores O(j) states instead of O(2^j); the U-turn checks cost about as many inner products as leapfrog steps, which the authors say is usually negligible compared with gradient cost. Most trajectory
    lengths were powers of two (Section 4.3). ESS estimator: autocorrelations truncated when they first dip below 0.05 (Appendix A). Discussion notes that a mass matrix approximating the posterior covariance
    would help both NUTS and HMC. Results figures not recorded.'

  statement: Surprisingly strong transfer can emerge from self-supervised pre-training on a single real table.
  location: Abstract
  page: 1
  quote: In contrast, we show that surprisingly strong transfer can emerge from self-supervised pre-training on just a single real table.
- id: c2
  statement: Fine-grained column-level pre-processing consistently improves downstream performance, while dataset-level filtering or deduplication does not.
  location: Abstract
  page: 1
  quote: fine-grained column-level pre-processing consistently improves downstream performance, while no improvements are observed when we filter or deduplicate at the dataset level.
- id: c3
  statement: Single-table models are evaluated on the 72 OpenML CC-18 classification and 35 CTR-23 regression datasets, with no overlap between pre-training and evaluation.
  location: Generalization from single table training
  page: 3

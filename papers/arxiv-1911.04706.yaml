proposes:
- 'FLAML: a low-cost AutoML library that searches over learner, hyperparameters, training sample size and resampling strategy, choosing the next trial by estimated cost for improvement (ECI)'
- Learner proposer sampling each learner with probability proportional to 1/ECI; hyperparameter/sample-size proposer combining randomized direct search from a low-cost starting configuration (Wu et al.,
  2021) with progressive increase of the sample size; a threshold rule choosing cross-validation or holdout
claims:
- id: c1
  statement: 'Problem framing: the cost of one trial is jointly decided by the learner, a subset of its hyperparameters, the training data size and the resampling strategy, which also jointly affect the
    trial error; the goal is to minimize the total cost before finding a model with the lowest test error.'
  location: Section 1
  page: 1
  quote: 'We recognize that the cost of one trial is jointly decided by the following variables: the choice of learner, a subset of the hyperparameters for the chosen learner, the size of the training data,
    and the resampling strategy.'
- id: c2
  statement: 'FLAML deliberately does not rely on meta-learning or ensembles at first order, for usability reasons: no need to collect meta-training datasets, easy customization of learners/search spaces/metrics
    without re-running meta-learning, and the authors'' customers preferring single learners for complexity, latency, deployment, debuggability and explainability.'
  location: Section 2
  page: 3
  quote: FLAML is designed to perform efﬁciently and robustly without relying on meta-learning or ensemble at ﬁrst order, for several usability reasons.
- id: c3
  statement: 'Step 0 (resampling): cross-validation is used if the training set has fewer than 100K instances and #instances x #features / budget is below 10M/hour, otherwise holdout; defaults are 5-fold
    cross-validation and a holdout ratio of 0.1. The authors note this simple rule could be replaced by more complex rules, e.g. from meta-learning.'
  location: Section 4.2
  page: 6
  quote: 'If the training dataset has fewer than 100K instances and # instances × # features / budget is smaller than 10M/hour, we use cross validation.'
- id: c4
  statement: 'Step 1 (learner choice): each learner is sampled with probability proportional to 1/ECI rather than taking the minimum ECI, so every learner keeps a chance to be searched again and estimation
    errors are tolerated; ECI is updated dynamically, which the authors describe as self-correcting.'
  location: Section 4.2
  page: 6
  quote: With the concept of ECI introduced, we design a search strategy where each learner l is chosen with probability proportional to 1/ECI(l).
- id: c5
  statement: 'Step 2 (hyperparameters and sample size): each learner starts at a small sample size (10K); if ECI1 >= ECI2 the current hyperparameters are kept and the sample size increased, otherwise randomized
    direct search proposes new hyperparameters at the current size. Once a learner reaches the full data size it keeps it, which the authors say reduces the risk of pruning good configurations compared
    to multi-fidelity pruning.'
  location: Section 4.2
  page: 7
  quote: Speciﬁcally, we begin with a small sample size (10K) for each l.
- id: c6
  statement: 'Protocol: 53 datasets (39 classification tasks from the AutoML Benchmark of Gijsbers et al. (2019) and 14 PMLB regression datasets with more than 10,000 instances), 10 OpenML folds averaged,
    1 CPU core per solution on an Intel Xeon Gold 6140 server with 512GB RAM, budgets from one minute to one hour; scores are calibrated so a constant class-prior predictor is 0 and a tuned random forest
    is 1. Compared: auto-sklearn 0.9.0, H2O AutoML 3.30.0.3, TPOT 0.10.1, an unnamed commercial cloud-automl, and HpBandSter 0.7.4 (BOHB).'
  location: Section 5
  page: 8
  quote: We use 1 CPU core for each compared solution and vary the time budget from one minute to one hour.
- id: c7
  statement: 'Baseline configuration: all libraries use different search spaces by design except HpBandSter, which uses FLAML''s search space and resampling strategy; FLAML''s space neither subsumes nor
    is subsumed by the others'', and the authors consider equalizing search spaces very challenging, if not impossible. Competitors are run with their default settings.'
  location: Section 5
  page: 8
  quote: We use their default setting and do not introduce our own bias.
- id: c8
  statement: 'Results framing and caveat: under equal budgets the authors report that FLAML clearly outperforms every competitor with large margins in most cases and underperforms by a small margin in a
    small fraction of cases; they add that the prior libraries are not primarily designed for the same low-resource setting.'
  location: Section 5.1
  page: 8
  quote: To be fair, the prior libraries are not primarily designed for the same low-resource setting as ours.

claims:
- id: c1
  statement: Quantization error must be aligned between test rows and training rows; otherwise accuracy drops drastically.
  location: Abstract
  page: 1
  quote: We find that it is crucial to align the quantization error in the test rows with the quantization error in the training rows, as otherwise the accuracy drops drastically.
- id: c2
  statement: An FP8 attention kernel speeds up attention over 16-bit kernels with no relevant accuracy loss for TabPFN-v3 and TabICLv2 on TabArena and BeyondArena.
  location: Abstract
  page: 1
  quote: Our Triton kernel achieves a speedup up to 1.7x over regular 16-bit kernels, and we show that on TabPFN-v3 and TabICLv2 there is no relevant accuracy loss across TabArena and BeyondArena.
- id: c3
  statement: Quality is tested on the full 51-dataset TabArena suite (and later BeyondArena), over three TabPFN-v3 preprocessing seeds.
  location: Experiments
  page: 3
  quote: We first test the quality impact of our quantization scheme and kernel on TabArena [Erickson et al., 2026], where we run the full suite consisting of 51 datasets.
- id: c4
  statement: Degradation is tested with a one-sided sign test under the assumption that post-training quantization can only make the model worse.
  location: Experiments
  page: 3
  quote: Following Kübler et al. [2026] we assume that post-training quantization can only make the model worse and use a one-sided sign test.
- id: c5

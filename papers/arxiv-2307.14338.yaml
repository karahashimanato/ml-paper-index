  notes: 'Selected for the method article requested by the user (2026-10-10): deep learning architectures for tabular data (TabNet, NODE and differentiable trees, TabTransformer/FT-Transformer-style attention,
    SAINT, embeddings for numerical features, retrieval (TabR), regularized MLPs, CTR-style interaction models, self-supervised pretraining, and surveys/benchmarks comparing them with GBDTs). Carded by
    a subagent. Results tables not recorded; claims only. Affiliations: Yandex and HSE. No venue recorded: the arXiv v2 PDF has no conference footer and the arXiv record has no journal_ref (comment only
    gives the code URL). Conflict of interest: the protocol, MLP-PLR baseline (arxiv-2203.05556) and FT-Transformer/MLP baselines (arxiv-2106.11959) are the authors'' own earlier work; the Grinsztajn et
    al. benchmark (arxiv-2207.08815) is by another group. The authors also state that the retrieval component is not universally beneficial for all datasets and that retrieval and numerical embeddings are
    not fully orthogonal (section ''Evaluating retrieval-augmented deep learning models for tabular data''). For ANP, tuning was cut to 20 iterations on large datasets due to cost; ANP and DNNR were evaluated
    only on regression problems; the SAINT baseline was modified so each sample attends only to itself and training-set context, was tuned with TPE on the smaller datasets and used a slightly modified default
    configuration on WE, CO, MI. Figure 1 win/tie/loss counts against XGBoost are from a figure and are not recorded. Section numbers 3.1, 3.2, 4.2 and appendix labels are confirmed by in-text cross-references
    (''subsection 3.1'', ''subsection 3.2'', ''subsection 4.2'', ''subsection D.8'').'

  notes: 'Selected for the method article requested by the user (2026-10-10): graph neural networks (GCN, GraphSAGE, GAT, SGC, message passing, expressive power and the WL test, oversmoothing, oversquashing,
    heterophily, and evaluation pitfalls and benchmarks). Carded by a subagent. Results tables not recorded; claims only. Venue from the PDF footer on page 1 (''34th Conference on Neural Information Processing
    Systems (NeurIPS 2020), Vancouver, Canada''); year 2020 is the first arXiv version (v7 dated 25 Feb 2021). Section numbers from the table of contents and numbered headings. Conflict of interest: GIN
    (Xu, Hu, Leskovec and Jegelka, 2019) is co-authored by Hu and Leskovec and is evaluated (with virtual nodes) as a graph-level baseline, where it gives the best results on ogbg-mol* and ogbg-ppa; GraphSAGE
    (Hamilton et al., 2017) is co-authored by Leskovec; the molecular edge-feature handling and the scaffold split follow Hu et al. (2020a, ''Strategies for pre-training graph neural networks'', by Hu,
    Zitnik, Leskovec and others); OGB is designed to be compatible with PyTorch Geometric (Fey & Lenssen, 2019), co-authored by Fey. Link prediction / KG completion datasets (ogbl-*) have no matching task
    tag; graph-node-prediction and graph-level-prediction were used. The paper also states (Section 2) that Dwivedi et al. (2020) mainly benchmarks GNN building blocks and that five of its six datasets
    are synthetic (statement about the early version of arxiv-2003.00982). All result tables are not recorded.'

claims:
- id: c1
  statement: QLoRA finetunes by backpropagating through a frozen 4-bit quantized pretrained model into LoRA adapters (the base weights are not updated).
  location: Abstract
  page: 1
  quote: QLORA backpropagates gradients through a frozen, 4-bit quantized pretrained language model into Low Rank Adapters (LoRA).
- id: c2
  statement: 'Assumption behind NF4: the data type is information-theoretically optimal for normally distributed weights.'
  location: Abstract
  page: 1
  quote: (a) 4-bit NormalFloat (NF4), a new data type that is information theoretically optimal for normally distributed weights
- id: c3
  statement: 'Summary claim (GLUE / Super-NaturalInstructions and 5-shot MMLU experiments): 4-bit QLoRA with NF4 matches 16-bit full finetuning and 16-bit LoRA finetuning performance on academic benchmarks
    with well-established evaluation setups.'
  location: QLoRA vs. Standard Finetuning (Summary)
  page: 7
  quote: Our results consistently show that 4-bit QLORA with NF4 data type matches 16-bit full finetuning and 16-bit LoRA finetuning performance on academic benchmarks with well-established evaluation setups.
- id: c4
  statement: 'Evaluation practice: GPT-4 and human (Elo tournament) evaluations largely agree on model ranking but show instances of strong disagreement, so model-based evaluation has uncertainties.'
  location: Introduction
  page: 2
  quote: We find that GPT-4 and human evaluations largely agree on the rank of model performance in the tournaments, but we also find there are instances of strong disagreement.
- id: c5
  statement: The authors find that current chatbot benchmarks are not trustworthy for accurately evaluating chatbot performance levels.
  location: Abstract
  page: 1
  quote: Furthermore, we find that current chatbot benchmarks are not trustworthy to accurately evaluate the performance levels of chatbots.
- id: c6
  statement: 'Limitation: the paper did not establish that QLoRA matches full 16-bit finetuning at 33B and 65B scales.'
  location: Limitations and Discussion
  page: 15
  quote: Despite this evidence, we did not establish that QLORA can match full 16-bit finetuning performance at 33B and 65B scales.
- id: c7
  statement: 'Limitation: other bit-precisions (e.g. 3-bit base models) and other adapter methods were not evaluated; responsible-AI (bias) evaluation is also described as limited.'
  location: Limitations and Discussion
  page: 16
  quote: An additional limitation is that we did not evaluate different bit-precisions, such as using 3-bit base models, or different adapter methods.

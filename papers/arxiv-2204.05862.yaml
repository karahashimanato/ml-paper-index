  notes: 'Selected for the method article requested by the user (2026-10-11): aligning language models with human preferences (preference comparisons and reward models, PPO-based RLHF with a KL penalty,
    AI feedback, direct preference optimization and its variants, reward overoptimization, length bias, reward-model evaluation, and open problems). Carded by a subagent. Results tables not recorded; claims
    only. Affiliation: Anthropic (all authors). Conflict of interest: the authors train and evaluate Anthropic''s own models, with crowdworkers recruited and instructed by them; Elo/human comparisons and
    PM evaluations are all in-house. No venue recorded: the arXiv v1 PDF and the arXiv record (comment only gives the data URL) state none. Section numbers from cross-references in the PDF (Section 2.3,
    4.2, 4.3, 4.4, 4.5) and numbered headings 7.1/7.2; ''Section 4, Training Setup'' and ''Section 2, Task Specification...'' are given by name because their subsection numbers are not confirmed. PMs are
    trained for one epoch with preference model pretraining, on models from 13M to 52B (Section 3). In the Introduction the authors state that PMs trained to evaluate mainly helpfulness or mainly harmlessness
    perform ''much worse than chance'' on the other quality, while PMs trained on the mixture behave appropriately. Crowdworkers prefer the online HH model to professional writers about 57% of the time,
    which footnote 7 says should be interpreted with caution (not adversarial, not necessarily representative). The online PM''s test accuracies were 74%, 70% and 67% on the base, RS and online-only distributions
    (Section 4.5). The crowdworker distribution was not held fixed and worker quality probably improved over the project (Section 2), a stated complication for evaluating online training.'

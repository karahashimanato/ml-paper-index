proposes:
- 'Green AI: efficiency as an evaluation criterion alongside accuracy'
- Cost(R) proportional to E x D x H (per-example cost x dataset size x number of hyperparameter experiments)
- report total floating point operations (FPO) required to generate a result
claims:
- id: c1
  statement: 'Position: the paper advocates making efficiency an evaluation criterion for research alongside accuracy, and reporting the financial cost (''price tag'') of developing, training and running
    models.'
  location: Abstract
  page: 1
  quote: This position paper advocates a practical solution by making efﬁciency an evaluation criterion for research alongside accuracy and related measures.
- id: c2
  statement: 'Cost model: the cost of producing a result is described as growing linearly with the cost of processing one example, the training-set size and the number of hyperparameter experiments.'
  location: Red AI
  page: 3
  quote: The total cost of producing a (R)esult in machine learning increases linearly with each of these quantities.
- id: c3
  statement: 'Caveat: the authors state that this equation is a simplification and that it ignores other factors such as the number of training epochs.'
  location: Red AI
  page: 3
  quote: Equation 1 is a simpliﬁcation (e.g., different hyperparameter assignments can lead to different costs for processing a single example).
- id: c4
  statement: 'Survey method: for a sample of 60 papers from ACL, NeurIPS and CVPR, the authors classified whether the claimed main contribution is accuracy, efficiency, both, or other.'
  location: Red AI
  page: 3
  quote: For each paper we noted whether the authors claim their main contribution to be (a) an improvement to accuracy or some related measure, (b) an improvement to efﬁciency, (c) both, or (d) other.
- id: c5
  statement: 'Drawbacks of alternative measures: carbon emission, though described as appealing, is described as impractical to measure exactly and not comparable across locations or times because it depends
    on the local electricity infrastructure (electricity use, run time and parameter count are also discussed and judged hardware-dependent or not reflecting work done).'
  location: Measures of Efficiency
  page: 6
  quote: As a result, it is not comparable between researchers in different locations or even the same location at different times.
- id: c6
  statement: 'Recommendation: report the total number of floating point operations (FPO) required to generate a result; the authors argue FPO is hardware-agnostic, tied to the amount of energy consumed,
    and (citing Canziani et al.) strongly correlated with running time.'
  location: Measures of Efficiency
  page: 6
  quote: As a concrete measure, we suggest reporting the total number of ﬂoating point operations (FPO) required to generate a result
- id: c7
  statement: 'Limitations of FPO stated by the authors: it ignores memory consumption, and the amount of work largely depends on the model implementation.'
  location: Measures of Efficiency (Discussion)
  page: 7
  quote: First, it targets the electricity consumption of a model, while ignoring other potential limiting factors for researchers such as the memory consumption by the model, which can often lead to additional
    energy and monetary costs [24].

proposes:
- 'DSS-GNN: doubly-spectral stochastic (graph Fourier x polynomial chaos) node-embedding representation with standalone and hybrid (DSS-Hybrid) deployment modes'
claims:
- id: c1
  statement: DSS-GNN can be used standalone or as a residual branch beside a deterministic encoder (DSS-Hybrid).
  location: Abstract
  page: 1
  quote: 'DSS-GNN has two deployment modes: standalone, or as a residual branch beside a deterministic encoder (DSS-Hybrid).'
- id: c2
  statement: 'Main claim: the standalone model has the lowest Brier score among the compared uncertainty-aware baselines on all 14 node classification benchmarks without post-hoc calibration.'
  location: Abstract
  page: 1
  quote: Standalone DSS-GNN achieves the lowest Brier score among the compared uncertainty-aware baselines on all 14 node classification benchmarks without post-hoc correction
- id: c3
  statement: OOD-detection baselines GNNSafe, GNNSafe++ and GPN are taken from the values reported by Wu et al., while Graph-EBM, MC-dropout and Deep Ensembles are run in the authors' pipeline on the same
    backbone.
  location: Experiments (setup)
  page: 6
  quote: against GNNSafe, GNNSafe++, and GPN [30] at the values reported by Wu et al. [36]
- id: c4
  statement: Distribution-shift baselines on GOOD (ERM through TAR) are also copied from Zheng et al., with only G-ΔUQ run in the authors' pipeline.
  location: Experiments (distribution-shifted classification)
  page: 9
  quote: ERM through TAR as reported by Zheng et al. [38]
- id: c5
  statement: For the standalone model under the GOOD protocol, the epoch and the configuration (BatchNorm, learning rate, hidden width, P) are selected on the GOOD OOD-validation split.
  location: Appendix (standalone under the GOOD protocol)
  page: 39
  quote: the epoch is selected by OOD-validation loss within each run and the configuration (BatchNorm on/off, learning rate, hidden width, P) on the GOOD OOD-validation split
- id: c6
  statement: 'Limitation: all stochastic variation comes from one shared scalar Gaussian factor, so joint cross-node uncertainty is not modeled.'
  location: Conclusion and Limitations
  page: 10
  quote: All stochastic variation is due to one shared Gaussian factor, perfectly dependent across nodes, so the logit covariance across nodes has rank at most P.

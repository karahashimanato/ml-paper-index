  notes: 'Approved from candidate issue #2 (2026-10-02); carded by a subagent. Results tables not recorded; claims only. Ground truth: synthetic streams with known drift points; a true positive is the earliest
    unmatched raw alarm within a post-drift tolerance window, all other alarms are false positives. SCCM alarms are scored at the consolidated episode level, while ADWIN/KSWIN raw alarms are scored without
    cooldown consolidation in the primary analysis (an episode-level comparison is also given). SCCM''s own threshold multiplier is reported as z = 1.5 in the configuration tables; how that value was chosen
    was not found in the text. Learners: RLS, PA, LMS, OLR-WA (OLR-WA, ref. [40], is an earlier paper by the first author).'

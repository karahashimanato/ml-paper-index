  notes: 'Selected for the topic article requested by the user (2026-10-03): classical algorithms (sorting, binary search, greedy) and machine learning; carded by a subagent. Results tables not recorded;
    claims only. Extended abstract; PDF states: 33rd Conference on Neural Information Processing Systems (NeurIPS 2019), Vancouver, Canada (footer, p.1). Affiliations: TUM and MIT CSAIL; co-author Tim Kraska
    is an author of the original Learned Index (arxiv-1712.01208), so this benchmark is partly by the proposers of RMI. Baselines (Techniques): B-tree is the STX B+-tree v0.9, ART (radix tree), FAST (cache-optimized
    binary search tree, 32-bit keys only), binary search, interpolation search, TIP, RadixBinarySearch; all used as in-memory secondary indexes mapping keys to 64-bit TIDs. Framework overhead stated as
    8 instructions and 1 cache miss per lookup. Build times (Figure 2) are explicitly not optimized (e.g. ART without bulk loading, RMI not trained on samples). Performance counters (amzn, Xeon E5-2680
    v4): the authors conclude cache misses alone, instructions or branch mispredictions do not fully explain search time. Size overhead relative to the data array is reported per technique (Table 2).'

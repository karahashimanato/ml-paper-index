  notes: 'Selected for the topic article requested by the user (2026-10-10): causal effect estimation with machine learning (identification assumptions, meta-learners and double/debiased ML, causal trees
    and forests, Bayesian trees, representation-learning networks, overlap, model selection without ground truth, and benchmarking practice). Carded by a subagent. Results tables not recorded; claims only.
    Affiliations: University of Cambridge; van der Schaar also UCLA and The Alan Turing Institute. Venue: workshop paper, from the PDF page 1 footer (''Workshop on the Neglected Assumptions in Causal Inference
    (NACI) at the 38th International Conference on Machine Learning, 2021'') and the arXiv comment. Conflict of interest: the NN estimators are run with the authors'' own catenets implementations, and the
    theoretical argument and the TARNet-as-S/T-hybrid view come from the authors'' own earlier paper (reference [9] = arxiv-2101.10943). Funding: AC acknowledges funding from AstraZeneca. The tree-boundary-bias
    explanation for IHDP is introduced as speculation (''let us speculate'') and checked with a figure; figure-only results are not recorded. IHDP-100 is evaluated on the pre-determined 10% hold-out with
    5 seeds per run; the ACIC2016 case study uses settings 2, 26 and 7 (no, low, high heterogeneity) and only the first 10 of 100 runs (Section 3.2). Section 4 also suggests principled baselines that vary
    one dimension at a time and experimental knobs, and expects generative benchmarks to favor estimators similar to the generating methods. Hyperparameter effects are listed as future research. The authors
    acknowledge the study covers only two benchmarks. Critiques the benchmark designed in arxiv-1707.02641 (ACIC2016).'

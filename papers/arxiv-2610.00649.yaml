  notes: 'Approved from candidate issue #2 (2026-10-02); carded by a subagent. Results tables not recorded; claims only. Off-theme for drift detection: the paper studies classifier robustness under cross-corpus
    distribution shift (ASVspoof 2019, ASVspoof 5, ADD 2023, In-the-Wild), not detecting when a shift occurs. Task is binary audio deepfake classification on 4-dimensional embedding vectors; no audio/representation-classification
    tag exists, so tabular-classification is used as the closest. Family tags: kernel-methods for the QSVM and RBF SVM, plus the classical comparators (MLP, LR, RF, GB); k-NN has no family tag. The authors
    frame results as the inductive bias of a classically simulable 4-qubit kernel, not quantum advantage. Funding: NSF award stated in Acknowledgment.'

  notes: 'Selected for the topic article requested by the user (2026-10-03): classical algorithms (sorting, binary search, greedy) and machine learning; carded by a subagent. Results tables not recorded;
    claims only. Affiliation: all authors DeepMind (title page). PDF states: Proceedings of the 39th International Conference on Machine Learning (ICML 2022), PMLR 162. Full algorithm list (Section 3):
    Sorting (insertion, bubble, heapsort, quicksort); Searching (minimum, binary search, quickselect); D&C (maximum subarray, Kadane''s variant: one algorithm); Greedy (activity selection, task scheduling);
    DP (matrix chain multiplication, LCS, optimal BST); Graphs (DFS, BFS, topological sort, articulation points, bridges, Kosaraju SCC, Kruskal, Prim, Bellman-Ford, Dijkstra, DAG shortest paths, Floyd-Warshall);
    Strings (naive matching, KMP); Geometry (segment intersection, Graham scan, Jarvis'' march). Exclusions: NP-hard tasks and approximation algorithms, tasks needing numerical outputs, standalone data
    structures, algorithms needing dynamically allocated memory (merge sort, Hierholzer, finite-automaton string matching). Sorting is encoded as predicting predecessor pointers (no value swapping); insertion
    sort''s inner backward scan is compressed into one step. Metric: test micro-F1 averaged per algorithm class (Table 1), plus a win/tie/loss count across 30 algorithms (Appendix C: model A outperforms
    B on an algorithm if mean(A) - std(A) > mean(B)); validation curves averaged over three seeds. Training: batch 32, Adam lr 0.001, 10,000 steps, early stopping on in-distribution validation, one V100.
    Hyperparameters: ''We provide all implementations and hyperparameters within our codebase''; no per-model tuning procedure is described in the text. Authors cite Xu et al. (arxiv-1905.13211) on algorithmic
    alignment and Veličković et al. 2019 (arxiv-1910.10593) for the MPNN max aggregator. The first author is also first author of the cited works that introduced baseline components used here (Veličković
    et al., 2019 for the max-aggregator MPNN executor; Veličković et al., 2020 for PGN; he is also first author of the GAT paper used as a baseline processor); Hadsell and Blundell are co-authors of arxiv-1910.10593
    too (reference list). CLRS''s statement that better-aligned architectures ''can be proven to have better sample complexity'' (Xu et al.) should be read with the assumptions of that proof (arxiv-1905.13211
    c3: sequential training with auxiliary labels).'

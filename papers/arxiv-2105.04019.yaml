proposes:
- differentiable odd-even and bitonic sorting networks (min/max conditional swaps relaxed with logistic-sigmoid softmin/softmax) producing a relaxed permutation matrix
- activation replacement trick (ART) against vanishing gradients and blurring in deep relaxed sorting networks
claims:
- id: c1
  statement: 'Contribution and relation to classical sorting: classical sorting networks (fixed, data-oblivious compare-and-swap structures; odd-even and Batcher''s bitonic sorter) are made differentiable
    by relaxing their pairwise conditional swap operations.'
  location: Abstract
  page: 1
  quote: For that, we propose differentiable sorting networks by relaxing their pairwise conditional swap operations.
- id: c2
  statement: 'Why sorting networks are non-differentiable: they use min and max operators for the conditional swaps, which the paper relaxes with softmin/softmax.'
  location: Introduction
  page: 1
  quote: Sorting networks are conventionally non-differentiable as they use min and max operators for conditionally swapping elements.
- id: c3
  statement: 'Stated complexity: the differentiable odd-even network runs in O(n^3) and the differentiable bitonic network in O(n^2 (log n)^2), with the layer-wise permutation-matrix product computed as
    a sparse multiplication.'
  location: 5.5 Runtime and Memory Analysis
  page: 9
  quote: The asymptotic runtime of differentiable odd-even sort is in O(n3) and for bitonic sort the runtime is in O(n2(log n)2).
- id: c4
  statement: 'Runtime comparison with other relaxations: for large n the authors empirically confirm FastRank (Blondel et al.) is the fastest method, partly because it outputs only ranks/sorted values rather
    than differentiable permutation matrices, which they say are necessary for their cross-entropy objective.'
  location: 5.5 Runtime and Memory Analysis
  page: 9
  quote: For large n, we empirically conﬁrm that FastRank (Blondel et al., 2020) is the fastest method, i.a., because it produces only output ranks / sorted output values and not differentiable permutation
    matrices.
- id: c5
  statement: 'Evaluation protocol caveat: in the four-digit MNIST comparison, the NeuralSort and Optimal Transport rows are copied from Cuturi et al. rather than rerun (same CNN architecture; averaged over
    5 runs for the new rows).'
  location: 5.1 Sorting and Ranking Supervision (Table 1 caption)
  page: 6
  quote: The ﬁrst three rows are duplicated from Cuturi et al. (2019).
- id: c6
  statement: 'Evaluation protocol caveat: Blondel et al.''s Fast Sort & Rank was trained with a mean-squared-error loss on ranks, because it does not produce differentiable permutation matrices (the proposed
    method uses a cross-entropy loss on relaxed permutation matrices).'
  location: Appendix B.3 (Fast Sort & Rank)
  page: 12
  quote: To evaluate the fast sorting and ranking method by Blondel et al. (2020), we used the mean-squared-error loss between predicted and ground truth ranks as this method does not produce differentiable
    permutation matrices.
- id: c7
  statement: 'Main empirical claim (four-digit MNIST sorting benchmark of Grover et al. / Cuturi et al., n in {3, 5, 7, 9, 15}): the authors state the odd-even network outperforms current methods on all
    metrics and input set sizes; the NeuralSort and OT figures it is compared with are the rows copied from Cuturi et al.'
  location: 5.1.1 Results (Comparison to State-of-the-Art (MNIST))
  page: 7
  quote: Our approach outperforms current methods on all metrics and input set sizes.

  reviewed: false
  notes: 'Approved from candidate issue #2 (2026-10-02); carded by a subagent. Results tables not recorded; claims only. Off-theme for data-stream drift detection: ''concept drift'' here means the shift
    of an LLM''s hidden-state representation between memory and counterfactual queries, used to flag false memory. dataset-shift-detection is used as the closest task tag; in-context-learning because memory
    is given as in-context demonstrations; post-hoc because FAME reads hidden states of a fixed LLM without training. Main model Llama-3.2-3B-Instruct (layer 14, chosen from prior work and a layer sweep);
    generalization runs with Llama-3.1-8B, Mistral-7B and Qwen2.5-3B. Controlled settings use Rotten Tomatoes (spurious tag), a film-review-to-tweet shift, and a synthetic versioning convention. The readout
    direction is built from held-out queries that clearly induce the memory vs. counterfactual concepts (per template). How the threshold tau would be set in deployment was not found in the text; only AUROC
    is reported.'

proposes:
- Event-wise evaluation protocol
- PCA baseline with simple pre/post-processing
claims:
- id: c1
  statement: Most MVTS anomaly detection methods are evaluated with inappropriate or highly flawed protocols.
  location: Abstract
  page: 1
  quote: most proposed solutions are evaluated using either inappropriate or highly flawed protocols, with an apparent lack of scientific foundation.
- id: c2
  statement: Under the point-adjust protocol a random guess can systematically outperform all algorithms developed so far.
  location: Abstract
  page: 1
  quote: So flawed is one very popular protocol, the so-called point-adjust protocol, that a random guess can be shown to systematically outperform all algorithms developed so far.
- id: c3
  statement: A simple PCA baseline outperforms many recent deep learning approaches on popular benchmarks.
  location: Abstract
  page: 1
  quote: we propose a simple, yet challenging, baseline based on Principal Components Analysis (PCA) that surprisingly outperforms many recent Deep Learning (DL) based approaches on popular benchmark datasets.
- id: c4
  statement: Algorithms developed with point-adjust as the sole target fail to beat a random guess under other protocols (AnomalyTransformer, NCAD).
  location: Section 5
  page: 13
  quote: Algorithms that were developed using point-adjust as the sole target fail to reach any score better than a random guess when evaluated with other
- id: c5
  statement: Untrained versions of these models reached essentially the same high point-adjust scores.
  location: Section 5
  page: 14
  quote: we also achieved essentially the same high scores using untrained versions of these models.
- id: c6
  statement: GDN, developed with the point-wise protocol, was more resilient under other protocols.
  location: Section 5
  page: 14
  quote: GDN, however, which was developed based on the more realistic point-wise protocol, shows more resilience when evaluated with other protocols.
- id: c7
  statement: On datasets with very high contamination such as PSM, point-wise F1 can be misleading.
  location: Section 5
  page: 14
  quote: Datasets that have a very high contamination rate, such as PSM, yield point-wise F1 scores that can be misleading.
- id: c8
  statement: All Table 1 metrics use the threshold that gives the best point-wise F1.
  location: Table 1 caption
  page: 13
  quote: All metrics are computed based on the detection threshold that yields the best point-wise performance.
- id: c9
  statement: At its best point-adjust threshold, AnomalyTransformer raises an alarm about every 110 seconds on SWaT - barely useful in deployment.
  location: Section 5
  page: 15
  quote: On average, it raises an alarm every 110 seconds, making it, in our opinion, barely useful for deployment.
- id: c10
  statement: The PCA pipeline uses simple pre- and post-processing (scaling, clipping, score smoothing) that significantly improves its score.
  location: Section 5
  page: 14
  quote: we use simple pre-processing and post-processing blocks (input scaling, clipping and score smoothing) that significantly improve the score.
- id: c11
  statement: The point-wise protocol is not appropriate for all datasets and use cases; an event-wise protocol is proposed.
  location: Introduction
  page: 2
  quote: We also review the more objective point-wise protocol and show that it is not appropriate for all kinds of datasets and use-cases.
- id: c12
  statement: Many works were developed without a simple but sufficiently challenging baseline.
  location: Section 5
  page: 14
  quote: many works have been developed without establishing a simple but enough challenging baseline.
- id: c13
  statement: The authors urge more effort on data, experiment design and evaluation instead of increasingly complex algorithms.
  location: Abstract
  page: 1
  quote: instead of putting the highest weight on the design of increasingly more complex

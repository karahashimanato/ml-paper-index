  notes: 'Selected for the topic article requested by the user (2026-10-06): uncertainty estimation and calibration (Bayesian approximations and ensembles, calibration measurement and recalibration, conformal
    prediction). Carded by a subagent. Results tables not recorded; claims only. No venue recorded: the PDF text has no venue statement (searched for submitted, accepted, transactions on, under review,
    preprint in the front matter) and no journal_ref/comment was given. Author list from the PDF first page (IEEE membership grades omitted). Section numbers are the survey''s Roman numerals as listed in
    its introduction; subsection names are given in parentheses. Section IV notes evaluation is hard because quality depends on the estimation method, ground-truth uncertainties are lacking, and there is
    no unified metric across classification, regression and segmentation; regression intervals are evaluated with PICP and MPIW. Test-time augmentation: augmentations must stay within the target distribution,
    can turn correct predictions into incorrect ones (citing Shanmugam et al.), and the number/kind of augmentations needed is an open question. Conformal prediction is not covered in the survey (searched
    for conformal). The survey cites Gustafsson et al. for the ensemble-vs-Bayesian finding; it does not run its own comparison.'

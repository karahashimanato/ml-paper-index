id: arxiv-1810.11953
title: 'Failing Loudly: An Empirical Study of Methods for Detecting Dataset Shift'
authors:
- Stephan Rabanser
- Stephan Günnemann
- Zachary C. Lipton
year: 2019
venue: NeurIPS 2019
links:
  arxiv: https://arxiv.org/abs/1810.11953
  code: https://github.com/steverab/failing-loudly
source:
  version: arXiv v4
  retrieved_at: '2026-10-02'
  pdf_sha256: dc8144ef7e81e4b8761b37e3f662169a0d0f124223468268168844442d2c4470
tags:
  tasks:
  - dataset-shift-detection
  method_families:
  - two-sample-tests
  - dimensionality-reduction-for-shift
  paradigms:
  - supervised
proposes:
- Empirical comparison of dimensionality reduction + two-sample testing pipelines for shift detection
claims:
- id: c1
  statement: Across the explored shifts, two-sample testing on representations from a pre-trained label classifier (black-box shift detection) performed best.
  location: Abstract
  page: 1
  quote: a two-sample-testing-based approach, using pre-trained classifiers for dimensionality reduction, performs best.
- id: c2
  statement: BBSD works surprisingly well across many shifts even when its label-shift assumption does not hold.
  location: Introduction
  page: 2
  quote: We show (empirically) that BBSD works surprisingly well under a broad set of shifts, even when the label shift assumption is not met.
- id: c3
  statement: Aggregated univariate tests (KS + Bonferroni) performed comparably to multivariate kernel tests (MMD).
  location: Experiments (results)
  page: 6
  quote: despite the heavy correction, multiple univariate testing seem to offer comparable performance to multivariate testing
- id: c4
  statement: BBSDs (softmax outputs) was the best dimensionality reduction for univariate testing and overall; an untrained autoencoder (UAE) was best for multivariate testing.
  location: Experiments (results)
  page: 6
  quote: In the multivariate-testing case, UAE performed best.
- id: c5
  statement: The domain classifier performs badly with few samples (<=100) but catches up with more samples.
  location: Experiments (results)
  page: 6
  quote: The domain classifier, a popular shift detection approach, performs badly in the low-sample regime (≤100 samples), but catches up as more samples are obtained.
- id: c6
  statement: Multivariate testing without dimensionality reduction performs poorly.
  location: Experiments (results)
  page: 6
  quote: the multivariate test performs poorly in the no reduction case
- id: c7
  statement: Domain-discriminating classifiers help characterize shifts and judge whether they are harmful.
  location: Abstract
  page: 1
  quote: we demonstrate that domain-discriminating approaches tend to be helpful for characterizing shifts qualitatively and determining if they are harmful.
- id: c8
  statement: In practice, ML pipelines rarely inspect incoming data for distribution shift.
  location: Introduction
  page: 1
  quote: in practice, ML pipelines rarely inspect incoming data for signs of distribution shift.
- id: c9
  statement: Kernel two-sample tests scale badly with sample size and lose power in high dimensions.
  location: Introduction
  page: 2
  quote: they scale badly with dataset size and their statistical power is known to decay badly with high ambient dimension
- id: c10
  statement: Detection results are averaged over 5 random splits, at significance level 0.05.
  location: Experiments
  page: 6
  quote: shift detection performance is averaged over a total of 5 random splits
- id: c11
  statement: The original MNIST train/test split is not i.i.d. (a statistically significant but harmless shift in the digit 6).
  location: Experiments (results)
  page: 9
  quote: this result however still shows that the original MNIST split is not i.i.d.
- id: c12
  statement: The experiments mostly use standard image classification; other domains (NLP, graphs) and online data are left for future work.
  location: Conclusions
  page: 9
  quote: since we have mostly explored a standard image classification setting for our experiments
- id: c13
  statement: 'A detected shift is not necessarily harmful: on COIL-100 the detected shift did not hurt the classifier.'
  location: Experiments (results)
  page: 9
  quote: this shift does not harm the classifier's performance
- id: c14
  statement: Shift detection for online (streaming) data would need to handle correlation between adjacent time steps (future work).
  location: Conclusions
  page: 9
  quote: shift detection for online data, which would require us to account for and exploit the high degree of correlation between adjacent time steps

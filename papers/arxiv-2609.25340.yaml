proposes:
- Causal (SCM-based) taxonomy of concept drift
- 'CaDrift: SCM-based synthetic data stream generator with mechanism-level drift events'
claims:
- id: c1
  statement: The paper proposes a taxonomy that categorizes drift events by their causal origin within a structural causal model.
  location: Abstract
  page: 1
  quote: We propose a taxonomy that categorizes drift events by their causal origin, including changes in exogenous variables, endogenous mechanisms, confounders, and target-generating processes.
- id: c2
  statement: 'Main empirical claim: drifts with different causal origins induce distinct patterns of distribution shift and predictive behavior.'
  location: Abstract
  page: 1
  quote: Our experiments empirically characterize the distributional effects of each drift type and show that drifts with different causal origins induce distinct patterns of distribution shift and predictive
    behavior.
- id: c3
  statement: 'Ground-truth drift is synthetic: CaDrift streams are generated with drift events at known, regular positions (abrupt unless stated otherwise).'
  location: Experimental setup (Distributional impact analysis)
  page: 11
  quote: For this analysis, we generate streams of 20,000 samples with a drift event introduced every 2,000 samples.
- id: c4
  statement: 'Performance protocol: a Hoeffding Tree is evaluated test-then-train with immediate labels and with labels delayed by 100 samples, and is also coupled with DDM; DDM parameter settings were
    not found in the text.'
  location: Experimental setup (Performance evaluation)
  page: 12
  quote: we measure the predictive performance of the Hoeffding Tree (HT) classifier (Domingos & Hulten, 2000) under different drift scenarios in a test-then-train manner, considering a prompt label availability
    after the test, as well as when label availability is delayed by 100 samples
- id: c5
  statement: Under endogenous drift with nonlinear mappers, DDM does not seem to help the Hoeffding Tree; its triggers appear to lower immediate accuracy more than not using DDM.
  location: Results (impact of causal drift events)
  page: 12
  quote: DDM does not seem to provide any advantage over the HT – the triggers in concept drift actually seem to decrease the immediate accuracy more than if not using DDM.
- id: c6
  statement: 'Case study: CaDrift samples generated from a DAG inferred on ELEC2 are used to augment stream learners, including TabPFNv2.5 run with a sliding context window.'
  location: Case study (ELEC2 data augmentation)
  page: 22
  quote: In addition to the online learners, we also include TabPFNv2.5 (Grinsztajn et al., 2026), a transformer-based tabular classifier.

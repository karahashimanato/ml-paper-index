    both the policy initialization and the KL reference. Section 4 argues for defense in depth since RLHF ''does not solve the fundamental challenges of developing human-aligned AI''. Doubt: page 5 says
    fundamental problems ''could be fully addressed with RLHF'', which seems to contradict the Discussion (''cannot be fully solved by RLHF''); likely a missing ''not'', so it is not quoted.'

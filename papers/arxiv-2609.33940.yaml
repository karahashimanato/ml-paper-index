proposes:
- 'Jacobian-centroid (behavioral) signals for runtime monitoring of JEPA world models: failure prediction, encoder/predictor dissociation gate, saliency maps'
claims:
- id: c1
  statement: Centroids (sub-component Jacobian row-sums) identify behavioral properties of world models and complement activation-based signals.
  location: Abstract
  page: 1
  quote: Here, we show that centroids—sub-component Jacobian row-sums—effectively identify the behavioral properties of WMs, complementing traditional activation-based knowledge signals.
- id: c2
  statement: 'Main claim: centroid-based methods outperform baseline methods as distribution-shift detectors.'
  location: Abstract
  page: 1
  quote: Moreover, centroid-based methods outperform baseline methods as distribution-shift detectors.
- id: c3
  statement: 'Evaluation: the target is episode success/failure from environment feedback on Push-T and TwoRoom (LeWorldModel + CEM planner), scored by AUC; distribution shift is induced by a larger goal
    offset than in-distribution.'
  location: Centroid Signals for Failure Prediction (experimental setup)
  page: 4
  quote: We evaluate on Push-T and TwoRoom using the trained LeWorldModel with a CEM planner (300 samples, 30 steps, receding-horizon K = 2), and label each episode as a success or failure based on the
    environment’s feedback.
- id: c4
  statement: The pre-execution gate thresholds are calibrated from in-distribution data only, without labeled failures.
  location: Pre-Execution Gate and Adaptive Replanning
  page: 6
  quote: Both thresholds are calibrated from in-distribution data alone with no labeled failures, and yield zero in-distribution false positives on Push-T and a 1% false-alarm rate on TwoRoom.
- id: c5
  statement: Layer choice for the calibration signal is task-specific (layer 0 for Push-T, deepest layer for TwoRoom) and is reported relative to the oracle-best layer.
  location: Appendix (signal definitions)
  page: 9
  quote: Layer-0 suffices for Push-T (AUC within 0.02 of oracle in-distribution, within 0.01 out-of-distribution), whereas layer-5 (deepest) is consistently oracle-optimal across all seeds and regimes on
    TwoRoom.
- id: c6
  statement: 'Limitation: all results come from one world-model family on two tasks.'
  location: Conclusion
  page: 6
  quote: All results come from a single WM family (LeWorldModel) on two tasks.

  notes: 'Selected for the method article requested by the user (2026-10-10): graph neural networks (GCN, GraphSAGE, GAT, SGC, message passing, expressive power and the WL test, oversmoothing, oversquashing,
    heterophily, and evaluation pitfalls and benchmarks). Carded by a subagent. Results tables not recorded; claims only. Venue from the PDF first-page footer (''Proceedings of the 34th International Conference
    on Machine Learning, Sydney, Australia, PMLR 70, 2017''); arXiv comment only says ''14 pages''. Affiliations: Google Brain, Google, Google DeepMind. Section numbers from numbered headings in the PDF.
    Other findings stated in the text: training one model per target consistently outperformed joint training on all 13 targets (''In some cases the improvement was up to 40%''); a dense-graph message passing
    step costs O(n^2 d^2) and towers reduce it to O(n^2 d^2/k) with a reported 2x inference speedup for k = 8, n = 9, d = 200; the pair message function performed worse than the edge network (average error
    ratio 1.53 vs 3.98 when trained jointly). Conflict of interest: Riley is a co-author of the Kearnes et al. (2016) GC baseline, and Vinyals is first author of set2set (Vinyals et al., 2015) used in the
    readout. Results (Tables 2-4) are not recorded.'

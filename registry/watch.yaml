# 新着論文の候補検出の設定(scripts/find_candidates.py が読む)。
# AIは使わない。arXiv のキーワード検索と、既存カードを引用している新しい論文(Semantic Scholar)を候補にする。
# 候補は GitHub Issue に一覧され、チェックを付けたものだけをローカルでカード化する(Q8-D、Q9-C)。
lookback_days: 8            # arXiv の新着として扱う日数(週1回実行なので少し重ねる)
citation_lookback_days: 60  # 引用している論文として扱う公開日の範囲(Semantic Scholar の反映は遅れることがある)
max_per_query: 40           # arXiv の1検索あたりの最大取得件数
min_citations: 2            # 引用経由の候補は、既存カードをこの本数以上引用しているものだけ(1本だけの引用は応用論文が大半のため)
show_per_theme: 25          # Issue でテーマごとに展開表示する件数(残りは折りたたみ。どちらも次回以降は重複除外される)

themes:
  - name: 表データ(GBDT・深層学習・基盤モデル)
    tags: [tabular-classification, tabular-regression]
    arxiv_queries:
      - 'abs:"tabular data" AND (abs:"gradient boost" OR abs:"foundation model" OR abs:benchmark OR abs:"deep learning") AND (cat:cs.LG OR cat:stat.ML)'
  - name: ドリフト検出
    tags: [drift-detection, concept-drift-detection, dataset-shift-detection]
    arxiv_queries:
      - '(abs:"concept drift" OR abs:"dataset shift" OR abs:"distribution shift") AND abs:detect AND (cat:cs.LG OR cat:stat.ML)'
  - name: 時系列の異常検知
    tags: [time-series-anomaly-detection]
    arxiv_queries:
      - 'abs:"time series" AND abs:"anomaly detection" AND (abs:benchmark OR abs:evaluation OR abs:"point adjust" OR abs:baseline) AND (cat:cs.LG OR cat:stat.ML)'
  # 以下2テーマは投稿数が多いため、手法の新提案ではなく「評価・検証」の論文に絞った検索語にしている
  - name: モデルの解釈可能性
    tags: [model-explanation]
    arxiv_queries:
      - '(abs:explanation OR abs:interpretability OR abs:attribution OR abs:SHAP) AND (abs:faithfulness OR abs:"sanity check" OR abs:evaluation OR abs:benchmark OR abs:disagreement) AND (cat:cs.LG OR cat:stat.ML)'
  - name: 量子化による影響
    tags: [model-compression]
    arxiv_queries:
      - 'abs:quantization AND (abs:evaluation OR abs:degradation OR abs:empirical OR abs:benchmark OR abs:trustworthiness OR abs:fairness) AND (cat:cs.LG OR cat:cs.CL)'
  - name: 時系列基盤モデルと予測
    tags: [time-series-forecasting, time-series-foundation-model]
    arxiv_queries:
      - 'abs:"time series" AND abs:forecasting AND (abs:"foundation model" OR abs:"zero-shot" OR abs:benchmark OR abs:pretrained) AND (cat:cs.LG OR cat:stat.ML)'
  - name: 学習モデルと計算量
    tags: [scaling-laws, efficiency-evaluation]
    arxiv_queries:
      - '(abs:"scaling law" OR abs:"scaling laws" OR abs:"compute-optimal" OR abs:"test-time compute") AND (cat:cs.LG OR cat:cs.CL OR cat:stat.ML)'
  - name: 古典アルゴリズムと機械学習
    tags: [learned-indexes, learning-augmented-algorithms, algorithm-learning, differentiable-sorting]
    arxiv_queries:
      - '(abs:"learned index" OR abs:"learning-augmented" OR abs:"algorithms with predictions" OR abs:"differentiable sorting" OR abs:"algorithmic reasoning") AND (cat:cs.LG OR cat:cs.DS OR cat:cs.DB)'
  - name: アルゴリズム設計技法と機械学習
    tags: [combinatorial-optimization, divide-and-conquer, dynamic-programming, branch-and-bound, local-search]
    arxiv_queries:
      - '(abs:"combinatorial optimization" OR abs:"branch and bound" OR abs:"branch-and-bound" OR abs:"local search" OR abs:"dynamic programming") AND (abs:learning OR abs:neural) AND (cat:cs.LG OR cat:cs.AI OR cat:math.OC)'
  - name: 予測モデルのフォールバックとモデル選択
    tags: [model-selection, selective-prediction, mlops]
    arxiv_queries:
      - '(abs:"model selection" OR abs:"algorithm selection" OR abs:"learning to defer" OR abs:"selective prediction" OR abs:"selective classification" OR abs:"model routing" OR abs:"LLM routing" OR abs:"fallback" OR abs:"MLOps") AND (cat:cs.LG OR cat:cs.SE OR cat:stat.ML)'
  - name: オートエンコーダ
    tags: [autoencoders, variational-autoencoders, reconstruction-based-detectors]
    arxiv_queries:
      - '(abs:autoencoder OR abs:"auto-encoder" OR abs:"variational autoencoder" OR abs:"posterior collapse") AND (cat:cs.LG OR cat:stat.ML OR cat:cs.CV)'
  - name: 木モデル(勾配ブースティング木、ランダムフォレスト、決定木)
    tags: [gradient-boosted-trees, random-forests, decision-trees]
    arxiv_queries:
      - '(abs:"gradient boosting" OR abs:"random forest" OR abs:"decision tree" OR abs:XGBoost OR abs:LightGBM OR abs:CatBoost) AND (cat:cs.LG OR cat:stat.ML)'
  - name: 拡散モデル
    tags: [diffusion-models]
    arxiv_queries:
      - '(abs:"diffusion model" OR abs:"score-based generative" OR abs:"denoising diffusion" OR abs:"consistency model") AND (cat:cs.LG OR cat:stat.ML OR cat:cs.CV)'
  - name: 対照学習・自己教師あり表現学習
    tags: [joint-embedding, masked-image-modeling]
    arxiv_queries:
      - '(abs:"self-supervised" OR abs:"contrastive learning" OR abs:"masked image modeling" OR abs:"masked autoencoder") AND (abs:representation) AND (cat:cs.CV OR cat:cs.LG)'
  - name: 不確実性の推定と較正
    tags: [uncertainty-estimation, conformal-prediction, post-hoc-calibration, bayesian-deep-learning]
    arxiv_queries:
      - '(abs:"conformal prediction" OR abs:"calibration" OR abs:"uncertainty quantification" OR abs:"predictive uncertainty" OR abs:"deep ensembles") AND (cat:cs.LG OR cat:stat.ML)'
  - name: 異常検知(古典 vs 深層)
    tags: [anomaly-detection, classical-outlier-detectors]
    arxiv_queries:
      - '(abs:"anomaly detection" OR abs:"outlier detection" OR abs:"novelty detection") AND (abs:benchmark OR abs:tabular OR abs:"isolation forest" OR abs:industrial) AND (cat:cs.LG OR cat:stat.ML OR cat:cs.CV)'
  - name: ベイズ最適化とハイパーパラメータ最適化
    tags: [bayesian-optimization, multi-fidelity-optimization, hyperparameter-optimization, black-box-optimization]
    arxiv_queries:
      - '(abs:"bayesian optimization" OR abs:"hyperparameter optimization" OR abs:"hyperparameter tuning" OR abs:"multi-fidelity") AND (cat:cs.LG OR cat:stat.ML)'

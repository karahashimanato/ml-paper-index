proposes:
- 'ASHA (Asynchronous Successive Halving): promotes a configuration to the next rung whenever it is in the top 1/eta of its rung so far, and otherwise adds a new random configuration to the bottom rung,
  removing synchronization barriers; plus system design choices for running it in Determined AI''s production ML system'
claims:
- id: c1
  statement: 'Target regime: ASHA is designed for the ''large-scale regime'', in which orders of magnitude more configurations than available parallel workers must be evaluated within a small multiple of
    the wall-clock time needed to train a single model. The authors argue that adaptive configuration selection methods are inherently sequential and thus not suitable for this regime, where the number
    of posterior updates is limited.'
  location: Introduction
  page: 1
  quote: ASHA is designed for what we refer to as the ‘large-scale regime,’ where to ﬁnd a good hyperparameter setting, we must evaluate orders of magnitude more hyperparameter conﬁgurations than available
    parallel workers in a small multiple of the wall-clock time needed to train a single model.
- id: c2
  statement: 'Problems with synchronous SHA (distributing the surviving configurations of each rung, as done by Falkner et al. 2018): (1) every configuration in a rung must finish before the next rung starts,
    so it is sensitive to stragglers and dropped jobs, and (2) the estimate of the top 1/eta configurations does not improve as more brackets are run, since promotions are independent per bracket. Running
    independent SHA instances per worker is also unsuited, since returning a fully trained configuration takes (number of rungs) x time(R).'
  location: Section 3.1
  page: 4
  quote: (1) SHA’s synchronous nature is sensitive to stragglers and dropped jobs as every conﬁguration within a rung must complete before proceeding to the next rung
- id: c3
  statement: ASHA promotes configurations whenever possible instead of waiting for a rung to complete, and grows the bottom rung when no promotion is possible, so the number of configurations need not be
    specified in advance. Assuming training time linear in the resource and enough workers, it returns a fully trained configuration in at most 2 x time(R) (time(R) with checkpointed iterative training),
    and it reports the current best using intermediate losses.
  location: Asynchronous SHA (ASHA)
  page: 4
  quote: Intuitively, ASHA promotes conﬁgurations to the next rung whenever possible instead of waiting for a rung to complete before proceeding to the next rung.
- id: c4
  statement: 'Cost of asynchrony: ASHA incurs a small number of incorrect promotions (configurations not in the top 1/eta in hindsight). The authors argue intuitively that in the first rung with n configurations
    roughly sqrt(n) are mispromoted, by analogy to convergence of an empirical CDF, and that for later rungs, although configurations are no longer i.i.d., they expect this dependence to be weak.'
  location: Section 3.3
  page: 5
  quote: ASHA is able to remove the bottleneck associated with synchronous promotions by incurring a small number of incorrect promotions, i.e. conﬁgurations that were promoted early on but are not in the
    top 1/η of conﬁgurations in hindsight.
- id: c5
  statement: 'Sequential comparison protocol (two CIFAR-10 CNN benchmarks, 1 worker, 10 trials, decisions on the validation set and test error reported): SHA and BOHB use n = 256, eta = 4, s = 0, r = R/256
    with R = 30000 SGD iterations; BOHB is run with the same early-stopping rate as SHA and ASHA instead of looping through brackets as Hyperband does; PBT uses a population of 25 with authors'' choices
    for exploit/explore.'
  location: Section 4.1
  page: 5
  quote: In the following experiments, we run BOHB using the same early-stopping rate as SHA and ASHA instead of looping through brackets
- id: c6
  statement: 'Sequential results: on benchmark 1 Hyperband and all SHA variants outperformed PBT; on benchmark 2 SHA, ASHA, BOHB and PBT performed similarly and slightly outperformed Hyperband and asynchronous
    Hyperband, which the authors say corroborates that the most aggressive brackets performed best in Li et al. (2017). SHA and ASHA were competitive with BOHB despite BOHB''s adaptive sampling, and asynchrony
    did not consequentially affect performance.'
  location: Section 4.1
  page: 6
  quote: We observe that SHA and ASHA are competitive with BOHB, despite the adaptive sampling scheme used by BOHB.
- id: c7
  statement: 'Disagreement with the Fabolas paper: Klein et al. (2017a) reported Fabolas faster than Hyperband; using the same evaluation framework (incumbent test error computed offline) on four tasks,
    the authors find Hyperband competitive with or better than Fabolas with lower variance when the incumbent is recorded after each SHA rung (''by rung'') rather than after each bracket (''by bracket'',
    the accounting used by Klein et al.). They note Fabolas was designed for data points as the resource, so it is not directly applicable to the two iteration-based CNN tasks.'
  location: Appendix A.2
  page: 13
  quote: Interestingly, by leveraging these intermediate losses, we observe that Hyperband actually outperforms Fabolas.
- id: c8
  statement: 'Distributed comparison (25 workers, 150 minutes, 5 trials; synchronous SHA and BOHB with default settings and the same eta and early-stopping rate): ASHA found a good configuration 1.5x as
    fast as synchronous SHA and BOHB on benchmark 1 while BOHB found a slightly better final configuration; on benchmark 2, with high variance in training times, ASHA performed significantly better, and
    BOHB underperformed synchronous SHA, attributed to its bias towards more computationally expensive configurations.'
  location: Section 4.2
  page: 6
  quote: BOHB actually underperforms synchronous SHA on benchmark 2 due to its bias towards more computationally expensive conﬁgurations, reducing the number of conﬁgurations trained to completion within
    the given time frame.
- id: c9
  statement: 'Large-scale LSTM benchmark (500 workers, 5 trials): some configurations produced perplexities orders of magnitude larger than average; the authors state that model-based methods making assumptions
    on the data distribution, such as Vizier (default algorithm, without its early-stopping rule, which had a bug at the time), can degrade without adjusting this signal, and capping perplexity at 1000
    still significantly hampered Vizier.'
  location: Section 4.4
  page: 8
  quote: Model-based methods that make assumptions on the data distribution, such as Vizier, can degrade in performance without further care to adjust this signal.

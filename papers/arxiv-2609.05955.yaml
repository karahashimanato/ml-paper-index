proposes:
- 'LoGIC: budgeted labeled-context and unlabeled-halo construction for frozen tabular-FM graph ICL'
claims:
- id: c1
  statement: LoGIC retrieves labeled nodes by structural, feature and coverage channels, shares contexts within graph-local query clusters, adds an unlabeled halo for adapter backbones, and selects channel
    and budget without test labels.
  location: Abstract
  page: 1
  quote: We present LoGIC, which retrieves labeled nodes via structural, feature-based, and coverage channels, shares each context across the queries in a graph-local cluster, incorporates an unlabeled
    halo for adapter backbones, and chooses the channel and context budget without test labels.
- id: c2
  statement: Budgeted contexts keep locally runnable full-context performance, remain competitive with published large-dataset results, and markedly reduce peak memory.
  location: Abstract
  page: 1
  quote: budgeted contexts maintain locally runnable full-context performance, stay competitive with published large-dataset results, and markedly lower peak memory requirements compared with full-context
    and whole-graph inference.
- id: c3
  statement: Evaluation uses eight GraphLand node-level benchmarks (12k-168k nodes) with classification (AP) and regression (R2) targets.
  location: Experimental Setup
  page: 6
  quote: We conduct evaluations on eight GraphLand benchmarks [16] covering 12k–168k nodes, classification (AP) and regression (R2), and both assortative and disassortative targets.
- id: c4
  statement: The retrieval channel and budget k are chosen per dataset on held-out validation data from a coarse budget ladder.
  location: Channel and Budget Configuration
  page: 6
  quote: For the reported LoGIC configurations, we assess a coarse ×4 budget ladder using held-out validation data and preserve one (channel, k) pair for each dataset.
- id: c5
  statement: Per-dataset trained baselines (LightGBM-NFA and GNNs) are published numbers taken from the G2T-FM evaluation, not rerun.
  location: Predictive Performance on GraphLand
  page: 7
  quote: The first block lists individually trained LightGBM-NFA and GNN references from the G2T-FM evaluation.
- id: c6
  statement: The authors state that LoGIC is not a universal accuracy substitute for per-dataset training; it lags the strongest trained baselines on several datasets.
  location: Predictive Performance on GraphLand
  page: 7
  quote: The contribution consequently does not constitute a universal accuracy substitute for per-dataset training.

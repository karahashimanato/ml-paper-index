  notes: 'Selected for the method article requested by the user (2026-10-05): contrastive and self-supervised representation learning. Carded by a subagent. Results tables not recorded; claims only. Affiliations:
    Facebook AI Research, Stanford University. Venue from the PDF first page (''Proceedings of the 38th International Conference on Machine Learning, PMLR 139, 2021''). Conflict of interest: Xinlei Chen
    is a co-author of SimSiam (Chen & He, 2020), one of the two methods analysed; Yuandong Tian later co-authored the dimensional-collapse paper (arXiv 2110.09348) that cites this work. The analysis is
    a gradient flow in the limit of large batch sizes and small learning rates. Table 1 reports that plugging in the ''optimal'' linear predictor performs poorly, which the authors use against the always-optimal-predictor
    conjecture. Symmetric predictors without EMA fail unless the relative predictor learning rate is > 1 or weight decay is applied only to the predictor (Tables 3, 5; Figure 6). Results tables not recorded.'

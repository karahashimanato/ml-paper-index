  notes: 'Selected for the method article requested by the user (2026-10-10): alternatives and extensions to dense Transformers (sparse mixture-of-experts routing and load balancing, state space models
    from HiPPO/S4 to Mamba-2, linear and kernelized attention, RWKV, and benchmarks/analyses comparing them with Transformers). Carded by a subagent. Results tables not recorded; claims only. Affiliation:
    Google (author emails). Venue: the arXiv v1 PDF says ''Preprint. Under review.'' and the arXiv record has no comment/journal_ref, so no venue is recorded (arxiv-2202.09368 cites it as ICLR 2021; not
    confirmed here). Section numbers are from numbered headings in the PDF dump. Not made claims: random routing dispatches to the 2nd expert with probability proportional to its weight (Section 2.2, Algorithm
    1 uses 2*g2 > uniform); naive top-k gating is said, citing Shazeer et al. 2017, to cause load imbalance (Section 2.2); with fixed depth, going from 128 to 512 experts gave +3.3 average BLEU and 512
    to 2048 only +1.3 (''hints the emergence of diminishing returns'', Section 4.4); the dense deep T(96L) shows a growing advantage over the shallow MoE(128E, 12L) on low-resource languages, and the authors
    ''conjecture'' depth may increase transfer (Section 4.4); per-device memory stays roughly constant as experts increase (figure). BLEU numbers are in tables/figures and not recorded. Baselines are 100
    bilingual models and a GPipe dense model by the same group (Google). Conflict of interest: Shazeer co-authored the MoE layer this builds on (arxiv-1701.06538); GShard top-2 is later used as a baseline
    by overlapping Google authors (arxiv-2202.09368, Huang and Chen).'

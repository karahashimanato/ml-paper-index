  notes: 'Selected for the topic article requested by the user (2026-10-03): classical algorithms (sorting, binary search, greedy) and machine learning; carded by a subagent. Results tables not recorded;
    claims only. PDF states: NeurIPS 2019. Datasets: Tic Tac Toe, Car Evaluation, Monk1, Monk2, Monk3 (UCI), ProPublica recidivism (N = 7,215) and FICO. OSDT is warm-started with the objective value of
    CART''s solution, so the authors state its models can never be worse than CART''s even when stopped early (Experiments). OSDT runs single-threaded while BinOCT uses eight threads (Experiments). Hardware:
    personal laptop (i5-8259U, 16GB RAM); ablation on AWS m5a.4xlarge single-threaded. Ablation (Appendix I): lookahead and equivalent points bounds are by far the most significant. Scalability experiment
    (Figure 3) duplicates the ProPublica data set to increase sample size. Appendix L: 10-fold cross-validation; the authors write that higher training accuracy at the same sparsity tends to yield higher
    test accuracy in general, but not always. Comparison to BinOCT: BinOCT is restricted to complete binary trees of a given depth and the authors show it producing useless splits. Formulation: binary classification
    over binary features (x_n in {0,1}^M); the paper does not discuss continuous features (the follow-up GOSDT, arxiv-2006.08690, targets continuous variables via threshold binarization). Family tag greedy-methods
    not used because OSDT itself is not greedy; CART is the greedy baseline. Results (accuracy figures) not recorded.'

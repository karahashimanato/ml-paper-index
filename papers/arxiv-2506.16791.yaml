claims:
- id: c1
  statement: GBDTs remain strong on practical tabular data, but deep learning methods caught up under larger time budgets with ensembling.
  location: Abstract
  page: 1
  quote: While gradient-boosted trees are still strong contenders on practical tabular datasets, we observe that deep learning methods have caught up under larger time budgets with ensembling.
- id: c2
  statement: Tabular foundation models excel on smaller datasets.
  location: Abstract
  page: 1
  quote: At the same time, foundation models excel on smaller datasets.
- id: c3
  statement: Ensembles across models advance the state of the art.
  location: Abstract
  page: 1
  quote: Finally, we show that ensembles across models advance the state-of-the-art in tabular machine learning.
- id: c4
  statement: Some deep learning models are overrepresented in cross-model ensembles due to validation-set overfitting.
  location: Abstract
  page: 1
  quote: We observe that some deep learning models are overrepresented in cross-model ensembles due to validation set overfitting
- id: c5
  statement: 51 datasets were manually curated out of 1053 datasets used in tabular research.
  location: Section 1
  page: 2
  quote: We investigate 1053 datasets used in tabular data research and carefully, manually curate a set of 51 datasets out of these
- id: c6
  statement: 16 models were curated, including 3 tabular foundation models.
  location: Section 1
  page: 2
  quote: We curate 16 tabular machine learning models, including 3 tabular foundation models
- id: c7
  statement: TabArena-v0.1 covers IID classification and regression in the small-to-medium data regime (non-IID, tiny and large data are out of scope).
  location: Section 1
  page: 2
  quote: Tabular classification and regression for independent and identically distributed (IID) data, spanning the small to medium data regime.
- id: c8
  statement: 'Outer evaluation: 10x repeated 3-fold CV for datasets under 2,500 samples, otherwise 3 repeats.'
  location: Section 2.3
  page: 6
  quote: for datasets with less than 2 500 samples, we use 10 times repeated 3-fold outer cross-validation; (II) for all other datasets, we use 3 repeats.
- id: c9
  statement: Elo is computed from ROC AUC (binary), log-loss (multiclass) and RMSE (regression).
  location: Section 2.3
  page: 6
  quote: In our main results, Elo scores are computed using ROC AUC for binary classification, log-loss for multiclass classification, and RMSE for regression.
- id: c10
  statement: Elo is calibrated so that the default RandomForest is 1000; 95% CIs from 200 bootstrap rounds.
  location: Section 2.3
  page: 6
  quote: We calibrate 1000 Elo to the performance of our default random forest configuration across all figures
- id: c11
  statement: In the conventional tuning regime (single best configuration), CatBoost ranked first.
  location: Section 3.1
  page: 7
  quote: In line with previous work [33], CatBoost is ranked first in the conventional tuning regime (Figure 1).
- id: c12
  statement: After post-hoc ensembling of hyperparameter configurations, neural networks were the strongest single models on average.
  location: Section 3.1
  page: 7
  quote: after post-hoc ensembling, neural networks are the strongest single models on average in TabArena-v0.1.
- id: c13
  statement: On datasets within its constraints, TabPFNv2 outperformed related approaches by a large margin.
  location: Section 3.1
  page: 7
  quote: TabPFNv2 outperforms related approaches by a large margin, establishing tabular foundation models as the go-to solution for datasets within their constraints.
- id: c14
  statement: Using holdout instead of cross-validation for model selection greatly underestimates all models and favors models that already ensemble.
  location: Section 3.2
  page: 8
  quote: when using holdout validation instead of cross-validation for model selection, all models are greatly underestimated, and performance is biased in favor of models that already use ensembling.
- id: c15
  statement: Given their training cost GBDTs are strong; RealMLP only dominates them after considerable training time with 25+ ensembled configurations.
  location: Section 3.1
  page: 8
  quote: RealMLP only starts to dominate them after a considerable amount of training time with an ensemble of 25+ configurations.
- id: c16
  statement: 'Authors call GBDT vs. deep learning a false dichotomy: both families contribute to cross-model ensembles that outperform individual families.'
  location: Section 3.2
  page: 9
  quote: We argue that the battle between GBDTs and deep learning is a false dichotomy, as both model families contribute to ensembles that strongly outperform individual model families
- id: c17
  statement: Top leaderboard models are not necessarily those with the highest weights in the cross-model ensemble.
  location: Section 3.2
  page: 9
  quote: models with the highest performance on the leaderboard are not necessarily the ones with the highest weights
- id: c18
  statement: 'Limitation: a fixed set of 200 random hyperparameter configurations is used (no study of HPO variance or advanced HPO).'
  location: Section 5
  page: 10
  quote: We use a fixed set of 200 random hyperparameter configurations to enable the study of ensemble pipelines.
- id: c19
  statement: 'Limitation: no feature engineering beyond the given dataset state; it could change the ranking.'
  location: Section 5
  page: 10
  quote: we assess predictive performance without feature engineering on top of the existing dataset state.
- id: c20
  statement: TabPFNv2 is only run on datasets with up to 10,000 training samples, 500 features and 10 classes; TabICL on classification with up to 100,000 samples and 500 features.
  location: Section 2.1
  page: 3
  quote: This only affects TabPFNv2, which is restricted to datasets with up to 10, 000 training samples, 500 features, and 10 classes for classification tasks
- id: c21
  statement: The TabPFNv2-compatible subset has 33 datasets and the TabICL-compatible subset 36 classification datasets.
  location: Figure 4 caption
  page: 7
  quote: For TabPFNv2, we obtain 33 datasets (≤10K training samples, ≤500 features). For TabICL, we obtain 36 classification datasets (≤100K, ≤500).
- id: c22
  statement: 'Competing interest: one author co-authored RealMLP and TabICL.'
  location: Competing Interests
  page: 11
  quote: D.H. is one of the authors of RealMLP and one of the authors of TabICL.
- id: c23
  statement: 'Competing interest: two authors are among the authors of TabPFNv2 (one affiliated with Prior Labs).'
  location: Competing Interests
  page: 11
  quote: L.P. and F.H. are a subset of the authors of TabPFNv2.
- id: c24
  statement: 'Reference pipeline: AutoGluon 1.3, best_quality preset, 4 hours of training.'
  location: Section 2.3
  page: 6
  quote: We select the predictive machine learning system AutoGluon [19] (version 1.3, with the best_quality preset and 4 hours for training) as the first official TabArena reference pipeline.
results: []
relations:
- winner: CatBoost (tuned)
  loser: All other models (tuned, single best configuration)
  basis: Elo, tuning regime without post-hoc ensembling (Figure 1).
  benchmark: tabarena-v0-1
  location: Section 3.1
  page: 7
  quote: In line with previous work [33], CatBoost is ranked first in the conventional tuning regime (Figure 1).
- winner: CatBoost (tuned)
  loser: TabM, LightGBM, RealMLP (tuned, without post-hoc ensembling)
  basis: Elo; these three are the top-3 only after post-hoc ensembling (Figure 1).
  benchmark: tabarena-v0-1
  location: Section 3.1
  page: 7
  quote: the top three models in our leaderboard (TabM, LightGBM, RealMLP; see Figure 1) would all be worse than the actual fourth-best model (CatBoost) without post-hoc ensembling.
- winner: TabPFNv2 (tuned + ensembled)
  loser: AutoGluon 1.3 (4h)
  basis: Elo on the TabPFNv2-compatible subset (Figure 4 left).
  benchmark: tabarena-v0-1-tabpfnv2-subset
  location: Section 3.1
  page: 7
  quote: TabPFNv2 with tuning and post-hoc ensembling again outperforms AutoGluon
- winner: TabArena ensemble (all models, simulated)
  loser: All individual models and AutoGluon 1.3 (4h)
  basis: Elo (Figure 7 left).
  benchmark: tabarena-v0-1
  location: Section 3.2
  page: 9
  quote: a simulated ensembling pipeline using all models in TabArena outperforms all individual models and AutoGluon

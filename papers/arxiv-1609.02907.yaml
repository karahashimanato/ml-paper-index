  notes: 'Selected for the method article requested by the user (2026-10-10): graph neural networks (GCN, GraphSAGE, GAT, SGC, message passing, expressive power and the WL test, oversmoothing, oversquashing,
    heterophily, and evaluation pitfalls and benchmarks). Carded by a subagent. Results tables not recorded; claims only. Affiliations: University of Amsterdam (both), CIFAR (Welling). Venue from the PDF
    page header (''Published as a conference paper at ICLR 2017'') and the arXiv comment; year is the first arXiv version (2016). Section numbers are from numbered headings in the dump. Appendix A relates
    the GCN rule to the 1-dim Weisfeiler-Lehman algorithm: with c_ij = sqrt(d_i d_j) the hash function is replaced by a differentiable layer, which ''loosely speaking'' allows interpreting GCN as a differentiable,
    parameterized generalization of WL-1; an untrained 3-layer GCN with random weights is shown on Zachary''s karate club (figures only). Training is full-batch gradient descent on the whole dataset, ''a
    viable option as long as datasets fit in memory'' (Section 3.1); mini-batch SGD is left for future work. Baseline numbers other than ICA are taken from the Planetoid paper (Yang et al., 2016) rather
    than re-run (Section 6.1); GCN results are the mean of 100 runs with random weight initializations on the fixed splits, plus 10 random splits of the same size (GCN (rand. splits)). Training uses 20
    labels per class for the citation networks and one labeled example per class for NELL. Results tables and the depth/run-time figures are not recorded. No conflict of interest noted.'

proposes:
- 'Progressive distillation: repeatedly distill an N-step deterministic DDIM sampler of a teacher diffusion model into a student (initialized from the teacher) that needs N/2 steps, the student becoming
  the next teacher'
- Parameterizations stable at low SNR (predicting x, (x, epsilon) combined, or v = alpha*epsilon - sigma*x) and loss weightings ('truncated SNR', 'SNR+1') suited to distillation
claims:
- id: c1
  statement: 'Procedure: the student is initialized as a copy of the teacher; training is like standard diffusion training except that the denoising target is the value that makes one student DDIM step
    match two teacher DDIM steps (computed by running the teacher and inverting one DDIM step); after convergence the student becomes the new teacher and the number of steps is halved.'
  location: Progressive distillation
  page: 3
  quote: At every iteration of progressive distillation, we then initialize the student model with a copy of the teacher, using both the same parameters and same model deﬁnition.
- id: c2
  statement: 'Rationale: the distillation target is fully determined given the teacher and z_t, unlike the original data point, so the student can make sharp rather than blurry (averaged) predictions.'
  location: Progressive distillation
  page: 4
  quote: By making sharper predictions, the student model can make faster progress during sampling.
- id: c3
  statement: 'Parameterization requirement: the standard epsilon-prediction with SNR-weighted loss is not well suited for distillation, because as distillation progresses the model is evaluated at lower
    SNR, where the implied x-prediction amplifies small errors and, at zero SNR, the link between epsilon- and x-prediction breaks down.'
  location: Diffusion model parameterization and training loss
  page: 5
  quote: 'Although this standard speciﬁcation works well for training the original model, it is not well suited for distillation:'
- id: c4
  statement: 'Ablation protocol (undistilled CIFAR-10 models, Table 1): results are averages over 3 seeds of the best metrics obtained over 2 million training steps, with about +-0.1 noise; the epsilon
    output with truncated-SNR weighting diverged.'
  location: 'Experiments: model parameterization and training loss (Table 1 caption)'
  page: 6
  quote: All reported results are averages over 3 random seeds of the best metrics obtained over 2 million training steps; nevertheless we ﬁnd results are still ±0.1 due to the noise inherent in training
    our models.
- id: c5
  statement: 'Training cost: distillation starts from 8192 teacher steps on CIFAR-10 and 1024 on the larger datasets, with 50 thousand parameter updates per iteration (100 thousand for 2 and 1 steps); with
    these settings, distilling to 4 steps costs comparable to or less than training the original model.'
  location: 'Experiments: progressive distillation'
  page: 7
  quote: Using these settings, the computational cost of progressive distillation to 4 sampling steps is comparable or less than for training the original model.
- id: c6
  statement: 'Step-quality trade-off: progressive distillation gives near-optimal results down to 4 or 8 steps, quality degrades relatively faster at 2 or 1 steps, while undistilled DDIM and stochastic
    samplers degrade very sharply below 128 steps; the authors conclude it is attractive for budgets of 128 steps or fewer.'
  location: 'Experiments: progressive distillation'
  page: 7
  quote: At 2 or 1 sampling steps, the sample quality degrades relatively more quickly.
- id: c7
  statement: 'Baseline protocol (Figure 4): DDIM and the stochastic sampler use the same models that initialize distillation; the stochastic sampler''s variance interpolation coefficient is tuned separately
    for each number of steps and only the best result is reported; CIFAR-10 results average 4 seeds, other datasets a single run because of compute.'
  location: Figure 4 caption
  page: 8
  quote: 'We then tune this interpolation coefﬁcient separately for each number of sampling steps and report only the best result for that number of steps:'
- id: c8
  statement: Compared with Luhman & Luhman (2021), whose one-step distillation requires building a large dataset by running the original model at its full number of steps, progressive distillation never
    runs the original model at the full number of steps, so total distillation time grows logarithmically with the number of teacher steps.
  location: Related work on fast sampling
  page: 8
  quote: 'In contrast, our method never needs to run the original model at the full number of sampling steps:'
- id: c9
  statement: 'Limitation: the student has the same architecture and number of parameters as the teacher; smaller students are left to future work.'
  location: Discussion
  page: 9
  quote: 'In the current work we limited ourselves to setups where the student model has the same architecture and number of parameters as the teacher model:'

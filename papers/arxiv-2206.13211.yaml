  notes: 'Selected for the topic article requested by the user (2026-10-03): algorithm design techniques (divide and conquer, dynamic programming, branch and bound, local search) and machine learning; carded
    by a subagent. Results tables not recorded; claims only. Short comment arising from Schuetz et al., Nature Machine Intelligence (doi 10.1038/s42256-022-00468-6); the evaluated GNN paper is not carded
    here. The authors declare no competing interests. Affiliations: Sapienza University of Rome, INFN, CNR-NANOTEC. The GNN numbers are taken from the original paper''s figures (not re-run). The comment
    also quotes MCMC (simulated annealing, parallel tempering) and belief propagation with reinforcement approximation ratios from the authors'' earlier work (Ref. [13]) as doing better than DGA, and says
    the same conclusion holds for Max-Cut per a concurrent comment by Boettcher. It also mentions that in planted clique on dense graphs, a cited NN does not reach message passing or parallel tempering
    performance. In the Discussion the authors give as their opinion that, at present, NN-based optimizers (like Schuetz et al.''s) do not meet their requirements and cannot compete with simple standard
    algorithms on hard optimization problems; this is an opinion beyond their d = 3, 5 MIS experiment. The paradigm tag ''unsupervised'' refers to the evaluated GNN. Numeric results (approximation ratios,
    speedups) not recorded.'

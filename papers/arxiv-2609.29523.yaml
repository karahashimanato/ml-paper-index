claims:
- id: c1
  statement: The paper presents a training-free framework for auditing biological alignment in frozen pathology foundation models, using spatially paired histology and transcriptomics from HEST-1k (240
    samples, 3 organs).
  location: Abstract
  page: 1
  quote: We present a training-free framework for auditing biological alignment in frozen PFMs using spatially paired histology and transcriptomics from HEST-1k, evaluated on 240 samples spanning 3 organs.
- id: c2
  statement: TabPFN is used as a pretrained probe to measure how well molecular programs can be decoded from frozen embeddings without task-specific gradient updates.
  location: Abstract
  page: 1
  quote: TabPFN serves as a pretrained probe to measure how well these molecular programs can be decoded without task-specific gradient updates.
- id: c3
  statement: The protocol uses specimen-level grouping with five-fold specimen-level cross-validation and three fixed seeds, reporting mean per-target Pearson correlation.
  location: Method (leakage-safe protocol)
  page: 4
  quote: Five-fold specimen-level cross-validation with three fixed seeds; we report mean per-target Pearson correlation (PCC).
- id: c4
  statement: Baseline probes (mean, kNN, Ridge and a gradient-trained MLP with one fixed configuration) are run on identical folds and context. No hyperparameter search for the baselines was found in the
    text.
  location: Method (baselines)
  page: 4
  quote: Beyond TabPFN we run mean, kNN (cosine, distance-weighted), Ridge, and a gradient-trained MLP
- id: c5
  statement: With the UNI encoder fixed, the training-free probes outperform the gradient-trained MLP.
  location: Results (label efficiency)
  page: 5
  quote: The training-free probes outperform the gradient-trained MLP
- id: c6
  statement: 'Limitation: TabPFN is the primary probe family, and absolute PCC and especially label efficiency may remain probe-specific.'
  location: Limitations and Outlook
  page: 7
  quote: but absolute PCC and especially label efficiency can remain probe-specific.

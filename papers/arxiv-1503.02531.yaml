proposes:
- 'Distillation: train a small model on a transfer set to match the soft targets produced by a cumbersome model (an ensemble or a large regularized model) with a raised softmax temperature T, using the
  same T in the student during training and T = 1 afterwards; optionally combined with the hard-label cross-entropy, with the soft-target gradients multiplied by T^2'
- Ensembles of one generalist model plus many specialist models, each trained on a confusable subset of classes (found by clustering the covariance of the generalist's predictions) with a dustbin class
  for all other classes
claims:
- id: c1
  statement: 'Motivation for soft targets: the class probabilities of the cumbersome model can be used as soft targets for the small model (an arithmetic or geometric mean of the members'' distributions
    when it is an ensemble); when the soft targets have high entropy they carry much more information per training case and much less gradient variance than hard targets, so the small model can often be
    trained on much less data and with a much higher learning rate.'
  location: Section 1
  page: 2
  quote: When the soft targets have high entropy, they provide much more information per training case than hard targets and much less variance in the gradient between training cases,
- id: c2
  statement: 'Definition: the softmax with temperature is q_i = exp(z_i/T) / sum_j exp(z_j/T), with T normally 1 and higher T giving a softer distribution. In the simplest form of distillation the soft
    targets on the transfer set come from the cumbersome model at a high temperature, the same high temperature is used in the distilled model''s softmax during training, and the distilled model uses T
    = 1 after training.'
  location: Section 2
  page: 3
  quote: The same high temperature is used when training the distilled model, but after it has been trained it uses a temperature of 1.
- id: c3
  statement: 'Combined objective when labels are known: a weighted average of the cross-entropy with the soft targets (computed at the same high temperature in the distilled model) and the cross-entropy
    with the correct labels (same logits, temperature 1); the best results were generally obtained with a considerably lower weight on the hard-label term. Because the gradients from the soft targets scale
    as 1/T^2, they should be multiplied by T^2 when both targets are used, so that the relative contributions stay roughly unchanged when T is changed.'
  location: Section 2
  page: 3
  quote: This ensures that the relative contributions of the hard and soft targets remain roughly unchanged if the temperature used for distillation is changed while experimenting with meta-parameters.
- id: c4
  statement: 'Matching logits is a special case: if the temperature is high compared with the logits and the logits are zero-meaned separately per transfer case, distillation is equivalent to minimizing
    1/2 (z_i - v_i)^2 (the logit-matching approach of Caruana and collaborators). At lower temperatures distillation pays much less attention to logits much more negative than average, which may help because
    these logits are almost unconstrained (possibly noisy) but may also discard useful information; the authors call the balance an empirical question and report that intermediate temperatures work best
    when the distilled model is much too small, which they say strongly suggests ignoring large negative logits can be helpful.'
  location: Section 2.1
  page: 3
  quote: At lower temperatures, distillation pays much less attention to matching logits that are much more negative than the average.
- id: c5
  statement: 'Preliminary MNIST result stated in the text: a large net (two hidden layers of 1200 ReLU units, dropout, weight constraints, inputs jittered by up to two pixels) made 67 test errors; a smaller
    net (two hidden layers of 800 units, no regularization) made 146 errors, and the same smaller net regularized solely by matching the large net''s soft targets at temperature 20 made 74 errors. The authors
    read this as soft targets transferring knowledge about how to generalize learned from translated data, although the transfer set contains no translations.'
  location: Section 3
  page: 4
  quote: But if the smaller net was regularized solely by adding the additional task of matching the soft targets produced by the large net at a temperature of 20, it achieved 74 test errors.
- id: c6
  statement: 'Temperature sensitivity on MNIST: with 300 or more units in each of the distilled net''s two hidden layers, all temperatures above 8 gave fairly similar results, but with 30 units per layer,
    temperatures in the range 2.5 to 4 worked significantly better than higher or lower temperatures.'
  location: Section 3
  page: 4
  quote: But when this was radically reduced to 30 units per layer, temperatures in the range 2.5 to 4 worked signiﬁcantly better than higher or lower temperatures.
- id: c7
  statement: 'Speech recognition (an 85M-parameter DNN acoustic model trained on about 2000 hours of English, described as a slightly outdated version of the Android voice search model): an ensemble of
    10 models with the same architecture, differing only in random initialization, was distilled into a single model of the same size (temperatures tried: 1, 2, 5, 10; relative weight 0.5 on the hard-target
    cross-entropy). The authors state that more than 80% of the frame-accuracy improvement of the ensemble is transferred to the distilled model.'
  location: Section 4.1
  page: 5
  quote: Table 1 shows that, indeed, our distillation approach is able to extract more useful information from the training set than simply using the hard labels to train a single model.
- id: c8
  statement: 'Soft targets as regularizers: training the 85M-parameter speech model on only 3% of the data (about 20M examples) with hard targets led to severe overfitting (early stopping was needed; accuracy
    dropped sharply after reaching 44.5%), whereas the same model trained with soft targets (from a model trained on the full set) recovered almost all the information in the full training set (about 2%
    shy) and ''converged'' to 57% without early stopping.'
  location: Section 6
  page: 7
  quote: This shows that soft targets are a very effective way of communicating the regularities discovered by a model trained on all of the data to another model.
- id: c9
  statement: 'Stated limit: specialist models (61 specialists of 300 classes plus a dustbin class on the internal Google JFT dataset, initialized from the generalist) were shown to improve a single large
    net, but the authors have not yet shown that the knowledge in the specialists can be distilled back into the single large net; using soft targets to prevent specialist overfitting is described as an
    approach they are still exploring (Section 6.1).'
  location: Section 8
  page: 8
  quote: We have not yet shown that we can distill the knowledge in the specialists back into the single large net.
- id: c10
  statement: 'Gradient of distillation (Eq. 2-4): with distilled-model logits z_i, cumbersome-model logits v_i, soft-target probabilities p_i and transfer at temperature T, dC/dz_i = (1/T)(q_i - p_i); if
    T is high compared with the logits, exp(x/T) is approximated by 1 + x/T, and if the logits are zero-meaned per transfer case this simplifies to dC/dz_i ~ (1/(N T^2))(z_i - v_i), where N is the number
    of classes.'
  location: Section 2.1
  page: 3

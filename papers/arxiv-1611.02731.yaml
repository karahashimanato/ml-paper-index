proposes:
- 'Variational Lossy Autoencoder (VLAE): a VAE with an autoregressive-flow prior and a small-receptive-field autoregressive (PixelCNN) decoder, so that the latent code only carries information the decoder
  cannot model locally (a lossy code)'
claims:
- id: c1
  statement: 'Thesis: VAEs are often interpreted as regularized autoencoders, but they do not always autoencode; the paper explains why earlier sequence VAEs did not use the latent code unless the decoder
    was weakened.'
  location: VAEs do not autoencode in general
  page: 2
  quote: In this section, we discuss the often-neglected fact that VAEs do not always autoencode
- id: c2
  statement: 'Argument from bits-back coding: ignoring the latent code is not only an optimization problem; even with exact optimization, the code should be ignored at the optimum for most practical VAEs
    with intractable true posteriors and sufficiently powerful decoders.'
  location: Section 2.2
  page: 3
  quote: the latent code should still be ignored at optimum for most practical instances of VAE that have intractable true posterior distributions and sufﬁciently powerful decoders.
- id: c3
  statement: 'Information preference: information that the decoder can model locally without the latent code will be modelled by the decoder, and only the remainder is put into the code.'
  location: Section 2.2
  page: 4
  quote: information that can be modeled locally by decoding distribution p(x|z) without access to z will be encoded locally and only the remainder will be encoded in z.
- id: c4
  statement: 'Factorized decoders: because the required independence structure rarely exists in images, common VAEs with factorized decoders autoencode almost exactly.'
  location: Section 2.2
  page: 4
  quote: This kind of independence structure rarely exists in images so common VAEs that have factorized decoder autoencode almost exactly.
- id: c5
  statement: The information-preference argument is asymptotic (it holds only when the bound can be optimized well); the authors still use free bits and KL annealing to smooth optimization in their experiments.
  location: Lossy code via explicit information placement
  page: 5
  quote: We want to additionally emphasize the information preference property is an asymptotic view in a sense that it only holds when the variational lowerbound can be optimized well.
- id: c6
  statement: 'Limitation: the lossy code does not always capture the global information one cares about; on OMNIGLOT, decompressions sometimes did not preserve semantics, so the decoder constraint has to
    be designed for the statistics that matter in each task and dataset.'
  location: Lossy compression
  page: 7
  quote: However, we remark that the lossy code z doesn’t always capture the kind of global information that we care about and it’s dependent on the type of constraint we put on the decoder.
- id: c7
  statement: 'Evaluation protocol for density estimation: one VLAE architecture with hyperparameters chosen manually on statically binarized MNIST is applied to dynamically binarized MNIST, OMNIGLOT and
    Caltech-101 Silhouettes; marginal NLL is estimated with importance sampling (4096 samples). The authors note that per-dataset tuning gives better results and report a fine-tuned VLAE on OMNIGLOT separately.'
  location: Density estimation
  page: 8
  quote: We choose hyperparameters manually on statically binarized MNIST and use the same hyperparameters to evaluate on dynamically binarized MNIST, OMNIGLOT and Caltech-101 Silhouettes.

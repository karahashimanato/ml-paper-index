  notes: 'Selected for the topic article requested by the user (2026-10-03): classical algorithms (sorting, binary search, greedy) and machine learning; carded by a subagent. Results tables not recorded;
    claims only. PDF states: Proceedings of the 38th International Conference on Machine Learning, PMLR 139, 2021. Affiliations: University of Konstanz, University of Salzburg, University of Frankfurt,
    MIT-IBM Watson AI Lab (title page). Benchmarks: four-digit MNIST sorting supervision (following Grover et al. and Cuturi et al.) and SVHN multi-digit images; metrics exact match (EM), element-wise correct
    ranks (EW), and EM at n = 5 (EM5) because EM becomes unreliable as n grows. Training: Adam lr 10^-3.5, up to 10^6 steps, lambda = 0.25 fixed for all n (authors note higher accuracy is possible by optimizing
    lambda per n), steepness tied to the number of layers. Scalability: bitonic networks trained on up to n = 1024 (10^4 steps, steepness values {30,...,40}, lambda 0.4); the abstract claims stable training
    on input sets of up to 1024 elements, and the authors suggest prioritizing larger n over larger batch size. ART: without it, networks up to 21 layers (bitonic n <= 64) work with moderate steepness;
    for more layers ART becomes necessary (Section 4.1 text). Top-k (k = 1) on CIFAR-10/100 with ResNet18 and a vanilla CNN: Softmax CE and the differentiable top-k operator ''perform similar''. Related
    work notes that learned sorters (NTM, Vinyals et al. set2seq, Gumbel-Sinkhorn) ''learn to sort, while sorting networks and differentiable sorting functions sort provably correct''. Sorting networks
    background: bitonic O(log^2 n) layers; AKS O(log n) parallel time, but its constants are unknown and ''optimistic approximations'' put it faster than bitonic only for n >> 10^80 (Related work). Reviewer
    comparison (not stated in this paper): Grover et al.''s own Table 1 (arxiv-1903.08850) reports NeuralSort exact-match values higher than the copied rows, and at n = 15 higher than the odd-even network''s
    value here, so the ''outperforms on all metrics'' claim depends on the copied baseline numbers; setups may differ.'

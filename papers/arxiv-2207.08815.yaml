  quote: Tree-based models are superior for every random search budget, and the performance gap stays wide even after a large number of random search iterations.
- winner: Neural networks (MLP, Resnet, FT_Transformer, SAINT)
  loser: Tree-based models (RandomForest, GradientBoostingTrees, XGBoost)

proposes:
- 'GSM1k: 1205 human-written grade school math problems designed to mirror GSM8k in style and difficulty (matched on resolution steps and answer magnitude, checked by human distinguishability and solve
  rates), held out from public release to measure overfitting on GSM8k'
- Overfit measure as the accuracy gap between GSM8k and GSM1k, related to a memorization proxy (per-character log-likelihood of generating GSM8k test examples)
claims:
- id: c1
  statement: GSM1k was created solely by human annotators (prompted with 3 GSM8k examples to write novel problems of similar difficulty, basic arithmetic only, positive integer answers) without assistance
    from any LLM or synthetic data source, to mitigate data contamination worries.
  location: Section 3
  page: 4
  quote: No language models were used to construct this dataset.
- id: c2
  statement: The authors caution that despite extensive matching efforts, GSM1k results only approximate an ideal world in which GSM8k's test set had not been released, and recommend reading all results
    with the understanding that the two datasets are highly similar but not identically distributed.
  location: Section 3
  page: 4
  quote: We would recommend reading all results with the understanding that GSM8k and GSM1k are only highly similar, but not identically distributed despite all our efforts below.
- id: c3
  statement: 'Human solve rates: 14 annotators not involved in creation solved as many problems as possible in 15 minutes, averaging 4.07 ± 0.93 problems on GSM8k and 4.36 ± 1.11 on GSM1k (standard deviations);
    the authors say this suggests GSM1k is comparable in difficulty (perhaps slightly easier), so substantial accuracy decreases are likely not explained by difficulty differences.'
  location: Section 3 (Human Solve Rates)
  page: 5
  quote: This suggests that GSM1k is comparable in difficulty (and perhaps even slightly easier) than GSM8k.
- id: c4
  statement: 'Evaluation protocol: a fork of EleutherAI''s LM Evaluation Harness with default settings except maximum generated tokens raised from 256 to 1000; both datasets use the same 5-shot prompt drawn
    from the GSM8k train set; open models at temperature 0 (vLLM or HuggingFace); closed models through LiteLLM with default settings, queried between April 16 and July 10, 2024.'
  location: Section 4
  page: 6
  quote: All API model results were from queries between April 16 - July 10, 2024 and use the default settings.
- id: c5
  statement: Because benchmark performance depends strongly on prompt and evaluation setting, a standardized setting is used for all models, so reported GSM8k numbers may be below official ones; ablations
    with non-GSM8k few-shot examples, different answer phrasing, varying number and source of shots, and human answer extraction are reported in appendices, and the authors state the general overfitting
    trends hold across them although precise accuracies vary.
  location: Section 4
  page: 7
  quote: While the precise benchmark accuracies vary depending on the setup, we find that the general trends of overfitting hold consistently across our ablations.
- id: c6
  statement: 'Lesson 1 (in a section the authors describe as a more subjective interpretation of results): several families, including Phi and Mistral, show systematic tendencies to perform better on GSM8k
    than GSM1k for almost every release and scale, and Yi, Xwin, Gemma and CodeLlama show this to a lesser extent.'
  location: Analysis (Lesson 1)
  page: 7
  quote: Several families of models, including the Phi and Mistral families of models, show systematic tendencies to perform stronger on GSM8k compared to GSM1k for almost every release and scale of models.
- id: c7
  statement: 'Lesson 2: all frontier or close-to-frontier models appear to perform similarly on GSM8k and GSM1k; the authors posit either stronger generalization or more careful data handling, say it is
    impossible to know for certain without the training sets, and lean toward the generalization hypothesis because Mistral Large is the only Mistral model without signs of overfitting.'
  location: Analysis (Lesson 2)
  page: 8
  quote: Since the hypothesis that Mistral took unique care in ensuring that only their largest model was free from data contamination seems unlikely, we lean instead towards the hypothesis that sufficiently
    strong LLMs also learn elementary reasoning ability during training.
- id: c8
  statement: 'Memorization evidence (Lesson 4): using a model''s per-character log-likelihood of generating GSM8k test examples as a proxy for having seen them, the Spearman rank correlation with the GSM8k-GSM1k
    gap is 0.36 (p = 0.03; Pearson r2 = 0.26, Kendall''s tau 0.29), which the authors say suggests some of the overfitting is due to partial memorization of the test set.'
  location: Analysis (Lesson 4)
  page: 8
  quote: This result suggests that some of the reason for overfitting is due to partial memorization of the test set.
- id: c9
  statement: 'Contamination is likely not the full explanation: outliers (e.g. Math-Shepherd-Mistral-7B-RL highly overfit with low log-likelihood; Llemma models with high log-likelihood and minimal overfit)
    suggest overfitting may also arise indirectly, e.g. by collecting benchmark-like training data or selecting checkpoints on benchmark performance, and that small amounts of contamination do not necessarily
    lead to overfitting.'
  location: Analysis (Lesson 4)
  page: 9
  quote: 'Conversely, the reverse is also true: small amounts of data contamination do not necessarily lead to overfitting.'

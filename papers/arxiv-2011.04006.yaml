  notes: 'Selected for the method article requested by the user (2026-10-10): alternatives and extensions to dense Transformers (sparse mixture-of-experts routing and load balancing, state space models
    from HiPPO/S4 to Mamba-2, linear and kernelized attention, RWKV, and benchmarks/analyses comparing them with Transformers). Carded by a subagent. Results tables not recorded; claims only. Affiliations
    as printed in the v1 PDF: Google Research (all but Ruder) and Google DeepMind (Ruder). No venue recorded: the PDF header says ''Preprint'' and the arXiv record has no comment/journal_ref. Section numbers
    from numbered headings in the PDF dump (2.1 Desiderata, 2.2.x tasks, 2.3, 3.2, 3.3, 3.4, 5 Conclusion, Appendix A-C). Task design details (Section 2.2): byte-level retrieval deliberately forbids cross
    attention; the image task forbids extra modules such as a CNN stem and uses 8-bit grayscale intensities as discrete tokens. Appendix B.2: Sparse Transformer and Longformer are emulated with masks (CUDA
    kernels avoided on TPU) and therefore not benchmarked for speed; Reformer is implemented differently (vmap over batch and head). Appendix A.2.1: most models overfit the image task (large train-test
    gap); a CNN stem or 2D relative positions would help but are outside the setup. Hyperparameters differ per task (Appendix A.1). Conflict of interest: per the reference list, two evaluated models are
    the authors'' own (Synthesizer: Tay, Bahri, Metzler et al.; Sparse Sinkhorn attention: Tay, Bahri, Yang, Metzler et al.), and the survey cited for the area is by Tay, Dehghani, Bahri and Metzler (2020c).
    Results tables (Tables 1-3) not recorded.'

proposes:
- Single change-point (SCP) Bayesian models for a change in the mean (multivariate), the variance, or both, with a categorical prior on the location, conjugate jump priors, a MAP location estimate and alpha-level
  credible sets
- 'MICH (Multiple Independent CHange-point): stacks many SCP components and fits them by a deterministic backfitting algorithm equivalent to mean-field variational Bayes; detection rule |CS| <= log^(1+delta)
  T'
claims:
- id: c1
  statement: 'Motivation: the authors state that Bayesian CPD methods remain an order of magnitude slower than state-of-the-art approaches, tend to lack theoretical development, and return joint posteriors
    without a clear way to summarize them as credible sets; in practice most only return the marginal posterior probability that each index is a change-point.'
  location: Introduction
  page: 2
  quote: In practice, the majority of BCPD methods simply return the marginal posterior probability that any given index t is a change-point.
- id: c2
  statement: 'Uncertainty output: for a single change-point model the posterior of the location tau is categorical with closed-form weights (conditionally conjugate priors); the point estimate is the posterior
    mode (MAP), and an alpha-level credible set is the smallest index set with posterior mass at least 1 - alpha, computed by adding indices in decreasing posterior probability (a knapsack problem).'
  location: Section 2
  page: 5
  quote: This is an example of a knapsack problem (Santini and Malaguti, 2024), which we solve by adding indices to
- id: c3
  statement: 'Guarantees (single change-point only): for an independent sub-Gaussian sequence with one change in mean and/or variance, the MAP localization rate is minimax optimal up to a log T factor;
    for an alpha-mixing dependent sequence, up to a log^2 T factor; for d-dimensional mean changes with d >> log T and a dense mean signal, the location is recovered exactly.'
  location: Abstract
  page: 1
  quote: In the case of a single change in the mean and/or the variance of an independent sub-Gaussian sequence, we prove that our method attains a localization rate that is minimax optimal up to a log
    T factor.
- id: c4
  statement: 'Assumption on detectability (Assumption 1): minimum spacing of order at least log T and spacing times the scaled squared jump norm much larger than d log T; citing Wang et al. (2020), this
    is necessary for consistent localization when d = 1. In high dimensions it cannot be met for sparse jumps but is met for dense changes. Theorem 1 additionally requires a bounded location prior (max
    |log pi_t| <= C log T, satisfied by a uniform prior).'
  location: Section 2.4
  page: 7
  quote: making Assumption 1 a necessary condition for detection when only the mean of y1:T changes
- id: c5
  statement: 'Detection rule: because the MAP is defined even without a change and posterior weights are diffuse under the null, a criterion is needed; the earlier rule |CS| <= T/2 (Cappello and Padilla,
    2025) is described as somewhat ad hoc and liable to an inflated false positive rate. The proposed rule |CS| <= log^(1+delta) T gives a false negative rate converging to zero with high probability for
    independent data with fixed jumps (delta > 1 needed for dependent data), with fewer false positives than T/2.'
  location: Section 2.5
  page: 9
  quote: This rule is somewhat ad hoc and can lead to an inflated false positive rate in practice.
- id: c6
  statement: 'Approximation: Gibbs sampling over discrete, highly correlated change-point locations may mix poorly or fail to converge, so MICH is fitted by deterministic backfitting; under a mean-field
    factorization over components this is coordinate ascent on the ELBO and converges to a stationary point of the ELBO (a variational approximation, not the exact posterior). Because components are independent
    a priori, two components can sit on the same change (unlike product partition models); a merge step is proposed.'
  location: Section 3
  page: 12
  quote: Then Algorithm 1 is a coordinate ascent procedure that maximizes ELBO(q) on QMF, and q(n) converges to a stationary point of ELBO(q).
- id: c7
  statement: 'Number of components: MICH needs upper bounds L, K, J on the numbers of mean, variance and joint changes; it is robust to overstating them (extra components get diffuse posteriors that fail
    the detection rule), but some prior knowledge is still needed not to underestimate them. The conservative default ceil(T/log T) raises the cost to O(T^2/log T); the ELBO is proposed to select L, K,
    J automatically.'
  location: Section 3
  page: 12
  quote: Some prior knowledge is still required to ensure we do not underestimate the true number of components.
- id: c8
  statement: 'Simulation protocol: joint mean-variance changes adapted from Pein et al. (2017), 5,000 replicates per setting with T in {100, 500, 1000}, minimum spacing in {15, 30, 50} and J* in {2, 5,
    10}; MICH with non-informative priors (0.001), MICH-Auto (J by ELBO) and MICH-Ora (oracle J = J*), versus H-SMUCE, MOSUM, PELT, NOT and NSP. MICH is on par in estimating the number and locations of
    changes, but slightly lags PELT in average FNSLE, indicating it may miss some true changes even when J = J*.'
  location: Section 4
  page: 14
  quote: while MICH slightly lags behind PELT in terms of the average FNSLE
- id: c9
  statement: 'Uncertainty quantification result: both MICH variants achieve the nominal 90% coverage (coverage conditional on detection) in each setting with credible sets smaller than those of H-SMUCE,
    MOSUM and NSP by a factor of 10-50; however, MICH''s fitting time lags behind all other methods except NSP (a looser convergence tolerance brings it in line, per the appendix sensitivity analysis).'
  location: Section 4
  page: 15
  quote: Both MICH-Ora and MICH-Auto achieve the nominal coverage level of 90% in each setting, while at the same time returning credible sets that are smaller than those returned by H-SMUCE, MOSUM, and
    NSP by a factor of 10-50.

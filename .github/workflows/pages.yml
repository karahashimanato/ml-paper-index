name: pages

# 記事・論文ページ・索引を GitHub Pages に公開する(Q6-D の静的サイト化)。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run python scripts/build_site.py
      # MkDocs 2.0 は後方互換性がない(プラグイン・テーマが動かない)ため 2 未満に固定する
      - run: uvx --from "mkdocs<2" --with "mkdocs-material<10" mkdocs build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

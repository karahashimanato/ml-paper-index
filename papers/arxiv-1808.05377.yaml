proposes:
- 'A categorization of NAS methods along three dimensions: search space (chain-structured, multi-branch, cell-based, hierarchical), search strategy (random search, Bayesian optimization, evolution, RL,
  gradient-based) and performance estimation strategy (lower fidelities, learning curve extrapolation, weight inheritance/network morphisms, one-shot models/weight sharing)'
claims:
- id: c1
  statement: 'The survey categorizes NAS methods along three dimensions: search space, search strategy, and performance estimation strategy.'
  location: Abstract
  page: 1
  quote: 'categorize them according to three dimensions: search space, search strategy, and performance estimation strategy.'
- id: c2
  statement: 'Search space caveat: incorporating prior knowledge about architectures well suited to a task can reduce the search space and simplify the search, but it also introduces a human bias, which
    may prevent finding novel building blocks beyond current human knowledge.'
  location: Introduction
  page: 2
  quote: However, this also introduces a human bias, which may prevent ﬁnding novel archi-tectural building blocks that go beyond the current human knowledge.
- id: c3
  statement: Cell-based search spaces raise a new design choice, the macro-architecture (how many cells and how they are connected); the authors state that ideally macro- and micro-architecture should be
    optimized jointly, otherwise one may end up doing manual macro-architecture engineering after finding a good cell.
  location: Section 2
  page: 5
  quote: Ideally, both the macro-architecture and the micro-architecture (i.e., the structure of the cells) should be optimized jointly instead of solely optimizing the micro-architecture;
- id: c4
  statement: 'Compute cost: citing Zoph and Le (2017), whose RL-based search made NAS a mainstream topic, the survey notes it used 800 GPUs for three to four weeks, after which many methods were published
    to reduce computational cost and improve performance.'
  location: Section 3
  page: 6
  quote: While Zoph and Le (2017) used vast computational resources to achieve this result (800 GPUs for three to four weeks), after their work, a wide variety of methods have been published in quick succession
    to reduce the computational costs and achieve further improvements in performance.
- id: c5
  statement: 'Citing the case study of Real et al. (2019): RL and evolution performed equally well in final test accuracy (evolution with better anytime performance and smaller models), and both consistently
    beat random search, but with a rather small margin (approx. 4% vs. 3.5% CIFAR-10 test error after model augmentation, as reported in that study); citing Liu et al. (2018b), the difference to random
    search was even smaller.'
  location: Section 3
  page: 7
  quote: 'Both approaches consistently perform better than RS in their experiments, but with a rather small margin:'
- id: c6
  statement: Lower-fidelity performance estimates (fewer epochs, data subsets, lower resolution, fewer filters/cells) reduce cost but introduce bias, typically underestimating performance; this may not
    matter if only the ranking is used and stays stable, but citing Zela et al. (2018) the ranking can change dramatically when cheap and full evaluations differ too much, arguing for gradually increasing
    fidelities.
  location: Section 4
  page: 9
  quote: However, recent results indicate that this relative ranking can change dramatically when the diﬀerence between the cheap approximations and the “full” evaluation is too big (Zela et al., 2018),
    arguing for a gradual increase in ﬁdelities
- id: c7
  statement: One-shot models (weight sharing) typically incur a large bias, severely underestimating the performance of the best architectures; ranking would suffice if estimated performance correlates
    strongly with actual performance, but the authors state it is currently not clear whether this is the case (citing Bender et al., 2018; Sciuto et al., 2019).
  location: Section 4
  page: 10
  quote: However, it is currently not clear if this is actually the case (Bender et al., 2018; Sciuto et al., 2019).
- id: c8
  statement: 'Limitations of one-shot NAS: the supergraph restricts the search space to its subgraphs, keeping it in GPU memory restricts the size of supergraphs, and it is not well understood which biases
    weight sharing introduces when the architecture sampling distribution is optimized together with the one-shot model; an initial exploration bias might be self-reinforcing and might result in premature
    convergence or little correlation between one-shot and true performance.'
  location: Section 4
  page: 11
  quote: it is currently not well understood which biases they introduce into the search if the sampling distribution of architectures is optimized along with the one-shot model instead of ﬁxing it
- id: c9
  statement: 'Reproducibility and comparison: experiments differ in search space, compute budget, data augmentation, training procedures and regularization, and training ingredients (cosine annealing, Cutout,
    MixUp, Shake-Shake, ScheduledDropPath) substantially improve CIFAR-10 performance, so the authors find it conceivable that such ingredients have a larger impact on reported numbers than the architectures
    found by NAS; they consider common benchmarks crucial, naming NAS-Bench-101 (Ying et al., 2019) as a first step.'
  location: Section 5
  page: 13
  quote: It is therefore conceivable that improvements in these ingredients have a larger impact on reported performance numbers than the better architectures found by NAS.

claims:
- id: c1
  statement: Residual algebra keeps each representation's coordinate system and its own residual until an explicit aggregation step, instead of concatenating features.
  location: Abstract
  page: 1
  quote: We propose residual algebra, in which each representation retains its coordinate system and owns its unresolved residual until an explicit aggregation boundary.
- id: c2
  statement: Against matched-capacity and other structural controls on Chinese A-share stock returns, the gain is attributed to explicit residual ownership and composition rather than more features or trees.
  location: Abstract
  page: 1
  quote: The gain is thus attributable to explicit residual ownership and composition rather than additional features or trees.
- id: c3
  statement: Evaluation is annual point-in-time refitting on a single stock-return dataset, with a purge gap for label observability.
  location: Experimental setup
  page: 11
  quote: 'Deployment is annual point-in-time: models for year Y are fit on data observable before Y with a purge gap covering label observability [24].'
- id: c4
  statement: Architecture, signal selections and hyperparameters were frozen before the evaluation window, and registered contrasts are reported rather than post-hoc winners.
  location: Reproducibility statement
  page: 14
  quote: All architectural decisions, signal selections, and hyperparameters were frozen before the evaluation window; the paper reports the registered contrasts rather than post-hoc winners.
- id: c5
  statement: 'Limitation: evidence comes from one market and one asset class.'
  location: Conclusion
  page: 14
  quote: Evidence still comes from one market and one asset class; the fields are two-dimensional; the contraction statement is conditional; and the orthogonality statements concern controlled refitting
    paths rather than a general efficiency theorem.
- id: c6
  statement: The Rumination-B/H extensions do not contribute to the reported results and remain untested out of sample.
  location: Conclusion
  page: 14
  quote: Neither extension contributes to the reported empirical headline, and both remain to be tested out of sample.

proposes:
- 'Learned LNS for MIPs: Neural Diving for the initial assignment plus a Neural Neighborhood Selection (NNS) GCN policy that chooses which integer variables to unassign at each LNS step, trained by imitation
  of a local-branching expert; the resulting sub-MIP is solved with SCIP'
claims:
- id: c1
  statement: 'Contribution and relation to local search: a learned LNS for MIPs where a Neural Neighborhood Selection policy chooses the search neighbourhood (variables to unassign) at each step, and the
    neighbourhood itself is searched with a MIP solver (SCIP 7.0.1).'
  location: Abstract
  page: 1
  quote: Formulating the subsequent search steps as a Markov Decision Process, we train a Neural Neighborhood Selection policy to select a search neighborhood at each step, which is searched using a MIP
    solver to ﬁnd the next assignment.
- id: c2
  statement: 'Training (imitation, not RL): the imitation target is an expert that, under certain assumptions, is guaranteed to pick the neighbourhood containing the optimal next assignment (local branching
    within a Hamming ball); the expert is too slow for use at test time and is only used offline to generate data.'
  location: Introduction
  page: 2
  quote: We propose an imitation learning approach to train the neighborhood selection policy using as the imitation target an expert policy that, under certain assumptions, is guaranteed to select the
    neighborhood containing the optimal next assignment at a given LNS step.
- id: c3
  statement: 'Guarantees given up: the method is a primal heuristic (it seeks a good feasible assignment, not a proof of optimality or a lower bound), motivated by production applications.'
  location: Background
  page: 3
  quote: This work focuses on primal heuristics as production applications often only require ﬁnding a good feasible assignment quickly.
- id: c4
  statement: 'Baseline tuning: SCIP''s metaparameters (presolve, cuts, heuristics) are tuned per dataset by grid search to give the best validation average primal gap curves, to make it behave more like
    a primal heuristic; other baselines are random neighbourhood selection (with Neural Diving start) and Neural Diving alone. Gurobi is not used.'
  location: Baselines
  page: 6
  quote: for each dataset separately using grid search to achieve the best validation set average primal gap curves.
- id: c5
  statement: 'Compute is not matched across all methods: the learned heuristics and random-LNS baselines get the same parallel resources, but SCIP is run single-core only.'
  location: Baselines
  page: 6
  quote: SCIP is evaluated only in the single core setting, as the main focus of this work is to evaluate the beneﬁt of easily parallelizable primal heuristics.
- id: c6
  statement: 'Datasets and affiliation: five datasets (Neural Network Verification, Electric Grid Optimization, Production Packing, Production Planning, MIPLIB), each split 70/15/15 with a separate model
    per dataset; two come from the production systems of a large technology company, which the text does not name (author affiliations: DeepMind, Charm Therapeutics, Google Research).'
  location: Datasets
  page: 5
  quote: In particular, Production Packing and Planning datasets are obtained from a large technology company’s production systems.
- id: c7
  statement: 'Limitations: models are not trained end-to-end on the final metric (average primal gap), and the conditionally independent policy does not approximate the expert perfectly; the authors suggest
    RL/offline RL and autoregressive models as possible remedies.'
  location: Discussion
  page: 8
  quote: Our approach does not currently train models in an end-to-end fashion to directly optimize a ﬁnal performance metric such as the average primal gap.

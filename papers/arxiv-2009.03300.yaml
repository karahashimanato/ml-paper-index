proposes:
- 'MMLU: a 57-task multiple-choice test (humanities, social sciences, STEM, other; elementary to professional level) intended to measure knowledge acquired during pretraining by evaluating models only in
  zero-shot and few-shot (or transfer) settings'
- 'A fixed few-shot protocol: a subject-specific instruction line, up to 5 fixed dev-set demonstrations per subject, a prompt ending in ''Answer: '', and the prediction taken as the highest-probability
  token among A, B, C and D'
claims:
- id: c1
  statement: 'Construction: 57 tasks whose questions were manually collected by graduate and undergraduate students from freely available online sources, including practice questions for tests such as the
    GRE and the USMLE, questions designed for undergraduate courses and questions for readers of Oxford University Press books; some subjects are split by difficulty level (Elementary, High School, College,
    Professional).'
  location: Section 3
  page: 3
  quote: The questions in the dataset were manually collected by graduate and undergraduate students from freely available sources online.
- id: c2
  statement: 'Splits: 15908 questions in total, split into a few-shot development set (5 questions per subject), a validation set of 1540 questions that may be used for selecting hyperparameters, and a
    test set of 14079 questions; each subject has at least 100 test examples.'
  location: Section 3
  page: 3
  quote: We collected 15908 questions in total, which we split into a few-shot development set, a validation set, and a test set.
- id: c3
  statement: 'Human reference points: unspecialized Amazon Mechanical Turk workers obtain 34.5% accuracy; expert-level accuracy is estimated at approximately 89.8% by taking the 95th-percentile human test-taker
    accuracy for the source exams and making an educated guess when such information is unavailable (i.e. the expert level is partly an estimate, not a measured baseline).'
  location: Section 3
  page: 3
  quote: If we take the 95th percentile human test-taker accuracy for exams that build up our test, and if we make an educated guess when such information is unavailable, we then estimate that expert-level
    accuracy is approximately 89.8%.
- id: c4
  statement: 'Few-shot protocol for GPT-3: each prompt begins with ''The following are multiple choice questions (with answers) about [subject].''; zero-shot appends the question, few-shot adds up to 5
    demonstration examples with answers before the question; all prompts end with ''Answer: ''; the model''s probabilities for the tokens A, B, C and D are compared and the highest is the prediction; for
    consistent evaluation a dev set with 5 fixed few-shot examples per subject is created.'
  location: Section 4.1
  page: 6
  quote: The model then produces probabilities for the tokens “A,” “B,” “C,” and “D,” and we treat the highest probability option as the prediction.
- id: c5
  statement: 'Models and scoring differ by model type: GPT-3 is accessed via the OpenAI API in four variants (Ada, Babbage, Curie, Davinci, referred to as 2.7B, 6.7B, 13B and 175B); UnifiedQA (T5 backbone
    fine-tuned on other QA datasets) is evaluated without further tuning, with the prediction taken as the class with the highest token overlap with its text output; RoBERTa-base, ALBERT-xxlarge and GPT-2
    are fine-tuned on UnifiedQA training data and the MMLU dev+val set.'
  location: Section 4.1
  page: 5
  quote: UniﬁedQA uses the T5 (Raffel et al., 2019) text-to-text backbone and is ﬁne-tuned on previously proposed question answering datasets (Lai et al., 2017), where the prediction is the class with the
    highest token overlap with UniﬁedQA’s text output.
- id: c6
  statement: 'Calibration: the authors evaluate how well GPT-3''s average confidence estimates its actual accuracy per subject and find it uncalibrated: in the zero-shot setting confidence is only weakly
    related to accuracy, with the accuracy-confidence gap reaching up to 24% for some subjects (e.g. a zero-shot RMS calibration error of 19.4% for Elementary Mathematics); models are only somewhat more
    calibrated in the few-shot setting.'
  location: Section 4.2
  page: 7
  quote: In fact, its conﬁdence is only weakly related to its actual accuracy in the zero-shot setting, with the difference between its accuracy and conﬁdence reaching up to 24% for some subjects.
- id: c7
  statement: 'Contamination check: reasoning that memorized questions should have low entropy and high accuracy, the authors observe that accuracy and question entropy (average log probability of the question)
    are not positively correlated across tasks, which they say suggests the exact questions were not memorized; they note models did encounter related text via Wikipedia, that most questions came from PDFs
    or websites where questions and answers are on separate pages,.'
  location: Appendix B.2
  page: 14
  quote: This suggests that our exact questions were not memorized.
- id: c8
  statement: 'Format sensitivity: different question formatting choices often lead to similar GPT-3 accuracies, but UnifiedQA is more sensitive; removing the </s> token from UnifiedQA''s input format lowers
    accuracy by several percentage points.'
  location: Appendix A.3
  page: 12
  quote: While different question formatting choices often lead to similar GPT-3 accuracies, we ﬁnd that UniﬁedQA is more sensitive.

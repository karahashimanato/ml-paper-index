proposes:
- A latent-class framework for contrastive learning in which similar pairs are i.i.d. draws from the same latent class and downstream tasks consist of subsets of the same latent classes
- Generalization bounds relating the unsupervised contrastive loss to the average linear (mean-classifier) classification loss on downstream tasks
- 'CURL: a contrastive objective that uses blocks of similar points (averaging positive and negative blocks) instead of pairs'
claims:
- id: c1
  statement: 'Core assumption (latent classes): similar points x, x+ are i.i.d. draws from the same class distribution D_c for a class c drawn from rho, and negatives are drawn from the marginal; i.e. the
    pair is conditionally independent given the latent class. Classes may overlap and no functional form is assumed for D_c or rho.'
  location: Section 2 (Semantic Similarity)
  page: 2
  quote: To formalize similarity, we assume similar data points x, x+ are i.i.d. draws from the same class distribution Dc for some class c picked randomly according to measure ρ.
- id: c2
  statement: The guarantees depend on downstream tasks being made of the same latent classes, with the same class distributions, as the unlabeled data; downstream classes are assumed uniformly distributed
    in the main-paper theorems (general case in the appendix).
  location: Section 2 (Supervised Tasks)
  page: 2
  quote: A key subtlety in this formulation is that the classes in downstream tasks and their associated data distributions Dc are the same as in the unlabeled data.
- id: c3
  statement: 'Price of negative sampling (class collision): because the negative can come from the same class as the positive pair, the unsupervised loss is at least tau (the probability that two sampled
    classes coincide), and without further assumptions on f it can be far from tau, making the Theorem 4.1 bound useless; the authors then control this term with an intraclass-deviation quantity s(f) (Theorem
    4.5).'
  location: Section 4.2
  page: 5
  quote: In general, without any further assumptions on f, Lun(f) can be far from τ, rendering the bound in Theorem 4.1 useless.
- id: c4
  statement: 'Limitation: the ideal guarantee (competing with the best supervised representation in the class F) is shown not to hold, with two counterexamples attributed to the algorithm rather than the
    analysis; contrastive learning will not always work when the only guarantee is that F can make the supervised loss small.'
  location: Section 5.1
  page: 5
  quote: Hence, contrastive learning will not always work when the only guarantee we have is that F can make Lsup small.
- id: c5
  statement: 'A weaker, competitive bound (Corollary 5.1.1, for the mean classifier) holds under additional assumptions: representations that are concentrated within classes (sub-Gaussian in every direction)
    and a mean classifier with good (high-margin) performance.'
  location: Introduction
  page: 2
  quote: However, if the representations are well-concentrated and the mean classiﬁer (Deﬁnition 2.1) has good performance, we can show a weaker version of the ideal result (Corollary 5.1.1).
- id: c6
  statement: 'Contrary to the belief that more negatives always help, the analysis shows that larger k can hurt: with rho close to uniform and k = Omega(|C|), frequent class collisions can prevent learning
    the supervised-optimal representation (the coefficient of s(f) grows with k).'
  location: Section 6.2
  page: 7
  quote: However, we ﬁnd that such a phenomenon does not always hold for contrastive learning – larger k can hurt performance for the same inherent reasons highlighted in Section 5.1, as we illustrate next.
- id: c7
  statement: Controlled experiments (CIFAR-100 with VGG-16, Wiki-3029 with a GRU) simulate the assumed data model by sampling similar pairs/blocks from the same labelled class and negatives at random, and
    compare with supervised training of the same architecture; the main evaluation is average k-wise classification with the mean classifier, while full multiclass accuracy (TOP-R) is reported but not covered
    by the theory.
  location: Section 8.1
  page: 8
  quote: Contrastive learning was done using our objectives (5), and compared to performance of standard supervised training, with both using the same architecture for representation f.
- id: c8
  statement: 'Scope: the framework ignores efficient minimization of the losses and studies only the relations between their minimizers and the sample complexity needed to generalize; the authors call it
    a first cut.'
  location: Conclusion
  page: 9
  quote: The framework currently ignores issues of efﬁcient minimization of various loss functions, and instead studies the interrelationships of their minimizers as well as sample complexity requirements
    for training to generalize, while clarifying what generalization means in this setting.

proposes:
- 'InstructGPT: GPT-3 fine-tuned in three steps (supervised fine-tuning on labeler demonstrations, a reward model trained on labeler rankings of model outputs, and PPO against that reward model with a per-token
  KL penalty from the SFT model)'
- 'PPO-ptx: mixing pretraining log-likelihood gradients into the PPO updates to reduce performance regressions (''alignment tax'') on public NLP datasets'
claims:
- id: c1
  statement: 'Method (following Ziegler et al. 2019 and Stiennon et al. 2020): (1) collect labeler demonstrations and fine-tune GPT-3 with supervised learning (SFT); (2) collect labeler comparisons between
    model outputs and train a reward model (RM) to predict the preferred output; (3) fine-tune the SFT policy against the RM''s scalar output with PPO. Steps 2 and 3 can be iterated; in practice most comparison
    data came from the supervised policies, with some from PPO policies.'
  location: Section 3.1
  page: 6
  quote: Steps 2 and 3 can be iterated continuously; more comparison data is collected on the current best policy, which is used to train a new RM and then a new policy.
- id: c2
  statement: 'Data: prompts come mainly from the OpenAI API Playground (submitted to earlier InstructGPT models; customers were notified their data could be used for training) plus labeler-written prompts
    used to bootstrap. The SFT dataset has about 13k training prompts (API and labeler-written), the RM dataset 33k (API and labeler-written), and the PPO dataset 31k (API only, no human labels). Splits
    are made by user ID, and training prompts are filtered for PII.'
  location: Section 3.2
  page: 7
  quote: The SFT dataset contains about 13k training prompts (from the API and labeler-written), the RM dataset has 33k training prompts (from the API and labeler-written), and the PPO dataset has 31k training
    prompts (only from the API).
- id: c3
  statement: 'Labelers: a team of about 40 contractors hired on Upwork and through ScaleAI, selected by a screening test of sensitivity to the preferences of different demographic groups and of identifying
    potentially harmful outputs; a separate set of held-out labelers (same vendors, no screening test) produced no training data. Inter-annotator agreement was 72.6 ± 1.5% among training labelers and 77.3
    ± 1.3% among held-out labelers (for comparison, researcher-researcher agreement in Stiennon et al. 2020 was 73 ± 4%).'
  location: Section 3.4
  page: 8
  quote: training labelers agree with each-other 72.6 ± 1.5% of the time, while for held-out labelers this number is 77.3 ± 1.3%.
- id: c4
  statement: 'Reward model: starting from the SFT model with the unembedding layer removed, the RM maps a prompt and response to a scalar; only 6B RMs are used because 175B RM training could be unstable.
    Labelers rank K = 4 to 9 responses per prompt, and all K-choose-2 comparisons from one prompt are trained as a single batch element (shuffling them as independent data points made the RM overfit after
    one pass). The loss is the negative mean over pairs of log sigmoid(r(x, y_w) - r(x, y_l)), normalized by K choose 2; the RM is shifted by a bias so that labeler demonstrations have mean score 0 before
    RL.'
  location: Section 3.5
  page: 8
  quote: 'Speciﬁcally, the loss function for the reward model is:'
- id: c5
  statement: 'RL objective: PPO in a bandit environment (one prompt, one response, reward from the RM, episode ends), with a per-token KL penalty from the SFT model to mitigate over-optimization of the
    reward model and the value function initialized from the RM. PPO-ptx maximizes E[r(x, y) - beta log(pi_RL(y|x)/pi_SFT(y|x))] + gamma E_pretrain[log pi_RL(x)], where beta is the KL reward coefficient
    and gamma the pretraining loss coefficient; gamma = 0 for ''PPO'' models, and ''InstructGPT'' refers to the PPO-ptx models unless otherwise specified.'
  location: Section 3.5
  page: 9
  quote: In addition, we add a per-token KL penalty from the SFT model at each token to mitigate over-optimization of the reward model.
- id: c6
  statement: 'Evaluation design: the main metric is labelers'' preference rating against a baseline (the 175B SFT model, chosen because it is near the middle of the pack) on held-out prompts from customers
    not included in training, plus 1-7 Likert ratings and metadata. The authors note that because the training prompts are designed for InstructGPT models they likely disadvantage the GPT-3 baselines, so
    they also evaluate on prompts submitted to GPT-3 models; they also note labelers are not the users who wrote the prompts, so intent may be misjudged.'
  location: Section 3.6
  page: 10
  quote: However, given that our training prompts are designed to be used with InstructGPT models, it’s likely that they disadvantage the GPT-3 baselines.
- id: c7
  statement: 'Headline human-preference result stated in the text: on the authors'' test set, outputs of the 1.3B InstructGPT model are preferred to those of the 175B GPT-3, and 175B InstructGPT outputs
    are preferred to 175B GPT-3 outputs 85 ± 3% of the time and to few-shot 175B GPT-3 71 ± 4% of the time.'
  location: Introduction
  page: 3
  quote: Outputs from our 175B InstructGPT are preferred to 175B GPT-3 outputs 85 ± 3% of the time, and preferred 71 ± 4% of the time to few-shot 175B GPT-3.
- id: c8
  statement: 'Alignment tax: by default the PPO model''s performance on several public NLP datasets decreases. Adding pretraining updates (PPO-ptx) mitigates these regressions on all datasets (per Figure
    29) but still lags GPT-3 on DROP, SQuADv2 and translation. Mixing in pretraining updates worked better than simply increasing the KL coefficient, which led to significant decreases in validation reward
    and never fully recovered on DROP and SQuAD.'
  location: Section 4.2
  page: 15
  quote: The performance of the PPO-ptx model still lags behind GPT-3 on DROP, SQuADv2, and translation; more work is needed to study and further eliminate these performance regressions.
- id: c9
  statement: 'Who the model is aligned to: the authors state they aligned to a set of labelers'' preferences shaped by the instructions they were given, the paid-job context, and who gave them the instructions,
    rather than to ''human preferences'' or ''human values'' in general.'
  location: Section 5.2
  page: 18
  quote: In this work, we have aligned to a set of labelers’ preferences that were inﬂuenced, among others things, by the instructions they were given, the context in which they received them (as a paid
    job), and who they received them from.

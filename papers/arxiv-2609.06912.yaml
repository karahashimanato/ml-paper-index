claims:
- id: c1
  statement: The paper recovers or reconstructs the synthetic data generators of four TFMs and compares their generated tasks with datasets from two tabular benchmarks.
  location: Abstract
  page: 1
  quote: We recover or reconstruct the synthetic data generators of four TFMs and compare their generated tasks with datasets from two widely used tabular benchmarks.
- id: c2
  statement: Stronger synthetic-to-benchmark support is generally associated with better relative model performance.
  location: Abstract
  page: 1
  quote: Moreover, stronger synthetic-to-benchmark support is generally associated with better relative model performance.
- id: c3
  statement: TALENT contributes 200 classification and 100 regression datasets (January 15, 2025 archive, single official training split); TabArena contributes 38 classification and 13 regression datasets.
  location: Experimental settings
  page: 5
  quote: TALENT contributes 200 classification and 100 regression datasets from its January 15, 2025 archive, using the single official training split.
- id: c4
  statement: 'The two benchmark collections are not independent: 26 TabArena dataset names also appear in TALENT.'
  location: Experimental settings
  page: 5
  quote: 'The two benchmark collections are not independent: 26 TABARENA dataset names also appear in TALENT with the same prediction type.'
- id: c5
  statement: Predictive results come from released checkpoints; on TabArena they mix leaderboard results, an official processed artifact and a direct run, depending on the model.
  location: Appendix
  page: 12
  quote: on TABARENA, we use leaderboard results for TABICLV2 and TABSWIFT, the official processed artifact for MITRA, and a direct run for TABICLV1.
- id: c6
  statement: 'The analysis is descriptive, not causal: generator identity is confounded with architecture, optimization, ensembling and inference choices.'
  location: Method
  page: 5
  quote: 'This analysis is descriptive rather than causal: generator identity is confounded with model architecture, optimization, ensembling, inference, and other model-specific choices.'

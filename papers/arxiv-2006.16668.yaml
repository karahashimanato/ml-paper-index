proposes:
- 'MoE Transformer: every other Transformer feed-forward layer replaced by a position-wise MoE layer with group-level top-2 gating, expert capacity, local group dispatching, an auxiliary load-balancing
  loss and random routing of the second expert'
- 'GShard: lightweight sharding annotation APIs (replicate, split, shard) plus an XLA SPMD partitioner that compiles a single program for all devices'
claims:
- id: c1
  statement: 'Architecture: the Transformer is sparsely scaled by replacing every other feed-forward layer with a position-wise MoE layer (based on Shazeer et al. 2017) using a variant of top-2 gating,
    in both encoder and decoder; MoE layers are sharded across devices while other layers are replicated.'
  location: Section 2.1
  page: 4
  quote: We sparsely scale Transformer with conditional computation by replacing every other feed-forward layer with a Position-wise Mixture of Experts (MoE) layer [16] with a variant of top-2 gating in
    both the encoder and the decoder (Figure 3).
- id: c2
  statement: 'Expert capacity: the number of tokens processed by one expert is kept below a uniform threshold of O(N/E) (N tokens in the batch, E experts); a token whose selected experts are both over capacity
    is an overflowed token with an all-zero gate vector, and its representation is passed to the next layer through the residual connection.'
  location: Section 2.2
  page: 6
  quote: Such tokens have their representation xs passed on to the next layer via residual connections.
- id: c3
  statement: 'Auxiliary loss: L = l_nll + k * l_aux. The goal is to minimize the mean square of c_e/S (fraction of the group''s tokens routed to expert e), but because c_e comes from the non-differentiable
    top-2 operation, (c_e/S)^2 is replaced by m_e(c_e/S) with m_e the mean gate value per expert. Tokens are split into G groups that each get a fractional expert capacity 2N/(G E).'
  location: Section 2.2
  page: 6
  quote: But because ce is derived from top-2 operation and is not differentiable, we use the mean gates per expert me as a differentiable approximation and replace (ce/S)2 with me(ce/S), which can now
    be optimized with gradient descent.
- id: c4
  statement: 'Complexity analysis (assuming constant tokens per device, G and E = O(D), capacity C = O(1/D)): per-device softmax cost is O(D) but in practice dominated by other terms, so per-device FLOPs
    can be considered O(1); cross-device communication is non-constant and grows as O(sqrt(D)).'
  location: Section 3.1
  page: 8
  quote: As a result FLOPS/D could be considered O(1), satisfying sublinear scaling design requirements.
- id: c5
  statement: 'Training stability: models were trained with float32 weights and activations to ensure stability; additional MoE(2048E, 60L) runs with bfloat16 activations and 1 trillion weights hit several
    trainability issues with numerical stability, and their results were not included.'
  location: Section 4.3
  page: 16
  quote: Although trainable by careful and manual diagnostics, with deep 1 trillion model we encountered several trainability issues with numerical stability, hence did not include the results for the sake
    of reproducibility.
- id: c6
  statement: 'Cost comparison with dense scaling (multilingual MT, 100 languages to English, in-house web-mined data): the 600B MoE(2048E, 36L) used 2048 TPU cores for 4 days (22.4 TPU core-years, measured
    as cores times wall-clock time); with the same number of cores, the dense 96-layer T(96L) appears to take more than ten times as long (235 core-years) while trailing in quality.'
  location: Section 4.5
  page: 19
  quote: Given the same number of TPU cores used by (1), the dense scaling variant, T(96L), appears to be taking more than ten times to train (235 TPU core years), while trailing behind in terms of model
    quality compared to models trained with GShard.
- id: c7
  statement: 'Measured runtime scaling on TPU: compared with a roofline estimate (the authors call it very optimistic), the 128-expert model reaches > 70% of roofline; scaling to 16x larger (2048 experts)
    increases device time 1.7x and still reaches 48% of roofline. The AllToAll dispatch/combine communication grows about 3.75x and its share of MoE+Transformer time rises from 16% to 36%.'
  location: Section 5.2
  page: 21
  quote: The device time increases by 1.7x when we scale the model to 16x larger (2048 experts), and can still achieve 48% of the rooﬂine performance.
- id: c8
  statement: The authors conclude that their results empirically support that mere parameter counting does not always correlate with the effective capacity of models at scale, and that comparisons should
    account for the nature of the problem (here massively multi-task with heavy data imbalance) and control for capacity bottleneck vs positive transfer.
  location: Conclusion
  page: 25
  quote: Lastly, our experimental results empirically support that, mere parameter counting does not always correlate with the effective capacity of the models at scale [85, 86].

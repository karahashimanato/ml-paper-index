proposes:
- 'MT-bench: 80 hand-written two-turn questions in 8 categories (writing, roleplay, extraction, reasoning, math, coding, knowledge I (STEM), knowledge II (humanities/social science)), 10 per category'
- 'LLM-as-a-judge in three variants (pairwise comparison, single answer grading, reference-guided grading), with mitigations for its biases: swapping positions (declare a win only if preferred in both orders),
  few-shot judge, chain-of-thought judge and reference-guided judge'
- Agreement between judge types defined as the probability that randomly selected (non-identical) individuals of each type agree on a randomly selected question, reported with ties (S1, inconsistent-after-swap
  counted as tie) and without ties (S2)
claims:
- id: c1
  statement: 'Motivation: the base LLaMA models show competitive performance on conventional benchmarks, yet their answers to open-ended questions are often not preferred by humans; the authors take this
    misalignment of conventional benchmarks as the core problem of the paper, the need for a robust and scalable automated method to evaluate alignment with human preferences.'
  location: Introduction
  page: 2
  quote: 'This misalignment of conventional benchmarks underscores the core problem driving this paper: the need for a robust and scalable automated method to evaluate LLM alignment with human preferences.'
- id: c2
  statement: 'Conflict of interest stated in the text: one of the two models in the motivating example (and among the evaluated models throughout) is Vicuna-13B, which the authors describe as their own
    model fine-tuned from LLaMA-13B on high-quality conversations (training details in Appendix E).'
  location: Introduction
  page: 2
  quote: Vicuna-13B, our fine-tuned model from LLaMA-13B on high-quality conversations
- id: c3
  statement: Position bias (an LLM favoring certain positions over others) was measured by building two similar answers to each first-turn MT-bench question (calling GPT-3.5 twice with temperature 0.7)
    and judging them with Claude-v1, GPT-3.5 and GPT-4 under a default prompt and a 'rename' prompt; consistency is the percentage of cases with consistent results when the order is swapped. All judges
    exhibit strong position bias, most favor the first position, Claude-v1 also shows a name bias toward 'Assistant A', and only GPT-4 is consistent in more than 60% of cases. The authors note the test
    is challenging because the answers are very similar, and suspect (leaving deeper study to future work) that the bias could be rooted in the training data or the left-to-right architecture of causal
    transformers.
  location: Section 3.3
  page: 5
  quote: Only GPT-4 outputs consistent results in more than 60% of cases.
- id: c4
  statement: 'Additional position-bias analysis: with GPT-4 and the default prompt on three model pairs, position bias is more noticeable for models with close performance and can almost disappear when
    the two models'' performance differs a lot; across categories it is more noticeable on open questions such as writing and STEM/humanities knowledge, while on math and coding LLM judges are more confident
    even though their judgments can often be wrong. Different prompts (''score'', ''short'') have different effects on different judges.'
  location: Appendix D.1
  page: 25
  quote: the position bias is more noticeable for models with close performance and can almost disappear when the performance of the two models differs a lot.
- id: c5
  statement: 'Verbosity bias (favoring longer, verbose responses even if they are not as clear, high-quality or accurate) was tested with a ''repetitive list'' attack: 23 MT-bench answers containing a numbered
    list were made verbose by prepending a GPT-4 rephrasing of the list without new information, and the attack counts as successful if the judge prefers the new response. The authors conclude all LLMs
    may be prone to verbosity bias though GPT-4 defends significantly better than others; as a calibration, judges always return a tie for two identical answers.'
  location: Section 3.3
  page: 5
  quote: Table 3 shows the failure rate of LLM judges under this attack, demonstrating that all LLMs may be prone to verbosity bias though GPT-4 defends significantly better than others.
- id: c6
  statement: 'Self-enhancement bias (judges favoring their own answers) was examined statistically by comparing win rates under LLM judges with those under humans: GPT-4 favors itself with a 10% higher
    win rate and Claude-v1 with a 25% higher win rate, but judges also favor other models and GPT-3.5 does not favor itself. The authors state their study cannot determine whether the models exhibit a self-enhancement
    bias, and that a controlled study is hard because a response cannot easily be rephrased into another model''s style without changing quality.'
  location: Section 3.3
  page: 5
  quote: Due to limited data and small differences, our study cannot determine whether the models exhibit a self-enhancement bias.
- id: c7
  statement: 'Limited grading of math and reasoning: with a chain-of-thought judge prompt the LLM in many cases makes exactly the same mistake as the given answers, suggesting the judge may still be misled
    by the context. A reference-guided judge (the judge''s own independently generated answer shown as reference) reduced the failure rate on 10 math questions (LLaMA-13B vs. Vicuna-13B with positions swapped;
    failure = GPT-4 says an incorrect answer is correct) from 70% to 15% relative to the default prompt.'
  location: Section 3.4
  page: 6
  quote: In Table 4, we see a significant improvement in failure rate (from 70% to 15%) over the default prompt.
- id: c8
  statement: 'Mitigating position bias: the conservative approach used in the experiments calls the judge twice with swapped order and declares a win only when an answer is preferred in both orders (inconsistent
    results become a tie); a more aggressive alternative is random position assignment at scale. A few-shot judge raised GPT-4''s consistency from 65.0% to 77.5%, but the authors caution that high consistency
    may not imply high accuracy, that they are not sure whether few-shot examples introduce new biases, and that the longer prompts make API calls 4x more expensive; zero-shot is used by default.'
  location: Section 3.4
  page: 6
  quote: However, high consistency may not imply high accuracy and we are not sure whether the few-shot examples will introduce new biases.
- id: c9
  statement: 'On MT-bench, GPT-4 with both pairwise comparison and single answer grading shows very high agreement with human experts: without ties (setup S2), GPT-4 agrees with humans 85%, higher than
    the agreement among humans (81%), which the authors read as GPT-4''s judgments closely aligning with the majority of humans.'
  location: Section 4.2
  page: 7
  quote: The agreement under setup S2 (w/o tie) between GPT-4 and humans reaches 85%, which is even higher than the agreement among humans (81%).

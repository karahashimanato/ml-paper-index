proposes:
- 'Automatic differentiation variational inference (ADVI), implemented in Stan: transform constrained latent variables to real coordinate space, posit a mean-field or full-rank Gaussian there, compute ELBO
  gradients by Monte Carlo after elliptical standardization (reparameterization) with automatic differentiation, and optimize by stochastic gradient ascent with an adaptive step-size sequence'
claims:
- id: c1
  statement: 'Model class: differentiable probability models, i.e. continuous latent variables with a gradient of the log joint valid on the support of the prior; no conjugacy assumptions are made. Discrete
    latent variables must be marginalized out, which the authors note is not tractable for all models (e.g. Ising model, sigmoid belief networks, untruncated Dirichlet process mixtures).'
  location: Section 2.1
  page: 4
  quote: We make no assumptions about conjugacy, either full (Diaconis et al., 1979) or conditional (Hoffman et al., 2013).
- id: c2
  statement: 'Support assumption: minimizing KL(q||p) requires the support of q to lie within that of the posterior; ADVI further assumes the posterior support equals the prior support (holds when the likelihood
    does not constrain the prior), which the authors call benign.'
  location: Section 2.2
  page: 5
  quote: This is a benign assumption, which holds for most models considered in machine learning.
- id: c3
  statement: 'Variational families in the transformed space: a mean-field Gaussian (log standard deviations) or a full-rank Gaussian (Cholesky factor). The full-rank Gaussian captures posterior correlations
    and is more accurate but has a computational cost; the induced approximation in the original space is non-Gaussian, and its shape depends on the chosen transformation.'
  location: Section 2.4
  page: 7
  quote: This leads to a more accurate posterior approximation than the mean-ﬁeld Gaussian; however, it comes at a computational cost.
- id: c4
  statement: 'Known weakness shown on simulated models: on a correlated 2D Gaussian both variants recover the analytic posterior mean, but mean-field ADVI ignores off-diagonal covariance and minimizing
    KL(q||p) leads to systematic underestimation of marginal variances; on logistic regression (reference: Stan''s NUTS) mean-field underestimates marginal variances on most coefficients, and on a stochastic
    volatility model it struggles even with the posterior mean where full-rank matches sampling.'
  location: Section 3.1
  page: 12
  quote: ADVI minimizes the KL divergence from the approximation to the exact posterior; this leads to a systemic underestimation of marginal variances (Bishop, 2006).
- id: c5
  statement: 'Recommendation: scientists interested in posterior variances and covariances should use full-rank ADVI (though it can be prohibitively slow for large data); those interested in prediction
    should initially rely on mean-field ADVI, since in practice accurate posterior means dominate predictive accuracy.'
  location: Section 3.1
  page: 13
  quote: Scientists interested in posterior variances and covariances should use the full-rank approximation.
- id: c6
  statement: 'Gradient variance: both the ADVI (reparameterization) estimator and the BBVI score-function estimator are unbiased; BBVI is more general (no model gradient needed) but its gradients can suffer
    from high variance. In the authors'' simulations the ADVI gradient had lower variance and a single MC sample sufficed in practice.'
  location: Section 3.2
  page: 14
  quote: While BBVI is more general—it does not require the gradient of the model and thus applies to more settings—its gradients can suffer from high variance.
- id: c7
  statement: 'Sensitivity to the transformation T: on Gamma posteriors, T2 = log(exp(theta) - 1) gave lower KL than T1 = log; an optimal transformation (making the Gaussian approximation exact) exists in
    principle but estimating it requires the posterior CDF, which the authors say is as hard as the original problem. The Discussion lists this sensitivity as an avenue for research.'
  location: Section 3.3
  page: 16
  quote: this is just as hard as the original goal of estimating the posterior density
- id: c8
  statement: 'Evaluation protocol: mean-field ADVI is compared with HMC and NUTS (Stan''s default sampler) by held-out predictive likelihood as a function of time on hierarchical regression, matrix factorization,
    mixture and PPCA models. On the non-negative matrix factorization models HMC produced no useful samples within a one-hour budget and was omitted thereafter; on the GMM the authors attribute NUTS/HMC
    difficulties likely to label switching.'
  location: Section 4.2
  page: 18
  quote: In both cases, HMC does not produce any useful samples within a budget of one hour; we omit HMC from here on.

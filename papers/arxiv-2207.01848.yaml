  notes: Table 1 lists methods as columns; values were extracted mechanically row by row and mapped to methods by column position. The 'Mean time' row (mixed CPU/GPU) was not recorded. Baselines had a 60-minute
    budget per split; TabPFN is not tuned. Results are aggregates over 18 datasets x 5 splits; per-dataset results (Appendix) were not recorded. This is the 2023 TabPFN (v1); later TabPFN versions are different
    models.

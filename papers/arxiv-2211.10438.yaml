claims:
- id: c1
  statement: Proposes SmoothQuant, a training-free PTQ method for 8-bit weight and 8-bit activation (W8A8) quantization of LLMs.
  location: Abstract
  page: 1
  quote: We propose SmoothQuant, a training-free, accuracy-preserving, and general-purpose post-training quantization (PTQ) solution to enable 8-bit weight, 8-bit activation (W8A8) quantization for LLMs.
- id: c2
  statement: 'Mechanism: activation outliers are smoothed by offline migrating quantization difficulty from activations to weights via a mathematically equivalent transformation.'
  location: Abstract
  page: 1
  quote: SmoothQuant smooths the activation outliers by offline migrating the quantization difficulty from activations to weights with a mathematically equivalent transformation.
- id: c3
  statement: 'Motivation, stated with citations to prior work (Dettmers et al. 2022; Wei et al. 2022; Bondarenko et al. 2021) rather than as a new finding: LLMs are notoriously difficult to quantize due
    to outliers in the activations.'
  location: Review of Quantization Difficulty
  page: 3
  quote: LLMs are notoriously difficult to quantize due to the outliers in the activations (Dettmers et al., 2022; Wei et al., 2022; Bondarenko et al., 2021).
- id: c4
  statement: 'Calibration: smoothing factors and static quantization step sizes are calibrated once with 512 random sentences from the Pile and the same model is used for all downstream tasks.'
  location: Experimental setup (Activation smoothing)
  page: 5
  quote: To get the statistics of activations, we calibrate the smoothing factors and the static quantization step sizes once with 512 random sentences from the pre-training dataset Pile, and apply the
    same smoothed and quantized model for all downstream tasks.
- id: c5
  statement: 'Hyperparameter selection: the migration strength alpha is chosen by a quick grid search on a subset of the Pile validation set (the paper reports alpha = 0.5 for OPT/BLOOM and 0.75 for GLM-130B).'
  location: Experimental setup (Activation smoothing)
  page: 5
  quote: We get a suitable α by running a quick grid search on a subset of the Pile (Gao et al., 2020) validation set.
- id: c6
  statement: 'Metrics for the OPT-175B comparison (Table 3): average accuracy over 7 zero-shot benchmarks plus 1 language-modeling benchmark (perplexity).'
  location: Results (Table 3 caption)
  page: 6
  quote: We extensively benchmark the performance on 7 zero-shot benchmarks (by reporting the average accuracy) and 1 language modeling benchmark (perplexity).
- id: c7
  statement: The authors state that they focus on the relative performance change before and after quantization, not on absolute values.
  location: Experimental setup (Models and datasets)
  page: 5
  quote: Note that we focus on the relative performance change before and after quantization but not the absolute value.

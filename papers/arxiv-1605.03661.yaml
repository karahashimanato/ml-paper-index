proposes:
- 'Balancing counterfactual regression: learn a representation Phi(x) that trades off factual prediction error, a nearest-neighbour counterfactual fitting term and a discrepancy distance (imbalance) between
  the treated and control distributions over Phi, then fit a ridge regression on [Phi(x), t]'
- 'Two instantiations: Balancing Linear Regression (BLR, a sparse simplex-constrained feature re-weighting) and Balancing Neural Network (BNN, a feed-forward net whose first d_r layers form Phi and whose
  later layers take t as an extra input)'
- The News semi-synthetic benchmark (NY Times word counts, simulated device assignment and reader opinion)
claims:
- id: c1
  statement: 'Framing: the factual distribution P(x)P(t|x) and the counterfactual distribution P(x)P(not t|x) differ only in the treatment assignment mechanism; in observational studies this mechanism generally
    depends on x, so predicting counterfactual outcomes requires inference on a distribution different from the training one, which the authors cast as covariate shift, a special case of domain adaptation.'
  location: Section 2
  page: 3
  quote: The difference between the observed (factual) sample and the sample we must perform inference on lies precisely in the treatment assignment mechanism, P(t|x).
- id: c2
  statement: 'Estimands: the individualized treatment effect ITE(x) = Y1(x) - Y0(x) for binary treatment and the average treatment effect ATE = E_x[ITE(x)] (Rubin-Neyman potential outcomes); because only
    one potential outcome is observed per context, the ITE cannot be known directly.'
  location: Section 2
  page: 2
  quote: 'The fundamental problem of causal inference is that only one potential outcome is observed for a given context x:'
- id: c3
  statement: 'Objective: B(Phi, h) = mean factual absolute error + alpha * disc_H(empirical factual, empirical counterfactual distributions over Phi) + gamma * mean error between the counterfactual prediction
    and the factual outcome of the nearest neighbour (computed once in input space) in the opposite treatment group; after learning Phi, a final hypothesis is fit by regularized squared loss on the factual
    data (Algorithm 1).'
  location: Section 3
  page: 3
  quote: where α, γ > 0 are hyperparameters to control the strength of the imbalance penalties, and disc is the discrepancy measure deﬁned in 4.1.
- id: c4
  statement: Theorem 1 (based on Cortes & Mohri, 2014) assumes a metric input space, Lipschitz potential outcome functions and linear hypotheses (ridge regression) over a fixed representation; its representation-independent
    term (average cross-group nearest-neighbour distance scaled by the Lipschitz constants) is small when the outcome functions are smooth and treated and control overlap. The authors note (citing Rosenbaum,
    2009) that with little overlap causal inference is generally harder.
  location: Section 4
  page: 5
  quote: It is well-known that when there is not much overlap between treated and control, causal inference in general is more difﬁcult since the extrapolation from treated to control and vice-versa is
    more extreme (Rosenbaum, 2009).
- id: c5
  statement: 'Limits of the bound: it bounds the relative error of a ridge regression fit on factual outcomes and evaluated on the counterfactual versus one fit on the unobserved counterfactuals, for any
    fixed Phi, without accounting for how Phi is obtained; one term involves the unknown counterfactual outcomes and can only be upper-bounded by fitting and nearest-neighbour terms.'
  location: Section 4
  page: 5
  quote: In general however, we cannot directly control its magnitude.
- id: c6
  statement: For linear hypotheses the discrepancy has a closed form that depends on v = p*mu1(Phi) - (1-p)*mu0(Phi), the size-weighted difference between treated and control means in representation space,
    so minimizing it amounts to matching means in feature space.
  location: Section 4.1
  page: 6
  quote: As a consequence, minimizing the discrepancy with linear hypotheses constitutes matching means in feature space.
- id: c7
  statement: 'Limitation: with variable re-weighting or a neural net with a single linear outcome layer, the hypothesis is linear in [Phi, t] with no interactions between Phi(x) and t, so these models cannot
    capture heterogeneity of the individual effect; adding interactions (feature expansion or non-linear layers after the concatenation) removes the closed form of the discrepancy.'
  location: Section 3.3
  page: 4
  quote: A less desirable consequence is that such models cannot capture difference in the individual treatment
- id: c8
  statement: 'Model selection: standard hyperparameter selection such as cross-validation is unavailable on real data because counterfactual outcomes are never observed; since all outcomes in the experiments
    are simulated, the authors generate repeated experiments with different outcome functions and choose hyperparameters once for all models (and baselines) on a held-out set of experiments, which they
    say is not possible for real-world data.'
  location: Section 6
  page: 6
  quote: While not possible for real-world data, this approach gives an indication of the robustness of the parameters.
- id: c9
  statement: The BART baseline (BayesTree R package) was run with default parameters without tuning, following Hill (2011); in the results section the authors write that BART's performance on News is likely
    hurt by the dataset's dimensionality and could improve with hyperparameter tuning.
  location: Section 6
  page: 7
  quote: Like (Hill, 2011), we do not attempt to tune the parameters, but use the default.

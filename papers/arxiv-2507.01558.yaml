  notes: 'Selected for the topic article requested by the user (2026-10-07): Bayesian change point detection (online BOCPD and its extensions, offline Bayesian changepoint analysis, evaluation and applications).
    Carded by a subagent. Results tables not recorded; claims only. Affiliations: UCLA Statistics & Data Science; Universitat Pompeu Fabra / Barcelona School of Economics. No venue: the PDF states none
    and there is no arXiv comment. Main text (pp. 1-19) read; appendices only for competitor software settings (Appendix D.2: H-SMUCE and PELT with package defaults, MOSUM alpha = 0.1, NSP with M = 1,000).
    Section numbers 2-6, 2.4 and 2.5 are confirmed by the outline and cross-references. Conflict of interest / own prior work: the var-scp component and the T/2 detection rule come from Cappello and Padilla
    (2025, PRISCA) and the ion-channel subsequence was previously analyzed by Cappello et al. (2021), both by co-authors; MICH reduces to PRISCA or to a CPD version of SuSiE (Wang et al., 2020) as special
    cases. Remark 8: each outer loop of Algorithm 1 is O(NT); the number of iterations is indeterminate. The authors state MICH ''requires virtually no hyperparameter tuning'' outside L, K, J (defaults
    0.001; sensitivity analysis in Appendix D.7.1, ''so long as these values are not too large''). Model asymmetry (activation via 1{t >= tau}) can inflate posterior mass near T; MICH is also fitted on
    the reversed series and the better-ELBO fit kept. Appendix D experiments with autocorrelation and heavy tails are described as ''somewhat robust''. Applications: ion channel gating (T = 2,956 after
    subsampling) and the Shankle well log (d = 6, T = 346, core-sample ground truth). The Discussion mentions online CPD only as a future direction. Results tables not recorded.'

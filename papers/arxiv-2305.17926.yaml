  notes: 'Selected for the topic article requested by the user (2026-10-11): pitfalls in evaluating large language models (benchmark contamination and its detection, prompt and answer-format sensitivity,
    LLM-as-a-judge biases, human-preference arenas, holistic evaluation, benchmark errors, and reproducibility of evaluation harnesses). Carded by a subagent. Results tables not recorded; claims only. Affiliations:
    Peking University, The University of Hong Kong, Tencent Cloud AI. No venue is stated in the arXiv v2 PDF and the arXiv record has no comment or journal_ref; none recorded. Experimental setup: OpenAI
    API (''gpt-3.5-turbo-0301'' for ChatGPT, ''gpt-4'' for GPT-4); temperature 0 for single generations, temperature 1 with k = 3 samples for MEC; accuracy and kappa against the human majority; methods
    without BPC averaged over 100 runs with randomized response order. Caveats: the ground-truth annotations come from three of the authors (who also propose the calibration methods); the evaluation set
    is a single 80-question benchmark (Vicuna Benchmark, from Zheng et al., 2023) with one model pair annotated; the GPT-4 API version is given only as ''gpt-4'' (undated). Analysis sections (not recorded
    as claims): ChatGPT performance first increases with k then stays constant or decreases slightly, k = 3 chosen; both low (0.2) and high (1.4) temperatures are suboptimal and ''it is crucial to select
    an appropriate temperature (e.g., 0.6 or 1.0 in our experiments)''; BPDE outperforms Random and Vanilla Diversity Entropy selection; on a COMPARING template the VANILLA methods differ by nearly 6% accuracy
    from the SCORING template. No limitations section was found in the text (searched for ''limitation''). Only ''Section 4.1'' is confirmed by a cross-reference; other locations use section names. Result
    tables (Table 4, Table 5) are not recorded.'

  notes: 'Selected for the method article requested by the user (2026-10-10): alternatives and extensions to dense Transformers (sparse mixture-of-experts routing and load balancing, state space models
    from HiPPO/S4 to Mamba-2, linear and kernelized attention, RWKV, and benchmarks/analyses comparing them with Transformers). Carded by a subagent. Results tables not recorded; claims only. Affiliations:
    Harvard University (CMSA, Kempner Institute, CS and Statistics). Venue from the PDF footer (''Proceedings of the 41 st International Conference on Machine Learning, Vienna, Austria. PMLR 235, 2024'').
    Section numbers are from numbered headings in the PDF. GSSMs in the experiments are only LSTM and Mamba; linear attention and RWKV are included in the GSSM class by definition but not evaluated. Body-text
    results not recorded as claims: in phone-book lookup the smallest transformer (410M) outperforms the largest GSSM (2.8B) when the phone-book has at least 70 entries (Section 4.3); SQuAD uses only the
    2.8B models because smaller models were ''unable to achieve reasonable and consistent performance'' (footnote 4); a Hard-ALiBi transformer trained on length <= 50 is reported to generalize almost perfectly
    to length 1000 (Section 3.3), and copying accuracy drops when inputs contain duplicated n-grams of 5 or more tokens (Section 3.4). Training used about 600 RTX8000 GPU hours. No conflict of interest
    with the evaluated models (Pythia, Mamba) was found in the author list.'

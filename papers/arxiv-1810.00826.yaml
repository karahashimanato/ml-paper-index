  notes: 'Selected for the method article requested by the user (2026-10-10): graph neural networks (GCN, GraphSAGE, GAT, SGC, message passing, expressive power and the WL test, oversmoothing, oversquashing,
    heterophily, and evaluation pitfalls and benchmarks). Carded by a subagent. Results tables not recorded; claims only. Venue from the PDF header on every page (''Published as a conference paper at ICLR
    2019''); no arXiv comment/journal_ref. Section numbers confirmed by numbered headings in the PDF text (3, 4, 4.1, 4.2, 5, 5.1-5.5, 6, 7, 8). Other protocol details (Section 7): social network graphs
    have no node features, so REDDIT nodes get identical features and the other social graphs use one-hot degrees; 5 GNN layers, 2-layer MLPs, batch norm, Adam lr 0.01 halved every 50 epochs; sum readout
    on bioinformatics and mean readout on social datasets ''due to better test performance''; max-pooling not run on REDDIT-BINARY, REDDIT-MULTI5K and COLLAB due to GPU memory; deep-learning baselines and
    AWL accuracies are copied from their original papers; mean-1-layer and max-1-layer are said to correspond to GCN and GraphSAGE ''up to minor architecture modifications''. The paper reports that training
    accuracies of the GNNs never exceed those of the WL subtree kernel on their datasets (Section 7), and that GIN-0 slightly but consistently outperforms GIN-eps in test accuracy, which ''may be explained
    by its simplicity''. Conflict of interest: Leskovec is a co-author of GraphSAGE (Hamilton, Ying and Leskovec, 2017a), one of the variants shown to be less powerful, and the readout design follows the
    first author''s Jumping Knowledge Networks (Xu et al., 2018); the authors evaluate their own proposed GIN. Test results are in Table 1 and training curves in Figure 4; not recorded.'

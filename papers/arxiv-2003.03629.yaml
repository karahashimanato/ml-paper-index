proposes:
- 'Augmented bagging (AugBagg): bagging on a feature space augmented with extra noise features generated conditionally independent of the response'
- A caution that variable-importance tests based on drops in predictive accuracy can declare pure noise features significant
claims:
- id: c1
  statement: 'Main finding: adding extra randomly generated noise features and then running bagging (AugBagg) can lead to dramatic improvements in out-of-sample accuracy, sometimes outperforming even an
    optimally tuned random forest; consequently, variable importance based on improved accuracy may be deeply flawed.'
  location: Abstract
  page: 1
  quote: Surprisingly, we demonstrate that this simple act of including extra noise variables in the model can lead to dramatic improvements in out-of-sample predictive accuracy, sometimes outperforming
    even an optimally tuned traditional random forest.
- id: c2
  statement: 'Definition of the added features: the noise features N need only be conditionally independent of Y given X, so they may be correlated with the original features; the authors note that how
    they are generated can greatly affect performance.'
  location: Section 2
  page: 4
  quote: Importantly, we insist only that N be generated conditionally independent of Y given X.
- id: c3
  statement: 'When it helps: in the authors'' simulations (linear model, n = 100, p = 5 signal features, 500 repetitions per point, random forests with each mtry as reference lines), gains appear most dramatic
    at low SNRs, while correlated noise features can keep improving performance at higher SNRs; with independent noise features performance deteriorates with the number of added features at moderate SNRs.'
  location: Discussion
  page: 23
  quote: Performance gains appear most dramatic at low SNRs, though the introduction of correlated noise features can continue to improve performance even at higher SNRs.
- id: c4
  statement: 'Real-data protocol: on 14 regression datasets (9 low- and 5 high-dimensional), the number of added features q is tuned over {p/2, p, 3p/2, 2p} and their correlation r over {0, 0.1, 0.4, 0.7,
    0.9}, extra noise is injected into the response, and performance is relative test error versus bagging. No description of the data used to select q and r or of how the test error is estimated on these
    datasets was found in the text (searched for validation, cross-validation, out-of-bag, hold, test set).'
  location: Section 3
  page: 8
  quote: Since diﬀerent datasets have diﬀerent numbers of original features, q is tuned over p/2, p, 3p/2 and 2p.
- id: c5
  statement: 'Theoretical motivation (simplified model, OLS ensembles rather than trees): building on LeJeune et al. (2019), under their asymptotic assumptions (e.g., identity covariance, feature and row
    subsampling), a subsampled OLS ensemble built on a design augmented with independent noise features behaves like the ensemble on the original design with a smaller feature-subsampling rate, i.e., a
    more regularized estimator.'
  location: Section 4
  page: 14
  quote: eﬀect as constructing the ensemble on the original design with a smaller subsampling rate, thereby producing a more regularized estimator.
- id: c6
  statement: 'Variable importance: using the test of Williamson et al. (2020) with bagged ensembles of 500 trees, tests that drop the noise features under investigation rejected the null (declaring pure
    noise features important) far above the nominal 5% level: nearly 30% of the time at low SNRs with many tested features when the noise features are independent of the original features.'
  location: Section 5
  page: 19
  quote: the tests that drop the features under investigation reject nearly 30% of the time at low SNRs when a large number of features are being tested.
- id: c7
  statement: 'Caveat on those rejection rates: the authors caution that the particular rejection probabilities should not be read as guidelines; inflation depends on the data and on the power of the test
    (more powerful tests would reject even more often).'
  location: Section 5
  page: 19
  quote: These empirical results should in no way be seen as guidelines for how often or under what settings such tests will produce inﬂated rejection proportions.
- id: c8
  statement: Replacement-style tests (replacing features with random substitutes, as in Mentch and Hooker 2016 and Coleman et al. 2019) kept close to the nominal level when the substitutes had the same
    distribution as the tested features, but when correlated noise features were replaced by independent noise the test rejected with very high probability across all but the lowest SNRs.
  location: Section 5
  page: 21
  quote: 'Here we again notice a troubling trend: the test has a very high probability of rejecting across all but the lowest SNRs and this probability appears to increase with q.'
- id: c9
  statement: 'Interpretation and limitations: the authors do not conclude the tests are wrong, only that rejection means the features improve performance when included; they stress AugBagg should not replace
    random forests, as it increases computation and they cannot offer default values for q and r likely to work broadly.'
  location: Discussion
  page: 23
  quote: we stress that the procedure should not be seen as replacing or superseding more eﬃcient procedures like random forests.

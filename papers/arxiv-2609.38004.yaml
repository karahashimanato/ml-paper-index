  statement: Most TSAD methods use a single temporal granularity; MSCAD exchanges information among parallel autoencoders at different patch sizes.
  location: Abstract
  page: 1
  quote: most existing TSAD methods commit to a single temporal granularity
- id: c2
  statement: On TSB-AD, MSCAD reports large gains over 50 baselines (VUS-PR on univariate and multivariate splits).
  location: Abstract
  page: 1
  quote: MSCAD achieves large performance gains against 50 baselines across multiple metrics
- id: c3
  statement: VUS-PR is the primary metric because, unlike point-adjusted F1, it is threshold-free and not gameable by random scores.
  location: Evaluation
  page: 6
  quote: unlike Point-Adjusted F1 (PA-F1) it is threshold-free and not gameable by random scores.
- id: c4
  statement: Thresholded F1 variants of the TSB-AD implementation (reported at the best threshold when no fixed threshold is supplied) can be sensitive to threshold selection and, in some cases, point adjustment.
  location: Evaluation metrics (appendix)
  page: 19
  quote: These metrics are useful for diagnosing detector behavior but can be sensitive to threshold selection and, in some cases, to point-adjustment effects.

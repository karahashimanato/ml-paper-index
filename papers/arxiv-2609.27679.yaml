claims:
- id: c1
  statement: A leave-one-out derivation separates attention-based reading from state-dependent scaling, which motivates REFINEICL, an attention-gated FFN-free stack with low-rank feature interaction and
    typed memory.
  location: Abstract
  page: 1
  quote: 'The leading term separates attention-based reading from state-dependent scaling, motivating REFINEICL: an attention-gated, FFN-free contextual stack with selected low-rank feature interac- tion
    and typed memory.'
- id: c2
  statement: The benchmark-informed REFINEICL continuation also improves all four reported metrics over TabPFN-v3 on both TabZilla views.
  location: Abstract
  page: 1
  quote: It also improves all four reported metrics over TabPFN-v3 on both TabZilla views.
- id: c3
  statement: 'Evaluation protocol (TabArena): REFINEICL is evaluated on fold 0 only, with eight ensemble members and one support ordering.'
  location: Appendix
  page: 14
  quote: REFINEICL uses fold 0, eight ensemble members, and one support ordering shared across model sizes.
- id: c4
  statement: The TabArena comparison uses a fixed v0.1 snapshot with reference methods, which is not interchangeable with the live leaderboard.

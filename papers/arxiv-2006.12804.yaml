proposes:
- unified benchmark (SOSD-based) comparing author-tuned RMI, RadixSpline and PGM implementations with tree, trie, hash and binary-search baselines on four real datasets, including Pareto (size vs lookup
  time), performance-counter, cold-cache, memory-fence, multithreading and build-time analyses
claims:
- id: c1
  statement: 'Critique of earlier evaluations: the authors summarize criticisms of learned indexes as stemming from the lack of an efficient open-source implementation, inadequate datasets, and no standardized
    benchmark for fair comparison.'
  location: Introduction
  page: 1
  quote: The main reasons for these criticisms were the lack of an eﬃcient open-source implementation of the learned index structure, inadequate data-sets, and the lack of a standardized benchmark suite
    to ensure a fair comparison between the diﬀerent approaches.
- id: c2
  statement: 'Weak-baseline risk: because researchers had to re-implement the original learned index (or use back-of-the-envelope calculations), the authors say it is easy to leave baselines unoptimized
    or make unrealistic assumptions, potentially voiding the main takeaways.'
  location: Introduction
  page: 1
  quote: While not a bad thing per se, it is easy to leave the baseline unoptimized, or make other unrealistic assumptions, even with the best of intentions, potentially rendering the main takeaways void.
- id: c3
  statement: 'Synthetic-data critique: learned structures have an ''unfair'' advantage on synthetic datasets because these are often surprisingly easy to learn; the benchmark therefore uses only four real-world
    datasets (amzn, face, osm, wiki; 200M 64-bit keys each).'
  location: Introduction
  page: 1
  quote: Further complicating matters, learned structures have an “unfair” advantage on synthetic datasets, as synthetic datasets are often surprisingly easy to learn.
- id: c4
  statement: 'Re-evaluation of the PGM-index paper: contrary to that paper''s claim that the PGM-index dominates RMI, the authors found PGM significantly slower than RMI on 3 of the 4 datasets and slightly
    slower on osm.'
  location: Pareto analysis
  page: 6
  quote: Indeed, in our experimental evaluation we found that the PGM index performs signiﬁcantly worse than RMI on 3 out of the 4 datasets and slightly worse on osm.
- id: c5
  statement: 'Stated cause of the disagreement: after contacting the PGM authors, they report the PGM paper''s RMI implementation used only linear models instead of tuning model types and omitted some optimizations
    for linear-only RMIs; they stress theirs is the first comparison of RMI and PGM implementations each tuned by their own authors.'
  location: Pareto analysis
  page: 6
  quote: 'After contacting the authors of [13], we found that their RMI implementation was missing several key optimizations: their RMI only used linear models rather than tuning diﬀerent type of models
    as proposed in [19,22], and omitted some optimizations for RMIs with only linear models.'
- id: c6
  statement: 'Tuning protocol: implementations tuned by each structure''s original authors are used; RMIs are tuned with the CDFShop optimizer, RS and PGM by varying the model error tolerance, and tree
    structures'' size/accuracy trade-off is varied by inserting a subset of keys (a simple technique the authors note may not be ideal for each tree).'
  location: Setup
  page: 5
  quote: We use implementations tuned by each structure’s original authors.
- id: c7
  statement: 'Limitations: only read-only workloads were studied and each index was tested in isolation in a lookup loop rather than inside a broader application.'
  location: Introduction
  page: 2
  quote: We focused only on read-only workloads, and we tested each index structure in isolation (e.g., a lookup loop, not with integration into any broader application).

proposes:
- 'An evaluation framework for the NAS search phase: compare the architecture found by a NAS policy with a uniformly randomly sampled architecture from the same search space, both trained from scratch with
  the same hyperparameters, repeated over multiple random seeds'
- Use of reduced search spaces with ground-truth performance (a 32-architecture 2-node RNN space and NASBench-101) to measure search quality and the rank correlation (Kendall tau) between weight-sharing
  and stand-alone rankings
claims:
- id: c1
  statement: 'Main finding: on average the evaluated state-of-the-art NAS algorithms perform similarly to the random policy, and weight sharing degrades the ranking of NAS candidates to the point of not
    reflecting their true performance, reducing the effectiveness of the search.'
  location: Abstract
  page: 1
  quote: On average, the state-of-the-art NAS algorithms perform similarly to the random policy;
- id: c2
  statement: 'Protocol: the random policy uniformly samples an architecture from the same search space as the NAS algorithms and trains it with the same hyperparameters as the NAS solutions; to reduce randomness,
    the search with each policy is repeated with different random seeds.'
  location: Introduction
  page: 2
  quote: To reduce randomness, the search using each policy, i.e., random and NAS ones, is repeated several times, with different random seeds.
- id: c3
  statement: 'Standard-space setup: DARTS, NAO, ENAS and BayesNAS were compared with random sampling in the DARTS RNN (12-node) and CNN (7-node) spaces, 10 runs each with different initializations, using
    the authors-provided hyperparameters and code in the search phase; the chosen architectures were trained from scratch for 1000 epochs (RNN) and 600 (CNN).'
  location: Section 4.1
  page: 5
  quote: During the search phase, we used the authors-provided hyper-parameters and code for each policy.
- id: c4
  statement: 'Earlier comparisons to random search are described as not giving the random policy a fair chance: Pham et al. (2018) reported a single random architecture, and Liu et al. (2018b) one selected
    among 8 random architectures after only 300 epochs of training.'
  location: Section 2
  page: 3
  quote: While some works have provided partial comparisons to random search, these comparisons unfortunately did not give a fair chance to the random policy.
- id: c5
  statement: 'Interpretation caveat: not significantly outperforming random sampling does not necessarily mean the algorithms perform poorly; rather the search space has been sufficiently constrained that
    even a random architecture performs well. The authors therefore also test reduced spaces that can be evaluated exhaustively.'
  location: Introduction
  page: 2
  quote: Note that this does not necessarily mean that these algorithms perform poorly, but rather that the search space has been sufﬁciently constrained so that even a random architecture in this space
    provides good results.
- id: c6
  statement: In the NASBench-101 7-node space (10 runs per method), the best test accuracy found by DARTS, NAO or ENAS is 93.33 (NAO), much lower than the ground-truth best of 95.06; ENAS and DARTS are
    stated to have only 7% and 24% chance to surpass the random policy.
  location: Section 4.2
  page: 7
  quote: The best test accuracy found by these methods is 93.33, by NAO, which remains much lower than the ground-truth best of 95.06.
- id: c7
  statement: 'Weight-sharing ranking: in the reduced spaces, the architecture rankings obtained with and without weight sharing are uncorrelated in the RNN space (Kendall tau -0.004 over 10 runs) and have
    little correlation in the CNN space (0.195 over 10 runs); since such rankings serve as training data for the NAS sampler, this further explains the small margin over random search.'
  location: Introduction
  page: 2
  quote: the architecture rankings obtained with and without weight sharing are entirely uncorrelated in RNN space
- id: c8
  statement: 'Scope of the weight-sharing analysis: weight-sharing rankings were obtained with uniform per-minibatch architecture sampling (described as equivalent to Single Path One Shot), and DARTS was
    not included because it has no discrete solutions during the search, so solution ranking does not apply.'
  location: Section 4.3
  page: 7
  quote: As DARTS does not have discrete representations of the solutions during the search, the idea of solution ranking does not apply.
- id: c9
  statement: When NAO and ENAS are trained without weight sharing in NASBench, performance is on average 1% higher than with it, and the probability to surpass random search increases from 0.62 to 0.92
    for NAO and from 0.07 to 0.90 for ENAS.
  location: Section 4.3
  page: 8
  quote: Furthermore, the probability to surpass random search increases from 0.62 to 0.92 for NAO and from 0.07 to 0.90 for ENAS.

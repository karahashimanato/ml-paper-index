  notes: 'Selected for the topic article requested by the user (2026-10-11): pitfalls in evaluating large language models (benchmark contamination and its detection, prompt and answer-format sensitivity,
    LLM-as-a-judge biases, human-preference arenas, holistic evaluation, benchmark errors, and reproducibility of evaluation harnesses). Carded by a subagent. Results tables not recorded; claims only. Affiliations:
    UC Berkeley, Columbia, UChicago, UIUC. Venue from the PDF header (''Published as a conference paper at ICLR 2021'') and the arXiv comment; year is the first arXiv version. Section numbers are from numbered
    headings in the PDF. Conflict of interest: this is the benchmark authors'' own paper; the Moral Scenarios task includes questions from the ETHICS dataset by overlapping authors (Hendrycks et al., 2020),
    and the authors argue for the benchmark''s value (''likely to be an enduring and informative goalpost''). Andy Zou is also a co-author of arxiv-2405.14782 (lm-eval-harness). Body-text results not recorded
    as claims: the three smaller GPT-3 models are near random (around 25%) while the 175B model reaches 43.9% few-shot (about 37.7% zero-shot), and the largest UnifiedQA (11B) attains 48.9% (Section 4.2).
    In the next paragraph the authors cite Brown et al. (2020) as showing contamination ''hardly affects performance'' and say they will provide a list of question sources to reduce the chance that future
    models encounter exact questions. The memorization check is indirect (correlation of per-task average question log probability with accuracy; Figure 13 caption gives r = -0.43 zero-shot and r = -0.56
    few-shot) and does not test for the presence of the questions in training data. The few-shot calibration correlations (r = 0.81 vs 0.63) are in a figure caption and not recorded.'

proposes:
- 'Auto-PyTorch Tabular: joint optimization of network architecture (funnel-shaped MLPs/ResNets described by a few shape hyperparameters) and training hyperparameters with BOHB, using training epochs as
  fidelities'
- 'Meta-feature-free warm start: a greedy portfolio of complementary configurations (built offline from BOHB incumbents on meta-training datasets by minimizing mean relative regret) is evaluated in BOHB''s
  first iteration'
- Post-hoc ensemble selection over trained DNNs (across fidelities) plus traditional baselines (Random Forest, Extra Trees, LightGBM, CatBoost, kNN)
- 'LCBench: learning curves of 2,000 randomly sampled configurations of a 7-hyperparameter space on 35 AutoML-Benchmark datasets at three epoch budgets'
claims:
- id: c1
  statement: 'Motivation: the authors state, citing Zela et al. [9], that because the best architecture and the best hyperparameter configuration interact, AutoDL systems have to optimize both jointly;
    they also note that doing HPO only as a post-processing step of NAS ignores these interaction effects.'
  location: Introduction
  page: 1
  quote: Since there are interaction effects between the best architecture and the best hyperparameter conﬁguration for it, AutoDL systems have to jointly optimize both [9].
- id: c2
  statement: 'Multi-fidelity search: Auto-PyTorch uses BOHB (Bayesian optimization with KDE models plus Hyperband/successive halving) and chooses the number of training epochs rather than runtime as the
    budget, for generality and interpretability.'
  location: Section 3.2
  page: 4
  quote: We choose the number of training epochs as our budgets over the runtime because of its generality and interpretability.
- id: c3
  statement: 'Ensembling: post-hoc ensemble selection (Caruana-style, following auto-sklearn) greedily adds models from those stored during optimization, considering only the k = 30 best; the authors state
    that because it is post-hoc, models other than DNNs can easily be included, and that combining model classes is one of the key factors for state-of-the-art tabular performance in their experiments.'
  location: Section 3.5
  page: 4
  quote: An advantage of our post-hoc ensembling is that we can also include other models besides DNNs easily.
- id: c4
  statement: 'Warm start by portfolio: instead of meta-features, BOHB''s first iteration starts from a greedily built portfolio of complementary configurations; the authors note that this (as all meta-learning
    approaches) assumes meta-training datasets that are representative of the meta-test datasets, which they believe is particularly possible for tabular data because of platforms such as OpenML.'
  location: Section 3.6
  page: 5
  quote: This approach assumes (as all meta-learning approaches) that we have access to a reasonable set of meta-training datasets that are representative of meta-test datasets.
- id: c5
  statement: 'LCBench protocol: 2,000 randomly sampled configurations of the small space (7 hyperparameters, SGD with cosine annealing) evaluated at 12, 25 and 50 epochs with three seeds on 35 of the 39
    AutoML Benchmark datasets (1,500 CPU hours); the four largest datasets were omitted to keep runtimes and memory low.'
  location: Section 4.1.1
  page: 5
  quote: As we designed LCBench to be a cheap benchmark, we omit the four largest datasets (robert, guillermo, riccardo, dilbert), in order to ensure low runtimes and memory footprint.
- id: c6
  statement: 'Caveat on fidelities: while budget correlations were consistently quite high in the small LCBench space, on the full Auto-PyTorch space the Spearman correlation between budgets is quite low
    on some meta-training datasets, which the authors attribute to hyperparameters whose settings are more sensitive to budgets; they state that the correlations nevertheless suffice for Auto-PyTorch to
    perform well in their experiments.'
  location: Section 5.2
  page: 8
  quote: This indicates that there are speciﬁc hyperparameters in our larger conﬁguration space whose settings are more sensitive to budgets and thus lead to smaller correlations.
- id: c7
  statement: 'Evaluation protocol: the portfolio is built from BOHB runs (24 h, at most 300 iterations) on 100 OpenML meta-training datasets (overlap with the test datasets was checked, Appendix A) and
    has size 16; ablations run up to 72 hours or 300 BOHB iterations on 8 OpenML test datasets; tabular baselines (LightGBM, CatBoost, Random Forest, Extra Trees, kNN) follow Erickson et al. and use the
    same hyperparameter setting, with 6 CPU cores to match an Auto-PyTorch run.'
  location: Section 5.1
  page: 8
  quote: We choose 8 test datasets from OpenML roughly covering the feature and class distribution of the meta datasets.
- id: c8
  statement: 'Comparison with other AutoML systems (Auto-Keras, auto-sklearn, hyperopt-sklearn, Auto-Net 2.0): a 1 h runtime where possible, otherwise performance after 1 h inferred from trajectories over
    increasing trial counts; 5 seeds; AutoKeras and auto-sklearn sometimes ran into memory errors and hyperopt-sklearn could not handle missing data. By a t-test (alpha = 0.05) Auto-PyTorch Tabular was
    significantly better than each competitor on between 5 and 7 of 7 datasets and significantly worse than auto-sklearn and hyperopt-sklearn on a single dataset; against AutoGluon, the authors report that
    AutoGluon''s auto-stacking gives a small edge over Auto-PyTorch with ensembles.'
  location: Section 5.4
  page: 9
  quote: Indeed, based on a t-test with α = 0.05, it performed statis-tically signiﬁcantly better than each competitor on between 5 and 7 out of 7 datasets, only performing statistically sig-niﬁcantly worse
    than auto-sklearn and hyperopt-sklearn on a single dataset.
- id: c9
  statement: 'Stated limitations: ensembles improve performance overall but are known to be able to overfit (better generalization estimates could help); all ensemble members other than neural networks
    use default hyperparameter settings; and the hyperparameter-importance results have not yet been used to improve Auto-PyTorch.'
  location: Conclusion
  page: 10
  quote: First of all, while the ensem-bles improve performance overall, it is also known that they can lead to overﬁtting.

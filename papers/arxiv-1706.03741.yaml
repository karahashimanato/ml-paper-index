  notes: 'Selected for the method article requested by the user (2026-10-11): aligning language models with human preferences (preference comparisons and reward models, PPO-based RLHF with a KL penalty,
    AI feedback, direct preference optimization and its variants, reward overoptimization, length bias, reward-model evaluation, and open problems). Carded by a subagent. Results tables not recorded; claims
    only. Affiliations: OpenAI (Christiano, Amodei), DeepMind (Leike, Martic, Legg); Brown has no listed affiliation. No venue is stated in the arXiv PDF and the arXiv record has no comment/journal_ref;
    none recorded. Tag note: no registered task tag covers RL control from preferences (Atari/MuJoCo); ''llm-alignment'' is used as the nearest registered task, and the paper involves no language models.
    Feedback for Reacher and Cheetah was provided by an author due to time constraints and the novel behaviors (backflip, one-leg cheetah, Enduro keeping pace) were trained with feedback from the authors
    (Figure 2 caption, Section 3.2). Section 3.3 also reports that predicting comparisons worked much better than regressing on scores for continuous control, and that longer clips were more helpful per
    clip but less per frame. Footnote 6 gives a rough cost comparison (about $25 compute vs about $36 of minimum-wage labor for 5k labels on Atari). The Discussion claims interaction complexity is reduced
    by roughly 3 orders of magnitude. All quantitative comparisons with RL are figure-only; not recorded. The Atari scores were hidden by blacking out the score area (Appendix A.2). Later papers in this
    topic (arxiv-1909.08593, arxiv-2009.01325) are by overlapping authors (Christiano, Amodei, Brown) and build on this method.'

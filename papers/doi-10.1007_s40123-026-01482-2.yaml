- id: c2
  statement: 'Tuning: all gradient-boosting baselines (XGBoost, LightGBM, CatBoost) used default hyperparameters without per-dataset tuning, to match TabPFN''s zero-tuning design; the authors note tuning
    may narrow the margin.'
  location: Machine Learning Models
  page: 10
  quote: All gradient-boosting models used default hyperparameters without per-dataset tuning to ensure a fair comparison with TabPFN's zero-tuning design
- id: c3
  statement: TabPFN had the lowest MAE on all Eyerobo scenarios and was competitive with Ridge on auto-refractor scenarios.
  location: Abstract
  page: 2
  quote: TabPFN achieved the lowest mean absolute error (MAE) on all Eyerobo scenarios and was competitive with Ridge on auto-refractor scenarios
- id: c4
  statement: 'Screening thresholds: a Youden-optimal cutoff was selected on each training fold, and the cross-validation-averaged cutoff was used as the reported operating point.'

proposes:
- TabPFN v2
claims:
- id: c1
  statement: TabPFN v2 outperformed all previous methods on datasets with up to 10,000 samples by a wide margin, with much less training time.
  location: Abstract
  page: 1
  quote: a tabular foundation model that outperforms all previous methods on datasets with up to 10,000 samples by a wide margin, using substantially less training time.
- id: c2
  statement: In 2.8 s, TabPFN v2 outperformed an ensemble of the strongest baselines tuned for 4 h (classification).
  location: Abstract
  page: 1
  quote: In 2.8 s, TabPFN outperforms an ensemble of the strongest baselines tuned for 4 h in a classification setting.
- id: c3
  statement: Compared with the 2023 TabPFN, v2 scales to 50x larger datasets, supports regression, categorical data and missing values, and is robust to unimportant features and outliers.
  location: Introduction
  page: 2
  quote: the new TabPFN scales to 50× larger datasets; supports regression tasks, categorical data and missing values; and is robust to unimportant features and outliers.
- id: c4
  statement: Training only on synthetic data avoids privacy/copyright issues and contamination of training data with test data.
  location: Architecture / prior
  page: 3
  quote: By relying on synthetic data instead of large collections of public tabular data, we avoid common problems of foundational models, such as privacy and copyright infringements, contaminating our
    training data with test data
- id: c5
  statement: About 100 million synthetic datasets (from structural causal models) are generated per model training.
  location: Synthetic data
  page: 4
  quote: we created a massive corpus of around 100 million synthetic datasets per model training
- id: c6
  statement: 'The architecture uses two-way attention: each cell attends within its row, then within its column, making it invariant to sample and feature order.'
  location: Architecture
  page: 3
  quote: uses a two-way attention mechanism, with each cell attending to the other features in its row (that is, its sample) and then attending to the same feature across its column (that is, all other
    samples).
- id: c7
  statement: 'Primary evaluation: 29 classification and 28 regression datasets from the AutoML Benchmark and OpenML-CTR23 with up to 10,000 samples, 500 features and 10 classes.'
  location: Results
  page: 5
  quote: we use the 29 classification datasets and 28 regression datasets that have up to 10,000 samples, 500 features and 10 classes.
- id: c8
  statement: 'Each dataset and method: 10 repetitions with different seeds and 90/10 train/test splits.'
  location: Results
  page: 5
  quote: For each dataset and method, we ran 10 repetitions with different random seeds and train–test splits (90% train, 10% test).
- id: c9
  statement: Baselines were tuned by random search with five-fold CV, with budgets from 30 s to 4 h.
  location: Results
  page: 5
  quote: We tuned hyperparameters using random search with five-fold cross-validation, with time budgets ranging from 30 s to 4 h.
- id: c10
  statement: TabPFN v2 was pre-trained once on eight RTX 2080 GPUs for 2 weeks.
  location: Results
  page: 5
  quote: TabPFN was pre-trained once using eight NVIDIA RTX 2080 GPUs over 2 weeks
- id: c11
  statement: Scores are normalized per dataset, 1.0 = best and 0.0 = worst with respect to all baselines (so values depend on the set of baselines).
  location: Results
  page: 5
  quote: Scores were normalized per dataset, with 1.0 representing the best and 0.0 the worst performance with respect to all baselines.
- id: c12
  statement: TabPFN v2 also substantially outperformed all baselines on the Grinsztajn et al. and McElfresh et al. (TabZilla) benchmarks (refs 14, 15).
  location: Results, Extended Data Fig. 2
  page: 5
  quote: TabPFN substantially outperformed all baselines on the benchmarks of refs. 14,15.
- id: c13
  statement: Default TabPFN v2 beat default CatBoost on all five recent Kaggle tabular competitions with fewer than 10,000 training samples.
  location: Results, Extended Data Table 6
  page: 5
  quote: default TabPFN outperforms default CatBoost on all five Kaggle competitions with less than 10,000 training samples
- id: c14
  statement: Dataset characteristics (categorical features, missing values, size) did not strongly change TabPFN v2's relative performance, but this is not evidence that it scales beyond 10,000 samples
    and 500 features.
  location: Results
  page: 6
  quote: these results should not be taken as evidence that TabPFN scales well beyond the 10,000 samples and 500 features considered here.
- id: c15
  statement: TabPFN v2 was very robust to added uninformative features and outliers.
  location: Results, Fig. 5a
  page: 6
  quote: The results show that TabPFN is very robust to uninformative features and outliers
- id: c16
  statement: With half the training samples, TabPFN v2 still performed as well as the next best method.
  location: Results, Fig. 5a
  page: 6
  quote: with half the samples TabPFN still performs as well as the next best method
- id: c17
  statement: For regression, hyperparameter tuning of TabPFN v2 matters more than for classification.
  location: Results
  page: 6
  quote: For regression tasks, tuning hyperparameters is more important.
- id: c18
  statement: 'Competing interests: two authors are affiliated with PriorLabs (a tabular foundation model company); related patent applications were filed by Bosch.'
  location: Competing interests
  page: 13
  quote: F.H. and N.H. are affiliated with PriorLabs, a company focused on developing tabular foundation models.

  notes: 'Selected for the method article requested by the user (2026-10-10): alternatives and extensions to dense Transformers (sparse mixture-of-experts routing and load balancing, state space models
    from HiPPO/S4 to Mamba-2, linear and kernelized attention, RWKV, and benchmarks/analyses comparing them with Transformers). Carded by a subagent. Results tables not recorded; claims only. Affiliations:
    Stanford (Fu, Dao, Saab, Thomas, Ré), University at Buffalo (Rudra); Fu and Dao are equal contribution. Venue from the arXiv comment (''ICLR 2023 Camera-Ready (Notable-top-25% / Spotlight)''); year
    is the first arXiv version (2022). Section numbers are from numbered headings in the PDF. Proposition 1 (paragraph ''Efficiency''): H3 takes O(d^2 N + d N log N) time and O(dN) space with O(1) head
    dimension. Conflict of interest: the SSM baselines and components (S4, S4D, HiPPO) and FlashAttention (the speed baseline and the inspiration for kernel fusion) are by overlapping authors (Dao, Ré,
    Rudra). FlashConv speedups on LRA (S4 2x faster, 5.8x over Transformers) are from Table 8 and stated in the text; Figure 2 speedups are figure-based and not recorded. Pure H3 language model results
    are only in Appendix F. The Conclusion mentions ''results on language models up to 1.3B parameters'' although 2.7B hybrid models are also reported.'

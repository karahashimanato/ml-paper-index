  notes: 'Selected for the topic article requested by the user (2026-10-03): time-series foundation models and forecasting; carded by a subagent. Results tables not recorded; claims only. PDF states: Published
    in Transactions on Machine Learning Research (10/2024). Chronos uses LM architectures (T5, GPT-2) but the paper reports random initialization works as well as LLM weights, so the large-language-models
    family tag was not used. Pretraining data (Datasets section): 28 training datasets, about 890K univariate series, approximately 84B observations, plus KernelSynth Gaussian-process synthetic data. Ablation
    (Analysis of Hyperparameters): the authors report that LLM-weight initialization offers relatively little advantage over random initialization, which they suggest may be preferable. Stated limitations
    include the bounded tokenization range [-15s, 15s] (overflow / loss of precision) and, as a potential limitation, the inference speed of the larger models compared to task-specific deep learning models.'

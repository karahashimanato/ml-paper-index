proposes:
- 'InterpretML: an open-source Python package with a unified API for glassbox models and blackbox explanation methods'
- 'Explainable Boosting Machine (EBM): a GAM (optionally with pairwise interactions, a fast implementation of GA2M) whose per-feature functions are learned by bagging and round-robin, low-learning-rate
  gradient boosting on one feature at a time'
claims:
- id: c1
  statement: 'The package exposes two forms of interpretability: glassbox models designed for interpretability (e.g. linear models, rule lists, GAMs) and blackbox explanation techniques for existing systems
    (e.g. Partial Dependence, LIME), under a unified scikit-learn-style API with a visualization dashboard for comparing methods.'
  location: Abstract
  page: 1
  quote: 'InterpretML exposes two types of interpretability – glassbox, which are machine learning models designed for interpretability (ex: linear models, rule lists, generalized additive models), and
    blackbox explainability techniques for explaining existing systems (ex: Partial Dependence, LIME).'
- id: c2
  statement: 'EBM design: a GAM whose feature functions are learned with bagging and gradient boosting, with boosting restricted to one feature at a time in round-robin order and a very low learning rate
    so that feature order does not matter; round-robin cycling is said to mitigate the effects of co-linearity.'
  location: Section 3
  page: 3
  quote: The boosting procedure is carefully restricted to train on one feature at a time in round-robin fashion using a very low learning rate so that feature order does not matter.
- id: c3
  statement: EBM can automatically detect and include pairwise interaction terms; it is described as a fast, parallelizable C++/Python implementation of GA2M, citing Lou et al. (2013), with algorithmic
    details deferred to Lou et al. (2012, 2013) and Caruana et al. (2015).
  location: Section 3
  page: 3
  quote: EBM is a fast implementation of the GA2M algorithm (Lou et al., 2013), written in C++ and Python.
- id: c4
  statement: 'Intelligibility argument: each feature''s contribution can be visualized by plotting f_j, and because the model is additive each feature contributes modularly; individual predictions are sums
    of per-feature lookup-table contributions passed through the link function.'
  location: Section 3
  page: 3
  quote: Because EBM is an additive model, each feature contributes to predictions in a modular way that makes it easy to reason about the contribution of each feature to the prediction.
- id: c5
  statement: 'Accuracy claim (hedged): EBM often performs surprisingly well and is comparable with Random Forest and XGBoost; the evidence is an AUROC comparison on five classification datasets (heart-disease,
    breast-cancer, telecom-churn, adult-income, credit-fraud) shown in Figure 3, also including LightGBM and logistic regression.'
  location: Section 3
  page: 4
  quote: In terms of predictive power, EBM often performs surprisingly well, and is comparable with state of the art methods like Random Forest and XGBoost.
- id: c6
  statement: 'Evaluation protocol: all models were trained with their default parameters, and EBM''s defaults are said to be chosen for computational speed; for best accuracy and interpretability the authors
    recommend reference parameters (100 inner bags, 100 outer bags, 5000 epochs, learning rate 0.01). No description of train/test splits or repetitions was found in the text (searched for split, fold,
    cross, test set, held).'
  location: Section 3 (footnote 1)
  page: 4
  quote: All models were trained with their default parameters.
- id: c7
  statement: 'Cost: to keep terms additive EBM pays an additional training cost and is somewhat slower to train than similar methods, but prediction (additions and lookups) is among the fastest; computational
    performance is shown in Figure 4.'
  location: Section 3
  page: 4
  quote: To keep the individual terms additive, EBM pays an additional training cost, making it somewhat slower than similar methods.
- id: c8
  statement: 'Disclosure: the package (from Microsoft) includes what the authors call the first implementation of EBM, i.e. the evaluated glassbox model is the authors'' own, compared against third-party
    baselines.'
  location: Abstract
  page: 1
  quote: InterpretML also includes the ﬁrst implementation of the Explainable Boosting Machine, a powerful, interpretable, glassbox model that can be as accurate as many blackbox models.

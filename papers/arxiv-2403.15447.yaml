proposes:
- Trustworthiness evaluation of compressed LLMs (GPTQ/AWQ quantization, magnitude/SparseGPT/Wanda 2:4 pruning) on eight DecodingTrust dimensions plus MMLU and refusal rates
claims:
- id: c1
  statement: 'Main claim: quantization is currently more effective than pruning for obtaining efficiency and trustworthiness together (the abstract''s example: 4-bit quantization keeps the original''s trustworthiness
    while pruning degrades it even at 50% sparsity).'
  location: Abstract
  page: 1
  quote: We find that quantization is currently a more effective approach than pruning in achieving efficiency and trustworthiness simultaneously.
- id: c2
  statement: 'What is compressed: weights only, with GPTQ and AWQ at 3, 4 and 8 bits (post-training, calibration set of 128 samples), compared with 2:4 semi-structured pruning; models are LLAMA2 13b, LLAMA2
    13b Chat and Vicuna 13b Chat.'
  location: Experimental setup
  page: 4
  quote: 'In this paper, we study three pre-trained models: LLAMA2 13b, LLAMA2 13b Chat (Touvron et al., 2023b), and Vicuna 13b Chat (Chiang et al., 2023).'
- id: c3
  statement: 'Evaluation metrics: benign performance by MMLU average accuracy, trustworthiness by DecodingTrust''s eight dimensions (stereotype, privacy, toxicity, fairness, AdvGLUE++, OOD robustness, adversarial
    demonstrations, ethics), and additionally refusal rates.'
  location: Experimental setup
  page: 4
  quote: 'The benchmark includes 8 trustworthy dimensions: Stereotype, Privacy, Toxicity, Fairness, Adversarial Robustness (AdvGLUE++), Out-Of-Distribution (OOD) Robustness, Robustness to Adversarial Demonstrations
    (AdvDemo), and Ethics.'
- id: c4
  statement: Extreme quantization (3 bits) tends to reduce trustworthiness significantly, and this risk is not visible from benign performance alone, so the authors call for comprehensive trustworthiness
    evaluation in practice.
  location: Abstract
  page: 1
  quote: This increased risk cannot be uncovered by looking at benign performance alone, in turn, mandating comprehensive trustworthiness evaluation in practice.
- id: c5
  statement: Moderate-bit quantization may unexpectedly improve some trust dimensions such as ethics and fairness.
  location: Abstract
  page: 1
  quote: Moreover, employing quantization within a moderate bit range could unexpectedly improve certain trustworthiness dimensions such as ethics and fairness.
- id: c6
  statement: 'Calibration-set randomness matters: GPTQ at 4 bits can vary by over 5 points in fairness, ethics and adversarial demonstrations depending on the randomly sampled calibration set, and this
    variance is not predictable from MMLU.'
  location: Bag of tricks (discussion)
  page: 8
  quote: Note that such variance is not predictable from the standard MMLU benchmark.
- id: c7
  statement: The authors modified the DecodingTrust benchmark (to mitigate score variance caused by high refusal rates) and release it with the compressed models.
  location: Conclusion
  page: 9
  quote: To benefit the reproducibility of our experiments, we release all models tested in the benchmark and the modified DecodingTrust benchmark to mitigate the large score variances caused by the large
    refusal rates.

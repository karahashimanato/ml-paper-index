  notes: 'Selected for the topic article requested by the user (2026-10-07): Bayesian change point detection (online BOCPD and its extensions, offline Bayesian changepoint analysis, evaluation and applications).
    Carded by a subagent. Results tables not recorded; claims only. Affiliations: The Alan Turing Institute; University of Warwick. Venue from the arXiv journal_ref (NeurIPS 2018); the PDF footer reads
    ''32nd Conference on Neural Information Processing Systems (NIPS 2018), Montréal, Canada.'' Section numbers 2.3, 3.1, 4, 5 and 5.2 are confirmed by cross-references in the text (''see section 2.3'',
    ''Section 3.1 overcomes'', ''Section 4 expands on how β can be initialized'', ''see section 5.2''); other locations use heading names. Both experiments also use on-line hyperparameter optimization (Caron
    et al.) and run-length pruning (50 most likely run lengths kept). The air-pollution baseline results come from the authors'' own earlier work (Knoblauch & Damoulas 2018, ref [25]). Changepoints are
    declared from the run-length maximum or a MAP segmentation; no annotated ground-truth CPs beyond the congestion-charge date are used, and FDR is judged by outlier mislabelling. Appendix I.3: β_p barely
    moves on the well-log data, while on air pollution it jumps to ~1e-10 after the first iteration (explained by a numerical-stability lower bound). Sampling-free (Student''s t) comparison and MCMC timing
    are in the appendix (not recorded). Section 3.1 notes β_p must decrease as d increases (initialized at 0.05 for d = 1 and 0.005 for d = 29 in the experiments). Appendix I: inference reported fairly
    stable to the β_p initialization as long as it is chosen reasonably (air pollution: same CP within ±5 days for initial β_p 0.005-0.1). Appendix I.2: the non-robust air-pollution baseline uses more than
    20 models with lags 1, 5, 6, 7 versus lags 1-3 for the robust run (chosen, per the authors, to disadvantage the robust model universe); robust processing mostly takes well under 20 s per observation
    but sometimes over a minute.'

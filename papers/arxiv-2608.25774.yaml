claims:
- id: c1
  statement: EXAONE Tabular interleaves feature-axis attention within each item with support-conditioned item-axis attention within each feature at every layer.
  location: Abstract
  page: 1
  quote: EXAONE Tabular interleaves feature-axis attention within each item with support-conditioned item-axis attention within each feature at every Transformer layer
- id: c2
  statement: On TabArena, the classification model ranks first overall, surpassing tuned ensembles and 4-hour AutoML pipelines, while regression reaches the performance regime of the much larger TabFM.
  location: Abstract
  page: 1
  quote: On TabArena, its 20.81M-parameter classification model ranks first overall, surpassing tuned ensembles and 4-hour AutoML pipelines, while regression reaches the performance regime of the 1.64B-parameter
    TabFM at roughly 1/11 the inference cost.
- id: c3
  statement: TabArena baselines are taken from the official leaderboard, not re-run, so their preprocessing, hyperparameter optimization and ensembling follow the TabArena protocol.
  location: Evaluation protocol
  page: 10
  quote: For TabArena, we use the results reported on the official leaderboard rather than re-running each comparison model.
- id: c4
  statement: On BCCO and TALENT the comparison is only against six tabular foundation models (no GBDT or neural baselines).
  location: Evaluation protocol
  page: 10
  quote: 'For BCCO and TALENT, we conduct a controlled comparison against six tabular foundation models: TabSwift [31], TabDPT [23], TabPFN-3 [15], TabICLv2 [16], LimiX [19], and TabFM [18].'
- id: c5
  statement: On BCCO and TALENT the training/in-context support set is capped at 50,000 samples per fold.
  location: Evaluation protocol
  page: 10
  quote: To control computational cost across datasets of different scales, the training or in-context support set was capped at 50,000 samples per fold for both classification and regression.
- id: c6
  statement: The model is developed by LG AI Research (company report on its own model).
  location: Introduction
  page: 2
  quote: EXAONE Tabular is LG AI Research’s first tabular foundation model family

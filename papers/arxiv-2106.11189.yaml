  notes: 'Selected for the method article requested by the user (2026-10-10): deep learning architectures for tabular data (TabNet, NODE and differentiable trees, TabTransformer/FT-Transformer-style attention,
    SAINT, embeddings for numerical features, retrieval (TabR), regularized MLPs, CTR-style interaction models, self-supervised pretraining, and surveys/benchmarks comparing them with GBDTs). Carded by
    a subagent. Results tables not recorded; claims only. Affiliations: University of Freiburg; Leibniz University Hannover (Lindauer); Bosch Center for Artificial Intelligence (Hutter). Venue from the
    PDF footer (''35th Conference on Neural Information Processing Systems (NeurIPS 2021), Sydney, Australia''). Conflict of interest: the HPO method (BOHB, Falkner, Klein & Hutter), the Auto-PyTorch framework
    the method is built on (Zimmer, Lindauer & Hutter) and the Auto-sklearn GBDT baseline (Feurer et al. incl. Hutter) are from the authors'' own groups, per the reference list; the paper does not state
    this as a conflict of interest. Differentiable-trees tag is for the NODE baseline. The authors also state cocktails often include at least one regularizer from every family (frequency analysis in Figure
    3, values not recorded) and that cocktails beat XGBoost in only 15 minutes of HPO for the majority of datasets (Table 3, counts not recorded). Section numbers 4, 5.4 and 6 are confirmed by in-text cross-references
    (''(Section 4)'', ''Section 5.4'', ''(Section 6)''); other locations use section names.'

proposes:
- 'Att-GCRN+MCTS: a small supervised graph convolutional residual network with attention (trained on fixed-size instances with Concorde labels) is applied to overlapping k-nearest-neighbour sub-graphs that
  are rescaled to the unit square; the sub heat maps are merged into an edge heat map that prunes edges and guides a Monte Carlo tree search over k-opt moves on complete tours'
claims:
- id: c1
  statement: 'Proposal: train a small fixed-size model in a supervised way and reuse it repeatedly to build heat maps for TSP instances of arbitrary size via graph sampling, graph converting and heat-map
    merging, aimed at the lack of size generalization of supervised TSP models.'
  location: Abstract
  page: 1
  quote: this paper tries to train (in supervised manner) a small-scale model, which could be repetitively used to build heat maps for TSP instances of arbitrarily large size, based on a series of techniques
    such as graph sampling, graph converting and heat maps merging.
- id: c2
  statement: 'The division is not learned: sub-graphs of exactly m vertices are extracted by repeatedly taking the least-covered vertex as a centre and its k nearest neighbours (sub-graphs may overlap);
    only the sub heat-map predictor is learned, and merging uses a fixed formula over the sub-graphs containing each edge.'
  location: Building and merging heat maps
  page: 3
  quote: use the k-nearest neighbors algorithm [10] to extract a sub-graph G′ which consists of exactly m vertices (including the clustering center).
- id: c3
  statement: 'Relation to local search: the search operates on complete tours, and every action is a k-opt move that deletes k edges and adds k new ones; 2-opt improvements are applied first, then MCTS
    samples larger k-opt moves guided by the heat map.'
  location: Reinforcement learning for solutions optimization
  page: 4
  quote: Since each TSP solution consists of a subset of n edges, any action could be viewed as a k-opt (2 ≤k ≤n) transformation, which deletes k edges at ﬁrst, and then adds k different edges to form a
    new tour.
- id: c4
  statement: 'Baseline protocol: learning-based baselines were not retrained; their public source code and pre-trained models were downloaded and rerun (some baselines'' parameters such as beam width were
    adapted to prolong running time).'
  location: Experiments
  page: 5
  quote: Notice that, for the baselines, we just directly download and rerun the source codes, based on the pre-trained models (only for learning based baselines) which are publicly available.
- id: c5
  statement: 'Hardware asymmetry and scope: learning-based methods run on one GTX 1080 Ti GPU, while Concorde, Gurobi and LKH3 run on an 8-core CPU and are listed for indicative purposes only; the authors
    do not aim to strictly outperform the non-learning algorithms.'
  location: Experiments
  page: 5
  quote: Notice that our method is a learning based algorithm, thus we do not aim to strictly outperform the non-learning algorithms.
- id: c6
  statement: 'Main empirical claim: on instances with up to 10,000 vertices the approach is reported to clearly outperform existing machine-learning TSP algorithms and to significantly improve the trained
    model''s generalization (the learning baselines were rerun from their public pre-trained models on the same GPU; the non-learning solvers Concorde, Gurobi and LKH3 are listed only as indicative CPU
    references).'
  location: Abstract
  page: 1
  quote: Experimental results based on a large number of instances (with up to 10,000 vertices) show that, this new approach clearly outperforms the existing machine learning based TSP algorithms, and signiﬁcantly
    improves the generalization ability of the trained model.
- id: c7
  statement: 'Copied baseline numbers: two MCTS-based TSP methods ([36] Shimomura and Takashima; [43] Xing and Tu) could not be rerun because their code is not publicly available; for [43] the authors compare
    against the average gaps that paper reports, evaluated on different platforms, and describe their method as roughly producing overall better results within reasonable time.'
  location: Results on data set 2
  page: 6
  quote: The source codes of these two papers are both not publicly available, thus we cannot evaluate them uniformly on the same platform to make strictly fair comparisons.

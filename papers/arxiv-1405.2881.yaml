proposes:
- 'L2 consistency of Breiman''s random forests (CART splits on mtry random directions, subsampling without replacement instead of bootstrap) in additive regression models: Theorem 1 with a limited number
  of leaves t_n, Theorem 2 with fully grown trees under subsampling rate a_n log n / n -> 0 and an extra assumption (H2)'
claims:
- id: c1
  statement: 'Contribution: a consistency result for Breiman''s original random forest algorithm in the context of additive regression models, with insight into how forests adapt to sparsity.'
  location: Abstract
  page: 1
  quote: In the present paper, we take a step forward in forest exploration by proving a consistency result for Breiman’s [Mach. Learn. 45 (2001) 5–32] original algorithm in the context of additive regression
    models.
- id: c2
  statement: 'Modification of the algorithm analysed: each tree uses a_n points drawn without replacement instead of a bootstrap sample of n points drawn with replacement; the authors state this is harmless
    and only avoids the mathematical difficulties of the bootstrap. Trees stop when the number of cells reaches t_n.'
  location: Section 2
  page: 6
  quote: is harmless—in fact, it is just a means to avoid mathematical diﬃculties induced by the bootstrap
- id: c3
  statement: 'Assumption (H1): Y is a sum of continuous univariate functions of the coordinates plus independent centered Gaussian noise, with X uniform on [0,1]^p; the authors say the analysis is facilitated
    within additive models.'
  location: Section 3
  page: 7
  quote: Although random forests fall into the family of nonparametric procedures, it turns out that the analysis of their properties is facilitated within the framework of additive models.
- id: c4
  statement: 'Theorem 1 (under H1): forests are consistent if a_n -> infinity, t_n -> infinity and t_n (log a_n)^9 / a_n -> 0; it still holds with a_n = n (subsampling plays no role, depth control suffices),
    and an easy adaptation shows CART is consistent under the same assumptions.'
  location: Section 3
  page: 7
  quote: We note in passing that an easy adaptation of Theorem 1 shows that the CART algorithm is consistent under the same assumptions.
- id: c5
  statement: Theorem 2 (fully grown trees, t_n = a_n) additionally requires (H2), a condition on how Y-values influence connection probabilities; it holds when the partition is independent of the Y_i or
    without noise, but in general the authors do not know whether (H2) holds.
  location: Section 3
  page: 9
  quote: However, in the most general context, the partitions strongly depend on the whole sample Dn, and unfortunately, we do not know whether or not (H2) is satisﬁed.
- id: c6
  statement: The authors state that, apart from replacing bootstrapping by subsampling, Theorems 1 and 2 are the first consistency results for Breiman's forests, since most previously studied models are
    built independently of the data.
  location: Section 3
  page: 9
  quote: To our knowledge, apart from the fact that bootstrapping is replaced by subsampling, Theorems 1 and 2 are the ﬁrst consistency results for Breiman’s (2001) forests.
- id: c7
  statement: In Theorem 2 the estimation error is controlled by a subsampling rate a_n/n = o(1/log n) (a_n/n -> 0 with bounded noise), ensuring a query point is not connected to the same observation in
    many trees; subsampling is the key component imposing tree diversity, and the individual one-point-per-leaf trees are not consistent.
  location: Section 4
  page: 11
  quote: In our approach, the subsampling is the key component for imposing tree diversity.
- id: c8
  statement: 'Proposition 1 (H1, mtry = p, no strong component constant on any interval): with probability 1 - xi, for n large enough, the first k cuts are along the S informative variables, so forests
    behave as if data were projected onto those variables.'
  location: Section 3
  page: 10
  quote: Since the algorithm selects splits mostly along informative variables, everything happens as if data were projected onto the vector space generated by the S informative variables.
- id: c9
  statement: 'Limitation: the analysis does not carry over to high dimensions with p = p_n growing with n (possibly larger than n); (H2.1) may then be too restrictive.'
  location: Section 3
  page: 10
  quote: Unfortunately, our analysis does not carry over to this context.

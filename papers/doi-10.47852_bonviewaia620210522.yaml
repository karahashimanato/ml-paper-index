- id: c1
  statement: The paper proposes WHSDA-AI, a Walsh-Hadamard spectral deviation framework for structured, profile-based AI in banking and related tabular risk-analysis settings.
  location: Abstract
  page: 1
  quote: This paper proposes WHSDA-AI, a Walsh-Hadamard Spectral Deviation Analysis framework for structured and profile-based AI in the banking sector and related tabular risk-analysis settings.
- id: c2
  statement: The full Walsh-Hadamard transform is an isometry, so it cannot by itself improve Euclidean rankings; any value must come from coefficient selection, reference deviations, weighting or downstream
    models.
  location: Abstract
  page: 1
  quote: The full Walsh-Hadamard transform is an isometry and cannot improve Euclidean rankings by itself.
- id: c3
  statement: Comparisons are reported against sparse logistic regression, PCA, Haar contrasts, random signed projections, random forests, gradient boosting, XGBoost and LightGBM.
  location: Introduction
  page: 2
  quote: Fourth, it reports comparative results against sparse logistic regression, PCA, Haar contrasts, random signed projections, random forests, gradient boosting, XGBoost, and LightGBM.
- id: c4
  statement: Evaluation uses repeated splits; the reported benchmarks are two controlled risk-style datasets, three public structured-data datasets and one public credit-card fraud dataset.
  location: Limitations
  page: 14
  quote: The reported benchmarks now include two controlled risk-style datasets, three public structured-data datasets, and one public credit-card fraud benchmark.

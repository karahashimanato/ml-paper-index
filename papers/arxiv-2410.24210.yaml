relations:
- winner: TabM
  loser: Other tabular DL models (MLP, FT-T, SAINT, T2G, Excel, TabR, ModernNCA and embedding variants)
  basis: Mean performance rank over the 46 datasets (Figure 3); GBDTs are also in the figure but the statement is about DL models.
  benchmark: gorishniy2025-46-datasets
  location: Section 4.2
  page: 7
  quote: The performance ranks render TabM as the top-tier DL model.
- winner: TabM-packed (MLP + Packed-Ensemble)
  loser: MLPxk (deep ensemble of independently trained MLPs)
  basis: Figure 2, tuned models on 46 datasets.
  benchmark: gorishniy2025-46-datasets
  location: Section 3.3
  page: 5
  quote: TabMpacked delivers significantly better performance compared to MLP×k.
- winner: TabM-naive (MLP + BatchEnsemble)
  loser: TabM-packed
  basis: Figure 2, tuned models on 46 datasets.
  benchmark: gorishniy2025-46-datasets
  location: Section 3.3
  page: 5
  quote: Interestingly, Figure 2 reports higher performance of TabMnaive compared to TabMpacked.
- winner: MLPxk (deep ensemble)
  loser: FT-Transformer
  basis: Figure 2, tuned models on 46 datasets.
  benchmark: gorishniy2025-46-datasets
  location: Section 3.3
  page: 4
  quote: Notably, the results are already better and more stable than those of FT-Transformer

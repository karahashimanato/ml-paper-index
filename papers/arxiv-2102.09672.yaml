  notes: 'Selected for the method article requested by the user (2026-10-05): diffusion models. Carded by a subagent. Results tables not recorded; claims only. Affiliation: OpenAI. No venue is stated in
    the PDF (arXiv v1); none recorded. Other protocol facts in the text: the class-conditional ImageNet 64x64 comparison with BigGAN-deep used 50K samples and an own-trained BigGAN-deep (125K iterations,
    no truncation); dropout was swept over {0.1, 0.2, 0.3} on CIFAR-10 (Appendix A); all models overfit on CIFAR-10 and on class-conditional ImageNet 64x64, and the authors concluded that early stopping
    was the best way to train for FID (Appendices F-G; the data used for early stopping is not stated in the quoted passages). Sampling: L_simple models with fixed variances lost much more sample quality
    with fewer sampling steps than the L_hybrid model; 100 steps sufficed for near-optimal FID for fully trained models (Section 4); DDIM was better below 50 steps and worse at 50 or more. Appendix D reports
    that theta_vlb is better at the start and end of the diffusion process and theta_hybrid in the middle. Tables 1-5 (NLL/FID) not recorded.'

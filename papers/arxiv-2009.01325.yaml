  notes: 'Selected for the method article requested by the user (2026-10-11): aligning language models with human preferences (preference comparisons and reward models, PPO-based RLHF with a KL penalty,
    AI feedback, direct preference optimization and its variants, reward overoptimization, length bias, reward-model evaluation, and open problems). Carded by a subagent. Results tables not recorded; claims
    only. All authors at OpenAI. Venue from the PDF page 1 footer (''34th Conference on Neural Information Processing Systems (NeurIPS 2020), Vancouver, Canada'') and the arXiv comment ''NeurIPS 2020''.
    Conflict of interest: the models are OpenAI''s own GPT-3-style pretrained models (1.3B and 6.7B), the paper is a follow-up to [73] = Ziegler et al. (arxiv-1909.08593) with overlapping authors, and labelers
    were trained to agree with the researchers, so ''human preference'' here largely reflects the authors'' notion of summary quality (the task is defined as ''as good as possible, according to our judgments'',
    Section 3.2). Further body-text numbers not made into claims: 6.7B PPO summaries get 7/7 overall 45% of the time vs 20% (supervised) and 23% (references) (Section 4.1); RM agreement with labelers on
    CNN/DM 62.4%/66.5% vs inter-labeler 66.9%; doubling data gives ~1.1% and doubling model size ~1.8% RM accuracy (Section 4.3); ROUGE agreement with labelers drops from ~57% to ~50% on human feedback
    samples (Section 4.4). Limitations (Section 5): RL fine-tuning of the 6.7B model took about 320 GPU-days, data took thousands of labeler hours, and an equal-cost high-quality demonstration baseline
    was not collected. Broader impacts discuss misuse (persuasion, toxic content) and that researcher labels may not be an appropriate gold standard for contested tasks. Final evaluations sample at T=0.
    The overoptimization curve, model-size curves and CNN/DM transfer are figure-only; not recorded.'

claims:
- id: c1
  statement: 'Contribution: a smoothly broken power-law functional form (BNSL) that the authors say accurately models and extrapolates how evaluation metrics vary with compute, parameters, dataset size,
    input size, training steps or upstream performance.'
  location: Abstract
  page: 1
  quote: We present a smoothly broken power law functional form (referred to by us as a broken neural scaling law (BNSL)) that accurately models and extrapolates the scaling behaviors of deep neural networks
- id: c2
  statement: 'Evaluation protocol: the functional form is fit to smaller-x points and evaluated on held-out larger-x points for extrapolation; tabulated extrapolation errors are RMSLE.'
  location: 'Empirical results: fits & extrapolations of functional forms'
  page: 5
  quote: black points are points used for fitting a functional form, green (gray if color blind) points are held-out points used for evaluating extrapolation of functional form fit to the black points,
    & a red line is BNSL that has been fit to black points.
- id: c3
  statement: 'Baseline provenance: the percentages of tasks won by the competing functional forms M1-M4 in the benchmark comparison were obtained via correspondence with the authors of Alabdulmohsin et
    al. (2022), not recomputed in this paper.'
  location: Empirical results (Table 2 caption)
  page: 5
  quote: Numbers for M1, M2, M3, and M4 were obtained via correspondence with authors of Alabdulmohsin et al. (2022).
- id: c4
  statement: 'Data provenance: much of the scaling data is taken from other papers; e.g. the compute-on-x-axis vision experiment uses data from Figure 2 of Zhai et al. (2021) and compares BNSL with M3,
    the form proposed there.'
  location: Appendix A.9
  page: 15
  quote: The experimental scaling data was obtained from Figure 2 of Zhai et al. (2021), and as a result in Table 6 we compare extrapolation of BNSL to the extrapolation of M3 (which was proposed in Zhai
    et al. (2021))
- id: c5
  statement: 'Emergence framing: the authors define the ''emergent'' / ''breakthrough'' / ''phase transition'' behaviors advertised in recent papers as any scaling behavior with more than zero breaks in
    BNSL.'
  location: The limit of the predictability of scaling behavior
  page: 10
  quote: We define all these quoted phrases as any scaling behaviors with greater than 0 breaks
- id: c6
  statement: 'Limit of predictability: if a sufficiently sharp break occurs at a scale sufficiently larger than the largest fitted point, there is currently no way to extrapolate past that break.'
  location: The limit of the predictability of scaling behavior
  page: 11
  quote: 2) If an additional break of sufficient sharpness happens at a scale that is sufficiently larger than the maximum (along the x-axis) of the points used for fitting, there does not (currently) exist
    a way to extrapolate the scaling behavior after that additional break.
- id: c7
  statement: 'Stated limitation: a small number of (x, y) samples sometimes may not suffice to fit and extrapolate BNSL, and collecting many samples can be costly; the authors suggest entities with more
    compute may get more accurate extrapolations.'
  location: Ethics statement
  page: 11
  quote: A small number of samples sometimes may not be sufficient to accurately fit and extrapolate the BNSL functional form, and obtaining a large number of such samples can sometimes be costly.

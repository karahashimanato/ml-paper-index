  notes: 'Selected for the topic article requested by the user (2026-10-03): classical algorithms (sorting, binary search, greedy) and machine learning; carded by a subagent. Results tables not recorded;
    claims only. PDF states: Proceedings of the 37th International Conference on Machine Learning, Vienna, Austria, PMLR 119, 2020. Convex experiments: L2-regularized logistic regression with SGD, SVRG
    and SAGA on LIBSVM covtype.binary (581,012 points, 54 dims; random half split for test) and Ijcnn1 (49,990 train / 91,701 test, 22 dims); learning rates tuned by preferring smaller training loss over
    many combinations of exponential-decay and k-inverse schedules; lambda = 1e-5. Non-convex: 2-layer MLP on MNIST (CRAIG subset of 50% reselected each epoch) and ResNet-20 on CIFAR10 (subsets of 1%-20%
    reselected every epoch or every 5 epochs), average test accuracy across 10 trials. Baselines: random subsets of the same size and the full dataset. Subsets are selected per class keeping class ratios,
    because the gradient-difference bounds hold only for points with similar labels. A footnote notes that in the worst case the subset may need to be nearly the whole dataset, though in practice a small
    subset sufficed. The greedy step can be made O(|V|) with stochastic greedy (Mirzasoleiman et al. 2015a = arxiv-1409.7938) and lazy evaluation. Theorem 1/2 state the |V|/|S| speedup comes at the price
    of an extra error term (neighborhood 2eps R/mu^2 or 2eps/mu). Results not recorded.'

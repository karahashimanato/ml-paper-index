  notes: 'Selected for the method article requested by the user (2026-10-10): alternatives and extensions to dense Transformers (sparse mixture-of-experts routing and load balancing, state space models
    from HiPPO/S4 to Mamba-2, linear and kernelized attention, RWKV, and benchmarks/analyses comparing them with Transformers). Carded by a subagent. Results tables not recorded; claims only. Affiliation:
    Google (all authors). Venue from the PDF footer (''Proceedings of the 39 th International Conference on Machine Learning, Baltimore, Maryland, USA, PMLR 162, 2022'') and the arXiv comment (''Accepted
    to ICML 2022''); year 2022 is the venue year printed on the PDF (first arXiv version: 2021). Section numbers from numbered headings in the PDF. Parameter counts (Introduction, Table 2/4): 1.2T total
    parameters, 64 experts per MoE layer, 96.6B (8% of 1.2T) activated per token. Footnote in Section 4: choosing two experts is a trade-off between predictive performance and training/serving efficiency.
    The GPT-3 energy number (1287 MWh) and its datacenter PUE (1.10) are taken from Patterson et al. (2021) (Appendix F); GLaM energy uses PUE 1.11 and 326W measured system power per TPU-v4 chip, so the
    energy comparison mixes hardware generations. GPT-3 was trained on 300B tokens vs 600B (or 280B) for GLaM. Appendix B (1.7B/1E to 1.7B/256E) reports, from a figure, that adding experts at fixed computation
    per prediction generally helps. Data-filtering study (Section 6.2) and ethics analyses not recorded. Conflict of interest: the comparison baselines and components are the authors'' own Google work (GShard
    auxiliary loss and architecture by Lepikhin, Xu, Krikun, Chen et al.; Switch Transformer by Fedus and Zoph; GSPMD by Xu et al.), and these people are co-authors here. Results tables (Tables 1, 5, 11-14)
    not recorded.'

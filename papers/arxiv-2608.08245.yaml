proposes:
- 'ProxyDrift: drift measurement between production traffic and offline evaluation sets on LLM-classified non-PII proxy descriptors'
- Chance-calibrated, redundancy-aware (RA) alignment score
- Chow-Liu tree conditional sampler for synthetic evaluation proxies
claims:
- id: c1
  statement: ProxyDrift identifies and measures drift between production traffic and offline evaluation sets, and builds/refreshes those sets, without access to raw user data.
  location: Abstract
  page: 1
  quote: We present PROXYDRIFT, a framework that (i) identifies and measures drift between production traffic and offline evaluation sets, and (ii) constructs and refreshes those evaluation sets accordingly;
    all without access to raw user data.
- id: c2
  statement: Per-dimension drift is measured with the Jensen-Shannon distance on categorical proxy distributions, chosen because it reacts strongly to support mismatches; it is then chance-calibrated against
    a permutation baseline.
  location: Drift Measurement
  page: 3
  quote: Among several candidate distance metrics (Total Variation, Wasserstein, Euclidean, ...), we selected Jensen–Shannon distance (JSD) as the default for categorical distributions because it reacts
    strongly to support mismatches.
- id: c3
  statement: 'Decision bands are fixed, not learned: the alignment range is split into equal thirds (bad / average / good); dimension importance weights are set by domain experts.'
  location: Drift Measurement
  page: 4
  quote: we use equal thirds (bad < 1/3, average ≥1/3, good ≥2/3) uniformly throughout the paper.
- id: c4
  statement: 'Drift evaluation setup: one week of production traffic is the reference, against which two synthetic samplers and the legacy hand-curated test set are scored; there are no labeled drift events.'
  location: Evaluation (end-to-end drift alignment)
  page: 7
  quote: Reference distributions were computed from a week of production traffic (2026-04-02 to 2026-04-08).
- id: c5
  statement: The legacy hand-curated offline test set is poorly aligned with production on most dimensions; the paper adds that quality scores were lower on a distribution-aligned synthetic set and says
    this suggests score inflation in conventional offline evaluation.
  location: Evaluation (end-to-end drift alignment)
  page: 8
  quote: By contrast, the legacy hand-curated test set fails on most dimensions, with individual per-dimension alignment scores typically below 0.40 and the overall alignment score in the bad range.
- id: c6
  statement: The system is deployed in a large commercial productivity suite (all authors are at Microsoft Corporation).
  location: Introduction
  page: 2
  quote: PROXYDRIFT has been deployed in a major cloud-based productivity suite serving hundreds of millions of users, where it monitors multiple application scenarios continuously and generates synthetic
    evaluation data on a weekly cadence.

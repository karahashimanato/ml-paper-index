  notes: 'Selected for the method article requested by the user (2026-10-10): AutoML systems and neural architecture search (CASH, pipeline search, ensembling/stacking, meta-learning warm starts, cost-aware
    search, AutoML benchmarks, NAS with RL/evolution/weight sharing/differentiable search, and NAS evaluation/reproducibility). Carded by a subagent. Results tables not recorded; claims only. No venue recorded:
    the arXiv comment says ''UNDER REVIEW: Revised submission to JMLR, with updated results from June 2023'', and the PDF header ''Journal of Machine Learning Research 1 (2000) 1-48, Submitted 4/00; Published
    10/00, Editor: TBD'' is the unfilled JMLR template. Results are from framework versions of June 2023, with some 2021 runs marked with an asterisk (Section 6). Folds: 10-fold cross-validation is mentioned
    in Appendix D. Conflict of interest: the organizers include developers of evaluated systems - LeDell and Poirier (H2O.ai) of H2O AutoML (LeDell and Poirier, 2020), and Gijsbers and Vanschoren of GAMA
    (Gijsbers and Vanschoren, 2021); Thomas co-authored autoxgboost (opted out). Developers of other evaluated frameworks (e.g. Nick Erickson, Matthias Feurer, Piotr Płoński) are thanked for feedback on
    the manuscript, and modes were chosen by each framework''s developers. No explicit conflict-of-interest statement was found in the text (searched for conflict, competing interest, disclos, affiliat).
    NaiveAutoML was evaluated but excluded from the main analysis (Appendix E: a 5% execution timeout set by the benchmark authors was too strict; the framework authors confirmed). AutoGluon(HQIL) failures
    caused by a since-fixed calibration bug were imputed with AutoGluon(HQ) values rather than the constant predictor (Appendix D). Bradley-Terry tree findings and inference-speed figures are not recorded
    beyond the text. Hardware (Section 5.2.1): AWS m5.2xlarge, 32 GB memory, 8 vCPUs, 100 GB gp3 SSD. Metrics (Section 5.1.2): AUC (binary), log loss (multi-class), RMSE (regression); models are not calibrated
    unless the framework does so by default. Section 6.4: memory and time constraints are the main causes of errors, errors are more common in the classification suite, several frameworks fail on highly
    imbalanced data, and some frameworks exceed or stop far before the runtime limit. Section 6.3: AutoGluon(B)''s high accuracy comes with extremely slow inference, explained by its multi-layer stacking
    plus ensembling. Section 5.4: widely used benchmark datasets cannot in general be assumed truly unseen by developers. Earlier version: arxiv-1907.00909.'

proposes:
- 'Generalized denoising auto-encoder: a DAE viewed as learning the reverse conditional P(X | corrupted X) for any corruption process and any reconstruction loss interpretable as a log-likelihood, with
  a Markov chain alternating corruption and sampling from the learned conditional whose stationary distribution consistently estimates P(X)'
- 'Walkback training: a corruption process that uses the current model''s own chain to generate additional corrupted examples, to remove spurious modes'
claims:
- id: c1
  statement: 'Limitations of the earlier score result (Alain and Bengio 2013, whose authors are co-authors here): it applies only to Gaussian corruption, continuous inputs and squared error, and only in
    the limit of small noise, although the authors note that in practice the best results are obtained with large noise levels comparable to the range of the input.'
  location: Introduction
  page: 2
  quote: it applies to one kind of corruption (Gaussian), only to continuous-valued inputs, only for one kind of loss (squared error), and it becomes valid only in the limit of small noise
- id: c2
  statement: 'Proposed interpretation: valid for any data type, any corruption process with broad enough support, and any reconstruction loss that can be viewed as a log-likelihood.'
  location: Introduction
  page: 2
  quote: What we propose here is a different probabilistic interpretation of DAEs, which is valid for any data type, any corruption process (so long as it has broad enough support), and any reconstruction
    loss (so long as we can view it as a log-likelihood).
- id: c3
  statement: 'Main result (Theorem 1 and Corollary 1): if the learned denoising conditional is a consistent estimator and the chain is ergodic (sufficient conditions: positivity of the data distribution,
    model and corruption on a bounded region), the stationary distribution of the chain alternating denoising and corruption converges to the data-generating distribution as the number of examples grows.'
  location: Conclusion and Future Work
  page: 8
  quote: We have proven that training a model to denoise is a way to implicitly estimate the underlying data-generating process, and that a simple Markov chain that alternates sampling from the denoising
    model and from the corruption process converges to that estimator.
- id: c4
  statement: 'Why corruption is needed: the conditions of the corollary exclude the case of no corruption, in which the DAE would simply learn a Dirac on its input and give a wrong estimate, and the case
    of the chain wandering to infinity (handled by assuming a bounded volume).'
  location: Consistency
  page: 4
  quote: We avoid the case where there is no corruption (which would yield a wrong estimation, with the DAE simply learning a dirac probability its input).
- id: c5
  statement: 'Locality trade-off: with a local corruption the reverse conditional is expected to be much simpler (often roughly unimodal) than P(X), which is the expected gain over modelling P(X) directly;
    but the conditional is only trained for corrupted points near X, so energy estimates may be poor far from the conditioning point.'
  location: Locality of the Corruption and Energy Function
  page: 5
  quote: Hence, although in theory (with inﬁnite amount of data and capacity) the above estimator should be good, in practice it might be poor when X is far from ˜X.
- id: c6
  statement: 'Spurious modes: experience with sampling in high dimensions suggests that too local a corruption lets the DAE''s behaviour far from the training examples create spurious modes in insufficiently
    visited regions; more training or more noise helps substantially, and walkback training (which uses the model''s own chain to pick corrupted points to walk back from) gave an even bigger boost.'
  location: Reducing the Spurious Modes with Walkback Training
  page: 6
  quote: if the corruption is too local, the DAE’s behavior far from the training examples can create spurious modes in the regions insufﬁciently visited during training
- id: c7
  statement: 'MNIST protocol: a 784-2000-784 DAE on binarized MNIST (salt-and-pepper noise, cross-entropy loss, 200 epochs on 50000 examples); sample quality was estimated by a non-parametric lower bound
    on test log-likelihood built from 10000 consecutive chain samples; this bound was not used to select architectures, but visual inspection of samples guided the preliminary search, and optimization hyper-parameters
    were selected on the training objective.'
  location: Experimental Validation
  page: 8
  quote: The test set log-likelihood bound was not used to select among model architectures, but visual inspection of samples generated did guide the preliminary search reported here.
- id: c8
  statement: 'Stated outcome and caveat (body text): the DAE bound was higher with walkback than without, which the authors take as confirming the visual impression of fewer spurious samples; the RBM baseline,
    evaluated with the same estimator, could be improved by a tuned spatial blur, which did not help the auto-encoder.'
  location: Experimental Validation
  page: 8
  quote: The DAE log-likelihood bound with and without walkback is respectively -116 and -142, conﬁrming visual inspection suggesting that the walkback algorithm produces less spurious samples.

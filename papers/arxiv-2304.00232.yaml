  notes: 'Selected for the topic article requested by the user (2026-10-07): Bayesian change point detection (online BOCPD and its extensions, offline Bayesian changepoint analysis, evaluation and applications).
    Carded by a subagent. Results tables not recorded; claims only. Affiliations: Technology Innovation Institute (Abu Dhabi); Technical University of Munich; Ecole Polytechnique. First two authors contributed
    equally. The PDF header says ''Preprint.'' and code is promised ''upon publication''; no venue recorded. R-BOCPD itself comes from Alami, Maillard and Feraud (ICML 2020 per the reference list), the
    first author''s earlier work. Section 3 and Section 5 are confirmed by cross-references (''as defined in Section 3'', ''in Section 5''); other locations use heading names or theorem/appendix labels.
    The abstract and conclusion claim the regret bound is the first of order Õ(T^{1/2}) and compare it with sliding-window and restart baselines; the exponents are garbled in the text extraction, so these
    comparisons are not recorded. Abrupt changes of arbitrary magnitude are allowed, but the bound depends on the minimum KL between successive transition kernels. Note the asymmetric tuning: baselines
    receive searched/oracle quantities (diameter, variation budgets, T, number of changes) while the paper says R-BOCPD-UCRL2 needs no such inputs. In Algorithm 2 one R-BOCPD runs per state-action pair
    on the observed state sequence and a detection resets all UCRL2 counts. Synthetic MDPs: 4 sizes (4 states/7 actions to 16 states/20 actions), random change points, horizon T = 50000, 100 realizations.'

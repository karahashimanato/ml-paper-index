  notes: 'Selected for the method article requested by the user (2026-10-10): graph neural networks (GCN, GraphSAGE, GAT, SGC, message passing, expressive power and the WL test, oversmoothing, oversquashing,
    heterophily, and evaluation pitfalls and benchmarks). Carded by a subagent. Results tables not recorded; claims only. Affiliation: Stanford University (all authors; Hamilton and Ying equal contribution).
    Venue from the PDF page-1 footer (''31st Conference on Neural Information Processing Systems (NIPS 2017)'') and the arXiv comment. Section numbers are from numbered headings (1-6, appendices A-E). Unsupervised
    loss (Section 3.2): J_G(z_u) = -log sigma(z_u^T z_v) - Q E_{v_n ~ P_n} log sigma(-z_u^T z_vn), where v co-occurs with u on fixed-length random walks; it can be replaced or augmented by a task-specific
    loss. LSTM aggregator: LSTMs are not permutation invariant and are applied to a random permutation of the neighbors (Section 3.3). Section 3.3 says the convolutional aggregator ''does concatenate''
    the node''s previous representation, which contradicts the preceding clause (''does not perform the concatenation operation'') and appears to be a typo; the claim follows the latter. Aggregator comparison
    uses a Wilcoxon signed-rank test over 6 settings, which the authors call ''somewhat underpowered'' (Section 4.4). Footnote 6 notes that follow-up work (Chen and Zhu) achieved better PPI numbers by tuning
    GraphSAGE hyperparameters for PPI. Appendix C: learning rates swept; the logistic regression on embeddings uses scikit-learn SGDClassifier with all default settings; edges are subsampled so no node
    has degree above 128; the number of repeated runs was not found in the text (searched ''runs'', ''seed'', ''times''). Results tables (F1) and Figure 2 are not recorded.'

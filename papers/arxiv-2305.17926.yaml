proposes:
- 'Conflict Rate: the fraction of examples for which an LLM evaluator gives different results when the two responses are swapped in the prompt'
- 'Multiple Evidence Calibration (MEC): an evidence-first evaluation template, sampled k times and averaged'
- 'Balanced Position Calibration (BPC): evaluate each pair in both orders and average the 2k scores'
- 'Human-in-the-Loop Calibration (HITLC): Balanced Position Diversity Entropy (BPDE) over the 2k evaluation results selects the top-beta most likely biased examples for human annotation'
claims:
- id: c1
  statement: 'Positional bias: with the same evaluation template (from Zheng et al., 2023), GPT-4 tends to favor the response in the first position while ChatGPT prefers the second. For ''Vicuna-13B vs.
    ChatGPT'', GPT-4 gives Vicuna-13B win rates of 51.3% as Assistant 1 and 23.8% as Assistant 2, while ChatGPT gives 2.5% and 82.5%.'
  location: Revealing the Positional Bias
  page: 3
  quote: Based on the same evaluation template T in Table 1, GPT-4 tends to favor the response in the first position, while ChatGPT shows a preference for the response in the second position.
- id: c2
  statement: Conflict Rate is defined as the fraction of N examples where querying with T(q, r1, r2) and T(q, r2, r1) gives different evaluation results. GPT-4 had conflict rates of 46.3% (Vicuna-13B vs.
    ChatGPT) and 5.0% (Vicuna-13B vs. Alpaca-13B), ChatGPT 82.5% and 52.5%; the authors read this as LLMs being self-conflicting due to order sensitivity, with stronger models less influenced.
  location: Revealing the Positional Bias
  page: 3
  quote: These findings indicate that LLMs can be self-conflicting due to the sensitivity of the response order in the template, with stronger models being less influenced by the placement of responses.
- id: c3
  statement: 'The degree of positional bias varies with the quality difference: the lower conflict rate for ''Vicuna-13B vs. Alpaca-13B'' suggests positional bias may not affect all assessments equally
    (one potential reason given is the large quality gap between Alpaca and Vicuna). Grouping examples by score difference, GPT-4''s results are significantly affected by position when the gap is small
    (e.g. <= 1) and relatively stable when it is large (e.g. >= 3).'
  location: Revealing the Positional Bias
  page: 4
  quote: On the other hand, when the score difference between the two responses is large (e.g., score gap ≥3), GPT-4’s evaluation results are relatively stable.
- id: c4
  statement: 'Multiple Evidence Calibration: previous templates (Zheng et al., 2023; Wang et al., 2023b) draw the conclusion first and explain afterwards; because of the auto-regressive nature, that conclusion
    is not supported by the later explanation, so the evidence-calibration template asks for the explanation (evaluation evidence) first and then the scores, and MEC samples k such scores per response.'
  location: Multiple Evidence Calibration
  page: 4
  quote: However, due to the nature of the auto-regressive model, the conclusions generated by the model are not supported by the explanation generated afterward.
- id: c5
  statement: Balanced Position Calibration additionally queries with the two responses swapped; combined with MEC this gives 2k scores per response, whose average is the calibrated score, and the response
    with the higher average score is regarded as better.
  location: Balanced Position Calibration
  page: 5
  quote: and we regard the response with the higher average score as the better response.
- id: c6
  statement: Human-in-the-Loop Calibration (inspired by Cai, Chang, and Han, 2023) computes the Balanced Position Diversity Entropy, the entropy of the win/tie/lose distribution over the 2k MEC+BPC evaluation
    results; a higher BPDE means the evaluation more likely needs manual correction, and a threshold (hyper-parameter) selects the top-beta most likely biased examples for human annotation.
  location: Human-in-the-Loop Calibration
  page: 5
  quote: A higher BPDE score indicates that it is more likely the evaluation requires manual correction.
- id: c7
  statement: 'Human annotation protocol: three of the authors (researchers familiar with AI) independently annotated win/tie/lose for ChatGPT vs. Vicuna-13B responses on all 80 Vicuna Benchmark questions,
    judging helpfulness, relevance, accuracy and level of detail, with responses shown in random order (about three minutes per example); the final label is the majority of the three annotators.'
  location: Section 4.1
  page: 5
  quote: three of the authors manually annotate the “win/tie/lose” outcomes of responses from ChatGPT and Vicuna-13B independently in all 80 Vicuna Benchmark questions.
- id: c8
  statement: 'Main results stated in the text: individual human annotators reach on average 71.7% accuracy and 0.54 kappa against the majority; with MEC and BPC, ChatGPT''s accuracy improves by 14.3% and
    kappa rises from 0.06 to 0.31; ''MEC (k = 3) + BPC (k = 3)'' outperforms ''MEC (k = 6)'', which the authors take as showing that LLMs are affected by positional bias; with 20% human assistance (HITLC),
    ChatGPT attains accuracy comparable to the Human Average while cost falls from $30 to $18.3 (cost based on a near-$7.5 US minimum hourly wage and 3 minutes per example).'
  location: Main Results
  page: 6
  quote: Specifically, the accuracy is improved by 14.3%, and the kappa correlation coefficient is increased from 0.06 to 0.31;

  notes: 'Approved from candidate issue #2 (2026-10-02); carded by a subagent. Results tables not recorded; claims only. Off-theme in part: the main contribution is a drift taxonomy and a synthetic stream
    generator, not a drift detector; no detection metrics (delay, false alarms) are reported. Tagged tabular-data-generation (synthetic stream generator) and stream-classification (Hoeffding Tree / online
    learners under drift); concept-drift-detection is kept only because drift effects are characterized (MMD, conditional KL) and DDM is used for adaptation. The augmentation case study compares IncA-DES
    (Barboza et al., 2025, i.e. the first author''s own method), ARF and TabPFNv2.5; the class-generation design is described as similar to the prior-generation of TabPFN (Hollmann et al., 2025).'

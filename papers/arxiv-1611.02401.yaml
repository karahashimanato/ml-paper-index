proposes:
- 'Divide-and-Conquer Networks (DiCoNet): a split network (set/graph neural network producing binary partition probabilities) applied recursively to build a partition tree, and a merge network (Pointer
  Network or GNN) applied fine-to-coarse to combine partial solutions; split trained by policy gradient, merge by backpropagation, with an optional computational-complexity regularizer'
claims:
- id: c1
  statement: 'Both division and merging are learned: the architecture learns two scale-invariant operations, how to split an input into smaller sets and how to merge two partial solutions, each a single
    network applied recursively with shared parameters across scales.'
  location: Abstract
  page: 1
  quote: 'by learning two scale-invariant atomic operations: how to split a given input into smaller sets, and how to merge two partially solved tasks into a larger partial solution.'
- id: c2
  statement: 'Training: because the split is discrete, its parameters are trained with policy gradient (REINFORCE), while the merge is trained by standard backpropagation; the model can learn from input-output
    pairs only or from a non-differentiable reward.'
  location: Introduction
  page: 2
  quote: Since our split block is inherently discrete, we resort to policy gradient to train the split parameters, while using standard backpropagation for the merge phase
- id: c3
  statement: 'Heuristic, not exact: optimizing the cost over set partitions is described as intractable in general; if the cost is subadditive, the recursive splitting can be used as an efficient greedy
    strategy because the sum over the two halves is a surrogate upper bound that depends only on smaller sets (the paper presents this as a greedy surrogate, not as an optimality guarantee).'
  location: Learning from non-differentiable rewards
  page: 4
  quote: then the hierarchical splitting from (3) can be used as an efﬁcient greedy strategy, since the right hand side acts as a surrogate upper bound that depends only on smaller sets.
- id: c4
  statement: 'Size generalization protocol (knapsack): the model is trained on 20000 instances with n = 50 and evaluated on new instances with n = 50, 100 and 200 (uniform weights/values, capacity uniform
    in [0.2n, 0.3n]).'
  location: Knapsack
  page: 9
  quote: We generate 20000 problem instances of size n = 50 to train the model, and evaluate its performance on new instances of size n = 50, 100, 200.
- id: c5
  statement: 'Limitation: Dantzig''s greedy algorithm eventually outperforms DiCoNet at n = 200, which the authors say suggests relaxing the scale-invariance assumption or adding task-specific prior knowledge.'
  location: Knapsack
  page: 9
  quote: However, we observe that the Dantzig greedy algorithm eventually outperforms the DiCoNet for sufﬁciently large input n = 200, suggesting that further improvements may come from relaxing the scale
    invariance assumption, or by incorporating extra prior knowledge of the task.
- id: c6
  statement: 'Comparison with prior learned knapsack work: the authors state their knapsack approach does not match Bello et al. (2016) in best approximation, while arguing it uses a simpler GNN with lower
    complexity and generalizes to larger n than trained on.'
  location: Knapsack
  page: 9
  quote: This approach of the knapsack problem does not perform as good as (Bello et al., 2016) in obtaining the best approximation.
- id: c7
  statement: 'TSP (appendix, preliminary): scale invariance is weaker for TSP since it is not straightforward to build a tour from two partial tours, but the authors observe some degree of it suffices to
    improve scalability when testing beyond the training size.'
  location: Appendix C (Travelling Salesman Problem)
  page: 14
  quote: Although the scale invariance of the TSP is not as clear as in the previous problems (it is not straightforward how to use two TSP partial solutions to build a larger one), we observe that some
    degree of scale invariance it is enough in order to improve on scalability.

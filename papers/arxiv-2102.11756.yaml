    heatmap model from prior work trained to predict optimal solutions; for VRP 1 million 100-node instances solved with one LKH run (not optimal), checkpoint chosen by validation loss; for TSPTW example
    solutions from heuristic DP with a large beam. Test data: TSP/VRP validation and test sets of prior work, plus a ''more realistic'' VRP distribution where LKH by default failed on two instances and
    was rerun with unlimited routes; TSPTW instances from prior work with small time windows were solved optimally by the DP even with very small beam sizes, ''eliminating the need for a policy'', so a
    larger-time-window distribution was added; TSPTW is compared to GVNS (30 runs), LKH and BaB-DQN*/ILDS-DQN* (the latter not rerun for the larger windows). Hardware: DPDP on 4 GPUs with estimated 1-GPU
    (1080Ti) times vs 16 or 32 CPUs for HGS/LKH; the authors note GPU vs CPU comparison is hard. Heatmap threshold strategy compared against kNN sparsification. Results tables not recorded.'

proposes:
- energy / CO2e / cloud-cost estimates for training popular NLP models (measured power draw x training time reported in the original papers x PUE, converted with the U.S. EPA average)
- 'recommendations: report training time and hyperparameter sensitivity, equitable academic compute access, prioritize efficient hardware and algorithms'
claims:
- id: c1
  statement: 'Contribution: the paper quantifies the approximate financial and environmental costs of training a variety of recently successful neural NLP models, and proposes recommendations to reduce
    costs and improve equity.'
  location: Abstract
  page: 1
  quote: In this paper we bring this issue to the attention of NLP researchers by quantifying the approximate ﬁnancial and environmental costs of training a variety of recently successful neural network
    models for NLP.
- id: c2
  statement: 'Measurement: the off-the-shelf models are trained with the default settings provided (each for a maximum of 1 day, on a single NVIDIA Titan X GPU except ELMo on 3 GTX 1080 Ti GPUs) while GPU
    power is sampled via nvidia-smi (averaged over samples) and CPU power via Intel''s RAPL interface; the full training runs are not performed.'
  location: Methods
  page: 2
  quote: We train the models described in §2.1 using the default settings provided, and sample GPU and CPU power consumption during training.
- id: c3
  statement: 'Extrapolation: the total training time to completion is not measured but estimated from the training times and hardware reported in the original papers; energy is then the combined GPU, CPU
    and DRAM power draw multiplied by that time.'
  location: Methods
  page: 2
  quote: We estimate the total time expected for models to train to completion using training times and hardware reported in the original papers.
- id: c4
  statement: 'Assumption: data-center overhead (mainly cooling) is accounted for with a fixed Power Usage Effectiveness coefficient equal to the 2018 global data-center average.'
  location: Methods
  page: 2
  quote: We use a PUE coefﬁcient of 1.58, the 2018 global average for data centers (Ascierto, 2018).
- id: c5
  statement: 'Assumption: energy is converted to CO2e using the U.S. EPA average CO2 per kWh; the authors justify this by the U.S. energy mix being comparable to that of Amazon Web Services.'
  location: Methods
  page: 3
  quote: The U.S. breakdown of energy is comparable to that of the most popular cloud compute service, Amazon Web Services, so we believe this conversion to provide a reasonable estimate of CO2 emissions
    per kilowatt hour of compute energy used.
- id: c6
  statement: 'Limitation: for TPU-trained models only cloud compute cost is estimated; power and carbon footprint are omitted because TPU power draw is not publicly available.'
  location: Experimental results (Table 3 caption)
  page: 4
  quote: Power and carbon footprint are omitted for TPUs due to lack of public information on power draw for this hardware.
- id: c7
  statement: 'Recommendations: report time to retrain and sensitivity to hyperparameters, give academic researchers equitable access to compute, and prioritize efficient models and hardware.'
  location: Introduction
  page: 2
  quote: (1) Time to retrain and sensitivity to hyperparameters should be reported for NLP machine learning models; (2) academic researchers need equitable access to computational resources; and (3) researchers
    should prioritize developing efﬁcient models and hardware.

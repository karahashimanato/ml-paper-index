proposes:
- 'Synthetic overoptimization testbed: a fixed ''gold'' reward model plays the role of human labelers, labels pairs of policy samples, and proxy reward models of varying size and data are trained on those
  labels and optimized against with best-of-n sampling or PPO, while the gold score is tracked'
- 'Empirical functional forms for the gold reward as a function of d = sqrt(KL(pi || pi_init)): R_bon(d) = d(alpha_bon - beta_bon d) for best-of-n and R_RL(d) = d(alpha_RL - beta_RL log d) for RL, with
  coefficients that scale smoothly with proxy reward model size'
claims:
- id: c1
  statement: 'Setup: instead of human labels, the ground truth is the output of a ''gold'' reward model (the 6B reward model from Ouyang et al., 2022); proxy reward models range from 3M to 3B parameters.
    Synthetic comparisons between two policy rollouts for the same prompt are labeled deterministically by always preferring the rollout with the higher gold score; 100,000 synthetic comparisons are generated,
    with 10% held out to compute reward model validation loss. Policies are GPT-3 series models fine-tuned (SFT) on InstructGPT demonstrations.'
  location: Section 2
  page: 4
  quote: The 6B reward model from Ouyang et al. [2022] is used as the gold RM, and our proxy RMs vary from 3M to 3B
- id: c2
  statement: 'Main result: with d defined as the square root of KL(pi || pi_init), the gold reward is found empirically to follow R_bon(d) = d(alpha_bon - beta_bon d) for best-of-n and R_RL(d) = d(alpha_RL
    - beta_RL log d) for RL, with R(0) = 0 by definition. The authors note the RL form likely does not hold near the origin (infinite slope there). The BoN form, hypothesized with data up to n = 1,000 (KL
    about 6 nats), was then tested with n up to 60,000 (KL about 10 nats), which the authors call a true advance prediction; they could not obtain a satisfactory fit for the proxy scores.'
  location: Section 3.1
  page: 5
  quote: As this experiment was conducted after the functional form was hypothesized based on data up to 6 nats, this was a true advance prediction.
- id: c3
  statement: 'Reward model size scaling (policy 1.2B and 90,000 comparisons held fixed): alpha_bon and beta_bon for the gold score change smoothly with proxy RM size, and for RL alpha_RL can be held constant
    across RM sizes, giving a clean scaling curve for beta_RL; the authors say these laws allow predicting e.g. peak gold scores for different RM sizes, but are less confident about fits of the proxy scores.'
  location: Section 3.2
  page: 5
  quote: These scaling laws allow us to predict properties of training runs; for instance, we can also predict the peak gold RM scores for different RM sizes (ﬁg. 12).
- id: c4
  statement: 'Reward model data size (RM size fixed at 12M): more data leads to better gold scores and less goodharting; below roughly 2,000 comparisons there is very little improvement over near-chance
    loss for all RM sizes. The hypothesis that two RMs with equal validation loss are equally robust to optimization (regardless of size/data combination) receives only some weak evidence.'
  location: Section 3.3
  page: 6
  quote: Our results provide some weak evidence for this hypothesis (ﬁg. 5).
- id: c5
  statement: 'Policy size (only two policy sizes, 1.2B and 6B, were compared): the larger policy gains less from optimizing against the RM, but contrary to the authors'' expectation both gold scores peak
    at almost the same KL and the proxy-gold gap is almost the same. In the limitations, the authors note trends may exist that were not seen with only two policy sizes.'
  location: Section 3.4
  page: 6
  quote: Larger policies see less beneﬁt from optimization against an RM, but don’t overoptimize more.
- id: c6
  statement: 'RL vs best-of-n: RL ''consumes'' far more KL than BoN, so both optimization and overoptimization need more KL with RL (BoN KL grows roughly with log n, analytically KL_bon = log n - (n-1)/n).
    The authors conclude KL distance is an inadequate metric for comparing the amount of (over)optimization across methods; measured against the proxy RM score, BoN and RL look more similar.'
  location: Section 3.5
  page: 7
  quote: RL is far less KL-efﬁcient than BoN.
- id: c7
  statement: 'KL penalty: in their setting, varying the KL penalty in RL changes only how early the gold score converges, not the KL-gold reward frontier, so its effect is akin to early stopping; the authors
    caution they have seen some evidence this result could be particularly sensitive to hyperparameters. Because the penalty gave a strictly larger proxy-gold gap, all other RL runs use a KL penalty of
    0, and PPO hyperparameters are mostly defaults, so other configurations might show different trends (Section 2).'
  location: Section 3.6
  page: 7
  quote: However, we have seen some evidence that this result could be particularly sensitive to hyperparameters.
- id: c8
  statement: 'Limitations: the setting only captures overoptimization from the mismatch between the reward model and the ground-truth labels, not the mismatch between the labels and actual human intent,
    which the authors call the main limitation; the synthetic setting might not transfer to real settings (e.g. because of substantial correlation between RMs); and adversarial Goodhart is not expected
    to be captured because the models are not powerful enough, so the scaling laws may break down and the authors advise caution when extrapolating.'
  location: Section 4.5
  page: 11
  quote: The main limitation of this work is that this additional source of overoptimization is not captured in the setting of this paper.

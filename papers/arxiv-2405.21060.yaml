  notes: 'Selected for the method article requested by the user (2026-10-10): alternatives and extensions to dense Transformers (sparse mixture-of-experts routing and load balancing, state space models
    from HiPPO/S4 to Mamba-2, linear and kernelized attention, RWKV, and benchmarks/analyses comparing them with Transformers). Carded by a subagent. Results tables not recorded; claims only. Affiliations:
    Princeton (Dao), CMU (Gu); authors alphabetical. Venue from the arXiv comment (''ICML 2024''); the v1 PDF itself does not state the venue. Section numbers are from numbered headings in the PDF. Conflict
    of interest: the main baselines Mamba (arxiv-2312.00752) and FlashAttention-2 are the authors'' own work, as are the earlier SSMs discussed (S4, H3). The dual form (Section 2.4) is (L ∘ QK^T)V with
    input-dependent scalars a_i in [0, 1]; the authors relate dropping the softmax to the ''attention sink'' observation and the mask L to replacing positional embeddings. Kernel-approximation variants
    from linear attention (cosFormer, RFA, Performer, Based, ReBased) did not seem to improve over simple pointwise activations (Section 9.4.3), which the authors say may be not unexpected since those were
    derived without the mask L; adding a softmax-like normalization term introduced instabilities in most variants. Mamba-2 headline numbers and scaling curves are from figures/tables and not recorded.
    Model sizes and Pythia comparisons: Pythia was trained with the same tokenizer, dataset and 300B tokens (Section 9.2.2).'

proposes:
- 'NGBoost: multiparameter gradient boosting that fits base learners to the natural gradient of a proper scoring rule with respect to the parameters of a conditional distribution (e.g. Normal with mean
  and log-scale), modular in base learner, distribution family and scoring rule'
claims:
- id: c1
  statement: 'Motivation: in regression, GBMs output only a scalar; under squared-error loss this can be read as the mean of a Gaussian with constant variance, which the authors say has little use; predicted
    distributions need at least two parameters to convey both magnitude and uncertainty.'
  location: Introduction
  page: 2
  quote: However, such probabilistic interpretations have little use if the variance is assumed constant.
- id: c2
  statement: 'Design choice: the parameters of the conditional distribution are boosted jointly (one base learner per parameter per stage), and natural gradients are used because ordinary gradients are
    not invariant to reparameterization and the parameterization can drastically change training dynamics.'
  location: The Generalized Natural Gradient
  page: 3
  quote: Thus the choice of parameterization can drastically impact the training dynamics, even though the minima are unchanged.
- id: c3
  statement: 'Failure mode of ordinary gradients (Figure 4, toy data): examples that happen to lie close to the initial mean dominate learning, because their variances are adjusted much more aggressively
    than the wrong means of the other examples, giving simultaneous overfitting and underfitting; the natural gradient balances the updates.'
  location: Figure 4
  page: 6
  quote: With ordinary gradients, we observe that “lucky” examples that are accidentally close to the initial predicted mean dominate the learning.
- id: c4
  statement: 'Cost: one series of learners per distribution parameter (cost linear in the number of parameters p) and a p x p matrix inversion per observation; the authors state NGBoost scales like other
    boosting algorithms in N but with larger constants depending on p.'
  location: Analysis and Discussion
  page: 6
  quote: The relative increase in computational cost is thus linear in the number of distributional parameters (p).
- id: c5
  statement: 'Evaluation protocol (UCI regression, following Hernández-Lobato and Adams 2015): 10% random test split; 20% of the remaining 90% held out to choose the number of boosting stages M by log-likelihood,
    then retraining on the full 90%; repeated 20 times (Protein 5 times, Year MSD once). NGBoost used a Normal distribution, depth-3 trees, log score, learning rate 0.01 (0.1 for Year MSD).'
  location: Experiments
  page: 7
  quote: This entire process is repeated 20 times for all datasets except Protein and Year MSD, for which it is repeated 5 times and 1 time respectively.
- id: c6
  statement: 'Baseline caveat: MC dropout, Deep Ensembles and Concrete Dropout results are taken from their original papers rather than re-run; GAMLSS and Distributional Forest (200 trees, default hyperparameters)
    and a GP were run by the authors.'
  location: Probabilistic regression
  page: 7
  quote: We use the results from Gal and Ghahramani (2016) as our benchmark.
- id: c7
  statement: 'Ablation: plain multiparameter boosting with ordinary gradients most often did worse than assuming homoscedasticity, likely due to poor training dynamics, and second-order (Newton) boosting
    did even worse; natural gradients correct this.'
  location: Conclusions
  page: 9
  quote: However, us- ing multiparameter boosting to relax the homoscedasticity assumption most often results in worse performance, likely due to poor training dynamics.
- id: c8
  statement: 'Point-estimation comparison with scikit-learn baselines: gradient boosting was tuned over learning rate, depth and iterations, random forest used 500 trees with other parameters at default;
    the authors note that NGBoost was optimized for NLL rather than RMSE and was less aggressively tuned than the comparators.'
  location: Conclusions
  page: 9
  quote: This is despite the fact that the NGBoost mod- els were (a) optimized for NLL, not to minimize RMSE and (b) less aggressively tuned.

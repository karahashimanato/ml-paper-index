  notes: 'Selected for the topic article requested by the user (2026-10-03): classical algorithms (sorting, binary search, greedy) and machine learning; carded by a subagent. Results tables not recorded;
    claims only. Affiliations (title page): Kraska MIT (footnote: work done while affiliated with Google); Beutel, Chi, Dean, Polyzotis Google, Inc. Relation to binary search: the default ''model biased
    search'' differs from binary search only in that the first middle point is the model prediction (Search Strategies and Monotonicity); errors are corrected by local search, e.g. exponential search (Range
    Index, p.4). The search area is the stored min/max error per last-stage model, which guarantees finding existing keys; for non-existing keys a non-monotonic RMI may return a wrong bound unless the area
    is adjusted (p.9). Framework caveat (p.7): LIF has extra overhead (counters, virtual calls) and no SIMD intrinsics; the authors say comparisons stay fair because both sides use the framework, but reported
    numbers should account for it when compared with other implementations. Alternative baselines on Lognormal (Figure 5): 3-stage lookup table with AVX search, FAST (code from a third party), fixed-size
    B-Tree with interpolation search; the learned index there was implemented outside the benchmarking framework. The authors state they ''by no means claim that learned indexes will always be the best
    choice in terms of size or speed'' (p.12). String keys: a 10M Google document-id dataset with hybrid indexes and biased quaternary search; speedups described as ''not as prominent''. Inserts/updates
    (Appendix D.1) are discussed only as future work (appends, delta-index). Later papers: SOSD (arxiv-1911.13014#c1) and Benchmarking Learned Indexes (arxiv-2006.12804#c1) state this paper lacked an open-source
    implementation; ALEX (arxiv-1905.08898#c2) characterizes it as limited to static read-only workloads; Benchmarking Learned Indexes reports branch misses do not explain the advantage ''as originally
    claimed in [19]'' (p.1).'

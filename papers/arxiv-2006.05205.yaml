  notes: 'Selected for the method article requested by the user (2026-10-10): graph neural networks (GCN, GraphSAGE, GAT, SGC, message passing, expressive power and the WL test, oversmoothing, oversquashing,
    heterophily, and evaluation pitfalls and benchmarks). Carded by a subagent. Results tables not recorded; claims only. Affiliation: Technion. Venue from the PDF header (''Published as a conference paper
    at ICLR 2021'') and the arXiv comment (''Accepted to ICLR''2021''); year is the first arXiv version (2020). Section numbers: Section 3, 4, 4.1, 4.2, 4.4, 5, 6 and Appendix E are confirmed by cross-references
    in the PDF; the ''Preliminaries'' and ''Biological benchmarks'' sections are named only (their numbers are not stated). VarMisuse (Section 4.4, implementation of Brockschmidt, 2020 with 30 configurations
    per GNN, 6-10 layers best): the paper says the FA layer improves all GNNs on SeenProjTest and some/most on UnseenProjTest; table values not recorded. Tables 1-3 (QM9, NCI1/ENZYMES, VarMisuse) are not
    recorded. The base numbers are re-used from Brockschmidt (2020) and Errica et al. (2020) (''previously reported ... and reproduced by us'' for QM9); the acknowledgments thank Errica and Brockschmidt
    for help with their frameworks. Appendix A states that to rule out tuning as the cause of degraded Tree-NeighborsMatch performance, activations, normalization, residuals, batch sizes and weight unrolling
    were varied, and a chain-shaped control (long distance with r=2-level squashing) was fitted close to 100%. No conflict of interest found: the authors do not evaluate their own earlier GNN models.'

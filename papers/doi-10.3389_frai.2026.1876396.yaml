proposes:
- 'Hybrid pipeline: YOLOv8n-seg segmentation + EfficientNet-B0 embeddings + tabular regressors (SVR / XGBoost / CatBoost) for pig weight'
claims:
- id: c1
  statement: The paper proposes a non-invasive computer-vision approach to estimate pig weight under real farm conditions.
  location: Abstract
  page: 1
  quote: This study proposes a non-invasive computer vision–based approach to estimate pig weight under real farm conditions in San Martín, Peru.
- id: c2
  statement: Frozen-CNN image embeddings are fed to SVR, XGBoost and CatBoost, evaluated with repeated stratified cross-validation and an independent test set.
  location: Abstract
  page: 1
  quote: The resulting embeddings were used as input for supervised regression models (SVR, XGBoost, and CatBoost), evaluated using repeated stratified cross-validation and an independent test set, with
    MAE, RMSE, and R² as performance metrics.
- id: c3
  statement: Hyperparameters are tuned on a separate tuning subset of the development data, distinct from the cross-validation pool and the held-out test set.
  location: Materials and methods
  page: 6
  quote: subset represented 15% of TrainDev and was used for hyperparameter optimization, while CVPool comprised the remaining data.
- id: c4
  statement: Models are compared with a Friedman test followed by Wilcoxon post hoc tests with Holm correction.
  location: Abstract
  page: 1
  quote: Statistical comparisons were conducted using the Friedman test followed by Wilcoxon post hoc analysis with Holm correction.
- id: c5
  statement: SVR gave the best results, with statistically significant differences from the other models.
  location: Abstract
  page: 1
  quote: showing statistically significant differences compared to the other models.
- id: c6
  statement: The authors note a tendency to underestimate weight in higher weight ranges, which they take to indicate a limitation of two-dimensional images in representing the animal's full volume.
  location: Discussion
  page: 10
  quote: However, the observed tendency toward underestimation in higher weight ranges indicates a limitation of two-dimensional images in representing the full volumetric characteristics of the animal,
    as also reported in previous studies (Liu et al., 2023; Paudel et al., 2023).

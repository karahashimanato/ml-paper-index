claims:
- id: c1
  statement: The paper's position is that the assumption that progress on consequential quantitative decisions will follow from progress in LLMs is mistaken, and that the mistake is structural rather than
    a matter of present capability.
  location: Abstract
  page: 1
  quote: This paper takes the position that the assumption is mistaken, and that the mistake is structural rather than a matter of present capability.
- id: c2
  statement: Fidelity, reproducibility, lineage and calibration are argued to define a distinct model class, the Large Quantitative Model (LQM).
  location: Abstract
  page: 1
  quote: We argue that these properties define a distinct model class, which we call the Large Quantitative Model (LQM)
- id: c3
  statement: A tabular foundation model can be native to the quantitative data and still lack lineage and structural explicitness, because its representation of the domain lives in its weights.
  location: Tabular and time-series foundation models
  page: 7
  quote: A tabular foundation model can be substrate-native and still fail lineage and structural explicitness, because its representation of the domain lives in weights.
- id: c4
  statement: Citing prior literature (not its own experiments), the paper states that on tabular prediction with modest datasets, gradient-boosted trees or purpose-built tabular transformers continue to
    outperform general-purpose deep models.
  location: Empirical corroboration
  page: 5
  quote: In the setting closest to our own argument—tabular prediction on modest datasets—models designed for the statistical character of the data, whether gradient-boosted trees or purpose-built tabular
    transformers, continue to outperform general-purpose deep models
- id: c5
  statement: The paper runs no benchmark experiments of its own; its empirical evidence is one deployed system (a security-operations architecture described by Vallabhaneni et al.), which the authors say
    is not a full LQM.
  location: Evidence
  page: 10
  quote: We have one deployed test of this prediction that we can report in full.
- id: c6

proposes:
- 'Regularized Autoencoders (RAE): deterministic autoencoders whose loss is reconstruction + a latent-norm penalty + an explicit decoder regularizer (weight decay, gradient penalty or spectral normalization),
  replacing the VAE''s noise injection and KL term'
- 'Ex-post density estimation: fitting a Gaussian or a 10-component GMM to the latent codes after training, to sample from RAEs and to reduce the aggregated-posterior mismatch of VAEs and WAEs'
claims:
- id: c1
  statement: Citing several works, the authors state that even after convergence the learned aggregated posterior of a VAE rarely matches the assumed prior, which hurts the quality of generated samples.
  location: Introduction
  page: 2
  quote: Lastly, even after a satisfactory convergence of the objective, the learned aggregated posterior distribution rarely matches the assumed latent prior in practice (Kingma et al., 2016; Bauer & Mnih,
    2019; Dai & Wipf, 2019), ultimately hurting the quality of generated samples.
- id: c2
  statement: 'Key observation: with the common Gaussian assumptions and a 1-sample estimate, a VAE can be viewed as a deterministic autoencoder whose decoder input is perturbed with Gaussian noise; the
    authors argue this noise injection is a key factor in regularizing the decoder.'
  location: Deterministic regularized autoencoders
  page: 4
  quote: In this light, a VAE can be seen as a deterministic autoencoder where (Gaussian) noise is added to the decoder’s input.
- id: c3
  statement: 'Proposal: replace noise injection with explicit decoder regularization, giving a deterministic Regularized Autoencoder; without the KL term there is no fixed prior, so a generative mechanism
    must be regained separately.'
  location: Deterministic regularized autoencoders
  page: 4
  quote: We propose to substitute noise injection with an explicit regularization scheme for the decoder.
- id: c4
  statement: Ex-post density estimation (fitting a density to the latent codes after training) is proposed for RAEs and, according to the authors, can be applied to any VAE or WAE as a remedy for aggregated-posterior
    mismatch without adding cost to training.
  location: Ex-post density estimation
  page: 5
  quote: This simple approach not only ﬁts our RAE framework well, but it can also be readily adopted for any VAE or variants thereof such as the WAE as a practical remedy to the aggregated posterior mismatch
    without adding any computational overhead to the costly training phase.
- id: c5
  statement: Citing earlier work, the authors note that generative use of denoising and contractive autoencoders via MCMC was hard to diagnose for convergence, required considerable tuning and did not scale
    beyond MNIST, so they were superseded by VAEs.
  location: Related works
  page: 6
  quote: However, they are hard to diagnose for convergence, require a considerable effort in tuning (Cowles & Carlin, 1996), and have not scaled beyond MNIST, leading to them being superseded by VAEs.
- id: c6
  statement: 'Evaluation protocol: VAE, constant-variance VAE, WAE (MMD) and 2-stage VAE baselines and RAE variants use the same network architecture on MNIST, CIFAR-10 and CelebA; quality is measured with
    FID on reconstructions, random samples and interpolations (precision/recall in an appendix).'
  location: RAEs for image modeling
  page: 7
  quote: For a fair comparison, we use the same network architecture for all models.
- id: c7
  statement: 'Tuning caveat: when comparing their best FIDs with a large-scale VAE study, the authors note a slightly different architecture and that their models underwent only modest fine-tuning rather
    than an extensive hyperparameter search.'
  location: RAEs for image modeling
  page: 8
  quote: While we are employing a slightly different architecture than theirs, our models underwent only modest ﬁnetuning instead of an extensive hyperparameter search.
- id: c8
  statement: No clear winner among the decoder regularizers (gradient penalty, L2, spectral normalization), and even an autoencoder without explicit regularization obtained strong FIDs when the latent density
    was fitted with a GMM, which the authors relate to neural networks being surprisingly smooth by design.
  location: RAEs for image modeling
  page: 8
  quote: Surprisingly, the implicitly regularized RAE and AE models are shown to be able to score impressive FIDs when qδ(z) is ﬁt through GMMs.
- id: c9
  statement: Ex-post density estimation consistently improved sample quality across all settings and models in Table 1, including the VAE and WAE baselines.
  location: RAEs for image modeling
  page: 8
  quote: In Table 1, ex-post density estimation consistently improves sample quality across all settings and models.

proposes:
- 'Connection sensitivity: with auxiliary indicators c on each connection, the effect of removing connection j is approximated by g_j = dL(c * w)/dc_j at c = 1 (one forward-backward pass), normalized as
  s_j = |g_j| / sum_k |g_k|'
- 'SNIP: compute connection sensitivity on one mini-batch at a variance-scaling initialization, keep the top-kappa connections once (single shot) before training, then train the sparse network in the standard
  way'
claims:
- id: c1
  statement: 'Criterion: the importance of each connection is measured independently of its weight via auxiliary indicator variables c; removing connection j changes the loss by Delta L_j, which is approximated
    by the derivative g_j of the loss with respect to c_j at c = 1, computable for all j in one forward-backward pass; connection sensitivity is |g_j| normalized by the sum over all connections, and only
    the top-kappa connections are kept.'
  location: 'Connection sensitivity: architectural perspective'
  page: 4
  quote: 'Based on this hypothesis, we deﬁne connection sensitivity as the normalized magnitude of the derivatives:'
- id: c2
  statement: 'Critique of prior criteria: magnitude and Hessian-based saliency both depend on the scale of the weights, so they require pretraining and are very sensitive to architectural choices (e.g.
    normalization layers), and pruning is alternated with optimization many times, giving expensive prune-retrain cycles.'
  location: Section 3
  page: 3
  quote: Despite being popular, both of these criteria depend on the scale of the weights and in turn require pretraining and are very sensitive to the architectural choices.
- id: c3
  statement: 'Single-shot at initialization: because the saliency depends on the weights used to evaluate the derivative, the authors advocate variance scaling initialization so that the signal variance
    is the same throughout the network, and state they empirically show this makes the measure robust to architecture variations; the saliency can be computed on the whole training set, a mini-batch or
    the validation set, and the experiments use a single mini-batch.'
  location: Section 4.2
  page: 5
  quote: Thus, we advocate the use of variance scaling methods (e.g., Glorot & Bengio (2010)) to initialize the weights, such that the variance remains the same throughout the network.
- id: c4
  statement: 'Training cost is argued, not measured: the authors state that pruning once before training removes prune-retrain cycles and that in theory training could be an order of magnitude faster with
    sparse-matrix software; later they say training only the surviving parameters could potentially expedite training. No measured training-time or FLOP speedup was found in the text (searched for ''speed'',
    ''FLOP'', ''runtime'').'
  location: Section 3
  page: 3
  quote: Therefore, our method eliminates the need for the expensive prune – retrain cycles, and in theory, it can be an order of magnitude faster than the standard neural network training as it can be
    implemented using software libraries that support sparse matrix computations.
- id: c5
  statement: 'Experimental setup: sensitivity is computed on a batch of 100 (MNIST) or 128 (CIFAR) examples; the pruned network is trained with SGD (momentum 0.9, weight decay 0.0005, initial learning rate
    0.1 decayed by 0.1 every 25k or 30k iterations); 10% of the training data is held out as validation and the same standard augmentation is used for reference and sparse models on CIFAR. LeNet experiments
    are repeated 20 times with different seeds.'
  location: Experiments
  page: 6
  quote: We spare 10% of the training data as a validation set and used only 90% for training.
- id: c6
  statement: 'LeNet results stated in the text: errors comparable to the reference, degrading by approximately 0.7% and 0.3% when pruning 98% and 99% of the parameters in LeNet-300-100 and LeNet-5-Caffe;
    the compared methods (LWC, DNS, LC, SWS, SVD, OBD, L-OBS) are characterized as requiring pretraining, many pruning steps or additional hyperparameters. Whether the Table 1 baseline numbers were rerun
    or taken from the original papers was not found in the text (searched for ''reported'', ''taken from'').'
  location: Experiments (Comparisons to existing approaches)
  page: 7
  quote: We achieve errors that are comparable to the reference model, degrading approximately 0.7% and 0.3% while pruning 98% and 99% of the parameters in LeNet-300-100 and LeNet-5-Caffe respectively.
- id: c7
  statement: 'Comparison caveat for modern architectures (AlexNet, VGG, WRN variants on CIFAR-10; LSTM/GRU on sequential MNIST): the authors note that direct comparison with others is difficult because
    network specifications, learning policies, datasets and tasks differ, and they give only a few comparison points found in the literature.'
  location: Experiments (Various modern architectures)
  page: 8
  quote: 'We note of a few challenges in directly comparing against others: different network speciﬁcations, learning policies, datasets and tasks.'
- id: c8
  statement: 'Dependence on initialization: comparing random normal, truncated normal and two variance scaling initializations (20 seeds, 90% sparsity), differences are marginal on LeNets but variance scaling
    is essential for the RNNs; for GRU without variance scaling the pruned networks fail to reach good accuracy even with different optimizers.'
  location: Experiments (Effects of data and weight initialization)
  page: 9
  quote: Overall, initializing with a variance scaling method seems crucial to making our saliency measure reliable and model-agnostic.

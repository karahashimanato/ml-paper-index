proposes:
- 'Neural Architecture Search: an autoregressive RNN controller emits the architectural hyperparameters of a child network as a variable-length token sequence; the child is trained and its held-out validation
  accuracy is used as the reward to update the controller with REINFORCE (exponential-moving-average baseline)'
- 'Extensions of the controller: set-selection attention (anchor points with sigmoids) to propose skip connections, and a tree-structured search space for recurrent cells (combination method and activation
  per node, plus cell-memory connections)'
- Distributed asynchronous training with a parameter server, K controller replicas and m child models trained in parallel per replica
claims:
- id: c1
  statement: 'Method: a recurrent controller generates a string describing a child network; the child is trained on the real data, its validation-set accuracy is used as the reward, and the policy gradient
    of this reward updates the controller so that it assigns higher probability to architectures that receive high accuracies.'
  location: Introduction
  page: 2
  quote: Using this accuracy as the reward signal, we can compute the policy gradient to update the controller.
- id: c2
  statement: 'Training: because the reward R (validation accuracy of the trained child) is non-differentiable, the controller parameters are updated with the REINFORCE rule (citing Williams, 1992), averaged
    over m sampled architectures per batch; to reduce the high variance of this unbiased estimate, a baseline is subtracted, which is an exponential moving average of the previous architecture accuracies.'
  location: Section 3.2
  page: 4
  quote: In this work, our baseline b is an exponential moving average of the previous architecture accuracies.
- id: c3
  statement: 'Motivation relative to hyperparameter optimization (citing Bergstra et al., Snoek et al. and others): these methods only search fixed-length spaces, making it difficult to generate a variable-length
    configuration specifying network structure and connectivity, and in practice they often work better when supplied with a good initial model; Bayesian optimization methods that search non-fixed-length
    architectures exist but are described as less general and less flexible than the proposed method.'
  location: Related Work
  page: 2
  quote: Despite their success, these methods are still limited in that they only search models from a ﬁxed-length space.
- id: c4
  statement: 'Compute for the CIFAR-10 search: parameter-server shards S = 20, controller replicas K = 100 and child replicas m = 8, so 800 networks are trained on 800 GPUs concurrently at any time; each
    sampled child is trained for 50 epochs and the reward is the maximum validation accuracy of the last 5 epochs cubed, with 5,000 training examples held out as the validation set.'
  location: Section 4.1
  page: 7
  quote: which means there are 800 networks being trained on 800 GPUs concurrently at any time.
- id: c5
  statement: 'Selection protocol on CIFAR-10: after the controller trains 12,800 architectures, the architecture with the best validation accuracy is taken, a small grid search over learning rate, weight
    decay, batchnorm epsilon and the learning-rate decay epoch is run, and the best model from this grid search is run until convergence before computing test accuracy; the paper states that test performance
    is computed only once for the network that achieves the best result on the held-out validation set.'
  location: Section 4.1
  page: 7
  quote: After the controller trains 12,800 architectures, we ﬁnd the architecture that achieves the best validation accuracy.
- id: c6
  statement: 'Comparison caveats in the CIFAR-10 results: the best reported NAS error is obtained after adding 40 more filters to each layer of the searched architecture (in a setting where the controller
    predicts 13 layers, each a fully connected block of 3 layers, with pooling layers inserted at fixed positions); the authors note the DenseNet model with a lower error uses 1x1 convolutions to reduce
    parameters, which they did not do, so it is not an exact comparison.'
  location: Section 4.1
  page: 8
  quote: uses 1x1 convolutions to reduce its total number of parameters, which we did not do, so it is not an exact comparison.
- id: c7
  statement: 'Recurrent-cell search space on Penn Treebank: with base number 8, the search space has approximately 6 x 10^16 architectures, much larger than the 15,000 architectures the controller is allowed
    to evaluate; this search used S = 20, K = 400 and m = 1, i.e. 400 networks trained on 400 CPUs concurrently, with each child trained for 35 epochs.'
  location: Section 4.2
  page: 8
  quote: which is much larger than 15,000, the number of architectures that we allow our controller to evaluate.
- id: c8
  statement: 'Control experiment against random search (motivated, citing Bergstra & Bengio, 2012, by random search often being very hard to surpass): the authors state that both the best model and the
    average of the top models found with policy gradient are better than those found by random search; the comparison is reported only as perplexity improvements over iterations in a figure.'
  location: Section 4.2
  page: 10
  quote: The results show that not only the best model using policy gradient is better than the best model using random search, but also the average of top models is also much better.

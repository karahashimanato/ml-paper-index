  notes: 'Selected for the topic article requested by the user (2026-10-03): classical algorithms (sorting, binary search, greedy) and machine learning; carded by a subagent. Results tables not recorded;
    claims only. Affiliation: DeepMind (Veličković, Hadsell, Blundell); Ying and Padovano work performed while at DeepMind (title page). PDF states: Published as a conference paper at ICLR 2020. Training
    protocol: K=32 latent features, Adam, initial learning rate 0.0005, early stopping on validation predecessor accuracy (patience 10 epochs); termination assumed at |V| steps if not predicted earlier.
    No per-model hyperparameter tuning is described in the text (searched: tuned, hyperparameter, grid); all models appear to share this setup. Edge weights drawn uniformly from [0.2, 1], which the authors
    say essentially guarantees a unique solution; corner cases such as negative weight cycles are ignored and left to future work. BFS and Bellman-Ford are learned simultaneously; a curriculum (BFS first,
    then Bellman-Ford) performed worse than joint training. Appendix C: training on 100-node graphs and testing on 1000-node graphs. Table 5: training on a single graph type (Erdos-Renyi or trees) biases
    the model toward that type''s structure. Appendix B gives an information-theoretic argument (conditional mutual information) for multi-algorithm learning, assuming the two algorithms share subroutines
    (positive conditional mutual information) and that the simpler algorithm''s output can be fully learnt on its own. Prim''s algorithm (Results): a non-sequential no-algo MPNN-max variant trained to predict
    predecessors directly generalised poorly to larger graphs, weaker than even the LSTM sequential baseline. Sorting/binary search/greedy activity selection are not studied. The paper calls Prim''s algorithm
    ''sequential'' and does not use the word ''greedy'' (Prim''s is a greedy MST algorithm by standard textbook classification, not by this paper''s wording).'

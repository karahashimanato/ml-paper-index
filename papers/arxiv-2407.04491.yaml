claims:
- id: c1
  statement: RealMLP offers a favorable time-accuracy tradeoff compared with other neural baselines and is competitive with GBDTs on medium-to-large datasets.
  location: Abstract
  page: 1
  quote: RealMLP offers a favorable time-accuracy tradeoff compared to other neural baselines and is competitive with GBDTs in terms of benchmark scores.
- id: c2
  statement: Combining RealMLP and GBDTs with improved default parameters gives excellent results without hyperparameter tuning.
  location: Abstract
  page: 1
  quote: a combination of RealMLP and GBDTs with improved default parameters can achieve excellent results without hyperparameter tuning.
- id: c3
  statement: Defaults are tuned on a meta-train benchmark of 118 datasets and evaluated on a disjoint meta-test benchmark of 90 datasets.
  location: Abstract
  page: 1
  quote: We tune RealMLP and the default parameters on a meta-train benchmark with 118 datasets and compare them to hyperparameter-optimized versions on a disjoint meta-test benchmark with 90 datasets
- id: c4
  statement: The benchmarks cover medium-to-large datasets (1K-500K samples).
  location: Abstract
  page: 1
  quote: Our benchmark results on medium-to-large tabular datasets (1K–500K samples)
- id: c5
  statement: Unlike McElfresh et al., who favor tuning CatBoost over trying NNs, the authors' results favor model portfolios as in AutoML systems.
  location: Section 5
  page: 10
  quote: Unlike McElfresh et al. [43], who argue in favor of CatBoost-HPO over trying NNs, our results favor model portfolios as used in modern AutoML systems [10].
- id: c6
  statement: Trying all default (tuned-default) algorithms is faster and very often better than naive single-algorithm HPO.
  location: Section 5
  page: 10
  quote: Simply trying all default algorithms is faster and very often better than (naive) single-algorithm HPO.
- id: c7
  statement: RealMLP's tuned defaults transfer very well from meta-train to meta-test.
  location: Section 5
  page: 9
  quote: indicating that the tuned defaults transfer very well to the meta-test benchmark.
- id: c8
  statement: For GBDTs, tuned defaults match HPO on meta-train but not on meta-test (still clearly better than library defaults).
  location: Section 5
  page: 9
  quote: For GBDTs, tuned defaults are competitive with HPO on the meta-train set, but not as good on the meta-test set.
- id: c9
  statement: Using AUROC instead of classification error favors GBDTs.
  location: Section 6
  page: 10
  quote: For classification, using AUROC instead of classification error (Figure 3, Appendix B.5) favors GBDTs.
- id: c10
  statement: Aggregation metrics other than the shifted geometric mean reduce the advantage of tuned-default methods.
  location: Section 6
  page: 10
  quote: The use of different aggregation metrics than the shifted geometric mean reduces the advantage of TD methods
- id: c11
  statement: Non-architectural aspects are not equalized across NN models, so the work is not a comparison of architectures.
  location: Section 6 Limitations
  page: 10
  quote: our work should therefore not be seen as a comparison of architectures.
- id: c12
  statement: Generalization of the defaults to very small data, distribution shift, missing numerical values and other metrics such as log-loss is unclear.
  location: Section 6 Limitations
  page: 10
  quote: it is unclear to which extent the obtained defaults can generalize to very small datasets, distribution shifts, datasets with missing numerical values, and other metrics such as log-loss.
- id: c13
  statement: Each dataset is evaluated on 10 random 60/20/20 train/validation/test splits.
  location: Section 2.2
  page: 4
  quote: we evaluate a method on Nsplits = 10 random training-validation-test splits (60%-20%-20%) on each dataset.
- id: c14
  statement: HPO uses 50 steps of random search per split and dataset.
  location: Section 5
  page: 7
  quote: Hyperparameters optimized separately for every train-test split on every dataset, using 50 steps of random search.
- id: c15
  statement: XGBoost results on some (mainly meta-test) datasets are affected by a bug in handling rare categories.
  location: Figure 2 caption
  page: 8
  quote: Note that XGB results on some (mainly meta-test) datasets are affected by a bug in handling rare categories, see Appendix B.
- id: c16
  statement: On the electricity dataset MLPs struggle to learn high-frequency patterns.
  location: Section 5
  page: 9
  quote: where MLPs struggle to learn high-frequency patterns
- id: c17
  statement: Among GBDTs, CatBoost defaults are better but slower.
  location: Section 5
  page: 9
  quote: Among GBDTs, CatBoost defaults are better and slower.
- id: c18
  statement: RealMLP's numerical preprocessing (robust scaling + smooth clipping) is easy to adopt and often helps other NNs.
  location: Section 6
  page: 10
  quote: our numerical preprocessing is easy to adopt and often beneficial for other NNs as well
- id: c19
  statement: Label smoothing is influential but can hurt metrics like AUROC.
  location: Section 6
  page: 10
  quote: label smoothing is influential but can be detrimental for metrics like AUROC
- id: c20
  statement: A single training-validation split per train-test split means HPO can overfit the validation set more easily than with cross-validation.
  location: Section 6 Limitations
  page: 10
  quote: This means that HPO can overfit the validation set more easily than in a cross-validation setup.
- id: c21
  statement: With good default parameters it is worth trying both NNs and GBDTs, even with a moderate time budget.
  location: Section 7
  page: 10
  quote: with good default parameters, it is worth trying both algorithm families even with a moderate training time budget.

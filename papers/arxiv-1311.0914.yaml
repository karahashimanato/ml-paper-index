  notes: 'Selected for the topic article requested by the user (2026-10-03): algorithm design techniques (divide and conquer, dynamic programming, branch and bound, local search) and machine learning; carded
    by a subagent. Results tables not recorded; claims only. Single-level cost: k equal subproblems take O(n^3/k^2) time and O(n^2/k^2) memory instead of O(n^3)/O(n^2). Theorem 1: 0 <= f(alpha_bar) - f(alpha*)
    <= (1/2) C^2 D(pi); Theorem 2 gives a sufficient condition under which a non-support vector of the subproblem is not a support vector of the whole problem; Theorem 3 refines the bound to the support-vector
    set. Kernel k-means is O(n^2 d), so a two-step kernel k-means on m=1000 sampled points is used (later levels sample from current support vectors). Multilevel: 5 levels with k=4 (1, 4, 16, 64, 256 clusters);
    DC-SVM (early) stops at 64 clusters. Hardware: Intel Xeon X5355 2.66GHz, 8GB RAM. Datasets: ijcnn1, cifar (animals vs non-animals), census, covtype, webspam, kddcup99, mnist8m (round vs non-round digits);
    random 80/20 splits for covtype/webspam/kddcup99. Baselines: LIBSVM (modified to drop the bias term), CascadeSVM, LaSVM (1 pass), SpSVM (200 basis vectors), LLSVM (rank 3000), FastFood (about 3000 Fourier
    features), LTPU (3000 clusters); stopping tolerance 1e-3 (LIBSVM default) for LIBSVM and DC-SVM; baselines'' rank/feature counts are varied in Figure 3. A grid of 25 (C, gamma) settings per dataset
    (Tables 7-10, appendix) reports DC-SVM faster than LIBSVM on 96/100 settings. Polynomial-kernel experiments on covtype and webspam exclude LLSVM/FastFood/LTPU (developed for shift-invariant kernels).
    The paper criticises Cascade SVM for not identifying support vectors accurately (no kernel k-means; cannot correct false negatives from lower levels). Task tags: tabular-classification for the UCI/LIBSVM
    sets, image-classification for cifar/mnist8m binary tasks. Results not recorded.'

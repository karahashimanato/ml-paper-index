  notes: 'Selected for the topic article requested by the user (2026-10-10): causal effect estimation with machine learning (identification assumptions, meta-learners and double/debiased ML, causal trees
    and forests, Bayesian trees, representation-learning networks, overlap, model selection without ground truth, and benchmarking practice). Carded by a subagent. Results tables not recorded; claims only.
    Venue: page 1 footer ''31st Conference on Neural Information Processing Systems (NIPS 2017), Long Beach, CA, USA'' and arXiv comment ''Published as a conference paper at NIPS 2017''. Section headings
    other than the Introduction are unnumbered in the text dump, so locations use section names. Conflict of interest: Shalit and Sontag co-authored the TARnet/CFR baseline [48] (arxiv-1606.03976) and the
    BNN baseline [25] (arxiv-1605.03661), and the acknowledgements thank Fredrik D. Johansson for providing the IHDP and Jobs data. Evaluation: IHDP and Jobs are used as existing benchmarks ''where there
    is no need to model proxies'' (Experiments); a toy mixture-of-Gaussians dataset with binary hidden z, and Twins. Architecture follows TARnet: 3 hidden ELU layers, 20-dimensional z, weight decay 1e-4,
    Adamax with learning rate 0.01, early stopping on the validation lower bound. Qualitative text statements (from figures, not recorded as results): on Twins CEVAE is described as ''much more robust to
    increasing proxy noise'', but at low noise levels ''CEVAE does slightly worse than the other methods'' for ATE. The Twins ATE (-2.5%, mortality 18.9% vs 16.4%) is a property of the data. Twins treatment
    assignment: t ~ Bern(sigmoid(w_o^T x + w_h(z/10 - 0.1))), w_o ~ N(0, 0.1 I), w_h ~ N(5, 0.1).'

  notes: 'Approved from candidate issue #1 (2026-10-02); carded by a subagent. Results tables not recorded; claims only. Application domain: oncology (3-year survival classification from clinical + copy-number
    data; AACR GENIE and TCGA). bioRxiv preprint, not peer reviewed. The text encoder is DeBERTa-v3-large (an encoder, not a generative LLM), so large-language-models was not used; deep-learning is the
    closest family. The DeMoP checkpoint is chosen by validation weighted F1; how the validation set is formed is not found in the text. Tabular deep models (TabPFN, TabTransformer, FT-Transformer) are
    cited but not used as baselines. Authors declare no competing interests.'

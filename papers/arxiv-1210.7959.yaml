  notes: 'Selected for the topic article requested by the user (2026-10-03): model fallback and model selection in MLOps (meta-learned selection, dynamic selection, abstention/deferral, switching triggers,
    cascades/routing, monitoring); carded by a subagent. Results tables not recorded; claims only. Survey; no experiments of its own. Affiliation stated: 4c.ucc.ie email address. Rice''s four selection
    criteria include ''best selection for all mappings and problems'' (per-instance) and ''best selection for a subclass of problems'' (a single algorithm for a subclass, i.e. per-set); the survey says
    the latter cases are more common in practice. It also cites Guo (2003) that the Algorithm Selection Problem is undecidable in general and says a mapping that generalises well may be preferable to the
    best-performing one. Dynamic features (computed during search) are the only ones that use performance on the current problem, allowing remedial action when a problem is unlike anything seen before (Features
    section). Feature cost: Xu et al. (2009) fall back to a default selection when feature computation is predicted too expensive. Misclassification-penalty weighting (Gent et al. 2010) is described for
    training selectors. The terms ''virtual best solver'' and ''oracle'' were not found in the text; the Summary only states some systems have come very close to always choosing the best algorithm. Tag
    note: the family tag dynamic-ensemble-selection is an approximation and does not describe this paper accurately. The survey is about per-instance algorithm selection from solver portfolios (and schedules)
    for combinatorial search problems, not about ensembles of classifiers; no existing family tag covers algorithm portfolios, and dynamic-ensemble-selection (choosing which models to use for each input)
    was the closest.'

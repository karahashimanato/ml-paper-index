  notes: 'Selected for the topic article requested by the user (2026-10-03): algorithm design techniques (divide and conquer, dynamic programming, branch and bound, local search) and machine learning; carded
    by a subagent. Results tables not recorded; claims only. PDF states: Copyright 2021, Association for the Advancement of Artificial Intelligence (AAAI). Training: 990,000 random instances of size m with
    Concorde solutions as labels; m=20 for data set 1 (10,000 instances each of n=20, 50, 100, a set widely used by prior learning work) and m=50 for data set 2 (128 instances each of n=200, 500, 1000 and
    16 of n=10,000), all uniform in the unit square. Merge: P_ij averages the sub-graph probabilities over the O_ij sub-graphs containing edge (i,j); edges with P_ij < 1e-4 are eliminated. Hyperparameters
    omega=5, alpha=1, beta=10, H=10n set as defaults; time budget T=10n ms (set 1) and 40n ms (set 2), chosen so the method uses no more time than the best learning algorithm of each reference paper. Gaps
    are w.r.t. Concorde for n <= 1000 and w.r.t. LKH3 for n = 10,000, where Concorde, Gurobi and two GAT models exceeded the 5-hour limit and the three GCN models of Joshi et al. ran out of memory. No optimality
    guarantee is claimed: MCTS returns the best tour found when the time limit T elapses. The comparison with the MCTS method of Xing et al. [43] uses that paper''s reported gaps on different platforms
    (code unavailable), which the authors acknowledge. The method avoids hand-crafted rules such as LKH''s alpha-nearness and POPMUSIC to keep generality. End-to-end ML models without post-optimization
    were omitted as producing very poor results. Ablation (Table 4): giving every edge equal probability and running MCTS alone degrades performance drastically, with a huge gap to optimality on each data
    set. For data set 1 some learning baselines'' parameters (e.g. beam-search width) were adapted to prolong their running time, marked in blue in Table 1. Paradigm tag reinforcement-learning follows the
    paper''s description of MCTS as an RL method. Results not recorded.'

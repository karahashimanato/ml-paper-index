claims:
- id: c1
  statement: 'Method: Chronos-2 uses a group attention mechanism that enables in-context learning by sharing information across the series in a group (related series, variates of a multivariate series,
    or targets and covariates).'
  location: Abstract
  page: 1
  quote: Chronos-2 employs a group attention mechanism that facilitates in-context learning (ICL) through efficient information sharing across multiple time series within a group
- id: c2
  statement: 'Leakage on GIFT-Eval: the pretraining corpus was checked not to overlap with GIFT-Eval test portions, but it does partially overlap with the training portions of some GIFT-Eval datasets; for
    strictly zero-shot results the authors point to a synthetic-data-only variant.'
  location: Results (GIFT-Eval)
  page: 10
  quote: Nonetheless, the corpus does include partial overlap with the training portions of some GIFT-Eval datasets.
- id: c3
  statement: 'Zero-shot status on fev-bench: according to the authors, none of the fev-bench datasets or tasks were seen by Chronos-2 during training.'
  location: Results (fev-bench)
  page: 9
  quote: None of these datasets or tasks were seen by Chronos-2 during training.
- id: c4
  statement: 'Evaluation practice: on fev-bench, both the baseline results and the imputation strategy for handling data leakage in certain tasks were taken from Shchur et al. (2025).'
  location: Results (fev-bench, Table 3 caption)
  page: 8
  quote: Baseline results and the imputation strategy for handling data leakage in certain tasks are both taken from Shchur et al. (2025).
- id: c5
  statement: 'Baseline scope: only pretrained models and statistical baselines (AutoARIMA, AutoETS, AutoTheta and their ensemble) are compared; task-specific deep learning models are excluded, citing prior
    studies (GIFT-Eval, Chronos) that found pretrained models comparable or better on average.'
  location: Experiments
  page: 8
  quote: We compare Chronos-2 only with the aforementioned models and exclude task-specific deep learning models from our evaluation
- id: c6
  statement: 'Mixed finding: on the multivariate subset of fev-bench, ICL gave only modest gains over univariate inference, which the authors read as suggesting the benefits of explicit multivariate modeling
    can be limited; the largest ICL gains were on tasks with covariates.'
  location: Improvements with In-context Learning
  page: 11
  quote: This suggests that while these tasks involve multiple variates with potentially shared dynamics, the benefits of explicit multivariate modeling can be limited.
- id: c7
  statement: 'Affiliation: the title page lists Amazon Web Services / Amazon (some authors also list universities; two contributed as AWS interns), and the footnote states that the report describes work
    performed at Amazon. The compared models include Chronos-Bolt, described in the paper as the latest publicly released version of Chronos.'
  location: Title page (footnote)
  page: 1
  quote: Hao Wang and Pablo Guerron hold concurrent appointments at Amazon and their corresponding universities, and this report describes work performed at Amazon.
- id: c8
  statement: 'Zero-shot status on Chronos Benchmark II: according to the authors, none of its datasets were included in the training corpus of Chronos-2.'
  location: Results (Chronos Benchmark II)
  page: 10
  quote: None of these datasets were included in the training corpus of Chronos-2.

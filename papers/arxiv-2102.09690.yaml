  notes: 'Selected for the topic article requested by the user (2026-10-11): pitfalls in evaluating large language models (benchmark contamination and its detection, prompt and answer-format sensitivity,
    LLM-as-a-judge biases, human-preference arenas, holistic evaluation, benchmark errors, and reproducibility of evaluation harnesses). Carded by a subagent. Results tables not recorded; claims only. Affiliations:
    UC Berkeley (Zhao, Wallace, Klein), University of Maryland (Feng), UC Irvine (Singh). Venue: the arXiv comment says ''ICML 2021''; no venue statement was found in the v2 PDF text (searched for Proceedings,
    ICML); recorded from the arXiv comment. No dated GPT-3 engine names were found in the text (searched for davinci, curie, babbage); GPT-3 sizes are given only as 2.7B/13B/175B, accessed via the OpenAI
    API with academic access acknowledged. Footnote 4 states the goal is distinct from statistical calibration (aligning confidence with accuracy). The choice of content-free input matters, ''however, many
    good choices exist'' (Section 5.2, Appendix A Table 3); contextual calibration is reported to be close to an oracle calibration that fits W on the validation set (AGNews, figure only). Conclusion: small
    but non-trivial decisions such as calibration ''can greatly influence results'', which ''makes it difficult to correctly develop and compare new methods''. An alternate setting (b = -p_cf, W = I) is
    reported to give higher accuracy for generation tasks (footnote 7). Results (Table 1, GPT-2 Table 4) not recorded.'

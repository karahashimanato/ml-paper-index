claims:
- id: c1
  statement: TabBench-Bio is a living, interactive benchmark of 43 biomedical datasets.
  location: Abstract
  page: 1
  quote: We introduce TabBench-Bio, a living and interactive benchmark of 43 biomedical datasets spanning multiple domains.
- id: c2
  statement: At the reference cell (10,000 features, 100 training samples), RealTabPFN 2.5 has the highest point estimate, closely followed by TabPFN 3 and Logistic Regression.
  location: Abstract
  page: 1
  quote: At the reference cell of 10,000 features and 100 training samples, RealTabPFN 2.5 has the highest point estimate, closely followed by TabPFN 3 and Logistic Regression.
- id: c3
  statement: All peer models use the default configuration of their AutoGluon adapter without per-dataset hyperparameter search, with bagging/stacking/ensembling disabled; tuning effects are not evaluated.
  location: Models and fitting regime
  page: 4
  quote: Results concern these fixed configurations; the effects of bagging and hyperparameter tuning are not evaluated.
- id: c4
  statement: Evaluation uses 5-fold cross-validation with folds shared across all grid cells and models (group folds when biological group identifiers are available).
  location: Cross-validation and leakage control
  page: 4
  quote: We use 5-fold cross-validation, with complementary folds shared across all cells and models.
- id: c5
  statement: Under AUROC (TabArena's binary metric) instead of macro-F1, Logistic Regression drops out of the leading group, so part of the contrast with TabArena reflects threshold placement rather than
    the domain alone.
  location: Discussion
  page: 8
  quote: under AUROC, the metric TabArena uses for binary classification, Logistic Regression drops out of the leading group and the top 6 places are held by tabular foundation models (Appendix E), so part
    of the contrast reflects threshold placement rather than the domain alone.
- id: c6
  statement: Three benchmark datasets come from the same collection that supplied datasets used in TabDPT pretraining, so TabDPT results on them should be interpreted with this overlap in mind.
  location: Limitations
  page: 8
  quote: TabDPT performance on these related datasets should therefore be interpreted with this overlap in mind.

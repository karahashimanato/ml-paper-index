    year 2023 is the first arXiv version. Section numbers from numbered headings in the PDF (3, 3.1, 3.2, 4, 5.1, 5.2, 6). Affiliations include Yandex Research; two of the new datasets come from Yandex-related
    platforms (Toloka crowdsourcing, Yandex Q). The homophily measure used (adjusted homophily) and label informativeness are the authors'' own earlier proposals (Platonov et al., 2022). squirrel and chameleon
    are treated as directed (as most heterophily codebases do); duplicate-edge observations apply to the SNAP version of these datasets (Appendix D). All accuracies/ROC AUCs are in tables and are not recorded.
    Comparison to the large-scale heterophilous benchmark of Lim et al. (2021) is in Appendix C.'

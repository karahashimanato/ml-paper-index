  notes: 'Selected for the topic article requested by the user (2026-10-11): pitfalls in evaluating large language models (benchmark contamination and its detection, prompt and answer-format sensitivity,
    LLM-as-a-judge biases, human-preference arenas, holistic evaluation, benchmark errors, and reproducibility of evaluation harnesses). Carded by a subagent. Results tables not recorded; claims only. All
    authors are affiliated with Scale AI (PDF first page). Venue from the PDF footer (''38th Conference on Neural Information Processing Systems (NeurIPS 2024) Track on Datasets and Benchmarks'') and the
    arXiv comment; year 2024 is both the first arXiv version and the venue year. Section numbers 3 and 4 are from cross-references (''described in Section 3'', ''objective results in Section 4''); the Analysis
    section is referenced by name. Conflict of interest: the benchmark was built and owned by the authors'' company (dataset documentation: annotators ''hired by Scale AI'', ''Scale AI commissioning the
    construction of this dataset'', about $180,000 paid to annotators; a ''special team within Scale'' did quality audits); no explicit competing-interest statement was found (searched for conflict, competing).
    The dataset was withheld from public release with a precommitted release (Section 3: when three open-source models of different lineages reach 95% or June 2025; the Introduction words the first condition
    differently as ''the top open source models score over 95%''); proprietary-model evaluation required sending the data via API, so a small set of extra problems is held out. Wording difference: the abstract
    writes ''Spearman’s r2 = 0.36'' while Lesson 4 calls 0.36 a Spearman''s rank correlation. Other details: 3 review layers, 2108 initial problems -> 1419 passed the second solve -> 1375 passed quality
    audit -> 1205 after answer-magnitude matching; human distinguishability 21.83% over 1205 attempts with 19 annotators (20% chance); difficulty estimate by counting calculator tags is described as only
    rough. Lesson 3 states overfit models are still capable of reasoning (e.g. Phi-2 solves over half of GSM1k). Per-model accuracies and gaps are in figures/Appendix F and are not recorded.'

    as given in the task; the PDF itself only says ''Copyright 2020 by the author(s)'' and thanks ''the four anonymous ICML 2020 reviewers'', so the PDF text alone does not confirm acceptance. The paper
    argues that the claim in Wilson & Izmailov (2020, Section 8.3) that cold posteriors equal untempered posteriors of a modified likelihood is wrong (Section 6, Appendix M); it also points to ''Masegosa
    posteriors'' as a possibly better target. SG-MCMC uses a fully tempered energy (likelihood and prior), cyclical cosine step size and layerwise preconditioning; HMC comparison only on small MLPs with
    synthetic data. All results are figures; none recorded. IMDB is sentiment text classification, for which no registered task tag exists.'

proposes:
- 'Optuna: a hyperparameter optimization framework with a define-by-run API (the search space is constructed dynamically by trial.suggest calls inside the objective), independent (e.g. TPE) and relational
  (e.g. CMA-ES, GP-BO) samplers, pruning via a variant of Asynchronous Successive Halving, and a storage-based architecture from in-memory to distributed RDB backends'
claims:
- id: c1
  statement: 'Define-by-run: borrowing the term from deep-learning frameworks, Optuna lets the user construct the search space dynamically during the objective''s execution (via trial suggest calls, with
    ordinary loops and conditionals), instead of defining the whole space in advance.'
  location: Define-by-run API
  page: 2
  quote: Following the original deﬁnition, we use the term deﬁne-by-run in the context of optimization framework to refer to a design that allows the user to dynamically construct the search space.
- id: c2
  statement: The authors claim that all previous hyperparameter optimization frameworks require the user to construct the search space statically for each model, which they argue is extremely hard for large
    experiments with many model types and conditional variables.
  location: Introduction
  page: 1
  quote: Firstly, all previous hyperparameter optimization frameworks to date require the user to statically construct the parameter-search
- id: c3
  statement: 'Sampling: Optuna supports independent sampling (e.g. TPE) and relational sampling (e.g. CMA-ES, GP-BO), identifying concurrence relations among parameters after some independent samplings;
    the authors note that independent sampling is not necessarily naive and that cost-effectiveness depends on environment and task. No statement that TPE is the default sampler was found in the text (searched
    for default).'
  location: Efficient Sampling and Pruning Mechanism
  page: 4
  quote: The independent sampling is not necessarily a naive option, because some sampling algorithms like TPE [6] are known to perform well even without using the parameter correlations, and the cost eﬀectiveness
    for both relational and independent sampling depends on environment and task.
- id: c4
  statement: 'Pruning: intermediate values are reported via report and checked via should_prune; the pruner is a variant of Asynchronous Successive Halving that promotes trials within the top 1/eta of their
    rung; to avoid storing many checkpointed configurations the implementation does not allow repechage.'
  location: Efficient Sampling and Pruning Mechanism
  page: 5
  quote: our implementation does not allow repechage
- id: c5
  statement: 'Sampler benchmark protocol: on a collection of 56 black-box optimization test cases, TPE+CMA-ES (TPE for the first 40 steps, CMA-ES afterwards) is compared with random search, Hyperopt, SMAC3
    and GPyOpt using the best value found in 80 trials, 30 repetitions per study and a paired Mann-Whitney U test with alpha = 0.0005, following Dewancker et al.'
  location: Experimental Evaluation
  page: 6
  quote: For TPE+CMA-ES, we used TPE for the ﬁrst 40 steps and used CMA-ES for the rest.
- id: c6
  statement: In that benchmark the GP-based GPyOpt performed better than TPE+CMA-ES in 34 of 56 cases, while TPE+CMA-ES took an order of magnitude less time per trial; the authors suggest the user may use
    a GP-based method if the time of evaluation is a bottleneck.
  location: Experimental Evaluation
  page: 6
  quote: Meanwhile, GPyOpt performed better than TPE+CMA-ES in 34/56 cases in terms of the best-attained loss value.
- id: c7
  statement: 'Pruning evaluation protocol: simplified AlexNet (8 hyperparameters) on SVHN, each study on one Tesla P100 GPU stopped after 4 hours and repeated 40 times; the reported curves are average test
    errors. Whether the optimized objective was a validation or test error was not found stated for this experiment (searched for validation).'
  location: Section 5.2 (Performance Evaluation of Pruning)
  page: 7
  quote: We repeated each study 40 times.
- id: c8
  statement: The authors report that their ASHA implementation significantly outperforms median pruning (featured in Vizier) and conclude that a sampling algorithm alone is not sufficient for cost-effective
    optimization, because per-trial computational cost is the bottleneck.
  location: Section 5.2 (Performance Evaluation of Pruning)
  page: 7
  quote: This result also suggests that sampling algorithm alone is not suﬃcient for cost-eﬀective optimization.
- id: c9
  statement: 'Distributed optimization with TPE on 1, 2, 4 and 8 workers: the authors note that for sequential model-based methods such as TPE the number of workers need not translate into efficiency, but
    observe that scores per number of trials barely change with the number of workers, i.e. performance scales linearly with workers (also with ASHA pruning).'
  location: Performance Evaluation of Distributed Optimization
  page: 7
  quote: Note that the optimization scores per the number of trials (i.e., parallelization eﬃciency) barely changes with the number of workers.

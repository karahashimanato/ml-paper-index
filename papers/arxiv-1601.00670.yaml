  notes: 'Selected for the method article requested by the user (2026-10-07): approximate Bayesian inference and its diagnostics (HMC/NUTS and SG-MCMC, variational inference, R-hat, PSIS, SBC, VI error
    bounds, Bayesian workflow). Carded by a subagent. Results tables not recorded; claims only. Venue from the arXiv journal_ref (JASA); the v9 PDF itself (dated May 11, 2018) does not state it. Section
    numbers are from numbered headings in the PDF text (2.2 ELBO, 2.3 mean-field family, 2.5 Practicalities, 4.3 SVI by cross-reference, 5.2 Theory, 5.4 Open problems). The review focuses on KL(q||p)-based
    VI (footnote 1: expectation propagation, belief propagation, Laplace are mentioned as other ''variational'' methods). Theory (Section 5.2) states results are mostly of the type ''VI posterior means
    as point estimates have the usual frequentist asymptotics'', each for a single model and variational family, and cites Wang and Titterington (2005) for the asymptotic variational posterior covariance
    being ''too small''. Open problems (Section 5.4) also list alternative divergences (e.g. alpha-divergences, EP), and say mean-field independence assumptions can exacerbate local optima and underestimation
    of posterior variances; the final open problem is understanding VI as an estimator. Self-citation: the geometry argument cites Kucukelbir et al. (2015) (ADVI, by two of the authors), and the SVI section
    summarizes Hoffman et al. (2013) (co-authored by Blei); see arxiv-1603.00788 and arxiv-1206.7051. No experiments beyond illustrative examples (mixture of Gaussians on images, LDA on 1.8M NYT articles
    reproduced from Hoffman et al.).'

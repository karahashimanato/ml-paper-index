  notes: 'Selected for the topic article requested by the user (2026-10-03): classical algorithms (sorting, binary search, greedy) and machine learning; carded by a subagent. Results tables not recorded;
    claims only. Affiliation: both authors Google Brain (title page). PDF states: Published as a conference paper at ICLR 2016. Training data: 10k random examples per training length (about 200k total for
    up to 20-bit numbers). Curriculum: train on longer numbers only after crossing a progress threshold on shorter ones, with 20% random-length minibatches. Dropout was stated to be necessary for multiplication
    models that generalize to 2000 bits, and parameter sharing relaxation ''crucial for learning multiplication''. Ensembles of 5 models are said to ''almost always generalize perfectly on binary tasks''.
    Model selection: Section 3.3 states ''Each result we report is obtained by running a grid search over 3^6 = 729 instances'' (3 settings each of learning rate, initial parameter scale, relaxation pull
    factor, curriculum progress threshold, gradient noise scale, dropout); for the stack-RNN baseline the text says the best of 729 seeded runs is reported; for the Neural GPU the text does not spell out
    the selection rule among the 729 runs. Loss: softmax over output logits with negative log probability of the target (output symbols only); no supervision on intermediate algorithm steps is described.
    Data efficiency: with only about 100 examples per length, some binary addition models generalized to 200-bit numbers, but the authors never managed to train a good binary multiplication model with that
    little data. Additional failure mode from the text (Discussion): decimal inputs degrade performance; long decimal multiplication was not learned, while m=128 allows learning all other tasks in decimal.
    CLRS algorithms are not used (paper predates CLRS).'

  notes: 'Selected for the method article requested by the user (2026-10-10): deep learning architectures for tabular data (TabNet, NODE and differentiable trees, TabTransformer/FT-Transformer-style attention,
    SAINT, embeddings for numerical features, retrieval (TabR), regularized MLPs, CTR-style interaction models, self-supervised pretraining, and surveys/benchmarks comparing them with GBDTs). Carded by
    a subagent. Results tables not recorded; claims only. Affiliations: SinoPac Holdings (all authors) and National Cheng Kung University (Chang). Venue from the PDF footer (''Proceedings of the 40th International
    Conference on Machine Learning, Honolulu, Hawaii, USA. PMLR 202, 2023'') and the arXiv comment ''ICML''23 (poster)''. The arXiv author list gives ''Tien-Hao Chang''; the PDF prints ''Darby Tien-Hao
    Chang'' - the arXiv form is recorded. No conflict of interest found: none of the baselines (Grinsztajn45 models, LightGBM, CatBoost, FT-Transformer, SAINT) are by these authors. Main comparisons are
    figure-only (normalized score vs number of search iterations, Figures 1, 5-8); numbers in Appendix B.1 tables are not recorded. The authors note the flat curve ''suggests'' Trompt performs well with
    default hyperparameters and that its performance after an exhaustive search is left for future exploration (Section 4.2.1). Appendix C: standardization of regression targets gave better Trompt results
    than the benchmark''s quantile transformation, but Section 4.2 used the Grinsztajn45 configuration. LightGBM search space follows practitioners'' blog posts and CatBoost follows FT-Transformer (Appendix
    F). The tabular-attention tag reflects the attention-based baselines (FT-Transformer, SAINT) and Trompt''s softmax-over-columns importances; the authors contrast Trompt with self-attention (Section
    5.1).'

proposes:
- Recipe for training a JEPA latent term beside the value objective of a tabular foundation model without collapse
- Open-horizon plateau stopping rule for comparing training arms
claims:
- id: c1
  statement: 'A recipe lets the JEPA latent term survive to convergence beside the value objective: the value head reads the encoder field and the target is an EMA difference.'
  location: Abstract
  page: 1
  quote: 'We report a recipe under which the latent term survives to convergence beside the value objective: the value head reads the encoder field rather than the predictor, and the target is an exponential
    moving average (EMA) difference.'
- id: c2
  statement: The JEPA recipe does not beat the value-only arm at convergence, and the authors do not claim it does.
  location: Introduction
  page: 2
  quote: The recipe does not beat the value-only arm at convergence, and we do not claim that it does (§4.3).
- id: c3
  statement: 'Evaluation suite: classification and regression datasets drawn from OpenML-CC18, the Grinsztajn benchmark and TabArena.'
  location: Experimental setup
  page: 4
  quote: The real-data suite holds 115 classification and 32 regression datasets from OpenML-CC18, the Grinsztajn benchmark and TabArena (Bischl et al., 2021; Grinsztajn et al., 2022; Erickson et al., 2025).
- id: c4
  statement: Each model gets a capped context and feature budget (features chosen by an F-test before the split) and is scored on 3 random halves with a capped test size.
  location: Appendix
  page: 12
  quote: give each model at most 1,024 rows of context and 64 features picked by an F-test ahead of the split, average 3 random halves scoring no more than 512 test rows in each
- id: c5
  statement: Neither foundation-model arm beats gradient-boosted trees (HistGB) on the suite.
  location: Results
  page: 7
  quote: Neither arm beats gradient-boosted trees, with ds at 28:84 on classification and 4:28 on regression and jepa at 27:87 and 3:29 (Figure 4).
- id: c6
  statement: 'Limitation: one seed per arm is the sharpest limit on every claim.'
  location: Limitations
  page: 8
  quote: One seed per arm is the sharpest limit on every claim, because the sign test spans datasets rather than seeds and the noise floor comes from a second run of the same seed, which a second seed would
    be expected to widen (§4.1).

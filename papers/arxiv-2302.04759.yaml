  notes: 'Selected for the topic article requested by the user (2026-10-07): Bayesian change point detection (online BOCPD and its extensions, offline Bayesian changepoint analysis, evaluation and applications).
    Carded by a subagent. Results tables not recorded; claims only. Affiliations: University College London; The Alan Turing Institute. Venue from the PDF first page (''Proceedings of the 40th International
    Conference on Machine Learning, Honolulu, Hawaii, USA. PMLR 202, 2023''); the arXiv record has no comment. Conflict of interest: the last author (Knoblauch) is the first author of β-BOCD (arXiv 1806.02261),
    the main robust baseline. Section numbers are confirmed by numbered headings in the PDF. Real-data examples (Twitter flash crash DJIA, FTT/Bitcoin crypto crash, well-log, UK 10-year bond yield) are
    evaluated visually against known events/outliers without numeric metrics; the multivariate synthetic (exponential + Gaussian) and gamma-modelled bond-yield examples are cases where standard Bayes is
    not conjugate, so no BOCD comparison is made. Appendix C.2: Dm-BOCD with m = identity (unweighted score matching) also labels outliers as CPs; with k = 1 run length kept no CP is detected. Changepoints
    are reported as MAP segmentations. Run-length pruning keeps the k = 50 most probable run lengths in all experiments. ω* was selected on the first 50 (Twitter flash crash), 200 (well-log) and 100 (UK
    bond yield) observations; ω was fixed manually for the crypto crash (0.01) and the multivariate synthetic data (0.15). Section 4: on the well-log data the detected changes are almost identical to β-BOCD
    and Dm-BOCD took about 10 times less time; Appendix C.1: standard BOCD is faster than Dm-BOCD when sampling is needed, while Dm-BOCD is considerably faster than β-BOCD. Table values not recorded.'

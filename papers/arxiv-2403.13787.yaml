  notes: 'Selected for the method article requested by the user (2026-10-11): aligning language models with human preferences (preference comparisons and reward models, PPO-based RLHF with a KL penalty,
    AI feedback, direct preference optimization and its variants, reward overoptimization, length bias, reward-model evaluation, and open problems). Carded by a subagent. Results tables not recorded; claims
    only. No venue: the PDF says ''Preprint. Under review.'' and the arXiv metadata has no journal_ref; none recorded. Conflict of interest: the authors are mainly at the Allen Institute for AI (AI2); evaluated
    models include AI2''s own Tulu 2 DPO models (tulu-2-dpo-7b/13b/70b) and OLMo-7B-Instruct, the AlpacaEval Hard subset uses Tulu 2 DPO 70B completions as chosen, and Safety uses examples from ''an in-development
    refusals dataset at AI2''. The leaderboard and scores are maintained by the authors. Scores of RMs from private LM providers are on the public leaderboard but excluded from the paper as not reproducible
    (Conclusion). Re-running the suite is estimated at about 1000 A100 hours (Appendix C). Section numbers: Sec. 3 (DPO reward computation), Sec. 4.1 (dataset) and Sections 5.2/5.3 are confirmed by cross-references;
    the scoring subsection is given by name. The Safety analysis describes three behavior modes (correct refusals, refusing everything, complying with everything) (Section 5.2 text). Leaderboard numbers
    in tables and text are not recorded.'

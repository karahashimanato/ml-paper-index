proposes:
- Best subset selection (cardinality-constrained least squares or least absolute deviation) solved as a mixed integer quadratic/linear program with Gurobi, warm-started by discrete first-order (projected-gradient/hard-thresholding)
  solutions and strengthened by data-driven bounds on coefficients
claims:
- id: c1
  statement: 'Method: discrete first-order methods produce high-quality feasible solutions that warm-start an MIO solver, which finds provably optimal solutions; the resulting algorithm gives a suboptimality
    guarantee even if stopped early and accommodates side constraints and LAD loss.'
  location: Abstract
  page: 1
  quote: We develop a discrete extension of modern ﬁrst order continuous optimization methods to ﬁnd high quality feasible solutions that we use as warm starts to a MIO solver that ﬁnds provably optimal
    solutions.
- id: c2
  statement: 'Guarantee vs heuristics: MIO solvers provide feasible solutions together with lower bounds on the optimal value, so the gap certifies suboptimality when stopped early; heuristic methods give
    no such certificate.'
  location: Brief Background on MIO
  page: 8
  quote: In contrast, heuristic methods do not provide such a certiﬁcate of suboptimality.
- id: c3
  statement: 'Finding vs proving optimality: for high-dimensional problems (n in {50, 100}, p in {1000, 2000}) the approach finds near-optimal solutions in minutes, with warm starts and problem-specific
    information, but takes hours to prove optimality.'
  location: Introduction
  page: 6
  quote: For high-dimensional problems with n ∈{50, 100} and p ∈{1000, 2000}, with the aid of warm starts and further problem-speciﬁc information, our approach ﬁnds near optimal solutions in minutes but
    takes hours to prove optimality.
- id: c4
  statement: 'Warm starts: on the Diabetes data (n = 350, p = 64), warm starts from the discrete first-order algorithm plus problem-specific bounds let the MIO close the optimality gap significantly faster
    than a cold start.'
  location: Improving MIO Performance via Warm Starts
  page: 28
  quote: The ﬁgure shows that in the presence of warm starts and problem speciﬁc side information, the MIO closes the optimality gap signiﬁcantly faster.
- id: c5
  statement: 'Solver settings: the authors observed 2-4x speedups from tuning the solver to a problem but used default solver parameters for generality, and say the reported times are not meant as best-possible
    benchmarks.'
  location: MIO model training
  page: 32
  quote: We observed that it was possible to obtain speedups of a factor of 2-4 by carefully tuning the optimization solver for a particular problem, but chose to maintain generality by solving with default
    parameters.
- id: c6
  statement: 'Comparison with Lasso / Sparsenet / stepwise (n > p regime, synthetic Example 1 with n = 500, p = 100, k0 = 10, averaged over ten random instances; each method''s tuning parameter chosen on
    a held-out validation set): MIO performs best, followed by Sparsenet and Lasso, with stepwise regression worst, though Sparsenet marginally outperforms MIO in prediction error in a few instances. In
    this experiment the MIO for each k was stopped at a 1% optimality gap or a 15-minute time limit (MIO model training subsection), so the ''MIO'' models are not necessarily certified optimal.'
  location: Statistical Performance
  page: 30
  quote: Among the methods, MIO performs the best, followed by Sparsenet, Lasso with Step(wise) exhibiting the worst performance.
- id: c7
  statement: 'Qualification in the high-dimensional regime (synthetic p >> n designs; competitors Lasso, Sparsenet and the discrete first-order method alone, models selected on validation sets): for Examples
    2 and 3, MIO gives predictive models similar to Lasso but much sparser, and Lasso seems to perform marginally better than MIO as a predictive model for small SNR.'
  location: The High-Dimensional Regime
  page: 39
  quote: In fact, Lasso seems to perform marginally better than MIO, as a predictive model for small values of SNR.
- id: c8
  statement: 'Linear model and best subset problem (Eq. 1): y = X beta + epsilon with X the n x p model matrix; best subset selection with subset size k minimizes (1/2)||y - X beta||_2^2 subject to ||beta||_0
    <= k, where ||beta||_0 counts the nonzero entries of beta; the cardinality constraint makes the problem NP-hard (citing [41]).'
  location: Introduction
  page: 2
  quote: The cardinality constraint makes Problem (1) NP-hard [41].
- id: c9
  statement: 'Lasso (Eq. 2, Lagrangian form) as a convex surrogate: minimize (1/2)||y - X beta||_2^2 + lambda ||beta||_1 with ||beta||_1 = sum_i |beta_i|; the l1 penalty shrinks coefficients towards zero
    and produces a sparse solution by setting many coefficients exactly to zero.'
  location: Brief Context and Background
  page: 3
  quote: shrinks the coeﬃcients towards zero and naturally produces a sparse solution by setting many coeﬃcients to be exactly zero.
- id: c10
  statement: Problem (2) (Lasso) is a convex quadratic optimization problem with several efficient solvers, which the authors give as an important reason for its popularity.
  location: Brief Context and Background
  page: 3
  quote: Problem (2) is a convex quadratic optimization problem and there are several eﬃcient solvers for it, see for example [44, 23, 29].
- id: c11
  statement: 'Shortcoming of Lasso stated by the authors: it gives biased coefficient estimates because the l1 norm penalizes large coefficients more severely than smaller ones, whereas best subset selection
    includes a chosen variable without shrinkage.'
  location: Brief Context and Background
  page: 3
  quote: 'Lasso leads to biased regression coef-

    ﬁcient estimates, since the ℓ1-norm penalizes the large coeﬃcients more severely than the smaller coeﬃcients.'

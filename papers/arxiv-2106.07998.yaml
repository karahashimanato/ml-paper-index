proposes:
- A large-scale study relating calibration (top-label ECE, NLL, Brier) and accuracy of recent image classifiers (MLP-Mixer, ViT, BiT, ResNeXt-WSL, SimCLR, CLIP, AlexNet) in-distribution and under distribution
  shift, before and after temperature scaling
claims:
- id: c1
  statement: 'Revisiting Guo et al. (2017): several recent families (MLP-Mixer, ViT, BiT) are both highly accurate and well calibrated compared to AlexNet or the models studied by Guo et al., which the
    authors say suggests there may be no continuing trend for highly accurate modern networks to be poorly calibrated.'
  location: In-Distribution Calibration
  page: 5
  quote: This suggests that there may be no continuing trend for highly accurate modern neural networks to be poorly calibrated
- id: c2
  statement: 'Recalibration protocol: 20% of the ImageNet validation set (randomly sampled) is reserved to fit the temperature-scaling parameter and all metrics are computed on the remaining 80%; for ImageNet-C,
    images derived from that 20% are excluded too. All models are trained or fine-tuned on ImageNet except CLIP (zero-shot). Out-of-distribution sets: ImageNetV2, ImageNet-C (synthetic corruptions), ImageNet-R,
    ImageNet-A.'
  location: Experimental Setup
  page: 4
  quote: For the post-hoc recalibration of models, we reserve 20% of the IMAGENET validation set (randomly sampled) for ﬁtting the temperature scaling parameter.
- id: c3
  statement: 'Metric: the paper focuses on top-label (argmax) calibration and estimates ECE with equal-mass binning and 100 bins throughout; Appendix E reportedly shows the results hold for other ECE variants
    and are consistent with Brier score and likelihood.'
  location: Experimental Setup
  page: 5
  quote: Throughout the paper, we estimate ECE using equal-mass binning and 100 bins.
- id: c4
  statement: 'Temperature scaling as a confounder remover: after temperature scaling, clearer separation between families and consistent within-family trends appear, and the BiT (ResNet) results become
    consistent with Guo et al.''s ResNets on ImageNet; models pretrained without labels (SimCLR) or with noisy labels (ResNeXt-WSL) tend to be worse calibrated for a given accuracy.'
  location: In-Distribution Calibration
  page: 5
  quote: Notably, temperature scaling reconciles our results for BiT (a ResNet architecture) with the results reported by Guo et al. for ResNets trained on IMAGENET.
- id: c5
  statement: Within most families larger models have somewhat higher in-distribution ECE but lower error (ResNeXt-WSL is an exception); model size and pretraining amount do not fully explain family differences.
    Because the best-calibrated families are non-convolutional, the authors speculate that architecture, in particular its spatial inductive bias, plays an important role; the conclusion adds that further
    work is needed to tell whether this generalizes.
  location: In-Distribution Calibration
  page: 6
  quote: Given that the best-calibrated families (MLP-Mixer and ViT) are non-convolutional, we speculate that model architecture, and in particular its spatial inductive bias, play an important role.
- id: c6
  statement: Under distribution shift (ImageNet-C, synthetic corruptions at five severities), classification and calibration error generally increase, but calibration decays more slowly for MLP-Mixer and
    ViT; the in-distribution trend of larger models being worse calibrated reverses for most families out of distribution, especially after temperature scaling.
  location: Accuracy and Calibration Under Distribution Shift
  page: 6
  quote: In other words, the calibration of larger models is more robust to distribution shift (Figure 5).
- id: c7
  statement: 'ECE estimator pitfalls: binning bias is always negative (citing Kumar et al., 2019) and finite-sample per-bin bias is always positive and depends on accuracy, so the estimate can be too low
    or too high and model rankings depend on the ECE variant (citing Nixon et al., 2019); on BiT models, the sign of the ECE-vs-error relationship flipped with the number of bins. Mitigations: careful bin
    choice and considering accuracy and calibration jointly (Pareto-optimal models rarely change).'
  location: Section 5 (Pitfalls and Limitations)
  page: 9
  quote: It is therefore possible to arrive at opposite conclusions about the relationship between accuracy and calibration, depending on the chosen bin size (Figure 9), especially when comparing models
    with widely varying accuracies.
- id: c8
  statement: 'Selective-prediction cost scenario: comparing a more accurate and a better-calibrated BiT variant, the more accurate one had lower cost for abstention rates up to 70%, and likewise for the
    other families; the authors conclude a practitioner should choose the most accurate model for these families and this cost scenario, while noting real-world cost structures are complex and may yield
    different results.'
  location: Relating Accuracy and Calibration Within Model Families
  page: 8
  quote: For these families and this cost scenario, a practitioner should therefore always choose the most accurate available model regardless of differences in calibration.
- id: c9
  statement: 'Label smoothing: the authors argue it creates artificially underconfident models that may improve calibration for a specific amount of shift but not intrinsic calibration; after temperature
    scaling on a held-out part of the ImageNet validation set, training without label smoothing gave the lowest ECE across ImageNet-C severities, and the data suggest training without label smoothing and
    recalibrating post hoc.'
  location: Appendix D (Model Confidence)
  page: 21
  quote: These data suggest that, from a calibration perspective, models should be trained without label smoothing and then recalibrated by temperature scaling post hoc.

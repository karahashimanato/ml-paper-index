  notes: 'Selected for the method article requested by the user (2026-10-10): knowledge distillation and pruning (soft targets and temperature, hint-based and self distillation, teacher-student gaps and
    fidelity; magnitude, gradual, single-shot, movement and LLM pruning, lottery tickets, and how pruning is evaluated). Carded by a subagent. Results tables not recorded; claims only. Affiliations: NYU
    (Stanton, Izmailov, Kirichenko, Wilson) and Google Research (Alemi). Venue from the PDF footer (''35th Conference on Neural Information Processing Systems (NeurIPS 2021)''); also the arXiv comment.
    Section numbers are from numbered headings in the PDF. Most results are figures (not recorded). Body-text numbers in Section 6.2: with SGD, 83.3% train agreement after 5k epochs vs 78.95% after 300
    epochs; Adam only reduced fidelity; a sudden change at lambda = 0.375 gives nearly 100% agreement. Discussion findings: good student accuracy does not imply good fidelity; the highest-fidelity student
    is always the best calibrated when distilling ensembles; enlarging distillation data helps identifiability but makes optimization harder. Appendix results (VGG, ImageNet, IMDB text classification, larger
    students, alpha ablation) are mentioned in Section 4.4 but not carded. Section 4.1: LeNet-5 self-distillation on MNIST with extra EMNIST distillation data reaches over 99% test agreement, while ResNet-56
    on CIFAR-100 with GAN data improves fidelity only modestly. Ensemble teacher logits are the log of the averaged component probabilities (Section 3). Cites arxiv-1910.01348 (Cho & Hariharan). No evaluation
    of the authors'' own earlier methods was found.'

    time/space'' refers to value plus gradient (the backward pass requires the full matrix R). Gradient of soft-DTW is 2/gamma-Lipschitz for squared Euclidean cost (Section 2.3 text). Soft-DTW with gamma
    > 0 equals -gamma log of the Global Alignment kernel. A custom backward pass in Chainer was implemented instead of autodiff because the forward DP is element-wise. Experiments with gamma below 0.001

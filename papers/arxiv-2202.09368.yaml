  notes: 'Selected for the method article requested by the user (2026-10-10): alternatives and extensions to dense Transformers (sparse mixture-of-experts routing and load balancing, state space models
    from HiPPO/S4 to Mamba-2, linear and kernelized attention, RWKV, and benchmarks/analyses comparing them with Transformers). Carded by a subagent. Results tables not recorded; claims only. Affiliation:
    Google, Mountain View (page 1). Venue from the PDF footer (''36th Conference on Neural Information Processing Systems (NeurIPS 2022)''). Section numbers are from numbered headings in the PDF dump. A
    hash-layer baseline (mod-x token-ID routing, also load balanced) performs worse than expert choice in average score and variance, which the authors take to indicate ''load balancing alone does not generate
    all the benefits'' (subsection ''Comparison with Hash Layer'', Table 4). Model sizes: 8B/64E has 143B total and 9.8B activated parameters vs 8.7B for the 8B dense model (Table 1); the abstract states
    the method outperforms the T5 dense model in 7 of 11 tasks ''for a smaller activation cost'', and the text reports +3.4 average over the dense 8B (Table 3) and > 2% average over GShard top-2 at 8B/64E.
    With capacity factor 1 and 0.5, expert choice still outperforms Switch top-1 in perplexity (figure only). Routing statistics (figure-based text): most tokens go to one or two experts, 23% to three or
    four, about 3% to more than four. The over-capacity observation and convergence speedups are partly read from figures; only the text statements are recorded. Results tables (Tables 2-4) not recorded.
    Conflict of interest: the baselines GShard (Huang and Chen are co-authors, arxiv-2006.16668) and GLaM training setup/data (Du and Huang) come from overlapping Google authors.'

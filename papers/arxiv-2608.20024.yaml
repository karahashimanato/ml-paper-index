claims:
- id: c1
  statement: The study evaluates TabPFN-TS against time-series foundation models and trained ML baselines for probabilistic heat load forecasting in district heating networks.
  location: Abstract
  page: 1
  quote: This study systematically evaluates TabPFN-TS against state-of-the-art time-series foundation models and trained machine-learning baselines for probabilistic heat load forecasting in district heating
    networks.
- id: c2
  statement: Chronos-2 has the lowest aggregate full-year error, while TabPFN-TS shows better empirical calibration.
  location: Abstract
  page: 1
  quote: Although Chronos-2 achieves the lowest aggregate full-year error, TabPFN-TS shows better empirical calibration.
- id: c3
  statement: The trained AutoGluon baselines are fitted on 2023 data and evaluated on rolling 24-hour forecasts in 2024. Each model class uses the target history according to its own defaults.
  location: Methodology (forecasting models)
  page: 6
  quote: The predictors are trained on 2023 target values and evaluated on rolling 24-hour forecasts in 2024.
- id: c4
  statement: The TabPFN-TS configuration (context length, resolution, horizon, covariates) is chosen with diagnostics on three representative weeks of 2024, the same year used for the full-year evaluation.
  location: Case Study and Experimental Design
  page: 9
  quote: The selected winter, transitional, and summer weeks in 2024 are January 15–21, April 22–28, and August 12–18, respectively.
- id: c5
  statement: The main experiments feed realized future temperature as the known covariate, which amounts to assuming a perfect weather forecast. A separate sensitivity analysis uses archived forecasts.
  location: Methodology (forecasting models)
  page: 6
  quote: This setting can be interpreted as a perfect-weather-forecast assumption

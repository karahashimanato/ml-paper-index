claims:
- id: c1
  statement: The paper proposes a continuous, label-free internal reliability metric based on Incremental PCA reconstruction residuals.
  location: Abstract
  page: 1
  quote: This paper introduces a continuous, label-free internal reliability metric built on an Incremental Principal Component Analysis (IPCA) backbone.
- id: c2
  statement: The authors state the observed differences are small, so the signal is better suited as a continuous reliability indicator than as a universal detector of frozen adaptation.
  location: Abstract
  page: 1
  quote: The observed differences are small in magnitude, indicating that the awareness signal is more suitable as a continuous internal reliability indicator than as a universal detector of frozen adaptation.
- id: c3
  statement: 'Ground truth drift is synthetic: a gradual drift ramp is placed at a fixed interval chosen by the experimenters, not at an estimated drift location in the original (AI4I 2020, WSN) data.'
  location: Research design (stream length and temporal segmentation)
  page: 8
  quote: The selected interval was an experimental segmentation choice rather than an estimated drift location in the original datasets.
- id: c4
  statement: The injected drift is a small shift-and-scale of the standardized features that stays active after the ramp.
  location: Controlled drift injection
  page: 11
  quote: At maximum drift intensity, every standardized feature was multiplied by 1.05 and shifted by 0.05 standardized units.
- id: c5
  statement: The authors state the synthetic shift-and-scale experiment is a reproducible stress test but does not establish general concept-drift detection performance.
  location: Discussion (Scope of the synthetic drift experiment)
  page: 29
  quote: It is useful as a reproducible stress test, but it does not establish general concept-drift detection
- id: c6
  statement: 'Limitation: only one fixed drift strength and two adaptation conditions (full adaptation, complete freezing) are tested.'
  location: Limitations and future research
  page: 33
  quote: 'The present experiment uses one fixed drift strength and two adaptation conditions: full adaptation and complete freezing.'

  notes: 'Selected for the topic article requested by the user (2026-10-03): classical algorithms (sorting, binary search, greedy) and machine learning; carded by a subagent. Results tables not recorded;
    claims only. Affiliation: Google Research (Blueshift Team), Google Research, University of Toronto/Vector Institute; first author interning at Google Research. LaMDA models are Google models, and a
    footnote says the model name was omitted for anonymization (yet LaMDA is named in this version). PDF states: 36th Conference on Neural Information Processing Systems (NeurIPS 2022). Prompting experiments
    use the pretrained LaMDA 128b model (parity phrased as a coin-flip task, prompts with short exemplars, tested up to 20 flips); OpenAI Codex is also evaluated on variable assignment (Figure 7). Few-shot
    finetuning with scratchpad helped on parity but not on variable assignment; the authors hypothesise this depends on the base model''s non-finetuned performance and leave rigorous evaluation to future
    work (Section 5.1; prompt-style sanity check in Appendix E). Model scope: finetuning uses LaMDA 244m/422m/1b/64b (Section 3.1; a 255m model on the diverse variable-assignment split in Section 3.2),
    prompting uses LaMDA 128b; all decoder-only; tasks are only parity and Boolean variable assignment (synthetic). Conclusion scope statement: length generalization ''is a challenge for language models
    at least up to the 100B parameter scale''. Appendix F: masking all distractor tokens gives perfect length generalization in their parity scratchpad experiments; input distractors hurt more. Hyperparameters
    (Appendix C): learning-rate sweep per model size, preferring the largest stable learning rate because larger rates gave the best length generalization; AdaFactor; greedy decoding. Inconsistency: Section
    3.1 gives parity training lengths 10 to 21, while Appendix A.1 gives 3 to 20 for training and 3 to 40 for validation/test; the card follows Section 3.1 in claim c4 and flags this here. Author overlap:
    reference [3] (Nye et al., ''Show your work: Scratchpads...''), whose length-generalization suggestion this paper disputes, lists Anders Johan Andreassen, Guy Gur-Ari and Aitor Lewkowycz, who are also
    authors of this paper; the entry is truncated with ''et al.'', so further overlap cannot be checked from this PDF. Only parity and variable assignment are studied; no sorting, binary search or greedy
    tasks.'

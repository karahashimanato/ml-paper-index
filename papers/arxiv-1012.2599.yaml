proposes:
- 'Tutorial: Bayesian optimization with GP priors (covariance functions, PI / EI / GP-UCB acquisition functions, Gaussian noise), its history (kriging, EGO, experimental design, active learning), and two
  extensions with experiments: preference galleries from pairwise discrete-choice data and hierarchical reinforcement learning'
claims:
- id: c1
  statement: The acquisition function automatically trades off exploration (where the objective is very uncertain) and exploitation (where it is expected to be high); the technique aims to minimize the
    number of objective evaluations and, the authors say, is likely to do well even with multiple local maxima.
  location: Introduction
  page: 3
  quote: This optimization technique has the nice property that it aims to minimize the number of objective function evaluations.
- id: c2
  statement: 'Problem assumptions: the objective is a black box, assumed Lipschitz-continuous with a typically unknown constant, over a bounded axis-aligned hyperrectangle. Citing Betro (1991), guaranteeing
    an epsilon-optimal observation in the worst case requires (C/2 epsilon)^d samples, which the authors call an incredibly expensive premium against unlikely scenarios; BO instead relaxes worst-case guarantees
    toward an average-case approach.'
  location: Section 2 (The Bayesian Optimization Approach)
  page: 5
  quote: This can be an incredibly expensive premium to pay for insurance against unlikely scenarios.
- id: c3
  statement: The choice of GP covariance function is crucial because it determines the smoothness of samples; the plain squared exponential is called a little naive since all features affect the covariance
    equally, so length-scale (including ARD) hyperparameters are added, and the Matern kernel adds a smoothness parameter.
  location: Section 2.2
  page: 9
  quote: The choice of covariance function for the Gaussian Process is crucial, as it determines the smoothness properties of samples drawn from it.
- id: c4
  statement: GP hyperparameters are typically learned by seeding with a few random samples and maximizing the log-likelihood of the evidence (citing several works), often aided by an informative hyperprior
    such as a log-normal prior; more efficient ways of learning them are described as an active subfield of research.
  location: Section 2.2
  page: 10
  quote: Typically, the hyperparameter values are learned by “seeding” with a few random samples and maximizing the log-likelihood of the evidence given θ
- id: c5
  statement: 'Exploration parameter of EI: citing Lizotte (2008), setting xi = 0.01 (scaled by the signal variance if necessary) works well in almost all cases, while a cooling schedule for xi (explore
    early, exploit later) does not work well empirically, contrary to intuition (a schedule might slightly help short runs of PI).'
  location: Section 2.3
  page: 14
  quote: Lizotte’s experiments suggest that setting ξ = 0.01 (scaled by the signal variance if necessary) works well in almost all cases
- id: c6
  statement: 'GP-UCB as summarized by the tutorial: for the confidence-bound criteria kappa is otherwise left to the user; with the schedule of Srinivas et al. (2010) the method is no-regret with high probability.
    A footnote cautions that these bounds hold for reasonably smooth kernels and their exact form depends on the kernel, referring readers to the original paper.'
  location: Section 2.3 (footnote 2)
  page: 16
  quote: These bounds hold for reasonably smooth kernel functions, where the exact formulation of the bounds depends upon the form of kernel used.
- id: c7
  statement: 'Noise: additive Gaussian noise is handled by adding sigma_noise^2 I to the kernel matrix; for PI and EI the incumbent is redefined as the sampled point with the highest posterior mean rather
    than the best noisy observation (resampling incumbents, ''intensification'', is also mentioned).'
  location: Section 2.4
  page: 19
  quote: This avoids the problem of attempting to maximize probability or expected improvement over an unreliable sample.
- id: c8
  statement: 'Stated shortcomings: the design of the prior is absolutely critical; GPs are not always the best or easiest solution and kernels need great care; with little known about an expensive objective,
    either strong unverified assumptions or a weak prior must be used; and it is often unclear how to set the exploration-exploitation trade-off.'
  location: Section 5
  page: 43
  quote: A particular issue is that the design of the prior is absolutely critical to eﬃcient Bayesian optimization.
- id: c9
  statement: 'Further shortcomings: these problems are exacerbated as dimensionality grows (more samples to cover the space, more parameters and hyperparameters to tune), which may require automatic feature
    selection or optimizing each dimension independently; and the acquisition is currently myopic and allows only one sample per iteration, whereas looking ahead to a horizon or selecting batches would
    be valuable.'
  location: Section 5
  page: 43
  quote: In order to deal with this problem eﬀectively, it may be necessary to do automatic feature selection, or assume independence and optimize each dimension individually.

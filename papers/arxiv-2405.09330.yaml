  notes: 'Selected for the topic article requested by the user (2026-10-07): Bayesian change point detection (online BOCPD and its extensions, offline Bayesian changepoint analysis, evaluation and applications).
    Carded by a subagent. Results tables not recorded; claims only. Affiliations: RMIT University; Chongqing University. Venue from the arXiv comment (''accepted to FSE''24'') and the PDF (Proc. ACM Softw.
    Eng. 1, FSE, Article 98, July 2024; DOI 10.1145/3660805). Section numbers (2.3, 3.1, 3.1.2, 3.3, 3.4, 3.4.2, 4, 4.4) are confirmed by cross-references in the text. The BOCPD variant is standard Adams-MacKay
    BOCPD with a multivariate Gaussian/inverse-Wishart segment marginal likelihood; it is applied to a fixed T-length window of collected metrics (Algorithm 1), so detection is evaluated retrospectively
    per case rather than as streaming delay/false-alarm rates. The coarse-grained RCA text says BARO achieves the highest Avg@5 in 10 of 15 (fault type x system) cells while also describing it as consistently
    top; for fine-grained RCA it ''ranks among the top performers'' rather than best everywhere. RQ4 varies the detection time by ±40 around injection on Online Boutique and Sock Shop and varies baseline
    hyperparameters (BARO''s BOCPD parameters are not varied). Datasets and code released (Zenodo). Segment model: zero-mean multivariate Gaussian with an inverse-Wishart prior whose scale uses the mean
    empirical variance pooled across all metrics (data-dependent prior); hazard is geometric, value not stated. Systems: Online Boutique (12 services), Sock Shop (11), Train Ticket (64) on a 5-worker Kubernetes
    cluster, restarted after each injection; injection-to-symptom gap usually 1-3 s by visual inspection, and the fault injection time is used as a proxy for the true anomaly time. Anomaly detection is
    scored per case as binary classification (pre-injection data normal, during-injection abnormal; Precision/Recall/F1 averaged over cases). RCA baselines use hyperparameters from their papers; ε-Diagnosis
    uses a third-party implementation. Table footnotes: CIRCA on Train Ticket from only 15/100 cases (PC failed), BIRCH-based RCA only on cases BIRCH detected. Results tables not recorded.'

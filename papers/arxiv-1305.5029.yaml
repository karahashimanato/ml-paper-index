  notes: 'Selected for the topic article requested by the user (2026-10-03): algorithm design techniques (divide and conquer, dynamic programming, branch and bound, local search) and machine learning; carded
    by a subagent. Results tables not recorded; claims only. Trade-off: with naive KRR the decomposition costs O(N^3/m^2) time and O(N^2/m^2) memory instead of O(N^3)/O(N^2) (Introduction); the estimates
    must still be communicated. Theorem 1 assumes f* in the RKHS; Theorem 2 (oracle inequality, f* not in H) only allows m growing as about sqrt(N/gamma^2(lambda)) rather than N/gamma^2(lambda), so the
    authors note that, at least in their current analysis, the more general case prevents finer partitions. Simulations: f*(x)=min(x,1-x) on [0,1], Gaussian noise, N from 2^8 to 2^13, m in {1,4,16,64},
    20 repetitions; an ablation without under-regularization (lambda chosen from the local n) shows a clear gap to m=1. Timing table: Matlab, single-threaded 3.4GHz, 16GB; m=1 fails (out of memory) from
    N=2^15. Million Song Dataset: 463,715 train / 51,630 test, 90 features, bandwidth sigma=6 chosen by cross-validation, lambda=1/N set from Corollary 3; Nystrom ranks 1000-6000, random features 2000-10000,
    m in {32,...,256}, 10 runs each. A sanity check shows averaging beats standard KRR on a 1/m fraction of the data. Discussion contrasts kernel-evaluation counts with Bach''s Nystrom analysis and says
    the two scalings are currently not comparable. Task tag tabular-regression is used for the Million Song timbre-feature regression; the simulation study is 1-D synthetic. Results (figures/table values)
    not recorded.'

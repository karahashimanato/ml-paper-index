proposes:
- 'Human-aware losses (HALOs): a family of alignment losses written as a value function applied to the implied reward l(y) log(pi_theta/pi_ref) relative to a reference point; DPO and PPO-Clip are shown
  to be HALOs'
- 'Kahneman-Tversky Optimization (KTO): a HALO that uses a logistic value function with risk-aversion parameter beta, loss-aversion weights lambda_D/lambda_U and a KL-divergence reference point, trained
  from binary desirable/undesirable labels instead of preference pairs'
claims:
- id: c1
  statement: HALOs are defined via an implied reward r_theta(x, y) = l(y) log(pi_theta(y|x)/pi_ref(y|x)), a reference-point distribution Q and a non-decreasing value function; Theorem 3.5 states that DPO
    and PPO-Clip are human-aware losses, while the authors argue CSFT and SLiC are not (they violate the invariance condition f(pi, pi) = constant).
  location: Section 3.2
  page: 4
  quote: Theorem 3.5. DPO and PPO-Clip are human-aware losses.
- id: c2
  statement: 'Does being a HALO matter (Pythia 1.4B-12B and Llama 7B-30B trained on Anthropic-HH, OpenAssistant and SHP; GPT-4-0613 judging against the SFT targets for helpfulness, harmlessness and conciseness):
    HALOs matched or outperformed non-HALOs at every scale, but the gap was significant (p < 0.05) only at 13B+ after Holm correction; up to 7B, alignment gave virtually no gain over SFT alone. An offline
    PPO variant with dummy +1/-1 rewards performed as well as DPO except for Llama-30B, though it still suffered from hyperparameter sensitivity and training instability.'
  location: Section 3.3
  page: 5
  quote: HALOs either match or outperform non-HALOs at every scale, though the gap is only significant (p < 0.05) at 13B+ model sizes after correcting for multiple comparisons (Holm, 1979).
- id: c3
  statement: 'KTO loss: the Kahneman-Tversky value function is replaced by the logistic function for numerical stability; with r_theta = log(pi_theta/pi_ref) and reference point z0 = KL(pi_theta(y''|x)
    || pi_ref(y''|x)), L_KTO = E[lambda_y - v(x, y)] where v = lambda_D sigma(beta(r_theta - z0)) for desirable and lambda_U sigma(beta(z0 - r_theta)) for undesirable outputs; z0 is not backpropagated through.
    In practice z0 is a biased, clamped estimate from mismatched pairs within a microbatch (Section 4.1, KL Estimate).'
  location: Section 4.1
  page: 5
  quote: The canonical Kahneman-Tversky value function (4) suffers from numerical instability during optimization due to the exponent a, so we replace it with the logistic function σ, which is also concave
    in gains and convex in losses.
- id: c4
  statement: 'Data assumption: because the standard academic datasets (HH, SHP, OASST) are in preference format, the experiments convert each pair by treating y_w as desirable and y_l as undesirable; the
    authors call this a naive simplification and expect a more complex deconstruction to do better. Some experiments subsample one y per x to remove paired structure.'
  location: Section 4.1
  page: 6
  quote: This is a naive assumption, made for the sake of simplicity, and a more complex deconstruction of preferences into binary feedback would likely yield better results, which we leave for future work.
- id: c5
  statement: 'Hyperparameters: aligned-model performance was most sensitive to the learning rate; the optimal KTO learning rate is usually 2x-10x that of DPO (recommended 5e-6 with AdamW), but unless stated
    otherwise the experiments used the default DPO learning rate with RMSProp for an apples-to-apples comparison with Rafailov et al. (2023). A default beta = 0.1 ''works well in most cases''; the recommended
    range for lambda_D n_D / lambda_U n_U was determined empirically; the authors note optimal DPO settings do not necessarily transfer to KTO.'
  location: Section 4.2
  page: 7
  quote: We find that the performance of an aligned model is more sensitive to the learning rate than any other hyperparameter.
- id: c6
  statement: 'Main comparisons: SFT+KTO was competitive with SFT+DPO from 1B to 30B; KTO alone was better than DPO alone for Llama-7B/13B/30B, significant (p < 0.01) at 7B and 30B after correction, while
    for Pythia there was no significant difference, which the authors take to suggest a minimum model capacity is needed. Up to 90% of desirable data could be discarded for Llama-7B while still outperforming
    DPO; without SFT, DPO-aligned models'' response length increased dramatically whereas KTO kept it roughly the same.'
  location: Section 4.3
  page: 8
  quote: Among the Pythia models, there is no significant difference between the two, suggesting that a minimum model capacity is needed for these differences to emerge.
- id: c7
  statement: 'Theoretical caveat: Proposition 4.1 says an example''s gradient contribution vanishes as its reference-adjusted implied reward goes to plus or minus infinity, so KTO ignores examples that
    are too hard or too easy; this may avoid fitting mislabelled noise but could also ignore hard-but-necessary data and underfit complex distributions (mitigated by lower beta and more epochs). The authors''
    guidance is that with little noise and intransitivity in preference data DPO may work better, while with enough noise KTO''s better worst-case guarantees (Theorem 4.3) win out.'
  location: Section 4.4
  page: 9
  quote: However, this also means that KTO could end up ignoring data that is hard-to-learn but necessary to recover r∗, potentially resulting in underfitting to complex distributions.
- id: c8
  statement: 'Human versus GPT-4 evaluation (Appendix D): 256 OpenAssistant test prompts, Mistral-7B aligned with DPO and KTO, judged by a pool of workers from a third-party annotation service against the
    SFT target (domain-expert questions skipped, 214 comparisons each). Human win rates were 72.9% +/- 5.3 (KTO) and 62.1% +/- 5.7 (DPO), versus GPT-4 judge win rates of 65.2% +/- 3.6 and 60.0% +/- 3.7;
    the difference was significant only under human evaluation, and 68.7% (KTO) and 65.9% (DPO) of human judgments concurred with GPT-4.'
  location: Appendix D
  page: 18
  quote: Thus although there is no significant difference in the GPT-4-based evaluation, there is a significant difference with human evaluation at p < 0.05.

proposes:
- 'Pointer Network (Ptr-Net): LSTM encoder-decoder whose content-based attention distribution over input positions is used directly as the output (a pointer), giving an output dictionary whose size equals
  the input length'
claims:
- id: c1
  statement: 'Contribution: instead of using attention to blend encoder states into a context vector, Ptr-Net uses the attention distribution itself as a pointer that selects an input element as the output,
    so outputs are positions in the input (e.g. permutations or subsets of the input).'
  location: Abstract
  page: 1
  quote: It differs from the previous attention attempts in that, instead of using attention to blend hidden units of an encoder to a context vector at each decoder step, it uses attention as a pointer
    to select a member of the input sequence as the output.
- id: c2
  statement: 'Motivation: problems whose output dictionary size depends on the input length, such as sorting variable-sized sequences and various combinatorial optimization problems, cannot be trivially
    handled by sequence-to-sequence models or Neural Turing Machines.'
  location: Abstract
  page: 1
  quote: Problems such as sorting variable sized sequences, and various combinatorial optimization problems belong to this class.
- id: c3
  statement: 'Sorting is not among the evaluated tasks: the paper lists applying Ptr-Net to sorting as future work.'
  location: Conclusions
  page: 8
  quote: Future work will try and show its applicability to other problems such as sorting where the outputs are chosen from the inputs.
- id: c4
  statement: 'Evaluated tasks: learning approximate solutions, from input-output examples alone, to planar convex hull, Delaunay triangulation and planar symmetric TSP.'
  location: Abstract
  page: 1
  quote: We show Ptr-Nets can be used to learn approximate solutions to three challenging geometric problems – ﬁnding planar convex hulls, computing Delaunay triangulations, and the planar Travelling Salesman
    Problem – using training examples alone.
- id: c5
  statement: 'Length generalization (convex hull): a single model trained on lengths 5 to 50 extrapolates to lengths never seen in training (tested up to n = 500), whereas the LSTM baselines must be retrained
    for each n.'
  location: Empirical Results (Convex Hull)
  page: 6
  quote: More impressive is the fact that the model does extrapolate to lengths that it has never seen during training.
- id: c6
  statement: 'Limitation of length generalization (TSP): trained on optimal tours with 5 to 20 cities, the model is near perfect at n = 25 and good at n = 30 but appears to break at 40 and beyond; the authors
    contrast this with the factor-of-10 generalization on convex hull and suggest that the underlying algorithms being of far greater complexity than O(n log n) could explain it.'
  location: Empirical Results (Travelling Salesman Problem)
  page: 8
  quote: The results are virtually perfect for n = 25, and good for n = 30, but it seems to break for 40 and beyond (still, the results are far better than chance).
- id: c7
  statement: 'Evaluation protocol: no extensive architecture or hyperparameter search was done for Ptr-Net; virtually the same architecture was used for all experiments and datasets.'
  location: Empirical Results (Architecture and Hyperparameters)
  page: 6
  quote: No extensive architecture or hyperparameter search of the Ptr-Net was done in the work presented here, and we used virtually the same architecture throughout all the experiments and datasets.

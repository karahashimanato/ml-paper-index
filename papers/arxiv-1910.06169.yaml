  notes: 'Selected for the topic article requested by the user (2026-10-03): classical algorithms (sorting, binary search, greedy) and machine learning; carded by a subagent. Results tables not recorded;
    claims only. Affiliation (title page): University of Pisa; the PGM-index authors evaluate their own method. Funding: Italian MIUR PRIN project ''Multicriteria Data Structures and Algorithms'' and Regione
    Toscana. Hardware: 2.3 GHz Intel Xeon Gold, 192 GiB memory; C++ implementation, to be released on GitHub upon acceptance (footnote; no URL in the text). The FITing-tree computes segments with a greedy
    algorithm (shrinking cone), which the authors call suboptimal; Table 1 lists m_opt <= m_greedy and omits RMI ''because it lacks of guaranteed bounds''. The FITing-tree comparison was dropped from the
    query experiments ''because of the evident structural superiority'' of the recursive PGM-index (Query performance section). Disagreement: Benchmarking Learned Indexes (arxiv-2006.12804#c4, #c5) reports
    PGM slower than an author-tuned RMI on 3 of 4 datasets and states, after contacting these authors, that their RMI used only linear models and omitted some optimizations; this paper itself describes
    its RMI as using ''a combination of linear and other models in its two stages'' (p.10).'

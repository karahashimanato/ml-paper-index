- id: c1
  statement: InRTL is a unified framework that explicitly models dependencies within and across relational tables.
  location: Abstract
  page: 1
  quote: In this paper, we propose Intra–Inter Relational Table Learning (InRTL), a unified framework that explicitly models dependencies both within and across relational tables.
- id: c2
  statement: Experiments are reported to show that InRTL consistently outperforms state-of-the-art baselines on diverse relational table tasks.
  location: Conclusion
  page: 9
  quote: Extensive experiments demonstrate that InRTL consistently outperforms state-of-the-art baselines on diverse relational table tasks.
- id: c3
  statement: All experiments follow the standard preprocessing and train/val/test splits of each benchmark (SJTUTables and RelBench).

proposes:
- 'Contrastive Predictive Coding (CPC): an encoder maps observations to latents, an autoregressive model summarizes past latents into a context, and future latents are predicted in latent space with a probabilistic
  contrastive loss'
- 'InfoNCE: a loss based on Noise-Contrastive Estimation that classifies one positive sample among N - 1 negatives drawn from the proposal distribution; minimizing it maximizes a lower bound on mutual information'
claims:
- id: c1
  statement: 'Motivation: unimodal losses are not very useful for predicting high-dimensional data and generative models that reconstruct every detail are computationally intense; since high-level latent
    variables carry far less information than the data, the authors suggest that modelling p(x|c) directly may not be optimal for extracting the information shared between x and c.'
  location: Motivation and Intuitions
  page: 2
  quote: This suggests that modeling p(x|c) directly may not be optimal for the purpose of extracting shared information between x and c.
- id: c2
  statement: 'InfoNCE: the encoder and autoregressive model are trained jointly on a loss based on NCE; given a set of N samples containing one positive from p(x_{t+k}|c_t) and N - 1 negatives from the
    proposal distribution p(x_{t+k}), the loss is the categorical cross-entropy of identifying the positive.'
  location: Section 2.3
  page: 3
  quote: Both the encoder and autoregressive model are trained to jointly optimize a loss based on NCE, which we will call InfoNCE.
- id: c3
  statement: The optimal score f(x_{t+k}, c_t) for this loss is proportional to the density ratio p(x_{t+k}|c_t)/p(x_{t+k}), and this optimum does not depend on the number of negative samples.
  location: Section 2.3
  page: 4
  quote: is independent of the the choice of the number of negative samples N −1
- id: c4
  statement: 'Link to mutual information: I(x_{t+k}, c_t) >= log(N) - L_N, which becomes tighter as N grows, so minimizing the InfoNCE loss maximizes a lower bound on mutual information (the authors note
    the MI evaluation is not required for training).'
  location: Section 2.3
  page: 4
  quote: Also observe that minimizing the InfoNCE loss LN maximizes a lower bound on mutual information.
- id: c5
  statement: The appendix derivation of the bound contains an approximation step (replacing the sum over negatives by N - 1 times an expectation); the authors state that it quickly becomes more accurate
    as N increases and that log(N) - L_N also increases, so large N is useful.
  location: Appendix A.1
  page: 13
  quote: Equation 8 quickly becomes more accurate as N increases.
- id: c6
  statement: InfoNCE is related to the MINE estimator (maximizing a lower bound on it, up to a constant); using MINE directly gave identical performance when the task was non-trivial but became very unstable
    when the target was easy to predict from the context (e.g. one-step prediction overlapping the context).
  location: Appendix A.1
  page: 13
  quote: We found that using MINE directly gave identical performance when the task was non-trivial, but became very unstable if the target was easy to predict from the context
- id: c7
  statement: 'ImageNet evaluation protocol: CPC with a ResNet-v2-101 encoder (not pretrained, no BatchNorm) on a 7x7 grid of 64x64 crops with simple augmentation; a linear classifier (SGD, fixed learning-rate
    schedule) is trained on the spatially mean-pooled 1024-d features. The authors note that the prior work they follow uses a 3x3x1024 representation without pooling, giving the linear mapping more parameters,
    which could be advantageous; previous results in Table 4 are taken from that work.'
  location: Vision
  page: 7
  quote: This is slightly different from [36] which uses a 3x3x1024 representation without pooling, and thus has more parameters in the supervised linear mapping (which could be advantageous).
- id: c8
  statement: 'Caveat on the NLP transfer benchmark (BookCorpus pre-training, logistic regression on five classification tasks with the L2 weight chosen by (nested) cross-validation): models that learned
    better relationships in the source books did not necessarily perform better on the very different target tasks.'
  location: Natural Language
  page: 8
  quote: Although this is a standard transfer learning benchmark, we found that models that learn better relationships in the childeren books did not necessarily perform better on the target tasks

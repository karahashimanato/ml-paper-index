    (0000) 00, Number 0'', ''DOI: 0000''), which is not a publication statement, and the arXiv record has no comment or journal_ref. Section numbers are confirmed by numbered headings in the PDF and cross-references
    (''Section 4.2'', ''section 5.2'', ''Section 6.1'', ''section 8''). Conflict of interest: the ACIC 2017 competition used as a benchmark is described in Hahn, Dorie and Murray (2018), co-authored by
    two of the authors, and the authors state their own simulation protocol was ''designed prior to the model''s development, with an eye towards realism''; RIC is from the authors'' earlier work (Hahn
    et al. 2016); BCF is ''the default implmentation in our software package''. The authors also note that ps-BART in ACIC 2016/2017 was based on an early draft of this paper and that Nie & Wager (2017)
    used ps-BART in a stacked R-learner. Simulation (Section 6.1): 8 DGPs (homogeneous/heterogeneous effects, linear/nonlinear prognostic function, n = 250/500), 200 replications each, comparing BCF, ps-BART,
    BART, BART(f0, f1), causal RF (grf default specification) and a linear model with horseshoe prior; results are in Tables 2-5 and Figure 6 and are not recorded. The smoking/medical-expenditure application
    (NMES, n = 6,798 after excluding individuals younger than 28 on overlap grounds) is not recorded as claims.'

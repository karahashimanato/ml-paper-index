  notes: 'Selected for the topic article requested by the user (2026-10-03): algorithm design techniques (divide and conquer, dynamic programming, branch and bound, local search) and machine learning; carded
    by a subagent. Results tables not recorded; claims only. PDF states: affiliations DeepMind (London), Charm Therapeutics, Google Research (Bangalore); work done at DeepMind. Metrics: average primal gap
    vs a precomputed best-known objective and survival curves with dataset-specific gap thresholds, both against ''calibrated time'' (a time measure on a shared heterogeneous cluster normalized by repeatedly
    solving MIPLIB2003 vpm2; reference machine Intel Xeon 3.50GHz). Expert guarantee conditions (Section 3.2): the expert finds the best assignment within a Hamming ball of radius eta_t around the current
    assignment (a neighbourhood of a specified number of unassigned integer variables), and the policy reaches that assignment only if the sub-MIP is solved optimally. Parallel setting: the number of parallel
    workers and the test-time inference hardware were not found in the text (searched ''cores'', ''workers'', ''CPU'', ''GPU''); training used one V100 GPU per dataset (Appendix A.2). Expert data: 10 local-branching
    steps per training instance using SCIP with default parameters and a 3-hour time limit per step (Appendix A.1). Training/test from the same dataset distribution (no cross-size generalization test).
    Evaluation: 50 LNS steps, sub-MIP time limit per step 60-300 s tuned on validation (Appendix A.3). Appendix A.7 (preliminary, limited tuning) on NeurIPS''21 ML4CO datasets: NNS gives no benefit over
    random neighbourhood selection on Anonymous, and NNS and RNS both fail to improve over Neural Diving on Load Balancing (''However, NNS and RNS both fail to provide any improvements over ND.''). The
    sub-MIP solve is optimal within its neighbourhood only if SCIP finishes; no global optimality certificate. Tag ''supervised'' used for imitation learning. Results not recorded.'

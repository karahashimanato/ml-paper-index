proposes:
- empirical study of length generalization in pretrained transformer LMs (LaMDA) on parity and Boolean variable assignment, comparing finetuning, few-shot prompting and scratchpad (chain-of-thought) and
  their combinations, with failure analyses (non-sequential shortcuts, distractor tokens)
claims:
- id: c1
  statement: 'Main claim (finetuning): naively finetuning transformers on length generalization tasks shows significant generalization deficiencies independent of model scale (Section 3.1: finetuned LaMDA
    models of 244m to 64b parameters, on parity and variable assignment).'
  location: Abstract
  page: 1
  quote: We ﬁrst establish that naively ﬁnetuning transformers on length generalization tasks shows signiﬁcant generalization deﬁciencies independent of model scale.
- id: c2
  statement: 'Main claim (prompting): combining pretrained LLMs'' in-context learning with scratchpad prompting (outputting solution steps before the answer) gives a dramatic improvement in length generalization
    (prompting experiments in Section 5 use the pretrained LaMDA 128b model without finetuning; parity phrased as coin flips, evaluated up to 20 flips).'
  location: Abstract
  page: 1
  quote: We then show that combining pretrained large language models’ in-context learning abilities with scratchpad prompting (asking the model to output solution steps before producing an answer) results
    in a dramatic improvement in length generalization.
- id: c3
  statement: 'Scope (tasks): the study focuses on two simple algorithmic tasks, parity and Boolean variable assignment, chosen because the model must track a state to extrapolate to longer lengths.'
  location: Introduction
  page: 2
  quote: In particular, we focus on two simple algorithmic tasks, parity and variable assignment, in which the model needs to keep track of a state in order to extrapolate to longer lengths (see Figure
    1).
- id: c4
  statement: 'Scope (models and lengths): four pretrained LaMDA decoder-only models (244m, 422m, 1b, 64b parameters) are finetuned on parity with training bitstrings of length 10 to 21 and evaluated on
    lengths 3 to 40; on chain-like variable assignment, training lengths are 3 to 8 and test lengths 3 to 19. Model scale is reported to have little effect on length generalization.'
  location: Scale doesn't improve length generalization
  page: 4
  quote: We ﬁnetuned four pretrained LaMDA models with 244m, 422m, 1b and 64b parameters on the parity task, where the training distribution included randomly sampled bitstrings of length 10 to 21.
- id: c5
  statement: 'Disagreement with prior work: finetuning with a scratchpad (step-by-step targets) also fails to generalize to longer problems, which the authors say contrasts with what previous work [3] (Nye
    et al., scratchpads) suggests; among positional encoding, distractors and end-of-sequence prediction, they conclude distractors are the main culprit.'
  location: Introduction (contributions)
  page: 2
  quote: We establish ﬁnetuning with scratchpad also fails to generalize to longer problems, in contrast to what is suggested by previous works [3].
- id: c6
  statement: 'Failure mode: transformers finetuned on sequential length generalization problems are biased toward non-sequential ''shortcut'' solutions that fail on longer instances (e.g. on parity with
    fixed length and varied number of ones, in-distribution accuracy was 100% while OOD was roughly random, suggesting counting-and-thresholding).'
  location: Transformers prefer parallel strategies over sequential ones
  page: 5
  quote: The results presented in Section 3.1 establish that, when presented with sequential length generalization problems, transformers are biased toward learning non-sequential “shortcut” solutions that
    fail at longer problem instances.
- id: c7
  statement: 'Evaluation practice: different finetuning hyperparameters had a large effect on length generalization while barely changing in-distribution performance, which the authors call surprising;
    in-distribution performance therefore did not indicate OOD length generalization in these finetuning experiments.'
  location: Introduction (contributions)
  page: 2
  quote: Surprisingly, different hyperparameter choices for ﬁnetuning have a large effect on length generalization performance, while having minimal effect on the ﬁnal in-distribution performance (Section
    3.3).

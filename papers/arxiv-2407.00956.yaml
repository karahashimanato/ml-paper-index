  reviewed: false
  notes: 'Selected for the method article requested by the user (2026-10-10): deep learning architectures for tabular data (TabNet, NODE and differentiable trees, TabTransformer/FT-Transformer-style attention,
    SAINT, embeddings for numerical features, retrieval (TabR), regularized MLPs, CTR-style interaction models, self-supervised pretraining, and surveys/benchmarks comparing them with GBDTs). Carded by
    a subagent. Results tables not recorded; claims only. Affiliation: Nanjing University (School of AI / National Key Laboratory for Novel Software Technology). No venue recorded: the arXiv record has
    no comment/journal_ref, and the v4 PDF (7 Nov 2025) uses a journal template with the placeholder ''Editor: My editor'', which is not a venue. Year is the first arXiv version (2024); this card is based
    on v4, which includes foundation models (TabPFN v2, TabICL) that earlier versions may not. Conflict of interest (not stated as such in the paper): the benchmark code is the authors'' TALENT repository
    (LAMDA-Tabular); evaluated methods include the authors'' own ModernNCA (Ye, Yin, Zhan and Chao, ICLR 2025), its BatchEnsemble variant MNCA-ens introduced for this analysis, and BETA (Liu and Ye, ICML
    2025); ModernNCA is also one of the four DNNs defining the Tree-DNN score (Equation 2) used to choose Talent-tiny datasets and for the gap analysis. PTaRL is by a different author (Hangting Ye et al.),
    not an overlapping author. The meta-feature selection (Section 6.2) uses validation curves of MLPs trained with default hyperparameters, and the correlation analyses are correlational. Section 7.1 reports
    on Talent-tiny that CV plus ensembling improves average ranks slightly but leaves the relative order of methods largely unchanged. A hyperparameter-budget study (Table 4, MLP with 50/100/150/200 trials)
    supports 100 trials as near-saturation for MLP. Section 5.1 also states that the Wilcoxon-Holm analysis shows no significant differences among the gradient boosting methods, that vanilla MLPs are generally
    weak while tuned MLP-PLR and RealMLP close the gap substantially, and that token-based models (FT-T, ExcelFormer, AutoInt) often cluster with ensembles in the same equivalence group. Per-dataset results
    and figures (critical-difference diagrams, radar chart, Tree-DNN score distribution) are not recorded.'

  notes: 'Approved from candidate issue #1 (2026-10-02); carded by a subagent. Results tables not recorded; claims only. Application domain: industrial fault detection (Scania APS truck failures; SECOM
    semiconductor manufacturing). Single-author study; the paper reports TabICLv2 needed far more task-side time than XGBoost on a 4 GiB laptop GPU. SECOM record-level AUPRC difference vs XGBoost had an
    interval crossing zero (described as suggestive, not definitive). The Limitations section states that TabICLv2 also used historical pretraining, so the runtime comparison is task-side rather than total-compute
    cost.'

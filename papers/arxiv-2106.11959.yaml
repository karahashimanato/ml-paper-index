id: arxiv-2106.11959
title: Revisiting Deep Learning Models for Tabular Data
authors:
- Yury Gorishniy
- Ivan Rubachev
- Valentin Khrulkov
- Artem Babenko
year: 2021
venue: NeurIPS 2021
links:
  arxiv: https://arxiv.org/abs/2106.11959
  code: https://github.com/yandex-research/tabular-dl-revisiting-models
source:
  version: arXiv v5
  retrieved_at: '2026-10-02'
  pdf_sha256: f2faa32ffd8c15ed8534677f978dc02730fdbe1f94e9c9557ada6aa19163478d
tags:
  tasks:
  - tabular-classification
  - tabular-regression
  method_families:
  - tabular-attention
  - tabular-mlp
  - differentiable-trees
  - gradient-boosted-trees
  paradigms:
  - supervised
proposes:
- FT-Transformer
- ResNet-like baseline for tabular data
claims:
- id: c1
  statement: None of the considered DL models consistently outperformed the simple ResNet-like baseline.
  location: Section 1
  page: 2
  quote: First, we reveal that none of the considered DL models can consistently outperform the ResNet-like model.
- id: c2
  statement: FT-Transformer (proposed) performed best among DL models on most tasks.
  location: Section 1
  page: 2
  quote: Second, FT-Transformer demonstrates the best performance on most tasks and becomes a new powerful solution for the field.
- id: c3
  statement: There is no universally superior solution among GBDT and deep models.
  location: Section 1
  page: 2
  quote: We reveal that there is still no universally superior solution among GBDT and deep models.
- id: c4
  statement: With tuned hyperparameters, GBDT ensembles dominated on California Housing, Adult and Yahoo.
  location: Section 4.5
  page: 8
  quote: Once hyperparameters are properly tuned, GBDTs start dominating on some datasets (California Housing, Adult, Yahoo; see Table 4).
- id: c5
  statement: Authors state that DL winning on most of their datasets reflects a benchmark slightly biased towards DL-friendly problems, not DL being better.
  location: Section 4.5
  page: 8
  quote: it only means that the constructed benchmark is slightly biased towards "DL-friendly" problems.
- id: c6
  statement: 'GBDT struggled on multiclass problems with many classes: poor on Helena (100 classes), untunable on ALOI (1000 classes) due to slow training.'
  location: Section 4.5
  page: 8
  quote: GBDT can demonstrate unsatisfactory performance (Helena) or even be untunable due to extremely slow training (ALOI).
- id: c7
  statement: Ensembles of default FT-Transformers performed roughly on par with ensembles of tuned FT-Transformers.
  location: Section 4.5
  page: 8
  quote: Interestingly, the ensemble of default FT-Transformers performs quite on par with the ensembles of tuned FT-Transformers.
- id: c8
  statement: Tuning made simple models (MLP, ResNet) competitive; authors recommend tuning baselines.
  location: Section 4.4
  page: 7
  quote: Tuning makes simple models such as MLP and ResNet competitive, so we recommend tuning baselines when possible.
- id: c9
  statement: FT-Transformer needs more hardware and time than ResNet and may not scale to very many features (attention is quadratic in the number of features).
  location: Section 3.3 Limitations
  page: 5
  quote: FT-Transformer requires more resources (both hardware and time) for training than simple models such as ResNet
- id: c10
  statement: NODE was inferior to ResNet on six of the eleven datasets despite being more complex.
  location: Section 4.4
  page: 7
  quote: However, it is still inferior to ResNet on six datasets (Helena, Jannis, Higgs, ALOI, Epsilon, Covertype), while being a more complex solution.
- id: c11
  statement: On synthetic targets interpolating between GBDT-friendly and DL-friendly functions, ResNet degraded as targets became GBDT-friendly while FT-Transformer stayed competitive.
  location: Section 5.1, Figure 3
  page: 9
  quote: By contrast, FT-Transformer yields competitive performance across the whole range of tasks.
- id: c12
  statement: FT-Transformer was not tuned on Yahoo (default configuration reported) and only heuristic default configurations were tried on Epsilon.
  location: Appendix E.2
  page: 18
  quote: For Yahoo, we did not perform tuning at all, since the default configuration already performed well.
- id: c13
  statement: Each tuned configuration was evaluated over 15 random seeds; ensembles are three disjoint groups of 5 models.
  location: Section 4.3
  page: 6
  quote: For each tuned configuration, we run 15 experiments with different random seeds and report the performance on the test set.
- id: c14
  statement: XGBoost used one-hot encoding for categorical features; CatBoost used its built-in categorical support.
  location: Section 4.3
  page: 6
  quote: For XGBoost, we use one-hot encoding.
- id: c15
  statement: Averaging [CLS] attention maps gave feature-importance rankings comparable to Integrated Gradients at much lower cost.
  location: Section 5.3
  page: 10
  quote: we conclude that the simple averaging of attention maps can be a good choice in terms of cost-effectiveness.
- id: c16
  statement: Dataset sizes (#objects) range from 20,640 (California Housing) to 1,200,192 (Microsoft); the 11 datasets include multiclass problems with 100 (Helena) and 1000 (ALOI) classes.
  location: Table 1
  page: 6
  quote: '#objects 20640 48842 65196 83733 98050 108000 500000 515345 581012 709877 1200192'
- id: c17
  statement: Most models were tuned with Optuna's TPE (Bayesian optimization); the rest used predefined configurations from their papers. The test set was never used for tuning.
  location: Section 4.3
  page: 6
  quote: we use the Optuna library (Akiba et al., 2019) to run Bayesian optimization (the Tree-Structured Parzen Estimator algorithm)

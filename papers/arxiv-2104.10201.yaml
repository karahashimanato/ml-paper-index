  notes: 'Selected for the method article requested by the user (2026-10-07): Bayesian optimization and hyperparameter optimization (GP-based BO, TPE, multi-fidelity methods, scalable BO, frameworks, benchmarks
    and comparisons with random search). Carded by a subagent. Results tables not recorded; claims only. Affiliations on the PDF: Twitter, Facebook, SigOpt (an Intel company), Valohai, 4Paradigm, ChaLearn.
    Venue not recorded: the PDF only thanks the ''NeurIPS 2020 competition track organizers'' and does not state a publication venue, and no comment/journal_ref was given. Conflict of interest: the reference
    list shows Turner and Eriksson among the authors of TuRBO [15] (the strongest baseline and used by 6 of the top-10 teams), Eriksson among the authors of pySOT [14], and Turner as author of Bayesmark
    [62], the scoring/execution package; McCourt is at SigOpt, an HPO-as-a-service company mentioned in the text. Section 4.5 says the prevalence of TuRBO ''may indicate'' a non-smooth landscape favouring
    local models, ''Or, it may indicate'' that TuRBO was simply the best baseline provided. Integer/categorical parameters could be treated as continuous; TPE was not used by any participant. A separate
    warm-start leaderboard (parameter names revealed; final testing otherwise used anonymized names) is in Section 4.7/Appendix A. Scope limits named in the Discussion: no multi-fidelity, synchronous batches
    of 8, unconstrained single-objective only. The ''RS efficiency'' factor (Table 2 caption) is the number of random-search evaluations needed to reach the same mean score divided by the 128 evaluations
    allowed, read off a random-search curve estimated by pooling N = 256 random-search runs per problem (Figure 1 caption). Appendix B: per-problem scores are clipped at the median score of a single random-search
    evaluation, and the mean rather than the median is used because medians can hide a high percentage of failed runs. Submissions were evaluated only a single time on the final problems to prevent overfitting
    (Competition Setup). A post-hoc bootstrap (B = 10^4) over the N = 100 reruns gave 90% certainty in the final top-5 (Section 4.1). Scores in Tables 2 and 4 not recorded.'

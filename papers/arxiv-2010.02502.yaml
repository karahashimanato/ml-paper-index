proposes:
- A family of non-Markovian forward (inference) processes, indexed by sigma, whose variational objectives share the DDPM surrogate objective, so a DDPM-trained noise-prediction network can be reused for
  all of them
- 'DDIM: the deterministic (sigma = 0) generative process of this family, an implicit model; sampling on a sub-sequence of the time steps gives shorter generative processes without retraining'
claims:
- id: c1
  statement: 'Contribution: DDIMs are iterative implicit probabilistic models with the same training procedure as DDPMs; DDPMs are generalized via non-Markovian diffusion processes that lead to the same
    training objective, and these can correspond to deterministic generative processes.'
  location: Abstract
  page: 1
  quote: To accelerate sampling, we present denoising diffusion implicit models (DDIMs), a more efﬁcient class of iterative implicit probabilistic models with the same training procedure as DDPMs.
- id: c2
  statement: 'No retraining: Theorem 1 states that for all sigma > 0 the variational objective J_sigma equals some weighted DDPM objective L_gamma up to a constant; if parameters are not shared across t,
    the optimum does not depend on the weights, so pretrained DDPM models can be used and only the generative process (sigma) is changed. The deterministic case sigma = 0 is not covered by Theorem 1 and
    is approximated by making sigma very small (footnote 5).'
  location: Sampling from generalized generative processes
  page: 4
  quote: Therefore, we can essentially use pretrained DDPM models as the solutions to the new objectives, and focus on ﬁnding a generative process that is better at producing samples subject to our needs
    by changing σ.
- id: c3
  statement: 'Fewer steps: because the denoising objective does not depend on the specific forward procedure as long as the marginals q_sigma(x_t|x_0) are fixed, forward processes defined on a sub-sequence
    tau of [1, ..., T] can be used, which accelerates the generative process without training a different model.'
  location: Accelerated generation processes
  page: 5
  quote: which accelerates the corresponding generative processes without having to train a different model.
- id: c4
  statement: 'Relation to ODEs: the DDIM iterate can be seen as an Euler method for an ODE; with the optimal model this ODE is equivalent to the probability flow ODE of the Variance-Exploding SDE of Song
    et al. (2020) (Proposition 1), but the sampling procedures differ (Euler steps in d sigma(t) vs in dt), which the authors say makes a difference with fewer sampling steps.'
  location: Relevance to neural ODEs
  page: 6
  quote: 'While the ODEs are equivalent, the sampling procedures are not, since the Euler method for the probability ﬂow ODE will make the following update:'
- id: c5
  statement: 'Evaluation setup: the same trained model (T = 1000, gamma = 1 objective) is used per dataset and only the sampling (tau, and sigma via eta) is changed; pretrained checkpoints from the original
    DDPM implementation are used for CIFAR10, LSUN Bedroom and Church, and the authors trained their own CelebA 64x64 model.'
  location: Appendix D.1
  page: 18
  quote: For CIFAR10, Bedroom and Church, we obtain the pretrained checkpoints from the original DDPM implementation; for CelebA, we trained our own model using the denoising objective L1.
- id: c6
  statement: 'Step-sub-sequence choice: tau is selected linearly or quadratically; quadratic was used for CIFAR10 and linear for the other datasets because these choices gave slightly better FID than the
    alternative on the respective dataset (i.e. the schedule was chosen by FID).'
  location: Appendix D.2
  page: 18
  quote: These choices achieve slightly better FID than their alternatives in the respective datasets.
- id: c7
  statement: 'Steps-vs-quality trade-off (CIFAR10 and CelebA FID, Table 1): quality improves as dim(tau) increases; DDIM (eta = 0) is best when dim(tau) is small, and DDPM (eta = 1 and sigma-hat) is typically
    worse at the same dim(tau), except for dim(tau) = 1000 with sigma-hat as reported by Ho et al. (2020), where DDIM is marginally worse; sigma-hat becomes much worse for small dim(tau).'
  location: Sample quality and efficiency
  page: 7
  quote: As expected, the sample quality becomes higher as we increase dim(τ), presenting a trade-off between sample quality and computational costs.
- id: c8
  statement: The authors state that DDIM reaches sample quality comparable to 1000-step models within 20 to 100 steps (a 10x to 50x speed-up over the original DDPM), and that sampling time scales linearly
    with trajectory length (Figure 4).
  location: Sample quality and efficiency
  page: 7
  quote: Notably, DDIM is able to produce samples with quality comparable to 1000 step models within 20 to 100 steps, which is a 10× to 50× speed up compared to the original DDPM.

  notes: 'Selected for the method article requested by the user (2026-10-10): knowledge distillation and pruning (soft targets and temperature, hint-based and self distillation, teacher-student gaps and
    fidelity; magnitude, gradual, single-shot, movement and LLM pruning, lottery tickets, and how pruning is evaluated). Carded by a subagent. Results tables not recorded; claims only. Affiliations: Universitat
    de Barcelona, Université de Montréal, École Polytechnique de Montréal, Centre de Visió per Computador. Venue from the PDF header (''Published as a conference paper at ICLR 2015''); year recorded as
    2015 (the venue year) although the first arXiv version is from 2014. Section numbers are from numbered headings in the PDF. The paper cites KD as ''Hinton & Dean, 2014'' (the workshop version of arxiv-1503.02531).
    Eq. (2) as written has no tau^2 factor on the soft-target term. Although Section 2.2 says the middle layers are chosen, the experiments use e.g. student layer 11 <- teacher layer 2 (CIFAR-10) and 4
    <- 2 (MNIST); Table 6 lists the hint pairs for the depth experiment. Other body-text numbers not recorded as claims: MNIST FitNet errors 1.9% (backprop), 0.65% (KD), 0.51% (hints) (Section 3.3); AFLW
    FitNet 1 4.58% (KD) vs 2.55% (HT) and FitNet 2 1.95% vs 1.85% (Section 3.4); FitNet 1 with 36x less capacity is about 10x faster with a 1.3% decrease (Section 4.2). Teachers are the maxout networks
    of Goodfellow et al. (2013b), on which Bengio is a co-author. Single runs; no variance reported.'

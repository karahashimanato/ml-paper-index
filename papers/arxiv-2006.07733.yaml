proposes:
- 'BYOL: an online network (encoder, projector, predictor) is trained to predict the projection of a different augmented view produced by a target network whose weights are an exponential moving average
  of the online weights, with a stop-gradient on the target and no negative pairs'
claims:
- id: c1
  statement: The BYOL objective admits collapsed solutions (e.g. the same output for every image); the authors show empirically that BYOL does not converge to them and hypothesize that the combination of
    the predictor and the slow-moving-average target network avoids collapse.
  location: Introduction
  page: 2
  quote: While this objective admits collapsed solutions, e.g., outputting the same vector for all images, we empirically show that BYOL does not converge to such solutions.
- id: c2
  statement: 'Status of the explanation: BYOL''s dynamics still admit undesirable equilibria; the authors did not observe convergence to them, and their argument that collapsed equilibria are unstable assumes
    an optimal predictor (and, for simplicity, no normalization or symmetrization).'
  location: Section 3.2
  page: 4
  quote: While BYOL’s dynamics still admit undesirable equilibria, we did not observe convergence to such equilibria in our experiments.
- id: c3
  statement: 'Hypothesis on the role of the moving-average target: to keep the predictor near-optimal during training; the authors say Section 5 and Appendix I give some empirical support for this interpretation.'
  location: Section 3.2
  page: 5
  quote: We hypothesize that the main role of BYOL’s moving-averaged target network is to ensure the near-optimality of the predictor over training; Section 5 and Appendix I provide some empirical support
    of this interpretation.
- id: c4
  statement: 'Ablation of the target decay rate (300-epoch runs, linear evaluation): updating the target instantaneously (tau = 0) destabilizes training, while never updating it (tau = 1) is stable but
    gives a low-quality representation; a trade-off exists between the two.'
  location: Section 5 (Bootstrapping)
  page: 8
  quote: Instantaneously updating the target network (τ = 0) destabilizes training, yielding very poor performance while never updating the target (τ = 1) makes the training stable but prevents iterative
    improvement, ending with low-quality ﬁnal representation.
- id: c5
  statement: 'Ablation between BYOL and SimCLR (Table 5b): without negative examples (beta = 0) the only variant that performs well is BYOL with both a target network and a predictor; adding negatives to
    BYOL without re-tuning the temperature hurts it.'
  location: Section 5 (Ablation to contrastive methods)
  page: 9
  quote: The only variant that performs well without negative examples (i.e., with β = 0) is BYOL, using both a bootstrap target network and a predictor.
- id: c6
  statement: Without a target network, collapse could be avoided by making the predictor near-optimal (an optimal linear predictor fitted on the batch, or a higher predictor learning rate); the authors
    say this seems to indicate that keeping the predictor near-optimal is important to prevent collapse, which may be one role of the target network.
  location: Section 5 (Importance of a near-optimal predictor)
  page: 10
  quote: This seems to indicate that keeping the predictor near-optimal at all times is important to preventing collapse, which may be one of the roles of BYOL’s target network.
- id: c7
  statement: 'Batch size (Figure 3a, 128 to 4096, 300 epochs): BYOL stays stable from 256 to 4096 and drops only for smaller values, which the authors attribute to batch normalization. To avoid re-tuning,
    smaller batches were emulated by averaging gradients over N steps, so only the batch-normalization statistics see the smaller batch.'
  location: Section 5 (Batch size)
  page: 8
  quote: In contrast, the performance of BYOL remains stable over a wide range of batch sizes from 256 to 4096, and only drops for smaller values due to batch normalization layers in the encoder.
- id: c8
  statement: 'Linear evaluation protocol on ImageNet: linear classifier on the frozen representation (no update of weights or batch statistics), SGD with Nesterov momentum for 80 epochs without regularization;
    the learning rate is chosen from 5 values on a local validation set of 10009 images held out from the ImageNet train set, and accuracy is reported on the public ILSVRC2012 validation set as test set.'
  location: Appendix C.1
  page: 17
  quote: We ﬁnally sweep over 5 learning rates {0.4, 0.3, 0.2, 0.1, 0.05} on a local validation set (10009 images from ImageNet train set), and report the accuracy of the best validation hyperparameter
    on the test set
- id: c9
  statement: 'Stated limitation: BYOL depends on augmentation sets specific to vision; other modalities would need similarly suitable augmentations, whose design may require significant effort and expertise.'
  location: Conclusion
  page: 10
  quote: Nevertheless, BYOL remains dependent on existing sets of augmentations that are speciﬁc to vision applications.

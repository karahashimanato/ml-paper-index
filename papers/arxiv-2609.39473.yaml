proposes:
- 'FAME: training-free false-memory evaluation for LLM agents via counterfactual queries and hidden-state ''concept drift'''
- Counterfactual templates for GSM-Symbolic, GitChameleon 2.0 and BigBench-Hard
claims:
- id: c1
  statement: FAME evaluates false memory in agents by tracking how internal beliefs change under counterfactual reasoning, without training.
  location: Abstract
  page: 1
  quote: Therefore, we propose FAME, a training-free framework that evaluates false memory through the evolution of agent beliefs under counterfactual reasoning.
- id: c2
  statement: 'Main claim: monitoring answers alone often fails to detect false memory, while FAME achieves high AUROC across the false-memory settings.'
  location: Abstract
  page: 1
  quote: Empirical experiments reveal that simply monitoring answers often fails to detect false memory, while FAME achieves AUROCs of 76.2% – 96.7% across false-memory settings
- id: c3
  statement: 'Ground truth: false-memory labels are derived from correct operations/answers (GSM), applied library syntax (GitChameleon) and final answers (BBH); they are used only for evaluation.'
  location: Appendix (Evaluation metric)
  page: 20
  quote: To construct the ground-truth labels, we leverage the arithmetic operations and final answers in GSM, the syntax of the applied functions or libraries in Git, and the final answers in BBH.
- id: c4
  statement: 'Decision rule: the authors state that in practice FAME only needs a threshold on the normalized projection of the concept drift, while the reported metric (AUROC) is threshold-free.'
  location: Appendix (Evaluation metric)
  page: 20
  quote: In practice, FAME requires no such ground-truth labels; thresholding the normalized projection of the concept drift onto the readout direction is sufficient for distinguishing faithful from false
    memories, as described in Alg. 1.
- id: c5
  statement: Realistic-benchmark baselines are representation/uncertainty signals (input similarity, surface layer, logit confidence, task and function vectors, EigenScore, ContextCite, entity-aware probe),
    not drift detectors.
  location: Real-World Evaluations
  page: 8
  quote: 'We compare FAME with the following baselines: Input similarity [50], Surface, Logit confidence, Task vector [40], Function vector [41], EigenScore from INSIDE [53], ContextCite [54], Entity-aware
    probe [25].'
- id: c6
  statement: 'Limitation: FAME requires access to the agent''s hidden states and to counterfactual queries.'
  location: Conclusion
  page: 9
  quote: Although promising, FAME requires access to agent hidden states and counterfactual queries.

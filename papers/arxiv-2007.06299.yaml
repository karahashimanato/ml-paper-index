  notes: 'Selected for the topic article requested by the user (2026-10-03): model fallback and model selection in MLOps (meta-learned selection, dynamic selection, abstention/deferral, switching triggers,
    cascades/routing, monitoring); carded by a subagent. Results tables not recorded; claims only. PDF states: Workshop on Challenges in Deploying and Monitoring Machine Learning Systems (ICML 2020). Position/overview
    paper: no experiments or quantitative evaluation of the described detectors. Searched the full text for rollback, roll back, fallback, fall back, canary, shadow, A/B, replace, revert, previous model,
    champion and challenger: none found, so the paper describes no rollback to a previous model and no switch to a fallback model at serving time. The stated actions on detection are taking action or raising
    alerts (Introduction, citing Diethe et al.), sending detector events to alerting or storage modules, informing retraining, and not using flagged predictions. A ''carbon copy of the model'' is mentioned
    only to serve explanation requests separately from production predictions (Section 3.2), not as a fallback. Other self-cited works: Vacanti & Van Looveren (2020), Van Looveren & Klaise (2019). Explanations
    are also described as a follow-up to outlier flags (to judge whether a flagged prediction can be trusted and acted on). The monitoring architecture is asynchronous (payload logging to a KNative broker),
    so detectors run alongside rather than in the request path.'

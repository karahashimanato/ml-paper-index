proposes:
- 'A policy-gradient (actor-critic style) RL method that learns a stochastic 2-opt improvement policy for Euclidean TSP: GCN + bidirectional LSTM encoders of the current and best-so-far tours, and a pointer-attention
  decoder that outputs the two node positions of a 2-opt move'
claims:
- id: c1
  statement: 'Contribution: the paper learns a local search (improvement) heuristic based on 2-opt operators via deep RL, in contrast to most learned TSP methods, which learn construction heuristics.'
  location: Abstract
  page: 1
  quote: In this work, we propose to learn a local search heuristic based on 2-opt operators via deep reinforcement learning.
- id: c2
  statement: 'How the move is learned: a policy gradient algorithm learns a stochastic policy selecting the 2-opt operation (a pair of node positions) given the current solution; the reward is the improvement
    of the best-found tour.'
  location: Abstract
  page: 1
  quote: We propose a policy gradient algorithm to learn a stochastic policy that selects 2-opt operations given a current solution.
- id: c3
  statement: 'Comparison with classical 2-opt: learned policies and 2-opt first-improvement / best-improvement heuristics (with and without random restarts) are run on 512 TSP100 instances from the same
    starting solutions with an equal step budget of 1,000 steps (steps, not wall-clock time, are matched).'
  location: Experimental Results and Analysis
  page: 11
  quote: We run all heuristics and learned policies on 512 TSP100 instances for a maximum of 1,000 steps starting from the same solutions.
- id: c4
  statement: 'Protocol: training instances are uniform random in the unit square (TSP20/50/100); test uses the 10,000-instance sets of Kool et al. and Joshi et al., with Concorde optima rerun to compute
    optimality gaps.'
  location: Experiments and Results
  page: 9
  quote: we use the same test dataset as reported in Kool et al. (2019); Joshi et al. (2019) containing 10,000 instances for each TSP size.
- id: c5
  statement: 'Evaluation practice: results for Wu et al. (2019) are copied from the original paper (no implementation was available) and are on a different test set generated by the same process; most baseline
    running times are also taken from earlier papers, and only Kool et al.''s method is rerun on the authors'' hardware.'
  location: Experiments and Results
  page: 9
  quote: Since at the time of submission no implementation is available, we report the optimality gaps reported in the original paper.
- id: c6
  statement: 'Generalization to TSPLIB: the TSP100-trained policy never sees instances over 100 nodes; on the extended set of 35 TSPLIB instances (supplement) with 2,000 sampling steps its average optimality
    gap is larger than OR-Tools'' (in the main text, on 10 instances, it beats OR-Tools on 5).'
  location: Generalization to Real-world TSP instances
  page: 14
  quote: On the 35 instances the gaps are 8.61% (ours) and 3.70% (OR-Tools).
- id: c7
  statement: 'Limitation: the policy gradient method needs a large number of samples to train a good policy.'
  location: Conclusions and Future Work
  page: 14
  quote: One drawback of our policy gradient method is the large number of samples required to train a good policy.

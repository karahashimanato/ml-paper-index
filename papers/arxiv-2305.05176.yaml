    Evaluated models are commercial APIs (OpenAI GPT-Curie/ChatGPT/GPT-3/GPT-4, AI21 J1 family, Cohere Xlarge, ForeFrontAI QA, Textsynth GPT-J/FAIRSEQ/GPT-Neox). The cascade calls several LLMs for one query
    (later routing papers RouteLLM and Hybrid LLM contrast themselves with this). Cost throughout is a dollar cost computed from the providers'' March 2023 list prices (Table 1), not a share of calls to
    the strongest model. Numeric discrepancies within the paper: the abstract says accuracy gain up to 4% at the same cost while the Figure 5 caption says ''up to 5%''; the text says Table 3 cost savings
    ''range from 50% to 98%'' while Table 3 lists 98.3%, 73.3% and 59.2%. The paper also reports a diversity measure (maximum performance improvement, MPI) between API pairs. Generalization to unseen query
    distributions or new APIs was not evaluated (random train/test split only).'

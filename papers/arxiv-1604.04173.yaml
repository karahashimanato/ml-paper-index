    none; other papers cite it as JASA 2018, which is not confirmed by this PDF. Remark 2.7: an unbalanced split (rho > 0.5) may be beneficial for complex regression procedures, but the paper uses rho =
    0.5 and does not pursue the choice. The jackknife (leave-one-out residuals) can give shorter intervals but has no finite-sample out-of-sample guarantee. Section 5.2 also notes that under homoskedastic
    noise the locally-weighted band will generally have inflated average length due to estimating the MAD. Interval-length accuracy results (Section 3) require stability or consistency assumptions (A0-A2
    etc.), unlike coverage. Ridge tuning parameter lambda = 10 was used for all methods in Table 3. Section numbers confirmed by cross-references in the text (Section 2, 2.2, 3, 4, 5.2). Numerical tables
    not recorded.'
